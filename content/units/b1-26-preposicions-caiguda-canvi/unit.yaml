id: b1-26
level: B1
title: "Preposicions: caiguda i canvi"
summary: "Aprens que la preposició *de* cau davant de *que* (*m'alegro que vinguis*), es manté davant d'infinitiu (*m'alegro de veure't*) i que *en* i *amb* canvien a *a* (*insisteix a pagar*)."
vocabulary_theme: "Oci, aficions i esport"
points:
  - id: caiguda-de-que
    title: "Cau la *de* davant de *que*"
    refs:
      - label: "GEIEC: Les preposicions"
        url: "https://geiec.iec.cat"
  - id: de-amb-infinitiu
    title: "La *de* es manté davant d'infinitiu"
    refs:
      - label: "GEIEC: Les preposicions"
        url: "https://geiec.iec.cat"
  - id: canvi-a-infinitiu
    title: "*En* i *amb* canvien a *a* davant d'infinitiu"
    refs:
      - label: "GEIEC: Les preposicions"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *de que* no existeix"
  - id: expressions
    title: "Expressions del temps lliure"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: *que* sense *de*"
  - title: "Practicar *que* i *de*"
  - title: "*A* + infinitiu i interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "l'afició"
    definition: "Activitat que fas per plaer en el temps lliure."
    example: "La seva gran afició és el futbol."
  - word: "el temps lliure"
    definition: "Hores del dia que no treballes ni estudies."
    example: "Al temps lliure m'agrada nedar."
  - word: "el partit"
    definition: "Enfrontament esportiu entre dos equips o dos jugadors."
    example: "El partit de diumenge és a les dotze."
  - word: "l'equip"
    definition: "Grup de jugadors que competeixen junts."
    example: "El nostre equip ha guanyat la lliga."
  - word: "l'entrenament"
    definition: "Sessió de preparació d'un esport."
    example: "L'entrenament és dimarts i dijous."
  - word: "l'entrenador, l'entrenadora"
    definition: "Persona que prepara un equip o un esportista."
    example: "L'entrenadora nova ha canviat els exercicis."
  - word: "el rival"
    definition: "Equip o jugador contra qui competeixes."
    example: "El rival de dissabte és molt fort."
  - word: "el gol"
    definition: "Punt que es marca a futbol i a altres esports."
    example: "En Pau ha marcat dos gols."
  - word: "la pilota"
    definition: "Bola amb què es juga a molts esports."
    example: "Han perdut la pilota al riu."
  - word: "la raqueta"
    definition: "Estri per jugar a tenis o a pàdel."
    example: "M'he comprat una raqueta nova."
  - word: "el marcador"
    definition: "Tauler on es veu el resultat d'un partit."
    example: "El marcador era de dos a zero."
  - word: "l'empat"
    definition: "Resultat igual entre dos equips o jugadors."
    example: "L'empat a dos ens deixa segons."
  - word: "la victòria"
    definition: "Triomf en un partit o una competició."
    example: "La victòria ens dona la lliga."
  - word: "el campionat"
    definition: "Competició esportiva amb diversos equips."
    example: "El campionat comença a l'octubre."
  - word: "la lliga"
    definition: "Competició on tots els equips juguen entre ells."
    example: "Juguen a la lliga del barri."
  - word: "el torneig"
    definition: "Competició curta, sovint d'un cap de setmana."
    example: "El torneig de tenis és al juny."
  - word: "l'aficionat, l'aficionada"
    definition: "Persona que segueix un esport amb passió."
    example: "Els aficionats omplen la graderia."
  - word: "la graderia"
    definition: "Grades on seu el públic en un camp."
    example: "A la graderia no hi cabia ningú més."
  - word: "l'escalfament"
    definition: "Exercicis suaus abans de fer esport."
    example: "L'escalfament dura deu minuts."
  - word: "la lesió"
    definition: "Mal físic per un cop o un esforç."
    example: "Té una lesió al genoll."
  - word: "el genoll"
    definition: "Articulació del mig de la cama."
    example: "Li fa mal el genoll dret."
  - word: "entrenar-se"
    definition: "Preparar-se físicament per a un esport."
    example: "S'entrena tres cops per setmana."
  - word: "marcar"
    definition: "Aconseguir un gol o un punt."
    example: "Va marcar al darrer minut."
  - word: "el pàdel"
    definition: "Esport de raqueta que es juga en una pista tancada."
    example: "Juga a pàdel cada dissabte."
  - word: "l'excursió"
    definition: "Sortida a la muntanya o al camp."
    example: "Diumenge fem una excursió al Montseny."
  - word: "la piscina"
    definition: "Lloc amb aigua per nedar."
    example: "La piscina obre a les set del matí."
  - word: "nedar"
    definition: "Moure's per l'aigua sense enfonsar-se."
    example: "Neda crol cada matí."
  - word: "el crol"
    definition: "Estil de natació ràpid, amb els braços."
    example: "El crol cansa molt al principi."
  - word: "córrer"
    definition: "Anar de pressa a peu."
    example: "Corre deu quilòmetres cada dia."
  - word: "la cursa"
    definition: "Competició de córrer o de bicicletes."
    example: "La cursa de diumenge és de deu quilòmetres."
  - word: "el gimnàs"
    definition: "Local per fer exercici i musculació."
    example: "El gimnàs tanca a les deu."
  - word: "el club"
    definition: "Entitat esportiva d'un barri o una ciutat."
    example: "El club busca jugadors nous."
  - word: "la quota"
    definition: "Diners que els socis paguen al club."
    example: "La quota és de vint euros al mes."
  - word: "l'entrada"
    definition: "Paper que permet accedir a un espectacle."
    example: "Les entrades del concert són cares."
  - word: "la muntanya"
    definition: "Terreny alt amb cims i camins."
    example: "Es va perdre a la muntanya."
  - word: "el vestidor"
    definition: "Sala on els esportistes es canvien de roba."
    example: "Els vestidors nous són molt grans."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-26-001
    type: choice
    point: caiguda-de-que
    lesson: 1
    prompt: "M'alegro ___ hagis pogut venir a l'excursió del Montseny."
    answer: "que"
    distractors:
      - text: "de que"
        why: "*De que* és un calc del castellà «de que». En català: *m'alegro que*."
      - text: "de"
        why: "*De* va amb un infinitiu (*m'alegro de venir*), no amb un verb conjugat com «hagis»."
    explanation: "«Hagis pogut» és un verb conjugat: *m'alegro* perd la *de* davant de *que*."

  - id: b1-26-002
    type: choice
    point: caiguda-de-que
    lesson: 1
    prompt: "Tinc ganes ___ vingueu tots al torneig de primavera."
    answer: "que"
    distractors:
      - text: "de que"
        why: "*De que* no existeix en català estàndard: és un calc. Davant de *que* no hi ha cap preposició."
      - text: "de"
        why: "*De* va amb un infinitiu (*tinc ganes de venir*), no amb un verb conjugat com «vingueu»."
    explanation: "«Vingueu» és un verb conjugat: *tenir ganes* perd la *de* davant de *que*."

  - id: b1-26-003
    type: choice
    point: caiguda-de-que
    lesson: 1
    prompt: "Estic segur ___ arribarem a temps al concert."
    answer: "que"
    distractors:
      - text: "de que"
        why: "*De que* és un calc del castellà «de que». En català: *estic segur que*."
      - text: "de"
        why: "*De* va amb un infinitiu (*estic segur de venir*), no amb un verb conjugat com «arribarem»."
    explanation: "«Arribarem» és un verb conjugat: *estar segur* perd la *de* davant de *que*."

  - id: b1-26-004
    type: choice
    point: caiguda-de-que
    lesson: 1
    prompt: "Quina frase és correcta?"
    answer: "Té por que perdi l'autobús de les vuit."
    distractors:
      - text: "Té por de que perdi l'autobús de les vuit."
        why: "*De que* és un calc del castellà «de que». En català: *té por que*."
      - text: "Té por de perdi l'autobús de les vuit."
        why: "*De* va amb un infinitiu (*té por de perdre*), no amb un verb conjugat com «perdi»."
    explanation: "«Perdi» és un verb conjugat: *tenir por* perd la *de* davant de *que*."

  - id: b1-26-005
    type: choice
    point: de-amb-infinitiu
    lesson: 1
    prompt: "M'alegro ___ veure't tan contenta amb l'equip nou."
    answer: "de"
    distractors:
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *m'alegro de veure't*."
      - text: "a"
        why: "*Alegrar-se* porta *de*, no *a*: *m'alegro de veure't*."
    explanation: "«Veure't» és un infinitiu: *m'alegro* manté la preposició *de*."

  - id: b1-26-006
    type: choice
    point: de-amb-infinitiu
    lesson: 1
    prompt: "Té ganes ___ jugar a tenis aquesta tarda amb la Núria."
    answer: "de"
    distractors:
      - text: "a"
        why: "*Tenir ganes* porta *de*, no *a*: *té ganes de jugar*."
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *té ganes de jugar*."
    explanation: "«Jugar» és un infinitiu: *tenir ganes* manté la *de*."

  - id: b1-26-007
    type: choice
    point: de-amb-infinitiu
    lesson: 1
    prompt: "Estan cansats ___ perdre cada cap de setmana."
    answer: "de"
    distractors:
      - text: "a"
        why: "*Estar cansat* porta *de* davant d'infinitiu, no *a*: *estan cansats de perdre*."
      - text: "en"
        why: "*Estar cansat* porta *de* davant d'infinitiu, no *en*: *estan cansats de perdre*."
    explanation: "«Perdre» és un infinitiu: *estar cansat* manté la *de*."

  - id: b1-26-008
    type: match
    point: caiguda-de-que
    lesson: 1
    instruction: "Relaciona cada principi amb la continuació."
    pairs:
      - ["M'alegro que tu", "puguis venir a l'excursió."]
      - ["Està segura que nosaltres", "arribarem a temps al concert."]
      - ["Té por que el partit", "se suspengui per la pluja."]
      - ["Estan contents que jo", "torni a jugar amb ells."]
    explanation: "El verb concorda amb el subjecte: *tu puguis*, *nosaltres arribarem*, *el partit se suspengui*, *jo torni*. I davant de *que* no hi ha cap preposició."

  - id: b1-26-009
    type: inline-choice
    point: caiguda-de-que
    lesson: 1
    title: "Missatge a l'equip"
    text: "Hola a tothom! M'alegro {que|de que|de} siguem tants al grup. Estic segur {que|de que|de} farem un bon torneig. La Núria està contenta {que|de que|de} l'Ibrahim torni a jugar. Ens veurem dissabte!"
    explanation: "«Siguem», «farem» i «torni» són verbs conjugats: darrere de *m'alegro*, *estic segur* i *està contenta*, la *de* cau i queda *que*."

  - id: b1-26-010
    type: inline-choice
    point: de-amb-infinitiu
    lesson: 1
    title: "Nota del club"
    text: "Tothom té ganes {de|que|a} jugar la final. En Pau està cansat {d'|que |a }esperar el seu torn. La Carla s'alegra {de|que|a} tornar a entrenar. Tracteu {d'|que |a }arribar d'hora!"
    explanation: "«Jugar», «esperar», «tornar» i «arribar» són infinitius: *tenir ganes*, *estar cansat*, *alegrar-se* i *tractar de* mantenen la *de*."

  - id: b1-26-011
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["tenir ganes de", "Tens molta il·lusió per jugar la final."]
      - ["fer el ronso", "Fas veure que no ho has sentit per no parar taula."]
      - ["fer-ne cinc cèntims", "Expliques el partit en quatre paraules."]
      - ["suar la cansalada", "Sues de valent per guanyar el partit."]
    explanation: "Cada expressió descriu una situació: la il·lusió (*tenir ganes de*), el desentès (*fer el ronso*), el resum (*fer-ne cinc cèntims*) i l'esforç (*suar la cansalada*)."

  - id: b1-26-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «fer el ronso»?"
    answer: "Fer-se el desentès per no fer una cosa."
    distractors:
      - text: "Explicar una cosa en poques paraules."
        why: "Això és *fer-ne cinc cèntims*."
      - text: "Esforçar-se molt fent esport."
        why: "Això és *suar la cansalada*."
    explanation: "*Fer el ronso* vol dir fer-se el desentès: fer veure que no s'ha sentit per no fer una cosa."

  - id: b1-26-013
    type: choice
    point: de-amb-infinitiu
    lesson: 1
    prompt: "Es queixa ___ jugar pocs minuts cada partit."
    answer: "de"
    distractors:
      - text: "a"
        why: "*Queixar-se* porta *a* amb la persona (*es queixa a l'àrbitre*), no amb un infinitiu: *es queixa de jugar*."
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *es queixa de jugar*."
    explanation: "«Jugar» és un infinitiu: *queixar-se* manté la *de*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-26-014
    type: fill
    point: caiguda-de-que
    lesson: 2
    prompt: "M'alegro ___ hagis tornat a jugar amb nosaltres."
    hint: "conjunció"
    answers: ["que"]
    wrong_answers:
      - text: "de que"
        why: "*De que* és un calc del castellà «de que». En català: *m'alegro que*."
    grading: tolerant
    explanation: "«Hagis tornat» és un verb conjugat: *m'alegro* perd la *de* davant de *que*."

  - id: b1-26-015
    type: fill
    point: caiguda-de-que
    lesson: 2
    prompt: "Estic segur ___ guanyarem el partit de diumenge."
    hint: "conjunció"
    answers: ["que"]
    wrong_answers:
      - text: "de que"
        why: "*De que* no existeix en català estàndard: és un calc. Davant de *que* no hi ha cap preposició."
    grading: tolerant
    explanation: "«Guanyarem» és un verb conjugat: *estar segur* perd la *de* davant de *que*."

  - id: b1-26-016
    type: fill
    point: caiguda-de-que
    lesson: 2
    prompt: "Té por ___ es faci una lesió al genoll."
    hint: "conjunció"
    answers: ["que"]
    wrong_answers:
      - text: "de que"
        why: "*De que* és un calc del castellà «de que». En català: *té por que*."
    grading: tolerant
    explanation: "«Es faci» és un verb conjugat: *tenir por* perd la *de* davant de *que*."

  - id: b1-26-017
    type: fill
    point: de-amb-infinitiu
    lesson: 2
    prompt: "Tinc ganes ___ córrer la cursa de diumenge amb en Pau."
    hint: "preposició"
    answers: ["de"]
    wrong_answers:
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *tinc ganes de córrer*."
      - text: "a"
        why: "*Tenir ganes* porta *de*, no *a*: *tinc ganes de córrer*."
    grading: tolerant
    explanation: "«Córrer» és un infinitiu: *tenir ganes* manté la *de*."

  - id: b1-26-018
    type: fill
    point: de-amb-infinitiu
    lesson: 2
    prompt: "S'alegra ___ nedar cada matí a la piscina del barri."
    hint: "preposició"
    answers: ["de"]
    wrong_answers:
      - text: "a"
        why: "*Alegrar-se* porta *de*, no *a*: *s'alegra de nedar*."
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *s'alegra de nedar*."
    grading: tolerant
    explanation: "«Nedar» és un infinitiu: *alegrar-se* manté la *de*."

  - id: b1-26-019
    type: fill
    point: de-amb-infinitiu
    lesson: 2
    prompt: "Estic cansada ___ fer sempre d'àrbitre als partits."
    hint: "preposició"
    answers: ["de"]
    wrong_answers:
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *estic cansada de fer*."
      - text: "en"
        why: "*Estar cansat* porta *de* davant d'infinitiu: *estic cansada de fer*."
    grading: tolerant
    explanation: "«Fer» és un infinitiu: *estar cansat* manté la *de*."

  - id: b1-26-020
    type: choice
    point: caiguda-de-que
    lesson: 2
    prompt: "Es queixa ___ l'entrenador no el deixa jugar."
    answer: "que"
    distractors:
      - text: "de que"
        why: "*De que* és un calc del castellà «de que». En català: *es queixa que*."
      - text: "de"
        why: "*De* va amb un infinitiu (*es queixa de jugar*), no amb un verb conjugat com «deixa»."
    explanation: "«Deixa» és un verb conjugat: *queixar-se* perd la *de* davant de *que*."

  - id: b1-26-021
    type: choice
    point: caiguda-de-que
    lesson: 2
    prompt: "Està orgullosa ___ la seva filla jugui a bàsquet."
    answer: "que"
    distractors:
      - text: "de que"
        why: "*De que* no existeix en català estàndard: és un calc. Davant de *que* no hi ha cap preposició."
      - text: "de"
        why: "*De* va amb un nom o un infinitiu (*està orgullosa de la filla*), no amb un verb conjugat com «jugui»."
    explanation: "«Jugui» és un verb conjugat: *estar orgullós* perd la *de* davant de *que*."

  - id: b1-26-022
    type: choice
    point: de-amb-infinitiu
    lesson: 2
    prompt: "Tracta ___ venir a tots els entrenaments."
    answer: "de"
    distractors:
      - text: "a"
        why: "*Tractar* porta *de* davant d'infinitiu, no *a*: *tracta de venir*."
      - text: "que"
        why: "*Que* introdueix un verb conjugat, no un infinitiu: *tracta de venir*."
    explanation: "*Tractar de* + infinitiu vol dir intentar: *tracta de venir*."

  - id: b1-26-023
    type: choice
    point: caiguda-de-que
    lesson: 2
    prompt: "Soc conscient ___ ha d'entrenar més per jugar."
    answer: "que"
    distractors:
      - text: "de que"
        why: "*De que* és un calc del castellà «de que». En català: *soc conscient que*."
      - text: "de"
        why: "*De* va amb un nom o un infinitiu (*soc conscient del problema*), no amb un verb conjugat com «ha»."
    explanation: "«Ha d'entrenar» és un verb conjugat: *ser conscient* perd la *de* davant de *que*."

  - id: b1-26-024
    type: order
    point: caiguda-de-que
    lesson: 2
    cue: "Digues que estàs segur que guanyareu el torneig."
    chunks: ["estic", "segur", "que", "guanyarem", "el", "torneig"]
    extra: ["de"]
    answers:
      - "Estic segur que guanyarem el torneig."
    explanation: "«Guanyarem» és un verb conjugat: *estar segur* perd la *de* davant de *que*."

  - id: b1-26-025
    type: order
    point: de-amb-infinitiu
    lesson: 2
    cue: "Digues que tens ganes de jugar el partit."
    chunks: ["tinc", "ganes", "de", "jugar", "el", "partit"]
    extra: ["que"]
    answers:
      - "Tinc ganes de jugar el partit."
    explanation: "«Jugar» és un infinitiu: *tenir ganes* manté la *de*."

  - id: b1-26-026
    type: order
    point: de-amb-infinitiu
    lesson: 2
    cue: "En Pau té por de perdre's a la muntanya. Digues-ho."
    chunks: ["en", "Pau", "té", "por", "de", "perdre's", "a", "la", "muntanya"]
    extra: ["que"]
    answers:
      - "En Pau té por de perdre's a la muntanya."
    explanation: "«Perdre's» és un infinitiu: *tenir por* manté la *de*. *Que* només va amb un verb conjugat."

  # ---------------- Lliçó 3 ----------------
  - id: b1-26-027
    type: choice
    point: canvi-a-infinitiu
    lesson: 3
    prompt: "Quina frase és correcta?"
    answer: "Insisteix a pagar el sopar de tot l'equip."
    distractors:
      - text: "Insisteix de pagar el sopar de tot l'equip."
        why: "*Insistir* no porta mai *de*: amb un nom porta *en* i amb un infinitiu, *a*."
      - text: "Insisteix pagar el sopar de tot l'equip."
        why: "*Insistir* necessita una preposició: *insisteix a pagar*."
    explanation: "*Insistir* porta *en* amb un nom (*insisteix en la idea*), però *a* amb un infinitiu: *insisteix a pagar*."

  - id: b1-26-028
    type: choice
    point: canvi-a-infinitiu
    lesson: 3
    prompt: "Vam quedar ___ jugar a pàdel dissabte al matí."
    answer: "a"
    distractors:
      - text: "en"
        why: "Davant d'infinitiu, *en* canvia a *a*: *quedar a* + infinitiu."
      - text: "amb"
        why: "*Amb* va amb la persona (*vam quedar amb la Núria*), no amb un infinitiu: *vam quedar a jugar*."
    explanation: "*Quedar* porta *amb* amb una persona, però *a* amb un infinitiu: *vam quedar a jugar*."

  - id: b1-26-029
    type: choice
    point: canvi-a-infinitiu
    lesson: 3
    prompt: "Insisteix ___ la seva idea de fer dos equips."
    answer: "en"
    distractors:
      - text: "de"
        why: "*Insistir* no porta *de*: amb un nom porta *en*: *insisteix en la idea*."
      - text: "per"
        why: "*Per* indicaria finalitat o causa; aquí *insistir* porta *en*: *insisteix en la idea*."
    explanation: "«La seva idea» és un nom: *insistir* porta *en*."

  - id: b1-26-030
    type: choice
    point: canvi-a-infinitiu
    lesson: 3
    prompt: "Hem quedat ___ la Carla per anar al gimnàs."
    answer: "amb"
