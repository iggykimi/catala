  - id: b1-26-065
    type: reading
    point: comprensio
    lesson: 5
    title: "Un club de barri"
    text: |
      La Laia dedica el temps lliure a la seva gran afició: el futbol. Juga al club del barri, un equip modest que competeix al campionat de la ciutat. L'equip està content que l'entrenadora nova, la Montse, hagi canviat els entrenaments: ara comencen amb deu minuts d'escalfament i acaben amb partits curts.

      Diumenge passat van jugar contra el rival més fort de la lliga. La Laia té por de fer-se una lesió al genoll, però va jugar tot el partit. Al descans perdien per dos a zero. L'entrenadora estava segura que podien empatar i els va demanar que no deixessin de córrer. A la segona part van marcar dos gols i el marcador va acabar amb un empat a dos.

      A la graderia, els aficionats no van parar d'animar. Després del partit, tothom tenia ganes de celebrar-ho i van quedar a sopar tots junts. Als vestidors, la Laia va dir que estava cansada, però contenta: no han perdut cap partit des del gener.
    questions:
      - prompt: "Què fan ara a l'inici de l'entrenament?"
        answer: "Escalfar deu minuts abans de jugar."
        distractors:
          - text: "Jugar partits curts."
            why: "Els partits curts són al final de l'entrenament."
          - text: "Animar l'equip des de la graderia."
            why: "Qui anima des de la graderia són els aficionats."
      - prompt: "Com va acabar el partit de diumenge?"
        answer: "Amb un empat a dos gols."
        distractors:
          - text: "Perdent per dos a zero."
            why: "Per dos a zero anaven al descans, no al final."
          - text: "Guanyant per dos gols."
            why: "Van marcar dos gols a la segona part, però només van empatar."
      - prompt: "Què va fer l'equip després del partit?"
        answer: "Va organitzar un sopar de tot l'equip."
        distractors:
          - text: "Va celebrar la victòria al camp."
            why: "No van guanyar: van empatar."
          - text: "Va tornar als vestidors a entrenar."
            why: "Als vestidors no hi entrenen: la Laia només diu que està cansada."
      - prompt: "Què li preocupa a la Laia quan juga?"
        answer: "Fer-se mal al genoll."
        distractors:
          - text: "Cansar-se de córrer."
            why: "Córrer no li fa por: l'entrenadora els demana que no deixin de córrer."
          - text: "Jugar tot el partit."
            why: "Va jugar tot el partit sense problemes."
    explanation: "La Laia juga al club del barri: diumenge van empatar a dos i després van anar a sopar."
