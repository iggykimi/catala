lessons:
  - title: "Presentació: la hac i la erra"
  - title: "Practicar la hac i la erra"
  - title: "La ema i la ena, i la hac del castellà"
  - title: "L'ela geminada i els grups -ject-"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'escenari"
    definition: "Lloc del teatre on actuen els artistes."
    example: "Els músics ja esperen a l'escenari."
  - word: "l'estrena"
    definition: "Primera funció d'una obra davant del públic."
    example: "L'estrena és divendres i ja no queden entrades."
  - word: "la funció"
    definition: "Cadascuna de les representacions d'un espectacle."
    example: "La funció de diumenge és a les sis."
  - word: "l'espectador, l'espectadora"
    definition: "Persona que mira un espectacle."
    example: "Els espectadors van aplaudir dempeus."
  - word: "l'aplaudiment"
    definition: "Soroll de picar de mans per felicitar els artistes."
    example: "Es va sentir un aplaudiment molt llarg."
  - word: "l'entrada"
    definition: "Paper o codi que permet veure un espectacle."
    example: "He comprat dues entrades per dissabte."
  - word: "la platea"
    definition: "Part baixa del teatre, davant de l'escenari."
    example: "Seiem a la tercera fila de la platea."
  - word: "l'assaig"
    definition: "Prova d'una obra abans de l'estrena."
    example: "L'assaig general és dijous a la tarda."
  - word: "el director, la directora d'escena"
    definition: "Persona que dirigeix una obra de teatre."
    example: "La directora d'escena ens va felicitar."
  - word: "el guió"
    definition: "Text d'una obra, d'un film o d'un programa."
    example: "L'actor encara no se sap el guió de memòria."
  - word: "el paper"
    definition: "Personatge que fa un actor en una obra."
    example: "La Núria fa el paper de la mare."
  - word: "el repartiment"
    definition: "Conjunt d'actors d'una obra o d'un film."
    example: "El repartiment té quatre actors joves."
  - word: "el vestuari"
    definition: "Conjunt de vestits d'una obra."
    example: "El vestuari de l'òpera és espectacular."
  - word: "el decorat"
    definition: "Allò que representa el lloc on passa l'acció."
    example: "Van canviar el decorat a l'entreacte."
  - word: "l'entreacte"
    definition: "Pausa al mig d'un espectacle."
    example: "A l'entreacte vam sortir a prendre alguna cosa."
  - word: "la il·luminació"
    definition: "Conjunt de llums d'un escenari."
    example: "La il·luminació de l'última escena és preciosa."
  - word: "l'exposició"
    definition: "Conjunt d'obres que es mostren al públic."
    example: "L'exposició del MACBA obre al març."
  - word: "la galeria"
    definition: "Sala on s'exposen i es venen obres d'art."
    example: "Té una galeria petita al barri de Gràcia."
  - word: "el quadre"
    definition: "Pintura feta sobre tela o fusta."
    example: "Van robar un quadre molt valuós del museu."
  - word: "l'escultura"
    definition: "Obra d'art feta en volum, de pedra o de metall."
    example: "Al parc hi ha una escultura de bronze."
  - word: "la projecció"
    definition: "Acció de projectar un film davant del públic."
    example: "La projecció comença a les vuit."
  - word: "el concert"
    definition: "Espectacle de música en directe."
    example: "El concert de dissabte va omplir el Palau."
  - word: "el cor"
    definition: "Grup de persones que canten juntes."
    example: "Canta en un cor de gòspel des de fa anys."
  - word: "l'orquestra"
    definition: "Conjunt gran de músics amb instruments diversos."
    example: "L'orquestra va afinar abans de començar."
  - word: "el festival"
    definition: "Conjunt d'espectacles durant uns dies seguits."
    example: "Cada estiu anem a un festival de jazz."
  - word: "el premi"
    definition: "Reconeixement que es dona a un artista."
    example: "L'actriu va guanyar el premi a Sitges."
  - word: "la taquilla"
    definition: "Lloc on es venen les entrades."
    example: "A la taquilla ja no hi quedava res."
  - word: "la crítica"
    definition: "Article que valora una obra o un espectacle."
    example: "La crítica ha lloat l'últim disc."
  - word: "la companyia"
    definition: "Grup estable d'actors o de ballarins."
    example: "Una companyia italiana porta un espectacle nou."
  - word: "el projecte"
    definition: "Pla d'una obra o d'una activitat futura."
    example: "Tenen un projecte de teatre al carrer."
  - word: "l'homenatge"
    definition: "Acte per honorar una persona."
    example: "Li van fer un homenatge pels quaranta anys d'ofici."
  - word: "l'harmònica"
    definition: "Instrument petit de vent que es toca amb la boca."
    example: "Tocava l'harmònica als carrers de Gràcia."
  - word: "la trajectòria"
    definition: "Conjunt de treballs d'un artista al llarg del temps."
    example: "La seva trajectòria inclou deu discos."
  - word: "la coreografia"
    definition: "Art de crear una dansa; conjunt de passos."
    example: "La coreografia del final és molt difícil."
  - word: "la balada"
    definition: "Cançó lenta i sentimental."
    example: "Va tancar el concert amb una balada."
  - word: "el ballet"
    definition: "Dansa clàssica que es representa en un escenari."
    example: "Fan un ballet rus al Liceu."
  - word: "la novel·la"
    definition: "Narració llarga en prosa."
    example: "Han portat la novel·la al cinema."
  - word: "la pel·lícula"
    definition: "Obra de cinema."
    example: "La pel·lícula dura dues hores llargues."
  - word: "emmarcar"
    definition: "Posar un marc a un quadre o a una foto."
    example: "Hem fet emmarcar el cartell de l'exposició."
  - word: "commoure"
    definition: "Provocar una emoció forta."
    example: "El final de l'obra ens va commoure a tots."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-46-001
    type: choice
    point: lletra-h
    lesson: 1
    prompt: "Quin mot s'escriu amb haca?"
    answer: "hivern"
    distractors:
      - text: "orxata"
        why: "*Orxata* s'escriu sense haca."
      - text: "ou"
        why: "*Ou* s'escriu sense haca."
    explanation: "*Hivern* porta haca inicial. *Orxata* i *ou*, no."

  - id: b2-46-002
    type: choice
    point: lletra-h
    lesson: 1
    prompt: "Li van fer un ___ pels vint anys de teatre."
    answer: "homenatge"
    distractors:
      - text: "omenatge"
        why: "*Homenatge* s'escriu amb haca inicial."
      - text: "homenatje"
        why: "El final és *-tge*, amb *g*: *homenatge*."
    explanation: "Un acte per honorar algú és un *homenatge*, amb haca inicial."

  - id: b2-46-003
    type: choice
    point: erra-doble
    lesson: 1
    prompt: "Quin mot s'escriu amb dues erres?"
    answer: "guitarra"
    distractors:
      - text: "coreografia"
        why: "*Coreografia* sona suau entre vocals: una erra."
      - text: "escenari"
        why: "*Escenari* sona suau entre vocals: una erra."
    explanation: "*Guitarra* sona fort entre vocals: dues erres. *Coreografia* i *escenari* sonen suaus."

  - id: b2-46-004
    type: choice
    point: erra-doble
    lesson: 1
    prompt: "El concert de ___ va durar dues hores."
    answer: "guitarra"
    distractors:
      - text: "guitara"
        why: "Sona fort entre vocals: dues erres, *guitarra*."
      - text: "guittarra"
        why: "Només calen dues erres: *guitarra*."
    explanation: "L'instrument de sis cordes és la *guitarra*, amb dues erres."

  - id: b2-46-005
    type: match
    point: lletra-h
    lesson: 1
    instruction: "Relaciona cada frase amb el mot que hi falta."
    pairs:
      - ["___ vam anar a l'exposició del MACBA.", "ahir"]
      - ["A l'___ el museu tanca a les sis.", "hivern"]
      - ["Li van fer un ___ molt emotiu.", "homenatge"]
      - ["Van tocar l'___ del festival.", "himne"]
      - ["Al museu està ___ fer fotos amb flaix.", "prohibit"]
    explanation: "*Ahir*, *hivern*, *homenatge*, *himne* i *prohibit* s'escriuen amb haca."

  - id: b2-46-006
    type: inline-choice
    point: lletra-h
    lesson: 1
    title: "Concert d'hivern"
    text: "Aquest {h|∅}ivern l'orquestra fa un {h|∅}omenatge al seu fundador. A{h|∅}ir vam assajar l'{h|∅}imne del festival."
    explanation: "*Hivern*, *homenatge* i *himne* porten haca inicial. *Ahir* porta haca intercalada."

  - id: b2-46-007
    type: inline-choice
    point: erra-doble
    lesson: 1
    title: "Nit de concert"
    text: "El concert va començar amb un solo de guita{rr|r}a. Després, un trio de música ba{rr|r}oca va rebre un aplaudiment llarg. L'est{r|rr}ena de la temporada serà al Palau, i el {r|rr}itme del final farà ballar tothom."
    explanation: "*Guitarra* i *barroca* sonen fort entre vocals: dues erres. *Estrena* (darrere de *t*) i *ritme* (a principi de mot) sonen fort amb una erra."

  - id: b2-46-008
    type: fill
    point: lletra-h
    lesson: 1
    prompt: "___ vam anar a l'exposició del MACBA."
    hint: "el dia abans d'avui"
    answers: ["Ahir"]
    wrong_answers:
      - text: "Air"
        why: "*Ahir* s'escriu amb haca."
    grading: strict
    explanation: "El dia abans d'avui és *ahir*, amb haca intercalada."

  - id: b2-46-009
    type: fill
    point: lletra-h
    lesson: 1
    prompt: "Al museu està ___ fer fotos amb flaix."
    hint: "PROHIBIR, participi"
    answers: ["prohibit"]
    wrong_answers:
      - text: "proibit"
        why: "*Prohibir* s'escriu amb haca: *prohibit*."
    grading: strict
    explanation: "El participi de *prohibir* és *prohibit*, amb haca."

  - id: b2-46-010
    type: fill
    point: erra-doble
    lesson: 1
    prompt: "El grup de ___ va tocar dues hores."
    hint: "instrument de sis cordes, en plural"
    answers: ["guitarres"]
    wrong_answers:
      - text: "guitares"
        why: "*Guitarra* s'escriu amb dues erres: *guitarres*."
    grading: strict
    explanation: "L'instrument de sis cordes és la *guitarra*, amb dues erres."

  - id: b2-46-011
    type: order
    point: lletra-h
    lesson: 1
    cue: "Anuncia el mes de l'exhibició."
    chunks: ["L'exhibició", "serà", "al", "maig"]
    extra: ["exibició"]
    answers:
      - "L'exhibició serà al maig."
      - "Al maig serà l'exhibició."
    explanation: "*Exhibició* s'escriu amb haca. El complement de temps pot anar al final o al principi."

  - id: b2-46-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «fer el paper»?"
    answer: "Interpretar un personatge en una obra."
    distractors:
      - text: "Escriure el guió d'una obra."
        why: "Això és crear el text, no interpretar un personatge."
      - text: "Llegir el text en veu alta."
        why: "Això és una lectura, no interpretar un personatge."
    explanation: "*Fer el paper* vol dir interpretar un personatge en una obra."

  - id: b2-46-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "La Laia interpreta la protagonista. Què diem?"
    answer: "Fa el paper de la protagonista."
    distractors:
      - text: "Fa el papel de la protagonista."
        why: "«Papel» és castellà; en català, *paper*."
      - text: "Diu el paper de la protagonista."
        why: "El verb de l'expressió és *fer*: *fa el paper*."
    explanation: "Interpretar la protagonista és *fer el paper de la protagonista*."

  # ---------- Lliçó 2 ----------
  - id: b2-46-014
    type: fill
    point: lletra-h
    lesson: 2
    prompt: "L'___ de dansa africana de diumenge va ser un èxit."
    hint: "el nom de *exhibir*"
    answers: ["exhibició"]
    wrong_answers:
      - text: "exibició"
        why: "*Exhibició* s'escriu amb haca."
    grading: strict
    explanation: "El nom de *exhibir* és *exhibició*, amb haca."

  - id: b2-46-015
    type: fill
    point: compte-h-castella
    lesson: 2
    prompt: "El final del concert va ser ple d'___."
    hint: "combinació agradable de sons"
    answers: ["harmonia"]
    wrong_answers:
      - text: "armonia"
        why: "Sense haca és la forma castellana («armonía», amb accent). En català: *harmonia*."
    grading: strict
    explanation: "La combinació agradable de sons és *harmonia*, amb haca inicial, al revés que en castellà."

  - id: b2-46-016
    type: fill
    point: erra-doble
    lesson: 2
    prompt: "El concert de música ___ va omplir l'església."
    hint: "estil del segle XVII; concorda amb «música»"
    answers: ["barroca"]
    wrong_answers:
      - text: "baroca"
        why: "*Barroc* s'escriu amb dues erres: *barroca*."
    grading: strict
    explanation: "L'estil del segle XVII és el *barroc*: *barroca*, amb dues erres."

  - id: b2-46-017
    type: fill
    point: erra-doble
    lesson: 2
    prompt: "Ahir vam veure una pel·lícula de ___."
    hint: "gènere de por"
    answers: ["terror"]
    wrong_answers:
      - text: "teror"
        why: "*Terror* s'escriu amb dues erres."
    grading: strict
    explanation: "El gènere de por és el *terror*, amb dues erres."

  - id: b2-46-018
    type: choice
    point: lletra-h
    lesson: 2
    prompt: "Van fer un acte ___ i emotiu."
    answer: "coherent"
    distractors:
      - text: "coerent"
        why: "*Coherent* s'escriu amb haca."
      - text: "coerente"
        why: "És la forma castellana «coherente». En català acaba en *-ent*: *coherent*."
    explanation: "«Un acte coherent» vol dir un acte amb sentit: *coherent*, amb haca."

  - id: b2-46-019
    type: choice
    point: erra-doble
    lesson: 2
    prompt: "Canta en un ___ de gòspel des de fa anys."
    answer: "cor"
    distractors:
      - text: "corr"
        why: "*Cor* s'escriu amb una sola erra."
      - text: "coro"
        why: "«Coro» és castellà; en català, *cor*."
    explanation: "Un grup que canta és un *cor*, amb una sola erra."

  - id: b2-46-020
    type: order
    point: erra-doble
    lesson: 2
    cue: "Digues que la Carla toca la guitarra al concert."
    chunks: ["La Carla", "toca", "la guitarra", "al", "concert"]
    extra: ["guitara"]
    answers:
      - "La Carla toca la guitarra al concert."
      - "Al concert, la Carla toca la guitarra."
    explanation: "*Guitarra* s'escriu amb dues erres. El complement (*al concert*) pot anar al final o al principi."

  - id: b2-46-021
    type: choice
    point: erra-doble
    lesson: 2
    prompt: "A l'___ vam sortir a prendre alguna cosa."
    answer: "entreacte"
    distractors:
      - text: "enterracte"
        why: "Darrere de consonant (*t*) s'escriu una erra: *entreacte*."
      - text: "enteracte"
        why: "El mot és *entre-* + *acte*: *entreacte*."
    explanation: "La pausa al mig d'un espectacle és *entreacte*: *entre-* + *acte*, amb una erra darrere de *t*."

  - id: b2-46-022
    type: choice
    point: lletra-h
    lesson: 2
    prompt: "Van llogar un ___ per portar el decorat."
    answer: "vehicle"
    distractors:
      - text: "vecicle"
        why: "*Vehicle* s'escriu amb haca."
      - text: "vehiculo"
        why: "«Vehiculo» és castellà; en català, *vehicle*."
    explanation: "Per portar el decorat cal un *vehicle*, amb haca."

  - id: b2-46-023
    type: choice
    point: erra-doble
    lesson: 2
    prompt: "Van ___ fins al teatre perquè feien tard."
    answer: "córrer"
    distractors:
      - text: "correr"
        why: "*Córrer* s'escriu amb dues erres."
      - text: "corre"
        why: "Després de *van* (passat perifràstic) cal l'infinitiu: *córrer*."
    explanation: "Anar de pressa a peu és *córrer*, amb dues erres."

  - id: b2-46-024
    type: choice
    point: erra-doble
    lesson: 2
    prompt: "Vam veure una ___ de teatre molt divertida."
    answer: "obra"
    distractors:
      - text: "obrra"
        why: "Darrere de consonant (*b*), el so fort s'escriu amb una erra: *obra*."
      - text: "orba"
        why: "L'ordre de les lletres és *o-b-r-a*: *obra*."
    explanation: "Una peça de teatre és una *obra*: darrere de *b*, una erra."

  - id: b2-46-025
    type: order
    point: erra-doble
    lesson: 2
    cue: "Digues que el barroc sona molt bé en aquest teatre."
    chunks: ["El barroc", "sona", "molt bé", "en aquest teatre"]
    extra: ["barroco"]
    answers:
      - "El barroc sona molt bé en aquest teatre."
      - "En aquest teatre, el barroc sona molt bé."
    explanation: "*Barroc* s'escriu amb dues erres. El complement de lloc pot anar al final o al principi."

  - id: b2-46-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «ser el centre d'atenció»?"
    answer: "Rebre totes les mirades."
    distractors:
      - text: "Seure al mig de la platea."
        why: "Això és la posició física, no el sentit de l'expressió."
      - text: "Ser el protagonista de l'obra."
        why: "Pots ser el centre d'atenció sense ser el protagonista: és qui rep les mirades."
    explanation: "*Ser el centre d'atenció* vol dir rebre totes les mirades."

  # ---------- Lliçó 3 ----------
  - id: b2-46-027
    type: choice
    point: ema-ena
    lesson: 3
    prompt: "La ___ de dansa arriba demà de Lisboa."
    answer: "companyia"
    distractors:
      - text: "conpanyia"
        why: "Davant de *p* s'escriu *m*: *companyia*."
      - text: "compañía"
        why: "«Compañía» és castellà. En català, amb *ny*, sense accent i amb *m*: *companyia*."
    explanation: "El grup de dansa és la *companyia*: davant de *p*, *m*."

  - id: b2-46-028
    type: choice
    point: ema-ena
    lesson: 3
    prompt: "Va sonar una ___ a l'última fila."
    answer: "trompeta"
    distractors:
      - text: "tronpeta"
        why: "Davant de *p* s'escriu *m*: *trompeta*."
      - text: "tromppeta"
        why: "No cal doblar la pe: *trompeta*."
    explanation: "L'instrument de metall és la *trompeta*: davant de *p*, *m*."

  - id: b2-46-029
    type: choice
    point: ema-ena
    lesson: 3
    prompt: "He rebut la ___ per a l'estrena de demà."
    answer: "invitació"
    distractors:
      - text: "imvitació"
        why: "Davant de *v* s'escriu *n*: *invitació*."
      - text: "inbitació"
        why: "El so és de *v*, no de *b*: *invitació*."
    explanation: "El paper per entrar-hi és la *invitació*: davant de *v*, *n*."

  - id: b2-46-030
    type: fill
    point: ema-ena
    lesson: 3
    prompt: "El solo de trompeta va ser una ___ total."
    hint: "IMPROVISAR, nom d'acció"
    answers: ["improvisació"]
    wrong_answers:
      - text: "inprovisació"
        why: "Davant de *p* s'escriu *m*: *improvisació*."
    grading: strict
    explanation: "El nom de *improvisar* és *improvisació*: davant de *p*, *m*."

  - id: b2-46-031
    type: fill
    point: ema-ena
    lesson: 3
    prompt: "El ___ de vestuari va durar deu minuts."
    hint: "modificació"
    answers: ["canvi"]
    wrong_answers:
      - text: "camvi"
        why: "Davant de *v* s'escriu *n*: *canvi*."
    grading: strict
    explanation: "Canviar-se de roba a l'escena és un *canvi* de vestuari: davant de *v*, *n*."

