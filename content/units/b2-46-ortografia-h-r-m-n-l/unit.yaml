  # ---------- Lliçó 5 ----------
  - id: b2-46-053
    type: reading
    point: comprensio
    lesson: 5
    title: "La companyia del barri"
    text: |
      La Laia dirigeix una companyia de teatre de Gràcia des de fa deu anys. Van començar amb una obra petita en un bar i ara omplen un teatre de dos-cents espectadors cada cap de setmana. El vestuari el fan a mà amb roba de segona mà. La temporada passada van rebre el premi de la crítica pel seu projecte de teatre al carrer.

      Aquest hivern preparen un homenatge llarg i emotiu a una actriu del barri amb una trajectòria de quaranta anys als escenaris. El programa inclou la projecció d'un documental sobre la seva vida, un concert de guitarra i harmònica en directe i la lectura d'una novel·la. Una hora abans de la funció obrirà una exhibició de vestuari antic.

      La directora d'escena vol que tot sigui perfecte. Ahir van fer l'assaig general: la il·luminació va fallar dues vegades i el canvi d'escena va durar deu minuts. El guitarrista va arribar tard perquè venia d'un altre concert a Hospitalet. El repartiment estava nerviós, però la Laia diu que el públic de l'estrena no ho notarà. «El teatre és com la vida: sempre hi ha un entreacte per respirar», explica rient.

      Les entrades es van exhaurir en només dos dies. A l'entreacte, la cantina vendrà orxata i cafè. La companyia ha demanat a l'Ajuntament una sala més gran, però de moment faran dues funcions cada dissabte. La crítica ja ha lloat la coreografia del final. «Volem que el barri sencer vingui a l'homenatge», diu la Laia. «Ella ens ha commogut moltes vegades; ara ens toca a nosaltres.»
    questions:
      - prompt: "Com va començar la companyia de la Laia?"
        answer: "Representant una obra modesta en un bar."
        distractors:
          - text: "Amb un projecte de teatre al carrer."
            why: "El teatre al carrer és el projecte premiat de la temporada passada."
          - text: "Amb un documental sobre una actriu."
            why: "El documental és sobre l'actriu de l'homenatge d'ara."
      - prompt: "Què passarà una hora abans de la funció?"
        answer: "El públic podrà veure el vestuari antic abans d'entrar."
        distractors:
          - text: "Es projectarà el documental sobre l'actriu."
            why: "La projecció és part de l'homenatge, no de l'hora anterior."
          - text: "Es farà l'assaig general de l'obra."
            why: "L'assaig general ja s'ha fet: va ser ahir."
      - prompt: "Quin problema hi va haver a l'assaig general?"
        answer: "Va fallar la llum i el canvi d'escena va durar massa."
        distractors:
          - text: "El repartiment no coneixia l'obra."
            why: "El repartiment estava nerviós, però el text no diu que no conegués l'obra."
          - text: "El guitarrista no va venir a l'assaig."
            why: "Sí que hi va anar, però va arribar tard."
      - prompt: "Per què faran dues funcions cada dissabte?"
        answer: "Perquè les entrades es van exhaurir i la sala és petita."
        distractors:
          - text: "Perquè l'Ajuntament els ha cedit una sala gran."
            why: "Han demanat una sala més gran, però encara no la tenen."
          - text: "Perquè volen assajar més abans de l'estrena."
            why: "L'assaig ja s'ha fet; les funcions són per al públic."
    explanation: "El text explica com una companyia de Gràcia prepara un homenatge a una actriu del barri."

