id: b2-46
level: B2
title: "Ortografia: h, r/rr, m/n i l/ll/l·l"
summary: "La hac inicial i intercalada, la erra doble, la ema i la ena davant de consonant, la ela geminada i els grups -ject- i -jecc-, en el món de les arts i els espectacles."
vocabulary_theme: "Arts i espectacles"
