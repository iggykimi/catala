  - id: lletra-h
    title: "La hac inicial i intercalada"
    refs:
      - label: "GEIEC: Ortografia"
        url: "https://geiec.iec.cat"
  - id: erra-doble
    title: "Erra suau i erra forta: r i rr"
    refs:
      - label: "GEIEC: Ortografia"
        url: "https://geiec.iec.cat"
  - id: ema-ena
    title: "La ema i la ena davant de consonant"
    refs:
      - label: "GEIEC: Ortografia"
        url: "https://geiec.iec.cat"
  - id: ela-geminada
    title: "Ela, ela doble i ela geminada"
    refs:
      - label: "GEIEC: Ortografia"
        url: "https://geiec.iec.cat"
  - id: grups-ject
    title: "Els grups -ject- i -jecc-"
    refs:
      - label: "GEIEC: Ortografia"
