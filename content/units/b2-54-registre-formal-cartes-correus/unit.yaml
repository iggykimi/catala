  # ---------- Lliçó 5 ----------
  - id: b2-54-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una reclamació a la companyia elèctrica"
    text: |
      Assumpte: càrrec incorrecte a la factura de setembre

      Benvolguts senyors:

      Em dic Núria Vidal i soc la titular del contracte 881402 de la vostra companyia elèctrica des del 2019. El motiu d'aquest correu és un càrrec incorrecte a la factura del mes de setembre.

      En referència a l'expedient 2026-04521, que vaig obrir per telèfon fa set dies, us explico els fets. El dia 12 de setembre vaig rebre la factura de la llum amb un import de 184,60 €, quan el meu consum habitual és d'uns 60 € al mes. Vaig comprovar la lectura del comptador i no coincideix amb la que surt a la factura: el comptador marca 12.410 kWh i a la factura hi consta 14.205 kWh. La tarifa que tinc contractada no ha canviat aquest any, així que l'error només pot ser de la lectura. A més, el mateix import se m'ha carregat dues vegades al compte corrent, malgrat que tinc la domiciliació al dia i no tinc cap deute pendent. El banc també m'ha cobrat una comissió de 12 € per un rebut que va tornar per falta de saldo. Vaig trucar al servei d'atenció al client el dia 15 i em van dir que revisarien la factura, però encara no he rebut cap resposta.

      Us adjunto una còpia de la factura, l'extracte del compte on es veuen els dos càrrecs i una fotografia del comptador amb la data d'avui. Com a consumidora, us demano que anul·lin el càrrec duplicat, que em facin la devolució de l'import cobrat de més i que corregeixin la lectura del comptador. També us demano que assumeixin la comissió que m'ha cobrat el banc. A més, us agrairia que m'enviessin el resguard de la devolució com més aviat millor.

      No vull donar-me de baixa del subministrament ni canviar de proveïdor: només demano que es corregeixi l'error. Per a qualsevol aclariment, em poden trucar al 612 44 78 90. Us agrairia una resposta en el termini de deu dies. Resto a l'espera de la vostra resposta.

      Atentament,
      Núria Vidal
      Barcelona, 3 d'octubre de 2026
    questions:
      - prompt: "Per què escriu la Núria a la companyia?"
        answer: "Per un càrrec duplicat i una lectura del comptador que no quadra."
        distractors:
          - text: "Per donar-se de baixa del subministrament i canviar de proveïdor."
            why: "Diu clarament que no vol donar-se de baixa ni canviar de proveïdor."
          - text: "Perquè vol canviar la tarifa que té contractada."
            why: "La tarifa no ha canviat; el problema és la lectura i el càrrec duplicat."
      - prompt: "Quins documents adjunta al correu?"
        answer: "La factura, l'extracte del compte i una foto del comptador."
        distractors:
          - text: "El contracte de la llum i l'extracte del compte."
            why: "L'extracte sí que l'adjunta, però el contracte no."
          - text: "El resguard d'una devolució anterior."
            why: "Demana el resguard de la devolució, no l'adjunta."
      - prompt: "Què demana la Núria a la companyia?"
        answer: "Que anul·lin el càrrec, que li tornin els diners i que paguin la comissió."
        distractors:
          - text: "Que li enviïn una factura nova amb una tarifa més baixa."
            why: "No demana cap canvi de tarifa, sinó corregir l'error."
          - text: "Que li donin de baixa el subministrament a final de mes."
            why: "No vol donar-se de baixa; vol que es corregeixi l'error."
      - prompt: "Quin termini dona la Núria per rebre una resposta?"
        answer: "Deu dies."
        distractors:
          - text: "Set dies."
            why: "Fa set dies que va obrir l'expedient; no és el termini de resposta."
          - text: "Un mes."
            why: "El consum habitual és d'uns 60 € al mes; el termini són deu dies."
    explanation: "La Núria reclama un càrrec duplicat i una lectura errònia, adjunta proves i demana la devolució."

