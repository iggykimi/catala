id: b2-54
level: B2
title: "Registre formal: cartes, correus i sol·licituds"
summary: "El tractament de vostè i vostès, les fórmules d'obertura i tancament i l'estructura de reclamacions i sol·licituds, en el context del consum i els subministraments."
vocabulary_theme: "Consum, reclamacions, subministraments i banc"
points:
  - id: tractament-voste
    title: "El tractament de vostè i vostès"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: formules-formals
    title: "Fórmules d'obertura i tancament"
  - id: reclamacions-sollicituds
    title: "Reclamacions i sol·licituds"
  - id: compte-formules-calcades
    title: "Compte amb el castellà: fórmules calcades"
    refs:
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions del consumidor"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Tractament de vostè i salutacions"
  - title: "El cos de la carta"
  - title: "Reclamacions i calcs del castellà"
  - title: "Escriure en registre formal"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la reclamació"
    definition: "Queixa formal i per escrit a una empresa o a l'administració."
    example: "Va presentar una reclamació per un càrrec duplicat."
  - word: "el consumidor, la consumidora"
    definition: "Persona que compra un producte o fa servir un servei."
    example: "Com a consumidora, tens dret a reclamar."
  - word: "el proveïdor"
    definition: "Empresa que subministra un producte o un servei."
    example: "El nostre proveïdor de llum ha apujat la tarifa."
  - word: "el subministrament"
    definition: "Servei continu de llum, aigua o gas a una casa."
    example: "Van tallar el subministrament per impagament."
  - word: "la factura"
    definition: "Document que detalla què has de pagar per un servei."
    example: "La factura de setembre porta un càrrec de més."
  - word: "el rebut"
    definition: "Paper que demostra que has pagat una cosa."
    example: "Guarda el rebut fins que arribi la devolució."
  - word: "el càrrec"
    definition: "Import que una empresa et cobra al compte del banc."
    example: "M'han fet el mateix càrrec dues vegades."
  - word: "el compte corrent"
    definition: "Compte del banc on es cobren i es paguen els rebuts."
    example: "El rebut es carrega al compte corrent el dia 5."
  - word: "la domiciliació"
    definition: "Ordre al banc de pagar els rebuts automàticament."
    example: "Tinc la domiciliació de la llum i del gas."
  - word: "el titular"
    definition: "Persona a nom de qui està un contracte o un compte."
    example: "La Núria és la titular del contracte."
  - word: "la sol·licitud"
    definition: "Petició formal i per escrit a una empresa o a l'administració."
    example: "La vostra sol·licitud s'ha acceptat."
  - word: "el formulari"
    definition: "Full amb caselles per omplir amb les teves dades."
    example: "Cal omplir el formulari de la pàgina web."
  - word: "l'expedient"
    definition: "Conjunt de papers d'un assumpte obert a l'administració."
    example: "La reclamació té l'expedient 2026-04521."
  - word: "el termini"
    definition: "Temps màxim per fer una cosa."
    example: "Us agrairia una resposta en el termini de deu dies."
  - word: "el resguard"
    definition: "Paper que demostra que has fet un pagament o un tràmit."
    example: "Demana el resguard de la devolució."
  - word: "la devolució"
    definition: "Tornada d'uns diners cobrats de més o per error."
    example: "Sol·licito la devolució de l'import duplicat."
  - word: "el servei d'atenció al client"
    definition: "Telèfon o oficina que resol dubtes i queixes dels clients."
    example: "Vaig trucar al servei d'atenció al client."
  - word: "el comptador"
    definition: "Aparell que mesura el consum de llum, aigua o gas."
    example: "La lectura del comptador no coincideix amb la factura."
  - word: "la tarifa"
    definition: "Preu fixat per un servei, com la llum o el telèfon."
    example: "La tarifa que tinc contractada no ha canviat."
  - word: "el consum"
    definition: "Quantitat de llum, aigua o gas que gasta una casa."
    example: "El meu consum habitual és d'uns 60 € al mes."
  - word: "la companyia elèctrica"
    definition: "Empresa que ven i subministra l'electricitat."
    example: "Soc clienta de la vostra companyia elèctrica des del 2019."
  - word: "el deute"
    definition: "Diners que es deuen a algú."
    example: "No tinc cap deute pendent amb la companyia."
  - word: "el pagament"
    definition: "Acció de pagar una cosa."
    example: "Us envio el resguard del pagament."
  - word: "l'extracte"
    definition: "Document del banc amb els moviments del compte."
    example: "A l'extracte es veuen els dos càrrecs."
  - word: "la comissió"
    definition: "Import que el banc cobra per un servei o un tràmit."
    example: "El banc m'ha cobrat una comissió de 12 €."
  - word: "el document adjunt"
    definition: "Fitxer o paper que s'envia amb una carta o un correu."
    example: "El rebut va com a document adjunt del correu."
  - word: "el certificat"
    definition: "Paper oficial que acredita una cosa."
    example: "Us escric per demanar un certificat del compte."
  - word: "l'assumpte"
    definition: "Tema d'un correu, escrit a la capçalera."
    example: "A l'assumpte hi posa: càrrec incorrecte."
  - word: "el motiu"
    definition: "Raó per la qual es fa una cosa."
    example: "El motiu d'aquest correu és la factura de gener."
  - word: "la baixa"
    definition: "Fet de deixar un servei contractat. També és el permís de la feina per malaltia."
    example: "La baixa del gas triga uns deu dies."
  - word: "l'alta"
    definition: "Fet de contractar un servei o de fer-se'n client."
    example: "Es va donar d'alta de la fibra per internet."
  - word: "el banc"
    definition: "Entitat on tens el compte i que cobra els rebuts."
    example: "El banc m'ha cobrat una comissió."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-54-001
    type: choice
    point: tractament-voste
    lesson: 1
    prompt: "Benvolgut senyor Roca: si ___ cap dubte, truqui'ns."
    answer: "té"
    distractors:
      - text: "tens"
        why: "*Tens* és tractament de *tu*; amb *vostè* el verb va en tercera persona: *té*."
      - text: "tenim"
        why: "*Tenim* és de *nosaltres*; el subjecte aquí és *vostè*: *té*."
    explanation: "Amb el tractament de *vostè* el verb va en tercera persona del singular: *té*. «Truqui'ns» ja marca el registre formal."

  - id: b2-54-002
    type: choice
    point: tractament-voste
    lesson: 1
    prompt: "Benvolguts senyors: si ___ cap dubte, truquin-nos."
    answer: "tenen"
    distractors:
      - text: "teniu"
        why: "Amb *vostès* el verb no va en segona persona: va en tercera persona del plural, *tenen*."
      - text: "tens"
        why: "*Tens* és de *tu*: singular i informal. El destinatari és plural i formal: *tenen*."
    explanation: "Amb el tractament de *vostès* el verb va en tercera persona del plural: *si tenen cap dubte*."

  - id: b2-54-003
    type: choice
    point: formules-formals
    lesson: 1
    prompt: "Quina salutació és adequada per a una reclamació a una companyia que no coneixes?"
    answer: "Benvolguts senyors,"
    distractors:
      - text: "Hola!"
        why: "«Hola» és una salutació col·loquial; una reclamació demana registre formal."
      - text: "Estimat amic,"
        why: "«Estimat» és per a persones que coneixes; a una companyia desconeguda: *Benvolguts senyors*."
    explanation: "A un destinatari desconegut s'escriu *Benvolgut/da* + *senyor/senyora/senyors*. «Estimat» implica proximitat."

  - id: b2-54-004
    type: choice
    point: formules-formals
    lesson: 1
    prompt: "___ senyora Puig: em dic Núria Vidal i soc clienta de la vostra entitat."
    answer: "Benvolguda"
    distractors:
      - text: "Benvolgut"
        why: "«Senyora» és femení: la salutació hi concorda, *Benvolguda*."
      - text: "Benvolgudes"
        why: "El plural no concorda amb «senyora Puig», que és singular: *Benvolguda*."
    explanation: "La salutació concorda amb el destinatari: *Benvolguda senyora Puig* (femení singular)."

  - id: b2-54-005
    type: choice
    point: formules-formals
    lesson: 1
    prompt: "Com es tanca una carta formal en català?"
    answer: "Atentament,"
    distractors:
      - text: "Atentamente,"
        why: "«Atentamente» és castellà; en català, *Atentament*."
      - text: "Saludos,"
        why: "«Saludos» és castellà; en català, *Atentament* o *Salutacions cordials*."
    explanation: "El comiat formal és *Atentament* (o *Salutacions cordials*)."

  - id: b2-54-006
    type: choice
    point: tractament-voste
    lesson: 1
    prompt: "Vostè ___ dret a presentar una reclamació en qualsevol moment."
    answer: "té"
    distractors:
      - text: "tens"
        why: "*Tens* és de *tu*; el subjecte aquí és *vostè*: *té*."
      - text: "tenen"
        why: "*Tenen* és plural; el subjecte és *vostè* (singular): *té*."
    explanation: "El subjecte és *vostè*: verb en tercera persona del singular, *té*."

  - id: b2-54-007
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «donar-se de baixa» d'un servei?"
    answer: "Deixar de ser client d'una companyia o d'un servei."
    distractors:
      - text: "Demanar la baixa per malaltia a la feina."
        why: "Això és la baixa de la feina. *Donar-se de baixa* d'un servei és deixar de ser-ne client."
      - text: "Contractar un servei nou amb una companyia."
        why: "Això és *donar-se d'alta*, just el contrari."
    explanation: "«Donar-se de baixa» és deixar un servei; no té res a veure amb la baixa per malaltia."

  - id: b2-54-008
    type: match
    point: formules-formals
    lesson: 1
    instruction: "Relaciona cada part de la carta amb un exemple."
    pairs:
      - ["la salutació", "Benvolguda senyora,"]
      - ["el motiu", "El motiu d'aquest correu és la factura de gener."]
      - ["la petició", "Us demano que corregeixin l'error."]
      - ["el document adjunt", "Us adjunto una còpia del rebut."]
      - ["el comiat", "Atentament,"]
    explanation: "Tota carta formal té salutació, motiu, petició i comiat; el document adjunt hi apareix quan s'envia un paper amb la carta."

  - id: b2-54-009
    type: match
    point: tractament-voste
    lesson: 1
    instruction: "Relaciona cada infinitiu amb l'imperatiu formal (vostè)."
    pairs:
      - ["rebre", "rebi"]
      - ["disculpar", "disculpi"]
      - ["adreçar-se", "adreci's"]
      - ["no dubtar", "no dubti"]
      - ["posar-se en contacte", "posi's en contacte"]
    explanation: "L'imperatiu formal de *vostè* és el present de subjuntiu: *rebi*, *disculpi*…; en afirmatiu, els pronoms van darrere: *adreci's*, *posi's*."

  - id: b2-54-010
    type: inline-choice
    point: formules-formals
    lesson: 1
    title: "Un correu a la companyia"
    text: "{Benvolgut|Benvolguda|Estimado} senyor Roca: {Us|T'|Em} escric per la factura de gener. {Us|T'|Ho} adjunto una còpia del rebut. {Atentament|Atentamente|Saludos}, Núria Puig"
    explanation: "Salutació formal concordada (*Benvolgut senyor*), pronom formal (*Us escric*, *Us adjunto*) i comiat català (*Atentament*): *Benvolguda* no concorda, *t'* i *em* no són el pronom formal, i «Estimado», «Atentamente» i «Saludos» són en castellà."

  - id: b2-54-011
    type: fill
    point: tractament-voste
    lesson: 1
    prompt: "Benvolgut senyor Roca: ___ una salutació cordial,"
    hint: "REBRE, imperatiu formal (vostè)"
    answers: ["Rebi"]
    wrong_answers:
      - text: "Rep"
        why: "«Rep» és imperatiu de *tu*; amb *vostè*: *rebi*."
      - text: "Reciba"
        why: "«Reciba» és castellà; en català, *rebi*."
    grading: tolerant
    explanation: "Amb *vostè* el comiat fa servir l'imperatiu formal: *Rebi una salutació cordial*."

  - id: b2-54-012
    type: fill
    point: formules-formals
    lesson: 1
    prompt: "___ senyor Roca: em dic Núria Puig i soc clienta de la vostra companyia."
    hint: "salutació formal per a un desconegut (masculí)"
    answers: ["Benvolgut"]
    wrong_answers:
      - text: "Benvolguda"
        why: "«Senyor Roca» és masculí: *Benvolgut*."
      - text: "Estimado"
        why: "«Estimado» és castellà; en català, *Benvolgut*."
    grading: tolerant
    explanation: "A un desconegut, la salutació formal és *Benvolgut* (masculí) + *senyor* + cognom."

  - id: b2-54-013
    type: order
    point: tractament-voste
    lesson: 1
    cue: "Tanca una carta formal: dius que restes a l'espera de la resposta."
    chunks: ["Resto", "a l'espera", "de la vostra", "resposta"]
    extra: ["teva"]
    answers:
      - "Resto a l'espera de la vostra resposta."
    explanation: "El tancament formal és *Resto a l'espera de la vostra resposta*, amb el possessiu *vostra*."

  # ---------- Lliçó 2 ----------
  - id: b2-54-014
    type: fill
    point: tractament-voste
    lesson: 2
    prompt: "Vostès ___ presentar la reclamació per internet o per telèfon."
    hint: "PODER, present (vostès)"
    answers: ["poden"]
    wrong_answers:
      - text: "podeu"
        why: "El subjecte és *vostès*: tercera persona del plural, *poden*."
      - text: "pot"
        why: "«Pot» és singular; el subjecte és *vostès* (plural): *poden*."
    grading: tolerant
    explanation: "El subjecte és *vostès*: verb en tercera persona del plural, *poden*."

  - id: b2-54-015
    type: fill
    point: tractament-voste
    lesson: 2
    prompt: "Si ___ cap pregunta, truqui'ns al 932 10 22 33."
    hint: "TENIR, present (vostè)"
    answers: ["té"]
    wrong_answers:
      - text: "tens"
        why: "«Tens» és de *tu*; amb *vostè*: *té*."
      - text: "tenen"
        why: "«Tenen» és plural; amb *vostè* (singular): *té*."
    grading: tolerant
    explanation: "Amb *vostè* el verb va en tercera persona: *Si té cap pregunta*. «Truqui'ns» ja marca el registre."

  - id: b2-54-016
    type: fill
    point: reclamacions-sollicituds
    lesson: 2
    prompt: "El ___ d'aquest correu és demanar la devolució d'un càrrec duplicat."
    hint: "MOTIU o MOTIVO?"
    answers: ["motiu"]
    wrong_answers:
      - text: "motivo"
        why: "«Motivo» és castellà; en català, *motiu*."
    grading: tolerant
    explanation: "El cos de la carta s'obre amb el motiu: *El motiu d'aquest correu és…*."

  - id: b2-54-017
    type: fill
    point: reclamacions-sollicituds
    lesson: 2
    prompt: "En ___ a l'expedient 2026-04521, us explico els fets."
    hint: "nom que vol dir «menció»"
    answers: ["referència"]
    wrong_answers:
      - text: "referencia"
        why: "«Referencia» sense accent és castellà; en català, *referència*, amb accent obert."
    grading: strict
    explanation: "La fórmula és *En referència a…*, amb accent obert: *referència*. Sense accent és castellà."

  - id: b2-54-018
    type: fill
    point: expressions
    lesson: 2
    prompt: "Em vull donar ___ del servei de gas."
    hint: "expressió: deixar un servei"
    answers: ["de baixa"]
    wrong_answers:
      - text: "la baixa"
        why: "L'expressió porta *de*, sense article: *donar-se de baixa*."
    grading: tolerant
    explanation: "Deixar un servei és *donar-se de baixa de* + el servei."

  - id: b2-54-019
    type: order
    point: reclamacions-sollicituds
    lesson: 2
    cue: "Demana educadament que corregeixin l'error de la factura."
    chunks: ["Us", "demano", "que", "corregeixin", "l'error"]
    extra: ["corregiu"]
    answers:
      - "Us demano que corregeixin l'error."
    explanation: "La petició formal és *Us demano que* + subjuntiu; amb *vostès*, *corregeixin*."

  - id: b2-54-020
    type: order
    point: tractament-voste
    lesson: 2
    cue: "Digues a un client (vostè) que es pot posar en contacte amb vosaltres."
    chunks: ["Es", "pot", "posar", "en contacte", "amb nosaltres"]
    extra: ["Et"]
    answers:
      - "Es pot posar en contacte amb nosaltres."
    explanation: "Amb subjecte *vostè* el reflexiu és *es*: *Es pot posar en contacte*."

  - id: b2-54-021
    type: order
    point: expressions
    lesson: 2
    cue: "Vols deixar de ser client del gimnàs. Demana la baixa del servei."
    chunks: ["Em", "vull", "donar", "de baixa", "del servei"]
    extra: ["la baixa"]
    answers:
      - "Em vull donar de baixa del servei."
    explanation: "Deixar un servei és *donar-se de baixa de* + el servei, amb *de* i sense article."

  - id: b2-54-022
    type: choice
    point: reclamacions-sollicituds
    lesson: 2
    prompt: "___ el rebut d'aquest mes en aquest correu."
    answer: "Us adjunto"
    distractors:
      - text: "T'adjunto"
        why: "«T'adjunto» és de *tu*; en una carta formal, *Us adjunto*."
      - text: "Os adjunto"
        why: "«Os» és el pronom castellà; en català, *us*."
    explanation: "Per enviar un document amb la carta: *Us adjunto* + el document. *Us* és el pronom més habitual en una carta formal."

  - id: b2-54-023
    type: choice
    point: reclamacions-sollicituds
    lesson: 2
    prompt: "Per demanar alguna cosa en una carta formal, quina fórmula és la més adequada?"
    answer: "Us agrairia que m'enviessin una còpia."
    distractors:
      - text: "Envieu-me una còpia ara mateix."
        why: "El to («ara mateix») és massa brusc per a una carta formal."
      - text: "Vull una còpia. Envieu-me-la."
        why: "El to és massa directe per a una carta formal."
    explanation: "El condicional de cortesia (*agrairia*) + imperfet de subjuntiu (*enviessin*) és la petició formal."

  - id: b2-54-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «quedar a l'espera» en una carta?"
    answer: "Esperar la resposta d'una carta o d'una sol·licitud."
    distractors:
      - text: "Esperar el torn a la cua d'una oficina."
        why: "Això és fer cua; «quedar a l'espera» és esperar una resposta escrita."
      - text: "Deixar un assumpte pendent per a més endavant."
        why: "«Quedar a l'espera» no és ajornar res: és esperar la resposta."
    explanation: "«Resto/quedo a l'espera de la vostra resposta» tanca el cos de la carta: s'espera resposta."

  - id: b2-54-025
    type: choice
    point: tractament-voste
    lesson: 2
    prompt: "Benvolguts senyors: ___ una salutació cordial,"
    answer: "Rebin"
    distractors:
      - text: "Rebeu"
        why: "Amb *vostès* l'imperatiu formal és *rebin*, no *rebeu*."
      - text: "Reciban"
        why: "«Reciban» és castellà; en català, *rebin*."
    explanation: "El comiat amb *vostès* fa servir l'imperatiu formal plural: *rebin*."

  - id: b2-54-026
    type: match
    point: expressions
    lesson: 2
    instruction: "Relaciona cada expressió amb la seva situació."
    pairs:
      - ["donar-se de baixa", "deixar de ser client d'una companyia"]
      - ["donar-se d'alta", "contractar un servei nou"]
      - ["quedar a l'espera", "esperar la resposta d'una sol·licitud"]
      - ["fer una reclamació", "queixar-se formalment d'un servei"]
    explanation: "Són les expressions bàsiques del consumidor: alta, baixa, espera i reclamació."

  # ---------- Lliçó 3 ----------
  - id: b2-54-027
    type: find-error
    point: compte-formules-calcades
    lesson: 3
    sentence: "Estimado senyor: m'adreço a vostè per la factura de gener."
    error: "Estimado senyor"
    fix: "Benvolgut senyor"
    fix_distractors:
      - text: "Benvolguda senyor"
        why: "«Senyor» és masculí: *Benvolgut senyor*."
      - text: "Bienvolgut senyor"
        why: "S'escriu *benvolgut*, amb *e*: *Benvolgut senyor*."
    explanation: "La salutació formal és *Benvolgut senyor*. «Estimado» és castellà."

  - id: b2-54-028
    type: find-error
    point: compte-formules-calcades
    lesson: 3
    sentence: "Os adjunto el rebut del mes passat."
    error: "Os"
    fix: "Us"
    fix_distractors:
      - text: "Les"
        why: "«Les» és el pronom de cortesia del castellà; en català, *us*."
      - text: "Se"
        why: "*Se* no és el pronom del destinatari: *us*."
    explanation: "«Os» és el pronom castellà. En català, el pronom de destinatari és *us*: *Us adjunto* + el document."

  - id: b2-54-029
    type: find-error
    point: compte-formules-calcades
    lesson: 3
    sentence: "Quedo a la espera de su respuesta."
    error: "a la espera de su respuesta"
    fix: "a l'espera de la vostra resposta"
    fix_distractors:
      - text: "a la espera de la vostra resposta"
        why: "«Espera» comença per vocal: l'article s'apostrofa, *a l'espera*."
      - text: "a l'espera de la teva resposta"
        why: "«Teva» és de *tu*; en una carta formal, *vostra*."
    explanation: "Tot el tram és castellà: *a l'espera* (amb elisió) i *la vostra resposta* (possessiu formal)."

  - id: b2-54-030
    type: find-error
    point: compte-formules-calcades
    lesson: 3
    sentence: "Benvolguts senyors: us demano que anulen el càrrec de gener."
    error: "anulen"
