    point: tractament-voste
    lesson: 5
    sentence: "Si volen donar-se d'alta, han d'omplir el formulari de la pàgina web."
    no_error: true
    explanation: "La frase és correcta: amb *vostès* els verbs van en tercera persona del plural (*volen*, *han*)."

  - id: b2-54-062
    type: transform
    point: expressions
    lesson: 5
    instruction: "Reescriu la frase amb l'expressió «donar-se d'alta»."
    source: "Vull [[contractar la fibra]] amb la vostra companyia."
    answers:
      - "Vull donar-me d'alta de la fibra amb la vostra companyia."
      - "Em vull donar d'alta de la fibra amb la vostra companyia."
    wrong_answers:
      - text: "Vull donar-me d'alta la fibra amb la vostra companyia."
        why: "«Donar-se d'alta» porta *de*: *donar-me d'alta de la fibra*."
      - text: "Vull donar-me de baixa de la fibra amb la vostra companyia."
        why: "Això és el contrari: deixar el servei."
    grading: tolerant
    explanation: "Contractar un servei és *donar-se d'alta de* + el servei: *donar-me d'alta de la fibra*."

  - id: b2-54-063
    type: order
    point: formules-formals
    lesson: 5
    cue: "Comença una carta formal adreçada a la senyora Puig."
    chunks: ["Benvolguda", "senyora Puig,", "us", "escric"]
    extra: ["Hola"]
    answers:
      - "Benvolguda senyora Puig, us escric."
    explanation: "Obertura formal: salutació concordada (*Benvolguda senyora Puig*) i pronom formal (*us*)."

  - id: b2-54-064
    type: inline-choice
    point: reclamacions-sollicituds
    lesson: 5
    title: "Canvi de companyia"
    text: "Benvolguts senyors: vull {donar-me|donar-vos|donar-se} de baixa de la fibra. {Us|T'|Em} demano que {donin|dones|donaran} de baixa el servei a final de mes. {Us|T'|Ho} agraeixo l'atenció. {Atentament|Atentamente|Saludos}."
    explanation: "El subjecte és *jo* (*vull donar-me*); la petició va en subjuntiu i en tercera persona del plural (*Us demano que donin*): *dones* és de *tu* i *donaran* és futur d'indicatiu. El comiat és *Atentament*."

  - id: b2-54-065
    type: match
    point: reclamacions-sollicituds
    lesson: 5
    instruction: "Relaciona cada fórmula formal amb la frase col·loquial equivalent."
    pairs:
      - ["Us adjunto el rebut.", "T'envio el rebut amb aquest correu."]
      - ["Resto a l'espera de la vostra resposta.", "Espero que em respongueu aviat."]
      - ["Us agrairia que m'enviessin el resguard.", "Si em podeu enviar el resguard, us ho agraeixo."]
      - ["No dubti a trucar-nos.", "Truca'ns quan vulguis."]
    explanation: "El mateix contingut canvia de forma segons el registre: formal amb *vostè/vostès* o col·loquial amb *tu/vosaltres*."
