id: b1-34
level: B1
title: "Construccions amb es: passiva i impersonal"
summary: "Aprens la passiva amb *es* (*es lloguen pisos*), la impersonal (*es diu que*, *es viu bé*) i la forma del pronom (*es*, *s'*, *-se*)."
vocabulary_theme: "Anuncis, lloguer i habitatge"
points:
  - id: passiva-pronominal
    title: "La passiva amb *es*: *es lloguen pisos*"
    refs:
      - label: "GEIEC: La passiva pronominal"
        url: "https://geiec.iec.cat"
  - id: impersonal-es
    title: "La impersonal amb *es*: *es diu que*, *es viu bé*"
    refs:
      - label: "GEIEC: Les oracions impersonals"
        url: "https://geiec.iec.cat"
  - id: forma-es
    title: "La forma del pronom: *es*, *s'*, *-se*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *se* i la concordança"
  - id: expressions
    title: "Fórmules i anuncis amb *es*"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: què es lloga i què es diu"
  - title: "Practicar la passiva i la impersonal"
  - title: "La forma del pronom i les interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el lloguer"
    definition: "Diners que es paguen cada mes per viure en un pis que no és teu."
    example: "El lloguer d'aquest àtic és molt alt."
  - word: "la fiança"
    definition: "Diners que es deixen al propietari com a garantia quan s'entra en un pis."
    example: "Per entrar al pis vam pagar dos mesos de fiança."
  - word: "el contracte"
    definition: "Document que signen el propietari i el llogater amb les condicions del lloguer."
    example: "Llegeix el contracte abans de signar-lo."
  - word: "el propietari, la propietària"
    definition: "Persona que té un pis i el lloga a una altra persona."
    example: "El propietari vindrà dilluns a arreglar l'aixeta."
  - word: "el llogater, la llogatera"
    definition: "Persona que viu en un pis de lloguer."
    example: "Els llogaters nous són una parella jove."
  - word: "la immobiliària"
    definition: "Empresa que ven i lloga pisos."
    example: "Vam trobar el pis en una immobiliària del barri."
  - word: "la mensualitat"
    definition: "Quantitat de diners que es paga cada mes pel pis."
    example: "La mensualitat inclou les despeses de l'escala."
  - word: "les despeses"
    definition: "Diners que costa mantenir el pis i l'edifici, a part del lloguer."
    example: "Aquest mes les despeses han pujat molt."
  - word: "l'anunci"
    definition: "Text curt que ofereix o demana una cosa."
    example: "Vaig posar un anunci per llogar l'habitació."
  - word: "el tauler d'anuncis"
    definition: "Panell on es pengen anuncis perquè tothom els vegi."
    example: "Mira el tauler d'anuncis de l'escala."
  - word: "l'àtic"
    definition: "Pis més alt de l'edifici, sovint amb terrassa."
    example: "Des de l'àtic es veu tot el barri."
  - word: "la planta baixa"
    definition: "Pis a peu de carrer, sense escales per arribar-hi."
    example: "La meva àvia viu en una planta baixa."
  - word: "l'habitació"
    definition: "Part del pis on es dorm."
    example: "El pis té tres habitacions i un menjador."
  - word: "el menjador"
    definition: "Part del pis on es menja i on es rep la gent."
    example: "Vam sopar al menjador amb els veïns."
  - word: "la cuina"
    definition: "Part del pis on es prepara el menjar."
    example: "La cuina és petita, però té molta llum."
  - word: "el lavabo"
    definition: "Cambra petita del pis amb vàter i pica."
    example: "El lavabo de dalt no té dutxa."
  - word: "la dutxa"
    definition: "Aparell per rentar-se sota l'aigua que cau de dalt."
    example: "Prefereixo la dutxa a la banyera."
  - word: "el balcó"
    definition: "Obertura a la façana amb barana per sortir a fora."
    example: "Al balcó hi tinc tres plantes."
  - word: "la terrassa"
    definition: "Espai obert d'un pis o d'una casa per estar a l'aire lliure."
    example: "A l'estiu sopem a la terrassa."
  - word: "el traster"
    definition: "Habitació petita per guardar-hi coses que no es fan servir."
    example: "Vam pujar les maletes al traster."
  - word: "el pàrquing"
    definition: "Lloc on es deixen els cotxes."
    example: "El pis inclou una plaça de pàrquing."
  - word: "l'ascensor"
    definition: "Aparell que puja i baixa persones entre els pisos."
    example: "L'ascensor no funciona des de dilluns."
  - word: "la calefacció"
    definition: "Sistema que escalfa el pis a l'hivern."
    example: "A la nit apaguem la calefacció."
  - word: "el moble"
    definition: "Objecte de la casa com una taula o un armari."
    example: "Vam vendre els mobles vells."
  - word: "l'armari"
    definition: "Moble amb portes per guardar-hi roba."
    example: "L'armari de l'habitació és molt gran."
  - word: "la nevera"
    definition: "Aparell que manté freds els aliments."
    example: "La nevera nova fa molt poc soroll."
  - word: "el forn"
    definition: "Aparell tancat per coure el menjar amb calor."
    example: "Vaig coure el pa al forn."
  - word: "la rentadora"
    definition: "Màquina per rentar la roba."
    example: "La rentadora fa un soroll estrany."
  - word: "moblat, moblada"
    definition: "Pis que ja té mobles quan s'hi entra a viure."
    example: "Busquem un pis moblat a prop del centre."
  - word: "lluminós, lluminosa"
    definition: "Pis o habitació amb molta llum natural."
    example: "És un menjador molt lluminós."
  - word: "cèntric, cèntrica"
    definition: "Pis o carrer a prop del centre."
    example: "Viu en un carrer molt cèntric."
  - word: "reformar"
    definition: "Arreglar un pis vell per deixar-lo com nou."
    example: "Volen reformar la cuina i el lavabo."
  - word: "signar"
    definition: "Escriure el nom en un document per acceptar-lo."
    example: "Demà signem el contracte del pis."
  - word: "el veïnat"
    definition: "Conjunt de veïns d'una escala o d'un barri."
    example: "Tot el veïnat va anar a la festa."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-34-001
    type: choice
    point: passiva-pronominal
    lesson: 1
    instruction: "Completa la frase en registre formal."
    prompt: "Al barri antic ___ pisos petits per a estudiants."
    answer: "es lloguen"
    distractors:
      - text: "es lloga"
        why: "En registre formal, el verb concorda amb «pisos», que és plural: *es lloguen*."
      - text: "se lloguen"
        why: "*Se* davant del verb és un calc de «se». En aquest cas, davant del verb és *es*."
      - text: "es lloguem"
        why: "La passiva amb *es* només va en tercera persona: *es lloguen*."
    explanation: "«Pisos» és el subjecte, en plural: el verb hi concorda. *Es lloguen pisos*."

  - id: b1-34-002
    type: choice
    point: passiva-pronominal
    lesson: 1
    prompt: "___ un àtic amb molta llum al centre."
    answer: "Es ven"
    distractors:
      - text: "Es venen"
        why: "«Un àtic» és singular: el verb hi concorda. *Es ven*."
      - text: "Se ven"
        why: "*Se* és un calc del castellà «se». En català: *es ven*."
    explanation: "«Un àtic» és el subjecte, en singular: *es ven un àtic*."

  - id: b1-34-003
    type: choice
    point: impersonal-es
    lesson: 1
    prompt: "En aquest carrer ___ molt bé."
    answer: "es viu"
    distractors:
      - text: "es viuen"
        why: "La frase no diu qui hi viu: és impersonal i el verb va en singular. *Es viu*."
      - text: "se viu"
        why: "*Se* és un calc del castellà. En català: *es viu*."
    explanation: "És una frase impersonal: no diu qui viu aquí. El verb va en singular: *es viu*."

  - id: b1-34-004
    type: choice
    point: impersonal-es
    lesson: 1
    prompt: "___ que apujaran el lloguer al gener."
    answer: "Es diu"
    distractors:
      - text: "Es diuen"
        why: "*Es diu que* és impersonal: el verb va sempre en singular."
      - text: "Se diu"
        why: "*Se* és un calc del castellà. En català: *es diu*."
    explanation: "«Es diu que…» presenta un rumor sense dir qui ho diu: verb en singular."

  - id: b1-34-005
    type: choice
    point: passiva-pronominal
    lesson: 1
    instruction: "Completa la frase en registre formal."
    prompt: "___ habitacions lliures per al curs que ve."
    answer: "Es lloguen"
    distractors:
      - text: "Es lloga"
        why: "En registre formal, el verb concorda amb «habitacions», que és plural: *es lloguen*."
      - text: "Se lloguen"
        why: "Davant del verb, el pronom és *es*, no *se*."
    explanation: "«Habitacions» és el subjecte, en plural: *es lloguen habitacions*."

  - id: b1-34-006
    type: choice
    point: impersonal-es
    lesson: 1
    prompt: "A la reunió de veïns ___ dels preus nous."
    answer: "es parla"
    distractors:
      - text: "es parlen"
        why: "Amb la preposició *de* no hi ha subjecte: la impersonal va en singular. *Es parla de*."
      - text: "se parla"
        why: "*Se* és un calc del castellà. En català: *es parla*."
    explanation: "«Parlar de» porta preposició: no hi ha subjecte i el verb va en singular."

  - id: b1-34-007
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «Es lloga habitació»?"
    answer: "Que hi ha una habitació de lloguer."
    distractors:
      - text: "Que busquen una habitació per llogar."
        why: "Això seria «es busca habitació»: aquí és el propietari qui ofereix."
      - text: "Que l'habitació ja està llogada."
        why: "«Es lloga» és un anunci d'ara, no una cosa ja feta."
    explanation: "*Es lloga* és la fórmula dels anuncis que ofereixen un pis o una habitació."

  - id: b1-34-008
    type: inline-choice
    point: passiva-pronominal
    lesson: 1
    title: "Un anunci a l'escala"
    instruction: "Tria les formes del registre formal."
    text: "Al tercer pis {es|se} {lloguen|lloga} dues habitacions amb balcó. {Es|Se} {demana|demanen} un mes de fiança i el lloguer és raonable. {Es|Se} {pot|poden} visitar el pis cada tarda."
    explanation: "El pronom és *es* (*se* és un calc). En registre formal, el verb concorda amb el subjecte: *lloguen* (dues habitacions), *demana* (un mes), *pot* (el pis)."

  - id: b1-34-009
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada fórmula amb la situació."
    pairs:
      - ["es lloga", "un propietari ofereix un pis"]
      - ["es busca", "algú necessita un pis o un company"]
      - ["es ven", "algú vol vendre una cosa"]
      - ["es regala", "algú dona una cosa de franc"]
    explanation: "Són les fórmules fixes dels anuncis: *es lloga*, *es busca*, *es ven*, *es regala*."

  - id: b1-34-010
    type: fill
    point: passiva-pronominal
    lesson: 1
    instruction: "Completa la frase en registre formal."
    prompt: "Es ___ dues habitacions amb vistes al mar."
    hint: "LLOGAR, present"
    answers: ["lloguen"]
    wrong_answers:
      - text: "lloga"
        why: "En registre formal, el verb concorda amb «dues habitacions», que és plural: *es lloguen*."
    grading: tolerant
    explanation: "El subjecte és «dues habitacions», en plural: *es lloguen*."

  - id: b1-34-011
    type: fill
    point: impersonal-es
    lesson: 1
    prompt: "En aquest restaurant ___ menja molt bé i es paga poc."
    hint: "pronom impersonal"
    answers: ["es"]
    wrong_answers:
      - text: "se"
        why: "*Se* és un calc del castellà. En català, el pronom és *es*."
    grading: tolerant
    explanation: "És una frase impersonal: no diu qui menja aquí. El pronom és *es*."

  - id: b1-34-012
    type: order
    point: passiva-pronominal
    lesson: 1
    cue: "Digues que en aquest edifici lloguen pisos petits."
    chunks: ["en aquest edifici", "es", "lloguen", "pisos petits"]
    extra: ["se"]
    answers:
      - "En aquest edifici es lloguen pisos petits."
      - "Es lloguen pisos petits en aquest edifici."
      - "Pisos petits es lloguen en aquest edifici."
    explanation: "«Pisos petits» és plural: *es lloguen*. El pronom *es* va davant del verb."

  - id: b1-34-013
    type: order
    point: impersonal-es
    lesson: 1
    cue: "Explica que al poble del teu avi la gent dorm molt bé."
    chunks: ["al poble del meu avi", "es", "dorm", "molt bé"]
    extra: ["dormen"]
    answers:
      - "Al poble del meu avi es dorm molt bé."
      - "Es dorm molt bé al poble del meu avi."
      - "Es dorm al poble del meu avi molt bé."
    explanation: "És impersonal: no diu qui dorm. El verb va en singular: *es dorm*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-34-014
    type: fill
    point: passiva-pronominal
    lesson: 2
    instruction: "Completa la frase en registre formal."
    prompt: "Al mercat de segona mà es ___ mobles antics."
    hint: "VENDRE, present"
    answers: ["venen"]
    wrong_answers:
      - text: "ven"
        why: "En registre formal, el verb concorda amb «mobles», que és plural: *es venen*."
    grading: tolerant
    explanation: "«Mobles antics» és el subjecte, en plural: *es venen*."

  - id: b1-34-015
    type: fill
    point: passiva-pronominal
    lesson: 2
    prompt: "Es ___ un pis amb cuina nova a prop del metro."
    hint: "LLOGAR, present"
    answers: ["lloga"]
    wrong_answers:
      - text: "lloguen"
        why: "«Un pis» és singular: *es lloga*."
    grading: tolerant
    explanation: "«Un pis» és singular: *es lloga un pis*."

  - id: b1-34-016
    type: fill
    point: impersonal-es
    lesson: 2
    prompt: "Aquí es ___ molt quan arriba l'estiu."
    hint: "TREBALLAR, present"
    answers: ["treballa"]
    wrong_answers:
      - text: "treballen"
        why: "És impersonal, sense subjecte: el verb va sempre en singular. *Es treballa*."
    grading: tolerant
    explanation: "No diu qui treballa: és impersonal i el verb va en singular."

  - id: b1-34-017
    type: fill
    point: impersonal-es
    lesson: 2
    prompt: "Es ___ que faran un pàrquing nou sota la plaça."
    hint: "DIR, present"
    answers: ["diu"]
    wrong_answers:
      - text: "diuen"
        why: "*Es diu que* és impersonal: el verb va sempre en singular."
    grading: tolerant
    explanation: "Presenta un rumor sense dir qui ho diu: *es diu que*."

  - id: b1-34-018
    type: fill
    point: passiva-pronominal
    lesson: 2
    instruction: "Completa la frase en registre formal."
    prompt: "Es ___ dos llogaters per compartir el pis."
    hint: "NECESSITAR, present"
    answers: ["necessiten"]
    wrong_answers:
      - text: "necessita"
        why: "En registre formal, el verb concorda amb «dos llogaters», que és plural: *es necessiten*."
    grading: tolerant
    explanation: "«Dos llogaters» és el subjecte, en plural: *es necessiten*."

  - id: b1-34-019
    type: order
    point: passiva-pronominal
    lesson: 2
    cue: "Digues que en aquest barri venen pisos nous."
    chunks: ["en aquest barri", "es", "venen", "pisos nous"]
    extra: ["se"]
    answers:
      - "En aquest barri es venen pisos nous."
      - "Es venen pisos nous en aquest barri."
      - "Pisos nous es venen en aquest barri."
    explanation: "«Pisos nous» és plural: *es venen*."

  - id: b1-34-020
    type: order
    point: impersonal-es
    lesson: 2
    cue: "Explica que diuen que apujaran el lloguer, però no saps qui ho diu."
    chunks: ["es", "diu", "que", "apujaran", "el lloguer"]
    extra: ["diuen"]
    answers:
      - "Es diu que apujaran el lloguer."
    explanation: "El rumor no té autor: *es diu que*, amb el verb en singular."

  - id: b1-34-021
    type: order
    point: passiva-pronominal
    lesson: 2
    cue: "Digues que regalen mobles en bon estat al teu carrer."
    chunks: ["al meu carrer", "es", "regalen", "mobles en bon estat"]
    extra: ["se"]
    answers:
      - "Al meu carrer es regalen mobles en bon estat."
      - "Es regalen mobles en bon estat al meu carrer."
      - "Mobles en bon estat es regalen al meu carrer."
    explanation: "«Mobles» és plural: *es regalen*."

  - id: b1-34-022
    type: choice
    point: impersonal-es
    lesson: 2
    prompt: "___ que el metro arribarà al barri l'any que ve."
    answer: "Es diu"
    distractors:
      - text: "Es diuen"
        why: "*Es diu que* és impersonal: el verb va sempre en singular."
      - text: "Se diu"
        why: "*Se* és un calc del castellà. En català: *es diu*."
    explanation: "És un rumor sense autor: *es diu que*, en singular."

  - id: b1-34-023
    type: choice
    point: passiva-pronominal
    lesson: 2
    instruction: "Completa la frase en registre formal."
    prompt: "En aquest anunci ___ dos pàrquings amb llum."
    answer: "es venen"
    distractors:
      - text: "es ven"
        why: "En registre formal, el verb concorda amb «dos pàrquings», que és plural: *es venen*."
      - text: "es venem"
        why: "La passiva amb *es* només va en tercera persona: *es venen*."
    explanation: "«Dos pàrquings» és el subjecte, en plural i en tercera persona: *es venen*."

  - id: b1-34-024
    type: choice
    point: compte-castella
    lesson: 2
    prompt: "Quina frase és correcta?"
    answer: "Es veu que el pis té molta llum."
    distractors:
      - text: "Se veu que el pis té molta llum."
        why: "*Se veu* és un calc de «se ve». En català: *es veu*."
      - text: "Es veuen que el pis té molta llum."
        why: "«Es veu que…» és impersonal: el verb va en singular."
    explanation: "El pronom és *es* i la construcció és impersonal: *es veu que*."

  - id: b1-34-025
    type: choice
    point: impersonal-es
    lesson: 2
    prompt: "A l'oficina ___ de canviar els horaris de visita."
    answer: "es parla"
    distractors:
      - text: "es parlen"
        why: "Amb *de* no hi ha subjecte: *es parla de*, en singular."
      - text: "se parla"
        why: "*Se* és un calc del castellà. En català: *es parla*."
    explanation: "«Parlar de» porta preposició, sense subjecte: *es parla de*."

  - id: b1-34-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «Es busca company de pis»?"
    answer: "Que algú necessita un company per compartir el pis."
    distractors:
      - text: "Que ofereixen un pis per llogar."
        why: "Això seria «es lloga»: aquí és algú que necessita, no que ofereix."
      - text: "Que el company ja ha marxat del pis."
        why: "L'anunci busca una persona ara: no diu que ningú hagi marxat."
    explanation: "*Es busca* és la fórmula dels anuncis que demanen una persona o una cosa."

  # ---------------- Lliçó 3 ----------------
  - id: b1-34-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Se lloguen habitacions a prop de la universitat."
    error: "Se lloguen"
    fix: "Es lloguen"
    fix_distractors:
      - text: "Se lloga"
        why: "*Se* és un calc, i «habitacions» demana el plural: *es lloguen*."
      - text: "Es lloguem"
        why: "La passiva amb *es* només va en tercera persona: *es lloguen*."
    explanation: "Davant del verb, el pronom és *es*, no *se*: *es lloguen habitacions*."

  - id: b1-34-028
    type: find-error
    point: compte-castella
    lesson: 3
    instruction: "Registre formal: troba l'error i corregeix-lo."
    sentence: "Es lloga pisos amb terrassa a Sarrià."
    error: "Es lloga"
    fix: "Es lloguen"
    fix_distractors:
      - text: "Se lloguen"
        why: "El verb ja concorda, però *se* és un calc del castellà."
      - text: "Se lloga"
        why: "*Se* és un calc i el verb no concorda amb «pisos»: *es lloguen*."
    explanation: "En registre formal, el verb concorda amb «pisos», que és plural: *es lloguen pisos*."

  - id: b1-34-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Se diu que el barri és molt tranquil."
    error: "Se diu"
    fix: "Es diu"
    fix_distractors:
      - text: "Se diuen"
        why: "*Se* és un calc, i la impersonal va en singular."
      - text: "Es diuen"
        why: "Ja és *es*, però *es diu que* és impersonal: va en singular."
    explanation: "El pronom és *es* i la impersonal va en singular: *es diu que*."

  - id: b1-34-030
    type: find-error
    point: forma-es
    lesson: 3
    sentence: "La porta del pàrquing es obre amb aquest comandament."
    error: "es obre"
    fix: "s'obre"
    fix_distractors:
      - text: "se obre"
        why: "Davant de vocal, el pronom és *s'*: *s'obre*."
      - text: "es obren"
        why: "L'apòstrof continua faltant: davant de vocal, *es* és *s'*."
    explanation: "Davant d'un verb que comença per vocal, *es* s'apostrofa: *s'obre*."

  - id: b1-34-031
    type: find-error
    point: forma-es
    lesson: 3
    sentence: "S'anuncia un pis nou a cada reunió de veïns."
