  # ---------------- Lliçó 5 ----------------
  - id: b1-34-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un pis a Gràcia"
    text: |
      La Carla busca un pis de lloguer a Gràcia des del gener. Cada matí mira els anuncis de la immobiliària del carrer i el tauler d'anuncis del centre cívic. Es necessita molta paciència: els pisos bons desapareixen en un dia.

      Dilluns va trobar un anunci que deia: «Es lloga àtic lluminós amb terrassa. Es pot visitar cada tarda.» Va trucar de seguida, però li van dir que ja s'havia llogat. Es veu que els àtics del barri duren poques hores.

      Dimarts va visitar un pis cèntric de dues habitacions amb un menjador gran. La mensualitat era raonable, però demanaven tres mesos de fiança i les despeses de l'escala eren molt altes. El lavabo és nou, però el pis no té traster. La propietària li va explicar que es reformarà la cuina abans de l'estiu i que el contracte es pot signar en una setmana. Tot el veïnat parla bé de l'edifici.

      La Carla encara no ha decidit res. Diu que a Gràcia es viu molt bé, però que primer vol comparar preus amb calma.
    questions:
      - prompt: "Què fa la Carla cada matí?"
        answer: "Mira anuncis de pisos en dos llocs."
        distractors:
          - text: "Visita un pis amb la immobiliària."
            why: "La Carla només truca o visita quan troba un anunci interessant."
          - text: "Posa un anunci al centre cívic."
            why: "Ella mira el tauler d'anuncis, no hi posa cap anunci."
      - prompt: "Per què la Carla no lloga l'àtic de dilluns?"
        answer: "Perquè ja està llogat quan truca."
        distractors:
          - text: "Perquè la mensualitat és massa alta."
            why: "El text no parla del preu de l'àtic: arriba tard."
          - text: "Perquè l'àtic no té terrassa."
            why: "L'anunci diu que té terrassa: el problema és que ja s'ha llogat."
      - prompt: "Quin problema té el pis cèntric de dimarts?"
        answer: "La fiança i les despeses són massa altes."
        distractors:
          - text: "La mensualitat és massa alta."
            why: "La mensualitat li sembla raonable."
          - text: "El lavabo és vell i petit."
            why: "El lavabo és nou: el problema són la fiança i les despeses."
      - prompt: "Què pensa la Carla de Gràcia?"
        answer: "Que s'hi viu molt bé, però vol comparar preus."
        distractors:
          - text: "Que no li agrada gens el barri de Gràcia."
            why: "Diu que s'hi viu molt bé."
          - text: "Que ja ha signat el contracte del pis."
            why: "Encara no ha decidit res."
    explanation: "La Carla busca pis a Gràcia: arriba tard a un àtic i dubta amb un pis de fiança alta."

