  # ---------------- Lliçó 5 ----------------
  - id: b1-19-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una tertúlia al barri"
    text: |
      Dimarts passat, el casal del barri va acollir un debat sobre el nou horari dels bars. La sala era plena: hi havia veïns, botiguers i dos regidors de l'ajuntament. L'horari dels bars és un tema d'actualitat al barri. El dubte principal era si calia canviar l'horari. El desacord entre els veïns i els botiguers era total.

      La Núria, que viu al carrer Major, va dir que no podia dormir per culpa del soroll. «Crec que l'horari actual no funciona», va afirmar.

      En Jordi, que té un bar a la plaça, no hi va estar d'acord. «Dubto que el soroll vingui només dels bars», va respondre. Al seu parer, el problema és el trànsit de les nits de cap de setmana. Va proposar tancar la plaça als cotxes a partir de les deu.

      La Fàtima, mestra de l'escola del barri, va dir que li agradava la proposta, però que hi veia un inconvenient: calia pensar en els veïns que treballen de nit i dormen de dia. «És important que tothom pugui descansar», va afegir.

      Al final, els regidors van prometre estudiar les dues propostes i tornar al barri d'aquí a un mes amb una resposta. De moment no hi ha cap decisió. Mentrestant, els veïns continuaran reunint-se el primer dimarts de cada mes, com sempre.
    questions:
      - prompt: "Per què no pot dormir la Núria?"
        answer: "Perquè hi ha massa soroll."
        distractors:
          - text: "Pel trànsit dels caps de setmana."
            why: "El trànsit és l'opinió d'en Jordi, no de la Núria."
          - text: "Perquè treballa de nit."
            why: "Qui treballa de nit són uns altres veïns, segons la Fàtima."
      - prompt: "Què proposa en Jordi?"
        answer: "Que els cotxes no entrin a la plaça a la nit."
        distractors:
          - text: "Que els bars tanquin a les deu."
            why: "A les deu vol tancar la plaça als cotxes, no els bars."
          - text: "Que canviï l'horari dels bars."
            why: "En Jordi defensa l'horari actual; no en demana un de nou."
      - prompt: "Què li preocupa a la Fàtima?"
        answer: "Que la proposta pensi també en qui dorm de dia."
        distractors:
          - text: "Que els bars facin massa soroll."
            why: "El soroll és el problema de la Núria, no de la Fàtima."
          - text: "Que no hi hagi prou bars a la plaça."
            why: "La Fàtima no parla dels bars que hi ha, sinó dels veïns que dormen de dia."
      - prompt: "Què faran els regidors?"
        answer: "Estudiaran les propostes i tornaran d'aquí a un mes."
        distractors:
          - text: "Tancaran la plaça als cotxes aquest mes."
            why: "Tancar la plaça és la proposta d'en Jordi; els regidors només l'estudiaran."
          - text: "Canviaran l'horari dels bars aquesta setmana."
            why: "Encara no hi ha cap decisió: de moment només estudiaran les propostes."
    explanation: "El text explica un debat del barri sobre el soroll i l'horari dels bars."

