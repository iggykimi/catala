id: b1-19
level: B1
title: "Subjuntiu per opinar i valorar"
summary: "Aprens a opinar amb *crec que* + indicatiu i *no crec que, dubto que* + subjuntiu, i a valorar amb *és possible que, és important que, m'agrada que* + subjuntiu."
vocabulary_theme: "Opinió, debat i actualitat"
points:
  - id: creure-dubtar
    title: "Opinar: *crec que* + indicatiu, *no crec que* i *dubto que* + subjuntiu"
    refs:
      - label: "GEIEC: El verb"
        url: "https://geiec.iec.cat"
  - id: valorar-impersonal
    title: "Valorar: *és possible que*, *és important que*, *m'agrada que* + subjuntiu"
    refs:
      - label: "GEIEC: El verb"
        url: "https://geiec.iec.cat"
  - id: formes-subjuntiu
    title: "Les formes del present de subjuntiu"
    refs:
      - label: "GEIEC: El verb"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: l'indicatiu i les formes"
  - id: expressions
    title: "Expressions per debatre"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Opinar: crec que i dubto que"
  - title: "Practicar l'opinió i la valoració"
  - title: "Les formes i les trampes del castellà"
  - title: "Produir: opinions completes"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el debat"
    definition: "Discussió ordenada d'un tema entre diverses persones."
    example: "El debat sobre l'horari va durar dues hores."
  - word: "l'opinió"
    definition: "Allò que penses d'un tema."
    example: "Tothom va donar la seva opinió."
  - word: "el parer"
    definition: "L'opinió d'una persona."
    example: "Al meu parer, cal votar avui mateix."
  - word: "el punt de vista"
    definition: "La manera de veure un tema."
    example: "Des del meu punt de vista, la proposta és bona."
  - word: "l'argument"
    definition: "Raó que dones per defensar una opinió."
    example: "Va convèncer tothom amb un bon argument."
  - word: "el motiu"
    definition: "La causa d'una cosa."
    example: "Ningú sap el motiu del canvi."
  - word: "la raó"
    definition: "Tenir-ne vol dir encertar una cosa."
    example: "Tens raó: és massa tard."
  - word: "el dubte"
    definition: "La manca de certesa sobre una cosa."
    example: "El dubte principal era l'horari."
  - word: "la prova"
    definition: "Fet o objecte que demostra que una cosa és veritat."
    example: "No tenim proves del soroll."
  - word: "la notícia"
    definition: "Informació nova sobre un fet recent."
    example: "El diari publicarà la notícia demà."
  - word: "l'actualitat"
    definition: "Els fets recents que són notícia."
    example: "L'horari dels bars és un tema d'actualitat."
  - word: "el diari"
    definition: "Publicació amb les notícies de cada dia."
    example: "Ho he llegit al diari d'avui."
  - word: "el titular"
    definition: "El títol gros d'una notícia."
    example: "El titular no diu tota la veritat."
  - word: "l'enquesta"
    definition: "Conjunt de preguntes per saber què pensa la gent."
    example: "L'enquesta diu que la majoria hi està d'acord."
  - word: "l'acord"
    definition: "Decisió que tothom accepta."
    example: "Van arribar a un acord sobre l'horari."
  - word: "el desacord"
    definition: "La manca d'acord entre persones."
    example: "El desacord era sobre l'origen del soroll."
  - word: "la majoria"
    definition: "La part més gran d'un grup."
    example: "La majoria vol canviar l'horari."
  - word: "la reunió"
    definition: "Trobada per parlar d'un tema i decidir."
    example: "La reunió començarà a les set."
  - word: "la proposta"
    definition: "Idea que presentes perquè s'accepti."
    example: "La proposta va tenir prou vots."
  - word: "la decisió"
    definition: "Allò que decideixes després de pensar-ho."
    example: "De moment no hi ha cap decisió."
  - word: "el canvi"
    definition: "El fet de fer una cosa diferent d'abans."
    example: "El canvi d'horari agrada als botiguers."
  - word: "el problema"
    definition: "Dificultat que cal resoldre."
    example: "El soroll és un problema greu."
  - word: "la solució"
    definition: "Allò que resol un problema."
    example: "No crec que sigui una bona solució."
  - word: "l'avantatge"
    definition: "Aspecte bo d'una cosa."
    example: "L'avantatge és que tothom hi cap."
  - word: "l'inconvenient"
    definition: "Aspecte dolent d'una cosa."
    example: "L'inconvenient és que costa diners."
  - word: "el soroll"
    definition: "So fort que molesta."
    example: "No puc dormir per culpa del soroll."
  - word: "el trànsit"
    definition: "Moviment de cotxes pels carrers."
    example: "El trànsit empitjorarà amb les obres."
  - word: "el lloguer"
    definition: "Diners que pagues per viure en un pis que no és teu."
    example: "Els lloguers pugen cada any."
  - word: "l'horari"
    definition: "Hores en què es fa una activitat."
    example: "El nou horari comença dilluns."
  - word: "la tertúlia"
    definition: "Conversa, sovint a la ràdio, sobre temes d'actualitat."
    example: "Cada nit escolto la tertúlia."
  - word: "opinar"
    definition: "Dir què penses d'un tema."
    example: "Tothom vol opinar sobre el canvi."
  - word: "dubtar"
    definition: "No estar segur d'una cosa."
    example: "Dubto que tinguem prou temps."
  - word: "estar d'acord"
    definition: "Acceptar l'opinió d'una altra persona."
    example: "Hi estic d'acord: cal votar."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-19-001
    type: choice
    point: creure-dubtar
    lesson: 1
    prompt: "Crec que en Pau ___ demà a la reunió, però encara no ho ha confirmat."
    answer: "vindrà"
    distractors:
      - text: "vingui"
        why: "Amb *crec que* afirmem una cosa: cal l'indicatiu, *vindrà*. *Vingui* és subjuntiu."
      - text: "vindran"
        why: "El subjecte és «en Pau», singular: *vindrà*."
    explanation: "«Crec que» afirma una opinió: el verb va en indicatiu. Amb «demà», el futur: *vindrà*."

  - id: b1-19-002
    type: choice
    point: creure-dubtar
    lesson: 1
    prompt: "No crec que en Pau ___ demà a la reunió."
    answer: "vingui"
    distractors:
      - text: "venga"
        why: "*Venga* és la forma castellana. De *venir*, el subjuntiu és *vingui*."
      - text: "vinguin"
        why: "El subjecte és «en Pau», singular: *vingui*."
    explanation: "«No crec que» expressa un dubte: el verb va en subjuntiu, *vingui*."

  - id: b1-19-003
    type: choice
    point: creure-dubtar
    lesson: 1
    prompt: "Dubto que la Laia ___ la proposta."
    answer: "accepti"
    distractors:
      - text: "acceptin"
        why: "El subjecte és «la Laia», singular: *accepti*."
      - text: "acceptis"
        why: "*Acceptis* és de «tu»; el subjecte és «la Laia»: *accepti*."
    explanation: "«Dubto que» expressa un dubte: el verb va en subjuntiu, *accepti*."

  - id: b1-19-004
    type: choice
    point: valorar-impersonal
    lesson: 1
    prompt: "És possible que demà ___."
    answer: "plogui"
    distractors:
      - text: "plou"
        why: "«És possible que» demana subjuntiu: *plogui*."
      - text: "plourà"
        why: "Amb *és possible que* el verb va en subjuntiu, encara que sigui futur: *plogui*."
    explanation: "«És possible que» expressa un dubte: el verb va en subjuntiu, *plogui*."

  - id: b1-19-005
    type: choice
    point: valorar-impersonal
    lesson: 1
    prompt: "És important que tu ___ a la reunió."
    answer: "vinguis"
    distractors:
      - text: "vindràs"
        why: "Amb *és important que* cal el subjuntiu, no el futur: *vinguis*."
      - text: "vens"
        why: "«És important que» és una valoració i demana subjuntiu: *vinguis*."
    explanation: "«És important que» és una valoració: el verb va en subjuntiu, *vinguis*."

  - id: b1-19-006
    type: choice
    point: valorar-impersonal
    lesson: 1
    prompt: "M'agrada que els veïns ___ bé de la festa."
    answer: "parlin"
    distractors:
      - text: "parlen"
        why: "«M'agrada que» expressa un sentiment i demana subjuntiu: *parlin*."
      - text: "parlaran"
        why: "Amb *m'agrada que* el verb va en subjuntiu, no en futur: *parlin*."
    explanation: "«M'agrada que» expressa un sentiment: el verb va en subjuntiu, *parlin*."

  - id: b1-19-007
    type: inline-choice
    point: creure-dubtar
    lesson: 1
    title: "Abans de la reunió"
    text: "—Crec que la reunió {serà|sigui} curta. —Doncs jo no crec que {sigui|siguin} curta: tenim tres temes. —Dubto que nosaltres {puguem|pugui} parlar de tot. —I jo dubto que en Pau {vingui|venga}."
    explanation: "«Crec que» demana indicatiu (*serà*). Amb «no crec que» i «dubto que» va el subjuntiu, amb la persona del subjecte: *sigui* (la reunió), *puguem* (nosaltres), *vingui* (en Pau)."

  - id: b1-19-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["al meu parer", "segons la meva opinió"]
      - ["tens raó", "estic d'acord amb tu"]
      - ["ara bé", "però, d'altra banda"]
      - ["posar en dubte", "no creure una cosa del tot"]
    explanation: "Són expressions per donar la teva opinió i debatre amb calma."

  - id: b1-19-009
    type: fill
    point: creure-dubtar
    lesson: 1
    prompt: "—Aquesta proposta solucionarà el problema del soroll? —No crec que el ___."
    hint: "solucionar, present de subjuntiu"
    answers: ["solucioni"]
    wrong_answers:
      - text: "solucionin"
        why: "El subjecte és «aquesta proposta», singular: *solucioni*."
    grading: tolerant
    explanation: "«No crec que» expressa un dubte: el verb va en subjuntiu, *solucioni*."

  - id: b1-19-010
    type: fill
    point: creure-dubtar
    lesson: 1
    prompt: "—Tothom accepta la proposta? —Em sembla que la majoria ___."
    hint: "estar-hi d'acord, present d'indicatiu"
    answers: ["hi està d'acord"]
    wrong_answers:
      - text: "hi estigui d'acord"
        why: "«Em sembla que» afirma una opinió: cal l'indicatiu, *hi està d'acord*."
    grading: tolerant
    explanation: "«Em sembla que» afirma una opinió: el verb va en indicatiu, *hi està d'acord*."

  - id: b1-19-011
    type: fill
    point: valorar-impersonal
    lesson: 1
    prompt: "És probable que la tertúlia ___ tard."
    hint: "acabar, present de subjuntiu"
    answers: ["acabi"]
    wrong_answers:
      - text: "acaba"
        why: "«És probable que» demana subjuntiu: *acabi*."
      - text: "acabarà"
        why: "Amb *és probable que* cal el subjuntiu, no el futur: *acabi*."
    grading: tolerant
    explanation: "«És probable que» expressa un dubte: el verb va en subjuntiu, *acabi*."

  - id: b1-19-012
    type: order
    point: creure-dubtar
    lesson: 1
    cue: "Digues que no creus que el canvi d'horari agradi als botiguers."
    chunks: ["no", "crec", "que", "el", "canvi", "d'horari", "agradi", "als", "botiguers"]
    extra: ["agradin"]
    answers:
      - "No crec que el canvi d'horari agradi als botiguers."
      - "No crec que agradi als botiguers el canvi d'horari."
    explanation: "«No crec que» demana subjuntiu: *agradi*."

  - id: b1-19-013
    type: order
    point: valorar-impersonal
    lesson: 1
    cue: "Digues que és important que tothom doni la seva opinió."
    chunks: ["és", "important", "que", "tothom", "doni", "la", "seva", "opinió"]
    extra: ["dona"]
    answers:
      - "És important que tothom doni la seva opinió."
    explanation: "«És important que» és una valoració: el verb va en subjuntiu, *doni*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-19-014
    type: fill
    point: creure-dubtar
    lesson: 2
    prompt: "Penso que el debat d'ahir ___ molt interessant."
    hint: "ser, passat perifràstic"
    answers: ["va ser"]
    wrong_answers:
      - text: "sigui"
        why: "«Penso que» afirma una opinió: cal l'indicatiu. Amb «ahir», el passat: *va ser*."
      - text: "serà"
        why: "«Ahir» demana un temps passat, no el futur: *va ser*."
    grading: tolerant
    explanation: "«Penso que» afirma una opinió: el verb va en indicatiu. Amb «ahir», *va ser*."

  - id: b1-19-015
    type: fill
    point: creure-dubtar
    lesson: 2
    prompt: "No em sembla que aquesta enquesta ___ fiable."
    hint: "ser, present de subjuntiu"
    answers: ["sigui"]
    wrong_answers:
      - text: "siguin"
        why: "El subjecte és «aquesta enquesta», singular: *sigui*."
    grading: tolerant
    explanation: "«No em sembla que» expressa un dubte: el verb va en subjuntiu, *sigui*."

  - id: b1-19-016
    type: fill
    point: valorar-impersonal
    lesson: 2
    prompt: "És millor que la reunió ___ a les set."
    hint: "començar, present de subjuntiu"
    answers: ["comenci"]
    wrong_answers:
      - text: "comença"
        why: "«És millor que» és una valoració i demana subjuntiu: *comenci*."
      - text: "començarà"
        why: "Amb *és millor que* cal el subjuntiu, no el futur: *comenci*."
    grading: tolerant
    explanation: "«És millor que» és una valoració: el verb va en subjuntiu, *comenci*."

  - id: b1-19-017
    type: fill
    point: valorar-impersonal
    lesson: 2
    prompt: "Em preocupa que els lloguers ___ cada any."
    hint: "pujar, present de subjuntiu"
    answers: ["pugin"]
    wrong_answers:
      - text: "pugen"
        why: "«Em preocupa que» expressa un sentiment i demana subjuntiu: *pugin*."
      - text: "pujaran"
        why: "Amb *em preocupa que* cal el subjuntiu: *pugin*."
    grading: tolerant
    explanation: "«Em preocupa que» expressa un sentiment: el verb va en subjuntiu, *pugin*."

  - id: b1-19-018
    type: fill
    point: formes-subjuntiu
    lesson: 2
    prompt: "No crec que l'Ibrahim ___ la notícia."
    hint: "saber, present de subjuntiu"
    answers: ["sàpiga", "sàpigui"]
    wrong_answers:
      - text: "sepa"
        why: "*Sepa* és la forma castellana. De *saber*, el subjuntiu és *sàpiga* (o *sàpigui*)."
      - text: "sàpiguen"
        why: "El subjecte és «l'Ibrahim», singular: *sàpiga*."
    grading: tolerant
    explanation: "«No crec que» demana subjuntiu. De *saber*: *sàpiga* o *sàpigui*."

  - id: b1-19-019
    type: order
    point: creure-dubtar
    lesson: 2
    cue: "Digues que dubtes que hi hagi prou temps."
    chunks: ["dubto", "que", "hi", "hagi", "prou", "temps"]
    extra: ["hagis"]
    answers:
      - "Dubto que hi hagi prou temps."
    explanation: "«Dubto que» demana subjuntiu: *hi hagi*."

  - id: b1-19-020
    type: order
    point: valorar-impersonal
    lesson: 2
    cue: "Digues que et sap greu que la Montse no pugui venir."
    chunks: ["em", "sap", "greu", "que", "la", "Montse", "no", "pugui", "venir"]
    extra: ["pot"]
    answers:
      - "Em sap greu que la Montse no pugui venir."
      - "Em sap greu que no pugui venir la Montse."
    explanation: "«Em sap greu que» expressa un sentiment: el verb va en subjuntiu, *pugui*."

  - id: b1-19-021
    type: order
    point: formes-subjuntiu
    lesson: 2
    cue: "Digues que és possible que demà els transports facin vaga."
    chunks: ["és", "possible", "que", "demà", "els", "transports", "facin", "vaga"]
    extra: ["fan"]
    answers:
      - "És possible que demà els transports facin vaga."
      - "És possible que els transports facin vaga demà."
      - "Demà és possible que els transports facin vaga."
    explanation: "De *fer*, la tercera persona del plural del subjuntiu és *facin*."

  - id: b1-19-022
    type: choice
    point: creure-dubtar
    lesson: 2
    prompt: "Crec que demà la proposta ___ prou vots."
    answer: "tindrà"
    distractors:
      - text: "tingui"
        why: "Amb *crec que* afirmem una cosa: cal l'indicatiu, *tindrà*."
      - text: "tenen"
        why: "El subjecte és «la proposta», singular: *tindrà*."
    explanation: "«Crec que» afirma una opinió: el verb va en indicatiu. La votació és demà: *tindrà*."

  - id: b1-19-023
    type: choice
    point: creure-dubtar
    lesson: 2
    prompt: "No crec que el titular ___ tota la veritat."
    answer: "digui"
    distractors:
      - text: "diguin"
        why: "El subjecte és «el titular», singular: *digui*."
      - text: "diguis"
        why: "*Diguis* és de «tu»; el subjecte és «el titular»: *digui*."
    explanation: "«No crec que» expressa un dubte: el verb va en subjuntiu, *digui*."

  - id: b1-19-024
    type: choice
    point: valorar-impersonal
    lesson: 2
    prompt: "És impossible que el pont ___ llest per a l'estiu."
    answer: "estigui"
    distractors:
      - text: "està"
        why: "«És impossible que» demana subjuntiu: *estigui*."
      - text: "estarà"
        why: "Amb *és impossible que* cal el subjuntiu, encara que sigui futur: *estigui*."
    explanation: "«És impossible que» expressa un dubte: el verb va en subjuntiu, *estigui*."

  - id: b1-19-025
    type: choice
    point: valorar-impersonal
    lesson: 2
    prompt: "M'estranya que en Wei no ___ res."
    answer: "digui"
    distractors:
      - text: "diu"
        why: "«M'estranya que» demana subjuntiu: *digui*."
      - text: "dirà"
        why: "Amb *m'estranya que* cal el subjuntiu, no el futur: *digui*."
    explanation: "«M'estranya que» expressa un sentiment: el verb va en subjuntiu, *digui*."

  - id: b1-19-026
    type: choice
    point: formes-subjuntiu
    lesson: 2
    prompt: "Dubto que l'Arnau i en Pau ___ venir."
    answer: "puguin"
    distractors:
      - text: "pugui"
        why: "El subjecte són dues persones, «l'Arnau i en Pau»: *puguin*."
      - text: "puguem"
        why: "*Puguem* és de «nosaltres»; el subjecte és «l'Arnau i en Pau»: *puguin*."
    explanation: "«Dubto que» demana subjuntiu. De *poder*: *puguin*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-19-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Creo que el diari publicarà la notícia demà."
    error: "Creo"
    fix: "Crec"
    fix_distractors:
      - text: "Crei"
        why: "*Crei* no és cap forma de *creure*. La primera persona del present és *crec*."
      - text: "Creu"
        why: "*Creu* és la forma d'«ell» o «ella». Per a «jo»: *crec*."
    explanation: "*Creo* és castellà. La primera persona de *creure* és *crec*: *crec que el diari publicarà la notícia*."

  - id: b1-19-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Crec que el trànsit empitjori amb les obres."
    error: "empitjori"
    fix: "empitjorarà"
    fix_distractors:
      - text: "empitjoris"
        why: "*Empitjoris* és subjuntiu i de «tu». Amb *crec que* afirmem: indicatiu, *empitjorarà*."
      - text: "empitjorin"
        why: "*Empitjorin* és subjuntiu i plural. Amb *crec que* afirmem: indicatiu, *empitjorarà*."
    explanation: "«Crec que» afirma una opinió: el verb va en indicatiu, mai en subjuntiu. Per a un fet futur, *empitjorarà*."

  - id: b1-19-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "M'agrada que vens a les reunions del veïnat."
    error: "vens"
    fix: "vinguis"
    fix_distractors:
      - text: "vindràs"
        why: "Darrere de *m'agrada que* el verb va en subjuntiu: *vinguis*."
      - text: "venir"
        why: "Darrere de *que* cal un verb conjugat: *vinguis*."
    explanation: "«M'agrada que» demana subjuntiu: *vinguis*."

  - id: b1-19-030
    type: find-error
    point: formes-subjuntiu
    lesson: 3
    sentence: "Dubto que la Fàtima fagi la presentació."
    error: "fagi"
    fix: "faci"
    fix_distractors:
      - text: "facin"
        why: "El subjecte és «la Fàtima», singular: *faci*."
      - text: "facis"
        why: "*Facis* és de «tu»; el subjecte és «la Fàtima»: *faci*."
    explanation: "De *fer*, el subjuntiu és *faci*. *Fagi* és una forma col·loquial que la norma no admet."

  - id: b1-19-031
    type: find-error
    point: formes-subjuntiu
    lesson: 3
    sentence: "No crec que en Jordi tingui les proves."
    no_error: true
    explanation: "La frase és correcta: «no crec que» demana subjuntiu, i de *tenir* és *tingui*."

  - id: b1-19-032
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Crec que la tertúlia començarà a les nou."
    no_error: true
