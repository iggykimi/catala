  - id: b2-41-065
    type: reading
    point: comprensio
    lesson: 5
    title: "Un pressupost familiar"
    text: |
      La Núria i en Pau viuen de lloguer a Sabadell i volen comprar un pis d'aquí a dos anys. Cada diumenge fan números: miren el saldo del compte, sumen les factures i calculen quant poden estalviar. Si l'any passat haguessin portat un control així, ara tindrien un coixí més gran; però, en tot cas, diuen que mai no és tard per començar.

      El pla és senzill. Primer, retallar despeses: menys compres per internet i res a terminis, llevat que sigui imprescindible. Segon, comparar preus i proveïdors abans de contractar res: si haguessin comparat les tarifes de la llum, no haurien pagat de més durant mesos. Tercer, estalviar una quantitat fixa cada mes, tant si sobren diners com si no.

      També tenen un pla B. En cas que el banc no els doni la hipoteca, demanaran un préstec més petit i buscaran un pis més barat. I guarden tots els tiquets per si un cas: potser els caldran per a la declaració de la renda. El gestor els ha dit que, si guarden els rebuts de les obres, pagaran menys impostos.

      Aquest mes han tingut sort: el supermercat feia un descompte del vint per cent i han omplert el rebost. En Pau vol treure diners del caixer un cop per setmana i pagar en efectiu, perquè diu que així gasta menys. La Núria prefereix la targeta, però accepta el repte, sempre que ell apunti cada despesa.

      En el pitjor dels casos, esperaran un any més. Però la Núria ho té clar: «Si continuem així, d'aquí a dos anys tindrem l'entrada».
    questions:
      - prompt: "Per què fan números cada diumenge la Núria i en Pau?"
        answer: "Perquè volen estalviar per comprar un pis."
        distractors:
          - text: "Perquè el banc els ha apujat la hipoteca."
            why: "Encara no tenen hipoteca: la demanaran d'aquí a dos anys."
          - text: "Perquè volen obrir una botiga a Sabadell."
            why: "Al text no es parla d'obrir cap botiga."
      - prompt: "Què haurien fet diferent amb la tarifa de la llum?"
        answer: "Haurien comparat tarifes abans de contractar-la."
        distractors:
          - text: "Haurien pagat la factura a terminis."
            why: "A terminis no volen comprar res, llevat que sigui imprescindible."
          - text: "Haurien canviat de proveïdor cada mes."
            why: "Parlen de comparar proveïdors, no de canviar cada mes."
      - prompt: "Què faran si el banc no els dona la hipoteca?"
        answer: "Demanaran un préstec més petit i buscaran un pis més barat."
        distractors:
          - text: "Es quedaran al pis de lloguer i no faran res més."
            why: "Tenen un pla B: demanar menys diners i buscar un pis més barat."
          - text: "Pagaran l'entrada del pis amb els estalvis."
            why: "Encara no tenen l'entrada: per això estalvien cada mes."
      - prompt: "Per què guarden els tiquets?"
        answer: "Per si els calen per a la declaració de la renda."
        distractors:
          - text: "Per tornar tots els productes al supermercat."
            why: "Guarden els tiquets per precaució, no per tornar-ho tot."
          - text: "Per pagar menys al supermercat."
            why: "El descompte del supermercat no té res a veure amb els tiquets."
    explanation: "La Núria i en Pau fan un pressupost per estalviar l'entrada d'un pis, amb un pla B si el banc no els dona la hipoteca."
