id: b2-41
level: B2
title: "Condicionals complexes"
summary: "L'irreal de passat («si hagués… hauria…»), els connectors de condició amb subjuntiu i el contrast entre condició real i hipotètica, en el context de l'economia domèstica."
vocabulary_theme: "Economia, consum i pressupostos"
points:
  - id: irreal-passat
    title: "L'irreal de passat: *si hagués… hauria…*"
    refs:
      - label: "GEIEC: Les oracions condicionals"
        url: "https://geiec.iec.cat"
  - id: connectors-condicio
    title: "En cas que, sempre que, llevat que…"
    refs:
      - label: "GEIEC: Les oracions condicionals"
        url: "https://geiec.iec.cat"
  - id: condicio-real-o-hipotetica
    title: "Condició real o hipotètica: indicatiu o subjuntiu"
    refs:
      - label: "GEIEC: Les oracions condicionals"
        url: "https://geiec.iec.cat"
  - id: compte-si-hauria
    title: "Compte amb el castellà: *si hagués*, no *si hauria*"
    refs:
      - label: "Optimot: Condicionals"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions amb condició"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: l'irreal de passat i els connectors"
  - title: "Practicar l'irreal i els connectors"
  - title: "Condició real o hipotètica i el si condicional"
  - title: "Produir: reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el pressupost"
    definition: "Càlcul de quant costarà una cosa o de com es repartiran els diners."
    example: "Abans de reformar la cuina vam demanar tres pressupostos."
  - word: "l'estalvi"
    definition: "Diners que es guarden i no es gasten."
    example: "Amb l'estalvi de dos anys pagarem l'entrada del pis."
  - word: "estalviar"
    definition: "Guardar diners o gastar-ne menys."
    example: "Si cuinem a casa, estalviarem molt cada mes."
  - word: "el deute"
    definition: "Diners que es deuen a algú."
    example: "Encara té el deute de la targeta del Nadal passat."
  - word: "endeutar-se"
    definition: "Agafar deutes que després cal tornar."
    example: "Es va endeutar per comprar un cotxe massa car."
  - word: "la hipoteca"
    definition: "Préstec del banc per comprar un habitatge, que es torna a poc a poc."
    example: "La hipoteca ens puja cada cop que apugen els interessos."
  - word: "el lloguer"
    definition: "Diners que es paguen cada mes per viure en un pis que no és teu."
    example: "El lloguer de Gràcia és més car que el de Sabadell."
  - word: "la factura"
    definition: "Paper que diu quant cal pagar per un servei o un producte."
    example: "La factura de la llum d'aquest mes és altíssima."
  - word: "el rebut"
    definition: "Paper que demostra que has pagat una cosa."
    example: "Guarda el rebut per si has de tornar el producte."
  - word: "el préstec"
    definition: "Diners que el banc et deixa i que has de tornar amb interessos."
    example: "Va demanar un préstec per muntar la botiga."
  - word: "l'interès"
    definition: "Diners de més que cobra el banc per deixar-te'n."
    example: "Amb aquests interessos, el préstec surt molt car."
  - word: "la quota"
    definition: "Part fixa que es paga cada mes d'un préstec o d'un servei."
    example: "La quota del gimnàs em passa el dia u."
  - word: "el termini"
    definition: "Temps màxim per fer o pagar una cosa."
    example: "Pots pagar a terminis, però la primera quota és avui."
  - word: "el descompte"
    definition: "Rebaixa del preu d'un producte."
    example: "Amb la targeta del súper et fan un descompte del cinc per cent."
  - word: "fraccionar"
    definition: "Dividir un pagament en parts més petites."
    example: "Si no pots pagar-ho tot, pots fraccionar el rebut."
  - word: "la transferència"
    definition: "Enviament de diners d'un compte a un altre."
    example: "Et faig la transferència del lloguer demà al matí."
  - word: "el saldo"
    definition: "Diners que queden en un compte en un moment donat."
    example: "Miro el saldo al mòbil abans de comprar res car."
  - word: "gastar"
    definition: "Fer servir diners per comprar coses."
    example: "Aquest mes hem gastat massa en menjar fora de casa."
  - word: "el tiquet"
    definition: "Paper petit que dona la botiga amb el detall de la compra."
    example: "Sense el tiquet no et tornaran els diners."
  - word: "el caixer"
    definition: "Màquina per treure diners del compte."
    example: "El caixer del carrer Major no dona bitllets grans."
  - word: "apujar"
    definition: "Fer més alt un preu o una quantitat."
    example: "Cada gener apugen el preu del transport."
  - word: "el proveïdor"
    definition: "Empresa que ven un producte o un servei a una altra."
    example: "Hem canviat de proveïdor de la llum i paguem menys."
  - word: "la nòmina"
    definition: "Sou que es cobra cada mes per la feina."
    example: "Quan cobri la nòmina, pagaré totes les factures."
  - word: "l'impost"
    definition: "Diners que cal pagar a l'administració."
    example: "Amb els rebuts de les obres pagaràs menys impostos."
  - word: "la paga i senyal"
    definition: "Diners que es paguen per avançat per reservar una compra."
    example: "Per reservar el pis cal deixar la paga i senyal."
  - word: "el recàrrec"
    definition: "Diners de més que es paguen per pagar tard."
    example: "Si pagues la multa aviat, t'estalvies el recàrrec."
  - word: "el dipòsit"
    definition: "Diners que es deixen al banc durant un temps per guanyar interessos."
    example: "Si sobren diners a final de mes, els posarem en un dipòsit."
  - word: "el coixí"
    definition: "Estalvi guardat per a imprevistos (coixí d'estalvis)."
    example: "Amb un bon coixí, una avaria no et fa patir."
  - word: "la lletra petita"
    definition: "Condicions d'un contracte que s'escriuen en lletra molt petita."
    example: "Llegeix la lletra petita abans de signar res."
  - word: "el finançament"
    definition: "Diners que s'aconsegueixen per pagar un projecte."
    example: "Sense finançament, el negoci no pot créixer."
  - word: "la subscripció"
    definition: "Pagament periòdic per rebre un servei."
    example: "He anul·lat la subscripció perquè no la feia servir."
  - word: "el gestor, la gestora"
    definition: "Persona que porta els comptes i els tràmits d'altri."
    example: "El gestor ens ha dit que guardem tots els rebuts."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-41-001
    type: choice
    point: irreal-passat
    lesson: 1
    prompt: "Si ___ abans, hauríem pagat menys interessos."
    answer: "haguéssim signat"
    distractors:
      - text: "hauríem signat"
        why: "Darrere de *si* no hi va mai el condicional: cal el plusquamperfet de subjuntiu, *haguéssim signat*."
      - text: "signéssim"
        why: "L'imperfet de subjuntiu (*signéssim*) és per a la hipòtesi de present. Amb un resultat de passat (*hauríem pagat*), la condició va en plusquamperfet."
    explanation: "El resultat és de passat (*hauríem pagat*): la condició va en plusquamperfet de subjuntiu, *si haguéssim signat*."

  - id: b2-41-002
    type: choice
    point: irreal-passat
    lesson: 1
    prompt: "Si ho hagués sabut, ___ el préstec."
    answer: "no hauria acceptat"
    distractors:
      - text: "no hagi acceptat"
        why: "El perfet de subjuntiu (*hagi acceptat*) no expressa un resultat irreal: cal el condicional compost."
      - text: "no hauré acceptat"
        why: "El futur compost (*hauré acceptat*) no expressa un resultat irreal: cal el condicional compost."
    explanation: "La condició (*si ho hagués sabut*) no es va donar: el resultat va en condicional compost, *no hauria acceptat*."

  - id: b2-41-003
    type: choice
    point: connectors-condicio
    lesson: 1
    prompt: "___ que pugin els tipus d'interès, revisarem la hipoteca."
    answer: "En cas"
    distractors:
      - text: "En cas de"
        why: "Davant de *que* cau la preposició: *en cas que*, no *en cas de que*."
      - text: "Per cas"
        why: "*Per cas* no és un connector condicional: la forma fixa és *en cas que*."
    explanation: "Per plantejar una hipòtesi fem servir *en cas que* + subjuntiu (*pugin*)."

  - id: b2-41-004
    type: choice
    point: connectors-condicio
    lesson: 1
    prompt: "Pots pagar a terminis ___ que paguis la primera quota avui."
    answer: "sempre"
    distractors:
      - text: "sempre quan"
        why: "*Sempre que*, sense *quan*. *Sempre quan* no existeix."
      - text: "sempre de"
        why: "Davant de *que* no hi va cap preposició: *sempre que*."
    explanation: "«Sempre amb la condició que» s'expressa amb *sempre que* + subjuntiu (*paguis*)."

  - id: b2-41-005
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «per si un cas»?"
    answer: "Per precaució, davant d'una cosa que podria passar."
    distractors:
      - text: "Que una cosa és segura al cent per cent."
        why: "És el contrari: es fa servir quan una cosa només és possible."
      - text: "Que dues coses passen alhora."
        why: "Aquesta expressió no parla de simultaneïtat: anuncia una precaució."
    explanation: "«Per si un cas» anuncia una precaució: *Guarda els tiquets per si un cas*."

  - id: b2-41-006
    type: match
    point: irreal-passat
    lesson: 1
    instruction: "Relaciona cada infinitiu amb el plusquamperfet de subjuntiu (jo)."
    pairs:
      - ["tenir", "hagués tingut"]
      - ["ser", "hagués estat"]
      - ["poder", "hagués pogut"]
      - ["fer", "hagués fet"]
    explanation: "El plusquamperfet de subjuntiu es forma amb *hagués* + participi: *hagués tingut*, *hagués estat*, *hagués pogut*, *hagués fet*."

  - id: b2-41-007
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["si no és que", "excepte si es dona una condició"]
      - ["tant si… com si no", "en tots dos casos, passi el que passi"]
      - ["per si un cas", "per precaució, davant d'una cosa possible"]
      - ["en tot cas", "de tota manera"]
      - ["en el pitjor dels casos", "si tot va malament"]
    explanation: "Són expressions per parlar de condicions i precaucions."

  - id: b2-41-008
    type: inline-choice
    point: irreal-passat
    lesson: 1
    title: "Una hipoteca cara"
    text: "Si {haguéssim|hauríem} llegit la lletra petita, {hauríem|haurem} vist la comissió d'obertura. Si {hagués|hauria} parlat amb el gestor, m'{hauria|haurà} explicat les condicions."
    explanation: "Darrere de *si*, plusquamperfet de subjuntiu (*haguéssim llegit*, *hagués parlat*); al resultat, condicional compost (*hauríem vist*, *m'hauria explicat*)."

  - id: b2-41-009
    type: inline-choice
    point: connectors-condicio
    lesson: 1
    title: "Avís del banc"
    text: "{En cas|Per cas} que {vulguis|vols} fraccionar el rebut, truca'ns. Pots pagar a terminis {sempre|sovint} que avisis abans del dia cinc. No cal que vinguis, {tret|traient} que prefereixis signar en persona."
    explanation: "Els connectors de condició van amb subjuntiu: *en cas que vulguis*, *sempre que avisis*, *tret que prefereixis*."

  - id: b2-41-010
    type: fill
    point: irreal-passat
    lesson: 1
    prompt: "Si ___ cada mes, ara no tindríem deutes."
    hint: "estalviar, plusquamperfet de subjuntiu, nosaltres"
    answers: ["haguéssim estalviat"]
    wrong_answers:
      - text: "hauríem estalviat"
        why: "Darrere de *si* no hi va mai el condicional: *si haguéssim estalviat*."
    grading: tolerant
    explanation: "La condició és passada i no es va complir (no vam estalviar): plusquamperfet, *si haguéssim estalviat*. El resultat és de present: *ara no tindríem*."

  - id: b2-41-011
    type: fill
    point: connectors-condicio
    lesson: 1
    prompt: "No signis el contracte ___ que l'hagi revisat l'advocada."
    hint: "connector que vol dir «excepte si»"
    answers: ["llevat", "tret", "si no és", "fora", "excepte"]
    wrong_answers:
      - text: "llevat de"
        why: "Davant de *que* no hi va cap preposició: *llevat que*."
      - text: "tret de"
        why: "Davant de *que* no hi va cap preposició: *tret que*."
    grading: tolerant
    explanation: "«Excepte si» s'expressa amb *llevat que*, *tret que* o *si no és que* + subjuntiu (*hagi revisat*)."

  - id: b2-41-012
    type: order
    point: irreal-passat
    lesson: 1
    cue: "Digues que, si haguessis comparat preus, hauries estalviat molt."
    chunks: ["Si haguessis comparat preus", "hauries estalviat", "molt"]
    extra: ["hauries comparat"]
    answers:
      - "Si haguessis comparat preus, hauries estalviat molt."
      - "Hauries estalviat molt si haguessis comparat preus."
    explanation: "La condició (*si haguessis comparat*) va en plusquamperfet de subjuntiu i el resultat (*hauries estalviat*), en condicional compost."

  - id: b2-41-013
    type: choice
    point: connectors-condicio
    lesson: 1
    prompt: "___ que estalviïs cent euros al mes, en un any tindràs un bon coixí."
    answer: "Només"
    distractors:
      - text: "Només de"
        why: "La forma fixa és *només que*, sense preposició."
      - text: "Només si"
        why: "*Només si* no porta *que*: *només si estalvies*. Davant de *que* + subjuntiu (*estalviïs*), cal *només que*."
    explanation: "«Amb aquesta única condició» s'expressa amb *només que* + subjuntiu: *només que estalviïs…*"

  # ---------- Lliçó 2 ----------
  - id: b2-41-014
    type: fill
    point: irreal-passat
    lesson: 2
    prompt: "Sense la teva ajuda, jo no ___ el deute a temps."
    hint: "pagar, condicional compost"
    answers: ["hauria pagat", "hagués pagat"]
    wrong_answers:
      - text: "hauré pagat"
        why: "El futur compost no expressa un resultat irreal: cal el condicional compost, *hauria pagat*."
    grading: tolerant
    explanation: "El resultat d'una condició que no es va donar va en condicional compost: *no hauria pagat*. També s'admet el plusquamperfet de subjuntiu, *no hagués pagat*."

  - id: b2-41-015
    type: fill
    point: irreal-passat
    lesson: 2
    prompt: "Si m'___ del càrrec, no hauria patit."
    hint: "avisar, plusquamperfet de subjuntiu, tu"
    answers: ["haguessis avisat"]
    wrong_answers:
      - text: "hauries avisat"
        why: "Darrere de *si* no hi va mai el condicional: *si m'haguessis avisat*."
    grading: tolerant
    explanation: "«Si m'haguessis avisat» és la condició de passat que no es va donar: plusquamperfet de subjuntiu."

  - id: b2-41-016
    type: fill
    point: connectors-condicio
    lesson: 2
    prompt: "Sempre que el producte ___ cap defecte, et tornarem els diners."
    hint: "tenir, present de subjuntiu"
    answers: ["tingui"]
    wrong_answers:
      - text: "té"
        why: "*Sempre que* va amb subjuntiu (*tingui*), no amb indicatiu."
    grading: tolerant
    explanation: "Els connectors de condició van amb subjuntiu: *sempre que tingui…*"

  - id: b2-41-017
    type: fill
    point: connectors-condicio
    lesson: 2
    prompt: "No et cobrarem res, ___ que anul·lis la reserva a última hora: llavors pagues la primera nit."
    hint: "connector que vol dir «excepte si»"
    answers: ["llevat", "tret", "si no és", "fora", "excepte"]
    wrong_answers:
      - text: "sempre"
        why: "Amb *sempre que* la frase voldria dir el contrari. «Excepte si» és *llevat que* o *tret que*."
    grading: tolerant
    explanation: "«Excepte si» s'expressa amb *llevat que*, *tret que* o *si no és que* + subjuntiu (*anul·lis*)."

  - id: b2-41-018
    type: order
    point: irreal-passat
    lesson: 2
    cue: "Digues que tindries estalvis si no haguessis gastat tant."
    chunks: ["Si no haguessis gastat tant", "tindries", "estalvis"]
    extra: ["tindràs"]
    answers:
      - "Si no haguessis gastat tant, tindries estalvis."
      - "Tindries estalvis si no haguessis gastat tant."
    explanation: "Una condició de passat (*si no haguessis gastat*) pot tenir un resultat de present (*tindries estalvis*)."

  - id: b2-41-019
    type: order
    point: connectors-condicio
    lesson: 2
    cue: "Digues que, si perdo la feina, no podré pagar el lloguer."
    chunks: ["En cas que perdi la feina", "no podré", "pagar el lloguer"]
    extra: ["perdré"]
    answers:
      - "En cas que perdi la feina, no podré pagar el lloguer."
      - "No podré pagar el lloguer en cas que perdi la feina."
    explanation: "«Si perds la feina» com a hipòtesi formal: *en cas que perdi la feina* + futur (*no podré pagar*)."

  - id: b2-41-020
    type: choice
    point: irreal-passat
    lesson: 2
    prompt: "Si ___ la lletra petita ahir, no hauríem signat."
    answer: "haguéssim llegit"
    distractors:
      - text: "hauríem llegit"
        why: "Darrere de *si* no hi va mai el condicional."
      - text: "llegíssim"
        why: "«Ahir» situa la condició en passat: cal el plusquamperfet (*haguéssim llegit*), no l'imperfet."
    explanation: "Amb el marcador «ahir» i un resultat de passat (*no hauríem signat*), la condició va en plusquamperfet."

  - id: b2-41-021
    type: choice
    point: connectors-condicio
    lesson: 2
    prompt: "___ que el banc aprovi el préstec, signarem l'escriptura d'aquí a deu dies."
    answer: "En cas"
    distractors:
      - text: "En cas de"
        why: "Davant de *que* cau la preposició: *en cas que*."
      - text: "Si"
        why: "*Si que el banc aprovi* no existeix: *si* no porta *que* i, en una condició possible, va amb indicatiu: *si el banc aprova*."
    explanation: "La hipòtesi amb subjuntiu (*aprovi*) demana un connector com *en cas que*."

  - id: b2-41-022
    type: choice
    point: irreal-passat
    lesson: 2
    prompt: "Els meus pares ___ el pis si els preus no haguessin pujat tant."
    answer: "haurien venut"
    distractors:
      - text: "hagin venut"
        why: "El perfet de subjuntiu (*hagin venut*) no expressa un resultat irreal: cal el condicional compost."
      - text: "hauran venut"
        why: "El futur compost no expressa un resultat irreal: cal el condicional compost."
    explanation: "La condició no es va donar (els preus van pujar): el resultat va en condicional compost, *haurien venut*."

  - id: b2-41-023
    type: fill
    point: connectors-condicio
    lesson: 2
    prompt: "En cas que ___ canviar de tarifa, truca'ns abans de divendres."
    hint: "voler, present de subjuntiu, tu"
    answers: ["vulguis"]
    wrong_answers:
      - text: "vols"
        why: "*En cas que* va amb subjuntiu (*vulguis*), no amb indicatiu."
    grading: tolerant
    explanation: "Darrere de *en cas que* el verb va en subjuntiu: *en cas que vulguis…*"

  - id: b2-41-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Guarda els tiquets ___: potser els necessitaràs per a la declaració."
    answer: "per si un cas"
    distractors:
      - text: "si no és que"
        why: "*Si no és que* introdueix una excepció i necessita una frase darrere. Aquí cal una precaució: *per si un cas*."
      - text: "tant si com si no"
        why: "L'expressió completa és *tant si* + verb + *com si no*. Aquí cal una precaució: *per si un cas*."
    explanation: "«Per si un cas» anuncia una precaució davant d'una cosa que pot passar: potser necessitaràs els tiquets."

  - id: b2-41-025
    type: fill
    point: irreal-passat
    lesson: 2
    prompt: "T'ho ___ abans, però no tenia el teu número."
    hint: "dir, condicional compost, jo"
    answers: ["hauria dit", "hagués dit"]
    wrong_answers:
      - text: "hauré dit"
        why: "El futur compost no expressa un resultat irreal: cal el condicional compost, *hauria dit*."
    grading: tolerant
    explanation: "No t'ho vaig dir (no tenia el número): el resultat irreal va en condicional compost, *t'ho hauria dit*. També s'admet *t'ho hagués dit*."

  - id: b2-41-026
    type: choice
    point: connectors-condicio
    lesson: 2
    prompt: "Pots quedar-te el canvi ___ que siguin menys de cinc euros; si són més, me'l tornes."
    answer: "sempre"
    distractors:
      - text: "sempre quan"
        why: "*Sempre que*, sense *quan*."
      - text: "sempre de"
        why: "Davant de *que* no hi va cap preposició: *sempre que*."
    explanation: "«Sempre amb la condició que» s'expressa amb *sempre que* + subjuntiu (*siguin*)."

  # ---------- Lliçó 3 ----------
  - id: b2-41-027
    type: choice
    point: condicio-real-o-hipotetica
    lesson: 3
    prompt: "Si ___ diners a final de mes, els posarem en un dipòsit."
    answer: "sobren"
    distractors:
      - text: "sobrin"
        why: "*Si* de condició real va amb indicatiu (*sobren*), no amb subjuntiu."
      - text: "sobrarien"
        why: "Darrere de *si* no hi va mai el condicional."
    explanation: "És una condició possible: *si* + present d'indicatiu (*sobren*) + futur (*posarem*)."

  - id: b2-41-028
    type: choice
    point: condicio-real-o-hipotetica
    lesson: 3
    prompt: "___ vols estalviar de debò, has de fer un pressupost mensual."
    answer: "Si"
    distractors:
      - text: "En cas que"
        why: "*En cas que* va amb subjuntiu (*vulguis*), no amb indicatiu (*vols*)."
      - text: "Sempre quan"
