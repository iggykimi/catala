    type: find-error
    point: compte-castella
    lesson: 5
    sentence: "Si vols donar sang, tens que tenir més de divuit anys."
    error: "tens que tenir"
    fix: "has de tenir"
    fix_distractors:
      - text: "has tenir"
        why: "Falta la preposició *de*: *has de tenir*."
      - text: "hi ha que tenir"
        why: "*Hi ha que* és un calc de «hay que». Aquí parles amb una persona: *has de tenir*."
    explanation: "És una condició obligatòria en segona persona: *has de* + infinitiu. *Tenir que* és un calc de «tener que»."

  - id: b1-24-059
    type: find-error
    point: estar-continuar-gerundi
    lesson: 5
    sentence: "L'Arnau està fent repòs a casa: té la grip."
    no_error: true
    explanation: "La frase és correcta: és una acció en curs (*estar* + gerundi) i *fer repòs* vol dir descansar per posar-se bo."

  - id: b1-24-060
    type: match
    point: perifrasis-fase
    lesson: 5
    instruction: "Relaciona cada perífrasi amb el seu ús."
    pairs:
      - ["acabar de + infinitiu", "una cosa que ha passat fa molt poc"]
      - ["estar a punt de + infinitiu", "una cosa que passarà d'aquí a molt poc"]
      - ["tornar a + infinitiu", "una cosa que es repeteix"]
      - ["posar-se a + infinitiu", "l'inici d'una acció"]
    explanation: "Cada perífrasi situa l'acció en el temps: fa poc, d'aquí a poc, una altra vegada o a l'inici."

  - id: b1-24-061
    type: choice
    point: expressions
    lesson: 5
    prompt: "—L'Arnau encara té la grip? —No, ja ___."
    answer: "s'ha posat bo"
    distractors:
      - text: "s'ha trobat malament"
        why: "*Trobar-se malament* vol dir sentir-se malalt, al contrari de «ja no té la grip»: *s'ha posat bo*."
      - text: "fa repòs"
        why: "*Fer repòs* és descansar perquè encara estàs malalt; «No» vol dir que ja no té la grip: *s'ha posat bo*."
    explanation: "*Posar-se bo* vol dir recuperar la salut: *L'Arnau ja s'ha posat bo*."

  - id: b1-24-062
    type: fill
    point: expressions
    lesson: 5
    prompt: "Després de dotze hores d'urgències, la infermera ___."
    hint: "*estar fet pols*, ella"
    answers: ["està feta pols"]
    wrong_answers:
      - text: "està fet pols"
        why: "«La infermera» és femení: *feta pols*."
      - text: "està com una rosa"
        why: "*Estar com una rosa* és tenir molt bon aspecte; després de dotze hores, la infermera *està feta pols*."
    grading: tolerant
    explanation: "*Estar fet pols* descriu un cansament extrem i concorda: *la infermera està feta pols*."

  - id: b1-24-063
    type: choice
    point: expressions
    lesson: 5
    prompt: "«Després d'una setmana de vacances, la Montse està com una rosa.» Què vol dir?"
    answer: "Que té molt bon aspecte i salut."
    distractors:
      - text: "Que s'ha posat vermella com una rosa."
        why: "No parla del color: *estar com una rosa* vol dir tenir molt bona salut."
      - text: "Que està cansada de tant descansar."
        why: "Al contrari: *estar com una rosa* vol dir estar ple d'energia i salut."
    explanation: "*Estar com una rosa* vol dir tenir molt bon aspecte i salut."

  - id: b1-24-064
    type: order
    point: expressions
    lesson: 5
    cue: "Digues que et trobes malament i que vas al metge."
    chunks: ["em", "trobo", "malament", "i", "vaig", "al", "metge"]
    extra: ["me"]
    answers:
      - "Em trobo malament i vaig al metge."
    explanation: "*Trobar-se malament* vol dir sentir-se malalt. És pronominal: *em trobo malament*."

  - id: b1-24-065
    type: fill
    point: perifrasis-fase
    lesson: 5
    prompt: "Ahir va fer deu passes amb crosses i avui el pacient ja ___ a caminar tot sol."
    hint: "*tornar a*, ell (present)"
    answers: ["torna"]
    wrong_answers:
      - text: "acaba"
        why: "*Acabar* va amb *de*, no amb *a*."
      - text: "segueix"
        why: "*Seguir* va amb gerundi (*segueix caminant*); aquí l'acció es repeteix: *torna a caminar*."
    grading: tolerant
    explanation: "El pacient recupera una cosa que feia abans, caminar sol: *tornar a* + infinitiu."
