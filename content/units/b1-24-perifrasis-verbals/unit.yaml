id: b1-24
level: B1
title: "Perífrasis verbals"
summary: "Aprens a distingir l'obligació (*has de*) de la probabilitat (*deu ser*), a situar l'acció en el temps (*acabar de*, *estar a punt de*, *tornar a*, *posar-se a*) i a descriure accions en curs (*estar* i *continuar* + gerundi)."
vocabulary_theme: "Salut, metge i farmàcia"
points:
  - id: obligacio-probabilitat
    title: "*Haver de* (obligació) i *deure* (probabilitat)"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: perifrasis-fase
    title: "*Acabar de*, *estar a punt de*, *tornar a* i *posar-se a*"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: estar-continuar-gerundi
    title: "*Estar* i *continuar* + gerundi"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *deu ser* és probabilitat"
  - id: expressions
    title: "Expressions de salut"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: obligació, probabilitat i fases"
  - title: "Practicar les perífrasis"
  - title: "El gerundi i les interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el metge, la metgessa"
    definition: "Persona que diagnostica i cura les malalties."
    example: "El metge m'ha dit que faci repòs tres dies."
  - word: "l'infermer, la infermera"
    definition: "Persona que té cura dels malalts a l'hospital o al CAP."
    example: "La infermera em va prendre la tensió."
  - word: "el pacient, la pacient"
    definition: "Persona malalta que un metge visita o tracta."
    example: "Els pacients esperen el seu torn a la sala d'espera."
  - word: "el CAP"
    definition: "Centre d'atenció primària: l'ambulatori del barri."
    example: "Vaig al CAP a buscar la recepta."
  - word: "les urgències"
    definition: "Servei de l'hospital per als casos greus i immediats."
    example: "Si empitjores aquesta nit, ves a urgències."
  - word: "la sala d'espera"
    definition: "Sala on els pacients esperen el seu torn."
    example: "La sala d'espera era plena de gent."
  - word: "la consulta"
    definition: "Despatx on el metge visita els pacients."
    example: "El metge em rep a la consulta dos."
  - word: "demanar hora"
    definition: "Concertar una visita amb el metge."
    example: "He demanat hora per dimarts al matí."
  - word: "la recepta mèdica"
    definition: "Paper del metge que diu quins medicaments has de prendre."
    example: "El farmacèutic em va demanar la recepta mèdica."
  - word: "el medicament"
    definition: "Producte que serveix per curar una malaltia."
    example: "Aquest medicament s'ha de prendre amb menjar."
  - word: "la pastilla"
    definition: "Petit medicament rodó que es pren amb aigua."
    example: "Em prenc una pastilla per al mal de cap."
  - word: "el xarop"
    definition: "Líquid dolç que és un medicament, sobretot per a la tos."
    example: "El nen pren una cullerada de xarop cada vuit hores."
  - word: "la dosi"
    definition: "Quantitat exacta d'un medicament que s'ha de prendre."
    example: "No passis mai de la dosi del prospecte."
  - word: "el prospecte"
    definition: "Paper que explica com s'ha de prendre un medicament."
    example: "Llegeix el prospecte abans de prendre-te'l."
  - word: "la farmàcia"
    definition: "Botiga on es venen medicaments."
    example: "La farmàcia de guàrdia és a la plaça."
  - word: "el farmacèutic, la farmacèutica"
    definition: "Persona que prepara i ven medicaments a la farmàcia."
    example: "La farmacèutica m'ha recomanat un xarop suau."
  - word: "la febre"
    definition: "Temperatura del cos més alta del normal."
    example: "Si tens més de 38 graus, tens febre."
  - word: "la tensió"
    definition: "La pressió de la sang."
    example: "La infermera em pren la tensió cada visita."
  - word: "el termòmetre"
    definition: "Aparell per mesurar la temperatura del cos."
    example: "Posa't el termòmetre i espera dos minuts."
  - word: "la tos"
    definition: "Soroll fort que fem amb la gola quan estem refredats."
    example: "Aquest xarop em calma la tos."
  - word: "el refredat"
    definition: "Malaltia lleu amb tos i mal de coll."
    example: "Amb aquest fred agafaré un refredat."
  - word: "la grip"
    definition: "Malaltia amb febre alta i dolor a tot el cos."
    example: "Amb la grip, cal fer repòs uns dies."
  - word: "el dolor"
    definition: "Mal que se sent en una part del cos."
    example: "Tinc un dolor al genoll quan pujo escales."
  - word: "el mal de cap"
    definition: "Dolor a l'interior del cap."
    example: "Amb aquest soroll em vindrà mal de cap."
  - word: "el mal de coll"
    definition: "Dolor a la gola quan menges o beus."
    example: "Beu llet amb mel per al mal de coll."
  - word: "la ferida"
    definition: "Tall obert a la pell."
    example: "Renta't la ferida amb aigua i sabó."
  - word: "la bena"
    definition: "Tira de roba que tapa una ferida."
    example: "La infermera li va posar una bena al braç."
  - word: "l'esparadrap"
    definition: "Cinta que enganxa la bena a la pell."
    example: "Posa't un trosset d'esparadrap a la ferida."
  - word: "el símptoma"
    definition: "Senyal d'una malaltia, com la febre o la tos."
    example: "El primer símptoma va ser el mal de cap."
  - word: "el diagnòstic"
    definition: "Nom de la malaltia que diu el metge després de visitar-te."
    example: "El diagnòstic és clar: és un virus."
  - word: "el tractament"
    definition: "Medicaments i cures per a una malaltia."
    example: "El tractament dura deu dies."
  - word: "tossir"
    definition: "Fer aquell soroll fort amb la gola quan estem refredats."
    example: "Tapeu-vos la boca quan tossiu."
  - word: "sagnar"
    definition: "Perdre sang d'una ferida o del nas."
    example: "M'he tallat i em sagna el dit."
  - word: "reposar"
    definition: "Descansar per recuperar la salut."
    example: "El metge m'ha dit que reposi una setmana."
  - word: "la vacuna"
    definition: "Punxada que protegeix d'una malaltia."
    example: "A la tardor em poso la vacuna de la grip."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-24-001
    type: choice
    point: obligacio-probabilitat
    lesson: 1
    prompt: "La Montse està constipada. El metge diu que ___ reposar tres dies."
    answer: "ha de"
    distractors:
      - text: "té que"
        why: "*Tenir que* és un calc de «tener que». L'obligació és *haver de*: *ha de reposar*."
      - text: "ha"
        why: "*Haver de* porta sempre la preposició *de*: *ha de reposar*."
    explanation: "«La Montse» és tercera persona i és una obligació del metge: *ha de* + infinitiu."

  - id: b1-24-002
    type: choice
    point: obligacio-probabilitat
    lesson: 1
    prompt: "—La Núria no contesta el mòbil. —___ ser a la consulta, sense cobertura."
    answer: "Deu"
    distractors:
      - text: "Té que"
        why: "*Tenir que* és un calc de «tener que». I aquí no és una obligació, sinó una suposició: *deu ser*."
      - text: "Va"
        why: "*Va ser* és passat (*ahir va ser*). Aquí és una suposició sobre ara: *deu ser*."
    explanation: "És una suposició, no una obligació: *deure* + infinitiu, sense *de*."

  - id: b1-24-003
    type: choice
    point: obligacio-probabilitat
    lesson: 1
    prompt: "«Deuen tenir la grip, tots dos.» Què vol dir?"
    answer: "Que probablement tenen la grip."
    distractors:
      - text: "Que el metge els obliga a tenir la grip."
        why: "*Deure* aquí expressa probabilitat, no una ordre del metge: probablement tenen la grip."
      - text: "Que volen tenir la grip."
        why: "*Deure* no expressa un desig, sinó una probabilitat: probablement tenen la grip."
    explanation: "*Deure* + infinitiu expressa probabilitat: *deuen tenir* = probablement tenen."

  - id: b1-24-004
    type: choice
    point: perifrasis-fase
    lesson: 1
    prompt: "—On és en Pau? —___ de sortir cap a la farmàcia."
    answer: "Acaba"
    distractors:
      - text: "Torna"
        why: "*Tornar* va amb *a*: *torna a sortir*. A més, aquí ha sortit fa un moment: *acaba de sortir*."
      - text: "Posa"
        why: "L'inici d'una acció és *posar-se a*, amb *a* i amb pronom: *es posa a sortir*."
    explanation: "Després del buit hi ha *de*: dels tres verbs, només *acabar* va amb *de* (*acaba de sortir* = ha sortit fa un moment)."

  - id: b1-24-005
    type: choice
    point: perifrasis-fase
    lesson: 1
    prompt: "La infermera ens diu que esperem: el metge ___ rebre'ns."
    answer: "està a punt de"
    distractors:
      - text: "acaba de"
        why: "*Acabar de* vol dir que ja ha passat; «ens diu que esperem» vol dir que encara no: *està a punt de*."
      - text: "es posa de"
        why: "*Posar-se* va amb *a*, no amb *de*. I aquí falta molt poc: *està a punt de*."
    explanation: "«Ens diu que esperem» vol dir que encara no ha passat: *estar a punt de* + infinitiu."

  - id: b1-24-006
    type: choice
    point: perifrasis-fase
    lesson: 1
    prompt: "L'Ibrahim ___ febre: és el tercer cop aquesta setmana."
    answer: "ha tornat a tenir"
    distractors:
      - text: "ha tornat de tenir"
        why: "*Tornar* va amb *a*, no amb *de*: *ha tornat a tenir*."
      - text: "ha acabat a tenir"
        why: "*Acabar* va amb *de*, no amb *a*. I aquí l'acció es repeteix: *ha tornat a tenir*."
    explanation: "«És el tercer cop» indica una repetició: *tornar a* + infinitiu. *Tornar* va amb *a*; *acabar*, amb *de*."

  - id: b1-24-007
    type: choice
    point: perifrasis-fase
    lesson: 1
    prompt: "Quan la infermera li va treure la bena i l'esparadrap d'una revolada, la nena ___ plorar."
    answer: "es va posar a"
    distractors:
      - text: "va acabar de"
        why: "*Va acabar de plorar* vol dir que ja ha plorat; aquí comença a plorar: *es va posar a*."
      - text: "va tornar de"
        why: "*Tornar* va amb *a*. I aquí no es repeteix, sinó que comença: *es va posar a plorar*."
    explanation: "Treure la bena d'una revolada fa mal: la nena comença a plorar. L'inici és *posar-se a* + infinitiu."

  - id: b1-24-008
    type: inline-choice
    point: perifrasis-fase
    lesson: 1
    title: "Un missatge de la Carla"
    text: "Hola, Laia! Perdona que no t'hagi trucat abans, però jo {acabo|acaba|acaben} de sortir del CAP i {estic|està|estan} a punt de pujar a l'autobús. M'he trobat fatal aquest matí i {m'he posat a|m'he posat de|he tornat de} tremolar a la feina. El metge diu que no és greu, però que si {torno a|torno de|acabo a} tenir febre, hi he de tornar demà. Ja et truco!"
    explanation: "«Perdona que no t'hagi trucat… però jo» fixa la primera persona: *acabo*, *estic*. L'inici és *posar-se a*; la repetició, *tornar a*: les preposicions són *a*."

  - id: b1-24-009
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["estar fet pols", "estar molt cansat o esgotat"]
      - ["trobar-se malament", "sentir-se malalt"]
      - ["posar-se bo", "recuperar la salut"]
      - ["estar com una rosa", "tenir molt bon aspecte i salut"]
    explanation: "Són expressions de salut: *fet pols* és cansament extrem, *trobar-se malament* és sentir-se malalt, *posar-se bo* és curar-se i *com una rosa* és tenir molt bon aspecte."

  - id: b1-24-010
    type: fill
    point: obligacio-probabilitat
    lesson: 1
    prompt: "La Fàtima té tos i febre. Demà ___ al CAP."
    hint: "*haver de*, ella"
    answers: ["ha d'anar"]
    wrong_answers:
      - text: "té que anar"
        why: "*Tenir que* és un calc de «tener que»: *ha d'anar*."
      - text: "ha anar"
        why: "Falta la preposició *de*: *ha d'anar*."
    grading: tolerant
    explanation: "És una obligació en tercera persona: *ha de* + infinitiu. Davant de vocal, *de* s'apostrofa: *ha d'anar*."

  - id: b1-24-011
    type: fill
    point: perifrasis-fase
    lesson: 1
    prompt: "L'Arnau ___ de prendre's la pastilla: encara té el got a la mà."
    hint: "*acabar de*, ell (present)"
    answers: ["acaba"]
    wrong_answers:
      - text: "torna"
        why: "*Tornar* va amb *a*: *torna a prendre's*. Aquí ha passat fa un moment: *acaba de prendre's*."
      - text: "posa"
        why: "*Posar-se* va amb *a* i porta pronom: *es posa a prendre's*. Aquí ha passat fa un moment: *acaba de*."
    grading: tolerant
    explanation: "«Encara té el got a la mà» vol dir que ha passat fa un moment: *acabar de* + infinitiu."

  - id: b1-24-012
    type: order
    point: obligacio-probabilitat
    lesson: 1
    cue: "Digues que probablement el Wei és a la farmàcia."
    chunks: ["el", "Wei", "deu", "ser", "a", "la", "farmàcia"]
    extra: ["hi"]
    answers:
      - "El Wei deu ser a la farmàcia."
    explanation: "És una suposició sobre el Wei: *deure* + infinitiu, sense *de*. En singular: *deu ser*."

  - id: b1-24-013
    type: order
    point: perifrasis-fase
    lesson: 1
    cue: "Digues que la Carla ha començat a prendre el xarop."
    chunks: ["la", "Carla", "s'ha", "posat", "a", "prendre", "el", "xarop"]
    extra: ["de"]
    answers:
      - "La Carla s'ha posat a prendre el xarop."
    explanation: "Començar una acció és *posar-se a* + infinitiu, amb *a* i amb pronom: *s'ha posat a prendre*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-24-014
    type: fill
    point: obligacio-probabilitat
    lesson: 2
    prompt: "Tens la tensió alta: ___ menjar sense sal."
    hint: "*haver de*, tu"
    answers: ["has de"]
    wrong_answers:
      - text: "tens que"
        why: "*Tenir que* és un calc de «tener que»: *has de menjar*."
      - text: "has"
        why: "Falta la preposició *de*: *has de menjar*."
    grading: tolerant
    explanation: "És una ordre del metge en segona persona: *has de* + infinitiu."

  - id: b1-24-015
    type: fill
    point: obligacio-probabilitat
    lesson: 2
    prompt: "En Pau i la Núria no hi són: ___ ser a urgències."
    hint: "*deure*, ells (present)"
    answers: ["deuen"]
    wrong_answers:
      - text: "deven"
        why: "Aquesta forma no existeix: la tercera persona del plural és *deuen*."
      - text: "tenen que"
        why: "*Tenir que* és un calc. I aquí no és una obligació, sinó una suposició: *deuen ser*."
    grading: tolerant
    explanation: "És una suposició en plural: *deure* + infinitiu. La tercera persona del plural és *deuen*."

  - id: b1-24-016
    type: fill
    point: perifrasis-fase
    lesson: 2
    prompt: "Els pacients ___ passar a la consulta: són els següents de la llista."
    hint: "*estar a punt de*, ells (present)"
    answers: ["estan a punt de"]
    wrong_answers:
      - text: "estan a punt a"
        why: "*Estar a punt de* porta *de*, no *a*."
      - text: "acaben de"
        why: "*Acabar de* vol dir que ja ha passat; «són els següents» vol dir que encara no: *estan a punt de*."
    grading: tolerant
    explanation: "«Són els següents» vol dir que encara no han passat: *estar a punt de* + infinitiu."

  - id: b1-24-017
    type: fill
    point: perifrasis-fase
    lesson: 2
    prompt: "La Montse es trobava bé, però ___ a tenir febre per segon cop."
    hint: "*tornar a*, ella (passat perifràstic)"
    answers: ["va tornar"]
    wrong_answers:
      - text: "va acabar"
        why: "*Acabar* va amb *de*, no amb *a*."
      - text: "es va posar"
        why: "*Posar-se a* marca l'inici; «per segon cop» indica una repetició: *va tornar a*."
    grading: tolerant
    explanation: "«Per segon cop» indica una repetició en passat: *tornar a* + infinitiu. En perifràstic: *va tornar a*."

  - id: b1-24-018
    type: fill
    point: perifrasis-fase
    lesson: 2
    prompt: "En sentir el diagnòstic, el noi ___ plorar."
    hint: "*posar-se a*, ell (passat perifràstic)"
    answers: ["es va posar a", "va posar-se a"]
    wrong_answers:
      - text: "es va posar de"
        why: "*Posar-se* va amb *a*, no amb *de*: *es va posar a plorar*."
      - text: "va tornar a"
        why: "*Tornar a* vol dir «una altra vegada»; aquí comença a plorar: *es va posar a plorar*."
    grading: tolerant
    explanation: "«En sentir el diagnòstic» marca l'inici: *posar-se a* + infinitiu. En passat: *es va posar a*."

  - id: b1-24-019
    type: order
    point: obligacio-probabilitat
    lesson: 2
    cue: "Digues que la Laia ha de demanar hora per dijous."
    chunks: ["la", "Laia", "ha", "de", "demanar", "hora", "per", "dijous"]
    extra: ["que"]
    answers:
      - "La Laia ha de demanar hora per dijous."
      - "Per dijous la Laia ha de demanar hora."
    explanation: "L'obligació en tercera persona és *ha de* + infinitiu: *La Laia ha de demanar hora*."

  - id: b1-24-020
    type: order
    point: perifrasis-fase
    lesson: 2
    cue: "Digues que acabes de parlar amb el metge."
    chunks: ["acabo", "de", "parlar", "amb", "el", "metge"]
    extra: ["a"]
    answers:
      - "Acabo de parlar amb el metge."
    explanation: "*Acabar de* indica que ha passat fa molt poc: *acabo de parlar amb el metge*."

  - id: b1-24-021
    type: order
    point: perifrasis-fase
    lesson: 2
    cue: "Digues que estan a punt de tancar la farmàcia."
    chunks: ["estan", "a", "punt", "de", "tancar", "la", "farmàcia"]
    extra: ["per"]
    answers:
      - "Estan a punt de tancar la farmàcia."
    explanation: "Que falta molt poc és *estar a punt de* + infinitiu. La preposició és *de*: *estan a punt de tancar*."

  - id: b1-24-022
    type: choice
    point: perifrasis-fase
    lesson: 2
    prompt: "El metge ___ visitar-te: ja t'ha cridat pel teu nom."
    answer: "està a punt de"
    distractors:
      - text: "acaba de"
        why: "*Acabar de* vol dir que ja t'ha visitat; «ja t'ha cridat» vol dir que encara no: *està a punt de*."
      - text: "ha tornat a"
        why: "*Ha tornat a visitar-te* vol dir que ja t'havia visitat abans; aquí et visitarà per primer cop i falta molt poc: *està a punt de*."
    explanation: "«Ja t'ha cridat pel teu nom» vol dir que et visitarà d'aquí a molt poc: *estar a punt de* + infinitiu."

  - id: b1-24-023
    type: choice
    point: obligacio-probabilitat
    lesson: 2
    prompt: "—Em fa mal tot el cos. —___ tenir la grip: ves al metge."
    answer: "Deus"
    distractors:
      - text: "Tens que"
        why: "*Tenir que* és un calc de «tener que». I aquí és una suposició, no una obligació: *deus tenir*."
      - text: "Has"
        why: "*Has tenir* no és correcte: *haver de* porta *de*. I aquí és una suposició: *deus tenir*."
    explanation: "És una suposició («potser tens la grip») en segona persona: *deus* + infinitiu, sense *de*."

  - id: b1-24-024
    type: choice
    point: compte-castella
    lesson: 2
    prompt: "El metge et diu que estàs obligat a descansar. Quina frase és correcta?"
    answer: "Has de fer repòs."
    distractors:
      - text: "Tens que fer repòs."
        why: "*Tenir que* és un calc de «tener que»: *has de fer repòs*."
      - text: "Has fer repòs."
        why: "Falta la preposició *de*: *has de fer repòs*."
    explanation: "L'obligació d'una persona és *haver de* + infinitiu: *has de fer repòs*."

  - id: b1-24-025
    type: choice
    point: obligacio-probabilitat
    lesson: 2
    prompt: "«Tinc un dolor fort i he de prendre aquest xarop cada vuit hores.» Què expressa «he de prendre»?"
    answer: "Una obligació."
    distractors:
      - text: "Una suposició."
        why: "La suposició és *deure* + infinitiu. «Cada vuit hores» és una ordre del metge: una obligació."
      - text: "Un desig."
        why: "*Haver de* no expressa un desig, sinó una obligació o una necessitat."
    explanation: "«Cada vuit hores» és una ordre del metge: *he de* + infinitiu expressa una obligació."

  - id: b1-24-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «estar fet pols»?"
    answer: "Estar molt cansat o esgotat."
    distractors:
      - text: "Estar molt brut de pols."
        why: "No parla de pols de veritat: vol dir que no pots més de cansament."
      - text: "Tenir febre molt alta."
        why: "*Estar fet pols* és cansament extrem, no febre."
    explanation: "*Estar fet pols* descriu un cansament extrem: *Després de dotze hores d'urgències estic fet pols*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-24-027
    type: choice
    point: estar-continuar-gerundi
    lesson: 3
    prompt: "—On és el metge? —Ara mateix ___ un pacient a la consulta dos."
    answer: "està visitant"
    distractors:
      - text: "està de visitar"
