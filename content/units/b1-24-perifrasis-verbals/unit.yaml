  # ---------------- Lliçó 5 ----------------
  - id: b1-24-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una visita al CAP"
    text: |
      La Núria es va llevar dimarts amb mal de cap i una mica de febre. Com que havia de treballar, es va prendre una pastilla i va anar a l'oficina. Però a mig matí es va posar a tremolar i la seva companya, la Fàtima, la va acompanyar al CAP del barri.

      A la sala d'espera hi havia molta gent. La Núria estava a punt de trucar a la feina i avisar que no tornaria, quan la van cridar a la consulta dos. El metge li va prendre la temperatura amb el termòmetre: en tenia 38,5. Li va dir que probablement era un virus i que havia de fer repòs tres dies.

      En sortir de la consulta, la Núria va anar a la farmàcia amb la recepta mèdica. El farmacèutic li va explicar que havia de prendre el xarop cada vuit hores, com diu el prospecte, i que, si tornava a tenir febre alta, havia de tornar al CAP.

      Divendres, la Núria encara continuava tossint, però ja no tenia febre. Va trucar a la Fàtima: «Estic molt millor. Dilluns ja torno a treballar.»
    questions:
      - prompt: "Per què va anar la Núria al CAP?"
        answer: "Perquè tenia febre i es va posar a tremolar a la feina."
        distractors:
          - text: "Perquè havia d'acompanyar la Fàtima al metge."
            why: "És al revés: la Fàtima va acompanyar la Núria."
          - text: "Perquè havia d'anar a la farmàcia a buscar un xarop."
            why: "A la farmàcia hi va anar després, amb la recepta; al CAP hi va anar perquè es trobava malament."
      - prompt: "Què li va dir el metge?"
        answer: "Que probablement era un virus i que fes repòs tres dies."
        distractors:
          - text: "Que l'endemà havia de tornar a la consulta dos."
            why: "El metge no ho va dir: li va dir que fes repòs tres dies."
          - text: "Que tornés a treballar l'endemà."
            why: "Al contrari: li va dir que fes repòs tres dies."
      - prompt: "Què havia de fer la Núria amb el xarop?"
        answer: "Prendre'l cada vuit hores."
        distractors:
          - text: "Prendre'l només si tenia febre."
            why: "El xarop era cada vuit hores; tornar al CAP, només si hi havia febre alta."
          - text: "Comprar-ne un altre divendres."
            why: "El text no diu que comprés més xarop."
      - prompt: "Com estava la Núria divendres?"
        answer: "Millor: encara tossia, però ja no tenia febre."
        distractors:
          - text: "Igual que dimarts: amb febre alta."
            why: "Divendres ja no tenia febre, només tos."
          - text: "Pitjor que dimarts: amb més febre."
            why: "Al contrari: divendres ja no tenia febre, només tos."
    explanation: "El text explica la visita de la Núria al CAP: té un virus, ha de fer repòs i prendre un xarop."

