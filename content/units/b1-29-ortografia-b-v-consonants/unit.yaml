id: b1-29
level: B1
title: "Ortografia: *b/v* i consonants finals"
summary: "Aprens a escriure la *b* i la *v* (*haver, rebre, provar, govern*), les consonants finals (*verd/verda, groc/groga, sap/saben*) i els sons *ix/x/tx/ig* (*cuixa, xarop, dutxa, faig*)."
vocabulary_theme: "El cos humà"
points:
  - id: be-i-v
    title: "L'ortografia de *b* i *v*: *haver, rebre, provar*"
    refs:
      - label: "GEIEC: L'ortografia"
        url: "https://geiec.iec.cat"
  - id: consonants-finals
    title: "Consonants finals: *verd/verda*, *groc/groga*, *sap/saben*"
    refs:
      - label: "GEIEC: L'ortografia"
        url: "https://geiec.iec.cat"
  - id: ix-x-tx-ig
    title: "*ix*, *x*, *tx* i *ig*: *cuixa*, *xarop*, *dutxa*, *faig*"
    refs:
      - label: "GEIEC: L'ortografia"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: la *b/v* contrària"
  - id: expressions
    title: "Expressions del cos"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: la *b/v* i les consonants finals"
  - title: "Practicar la *b/v* i les consonants finals"
  - title: "*ix/x/tx/ig* i la interferència del castellà"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el cap"
    definition: "Part de dalt del cos, on hi ha els ulls i la boca."
    example: "Li fa mal el cap des de fa tres dies."
  - word: "el cervell"
    definition: "Òrgan del cap que controla el pensament i el cos."
    example: "Després del cop, li van mirar el cervell amb un escàner."
  - word: "el front"
    definition: "Part del cap entre les celles i els cabells."
    example: "La infermera li toca el front per veure si té febre."
  - word: "l'ull"
    definition: "Òrgan de la cara amb què veiem."
    example: "Té els ulls verds com la seva mare."
  - word: "la cella"
    definition: "Línia de pèls a sobre de cada ull."
    example: "Es va fer un tall a la cella jugant a futbol."
  - word: "l'orella"
    definition: "Òrgan del cap amb què sentim."
    example: "El metge li mira les orelles amb una llum petita."
  - word: "el nas"
    definition: "Part de la cara amb què respirem i olorem."
    example: "Amb el refredat, li raja el nas tot el dia."
  - word: "la galta"
    definition: "Cada costat tou de la cara, entre l'ull i la boca."
    example: "Té les galtes vermelles de la febre."
  - word: "la boca"
    definition: "Obertura de la cara per menjar, parlar i respirar."
    example: "El metge li demana que obri la boca."
  - word: "el llavi"
    definition: "Cadascuna de les dues vores de la boca."
    example: "Amb el fred, té els llavis secs."
  - word: "la dent"
    definition: "Peça dura de la boca que serveix per mastegar."
    example: "El dentista diu que té les dents sanes."
  - word: "el queixal"
    definition: "Dent grossa del fons de la boca."
    example: "Li han tret un queixal del seny."
  - word: "la barba"
    definition: "Pèl de la cara dels homes, a les galtes i la barbeta."
    example: "El meu pare porta barba des de fa anys."
  - word: "el coll"
    definition: "Part del cos entre el cap i les espatlles."
    example: "Li fa mal el coll de dormir en mala postura."
  - word: "l'espatlla"
    definition: "Part de dalt del braç, on s'uneix amb el cos."
    example: "El pacient té un dolor fort a l'espatlla."
  - word: "el braç"
    definition: "Membre del cos entre l'espatlla i la mà."
    example: "Li prenen la tensió al braç dret."
  - word: "el colze"
    definition: "Articulació del mig del braç."
    example: "Va caure i té un blau al colze."
  - word: "la mà"
    definition: "Part del final del braç, amb cinc dits."
    example: "Té les mans fredes del fred del carrer."
  - word: "el dit"
    definition: "Cadascuna de les cinc parts de la mà o del peu."
    example: "Té una berruga al dit petit de la mà."
  - word: "l'ungla"
    definition: "Làmina dura que cobreix la punta dels dits."
    example: "Es va trencar una ungla obrint la porta."
  - word: "el pit"
    definition: "Part de davant del cos, entre el coll i el ventre."
    example: "El metge li ausculta el pit amb el fonendoscopi."
  - word: "l'aixella"
    definition: "Buit entre el braç i el cos, sota l'espatlla."
    example: "Es posa el termòmetre a l'aixella."
  - word: "l'esquena"
    definition: "Part de darrere del cos, del coll a la cintura."
    example: "Treballar assegut tot el dia li fa mal d'esquena."
  - word: "el cor"
    definition: "Òrgan del pit que fa circular la sang."
    example: "Abans de l'operació, el cor li batega de pressa."
  - word: "el ventre"
    definition: "Part de davant del cos entre el pit i les cames."
    example: "Es queixa d'un dolor fort al ventre."
  - word: "el melic"
    definition: "Marca rodona al mig del ventre."
    example: "Al nadó li cau la crosta del melic."
  - word: "la cama"
    definition: "Membre del cos entre el maluc i el peu."
    example: "Té un hematoma a la cama de la caiguda."
  - word: "la cuixa"
    definition: "Part de dalt de la cama, entre el maluc i el genoll."
    example: "Li fa mal la cuixa dreta quan puja escales."
  - word: "el genoll"
    definition: "Articulació del mig de la cama."
    example: "Porta un embenat al genoll esquerre."
  - word: "el turmell"
    definition: "Articulació entre la cama i el peu."
    example: "Es va torçar el turmell jugant a bàsquet."
  - word: "el peu"
    definition: "Part del final de la cama, que toca a terra."
    example: "Després de la dutxa, eixuga't bé els peus."
  - word: "l'os"
    definition: "Peça dura que forma l'esquelet."
    example: "El metge mira si l'os està trencat."
  - word: "el múscul"
    definition: "Teixit del cos que es mou i fa força."
    example: "Té el múscul de la cama inflamat."
  - word: "la pell"
    definition: "Capa que cobreix tot el cos per fora."
    example: "Té la pell molt blanca i delicada."
  - word: "el cabell"
    definition: "Pèl llarg que cobreix el cap."
    example: "Li cauen els cabells i es queda calb."
  - word: "la sang"
    definition: "Líquid vermell que circula pel cos."
    example: "Li fan una anàlisi de sang cada any."
  - word: "la berruga"
    definition: "Bony petit i dur que surt a la pell."
    example: "El dermatòleg li ha tret una berruga de la mà."
  - word: "el pèl"
    definition: "Fil prim que surt de la pell."
    example: "Amb la por, se li posen els pèls de punta."
  - word: "la ferida"
    definition: "Tall o obertura a la pell per un accident."
    example: "Es renta la ferida del genoll amb aigua."
  - word: "el dolor"
    definition: "Sensació de mal en una part del cos."
    example: "Prenc una pastilla per al dolor de cap."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-29-001
    type: choice
    point: be-i-v
    lesson: 1
    prompt: "—Tu quan ___ els resultats de l'anàlisi? —Demà al matí."
    answer: "rebràs"
    distractors:
      - text: "revràs"
        why: "*Rebre* s'escriu amb *b*: *rebràs*."
      - text: "rebrà"
        why: "La pregunta és per a «tu»: *rebràs*. *Rebrà* seria per a «ell»."
    explanation: "«Demà» demana futur, i la pregunta és per a «tu»: *rebràs*. *Rebre* s'escriu amb *b*."

  - id: b1-29-002
    type: choice
    point: be-i-v
    lesson: 1
    prompt: "—Doctor, quan torno? —___ de tornar demà."
    answer: "Has"
    distractors:
      - text: "As"
        why: "Les formes de *haver* porten *h*: *has*."
      - text: "Ha"
        why: "El metge parla amb «tu»: *has*. *Ha* seria per a «ell»."
    explanation: "El metge parla amb el pacient («tu»): *has de tornar*. Les formes de *haver* porten *h*."

  - id: b1-29-003
    type: choice
    point: be-i-v
    lesson: 1
    prompt: "Abans de comprar les ulleres, te les pots ___ a la botiga."
    answer: "provar"
    distractors:
      - text: "probar"
        why: "*Provar* s'escriu amb *v*, encara que *trobar* porti *b*."
      - text: "trobar"
        why: "*Trobar* vol dir «encontrar». Abans de comprar unes ulleres, te les poses per veure com et queden: *provar*."
    explanation: "Posar-se unes ulleres per veure com queden és *provar-se-les*. I *provar* s'escriu amb *v*."

  - id: b1-29-004
    type: choice
    point: be-i-v
    lesson: 1
    prompt: "Tinc una ___ al dit i em fa mal."
    answer: "berruga"
    distractors:
      - text: "berrúga"
        why: "*Berruga* és plana acabada en *-a*: no porta accent."
      - text: "beruga"
        why: "*Berruga* s'escriu amb *rr*."
    explanation: "És *berruga*, amb *b* i *rr*: en castellà és «verruga», amb *v*."

  - id: b1-29-005
    type: choice
    point: consonants-finals
    lesson: 1
    prompt: "Amb la icterícia, els ulls es tornen ___."
    answer: "grocs"
    distractors:
      - text: "grogs"
        why: "El masculí plural conserva la *c*: *grocs*. La *g* només surt en femení: *groga*."
      - text: "groc"
        why: "«Els ulls» és plural: *grocs*."
    explanation: "«Els ulls» és masculí plural. El masculí de *groc* fa *grocs*: la *g* només apareix en femení (*groga*)."

  - id: b1-29-006
    type: inline-choice
    point: be-i-v
    lesson: 1
    title: "Una visita al metge"
    text: "Ahir {v|b}aig anar al metge: em {v|b}a receptar un xarop i em {v|b}a dir que {b|v}egués molta aigua. Com que tre{b|v}allo de nits, també em va receptar unes vitamines."
    explanation: "*Anar* s'escriu amb *v* (*vaig*, *va*); *beure* i *treballar*, amb *b* (*begués*, *treballo*)."

  - id: b1-29-007
    type: inline-choice
    point: consonants-finals
    lesson: 1
    title: "A urgències"
    text: "La pacient ha arribat amb les mans fre{d|t}es i els ulls gro{c|g}s. També té un bla{u|v} al colze i li fa mal el melic. El metge encara no sa{p|b} què té."
    explanation: "*Fredes* manté la *d* de *fred*, i *grocs*, la *c* de *groc*. *Blau* acaba en *u* (encara que el femení sigui *blava*), i *saber* fa *sap*."

  - id: b1-29-008
    type: match
    point: be-i-v
    lesson: 1
    instruction: "Relaciona cada infinitiu amb una forma del seu verb."
    pairs:
      - ["rebre", "reben"]
      - ["provar", "provem"]
      - ["beure", "beuen"]
      - ["trobar", "troben"]
      - ["haver", "havien"]
    explanation: "Totes aquestes formes mantenen la *b* o la *v* de l'infinitiu."

  - id: b1-29-009
    type: match
    point: consonants-finals
    lesson: 1
    instruction: "Relaciona cada masculí amb el seu femení."
    pairs:
      - ["verd", "verda"]
      - ["groc", "groga"]
      - ["blanc", "blanca"]
      - ["fred", "freda"]
      - ["calb", "calba"]
    explanation: "El femení ens diu quina és la consonant final del masculí."

  - id: b1-29-010
    type: fill
    point: be-i-v
    lesson: 1
    prompt: "Els pacients ___ de portar la targeta sanitària."
    hint: "HAVER, en present"
    answers: ["han"]
    wrong_answers:
      - text: "an"
        why: "Les formes de *haver* porten *h*: *han*."
      - text: "hem"
        why: "«Els pacients» és tercera persona plural: *han*."
    grading: strict
    explanation: "És *haver de* + infinitiu, tercera persona plural: *han*. Les formes de *haver* porten *h* inicial."

  - id: b1-29-011
    type: fill
    point: be-i-v
    lesson: 1
    prompt: "El metge ___ cada dia més de trenta pacients."
    hint: "REBRE, en present"
    answers: ["rep"]
    wrong_answers:
      - text: "rev"
        why: "*Rebre* no té cap forma amb *v*: a final de mot s'escriu *p* (*rep*)."
      - text: "reben"
        why: "«El metge» és singular: *rep*. *Reben* és plural."
    grading: strict
    explanation: "Present de *rebre*, tercera persona: *rep*, amb *p* final (com *sap*). Entre vocals hi ha *b*: *rebem*, *reben*."

  - id: b1-29-012
    type: fill
    point: consonants-finals
    lesson: 1
    prompt: "L'Ibrahim té els cabells molt ___."
    hint: "LLARG, en masculí plural"
    answers: ["llargs"]
    wrong_answers:
      - text: "llarcs"
        why: "La consonant de *llarg* és *g*, com es veu en *llarga*: *llargs*."
      - text: "llargues"
        why: "«Els cabells» és masculí plural: *llargs*."
    grading: strict
    explanation: "El masculí singular és *llarg*. El plural hi afegeix *-s*: *llargs*."

  - id: b1-29-013
    type: fill
    point: consonants-finals
    lesson: 1
    prompt: "La Núria té les dents molt ___."
    hint: "BLANC, en femení plural"
    answers: ["blanques"]
    wrong_answers:
      - text: "blances"
        why: "Davant de *e* i *i*, el so de *c* s'escriu *qu*: *blanques*."
      - text: "blancs"
        why: "«Les dents» és femení plural: *blanques*."
    grading: strict
    explanation: "El masculí és *blanc*. En femení, la *c* final sona davant de *a*: *blanca*, *blanques*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-29-014
    type: fill
    point: be-i-v
    lesson: 2
    prompt: "—On vas? —___ a la farmàcia a buscar el xarop."
    hint: "ANAR, en present"
    answers: ["Vaig", "Jo vaig", "Me'n vaig", "Jo me'n vaig"]
    wrong_answers:
      - text: "Baig"
        why: "*Anar* s'escriu amb *v*: *vaig*."
      - text: "Vas"
        why: "Respons tu mateix: *vaig*. *Vas* és la segona persona."
    grading: strict
    explanation: "Respons tu mateix («jo»): *vaig*. *Anar* s'escriu amb *v*."

  - id: b1-29-015
    type: fill
    point: be-i-v
    lesson: 2
    prompt: "Demà la Montse i jo ___ les ulleres noves."
    hint: "PROVAR, en futur"
    answers: ["provarem"]
    wrong_answers:
      - text: "probarem"
        why: "*Provar* s'escriu amb *v*: *provarem*."
      - text: "provaran"
        why: "«La Montse i jo» és primera persona plural: *provarem*."
    grading: strict
    explanation: "«Demà» demana futur, i «la Montse i jo» demana la primera persona plural: *provarem*."

  - id: b1-29-016
    type: fill
    point: consonants-finals
    lesson: 2
    prompt: "El nadó té els ulls ___."
    hint: "VERD, en plural"
    answers: ["verds"]
    wrong_answers:
      - text: "verts"
        why: "La consonant final de *verd* és *d*, com es veu en *verda*: *verds*."
      - text: "verda"
        why: "«Els ulls» és masculí plural: *verds*."
    grading: strict
    explanation: "El femení *verda* ens diu que la consonant és *d*: *verds*."

  - id: b1-29-017
    type: fill
    point: consonants-finals
    lesson: 2
    prompt: "En Pau no ___ per què li raja el nas."
    hint: "SABER, en present"
    answers: ["sap"]
    wrong_answers:
      - text: "sab"
        why: "La tercera persona de *saber* s'escriu *sap*, amb *p*."
      - text: "saben"
        why: "«En Pau» és singular: *sap*."
    grading: strict
    explanation: "Present de *saber*, tercera persona: *sap*. La *b* només sona entre vocals: *saben*."

  - id: b1-29-018
    type: fill
    point: consonants-finals
    lesson: 2
    prompt: "Amb aquesta pel·lícula de por, tinc les mans ___ i els pèls de punta."
    hint: "FRED, en femení plural"
    answers: ["fredes"]
    wrong_answers:
      - text: "fretes"
        why: "El femení de *fred* manté la *d*: *fredes*."
      - text: "freds"
        why: "«Les mans» és femení plural: *fredes*."
    grading: strict
    explanation: "El masculí és *fred*. En femení plural: *fredes*, amb *d*."

  - id: b1-29-019
    type: order
    point: be-i-v
    lesson: 2
    cue: "El metge et pregunta pels resultats. Respon que els tindràs demà."
    chunks: ["Demà", "rebràs", "els resultats", "de l'anàlisi"]
    extra: ["revràs"]
    answers:
      - "Demà rebràs els resultats de l'anàlisi."
      - "Rebràs els resultats de l'anàlisi demà."
    explanation: "*Rebre* fa el futur *rebràs*, amb *b*. L'adverbi *demà* pot anar al principi o al final."

  - id: b1-29-020
    type: order
    point: consonants-finals
    lesson: 2
    cue: "La infermera et pregunta com tens les mans. Respon que les tens molt fredes."
    chunks: ["Les", "tinc", "molt", "fredes"]
    extra: ["fretes"]
    answers:
      - "Les tinc molt fredes."
    explanation: "El femení de *fred* manté la *d*: *fredes*."

  - id: b1-29-021
    type: order
    point: consonants-finals
    lesson: 2
    cue: "Digues que els metges saben què tens."
    chunks: ["Els metges", "saben", "què", "tens"]
    extra: ["saven"]
    answers:
      - "Els metges saben què tens."
    explanation: "Amb subjecte plural, *saber* fa *saben*: la *b* sona entre vocals."

  - id: b1-29-022
    type: choice
    point: be-i-v
    lesson: 2
    prompt: "Davant d'un error mèdic, pots consultar un ___."
    answer: "advocat"
    distractors:
      - text: "adbocat"
        why: "*Advocat* s'escriu amb *v*: és un dels mots que canvien la *b* castellana («abogado») per *v*."
      - text: "advocats"
        why: "«Un» és singular: *advocat*."
    explanation: "És *advocat*, amb *v* i *t* final: en castellà és «abogado»."

  - id: b1-29-023
    type: choice
    point: be-i-v
    lesson: 2
    prompt: "Cada matí, la Fàtima ___ la sala d'espera de la consulta."
    answer: "escombra"
    distractors:
      - text: "escomvra"
        why: "Darrere de *m* s'escriu *b*: *escombra*."
      - text: "escombren"
        why: "«La Fàtima» és singular: *escombra*."
    explanation: "«La Fàtima» és tercera persona: *escombra*. *Escombrar* s'escriu amb *b*."

  - id: b1-29-024
    type: choice
    point: consonants-finals
    lesson: 2
    prompt: "La infermera diu que té la pell una mica ___ i el turmell inflat."
    answer: "groga"
    distractors:
      - text: "groca"
        why: "El femení de *groc* s'escriu amb *g*: *groga*."
      - text: "grocs"
        why: "«La pell» és femení singular: *groga*."
    explanation: "El masculí *groc* fa el femení *groga*: la *c* es torna *g* davant de *a*."

  - id: b1-29-025
    type: choice
    point: consonants-finals
    lesson: 2
    prompt: "—Els metges ___ què tinc? —Sí, ja m'ho han explicat."
    answer: "saben"
    distractors:
      - text: "saven"
        why: "*Saber* s'escriu amb *b*: *saben*."
      - text: "sap"
        why: "«Els metges» és plural: *saben*."
    explanation: "Present de *saber*, tercera persona plural: *saben*. Entre vocals sona la *b*."

  - id: b1-29-026
    type: inline-choice
    point: consonants-finals
    lesson: 2
    title: "A la consulta del pediatre"
    text: "El pediatre diu que el nen té els ulls ver{d|t}s i les dents molt blan{qu|c}es. El seu pare porta barba i té els cabells cur{t|d}s i un blau a la cella, i el nen encara no sa{p|b} llegir."
    explanation: "La consonant final es manté: *verds*, *blanques*, *curts*. I la tercera persona de *saber* és *sap*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-29-027
    type: choice
    point: ix-x-tx-ig
    lesson: 3
    prompt: "El nen té tos i el metge li recepta un ___."
    answer: "xarop"
    distractors:
      - text: "ixarop"
        why: "A principi de mot, el so s'escriu *x*, sense *i*: *xarop*."
      - text: "xarob"
        why: "*Xarop* acaba en *p*, com *cop*."
    explanation: "És *xarop*: *x* inicial i *p* final."

  - id: b1-29-028
    type: choice
    point: ix-x-tx-ig
    lesson: 3
    prompt: "La infermera em posa la injecció amb una ___ nova."
    answer: "xeringa"
    distractors:
      - text: "txeringa"
        why: "A principi de mot s'escriu *x*: *xeringa*."
      - text: "xeringues"
        why: "«Una» és singular: *xeringa*."
    explanation: "És *xeringa*: *x* inicial. I «una» demana singular."

  - id: b1-29-029
    type: choice
    point: compte-castella
    lesson: 3
    prompt: "Després del cop al cap, li van mirar el ___."
    answer: "cervell"
    distractors:
      - text: "cerbell"
        why: "En català és *cervell*, amb *v*: és un dels mots que canvien la *b* castellana per *v*."
      - text: "cerebro"
        why: "«Cerebro» és castellà. En català: *cervell*."
