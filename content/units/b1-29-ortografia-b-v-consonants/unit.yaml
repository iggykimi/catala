  # ---------------- Lliçó 5 ----------------
  - id: b1-29-054
    type: reading
    point: comprensio
    lesson: 5
    title: "Una revisió mèdica"
    text: |
      La Montse té cinquanta anys i treballa en una escola de Sabadell. Com que fa temps que no es troba bé del tot, demana hora al metge de capçalera per fer-se una revisió.

      A la consulta, el metge li pregunta com es troba i li mira el coll, les orelles i la boca. Després li ausculta el cor i li diu que respiri profundament: el pit puja i baixa sense cap soroll estrany. També li toca el front i li mira un dit que té inflamat des de fa dies.

      Li pren la tensió al braç i li fa una anàlisi de sang. Quan arriben els resultats, tot està bé excepte el colesterol, que està una mica alt. El metge li diu que no pateixi, però que ha de caminar cada dia i menjar amb menys sal.

      La Montse surt de la consulta més tranquil·la. Ha de tornar d'aquí a tres mesos per repetir l'anàlisi.
    questions:
      - prompt: "Per què va la Montse al metge?"
        answer: "Perquè fa temps que no es troba gaire bé."
        distractors:
          - text: "Perquè té un dit trencat des de fa dies."
            why: "El dit està inflamat, no trencat."
          - text: "Perquè li costa respirar pel soroll del pit."
            why: "El pit puja i baixa sense cap soroll estrany: respira bé."
      - prompt: "Què descobreix el metge amb l'anàlisi?"
        answer: "Que el colesterol està una mica alt."
        distractors:
          - text: "Que la tensió està massa alta."
            why: "La tensió li la pren al braç, però el text no diu que estigui alta."
          - text: "Que té una infecció a la sang."
            why: "El text diu que tot està bé excepte el colesterol."
      - prompt: "Què ha de fer la Montse a partir d'ara?"
        answer: "Caminar cada dia i menjar amb menys sal."
        distractors:
          - text: "Prendre un xarop cada vuit hores."
            why: "El metge no li recepta cap xarop."
          - text: "Tornar cada setmana a la consulta."
            why: "Ha de tornar d'aquí a tres mesos, no cada setmana."
      - prompt: "Com surt la Montse de la consulta?"
        answer: "Més tranquil·la que quan hi ha entrat."
        distractors:
          - text: "Preocupada pel colesterol."
            why: "El metge li diu que no pateixi, i surt més tranquil·la."
          - text: "Amb una recepta de pastilles."
            why: "El metge no li recepta res: només consells."
    explanation: "La revisió de la Montse va bé: només ha de caminar més i menjar amb menys sal."

