  # ---------------- Lliçó 5 ----------------
  - id: b1-15-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una colla de sempre"
    text: |
      La Núria i en Pau es coneixen des de petits: van anar junts a l'escola del barri. Ara tenen trenta anys i la seva amistat continua igual de forta. Es tenen molta confiança. Cada dijous queden amb la colla per sopar i fer-se companyia, i sempre parlen de la feina, dels viatges i dels plans de futur.

      L'any passat, però, van tenir una baralla important. En Pau havia explicat un secret de la Núria a un conegut, i ella se'n va assabentar per una altra persona. La Núria es va enfadar molt: deia que ja no hi confiava. En Pau li va demanar perdó tres vegades, però ella no en volia parlar.

      Al final, els amics s'hi van ficar: van organitzar un sopar sorpresa i els van fer seure junts. En Pau va reconèixer el seu error i li va prometre que no tornaria a passar. La Núria, que l'aprecia de debò, el va perdonar. Es van fer una abraçada i van fer les paus.

      «Una amistat de tants anys s'ha de cuidar», diu la Núria. «No ens barallem gaire i, si tenim un malentès, en parlem el mateix dia. I si un consell no m'agrada, també ho dic.» En Pau hi està d'acord: «Jo me'n recordo cada dia, del que va passar. I m'ho penso dues vegades abans de parlar.»
    questions:
      - prompt: "Què fa la colla cada dijous?"
        answer: "Sopen junts i parlen de la seva vida."
        distractors:
          - text: "Sopen amb un conegut de la feina."
            why: "Cada dijous queden amb la colla, no amb un conegut."
          - text: "Organitzen un sopar sorpresa."
            why: "El sopar sorpresa és un sol cop, per reconciliar-los."
      - prompt: "Per què es va enfadar la Núria?"
        answer: "Perquè en Pau va explicar un secret seu."
        distractors:
          - text: "Perquè en Pau no la va acompanyar al sopar."
            why: "El text no diu això: el motiu és el secret explicat."
          - text: "Perquè en Pau no li va demanar perdó."
            why: "Sí que li va demanar perdó, tres vegades."
      - prompt: "Com es van reconciliar?"
        answer: "Amb un sopar que van organitzar els amics."
        distractors:
          - text: "Amb un viatge que van fer junts."
            why: "No fan cap viatge: els amics organitzen un sopar."
          - text: "Amb una carta que va escriure en Pau."
            why: "En Pau li parla i li promet, però no escriu cap carta."
      - prompt: "Què fan ara quan tenen un malentès?"
        answer: "En parlen el mateix dia."
        distractors:
          - text: "No hi pensen més."
            why: "Al contrari: en parlen de seguida."
          - text: "En Pau demana consell a la colla."
            why: "El text diu que en parlen entre ells el mateix dia."
    explanation: "El text explica una baralla entre dos amics i com la colla els ajuda a fer les paus."

