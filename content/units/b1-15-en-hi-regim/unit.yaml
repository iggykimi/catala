id: b1-15
level: B1
title: "En i hi amb verbs de règim preposicional"
summary: "Aprens a substituir el complement dels verbs de règim: *en* per a *de* (*en parlo*, *se'n recorda*) i *hi* per a *en, a, amb, per* (*hi penso*, *s'hi apunta*)."
vocabulary_theme: "Relacions personals i amistat"
points:
  - id: en-regim-de
    title: "*En* substitueix *de* + complement: *en parlo*, *se'n recorda*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: hi-regim
    title: "*Hi* substitueix *en, a, amb, per* + complement: *hi penso*, *s'hi apunta*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: formes-pronominals
    title: "Les formes: *me'n*, *te'n*, *se'n*, *m'hi*, *s'hi*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *recordar-se'n*, *adonar-se'n*"
  - id: expressions
    title: "Expressions amb *en* i *hi*"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: de què parlem i en què pensem"
  - title: "Practicar *en* i *hi*"
  - title: "Formes i interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "l'amistat"
    definition: "Relació de confiança entre amics."
    example: "La seva amistat dura des de l'escola."
  - word: "la colla"
    definition: "Grup d'amics que queden sovint."
    example: "Cada divendres sopo amb la colla."
  - word: "quedar"
    definition: "Trobar-se amb algú en un lloc i a una hora."
    example: "Hem quedat a les vuit davant del cine."
  - word: "la parella"
    definition: "Dues persones que tenen una relació."
    example: "La meva parella treballa a Vic."
  - word: "el company, la companya"
    definition: "Persona amb qui treballes o comparteixes una activitat."
    example: "La meva companya de feina és de Tortosa."
  - word: "el conegut, la coneguda"
    definition: "Persona que coneixes, però que no és amiga teva."
    example: "Em va saludar un conegut al mercat."
  - word: "la confiança"
    definition: "Seguretat que una persona actuarà bé."
    example: "La confiança es guanya amb el temps."
  - word: "confiar"
    definition: "Creure que una persona actuarà bé."
    example: "Hi confio: és una persona seriosa."
  - word: "el secret"
    definition: "Cosa que no s'explica a ningú."
    example: "T'explicaré un secret, però no el diguis."
  - word: "la baralla"
    definition: "Discussió forta entre dues persones."
    example: "Van tenir una baralla per una ximpleria."
  - word: "barallar-se"
    definition: "Discutir fort amb algú."
    example: "Es barallen sovint, però es reconcilien de seguida."
  - word: "discutir"
    definition: "Parlar amb algú sense estar-hi d'acord."
    example: "Van discutir del viatge durant el sopar."
  - word: "la discussió"
    definition: "Conversa en què no hi ha acord."
    example: "La discussió va acabar amb una abraçada."
  - word: "enfadar-se"
    definition: "Posar-se de mal humor amb algú."
    example: "Es va enfadar perquè vam arribar tard."
  - word: "el malentès"
    definition: "Error per no haver-se entès bé."
    example: "Va ser un malentès: jo parlava de dijous."
  - word: "fer les paus"
    definition: "Reconciliar-se després d'una baralla."
    example: "Van discutir, però ja han fet les paus."
  - word: "perdonar"
    definition: "No tenir en compte una ofensa."
    example: "El vaig perdonar i vam continuar amics."
  - word: "demanar perdó"
    definition: "Dir a algú que sents el que has fet."
    example: "Li vaig demanar perdó i em va perdonar."
  - word: "el consell"
    definition: "Opinió que es dona per ajudar algú."
    example: "Em va donar un bon consell per a l'entrevista."
  - word: "aconsellar"
    definition: "Donar un consell a algú."
    example: "M'aconsella que dormi més hores."
  - word: "donar suport"
    definition: "Ajudar algú quan ho necessita."
    example: "La colla em dona suport en tot."
  - word: "acompanyar"
    definition: "Anar amb algú a un lloc."
    example: "L'acompanyo a l'estació cada dilluns."
  - word: "la companyia"
    definition: "Presència d'algú que està amb tu."
    example: "M'agrada la seva companyia."
  - word: "conèixer"
    definition: "Saber qui és una persona."
    example: "Vaig conèixer en Pau a la universitat."
  - word: "la cita"
    definition: "Trobada acordada amb algú."
    example: "Tinc una cita amb el metge a les cinc."
  - word: "el xicot, la xicota"
    definition: "Persona amb qui tens una relació."
    example: "El seu xicot és de Reus."
  - word: "casar-se"
    definition: "Unir-se en matrimoni."
    example: "Es casen al juny en un poble de la Cerdanya."
  - word: "l'abraçada"
    definition: "Gest d'afecte: estrènyer algú amb els braços."
    example: "Es van fer una abraçada molt llarga."
  - word: "acomiadar-se"
    definition: "Dir adeu quan marxes."
    example: "Es va acomiadar de tots amb un somriure."
  - word: "el regal"
    definition: "Cosa que es dona a algú en una festa."
    example: "Li vaig fer un regal per l'aniversari."
  - word: "la festa"
    definition: "Trobada per celebrar alguna cosa."
    example: "Fan una festa per l'aniversari de la Laia."
  - word: "el sopar"
    definition: "Últim àpat del dia."
    example: "El sopar de la colla és cada dijous."
  - word: "aguantar"
    definition: "Tolerar una persona o una cosa."
    example: "No aguanto el soroll dels veïns."
  - word: "el respecte"
    definition: "Consideració cap a una persona."
    example: "Es tenen molt de respecte."
  - word: "estimar"
    definition: "Tenir amor per algú."
    example: "Estimo molt els meus avis."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-15-001
    type: choice
    point: en-regim-de
    lesson: 1
    prompt: "—Parla del lloguer, en Jordi? —Sí, ___ parla cada setmana."
    answer: "en"
    distractors:
      - text: "hi"
        why: "*Hi* substitueix *en, a, amb* o *per*. «Del lloguer» porta *de*: *en*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un *això*, no un complement amb *de*."
    explanation: "«Del lloguer» és un complement amb *de*: *en parla*."

  - id: b1-15-002
    type: choice
    point: en-regim-de
    lesson: 1
    prompt: "Tot depèn del temps que farà. Tot ___ depèn."
    answer: "en"
    distractors:
      - text: "hi"
        why: "*Dependre de* porta *de*: *tot en depèn*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un *això*, no un complement amb *de*."
    explanation: "«Del temps» porta *de*: *tot en depèn*."

  - id: b1-15-003
    type: choice
    point: en-regim-de
    lesson: 1
    prompt: "—Es queixa del soroll, el veí de dalt? —Sí, ___ queixa cada nit: ja no l'aguanta ningú."
    answer: "se'n"
    distractors:
      - text: "s'hi"
        why: "*Queixar-se de* porta *de*: *se'n queixa*."
      - text: "en"
        why: "*Queixar-se* és pronominal: cal *es* + *en*: *se'n queixa*."
    explanation: "«Del soroll» porta *de*: *se'n queixa cada nit*."

  - id: b1-15-004
    type: choice
    point: hi-regim
    lesson: 1
    prompt: "La Laia pensa en el seu avi cada dia. ___ pensa cada dia."
    answer: "Hi"
    distractors:
      - text: "En"
        why: "*Pensar en* no porta *de*: el pronom és *hi*."
      - text: "Ho"
        why: "*Ho* substitueix una idea o un *això*. «En el seu avi» és un complement amb *en*: *hi*."
    explanation: "«En el seu avi» porta *en*: *hi pensa*."

  - id: b1-15-005
    type: choice
    point: hi-regim
    lesson: 1
    prompt: "—Confies en el teu company de pis? —Sí, ___ confio totalment."
    answer: "hi"
    distractors:
      - text: "en"
        why: "*Confiar en* porta *en*: *hi confio*."
      - text: "el"
        why: "*El* és complement directe. «En el teu company» és un complement amb *en*: *hi*."
    explanation: "«En el teu company» porta *en*: *hi confio*."

  - id: b1-15-006
    type: choice
    point: hi-regim
    lesson: 1
    prompt: "—Jugues a escacs, tu? —Sí, ___ jugo cada divendres amb el meu avi."
    answer: "hi"
    distractors:
      - text: "en"
        why: "*Jugar a* porta *a*: *hi jugo*."
      - text: "els"
        why: "*Els* seria un complement directe. «A escacs» és un complement amb *a*: *hi*."
    explanation: "«A escacs» porta *a*: *hi jugo*."

  - id: b1-15-007
    type: inline-choice
    point: hi-regim
    lesson: 1
    title: "Missatge a la colla"
    text: "Hola, colla! Demà juguem a pàdel. Qui {s'hi|se'n|s'} apunta? La Marta ja {hi|en|ho} pensa des de dilluns i diu que el seu xicot també {hi|en|ho} estarà d'acord. Jo {hi|en|ho} compto, amb tots vosaltres!"
    explanation: "*S'hi apunta*: *apuntar-se a* demana *hi*. *Hi pensa*: *pensar en* demana *hi*. *Hi estarà d'acord*: *estar d'acord amb* demana *hi*. *Hi compto*: *comptar amb* demana *hi*."

  - id: b1-15-008
    type: match
    point: en-regim-de
    lesson: 1
    instruction: "Relaciona cada verb amb la seva frase."
    pairs:
      - ["parlar", "En parla cada dia."]
      - ["recordar-se", "Se'n recorda molt bé."]
      - ["queixar-se", "Se'n queixa cada nit."]
      - ["riure's", "Se'n riu molt."]
      - ["ocupar-se", "Se n'ocupa el meu germà."]
      - ["enamorar-se", "Se n'ha enamorat aquest estiu."]
    explanation: "Tots aquests verbs porten un complement amb *de*. Quan el complement desapareix, el substituïm per *en*."

  - id: b1-15-009
    type: fill
    point: en-regim-de
    lesson: 1
    prompt: "—Parles del viatge amb els avis? —Sí, ___ parlo cada diumenge."
    hint: "pronom per a «del viatge»"
    answers: ["en"]
    wrong_answers:
      - text: "hi"
        why: "*Parlar de* porta *de*: *en parlo*."
    grading: tolerant
    explanation: "«Del viatge» porta *de*: *en parlo*."

  - id: b1-15-010
    type: fill
    point: hi-regim
    lesson: 1
    prompt: "—Creus en els horòscops? —No, no ___ crec gens."
    hint: "pronom per a «en els horòscops»"
    answers: ["hi"]
    wrong_answers:
      - text: "en"
        why: "*Creure en* porta *en*: *no hi crec gens*."
    grading: tolerant
    explanation: "«En els horòscops» porta *en*: *no hi crec gens*."

  - id: b1-15-011
    type: fill
    point: hi-regim
    lesson: 1
    prompt: "—Esteu d'acord amb el pla de la Núria? —Sí, ___ estem d'acord: és un bon pla."
    hint: "pronom per a «amb el pla»"
    answers: ["hi"]
    wrong_answers:
      - text: "en"
        why: "*Estar d'acord amb* porta *amb*: *hi estem d'acord*."
    grading: tolerant
    explanation: "«Amb el pla» porta *amb*: *hi estem d'acord*."

  - id: b1-15-012
    type: order
    point: en-regim-de
    lesson: 1
    cue: "Et pregunten pel lloguer. Respon que en parlareu demà al matí."
    chunks: ["en", "parlem", "demà", "al matí"]
    extra: ["hi"]
    answers:
      - "En parlem demà al matí."
      - "Demà al matí en parlem."
      - "Demà en parlem al matí."
    explanation: "«Del lloguer» es converteix en *en*, que va davant del verb: *en parlem*."

  - id: b1-15-013
    type: order
    point: hi-regim
    lesson: 1
    cue: "Un amic et pregunta pel concert. Digues que hi penses cada dia."
    chunks: ["hi", "penso", "cada", "dia"]
    extra: ["en"]
    answers:
      - "Hi penso cada dia."
      - "Cada dia hi penso."
    explanation: "«En el concert» es converteix en *hi*, que va davant del verb: *hi penso*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-15-014
    type: fill
    point: en-regim-de
    lesson: 2
    prompt: "La Fàtima s'ha enamorat d'un company de feina. ___ha enamorat aquest estiu."
    hint: "pronominal + *en*, per a «d'un company»"
    answers: ["Se n'"]
    wrong_answers:
      - text: "S'"
        why: "La pista demana també *en*, per a «d'un company»: *se n'ha enamorat*."
    grading: strict
    explanation: "«D'un company» porta *de*. Davant de vocal: *se n'ha enamorat*."

  - id: b1-15-015
    type: fill
    point: en-regim-de
    lesson: 2
    prompt: "—El teu germà es riu dels acudits del Marc? —Sí, ___ riu molt."
    hint: "pronominal + *en*, per a «dels acudits»"
    answers: ["se'n"]
    wrong_answers:
      - text: "s'hi"
        why: "*Riure's de* porta *de*: *se'n riu*."
    grading: strict
    explanation: "«Dels acudits» porta *de*: *se'n riu*."

  - id: b1-15-016
    type: fill
    point: hi-regim
    lesson: 2
    prompt: "—Que us heu apuntat al sopar de la colla? —Sí, ___ hem apuntat aquesta setmana."
    hint: "pronominal + *hi*, per a «al sopar»"
    answers: ["ens hi"]
    wrong_answers:
      - text: "ens en"
        why: "*Apuntar-se a* porta *a*: *ens hi hem apuntat*."
      - text: "ens"
        why: "La pista demana també *hi*, per a «al sopar»: *ens hi hem apuntat*."
    grading: tolerant
    explanation: "«Al sopar» porta *a* i el verb és pronominal: *ens hi hem apuntat*."

  - id: b1-15-017
    type: fill
    point: formes-pronominals
    lesson: 2
    prompt: "La Laia i jo vam conèixer l'Ibrahim a Girona: ___ recordem molt bé."
    hint: "pronominal + *en*, per a «de l'Ibrahim»"
    answers: ["Ens en"]
    wrong_answers:
      - text: "Ens"
        why: "Sense *en* falta el pronom de «de l'Ibrahim»: *ens en recordem*."
    grading: tolerant
    explanation: "Amb *nosaltres* no hi ha apòstrof: *ens en recordem*."

  - id: b1-15-018
    type: fill
    point: formes-pronominals
    lesson: 2
    prompt: "—Et refies dels nous veïns? —No, no ___ refio gens."
    hint: "pronominal + *en*, per a «dels veïns»"
    answers: ["me'n"]
    wrong_answers:
      - text: "em"
        why: "Sense *en* no sabem de qui no et refies: *no me'n refio gens*."
    grading: strict
    explanation: "«Dels nous veïns» porta *de*: *no me'n refio gens*."

  - id: b1-15-019
    type: order
    point: en-regim-de
    lesson: 2
    cue: "Et pregunten si et recordes del viatge. Respon que no te'n recordes gaire."
    chunks: ["no", "me'n", "recordo", "gaire"]
    extra: ["m'hi"]
    answers:
      - "No me'n recordo gaire."
    explanation: "El bloc *me'n* no se separa i va davant del verb: *no me'n recordo gaire*."

  - id: b1-15-020
    type: choice
    point: hi-regim
    lesson: 2
    prompt: "Tota la colla s'ha apuntat al torneig. Tota la colla ___ ha apuntat."
    answer: "s'hi"
    distractors:
      - text: "se'n"
        why: "*Apuntar-se a* porta *a*: *s'hi ha apuntat*."
      - text: "hi"
        why: "*Apuntar-se* és pronominal: cal *es* + *hi*: *s'hi ha apuntat*."
    explanation: "«Al torneig» porta *a*: *s'hi ha apuntat*."

  - id: b1-15-021
    type: order
    point: formes-pronominals
    lesson: 2
    cue: "Digues a una amiga que ha vist l'error massa tard."
    chunks: ["te", "n'has", "adonat", "massa tard"]
    extra: ["t'hi"]
    answers:
      - "Te n'has adonat massa tard."
      - "Massa tard te n'has adonat."
    explanation: "Davant de vocal, *et* + *en* s'escriuen separats: *te n'has adonat*."

  - id: b1-15-022
    type: choice
    point: en-regim-de
    lesson: 2
    prompt: "—S'ha alegrat de la notícia? —Sí, ___ha alegrat molt."
    answer: "se n'"
    distractors:
      - text: "s'hi"
        why: "*Alegrar-se de* porta *de*: *se n'ha alegrat*."
      - text: "n'"
        why: "*Alegrar-se* és pronominal: cal *es* + *en*: *se n'ha alegrat*."
    explanation: "«De la notícia» porta *de*. Davant de vocal: *se n'ha alegrat*."

  - id: b1-15-023
    type: choice
    point: hi-regim
    lesson: 2
    prompt: "—Es dedica a la música? —Sí, ___ dedica des de petit."
    answer: "s'hi"
    distractors:
      - text: "se'n"
        why: "*Dedicar-se a* porta *a*: *s'hi dedica*."
      - text: "es"
        why: "Sense *hi* no sabem a què es dedica: *s'hi dedica*."
    explanation: "«A la música» porta *a*: *s'hi dedica*."

  - id: b1-15-024
    type: choice
    point: compte-castella
    lesson: 2
    prompt: "—Et recordes de la Júlia? —Quina resposta és correcta?"
    answer: "Sí, me'n recordo molt bé."
    distractors:
      - text: "Sí, em recordo molt bé."
        why: "En castellà es diu «me acuerdo». En català el *de* no desapareix: *me'n recordo*."
      - text: "Sí, m'hi recordo molt bé."
        why: "*Recordar-se de* porta *de*: *me'n recordo*."
    explanation: "En castellà es diu «me acuerdo». En català, *recordar-se de* manté el pronom: *me'n recordo*."

  - id: b1-15-025
    type: choice
    point: hi-regim
    lesson: 2
    prompt: "—Compteu amb la Laia per a la festa? —Sí, ___ comptem per organitzar-la."
    answer: "hi"
    distractors:
      - text: "en"
        why: "*Comptar amb* porta *amb*: *hi comptem*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un *això*. «Amb la Laia» porta *amb*: *hi*."
    explanation: "«Amb la Laia» porta *amb*: *hi comptem*."

  - id: b1-15-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «Me'n vaig!»?"
    answer: "Que marxo."
    distractors:
      - text: "Que vinc de seguida."
        why: "Vol dir el contrari: que marxa."
      - text: "Que no ho sé."
        why: "Això seria *no en tinc ni idea*. *Me'n vaig* vol dir que marxa."
    explanation: "*Me'n vaig* és del verb *anar-se'n* i vol dir que marxo."

  # ---------------- Lliçó 3 ----------------
  - id: b1-15-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Que es recorden dels avis, els teus germans? —Sí, es recorden molt."
    error: "es recorden molt"
    fix: "se'n recorden molt"
    fix_distractors:
      - text: "s'hi recorden molt"
        why: "*Recordar-se de* porta *de*: *se'n recorden*."
      - text: "se'n recordeu molt"
        why: "El subjecte és *ells*: *se'n recorden*."
    explanation: "Calc del castellà «se acuerdan». En català: *se'n recorden*."

  - id: b1-15-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Heu vist l'error de l'informe? —Sí, vam adonar de seguida."
    error: "vam adonar"
    fix: "ens en vam adonar"
    fix_distractors:
      - text: "ens hi vam adonar"
        why: "*Adonar-se de* porta *de*: *ens en vam adonar*."
      - text: "ens vam adonar"
        why: "Sense *en* és un calc del castellà: *ens en vam adonar*."
    explanation: "Calc del castellà «nos dimos cuenta». En català: *ens en vam adonar*."

  - id: b1-15-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Et refies del nou company? —No, no em refio gens."
    error: "em refio"
    fix: "me'n refio"
    fix_distractors:
      - text: "m'hi refio"
        why: "*Refiar-se de* porta *de*: *me'n refio*."
      - text: "me'n refies"
        why: "El subjecte és *jo*: *me'n refio*."
    explanation: "En castellà es diu «no me fío». En català, el *de* no desapareix: *no me'n refio gens*."

  - id: b1-15-030
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "La Laia s'ha donat compte de l'error aquest matí."
    error: "s'ha donat compte de"
    fix: "s'ha adonat de"
    fix_distractors:
      - text: "se n'ha donat compte de"
        why: "*Donar-se compte* és un calc de «darse cuenta». En català: *adonar-se*."
      - text: "s'ha adonat en"
        why: "*Adonar-se* porta *de*, no *en*: *s'ha adonat de*."
    explanation: "*Donar-se compte* és un calc del castellà «darse cuenta». En català: *adonar-se de*."

  - id: b1-15-031
    type: find-error
    point: formes-pronominals
    lesson: 3
    sentence: "Ahir em vaig adonar de l'error i en vaig parlar amb el cap."
    no_error: true
