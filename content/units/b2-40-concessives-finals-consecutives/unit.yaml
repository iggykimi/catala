  # ---------- Lliçó 5 ----------
  - id: b2-40-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un poble que vol viure del sol"
    text: |
      Fa cinc anys, l'Ajuntament de Vilabona, un poble de tres mil habitants de la comarca d'Osona, va decidir que el municipi viuria de l'energia renovable per reduir la contaminació. Tot i que el pressupost era molt just, van instal·lar plaques solars a l'escola, al pavelló i a la residència d'avis. Malgrat que alguns veïns protestaven perquè les obres feien soroll, el projecte va tirar endavant.

      L'objectiu era clar: produir al poble tota l'electricitat que es consumeix. Per tal que tothom entengués el projecte, l'Ajuntament va organitzar xerrades obertes. «Volem que la factura de la llum surti més barata i que els diners es quedin al poble», va explicar l'alcaldessa, la Núria Vilar.

      Per més que ho intentessin, no aconseguien convèncer tothom. Alguns pagesos deien que les plaques ocupaven massa terra. L'Ajuntament les va posar en terrats i en aparcaments, de manera que no es va perdre ni un pam de conreu. Finalment, gairebé tothom hi va estar d'acord.

      Avui, els resultats són tan bons que altres pobles volen copiar el model. La factura mitjana ha baixat un trenta per cent, un estalvi important per a les famílies, i les emissions del poble també han baixat, encara que el preu de l'electricitat ha pujat a tot el país. S'ha creat una cooperativa amb dos-cents socis que gestiona les instal·lacions. Els beneficis es fan servir perquè l'escola tingui menjador gratuït. També han millorat el reciclatge: hi ha contenidors nous a cada carrer i reutilitzen l'aigua de la pluja per regar el camp de futbol.

      També organitzen xerrades sobre el canvi climàtic a l'escola. Sigui com sigui, la Núria diu que la feina no s'ha acabat: ara volen canviar la calefacció dels edificis públics. Contra vent i marea, Vilabona continua endavant.
    questions:
      - prompt: "Què va fer l'Ajuntament tot i tenir pocs diners?"
        answer: "Va instal·lar plaques solars en tres edificis del poble."
        distractors:
          - text: "Va tancar la residència d'avis per estalviar diners."
            why: "La residència és un dels edificis on van posar plaques."
          - text: "Va esperar a tenir més pressupost abans de començar."
            why: "Van començar tot i que el pressupost era just."
      - prompt: "Per què es van queixar alguns veïns al principi?"
        answer: "Perquè les obres feien soroll."
        distractors:
          - text: "Perquè les plaques ocupaven massa terra de conreu."
            why: "Això ho deien els pagesos, no els veïns."
          - text: "Perquè no volien pagar la factura de la llum."
            why: "El text no diu que la factura fos el motiu de la queixa."
      - prompt: "Com es va resoldre el problema de la terra de conreu?"
        answer: "Es van posar les plaques en terrats i aparcaments."
        distractors:
          - text: "Es va pagar als pagesos per cada pam de terra ocupat."
            why: "El text no diu que paguessin als pagesos."
          - text: "Es van treure les plaques de l'escola i del pavelló."
            why: "Les plaques de l'escola i del pavelló hi continuen."
      - prompt: "Què es fa amb els beneficis de la cooperativa?"
        answer: "Es paga el menjador gratuït de l'escola."
        distractors:
          - text: "Es canvia la calefacció dels edificis públics."
            why: "Això és el pròxim projecte, encara no fet."
          - text: "S'abaixa el preu de l'electricitat de tot el país."
            why: "El preu ha pujat a tot el país; al poble ha baixat la factura."
    explanation: "El text explica com Vilabona va passar a l'energia renovable malgrat les dificultats."

