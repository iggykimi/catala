id: b2-40
level: B2
title: "Concessives, finals i consecutives"
summary: "Les concessives, les finals i les consecutives, en el context del medi ambient i l'energia."
vocabulary_theme: "Medi ambient i energia"
points:
  - id: concessives
    title: "Les concessives: un obstacle que no impedeix res"
    refs:
      - label: "GEIEC: Les oracions subordinades adverbials"
        url: "https://geiec.iec.cat"
  - id: finals
    title: "Les finals: l'objectiu"
    refs:
      - label: "GEIEC: Les oracions subordinades adverbials"
        url: "https://geiec.iec.cat"
  - id: consecutives
    title: "Les consecutives: el resultat"
    refs:
      - label: "GEIEC: Les oracions subordinades adverbials"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: els calcs d'aquesta unitat"
    refs:
      - label: "Optimot: Dubtes de gramàtica"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions: no rendir-se"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: concessives i finals"
  - title: "Practicar les concessives i les finals"
  - title: "Les consecutives i el castellà"
  - title: "Produir: unir i reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el medi ambient"
    definition: "La natura que ens envolta: l'aire, l'aigua, els boscos i els animals."
    example: "Cal protegir el medi ambient amb petits gestos de cada dia."
  - word: "el canvi climàtic"
    definition: "Canvi del clima de la Terra per l'acció humana, que fa pujar les temperatures."
    example: "El canvi climàtic porta més sequeres i més tempestes."
  - word: "les emissions"
    definition: "Gasos que surten dels cotxes i les fàbriques i embruten l'aire."
    example: "Les emissions dels cotxes empitjoren la contaminació de la ciutat."
  - word: "l'energia renovable"
    definition: "Energia que no s'acaba mai, com la del sol, el vent o l'aigua."
    example: "El poble viu de l'energia renovable des de fa tres anys."
  - word: "la placa solar"
    definition: "Aparell que converteix la llum del sol en electricitat."
    example: "Hem posat vuit plaques solars al terrat."
  - word: "el parc eòlic"
    definition: "Conjunt de molins grans que fan electricitat amb el vent."
    example: "El parc eòlic es veu des de la carretera."
  - word: "la factura de la llum"
    definition: "Paper que diu quants diners has de pagar per l'electricitat."
    example: "Amb les plaques, la factura de la llum ha baixat molt."
  - word: "estalviar"
    definition: "Gastar menys diners, energia o aigua."
    example: "Si tanques l'aixeta, estalvies molta aigua."
  - word: "l'estalvi"
    definition: "Diners o energia que no gastes."
    example: "L'estalvi de cada mes ens permet pagar les plaques."
  - word: "el consum"
    definition: "Allò que es gasta d'energia, d'aigua o d'un producte."
    example: "El consum d'aigua puja molt a l'estiu."
  - word: "consumir"
    definition: "Gastar energia, aigua o un producte."
    example: "Aquesta nevera vella consumeix molta electricitat."
  - word: "el reciclatge"
    definition: "Acció de separar les deixalles per tornar-les a fer servir."
    example: "El reciclatge comença a casa, amb tres contenidors."
  - word: "reciclar"
    definition: "Separar les deixalles perquè es puguin tornar a fer servir."
    example: "A casa reciclem el vidre, el paper i el plàstic."
  - word: "el contenidor"
    definition: "Recipient gran del carrer per a cada tipus de deixalles."
    example: "El vidre va al contenidor verd."
  - word: "les deixalles"
    definition: "Allò que llencem perquè ja no serveix."
    example: "Separa les deixalles abans de baixar la brossa."
  - word: "reutilitzar"
    definition: "Tornar a fer servir una cosa en lloc de llençar-la."
    example: "Reutilitzem l'aigua de la pluja per regar."
  - word: "l'envàs"
    definition: "Recipient on es ven un producte, com una ampolla o una capsa."
    example: "Compra l'arròs a granel i estalvia envasos."
  - word: "el plàstic"
    definition: "Material molt usat en envasos que triga molt a desaparèixer."
    example: "Porta la teva bossa i evita el plàstic."
  - word: "la pila"
    definition: "Peça petita que dona electricitat a aparells com el comandament."
    example: "Les piles usades no van a la brossa."
  - word: "l'aixeta"
    definition: "Aparell que obre i tanca el pas de l'aigua."
    example: "Tanca bé l'aixeta quan et rentes les dents."
  - word: "la sequera"
    definition: "Període llarg sense pluja."
    example: "La sequera d'aquest any ha buidat els pantans."
  - word: "l'hort urbà"
    definition: "Tros de terra a la ciutat on els veïns planten verdures."
    example: "A l'hort urbà hi cultivem tomàquets."
  - word: "el bosc"
    definition: "Terreny gran ple d'arbres."
    example: "Diumenge anirem a netejar el bosc amb els voluntaris."
  - word: "l'incendi forestal"
    definition: "Foc gran que crema un bosc."
    example: "L'incendi forestal va cremar dues-centes hectàrees."
  - word: "la platja"
    definition: "Vora del mar amb sorra."
    example: "Cada primavera netegem la platja del poble."
  - word: "el voluntari, la voluntària"
    definition: "Persona que treballa gratis per ajudar els altres."
    example: "Els voluntaris recullen la brossa del riu."
  - word: "netejar"
    definition: "Treure la brutícia d'un lloc."
    example: "Netejarem el jardí dissabte al matí."
  - word: "la manifestació"
    definition: "Marxa de molta gent al carrer per demanar una cosa."
    example: "Dissabte hi ha una manifestació pel clima."
  - word: "el transport públic"
    definition: "Autobusos, trens i metros que pot fer servir tothom."
    example: "Vaig a la feina en transport públic."
  - word: "el carril bici"
    definition: "Part del carrer només per a bicicletes."
    example: "El carril bici nou arriba fins a l'estació."
  - word: "la contaminació"
    definition: "Brutícia de l'aire o de l'aigua per l'acció humana."
    example: "La contaminació baixa quan hi ha menys cotxes."
  - word: "contaminar"
    definition: "Embrutar l'aire o l'aigua amb productes nocius."
    example: "Les fàbriques no poden contaminar el riu."
  - word: "la tempesta"
    definition: "Pluja forta amb vent, trons i llamps."
    example: "La tempesta d'ahir va tallar la llum."
  - word: "el riu"
    definition: "Corrent natural d'aigua que va fins al mar."
    example: "El riu baixa molt brut després de la tempesta."
  - word: "el soroll"
    definition: "So fort o desagradable."
    example: "El soroll de les obres no em deixa dormir."
  - word: "l'electricitat"
    definition: "Energia que fa funcionar els llums i els aparells."
    example: "Sense electricitat no va ni la nevera."
  - word: "la calefacció"
    definition: "Sistema que escalfa una casa o un edifici."
    example: "A l'hivern posem la calefacció a vint graus."
  - word: "la deixalleria"
    definition: "Lloc on es porten les deixalles especials: piles, mobles, pintura."
    example: "Porta les piles usades a la deixalleria."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-40-001
    type: choice
    point: concessives
    lesson: 1
    prompt: "___ plou, anirem a netejar la platja amb els voluntaris."
    answer: "Tot i que"
    distractors:
      - text: "Per tal que"
        why: "*Per tal que* expressa finalitat. La pluja no és l'objectiu de netejar: és un obstacle."
      - text: "De manera que"
        why: "Anar a netejar no és el resultat de la pluja: hi anirem malgrat la pluja."
    explanation: "Anirem a netejar malgrat la pluja: la pluja és un obstacle, no l'objectiu ni el resultat. *Tot i que* presenta un obstacle real amb indicatiu."

  - id: b2-40-002
    type: choice
    point: concessives
    lesson: 1
    prompt: "___ que plovia a bots i barrals, vam netejar tota la platja."
    answer: "Malgrat"
    distractors:
      - text: "A pesar de"
        why: "*A pesar de* és un calc de «a pesar de». En català, davant de *que* diem *malgrat que*."
      - text: "Malgrat de"
        why: "*Malgrat que*, sense *de*."
    explanation: "Davant de *que* + frase, el connector és *malgrat que*. *A pesar de que* és un calc del castellà."

  - id: b2-40-003
    type: choice
    point: finals
    lesson: 1
    prompt: "Tanqueu l'aixeta ___ no es malgasti l'aigua."
    answer: "perquè"
    distractors:
      - text: "tot i que"
        why: "No és una concessió: que no es malgasti l'aigua és l'objectiu de tancar l'aixeta."
      - text: "així doncs"
        why: "*Així doncs* expressa una conclusió amb indicatiu; aquí hi ha una finalitat amb subjuntiu."
    explanation: "Tancar l'aixeta té un objectiu: que no es malgasti l'aigua. La finalitat s'expressa amb *perquè* + subjuntiu."

  - id: b2-40-004
    type: choice
    point: finals
    lesson: 1
    prompt: "Us envio els horaris del transport públic ___ venir sense cotxe."
    answer: "perquè pugueu"
    distractors:
      - text: "per poder"
        why: "Amb *per* + infinitiu, qui ve seria el mateix que envia els horaris. Aquí sou vosaltres qui ha de venir: *perquè pugueu*."
      - text: "per a que pugueu"
        why: "*Per a que* no existeix: la finalitat és *perquè* (o *per tal que*) + subjuntiu."
    explanation: "Enviar els horaris té un objectiu: que pugueu venir sense cotxe. La finalitat demana subjuntiu: *pugueu*."

  - id: b2-40-005
    type: choice
    point: concessives
    lesson: 1
    prompt: "Què vol dir «Per més que insistim, no ens faran cas»?"
    answer: "Encara que insistim molt, no ens faran cas."
    distractors:
      - text: "Si insistim més, potser ens faran cas."
        why: "Al contrari: no ens faran cas per més que insistim."
      - text: "Hem d'insistir perquè ens facin cas."
        why: "No és un objectiu: és un esforç inútil."
    explanation: "*Per més que* + subjuntiu expressa un esforç inútil: insistim molt, però no ens faran cas."

  - id: b2-40-006
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["contra vent i marea", "malgrat totes les dificultats"]
      - ["de totes totes", "segur, sense falta"]
      - ["sigui com sigui", "en tot cas"]
      - ["costi el que costi", "sense importar el preu ni l'esforç"]
    explanation: "Són expressions per dir que no ens rendim, passi el que passi."

  - id: b2-40-007
    type: inline-choice
    point: concessives
    lesson: 1
    title: "Excursió al parc natural"
    text: "Benvolgudes famílies: {Tot i que|Perquè|De manera que} diuen que plourà, demà anirem d'excursió al parc natural. Porteu botes, {perquè|encara que|així doncs} el camí és ple de fang. {Encara que|Per tal que|De manera que} el camí sigui llarg, la vista des del cim val la pena. Dinarem al refugi {perquè|tot i que|de manera que} fa massa fred per dinar fora."
    explanation: "La pluja anunciada és un obstacle (*tot i que*); les botes i el refugi tenen una causa (*perquè* el camí és ple de fang; *perquè* fa fred); la llargada del camí és un obstacle que no impedeix l'excursió (*encara que* + subjuntiu)."

  - id: b2-40-008
    type: fill
    point: finals
    lesson: 1
    prompt: "Guarda les piles usades en aquest pot perquè no ___ el calaix."
    hint: "contaminar, tercera persona plural"
    answers: ["contaminin"]
    wrong_answers:
      - text: "contaminen"
        why: "L'indicatiu (*contaminen*) expressaria la causa, que no té sentit: és la finalitat, *contaminin*."
    grading: tolerant
    explanation: "Guardar les piles té un objectiu: que no contaminin el calaix. La finalitat demana subjuntiu."

  - id: b2-40-009
    type: fill
    point: concessives
    lesson: 1
    prompt: "___ que insistiu, no us faran cap descompte en la factura de la llum."
    hint: "connector d'esforç inútil"
    answers: ["Per més", "Per molt"]
    wrong_answers:
      - text: "Per tal"
        why: "*Per tal que* expressa finalitat («amb l'objectiu que»), no un esforç inútil."
      - text: "A pesar de"
        why: "«A pesar de que» és un calc del castellà; aquí cal un connector d'esforç inútil: *per més que*."
    grading: tolerant
    explanation: "El descompte no arribarà per més que insistiu: és un esforç inútil, que s'expressa amb *per més que* (o *per molt que*)."

  - id: b2-40-010
    type: choice
    point: finals
    lesson: 1
    prompt: "Què vol dir «Tanca la porta perquè no entri fred»?"
    answer: "Tanca-la amb l'objectiu que no entri fred."
    distractors:
      - text: "Tanca-la, ja que no entra gens de fred."
        why: "Si no entrés fred, no caldria tancar-la: és l'objectiu, no la causa."
      - text: "Tanca-la després que hagi entrat fred."
        why: "No és posterior: cal tancar-la abans que entri."
    explanation: "«Perquè no entri fred» no diu la causa, sinó l'objectiu de tancar la porta: la finalitat, amb subjuntiu."

  - id: b2-40-011
    type: order
    point: concessives
    lesson: 1
    cue: "L'Arnau anuncia la neteja del bosc: potser plourà, però hi aniran igualment."
    chunks: ["Encara que", "plogui", "sortirem", "a netejar el bosc"]
    extra: ["plou"]
    answers:
      - "Encara que plogui, sortirem a netejar el bosc."
      - "Sortirem a netejar el bosc encara que plogui."
    explanation: "La pluja és una hipòtesi futura, no un fet: *encara que* + subjuntiu (*plogui*). El bloc concessiu pot anar davant o darrere."

  - id: b2-40-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «contra vent i marea»?"
    answer: "Malgrat totes les dificultats."
    distractors:
      - text: "Amb molt de vent i onades."
        why: "Aquest és el sentit literal; l'expressió és figurada."
      - text: "Amb l'ajuda de tothom."
        why: "No parla d'ajuda: vol dir superar totes les dificultats."
    explanation: "«Contra vent i marea» vol dir malgrat totes les dificultats, sense rendir-se."

  - id: b2-40-013
    type: choice
    point: finals
    lesson: 1
    prompt: "Regaran l'hort de nit ___ l'aigua no s'evapori amb la calor."
    answer: "perquè"
    distractors:
      - text: "tot i que"
        why: "No és una concessió: que l'aigua no s'evapori és l'objectiu de regar de nit."
      - text: "així doncs"
        why: "*Així doncs* no va amb subjuntiu ni expressa finalitat."
    explanation: "Regar de nit té un objectiu: que l'aigua no s'evapori. La finalitat s'expressa amb *perquè* + subjuntiu."

  # ---------- Lliçó 2 ----------
  - id: b2-40-014
    type: fill
    point: finals
    lesson: 2
    prompt: "La Fàtima us deixa les claus de casa perquè ___ sense trucar."
    hint: "poder entrar, segona persona plural"
    answers: ["pugueu entrar"]
    wrong_answers:
      - text: "podeu entrar"
        why: "La finalitat demana subjuntiu: *pugueu entrar*."
    grading: tolerant
    explanation: "Deixar les claus té un objectiu: que pugueu entrar sense trucar. La finalitat demana subjuntiu."

  - id: b2-40-015
    type: fill
    point: finals
    lesson: 2
    prompt: "Posa el menjar en un envàs de vidre i posa'l a la nevera perquè no es ___."
    hint: "fer-se malbé, tercera persona singular"
    answers: ["faci malbé"]
    wrong_answers:
      - text: "fa malbé"
        why: "La finalitat demana subjuntiu: que no es *faci malbé*."
    grading: tolerant
    explanation: "Posar el menjar a la nevera té un objectiu: que no es faci malbé. La finalitat demana subjuntiu."

  - id: b2-40-016
    type: fill
    point: concessives
    lesson: 2
    prompt: "—Demà potser farà vent. —Encara que ___, la Fira de la Terra es farà igualment."
    hint: "fer vent, present de subjuntiu"
    answers: ["faci vent"]
    wrong_answers:
      - text: "fa vent"
        why: "«Demà potser» presenta una hipòtesi, no un fet: cal subjuntiu, *faci*."
      - text: "farà vent"
        why: "«Potser» presenta el vent com una hipòtesi, no com un fet segur: cal subjuntiu, *faci*."
    grading: tolerant
    explanation: "«Demà potser» presenta una hipòtesi futura: *encara que* + subjuntiu (*faci*)."

  - id: b2-40-017
    type: fill
    point: concessives
    lesson: 2
    prompt: "—Ahir feia un fred que pelava. —Sí, i encara que ___ tant de fred, el Pau va anar a la feina pel carril bici."
    hint: "fer, imperfet d'indicatiu"
    answers: ["feia"]
    wrong_answers:
      - text: "farà"
        why: "El fet és d'ahir: cal l'imperfet, *feia*."
      - text: "fes"
        why: "*Fes* és subjuntiu; el fred d'ahir és un fet real i la pista demana l'imperfet d'indicatiu: *feia*."
    grading: tolerant
    explanation: "«Ahir feia» presenta un fet real i passat: *encara que* + imperfet d'indicatiu (*feia*)."

  - id: b2-40-018
    type: order
    point: finals
    lesson: 2
    cue: "Digues que facin dutxes curtes amb l'objectiu de no malgastar l'aigua."
    chunks: ["Feu", "dutxes curtes", "perquè", "no es malgasti", "l'aigua"]
    extra: ["es malgasta"]
    answers:
      - "Feu dutxes curtes perquè no es malgasti l'aigua."
      - "Perquè no es malgasti l'aigua, feu dutxes curtes."
    explanation: "L'objectiu de fer dutxes curtes és que no es malgasti l'aigua: *perquè* + subjuntiu. El bloc final pot anar davant o darrere."

  - id: b2-40-019
    type: order
    point: concessives
    lesson: 2
    cue: "En Jordi explica com van treballar a l'hort amb la calor que feia."
    chunks: ["Malgrat", "la calor", "van treballar", "tot el dia", "a l'hort"]
    extra: ["que"]
    answers:
      - "Malgrat la calor, van treballar tot el dia a l'hort."
      - "Van treballar tot el dia a l'hort malgrat la calor."
    explanation: "La calor és un obstacle real: *malgrat* + nom. Davant d'un nom, *malgrat* no porta *que*."

  - id: b2-40-020
    type: choice
    point: concessives
    lesson: 2
    prompt: "___ insistiu, no us abaixaran la factura."
    answer: "Per més que"
    distractors:
      - text: "Per tal que"
        why: "*Per tal que* expressa finalitat («amb l'objectiu que insistiu»), que no té sentit aquí."
      - text: "Tot i"
        why: "Davant d'una frase amb verb conjugat cal *tot i que*, no *tot i* tot sol."
    explanation: "L'esforç és inútil: per més que insistiu, no us abaixaran la factura. *Per més que* presenta l'esforç que no servirà de res."

  - id: b2-40-021
    type: choice
    point: finals
    lesson: 2
    prompt: "Posarem plaques solars per tal que la factura ___ més barata."
    answer: "surti"
    distractors:
      - text: "surt"
        why: "*Per tal que* només expressa finalitat i demana subjuntiu: *surti*."
      - text: "sortiria"
        why: "*Per tal que* demana el present de subjuntiu, no el condicional: *surti*."
    explanation: "Posar plaques té un objectiu futur: que la factura surti més barata. *Per tal que* expressa finalitat i demana subjuntiu."

  - id: b2-40-022
    type: choice
    point: concessives
    lesson: 2
    prompt: "Què vol dir «Encara que estigui cansat, vindrà a la xerrada sobre el canvi climàtic»?"
    answer: "El cansament no li impedirà venir a la xerrada."
    distractors:
      - text: "No vindrà a la xerrada perquè està cansat."
        why: "Al contrari: el cansament no li impedirà venir."
      - text: "Vindrà a la xerrada només si està cansat."
        why: "No és una condició: vindrà tant si està cansat com si no."
    explanation: "*Encara que* + subjuntiu (*estigui*) presenta el cansament com un obstacle que no impedirà l'acció: vindrà igualment."

  - id: b2-40-023
    type: inline-choice
    point: finals
    lesson: 2
    title: "La factura de la llum"
    text: "Vols pagar menys de llum? Apaga els llums {perquè|tot i que|així doncs} no gastin energia quan no hi ha ningú. {Tot i que|Perquè|De manera que} fa mandra, desconnecta els aparells del tot, {perquè|tot i que|de manera que} el consum en repòs també es paga. Renta la roba amb aigua freda {perquè|tot i que|així doncs} la rentadora consumeixi menys."
    explanation: "Apagar els llums i rentar amb aigua freda tenen un objectiu (*perquè* + subjuntiu). La mandra és un obstacle (*tot i que* + indicatiu) i el consum en repòs és la causa (*perquè* + indicatiu)."

  - id: b2-40-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "—Vindreu a netejar el riu dissabte? —___: no ens ho perdríem per res del món."
    answer: "De totes totes"
    distractors:
      - text: "De tant en tant"
        why: "Vol dir «a vegades»: aquí vindran segur."
      - text: "De mica en mica"
        why: "Vol dir «poc a poc»: aquí vindran segur."
    explanation: "«De totes totes» vol dir amb tota decisió: vindran segur, no s'ho perdran per res del món."

  - id: b2-40-025
    type: fill
    point: expressions
    lesson: 2
    prompt: "___, acabarem el parc eòlic abans de l'estiu."
    hint: "expressió: malgrat totes les dificultats"
    answers: ["Contra vent i marea"]
    wrong_answers:
      - text: "Contra el vent i la marea"
        why: "L'expressió fixa no porta articles: *contra vent i marea*."
    grading: tolerant
    explanation: "«Contra vent i marea» vol dir malgrat totes les dificultats: l'expressió no porta articles."

  - id: b2-40-026
    type: choice
    point: finals
    lesson: 2
    prompt: "Parla a poc a poc ___ tothom t'entengui."
