  # ---------- Lliçó 5 ----------
  - id: b2-38-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una mediació al jutjat"
    text: |
      La Carla viu a Barberà del Vallès i fa un any va tenir un conflicte amb el veí del costat, que posava música molt alta cada nit. Al principi va intentar parlar-hi: hi va anar tres vegades i li va demanar que baixés el volum. Com que no hi va haver manera, va anar a la comissaria i va denunciar el soroll. La denúncia va arribar al jutjat i la jutgessa va fixar la vista per al mes de març.

      La Carla estava nerviosa: era la primera vegada que veia jutjar una persona de prop. L'advocada d'ofici li va explicar que tot seria molt senzill: el fiscal només demanava que el soroll s'acabés i no demanava cap pena de presó. A la sala, la jutgessa va escoltar les dues parts i un altre veí, que hi declarava com a testimoni. El veí es declarava innocent i deia que ell no hi tenia res a veure, que la música era d'un altre pis. La Carla, en canvi, portava proves: tres gravacions fetes amb el mòbil on se sentia la música a les tres de la matinada.

      Llavors la jutgessa va proposar una mediació. Els va recordar que tothom és igual davant la llei i que un acord era millor que una sentència per a la convivència de l'escala. El veí hi va estar d'acord de seguida i es va comprometre a no posar música a partir de les deu de la nit. La Carla també hi va estar d'acord, i la jutgessa va tancar el cas sense condemnar ningú: de fet, va absoldre el veí del delicte lleu.

      En sortir del jutjat, la Carla estava contenta. «Què hi farem!», va pensar: havia perdut tres matins, però cap de les dues parts no va recórrer i l'escala va tornar a ser un lloc tranquil.
    questions:
      - prompt: "Per què va anar la Carla al jutjat?"
        answer: "Perquè el veí no va fer cas de les queixes pel soroll."
        distractors:
          - text: "Perquè el veí la va denunciar a la comissaria."
            why: "És al revés: la Carla va denunciar el veí."
          - text: "Perquè volia demanar la presó per al veí."
            why: "El fiscal no demanava cap pena de presó; només volia que s'acabés el soroll."
      - prompt: "Què va passar a la vista?"
        answer: "La jutgessa va escoltar tothom i va proposar una mediació."
        distractors:
          - text: "El veí va reconèixer que la música era seva."
            why: "El veí es declarava innocent i deia que la música era d'un altre pis."
          - text: "La Carla no va portar cap prova del soroll."
            why: "La Carla portava tres gravacions fetes amb el mòbil."
      - prompt: "Com es va resoldre el conflicte?"
        answer: "Amb un acord: el veí no posaria música a partir de les deu."
        distractors:
          - text: "Amb una sentència que condemnava el veí."
            why: "La jutgessa va tancar el cas sense condemnar ningú."
          - text: "Amb un recurs que va presentar la Carla."
            why: "Cap de les dues parts no va recórrer."
      - prompt: "Què vol dir que la Carla pensa «Què hi farem!»?"
        answer: "Que accepta amb resignació el temps perdut."
        distractors:
          - text: "Que protesta perquè la sentència és injusta."
            why: "Això seria «no hi ha dret»; «què hi farem» expressa resignació."
          - text: "Que no vol saber res més del veí."
            why: "Això seria «no en vull saber res»; «què hi farem» expressa resignació."
    explanation: "El text explica com un conflicte entre veïns es resol amb una mediació al jutjat."

