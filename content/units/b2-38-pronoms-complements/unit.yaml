  - id: b2-38-062
    type: inline-choice
    point: hi-complements
    lesson: 5
    title: "Després del judici"
    text: "El judici s'ha acabat. El fiscal {hi|en|ho} està d'acord: han condemnat l'acusat. L'advocada {hi|en|ho} pensa cada dia: la sentència li sembla injusta. L'acusat diu que la condemna no {ho|hi|en} és, de justa. Els veïns {en|hi|ho} parlen cada dia, del judici."
    explanation: "«Hi» substitueix «amb el veredicte» («hi està d'acord») i «en la sentència» («hi pensa»); «ho» substitueix l'atribut «justa»; «en» substitueix «del judici» («en parlen»)."

