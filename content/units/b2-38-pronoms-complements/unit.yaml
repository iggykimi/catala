id: b2-38
level: B2
title: "Els pronoms febles en tots els complements"
summary: "Substitució del complement de règim, del lloc, de la manera, de l'atribut i del predicatiu, i de frases senceres: el format de l'exercici 4 de l'examen, en el context de la justícia."
vocabulary_theme: "Justícia i societat"
points:
  - id: hi-complements
    title: "El pronom *hi*: règim, lloc i manera"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: en-complements
    title: "El pronom *en*: el complement amb *de*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: atribut-predicatiu
    title: "L'atribut, el predicatiu i les frases senceres"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-omissio
    title: "Compte amb el castellà: el pronom que no es pot ometre"
    refs:
      - label: "Optimot: Pronoms febles"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions amb *hi* i *en*"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: hi i en"
  - title: "Practicar hi i en"
  - title: "Atribut, predicatiu i el pronom que no s'omet"
  - title: "Produir: substitueix-ho tot"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el judici"
    definition: "Procés en què el jutge escolta les parts i decideix qui té la raó."
    example: "El judici començarà al gener."
  - word: "la vista"
    definition: "Sessió del judici en què les parts parlen davant del jutge."
    example: "La vista de dimarts va durar dues hores."
  - word: "el jutjat"
    definition: "Oficina del jutge on es porten els casos."
    example: "La denúncia ja ha arribat al jutjat."
  - word: "el tribunal"
    definition: "Conjunt de jutges que decideixen un cas."
    example: "El tribunal es reunirà dilluns."
  - word: "la sala"
    definition: "Habitació on es fan les vistes."
    example: "La sala era plena de periodistes."
  - word: "el jutge, la jutgessa"
    definition: "Persona que dirigeix el judici i dicta la sentència."
    example: "La jutgessa va escoltar les dues parts."
  - word: "l'acusat, l'acusada"
    definition: "Persona a qui s'acusa d'un delicte en un judici."
    example: "L'acusat va negar els fets."
  - word: "l'advocat, l'advocada"
    definition: "Persona que defensa una de les parts en un judici."
    example: "La meva advocada em truca demà."
  - word: "el fiscal, la fiscal"
    definition: "Persona que acusa en nom de l'Estat."
    example: "El fiscal va demanar tres anys de presó."
  - word: "el testimoni, la testimoni"
    definition: "Persona que explica al judici allò que ha vist."
    example: "Dos testimonis van declarar a favor de l'acusat."
  - word: "la sentència"
    definition: "Decisió final del jutge."
    example: "Encara no s'ha publicat la sentència."
  - word: "el veredicte"
    definition: "Decisió sobre la culpabilitat de l'acusat."
    example: "El veredicte va ser d'innocència."
  - word: "el jurat"
    definition: "Grup de ciutadans que decideix el veredicte."
    example: "El jurat es va reunir durant tres hores."
  - word: "el delicte"
    definition: "Acció contra la llei que es pot castigar."
    example: "Conduir begut és un delicte."
  - word: "la multa"
    definition: "Diners que cal pagar com a càstig."
    example: "Li van posar una multa per aparcar malament."
  - word: "la presó"
    definition: "Edifici on compleixen la condemna les persones condemnades."
    example: "El van condemnar a dos anys de presó."
  - word: "la condemna"
    definition: "Pena que imposa la sentència."
    example: "La condemna va ser de cinc anys de presó."
  - word: "condemnar"
    definition: "Declarar culpable i imposar una pena."
    example: "El van condemnar a pagar una multa."
  - word: "absoldre"
    definition: "Declarar innocent."
    example: "El jurat el va absoldre per falta de proves."
  - word: "innocent"
    definition: "Que no ha comès el delicte."
    example: "Es va declarar innocent davant del jutge."
  - word: "culpable"
    definition: "Que ha comès el delicte."
    example: "El jurat el va declarar culpable."
  - word: "la denúncia"
    definition: "Comunicació d'un delicte a la policia."
    example: "Va posar una denúncia a la comissaria."
  - word: "denunciar"
    definition: "Comunicar un delicte a la policia o al jutjat."
    example: "La veïna va denunciar el soroll."
  - word: "el recurs"
    definition: "Escrit per demanar que es revisi una sentència."
    example: "L'advocat va presentar un recurs."
  - word: "recórrer"
    definition: "Presentar un recurs contra una sentència."
    example: "Van recórrer contra la sentència al març."
  - word: "la prova"
    definition: "Fet o objecte que demostra la veritat."
    example: "La gravació és la prova principal."
  - word: "declarar"
    definition: "Explicar els fets davant del jutge."
    example: "El testimoni va declarar durant una hora."
  - word: "jutjar"
    definition: "Decidir en un judici qui té la raó."
    example: "La jutjaran a Girona al gener."
  - word: "la llei"
    definition: "Norma general que tothom ha de respectar."
    example: "La llei protegeix els llogaters."
  - word: "just, justa"
    definition: "Conforme a la justícia."
    example: "Va ser una sentència justa."
  - word: "injust, injusta"
    definition: "Contrari a la justícia."
    example: "Troba injusta la multa."
  - word: "la igualtat"
    definition: "Fet que totes les persones tinguin els mateixos drets."
    example: "La igualtat davant la llei."
  - word: "la convivència"
    definition: "Fet de viure juntes, sense conflictes, persones diferents."
    example: "El soroll trenca la convivència."
  - word: "el conflicte"
    definition: "Desacord greu entre persones."
    example: "Hi ha un conflicte entre dos veïns."
  - word: "la mediació"
    definition: "Ajuda d'una tercera persona per resoldre un conflicte."
    example: "Van resoldre el conflicte amb una mediació."
  - word: "l'expedient"
    definition: "Conjunt de papers d'un cas."
    example: "L'expedient té tres-centes pàgines."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-38-001
    type: choice
    point: hi-complements
    lesson: 1
    prompt: "—Vas anar a la vista d'ahir? —Sí, ___ vaig anar amb la Carla."
    answer: "hi"
    distractors:
      - text: "en"
        why: "«A la vista» porta *a*, no *de*: el pronom és *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut, no un lloc."
    explanation: "«A la vista» és un complement de lloc amb *a*: el pronom és *hi*."

  - id: b2-38-002
    type: choice
    point: hi-complements
    lesson: 1
    prompt: "—L'advocada pensa en el recurs? —Sí, ___ pensa cada dia."
    answer: "hi"
    distractors:
      - text: "en"
        why: "«En el recurs» porta *en*, no *de*: el pronom és *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut, no un complement amb *en*."
    explanation: "«En el recurs» és un complement amb *en*: el pronom és *hi*."

  - id: b2-38-003
    type: choice
    point: en-complements
    lesson: 1
    prompt: "—L'Ibrahim parla sovint de la sentència? —Sí, ___ parla cada dia."
    answer: "en"
    distractors:
      - text: "hi"
        why: "«De la sentència» porta *de*, no *a* ni *en*: el pronom és *en*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut; «de la sentència» és un complement amb *de*: *en*."
    explanation: "«De la sentència» és un complement amb *de*: el pronom és *en*."

  - id: b2-38-004
    type: choice
    point: en-complements
    lesson: 1
    prompt: "—La Montse es recorda de la vista? —Sí, ___ recorda perfectament."
    answer: "se'n"
    distractors:
      - text: "s'hi"
        why: "«De la vista» porta *de*: recordar-se'n, no recordar-s'hi."
      - text: "es"
        why: "Sense *en* la frase queda incompleta: recordar-se de la vista és recordar-se'n."
    explanation: "«Recordar-se» regeix *de* («recordar-se de la vista»): el pronom és *en*, amb el reflexiu: *se'n recorda*."

  - id: b2-38-005
    type: choice
    point: hi-complements
    lesson: 1
    prompt: "—Vas anar a Girona amb tren? —Sí, ___ vaig anar."
    answer: "hi"
    distractors:
      - text: "en"
        why: "«Amb tren» és un complement de manera amb *amb*: el pronom és *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut, no un complement amb *amb*."
    explanation: "«Amb tren» diu com hi va anar: els complements de manera amb *amb* se substitueixen per *hi*."

  - id: b2-38-006
    type: choice
    point: en-complements
    lesson: 1
    prompt: "—Ja saps que han recorregut contra la sentència? —Sí, ___ vaig assabentar ahir."
    answer: "me'n"
    distractors:
      - text: "m'hi"
        why: "«Assabentar-se» regeix *de*, no *a* ni *en*: *me'n vaig assabentar*."
      - text: "em"
        why: "Sense *en* la frase queda incompleta: assabentar-se de la notícia és assabentar-se'n."
    explanation: "«Assabentar-se» regeix *de* («assabentar-se de la notícia»): el pronom és *en*: *me'n vaig assabentar*."

  - id: b2-38-007
    type: match
    point: en-complements
    lesson: 1
    instruction: "Relaciona cada frase amb el complement que substitueix el pronom."
    pairs:
      - ["Hi pensa cada dia", "pensa en el recurs"]
      - ["En parla sovint", "parla de la sentència"]
      - ["Se'n recorda bé", "es recorda de la vista"]
      - ["No se'n refia gaire", "no es refia del fiscal"]
      - ["Hi confia plenament", "confia en l'advocada"]
    explanation: "«Hi» substitueix «en el recurs» i «en l'advocada»; «en» substitueix «de la sentència», «de la vista» i «del fiscal»."

  - id: b2-38-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["no hi ha dret", "Et posen una multa injusta i protestes."]
      - ["ja n'hi ha prou", "El soroll dels veïns no et deixa dormir."]
      - ["no en vull saber res", "No vols participar en el conflicte dels veïns."]
      - ["no tenir-hi res a veure", "T'acusen d'un error que no has comès."]
      - ["què hi farem", "S'ha acabat el termini i ja no pots recórrer."]
    explanation: "Totes cinc porten *hi* o *en*: serveixen per protestar, per dir prou, per no participar-hi, per negar qualsevol participació i per resignar-se."

  - id: b2-38-009
    type: inline-choice
    point: hi-complements
    lesson: 1
    title: "Abans de la vista"
    text: "L'advocada {hi|en|ho} pensa cada nit: demà hi ha la vista. {En|Hi|Ho} parla amb el fiscal, però no {se'n|s'hi|es} refia gaire. L'acusat diu que no {se'n|s'hi|es} recorda. L'advocada {hi|en|ho} confia, però té por del veredicte."
    explanation: "«Hi» substitueix «en la vista» («hi pensa») i «en l'acusat» («hi confia»); «en» substitueix «de la vista» («en parla»), «del fiscal» («no se'n refia») i «dels fets» («no se'n recorda»)."

  - id: b2-38-010
    type: fill
    point: hi-complements
    lesson: 1
    prompt: "—L'advocada compta amb el testimoni del porter? —Sí, ___ compta per al judici."
    hint: "pronom per a «amb el testimoni»"
    answers: ["hi"]
    wrong_answers:
      - text: "en"
        why: "«Amb el testimoni» porta *amb*: el pronom és *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut, no un complement amb *amb*."
    grading: tolerant
    explanation: "«Amb el testimoni» és un complement amb *amb*: el pronom és *hi*."

  - id: b2-38-011
    type: fill
    point: en-complements
    lesson: 1
    prompt: "—La jutgessa parlarà del cas a la vista? —Sí, ___ parlarà demà."
    hint: "pronom per a «del cas»"
    answers: ["en"]
    wrong_answers:
      - text: "hi"
        why: "«Del cas» porta *de*: el pronom és *en*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut; «del cas» és un complement amb *de*: *en*."
    grading: tolerant
    explanation: "«Del cas» és un complement amb *de*: el pronom és *en*."

  - id: b2-38-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «no hi ha dret»?"
    answer: "És una protesta davant d'una injustícia."
    distractors:
      - text: "És una manera de donar la raó a algú."
        why: "Al contrari: qui diu «no hi ha dret» protesta, no dona la raó."
      - text: "Vol dir que una cosa és il·legal."
        why: "Ser injust no és el mateix que ser il·legal: «no hi ha dret» protesta per la injustícia."
    explanation: "«No hi ha dret!» es diu quan passa una cosa injusta: és una protesta, no una opinió legal."

  - id: b2-38-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Et posen una multa que trobes totalment injusta. Què dius?"
    answer: "No hi ha dret!"
    distractors:
      - text: "Ja n'hi ha prou!"
        why: "Això demana que s'acabi una situació; aquí protestes per la injustícia: «no hi ha dret»."
      - text: "Què hi farem!"
        why: "Això expressa resignació; aquí protestes, no et resignes: «no hi ha dret»."
    explanation: "Davant d'una multa injusta protestes per la injustícia: «no hi ha dret»."

  # ---------- Lliçó 2 ----------
  - id: b2-38-014
    type: fill
    point: hi-complements
    lesson: 2
    prompt: "—En Pau participa en el debat? —Sí, ___ participa cada setmana."
    hint: "pronom per a «en el debat»"
    answers: ["hi"]
    wrong_answers:
      - text: "en"
        why: "«En el debat» porta *en*: el pronom és *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut, no un complement amb *en*."
    grading: tolerant
    explanation: "«En el debat» és un complement amb *en*: el pronom és *hi*."

  - id: b2-38-015
    type: fill
    point: en-complements
    lesson: 2
    prompt: "—La Carla es queixa de la multa? —Sí, ___ queixa cada dia."
    hint: "pronom per a «de la multa», amb el reflexiu"
    answers: ["se'n"]
    wrong_answers:
      - text: "s'hi"
        why: "«De la multa» porta *de*: queixar-se'n."
      - text: "es"
        why: "Sense *en* la frase queda incompleta: queixar-se de la multa és queixar-se'n."
    grading: tolerant
    explanation: "«Queixar-se» regeix *de* («queixar-se de la multa»): *se'n queixa*."

  - id: b2-38-016
    type: fill
    point: hi-complements
    lesson: 2
    prompt: "—Confieu en el jurat? —Sí, ___ confiem plenament."
    hint: "pronom per a «en el jurat»"
    answers: ["hi"]
    wrong_answers:
      - text: "en"
        why: "«En el jurat» porta *en*: el pronom és *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut, no un complement amb *en*."
    grading: tolerant
    explanation: "«En el jurat» és un complement amb *en*: el pronom és *hi*."

  - id: b2-38-017
    type: fill
    point: en-complements
    lesson: 2
    prompt: "—L'acusat es penedeix del delicte? —Sí, ___ penedeix de veritat."
    hint: "pronom per a «del delicte», amb el reflexiu"
    answers: ["se'n"]
    wrong_answers:
      - text: "s'hi"
        why: "«Del delicte» porta *de*: penedir-se'n."
      - text: "es"
        why: "Sense *en* la frase queda incompleta: penedir-se del delicte és penedir-se'n."
    grading: tolerant
    explanation: "«Penedir-se» regeix *de* («penedir-se del delicte»): *se'n penedeix*."

  - id: b2-38-018
    type: fill
    point: hi-complements
    lesson: 2
    prompt: "—Us dediqueu al cas? —Sí, ___ dediquem cada tarda."
    hint: "pronom per a «al cas», amb el reflexiu"
    answers: ["ens hi"]
    wrong_answers:
      - text: "ens en"
        why: "«Al cas» porta *a*: dedicar-s'hi."
      - text: "ens"
        why: "Sense *hi* la frase queda incompleta: dedicar-se al cas és dedicar-s'hi."
    grading: tolerant
    explanation: "«Dedicar-se» regeix *a* («dedicar-se al cas»): *ens hi dediquem*."

  - id: b2-38-019
    type: order
    point: en-complements
    lesson: 2
    cue: "La Laia diu que no es recorda de la sentència."
    chunks: ["La Laia", "no", "se'n", "recorda"]
    extra: ["s'hi"]
    answers:
      - "La Laia no se'n recorda."
    explanation: "«Recordar-se» regeix *de* («recordar-se de la sentència»): el pronom és *en*: *no se'n recorda*."

  - id: b2-38-020
    type: order
    point: hi-complements
    lesson: 2
    cue: "En Jordi explica que va anar a la vista amb la Carla."
    chunks: ["En Jordi", "hi", "va anar", "amb la Carla"]
    extra: ["en"]
    answers:
      - "En Jordi hi va anar amb la Carla."
    explanation: "«A la vista» és un complement de lloc amb *a*: *hi va anar*."

  - id: b2-38-021
    type: order
    point: hi-complements
    lesson: 2
    cue: "La Núria diu que va anar a Girona amb tren."
    chunks: ["La Núria", "hi", "va anar"]
    extra: ["en", "ho"]
    answers:
      - "La Núria hi va anar."
    explanation: "«Hi» substitueix «a Girona» i també «amb tren»: el lloc i la manera se substitueixen per *hi*."

  - id: b2-38-022
    type: choice
    point: hi-complements
    lesson: 2
    prompt: "—La Carla s'ha acostumat a la nova llei? —Sí, ___ ha acostumat."
    answer: "s'hi"
    distractors:
      - text: "se'n"
        why: "«A la nova llei» porta *a*: acostumar-s'hi."
      - text: "es"
        why: "Sense *hi* la frase queda incompleta: acostumar-se a la llei és acostumar-s'hi."
    explanation: "«Acostumar-se» regeix *a* («acostumar-se a la llei»): *s'hi ha acostumat*."

  - id: b2-38-023
    type: fill
    point: en-complements
    lesson: 2
    prompt: "—La jutgessa s'ha informat de les proves? —Sí, ___ aquest matí."
    hint: "el verb sencer, amb pronoms"
    answers: ["se n'ha informat"]
    wrong_answers:
      - text: "s'hi ha informat"
        why: "«Informar-se» regeix *de*: *se n'ha informat*."
      - text: "s'ha informat"
        why: "Sense *en* la frase queda incompleta: informar-se de les proves és informar-se'n."
    grading: tolerant
    explanation: "«Informar-se» regeix *de* («informar-se de les proves»): *se n'ha informat*."

  - id: b2-38-024
    type: choice
    point: hi-complements
    lesson: 2
    prompt: "—L'acusat s'oposa a la multa? —Sí, ___ oposa."
    answer: "s'hi"
    distractors:
      - text: "se'n"
        why: "«A la multa» porta *a*, no *de*: *s'hi oposa*."
      - text: "es"
        why: "Sense *hi* la frase queda incompleta: oposar-se a la multa és oposar-s'hi."
    explanation: "«Oposar-se» regeix *a* («oposar-se a la multa»): *s'hi oposa*."

  - id: b2-38-025
    type: inline-choice
    point: hi-complements
    lesson: 2
    title: "Dos veïns al jutjat"
    text: "En Pau i la Montse van al jutjat. En Pau {hi|en|ho} va per una multa: diu que no {hi|en|ho} està d'acord. La Montse {hi|en|ho} va per acompanyar-lo: {en|hi|ho} sap poca cosa, del cas."
    explanation: "«Hi» substitueix «al jutjat» («hi va») i «amb la multa» («no hi està d'acord»); «en» substitueix «del cas» («en sap poca cosa»)."

  - id: b2-38-026
    type: choice
    point: en-complements
    lesson: 2
    prompt: "—El veredicte depèn del jurat? —Sí, ___ depèn totalment."
    answer: "en"
    distractors:
      - text: "hi"
        why: "«Del jurat» porta *de*: el pronom és *en*."
      - text: "ho"
        why: "*Ho* substitueix una idea o un atribut; «del jurat» és un complement amb *de*: *en*."
    explanation: "«Dependre» regeix *de* («dependre del jurat»): el pronom és *en*."

  # ---------- Lliçó 3 ----------
  - id: b2-38-027
    type: choice
    point: atribut-predicatiu
    lesson: 3
    prompt: "—La sentència és justa? —Sí, ___ és."
    answer: "ho"
    distractors:
      - text: "hi"
        why: "«Justa» és l'atribut, no un complement amb *a* o *en*: *ho és*."
      - text: "la"
        why: "«Justa» és l'atribut, no un complement directe femení: *ho és*."
    explanation: "«Justa» és l'atribut de «és»: els atributs se substitueixen per *ho*."

  - id: b2-38-028
    type: choice
    point: atribut-predicatiu
    lesson: 3
    prompt: "—L'acusada sembla tranquil·la? —Sí, ___ sembla."
    answer: "ho"
    distractors:
      - text: "hi"
        why: "«Tranquil·la» és l'atribut, no un complement amb *a* o *en*: *ho sembla*."
      - text: "la"
        why: "«Tranquil·la» és l'atribut, no un complement directe: *ho sembla*."
    explanation: "«Tranquil·la» és l'atribut de «sembla»: els atributs se substitueixen per *ho*, en masculí i en femení."

  - id: b2-38-029
    type: choice
