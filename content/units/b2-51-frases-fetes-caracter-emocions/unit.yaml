  # ---------- Lliçó 5 ----------
  - id: b2-51-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un sopar familiar mogut"
    text: |
      Divendres passat, la Núria va anar a sopar a casa dels pares, a Vic, per celebrar els vuitanta anys de l'àvia. Hi havia tothom: els pares, els dos germans amb les parelles i els tres nebots, que no van parar quiets en tota la nit.

      La Núria va arribar cansada de la feina i tenia la mosca al nas. El seu germà petit, en Quim, que és molt bromista, va començar a prendre-li el pèl pel seu nou tallat de cabells. La Núria, que ja estava de mal humor, li va dir que parés. Però en Quim va continuar fins que la mare el va renyar: «Que no veus que la treus de polleguera?», li va dir.

      Durant el sopar, el germà gran, en Pau, va explicar que vol deixar la feina de l'oficina per obrir una granja d'ocells exòtics. Tothom es va posar les mans al cap, menys l'àvia, que va dir que de jove ella també havia fet la viu-viu amb feines estranyes. «I mira'm ara», va afegir rient.

      Després de les postres, en Quim va explicar als nebots on amagava l'àvia els caramels. La Núria es va enfadar molt: «Ets un bocamoll! No saps guardar cap secret!». En Quim es va fer el suec i va continuar jugant amb el mòbil com si no sentís res.

      Al final, la mare va haver d'aixecar la veu perquè tothom ajudés a desparar taula. «Estic fins al capdamunt de cridar!», va dir. L'àvia, amb la seva sang freda habitual, s'ho mirava tot tranquil·la i va somriure amb alegria: «Això és una família», va dir.
    questions:
      - prompt: "Per què va anar la Núria a casa dels pares?"
        answer: "Per celebrar els vuitanta anys de l'àvia."
        distractors:
          - text: "Per ajudar la mare a cuidar els nebots."
            why: "Els nebots hi eren, però el motiu era l'aniversari."
          - text: "Per explicar que vol canviar de feina."
            why: "Qui vol canviar de feina és en Pau, el germà gran."
      - prompt: "Què va fer en Quim que va molestar la Núria al principi?"
        answer: "Es va riure del seu nou tallat de cabells."
        distractors:
          - text: "Va explicar als nebots on eren els caramels."
            why: "Això va passar després de les postres."
          - text: "Va dir que volia obrir una granja."
            why: "Això ho va dir en Pau, el germà gran."
      - prompt: "Com va reaccionar la família davant del pla d'en Pau?"
        answer: "Amb sorpresa, menys l'àvia, que ho va trobar normal."
        distractors:
          - text: "Amb ràbia: tots van dir que era una bestiesa."
            why: "El text no diu que ningú digués res: es van posar les mans al cap, sorpresos."
          - text: "Amb indiferència: ningú no hi va dir res."
            why: "Tothom es va posar les mans al cap, menys l'àvia."
      - prompt: "Què va passar després de les postres?"
        answer: "En Quim va explicar on eren els caramels i la Núria es va enfadar."
        distractors:
          - text: "La mare va dir que estava farta de cridar."
            why: "Això va passar al final, desparant taula."
          - text: "L'àvia va explicar com havia fet la viu-viu de jove."
            why: "L'àvia ho va dir durant el sopar, parlant del pla d'en Pau."
    explanation: "El text explica un sopar d'aniversari amb bromes, un pla sorprenent i una indiscreció d'en Quim."

