id: b2-51
level: B2
title: "Frases fetes (I): caràcter i emocions"
summary: "Nou frases fetes per parlar del caràcter i de l'enuig: com es conjuguen, quins pronoms hi entren i quins calcs del castellà cal evitar."
vocabulary_theme: "Emocions i caràcter"
points:
  - id: enuig
    title: "Expressions d'enuig"
  - id: caracter
    title: "Expressions de caràcter"
  - id: expressions-context
    title: "Les expressions en context: temps i pronoms"
  - id: compte-frases-calcades
    title: "Compte amb el castellà: frases fetes calcades"
    refs:
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: quan ens enfadem"
  - title: "Practicar les expressions"
  - title: "Les expressions en context i els calcs"
  - title: "Produir: reescriure i completar"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'enuig"
    definition: "Malestar de qui s'enfada, sovint lleu i passatger."
    example: "L'enuig li va durar fins a l'hora de dinar."
  - word: "la ràbia"
    definition: "Enuig molt fort, que costa de controlar."
    example: "Quan va veure el cop al cotxe, li va agafar una ràbia immensa."
  - word: "la por"
    definition: "Sensació davant d'un perill, real o imaginat."
    example: "De petita tenia por de la foscor."
  - word: "la vergonya"
    definition: "Malestar quan creiem que hem fet el ridícul."
    example: "Li feia vergonya parlar davant de tanta gent."
  - word: "la pena"
    definition: "Tristesa per una desgràcia, pròpia o d'altri."
    example: "Em fa pena que tanqui la botiga del barri."
  - word: "l'alegria"
    definition: "Emoció agradable quan passa una cosa bona."
    example: "L'alegria se li notava a la cara."
  - word: "la tristesa"
    definition: "Emoció de decaïment per una pèrdua o un disgust."
    example: "La tristesa li va durar uns quants dies."
  - word: "la sorpresa"
    definition: "Emoció breu davant d'una cosa inesperada."
    example: "La notícia de l'herència va ser una gran sorpresa."
  - word: "la indignació"
    definition: "Enuig que provoca una injustícia."
    example: "La pujada del lloguer va causar indignació al barri."
  - word: "la paciència"
    definition: "Capacitat de saber esperar sense enfadar-se."
    example: "Amb els nens cal tenir molta paciència."
  - word: "la calma"
    definition: "Estat de tranquil·litat, sense nervis."
    example: "Respira a fons i mantén la calma."
  - word: "els nervis"
    definition: "Tensió abans d'una cosa important."
    example: "Tinc nervis abans de cada entrevista de feina."
  - word: "la gelosia"
    definition: "Por de perdre l'estima d'algú a favor d'un altre."
    example: "Té gelosia del germà petit."
  - word: "l'enveja"
    definition: "Desig d'allò que tenen els altres."
    example: "Li fa enveja que el veí tingui piscina."
  - word: "l'orgull"
    definition: "Excés d'amor propi, que impedeix cedir."
    example: "Per orgull no vol demanar ajuda."
  - word: "la tossuderia"
    definition: "Qualitat de qui no cedeix mai."
    example: "La seva tossuderia el fa discutir per tot."
  - word: "tossut, tossuda"
    definition: "Que no cedeix ni canvia d'opinió."
    example: "És tan tossut que no escolta ningú."
  - word: "la mandra"
    definition: "Ganes de no fer res."
    example: "Em fa mandra sortir amb aquest fred."
  - word: "discret, discreta"
    definition: "Que sap guardar un secret."
    example: "És molt discret: no explica res de la feina."
  - word: "xerraire"
    definition: "Que parla molt."
    example: "És tan xerraire que no deixa parlar ningú."
  - word: "rondinaire"
    definition: "Que es queixa de tot."
    example: "El meu avi s'ha tornat rondinaire amb l'edat."
  - word: "tranquil, tranquil·la"
    definition: "Sense nervis ni agitació."
    example: "Queda't tranquil: ja ho resoldrem."
  - word: "nerviós, nerviosa"
    definition: "Amb tensió o intranquil·litat."
    example: "Estava nerviosa abans de l'examen."
  - word: "sensible"
    definition: "Que s'emociona o s'ofèn amb facilitat."
    example: "És molt sensible: tot l'afecta."
  - word: "el mal humor"
    definition: "Mal estat d'ànim, que fa respondre malament."
    example: "Quan té mal humor, val més no dir-li res."
  - word: "el bon humor"
    definition: "Bon estat d'ànim, amb ganes de riure."
    example: "Sempre es lleva de bon humor."
  - word: "la sang freda"
    definition: "Calma per actuar en moments difícils."
    example: "Va mantenir la sang freda i va trucar al metge."
  - word: "el disgust"
    definition: "Tristesa o enuig per una cosa desagradable."
    example: "El suspens li va donar un gran disgust."
  - word: "l'empatia"
    definition: "Capacitat de posar-se al lloc d'un altre."
    example: "Amb una mica d'empatia ens entendríem."
  - word: "la frustració"
    definition: "Malestar quan una cosa no surt com esperàvem."
    example: "La frustració el va fer cridar."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-51-001
    type: choice
    point: enuig
    lesson: 1
    prompt: "Què vol dir «El teu germà em treu de polleguera»?"
    answer: "El teu germà em fa perdre la calma."
    distractors:
      - text: "El teu germà em fa riure amb les seves bromes."
        why: "*Treure de polleguera* no fa riure: fa enfadar. Vol dir que et fa perdre la calma."
      - text: "El teu germà em deixa sense arguments."
        why: "No és quedar-se sense paraules: és perdre la calma per culpa d'algú."
    explanation: "«Treure de polleguera algú» vol dir fer-li perdre la calma i la paciència."

  - id: b2-51-002
    type: choice
    point: enuig
    lesson: 1
    prompt: "Quan la Núria va veure la factura del mòbil, ___: deia que era un abús."
    answer: "treia foc pels queixals"
    distractors:
      - text: "feia la viu-viu com podia"
        why: "*Fer la viu-viu* és anar tirant amb dificultats. Aquí la Núria està plena de ràbia."
      - text: "es feia el suec tota l'estona"
        why: "*Fer-se el suec* és fer veure que no se sent res. Aquí protesta, no calla."
    explanation: "«Treure foc pels queixals» vol dir estar molt enfadat. «Era un abús» mostra la ràbia de la Núria."

  - id: b2-51-003
    type: choice
    point: enuig
    lesson: 1
    prompt: "Què vol dir «Avui la Marta, rondinaire com sempre, té la mosca al nas»?"
    answer: "Avui la Marta està de mal humor."
    distractors:
      - text: "Avui la Marta sospita de tothom."
        why: "*Tenir la mosca al nas* no és sospitar: és estar de mal humor."
      - text: "Avui la Marta està molt contenta."
        why: "És just el contrari: *tenir la mosca al nas* és estar de mal humor."
    explanation: "«Tenir la mosca al nas» vol dir estar de mal humor: un enuig lleu que dura tot el dia."

  - id: b2-51-004
    type: choice
    point: enuig
    lesson: 1
    prompt: "—Encara fas hores extres cada dia? —Sí, i ja no puc més: ___."
    answer: "estic fins al capdamunt"
    distractors:
      - text: "estic de molt bon humor"
        why: "És just el contrari: «ja no puc més» és una queixa."
      - text: "em faig el suec"
        why: "*Fer-se el suec* és fer veure que no se sent res. Aquí es queixa ben clar."
    explanation: "«Ja no puc més» demana l'expressió d'estar-ne fart: *estic fins al capdamunt*."

  - id: b2-51-005
    type: match
    point: enuig
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["treure de polleguera", "El soroll del bar fa perdre la calma a la Laia."]
      - ["treure foc pels queixals", "En Pau crida, furiós amb la companyia del mòbil."]
      - ["tenir la mosca al nas", "La Núria respon malament a tothom des que s'ha llevat."]
      - ["estar fins al capdamunt", "L'Ibrahim no pot més amb les guàrdies de cap de setmana."]
    explanation: "Són les quatre expressions d'enuig de la unitat: fixar-se en la situació ajuda a triar-les."

  - id: b2-51-006
    type: match
    point: caracter
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["fer-se el suec", "Li demanen que ajudi i fa veure que no ho sent."]
      - ["ser un bocamoll", "Explica a tothom el secret que li van confiar."]
      - ["estar com un llum", "Vol travessar l'Atlàntic tot sol en un caiac."]
      - ["fer la viu-viu", "Va tirant amb una beca que tot just cobreix el lloguer."]
    explanation: "Són les quatre expressions de caràcter: cadascuna descriu una manera de ser o d'estar al món."

  - id: b2-51-007
    type: choice
    point: caracter
    lesson: 1
    prompt: "Li diuen que pari taula i ___: continua mirant el mòbil com si no sentís res."
    answer: "es fa el suec"
    distractors:
      - text: "fa la viu-viu"
        why: "*Fer la viu-viu* és anar tirant amb dificultats. Aquí fingeix no sentir res."
      - text: "és un bocamoll"
        why: "*Ser un bocamoll* és no guardar secrets. Aquí calla, no xerra."
    explanation: "«Com si no sentís res» és la definició de *fer-se el suec*: fer veure que no se sent res."

  - id: b2-51-008
    type: choice
    point: caracter
    lesson: 1
    prompt: "No expliquis a l'Arnau on amagues les claus: ___."
    answer: "és un bocamoll"
    distractors:
      - text: "fa la viu-viu"
        why: "*Fer la viu-viu* és anar tirant. El perill aquí és que ho expliqui a tothom."
      - text: "té la mosca al nas"
        why: "El mal humor no hi fa res: el perill és que no sap guardar un secret."
    explanation: "Si no vols que ho expliqui, és perquè *és un bocamoll*: diu a tothom allò que li confien."

  - id: b2-51-009
    type: choice
    point: caracter
    lesson: 1
    prompt: "Què vol dir «En Quim està com un llum»?"
    answer: "En Quim actua sense seny, com si li faltés un bull."
    distractors:
      - text: "En Quim està molt enfadat amb tothom."
        why: "L'enuig fort és «treure foc pels queixals». Aquí fa o diu bestieses."
      - text: "En Quim està molt cansat i necessita dormir."
        why: "El cansament no hi té res a veure: fa bestieses sense adonar-se'n."
    explanation: "«Estar com un llum» vol dir actuar sense seny. En Quim fa o diu coses que ningú no entén."

  - id: b2-51-010
    type: choice
    point: caracter
    lesson: 1
    prompt: "Amb el sou de becària, la Carla ___: tot just li arriba per al lloguer i el menjar."
    answer: "fa la viu-viu"
    distractors:
      - text: "es fa el suec"
        why: "*Fer-se el suec* és fingir que no se sent res. Aquí sobreviu amb pocs diners."
      - text: "està fins al capdamunt"
        why: "No diu que n'estigui farta: diu que tot just li arriba."
    explanation: "«Tot just li arriba» és anar tirant: la Carla *fa la viu-viu* amb el sou de becària."

  - id: b2-51-011
    type: inline-choice
    point: enuig
    lesson: 1
    title: "Un dilluns complicat"
    text: "Aquest matí el despertador no ha sonat i la Fàtima ha arribat tard a tot arreu. A la feina, el soroll de les obres {l'ha tret de polleguera|li ha pres el pèl}, i quan el cap li ha dit que faria hores extres, {treia foc pels queixals|feia la viu-viu}. A la tarda ha discutit amb un company i des de llavors {té la mosca al nas|està de molt bon humor}. Entre el trànsit i les hores extres, diu que {està fins al capdamunt|està de molt bon humor} de tot plegat."
    explanation: "El soroll *treu de polleguera* la Fàtima; les hores extres la fan *treure foc pels queixals*; després de la discussió *té la mosca al nas*; i de tot plegat *està fins al capdamunt*."

  - id: b2-51-012
    type: fill
    point: enuig
    lesson: 1
    prompt: "—Com portes el soroll dels veïns? —Em ___ cada nit: no em deixa dormir."
    hint: "treure de polleguera, present"
    answers: ["treu de polleguera"]
    wrong_answers:
      - text: "treu de la polleguera"
        why: "L'expressió no porta article: *treure de polleguera*."
    grading: tolerant
    explanation: "El subjecte és «el soroll» i el complement és «em»: *em treu de polleguera*, em fa perdre la calma."

  - id: b2-51-013
    type: order
    point: caracter
    lesson: 1
    cue: "Digues que en Pau fingeix no sentir res quan li demanen ajuda."
    chunks: ["En Pau", "es fa", "el suec", "quan", "li demanen", "ajuda"]
    extra: ["fa"]
    answers:
      - "En Pau es fa el suec quan li demanen ajuda."
      - "Quan li demanen ajuda, en Pau es fa el suec."
      - "En Pau, quan li demanen ajuda, es fa el suec."
    explanation: "*Fer-se el suec* porta sempre el pronom: *es fa*. L'oració amb *quan* pot anar al davant o al darrere."

  # ---------- Lliçó 2 ----------
  - id: b2-51-014
    type: fill
    point: enuig
    lesson: 2
    prompt: "Quan va llegir la carta d'acomiadament, en Pau ___."
    hint: "treure foc pels queixals, passat perifràstic"
    answers: ["va treure foc pels queixals"]
    wrong_answers:
      - text: "va treure foc per els queixals"
        why: "La contracció és obligatòria: *per* + *els* = *pels*."
    grading: tolerant
    explanation: "L'acomiadament el va omplir de ràbia: *va treure foc pels queixals*. *Per* + *els* es contreu en *pels*."

  - id: b2-51-015
    type: fill
    point: enuig
    lesson: 2
    prompt: "La Carla és molt sensible: no li facis bromes avui, que ___."
    hint: "tenir la mosca al nas, present"
    answers: ["té la mosca al nas"]
    grading: tolerant
    explanation: "«No li facis bromes» avisa que està susceptible: *té la mosca al nas*, està de mal humor."

  - id: b2-51-016
    type: fill
    point: enuig
    lesson: 2
    prompt: "Porto tres mesos amb guàrdies cada cap de setmana: ___."
    hint: "estar fins al capdamunt, present, jo"
    answers: ["estic fins al capdamunt", "n'estic fins al capdamunt"]
    grading: tolerant
    explanation: "Tres mesos de guàrdies porten la frustració: *estic fins al capdamunt*, no puc més."

  - id: b2-51-017
    type: choice
    point: enuig
    lesson: 2
    prompt: "—Per què crida la Montse? —Perquè el seu fill ___."
    answer: "l'ha tret de polleguera"
    distractors:
      - text: "s'ha fet el suec"
        why: "Si es fes el suec, callaria. Aquí la Montse crida: algú l'ha fet enfadar."
      - text: "ha fet la viu-viu"
        why: "*Fer la viu-viu* és anar tirant. Aquí cal una causa per als crits."
    explanation: "Els crits demanen una causa: el fill *l'ha tret de polleguera*, li ha fet perdre la calma."

  - id: b2-51-018
    type: fill
    point: caracter
    lesson: 2
    prompt: "Cada vegada que toca netejar el pis, l'Ibrahim ___."
    hint: "fer-se el suec, present"
    answers: ["es fa el suec"]
    wrong_answers:
      - text: "fa el suec"
        why: "Falta el pronom: l'expressió és *fer-se el suec*."
    grading: tolerant
    explanation: "L'Ibrahim fingeix no sentir res per no netejar: *es fa el suec*. El pronom és obligatori."

  - id: b2-51-019
    type: fill
    point: caracter
    lesson: 2
    prompt: "No expliquis el pla a en Quim: és ___."
    hint: "expressió: persona que no sap guardar un secret"
    answers: ["un bocamoll", "bocamoll"]
    grading: tolerant
    explanation: "En Quim ho diria a tothom: *és un bocamoll*. Per això no li pots confiar el pla."

  - id: b2-51-020
    type: choice
    point: caracter
    lesson: 2
    prompt: "L'Anna vol deixar la feina per fer la volta al món en bicicleta sense diners, i per orgull no escolta ningú. El seu germà diu que ___."
    answer: "està com un llum"
    distractors:
      - text: "té la mosca al nas"
        why: "No està de mal humor: té una idea esbojarrada."
      - text: "es fa el suec"
        why: "No fingeix res: anuncia el pla ben clar."
    explanation: "Una volta al món sense diners és una idea sense seny: el germà pensa que *està com un llum*."

  - id: b2-51-021
    type: choice
    point: caracter
    lesson: 2
    prompt: "El Wei treballa de nits, estudia de dia i tot just dorm quatre hores: ___."
    answer: "fa la viu-viu"
    distractors:
      - text: "es fa el suec"
        why: "No fingeix res: treballa i estudia sense parar."
      - text: "té la mosca al nas"
        why: "No diu que estigui de mal humor: diu que va tirant com pot."
    explanation: "Treballar, estudiar i dormir quatre hores és anar tirant: el Wei *fa la viu-viu*."

  - id: b2-51-022
    type: order
    point: enuig
    lesson: 2
    cue: "Digues que els comentaris del veí fan perdre la calma a la Carla."
    chunks: ["Els comentaris", "del veí", "treuen", "la Carla", "de polleguera"]
    extra: ["de la polleguera"]
    answers:
      - "Els comentaris del veí treuen la Carla de polleguera."
      - "Els comentaris del veí treuen de polleguera la Carla."
    explanation: "El subjecte («els comentaris») va en plural: *treuen*. L'expressió no porta article: *de polleguera*."

  - id: b2-51-023
    type: order
    point: caracter
    lesson: 2
    cue: "Avisa que en Quim explica a tothom allò que li confien."
    chunks: ["En Quim", "és", "un bocamoll", "i", "ho explica tot"]
    extra: ["li"]
    answers:
      - "En Quim és un bocamoll i ho explica tot."
    explanation: "*Ser un bocamoll* vol dir no guardar cap secret: per això ho explica tot."

  - id: b2-51-024
    type: inline-choice
    point: caracter
    lesson: 2
    title: "Dos companys de pis"
    text: "L'Ibrahim i en Quim comparteixen pis i són molt diferents. Quan toca fregar els plats, l'Ibrahim {es fa|fa} el suec i desapareix. En canvi, en Quim no calla mai: {és un bocamoll|té la mosca al nas} i explica als veïns tot allò que passa al pis. Amb la pujada del lloguer, tots dos {fan la viu-viu|treuen foc pels queixals} per arribar a final de mes."
    explanation: "L'Ibrahim *es fa el suec* per no fregar; en Quim *és un bocamoll* i ho explica tot; amb el lloguer alt, tots dos *fan la viu-viu*."

  - id: b2-51-025
    type: choice
    point: expressions-context
    lesson: 2
    prompt: "Què vol dir «Quan va veure la nota, el pare es va posar les mans al cap»?"
    answer: "El pare va mostrar una gran sorpresa."
    distractors:
      - text: "El pare es va adormir sobre els llibres."
        why: "No té son: està esverat per la nota."
      - text: "El pare va renyar el seu fill cridant."
        why: "Potser el renyarà després, però l'expressió només mostra la sorpresa."
    explanation: "«Posar-se les mans al cap» vol dir mostrar gran sorpresa o indignació. La nota va esverar el pare."

  - id: b2-51-026
    type: transform
    point: expressions-context
    lesson: 2
    instruction: "Reescriu la frase amb l'expressió «posar-se les mans al cap»."
    source: "Quan va veure el desordre, la mare [[es va esverar molt]]."
    answers:
      - "Quan va veure el desordre, la mare es va posar les mans al cap."
      - "Quan va veure el desordre, la mare va posar-se les mans al cap."
    wrong_answers:
      - text: "Quan va veure el desordre, la mare es va posar les seves mans al cap."
        why: "L'expressió té l'article fix: *les mans*, sense possessiu."
    grading: tolerant
    explanation: "«Esverar-se molt» equival a *posar-se les mans al cap*. Les parts fixes no admeten possessius: *les mans*."

  # ---------- Lliçó 3 ----------
  - id: b2-51-027
    type: choice
    point: expressions-context
    lesson: 3
    prompt: "Ahir, en Pau ___ durant la discussió."
    answer: "es va fer el suec"
    distractors:
      - text: "es fa el suec"
        why: "«Ahir» demana passat: *es va fer*."
      - text: "va fer el suec"
        why: "Falta el pronom: l'expressió és *fer-se* el suec."
    explanation: "«Ahir» demana el passat perifràstic i *fer-se el suec* demana el pronom: *es va fer el suec*."

  - id: b2-51-028
    type: fill
    point: expressions-context
    lesson: 3
    prompt: "Durant la reunió d'ahir, la Laia, molt nerviosa, ___ quan va sentir el nou horari."
    hint: "posar-se les mans al cap, passat perifràstic"
    answers: ["es va posar les mans al cap", "va posar-se les mans al cap"]
    grading: tolerant
    explanation: "«Ahir» i «va sentir» demanen passat: *es va posar les mans al cap*."

  - id: b2-51-029
    type: transform
    point: expressions-context
    lesson: 3
    instruction: "Passa la frase al passat perifràstic."
    source: "En Pau [[es fa]] el suec quan li [[demanen]] diners."
    answers:
      - "En Pau es va fer el suec quan li van demanar diners."
      - "Quan li van demanar diners, en Pau es va fer el suec."
      - "En Pau va fer-se el suec quan li van demanar diners."
      - "Quan li van demanar diners, en Pau va fer-se el suec."
    wrong_answers:
      - text: "En Pau va fer el suec quan li van demanar diners."
        why: "Falta el pronom: *es va fer el suec*."
    grading: tolerant
    explanation: "En passat, els dos verbs canvien: *es va fer* i *li van demanar*. El pronom de *fer-se* no cau mai."

  - id: b2-51-030
    type: transform
    point: expressions-context
    lesson: 3
    instruction: "Passa la frase al futur."
