  - id: b1-31-066
    type: reading
    point: comprensio
    lesson: 5
    title: "El club de lectura"
    text: |
      La biblioteca del barri de Gràcia té un club de lectura que es troba cada dijous a la tarda. La bibliotecària, la Marta, tria cada mes una novel·la i penja la tria al tauler de l'entrada. El préstec dura tres setmanes i ningú no paga res: només cal el carnet.

      Aquest mes toca un gènere nou: la novel·la negra. La protagonista és una inspectora que torna al seu poble per resoldre un robatori antic. És un personatge tossut i valent. En Pau, que és un rat de biblioteca, ja l'ha acabat: diu que l'ha devorada en quatre dies. La Fàtima, en canvi, encara va pel pròleg: llegeix a poc a poc i rellegeix els paràgrafs difícils. Sempre perd el punt de llibre.

      Dijous passat van parlar del final. A en Pau li va agradar; la Fàtima va dir que calia llegir entre línies per entendre què pensa de debò l'autora. La Marta va somriure: «Això és el millor del club», va dir. «El mateix llibre, tres lectures diferents.» El mes que ve llegiran una biografia i escriuran una ressenya per a la revista del barri.
    questions:
      - prompt: "Què fa la Marta cada mes?"
        answer: "Tria la novel·la del club i anuncia la tria."
        distractors:
          - text: "Escriu una novel·la negra nova."
            why: "La Marta tria la novel·la; no diu que n'escrigui cap."
          - text: "Devora la novel·la en quatre dies."
            why: "Qui l'ha devorada és en Pau, no la Marta."
      - prompt: "Com llegeix la Fàtima?"
        answer: "A poc a poc i rellegint els trossos difícils."
        distractors:
          - text: "De pressa, sense parar fins al final."
            why: "Així llegeix en Pau, no la Fàtima."
          - text: "Només el pròleg de cada llibre."
            why: "Va pel pròleg perquè llegeix a poc a poc, no perquè només llegeixi pròlegs."
      - prompt: "Què vol dir la Marta amb «tres lectures diferents»?"
        answer: "Que cada lector entén el llibre a la seva manera."
        distractors:
          - text: "Que han llegit tres llibres diferents."
            why: "Han llegit el mateix llibre: la novel·la negra."
          - text: "Que el llibre té tres finals."
            why: "El text parla d'un sol final."
      - prompt: "Què cal per endur-se llibres?"
        answer: "Tenir el carnet de la biblioteca."
        distractors:
          - text: "Pagar una quota per cada préstec."
            why: "El préstec és gratuït: *ningú no paga res*."
          - text: "Anar a la biblioteca cada dijous."
            why: "El club és cada dijous, però això no és una condició del préstec."
    explanation: "El text presenta el club de lectura d'una biblioteca: com funciona i què en pensen tres lectors."

