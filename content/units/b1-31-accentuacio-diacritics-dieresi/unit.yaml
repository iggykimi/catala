id: b1-31
level: B1
title: "L'accent, els diacrítics i la dièresi"
summary: "Aprens on cau l'accent (*títol*, *examen*, *pàgina*), l'accent obert i el tancat (*cafè*, *edició*), els 15 diacrítics (*què*, *és*, *més*) i la dièresi (*veïna*, *països*, *qüestió*)."
vocabulary_theme: "Llibres, lectura i biblioteca"
points:
  - id: accentuacio
    title: "Les agudes, les planes i les esdrúixoles"
  - id: obert-tancat
    title: "L'accent obert (*è*, *ò*) i el tancat (*é*, *ó*)"
  - id: diacritics
    title: "Els 15 diacrítics"
  - id: dieresi
    title: "La dièresi"
  - id: compte-castella
    title: "Compte amb el castellà: l'accent cau en un altre lloc"
  - id: expressions
    title: "Expressions de lectura"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: on cau l'accent"
  - title: "Practiquem l'accent"
  - title: "Diacrítics, dièresi i interferències"
  - title: "Escrivim sense faltes"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la biblioteca"
    definition: "Edifici amb llibres que pots llegir allà o a casa."
    example: "Vaig a la biblioteca cada dimarts a tornar llibres."
  - word: "la llibreria"
    definition: "Botiga on es venen llibres."
    example: "He comprat la novel·la a la llibreria del barri."
  - word: "el llibre"
    definition: "Conjunt de pàgines amb text, unides per un costat."
    example: "Aquest llibre té tres-centes pàgines."
  - word: "la novel·la"
    definition: "Llibre llarg que explica una història inventada."
    example: "Llegeixo una novel·la negra molt bona."
  - word: "el conte"
    definition: "Història curta, sovint per a infants."
    example: "Cada nit explica un conte a la seva filla."
  - word: "el poema"
    definition: "Text curt escrit en versos."
    example: "El mestre ens ha fet memoritzar un poema."
  - word: "la poesia"
    definition: "Art d'escriure poemes."
    example: "La poesia catalana m'agrada molt."
  - word: "la biografia"
    definition: "Llibre que explica la vida d'una persona."
    example: "Estic llegint la biografia d'una científica."
  - word: "l'assaig"
    definition: "Text que explica les idees de l'autor sobre un tema."
    example: "Ha publicat un assaig sobre el canvi climàtic."
  - word: "el diccionari"
    definition: "Llibre que explica el significat de les paraules."
    example: "Busca aquesta paraula al diccionari."
  - word: "el catàleg"
    definition: "Llista ordenada dels llibres d'una biblioteca."
    example: "Consulta el catàleg abans de pujar."
  - word: "el pròleg"
    definition: "Text del començament d'un llibre que el presenta."
    example: "El pròleg l'ha escrit una escriptora famosa."
  - word: "l'epíleg"
    definition: "Text del final d'un llibre que tanca la història."
    example: "L'epíleg explica què passa deu anys després."
  - word: "el capítol"
    definition: "Cadascuna de les parts d'un llibre."
    example: "Cada capítol comença amb una frase curta."
  - word: "la pàgina"
    definition: "Cadascun dels fulls numerats d'un llibre."
    example: "Vaig perdre el fil a la pàgina vint."
  - word: "el títol"
    definition: "Nom d'un llibre o d'un text."
    example: "El títol no m'agrada, però la història sí."
  - word: "l'índex"
    definition: "Llista de capítols o temes d'un llibre."
    example: "Mira l'índex per trobar el tema."
  - word: "el gènere"
    definition: "Tipus de llibre segons el tema o la forma."
    example: "El meu gènere preferit és la ciència-ficció."
  - word: "la trama"
    definition: "Història que explica una novel·la."
    example: "La trama és complicada, però enganxa."
  - word: "el personatge"
    definition: "Persona d'una història inventada."
    example: "El personatge principal és una bibliotecària."
  - word: "el protagonista, la protagonista"
    definition: "Personatge més important d'una història."
    example: "La protagonista viu a Girona."
  - word: "el final"
    definition: "Com acaba una història."
    example: "El final m'ha sorprès molt."
  - word: "el lector, la lectora"
    definition: "Persona que llegeix."
    example: "Els lectors joves omplen la sala."
  - word: "l'autor, l'autora"
    definition: "Persona que escriu un llibre."
    example: "L'autora signarà llibres dissabte."
  - word: "l'editorial"
    definition: "Empresa que publica llibres."
    example: "Aquesta editorial fa llibres infantils."
  - word: "el préstec"
    definition: "Servei que et deixa emportar llibres a casa durant un temps."
    example: "El préstec dura tres setmanes."
  - word: "el carnet"
    definition: "Targeta que identifica un soci de la biblioteca."
    example: "Necessites el carnet per endur-te llibres."
  - word: "el prestatge"
    definition: "Post horitzontal d'un moble on es posen els llibres."
    example: "Els còmics són al prestatge de baix."
  - word: "el punt de llibre"
    definition: "Paper o cartó per marcar on ets d'un llibre."
    example: "Va perdre el punt de llibre entre les pàgines."
  - word: "la coberta"
    definition: "Part de fora que protegeix el llibre."
    example: "La coberta és blava amb lletres blanques."
  - word: "el còmic"
    definition: "Història explicada amb dibuixos i text curt."
    example: "Aquest còmic té dibuixos molt bons."
  - word: "fullejar"
    definition: "Mirar un llibre per sobre, passant pàgines."
    example: "Va fullejar la revista mentre esperava."
  - word: "rellegir"
    definition: "Llegir una altra vegada."
    example: "Rellegiré aquest capítol demà."
  - word: "la ressenya"
    definition: "Text curt que opina sobre un llibre."
    example: "Vaig escriure una ressenya per al blog."
  - word: "el club de lectura"
    definition: "Grup que llegeix el mateix llibre i en parla."
    example: "Al club de lectura som dotze persones."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-31-001
    type: choice
    point: accentuacio
    lesson: 1
    prompt: "En Pau llegeix una novel·la en ___."
    answer: "francès"
    distractors:
      - text: "frances"
        why: "*Francès* és aguda acabada en vocal + *s*: porta accent."
      - text: "frànces"
        why: "L'accent cau a l'última síl·laba («cès»), no a la primera."
    explanation: "*Francès* és aguda acabada en vocal + *s*: porta accent."

  - id: b1-31-002
    type: choice
    point: accentuacio
    lesson: 1
    prompt: "La bibliotecària busca el llibre al ___."
    answer: "catàleg"
    distractors:
      - text: "cataleg"
        why: "*Catàleg* és esdrúixola: les esdrúixoles porten accent sempre."
      - text: "catalèg"
        why: "L'accent cau a «ta», no a «lèg»: *catàleg*."
    explanation: "*Catàleg* és esdrúixola: les esdrúixoles porten accent sempre."

  - id: b1-31-003
    type: choice
    point: accentuacio
    lesson: 1
    prompt: "Cada ___ comença amb una cita."
    answer: "capítol"
    distractors:
      - text: "capitol"
        why: "*Capítol* és plana acabada en consonant: porta accent."
      - text: "capitòl"
        why: "L'accent cau a «pi», no a «tol»: *capítol*."
    explanation: "*Capítol* és plana acabada en consonant: porta accent."

  - id: b1-31-004
    type: choice
    point: accentuacio
    lesson: 1
    prompt: "Demà tenim l'___ de català."
    answer: "examen"
    distractors:
      - text: "exàmen"
        why: "*Examen* és plana acabada en *-en*: no porta accent."
      - text: "éxamen"
        why: "L'accent cau a «xa», però les planes acabades en *-en* no en porten."
    explanation: "*Examen* és plana acabada en *-en*: no porta accent."

  - id: b1-31-005
    type: choice
    point: obert-tancat
    lesson: 1
    prompt: "L'Ibrahim es pren un ___ a la cafeteria."
    answer: "cafè"
    distractors:
      - text: "café"
        why: "*Café* amb accent tancat és la forma castellana «café». En català la *e* és oberta."
      - text: "cafe"
        why: "*Cafè* és aguda acabada en vocal: necessita accent."
    explanation: "*Cafè* és aguda acabada en vocal i la *e* és oberta."

  - id: b1-31-006
    type: choice
    point: obert-tancat
    lesson: 1
    prompt: "Aquesta és la tercera ___ del diccionari."
    answer: "edició"
    distractors:
      - text: "ediciò"
        why: "Els noms acabats en *-ió* porten l'accent tancat: *edició*."
      - text: "edicio"
        why: "*Edició* és aguda acabada en vocal: necessita accent."
    explanation: "Els noms acabats en *-ió* són aguts i porten l'accent tancat: *edició*."

  - id: b1-31-007
    type: choice
    point: obert-tancat
    lesson: 1
    prompt: "En Jordi ___ el català amb novel·les curtes."
    answer: "aprèn"
    distractors:
      - text: "aprén"
        why: "La tercera persona de *aprendre* porta la *e* oberta: *aprèn*."
      - text: "apren"
        why: "*Aprèn* és aguda acabada en *-en*: porta accent."
    explanation: "La tercera persona de *aprendre* porta accent obert a la *e*: *aprèn*."

  - id: b1-31-008
    type: choice
    point: accentuacio
    lesson: 1
    prompt: "La Núria sempre ___ la veritat."
    answer: "diu"
    distractors:
      - text: "díu"
        why: "*Diu* és un monosíl·lab: no porta accent."
      - text: "dius"
        why: "*Dius* és la segona persona. Amb «la Núria» cal la tercera: *diu*."
    explanation: "*Diu* és un monosíl·lab: els monosíl·labs no porten accent."

  - id: b1-31-009
    type: inline-choice
    point: accentuacio
    lesson: 1
    title: "La sala nova"
    text: "A la {pàgina|pagina} dotze hi ha un {índex|index} de noms. El {títol|titol} del llibre és curt i {fàcil|facil} de recordar."
    explanation: "*Pàgina* és esdrúixola; *índex*, *títol* i *fàcil* són planes acabades en consonant: totes porten accent."

  - id: b1-31-010
    type: inline-choice
    point: obert-tancat
    lesson: 1
    title: "Un cafè amb la Montse"
    text: "La Montse em truca per {telèfon|teléfon} i quedem per fer un {cafè|café}. Després llegim la {història|história} d'un viatge per {Amèrica|América}."
    explanation: "*Telèfon*, *cafè*, *història* i *Amèrica* porten l'accent obert: *è*, *ò*."

  - id: b1-31-011
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["llegir entre línies", "En un correu amable, entendre que estan enfadats."]
      - ["ser un rat de biblioteca", "Passar cada tarda entre els prestatges de la biblioteca."]
      - ["devorar un llibre", "Acabar un llibre gruixut en només dos dies."]
      - ["llegir d'una tirada", "Llegir tres-centes pàgines seguides, sense pauses."]
      - ["tenir un llibre de capçalera", "Tenir un llibre preferit que es rellegeix sovint."]
    explanation: "Totes parlen de llegir: fixa't sobretot en *llegir entre línies*, que és entendre allò que no es diu."

  - id: b1-31-012
    type: fill
    point: obert-tancat
    lesson: 1
    prompt: "A la biblioteca hi ha novel·les en ___."
    hint: "ANGLES, amb accent"
    answers: ["anglès"]
    wrong_answers:
      - text: "angles"
        why: "*Anglès* és aguda acabada en vocal + *s*: necessita accent."
      - text: "anglés"
        why: "La *e* és oberta: *anglès*."
    grading: strict
    explanation: "*Anglès* és aguda acabada en vocal + *s* i la *e* és oberta."

  - id: b1-31-013
    type: fill
    point: accentuacio
    lesson: 1
    prompt: "Obriu el llibre per la ___ vint."
    hint: "PAGINA, amb accent"
    answers: ["pàgina"]
    wrong_answers:
      - text: "pagina"
        why: "*Pàgina* és esdrúixola: les esdrúixoles porten accent sempre."
    grading: strict
    explanation: "*Pàgina* és esdrúixola: l'accent cau a «pà» i sempre s'escriu."
  # ---------------- Lliçó 2 ----------------
  - id: b1-31-014
    type: fill
    point: accentuacio
    lesson: 2
    prompt: "El llibre té un ___ de noms al final."
    hint: "INDEX, amb accent"
    answers: ["índex"]
    wrong_answers:
      - text: "index"
        why: "*Índex* és plana acabada en consonant: porta accent a la *i*."
    grading: strict
    explanation: "*Índex* és plana acabada en consonant: porta accent a la *i*."

  - id: b1-31-015
    type: fill
    point: accentuacio
    lesson: 2
    prompt: "Aquest conte és molt ___ per als petits."
    hint: "FACIL, amb accent"
    answers: ["fàcil"]
    wrong_answers:
      - text: "facil"
        why: "*Fàcil* és plana acabada en consonant: porta accent."
    grading: strict
    explanation: "*Fàcil* és plana acabada en consonant: l'accent cau a «fà»."

  - id: b1-31-016
    type: fill
    point: obert-tancat
    lesson: 2
    prompt: "Demà ___ el tercer capítol."
    hint: "LLEGIR, futur, jo"
    answers: ["llegiré"]
    wrong_answers:
      - text: "llegire"
        why: "El futur de *llegir* porta accent a la *e*: *llegiré*."
      - text: "llegirè"
        why: "La *e* del futur és tancada: *llegiré*."
    grading: strict
    explanation: "El futur de *llegir* (*jo*) és *llegiré*, amb la *e* tancada."

  - id: b1-31-017
    type: fill
    point: obert-tancat
    lesson: 2
    prompt: "Primer fulleja el llibre; ___, el compra."
    hint: "DESPRES, amb accent"
    answers: ["després"]
    wrong_answers:
      - text: "despres"
        why: "*Després* és aguda acabada en vocal + *s*: necessita accent."
      - text: "desprès"
        why: "*Després* porta la *e* tancada."
    grading: strict
    explanation: "*Després* és aguda acabada en vocal + *s* i la *e* és tancada."

  - id: b1-31-018
    type: fill
    point: accentuacio
    lesson: 2
    prompt: "Resol els mots encreuats ___."
    hint: "FACIL, adverbi"
    answers: ["fàcilment"]
    wrong_answers:
      - text: "facilment"
        why: "L'adverbi conserva l'accent de *fàcil*: *fàcilment*."
    grading: strict
    explanation: "Els adverbis en *-ment* conserven l'accent de l'adjectiu: *fàcil* → *fàcilment*."

  - id: b1-31-019
    type: order
    point: accentuacio
    lesson: 2
    cue: "Digues que el títol és curt i fàcil."
    chunks: ["el", "títol", "és", "curt", "i", "fàcil"]
    extra: ["titol", "facil"]
    answers:
      - "El títol és curt i fàcil."
    explanation: "*Títol* i *fàcil* són planes acabades en consonant: porten accent escrit."

  - id: b1-31-020
    type: order
    point: obert-tancat
    lesson: 2
    cue: "Digues que després prendràs un cafè."
    chunks: ["després", "prendré", "un", "cafè"]
    extra: ["despres", "cafe"]
    answers:
      - "Després prendré un cafè."
      - "Prendré un cafè després."
    explanation: "*Després* i *prendré* porten la *e* tancada; *cafè* la porta oberta."

  - id: b1-31-021
    type: choice
    point: accentuacio
    lesson: 2
    prompt: "És un ___ de la literatura catalana."
    answer: "clàssic"
    distractors:
      - text: "classic"
        why: "*Clàssic* és plana acabada en consonant: porta accent."
      - text: "classíc"
        why: "L'accent cau a «clà», no a «sic»: *clàssic*."
    explanation: "*Clàssic* és plana acabada en consonant: l'accent cau a «clà» i s'escriu."

  - id: b1-31-022
    type: choice
    point: obert-tancat
    lesson: 2
    prompt: "M'agrada aquesta ___ d'aventures."
    answer: "història"
    distractors:
      - text: "história"
        why: "La *o* és oberta: *història*."
      - text: "historia"
        why: "*Història* és esdrúixola: necessita accent."
    explanation: "*Història* és esdrúixola i la *o* és oberta."

  - id: b1-31-023
    type: choice
    point: accentuacio
    lesson: 2
    prompt: "Han obert una ___ nova al barri."
    answer: "biblioteca"
    distractors:
      - text: "bibliotéca"
        why: "*Biblioteca* és plana acabada en vocal: no porta cap accent."
      - text: "bibliotecà"
        why: "L'accent no cau a l'última síl·laba: *biblioteca* és plana i no porta accent."
    explanation: "*Biblioteca* és plana acabada en vocal: no porta accent."

  - id: b1-31-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «llegir entre línies»?"
    answer: "Entendre allò que no es diu obertament."
    distractors:
      - text: "Llegir molt de pressa, sense fixar-s'hi."
        why: "Això és *llegir per sobre*, no *llegir entre línies*."
      - text: "Llegir només els títols i les fotos."
        why: "Això s'acosta a *fullejar*. *Llegir entre línies* és entendre allò que no es diu."
    explanation: "*Llegir entre línies* és entendre el missatge amagat d'un text."

  - id: b1-31-025
    type: inline-choice
    point: accentuacio
    lesson: 2
    title: "Al club de lectura"
    text: "Al club de lectura llegim un {clàssic|classic} de la literatura {francesa|francèsa}. Ens trobem cada {dijous|dijòus} a la {biblioteca|bibliotéca}."
    explanation: "*Clàssic* és plana acabada en consonant. *Francesa*, *dijous* i *biblioteca* no porten accent."

  - id: b1-31-026
    type: match
    point: accentuacio
    lesson: 2
    instruction: "Relaciona cada paraula amb la regla."
    pairs:
      - ["edició", "aguda acabada en vocal"]
      - ["títol", "plana acabada en consonant"]
      - ["pàgina", "esdrúixola: sempre amb accent"]
      - ["examen", "plana acabada en -en: sense accent"]
      - ["llegir", "aguda acabada en consonant: sense accent"]
    explanation: "On cau l'accent i com acaba la paraula decideixen si hi ha accent escrit."
  # ---------------- Lliçó 3 ----------------
  - id: b1-31-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "El protagonista de la novel·la és un policía jubilat."
    error: "policía"
    fix: "policia"
    fix_distractors:
      - text: "policìa"
        why: "La *i* només porta accent agut; a més, *policia* no en porta cap."
      - text: "polícia"
        why: "L'accent cau a «li», però les planes acabades en vocal no en porten."
    explanation: "*Policia* és plana acabada en vocal: no porta accent. *Policía* és la forma castellana «policía»."

  - id: b1-31-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "El director truca per teléfono cada dilluns."
    error: "teléfono"
    fix: "telèfon"
    fix_distractors:
      - text: "telefono"
        why: "*Telèfon* és esdrúixola: necessita accent."
      - text: "teléfon"
        why: "La *e* és oberta: *telèfon*."
    explanation: "En català és esdrúixola i oberta: *telèfon*. *Teléfono* és la forma castellana «teléfono»."

  - id: b1-31-029
    type: find-error
    point: diacritics
    lesson: 3
    sentence: "La Laia es bibliotecària."
    error: "es"
    fix: "és"
    fix_distractors:
      - text: "ès"
        why: "El verb *ser* porta l'accent tancat: *és*."
      - text: "són"
        why: "*Són* és el plural (*elles són*); amb «la Laia» cal el singular *és*."
    explanation: "El verb *ser* (*ella*) és *és*, amb accent. *Es* és el pronom: *es lleva aviat*."

  - id: b1-31-030
    type: find-error
    point: dieresi
    lesson: 3
    sentence: "La veina del tercer llegeix molt."
    error: "veina"
    fix: "veïna"
    fix_distractors:
      - text: "veína"
        why: "No cal accent: *veïna* és plana. La marca és la dièresi."
      - text: "véina"
        why: "No cal accent i dièresi alhora: només la dièresi: *veïna*."
    explanation: "*Veïna* porta dièresi: la *i* no fa diftong amb la *e*."

  - id: b1-31-031
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "La policia tanca la biblioteca a les vuit."
    no_error: true
    explanation: "La frase és correcta: *policia* i *biblioteca* són planes acabades en vocal i no porten accent."

  - id: b1-31-032
    type: fill
    point: diacritics
    lesson: 3
    prompt: "___ vols llegir aquest mes?"
    hint: "interrogatiu"
    answers: ["Què"]
    wrong_answers:
      - text: "Que"
        why: "En les preguntes, l'interrogatiu porta accent: *què*."
      - text: "Qué"
        why: "*Qué* amb accent tancat no existeix: és *què*, amb accent obert."
    grading: strict
    explanation: "En una pregunta, l'interrogatiu és *què*, amb accent obert."

  - id: b1-31-033
    type: fill
    point: diacritics
    lesson: 3
    prompt: "La Montse ___ una col·lecció de còmics antics."
    hint: "verb TENIR, ella"
    answers: ["té"]
    wrong_answers:
