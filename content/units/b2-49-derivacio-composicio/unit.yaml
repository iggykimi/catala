  # ---------- Lliçó 5 ----------
  - id: b2-49-053
    type: reading
    point: comprensio
    lesson: 5
    title: "El dinar de diumenge"
    text: |
      Cada diumenge, la Núria obre el rebost de casa i prepara el dinar familiar. Aquest diumenge vol fer el rostit de la seva àvia: carn amb un farciment de prunes i pinyons i una cocció lenta de tres hores al forn. Dissabte va a la parada del mercat, on el peixater li tria el millor peix per a la sopa, i passa per la pastisseria a buscar un tortell de postres.

      El matí del dinar, la cuina és un poti-poti controlat: el perol de la sopa bull a foc lent, la fornada de pa reposa sobre la taula i el ganivet gros espera al costat de la forquilla de servir. La Núria tasta el brou amb la cullera de fusta: el troba una mica insípid i hi afegeix sal i una fulla de llorer. Per a l'amaniment de l'amanida fa servir oli, vinagre i una cullerada de mostassa.

      A les dues arriben tots: el pare, que sempre ve amb gana i ja menja amb els ulls; la mare, que de seguida se'n va a la cuina a ajudar; i el germà petit, que és de bon menjar i mai diu que no a res. El cunyat, que va ser sotscap en un restaurant de Girona, fa la degustació oficial: tasta el rostit amb una llesca de pa i sentencia que és el millor de l'any. Per acompanyar, hi ha torrades amb allioli, una amanida verda i una copa de vi per a cadascú.

      Després de dinar, endrecen la cuina entre tots: el rentaplats fa la feina bruta i el menjar que sobra va a la nevera en carmanyoles. La Núria diu que el secret no és cap recepta màgica, sinó temps i bons ingredients. I el germà ja pensa en diumenge que ve: diu que amb aquests dinars, se li fa la boca aigua només de pensar-hi.
    questions:
      - prompt: "Què prepara la Núria per dinar?"
        answer: "Un rostit de l'àvia amb una cocció lenta de tres hores."
        distractors:
          - text: "Una sopa de peix amb una fornada de pa."
            why: "La sopa és el primer plat; el plat principal és el rostit."
          - text: "Un tortell de la pastisseria amb torrades."
            why: "El tortell és de postres; el plat principal és el rostit."
      - prompt: "Què fa la Núria quan troba el brou insípid?"
        answer: "Hi afegeix sal i una fulla de llorer."
        distractors:
          - text: "Hi posa una cullerada de mostassa."
            why: "La mostassa és per a l'amaniment de l'amanida, no per al brou."
          - text: "El deixa coure tres hores més."
            why: "Les tres hores són la cocció del rostit, no del brou."
      - prompt: "Qui fa la degustació oficial del rostit?"
        answer: "El cunyat, que havia treballat de sotscap a Girona."
        distractors:
          - text: "El pare, que arriba sempre amb gana."
            why: "El pare menja amb els ulls, però qui tasta oficialment és el cunyat."
          - text: "El germà, que és de bon menjar."
            why: "El germà menja de tot, però la degustació la fa el cunyat."
      - prompt: "Què passa després de dinar?"
        answer: "Endrecen la cuina i guarden el menjar que sobra a la nevera."
        distractors:
          - text: "Fan una degustació de torrades amb allioli."
            why: "Les torrades acompanyen el rostit, durant el dinar."
          - text: "Van a la parada del mercat a comprar el peix."
            why: "Al mercat hi van dissabte, abans del dinar."
    explanation: "El text explica com la Núria prepara el dinar familiar de cada diumenge, des de la compra fins a les postres."

