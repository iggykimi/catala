id: b2-49
level: B2
title: "Derivació i composició"
summary: "Prefixos i sufixos per formar mots nous, compostos amb guionet i sense, i el prefix unit al mot, en el context de la cuina."
vocabulary_theme: "Cuina i gastronomia"
points:
  - id: prefixos
    title: "Els prefixos: des-, in-, re-, sots-, ex- i vice-"
    refs:
      - label: "GEIEC: La derivació"
        url: "https://geiec.iec.cat"
  - id: sufixos
    title: "Els sufixos: noms, adjectius i diminutius"
    refs:
      - label: "GEIEC: La derivació"
        url: "https://geiec.iec.cat"
  - id: compostos
    title: "Els mots compostos i el guionet"
    refs:
      - label: "GEIEC: La composició"
        url: "https://geiec.iec.cat"
  - id: compte-prefixos
    title: "Compte amb el castellà: el prefix va unit al mot"
    refs:
      - label: "Optimot: Prefixos"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions de la cuina"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: prefixos i sufixos"
  - title: "Practicar la derivació"
  - title: "Compostos i el prefix separat"
  - title: "Produir: formar mots nous"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el rebost"
    definition: "Cambra petita on es guarden el menjar i les conserves."
    example: "Guardo les llaunes de tomàquet al rebost."
  - word: "l'allioli"
    definition: "Salsa feta amb all i oli picats."
    example: "L'arròs caldós porta allioli fet a mà."
  - word: "la paella"
    definition: "Recipient pla amb dues nanses, i també el plat d'arròs que s'hi cuina."
    example: "Diumenge fem una paella per a vuit persones."
  - word: "el perol"
    definition: "Olla alta i estreta per fer sopes i bullits."
    example: "La sopa bull al perol des de les dotze."
  - word: "la cullera"
    definition: "Estri amb un mànec i una part fonda per menjar sopes i altres plats."
    example: "Tasta el brou amb la cullera de fusta."
  - word: "el ganivet"
    definition: "Estri amb fulla per tallar el menjar."
    example: "Aquest ganivet no talla gens: cal esmolar-lo."
  - word: "la forquilla"
    definition: "Estri amb pues per punxar el menjar."
    example: "Posa el ganivet a la dreta i la forquilla a l'esquerra."
  - word: "la copa"
    definition: "Vas amb peu per beure vi i altres begudes."
    example: "Ens van servir una copa de vi blanc amb el peix."
  - word: "el plat"
    definition: "Recipient pla on se serveix el menjar."
    example: "Aquest plat encara és calent: no el toquis."
  - word: "la llesca"
    definition: "Tall prim de pa."
    example: "Esmorzo una llesca de pa amb oli i sal."
  - word: "la torrada"
    definition: "Llesca de pa torrat al foc o a la torradora."
    example: "Les torrades amb allioli acompanyen el rostit."
  - word: "l'amanida"
    definition: "Plat fred de verdures crues, normalment amb enciam."
    example: "Per sopar només vull una amanida verda."
  - word: "l'amaniment"
    definition: "Preparació, normalment d'oli i vinagre, per donar gust a l'amanida."
    example: "L'amaniment de mostassa li dona un toc especial."
  - word: "el farciment"
    definition: "Barreja amb què s'omple una carn o una verdura abans de coure-la."
    example: "El farciment del rostit porta prunes i pinyons."
  - word: "la guarnició"
    definition: "Aliments que acompanyen el plat principal."
    example: "El pollastre ve amb guarnició de patates."
  - word: "la cullerada"
    definition: "Quantitat que cap en una cullera."
    example: "Afegeix una cullerada de sucre al cafè."
  - word: "la tallada"
    definition: "Tros tallat de carn, de peix o de fruita."
    example: "Per sopar faré una tallada de lluç a la planxa."
  - word: "la fornada"
    definition: "Quantitat de pa o de pastissos que es cou al forn de cada vegada."
    example: "La fornada del matí ja és a la botiga."
  - word: "la cocció"
    definition: "Procés de coure un aliment."
    example: "Aquest rostit necessita una cocció lenta de tres hores."
  - word: "la degustació"
    definition: "Acció de tastar un menjar o una beguda per apreciar-ne la qualitat."
    example: "Abans de comprar-lo, vam fer una degustació de l'oli."
  - word: "descongelar"
    definition: "Treure un aliment del congelador perquè perdi el fred."
    example: "Descongelaré el pollastre aquesta nit per a demà."
  - word: "reescalfar"
    definition: "Tornar a escalfar un menjar ja cuinat."
    example: "El pa d'ahir el reescalfem al forn cinc minuts."
  - word: "dessalar"
    definition: "Treure la sal d'un aliment, normalment deixant-lo en aigua."
    example: "Cal dessalar el bacallà durant vint-i-quatre hores."
  - word: "el rentaplats"
    definition: "Màquina que renta els plats, els gots i els coberts."
    example: "Els plats bruts van al rentaplats."
  - word: "tastar"
    definition: "Posar-se a la boca una mica de menjar o de beguda per saber quin gust té."
    example: "Tasta el brou i digues-me si hi falta sal."
  - word: "el forn"
    definition: "Aparell tancat on es cou el menjar amb calor."
    example: "El pa és al forn des de fa mitja hora."
  - word: "la nevera"
    definition: "Armari fred on es conserva el menjar."
    example: "El menjar que sobra va a la nevera en carmanyoles."
  - word: "el congelador"
    definition: "Aparell que conserva el menjar congelat, a molt baixa temperatura."
    example: "Traieu el pa del congelador amb temps."
  - word: "la parada"
    definition: "Lloc de venda dins d'un mercat."
    example: "L'Ibrahim té una parada de peix al mercat."
  - word: "el forner, la fornera"
    definition: "Persona que fa o ven pa."
    example: "El forner ja ha tret el pa calent."
  - word: "el cuiner, la cuinera"
    definition: "Persona que cuina, a casa o de professió."
    example: "L'excuiner del restaurant ara té un bar a Gràcia."
  - word: "la pastisseria"
    definition: "Botiga on es fan i es venen pastissos."
    example: "Han obert una pastisseria nova al carrer Major."
  - word: "saborós, -osa"
    definition: "Que té molt gust, que és bo de menjar."
    example: "El nostre suquet és ben saborós."
  - word: "insípid, -a"
    definition: "Que no té gens de gust."
    example: "Aquest brou és totalment insípid: hi falta sal."
  - word: "salat, -ada"
    definition: "Que porta sal o massa sal."
    example: "Trio el pernil ben salat."
  - word: "el sotscap"
    definition: "Segon responsable d'una cuina o d'un equip, per sota del cap."
    example: "La Laia és sotscap de cuina en un restaurant de Vic."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-49-001
    type: choice
    point: prefixos
    lesson: 1
    prompt: "El sopar s'ha quedat fred: l'haurem de ___ abans de servir-lo."
    answer: "reescalfar"
    distractors:
      - text: "desescalfar"
        why: "*Des-* inverteix una acció (*desfer*). Per repetir-la, el prefix és *re-*: *reescalfar*."
      - text: "superescalfar"
        why: "El prefix *super-* indica excés. Aquí només cal tornar a escalfar el sopar: *reescalfar*."
    explanation: "«S'ha quedat fred» i «abans de servir-lo»: cal tornar a escalfar el sopar. *Re-* + *escalfar* = *reescalfar*."

  - id: b2-49-002
    type: choice
    point: prefixos
    lesson: 1
    prompt: "La Laia és ___ de cuina en un restaurant de Vic: ajuda la cap en tot."
    answer: "sotscap"
    distractors:
      - text: "sots-cap"
        why: "*Sots-* va unit al mot, sense guionet: *sotscap*."
      - text: "sot cap"
        why: "*Sots-* és un prefix i no va separat: *sotscap*."
    explanation: "«Ajuda la cap en tot»: és la segona. El prefix és *sots-* i va unit al mot: *sotscap*."

  - id: b2-49-003
    type: choice
    point: prefixos
    lesson: 1
    prompt: "Aquest brou no té gens de gust: és totalment ___."
    answer: "insípid"
    distractors:
      - text: "desípid"
        why: "*Des-* inverteix una acció. Per negar un adjectiu, el prefix és *in-*: *insípid*."
      - text: "inssípid"
        why: "S'escriu amb una sola essa: *insípid*."
    explanation: "«No té gens de gust»: *insípid* vol dir sense gust. Per negar un adjectiu, el prefix és *in-*."

  - id: b2-49-004
    type: choice
    point: sufixos
    lesson: 1
    prompt: "Com es diu la quantitat de sucre que cap en una cullera?"
    answer: "una cullerada"
    distractors:
      - text: "una cullereta"
        why: "*La cullereta* és la cullera petita, no el contingut. El contingut d'una cullera és *la cullerada*."
      - text: "una cullera"
        why: "*La cullera* és l'objecte. La quantitat que hi cap és *la cullerada*."
    explanation: "El sufix *-ada* indica el contingut: *cullera* + *-ada* = *cullerada*."

  - id: b2-49-005
    type: choice
    point: sufixos
    lesson: 1
    prompt: "Fa molta calor: vull una ___ de meló ben fresca."
    answer: "tallada"
    distractors:
      - text: "tallat"
        why: "*Tallat* és masculí; «una» i «fresca» demanen un nom femení: *la tallada*."
      - text: "tallador"
        why: "*Tallador* és qui talla o l'estri per tallar, i és masculí. La porció és *la tallada*."
    explanation: "Un tros tallat de meló és *una tallada*: *tallar* + *-ada*."

  - id: b2-49-006
    type: choice
    point: sufixos
    lesson: 1
    prompt: "La Maria prepara un pastís de xocolata molt ___: sempre té èxit."
    answer: "saborós"
    distractors:
      - text: "sabrós"
        why: "El mot base és *sabor*, amb la o: *sabor* + *-ós* = *saborós*."
      - text: "saborit"
        why: "L'abundància s'expressa amb *-ós*: *saborós*. *Saborit* no existeix."
    explanation: "«Sempre té èxit»: ple de gust. *Sabor* + *-ós* = *saborós*."

  - id: b2-49-007
    type: match
    point: prefixos
    lesson: 1
    instruction: "Relaciona cada mot base amb el mot prefixat."
    pairs:
      - ["congelar", "descongelar"]
      - ["obrir", "reobrir"]
      - ["estable", "inestable"]
      - ["legal", "il·legal"]
    explanation: "*Des-* inverteix (*descongelar*); *re-* repeteix (*reobrir*); *in-* nega (*inestable*), i davant de *l* és *il·l-* (*il·legal*)."

  - id: b2-49-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["fer-se la boca aigua", "tenir saliva a la boca de les ganes de menjar"]
      - ["tenir bon paladar", "notar els sabors més fins d'un plat"]
      - ["ser de bon menjar", "tenir bon apetit"]
      - ["llepar-se'n els dits", "trobar un plat boníssim"]
    explanation: "Són expressions del món del menjar: les ganes, el gust fi, l'apetit i el plaer de menjar."

  - id: b2-49-009
    type: inline-choice
    point: prefixos
    lesson: 1
    title: "A la nostra cuina"
    text: "A la nostra cuina {des|es|res}congelem el peix amb temps, mai a última hora. Si una salsa queda {insípida|desípida|assípida}, hi afegim sal i llimona. El pa d'ahir el {re|res|de}escalfem al forn cinc minuts. I l'{excuiner|ex-cuiner|ex cuiner} del restaurant ara té un bar a Gràcia."
    explanation: "*Descongelem* (*des-* + *congelar*); *insípida* (*in-* nega); *reescalfem* (*re-* repeteix); *l'excuiner*, amb *ex-* unit al mot."

  - id: b2-49-010
    type: inline-choice
    point: sufixos
    lesson: 1
    title: "La carta del restaurant"
    text: "Amanides amb {amaniment|amanida|amanidor} de mostassa i mel. Peix del dia amb {guarnició|guarnida|guarnit} de verdures de l'hort. El nostre suquet, ben {saborós|saborit|sabrós}. I de postres, mel i mató amb un {trosset|troset|trocet} de pa de pagès."
    explanation: "*L'amaniment* és la preparació; *la guarnició* acompanya el plat; *saborós* porta el sufix *-ós*; *trosset* és el diminutiu de *tros*, amb doble essa."

  - id: b2-49-011
    type: fill
    point: prefixos
    lesson: 1
    prompt: "Demà tanquem per vacances i ___ al setembre amb una carta nova."
    hint: "tornar a obrir, nosaltres"
    answers: ["reobrim", "reobrirem"]
    wrong_answers:
      - text: "reobrem"
        why: "*Reobrir* és de la tercera conjugació: nosaltres *reobrim*."
    grading: strict
    explanation: "«Tanquem» i «al setembre»: tornar a obrir. *Re-* + *obrir* = *reobrim*."

  - id: b2-49-012
    type: fill
    point: prefixos
    lesson: 1
    prompt: "El bacallà és massa salat: cal ___ durant vint-i-quatre hores."
    hint: "SAL, verb amb prefix i sufix"
    answers: ["dessalar-lo", "dessalar el bacallà"]
    wrong_answers:
      - text: "desalar-lo"
        why: "*Des-* + *sal* + *-ar*: la essa es duplica: *dessalar-lo*."
      - text: "dessalat-lo"
        why: "Després de *cal* va l'infinitiu, no el participi: *dessalar-lo*."
    grading: strict
    explanation: "Treure la sal és *dessalar*: *des-* + *sal* + *-ar*, amb doble essa; «el bacallà» és *lo* darrere de l'infinitiu."

  - id: b2-49-013
    type: fill
    point: sufixos
    lesson: 1
    prompt: "El ___ és qui fa el pa cada matí a les cinc."
    hint: "FORN, ofici"
    answers: ["forner"]
    wrong_answers:
      - text: "fornero"
        why: "Els oficis en *-er* no porten cap o final: *forner*."
    grading: strict
    explanation: "L'ofici de fer pa és el *forner*: *forn* + *-er*."

  # ---------- Lliçó 2 ----------
  - id: b2-49-014
    type: fill
    point: prefixos
    lesson: 2
    prompt: "Aquests bolets són ___: no es poden menjar."
    hint: "COMESTIBLE, negació"
    answers: ["incomestibles"]
    wrong_answers:
      - text: "incomestible"
        why: "«Bolets» és plural: *incomestibles*."
      - text: "descomestibles"
        why: "Per negar un adjectiu fem servir *in-*, no *des-*: *incomestibles*."
    grading: strict
    explanation: "«No es poden menjar»: negació de *comestible*. *In-* no canvia davant de *c*: *incomestibles*."

  - id: b2-49-015
    type: fill
    point: prefixos
    lesson: 2
    prompt: "El restaurant treballa sense llicència: és totalment ___."
    hint: "LEGAL, negació"
    answers: ["il·legal"]
    wrong_answers:
      - text: "inlegal"
        why: "*In-* davant de *l* és *il·l-*: *il·legal*."
      - text: "ilegal"
        why: "L'adjectiu porta ela geminada: *il·legal*."
    grading: strict
    explanation: "La negació de *legal* és *il·legal*: *in-* + *l* = *il·l-*."

  - id: b2-49-016
    type: fill
    point: sufixos
    lesson: 2
    prompt: "Per fer l'allioli necessites una ___ bona."
    hint: "BATRE, màquina"
    answers: ["batedora"]
    wrong_answers:
      - text: "batedor"
        why: "La màquina de cuina és *la batedora*, en femení."
      - text: "batidora"
        why: "El verb és *batre*: la màquina és *la batedora*."
    grading: strict
    explanation: "La màquina de batre és *la batedora*: *batre* + *-dora*."

  - id: b2-49-017
    type: fill
    point: sufixos
    lesson: 2
    prompt: "Han obert una ___ nova al carrer Major: fan croissants boníssims."
    hint: "PASTÍS, botiga"
    answers: ["pastisseria"]
    wrong_answers:
      - text: "pastissera"
        why: "*La pastissera* és la persona; la botiga és *la pastisseria*."
      - text: "pastisceria"
        why: "La paraula s'escriu amb *ss*: *pastisseria*."
    grading: strict
    explanation: "La botiga de pastissos és *la pastisseria*: *pastís* + *-eria*."

  - id: b2-49-018
    type: fill
    point: sufixos
    lesson: 2
    prompt: "Aquests préssecs són molt ___: ragen suc."
    hint: "SUC, adjectiu"
    answers: ["sucosos"]
    wrong_answers:
      - text: "sucós"
        why: "«Préssecs» és plural: *sucosos*."
      - text: "sucsets"
        why: "L'abundància s'expressa amb *-ós*: *sucosos*."
    grading: strict
    explanation: "Plens de suc: *suc* + *-ós* = *sucós*; en plural, *sucosos*."

  - id: b2-49-019
    type: order
    point: prefixos
    lesson: 2
    cue: "Digues que aquesta nit trauràs el pollastre del congelador per a demà."
    chunks: ["Aquesta nit", "descongelaré", "el pollastre", "per a demà"]
    extra: ["escongelaré"]
    answers:
      - "Aquesta nit descongelaré el pollastre per a demà."
      - "Descongelaré el pollastre aquesta nit per a demà."
      - "Per a demà descongelaré el pollastre aquesta nit."
      - "Descongelaré el pollastre per a demà aquesta nit."
    explanation: "Treure del congelador és *descongelar*: *des-* + *congelar*. En futur: *descongelaré*."

  - id: b2-49-020
    type: order
    point: sufixos
    lesson: 2
    cue: "Explica que la Marta talla el pa a trossos petits."
    chunks: ["La Marta", "talla", "el pa", "a trossets"]
    extra: ["a trosets"]
    answers:
      - "La Marta talla el pa a trossets."
      - "La Marta talla a trossets el pa."
    explanation: "Trossos petits de pa: *tros* + *-et* = *trosset*, amb doble essa; en plural, *trossets*."

  - id: b2-49-021
    type: order
    point: sufixos
    lesson: 2
    cue: "Digues que vols una botifarra sense gaire greix."
    chunks: ["Vull", "una botifarra", "ben poc", "greixosa"]
    extra: ["greixota"]
    answers:
      - "Vull una botifarra ben poc greixosa."
    explanation: "Amb poc greix: *greix* + *-ós*, en femení *greixosa* perquè «botifarra» és femení."

  - id: b2-49-022
    type: choice
    point: sufixos
    lesson: 2
    prompt: "L'Ibrahim té una parada de peix al mercat: és ___."
    answer: "peixater"
    distractors:
      - text: "pescater"
        why: "El mot base és *peix*, amb *x*: *peixater*."
      - text: "peixador"
        why: "Qui ven peix és el *peixater*: *peix* + *-er*."
    explanation: "Qui ven peix a la parada: *peix* + *-er* = *peixater*."

  - id: b2-49-023
    type: choice
    point: prefixos
    lesson: 2
    prompt: "El ___ de l'associació de veïns vindrà a tastar la paella popular."
    answer: "vicepresident"
    distractors:
      - text: "vice-president"
        why: "*Vice-* va unit al mot, sense guionet: *vicepresident*."
      - text: "vice president"
        why: "*Vice-* és un prefix i no va separat: *vicepresident*."
    explanation: "El substitut del president és el *vicepresident*: *vice-* va unit al mot."

  - id: b2-49-024
    type: choice
    point: sufixos
    lesson: 2
    prompt: "La recepta demana dues ___ de farina."
    answer: "cullerades"
    distractors:
      - text: "culleradas"
        why: "En català, el plural femení acaba en *-es*: *cullerades*."
      - text: "cullerada"
        why: "«Dues» demana el plural: *cullerades*."
    explanation: "La quantitat que cap en una cullera: *cullerada*; en plural, *cullerades*."

  - id: b2-49-025
    type: inline-choice
    point: sufixos
    lesson: 2
    title: "Al mercat del dissabte"
    text: "Vaig a la {peixateria|peixeteria|pescateria} a buscar gambes, el {forner|fornero|fornista} ja ha tret el pa calent, trio el pernil ben {salat|salit|salanit} i omplo l'ampolla d'aigua {potable|potible|bebible}."
    explanation: "La botiga és *la peixateria* (en castellà, «pescadería»); qui fa el pa és *el forner*; amb sal és *salat*; l'aigua que es pot beure és *potable*."

  - id: b2-49-026
    type: match
    point: sufixos
    lesson: 2
    instruction: "Relaciona cada mot base amb el mot derivat."
    pairs:
      - ["sal", "salat"]
      - ["greix", "greixós"]
      - ["cullera", "cullerada"]
      - ["tros", "trosset"]
    explanation: "*-at* marca la qualitat (*salat*); *-ós*, l'abundància (*greixós*); *-ada*, el contingut (*cullerada*); *-et*, el diminutiu (*trosset*)."

  # ---------- Lliçó 3 ----------
  - id: b2-49-027
    type: choice
    point: compostos
    lesson: 3
    prompt: "No trobo l'___: la llauna de tomàquet no es vol obrir."
    answer: "obrellaunes"
    distractors:
      - text: "obre-llaunes"
        why: "Aquest compost s'escriu en un sol mot, sense guionet: *obrellaunes*."
      - text: "obrellauna"
        why: "El compost és invariable i acaba en *-s*: *l'obrellaunes*."
    explanation: "L'estri per obrir llaunes és *l'obrellaunes*: *obrir* + *llaunes*, en un sol mot."

  - id: b2-49-028
    type: choice
    point: compostos
    lesson: 3
    prompt: "Penja l'abric al ___ de l'entrada."
    answer: "penja-robes"
    distractors:
      - text: "penjarobes"
        why: "Porta guionet perquè el primer element acaba en vocal i el segon comença per *r*: *penja-robes*."
      - text: "penja-roba"
        why: "El compost acaba en *-s* i és invariable: *el penja-robes*."
    explanation: "El moble per penjar-hi roba és *el penja-robes*: vocal + *r* entre els dos elements demana guionet."

  - id: b2-49-029
    type: choice
    point: compostos
    lesson: 3
    prompt: "L'Enric és un ___: explica a tothom els secrets de la cuina."
    answer: "bocamoll"
    distractors:
