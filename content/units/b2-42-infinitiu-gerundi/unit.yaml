  # ---------- Lliçó 5 ----------
  - id: b2-42-053
    type: reading
    point: comprensio
    lesson: 5
    title: "La primera entrevista de l'Arnau"
    text: |
      Fa tres setmanes, l'Arnau va tenir la primera entrevista de feina en una empresa de logística de Martorell. Havia enviat el currículum a una vintena d'empreses, escrivint una carta de presentació diferent per a cada una, i només dues li havien respost. La nit abans gairebé no va dormir, repassant mentalment les preguntes més habituals.

      L'endemà es va llevar d'hora i va arribar a l'oficina quaranta minuts abans, tot i que la cita era a les deu. Mentre esperava a la recepció, va intentar tranquil·litzar-se respirant a poc a poc. En entrar a la sala, es va trobar amb dues persones: la Montse, cap de recursos humans, i el Jordi, responsable del magatzem. Tots dos el van saludar somrient, i això el va calmar una mica.

      Les primeres preguntes eren sobre l'experiència anterior. L'Arnau va explicar que havia treballat tres anys en un supermercat, on sovint feia hores extres a Nadal. Després, la Montse li va preguntar què faria si dos companys discutissin pel torn. Va contestar que intentaria parlar-hi per separat, escoltant tots dos abans de proposar res. El Jordi va assentir i va prendre notes.

      Cap al final, li van preguntar pel sou. L'Arnau, que s'ho havia preparat, va donar una xifra raonable sense posar-se nerviós. En acabar l'entrevista, la Montse li va dir que decidirien en una setmana. Ell va sortir content, però durant els dies següents va estar pendent del mòbil. Divendres passat, per fi, li van trucar: l'havien seleccionat per a un període de prova de tres mesos, i dilluns que ve comença. Ara diu que, si ha de fer-ne una altra, no s'angoixarà tant la nit abans.
    questions:
      - prompt: "Com va preparar l'Arnau la seva candidatura?"
        answer: "Va escriure una carta de presentació diferent per a cada empresa."
        distractors:
          - text: "Va enviar el mateix currículum a totes les empreses de Martorell."
            why: "El text diu que va fer una carta de presentació diferent per a cada empresa."
          - text: "Va fer una prova de logística abans d'enviar el currículum."
            why: "El text no esmenta cap prova abans d'enviar-lo."
      - prompt: "Què va fer l'Arnau mentre esperava a la recepció?"
        answer: "Va respirar a poc a poc per calmar-se."
        distractors:
          - text: "Va repassar el currículum amb la Montse."
            why: "La Montse no hi era: la va conèixer en entrar a la sala."
          - text: "Va parlar una estona amb el Jordi."
            why: "El Jordi era a la sala de l'entrevista, no a la recepció."
      - prompt: "Què va respondre l'Arnau sobre un conflicte entre dos companys?"
        answer: "Parlaria amb cadascun per separat i els escoltaria abans de decidir."
        distractors:
          - text: "Ho comunicaria directament al cap de recursos humans."
            why: "No parla de comunicar-ho a recursos humans, sinó de parlar-hi ell mateix."
          - text: "Canviaria el torn d'un dels dos companys."
            why: "El conflicte és pel torn, però no diu que el canviï."
      - prompt: "Què va passar després de l'entrevista?"
        answer: "Va esperar uns dies i al final el van seleccionar per a un període de prova."
        distractors:
          - text: "Va rebre la resposta l'endemà mateix."
            why: "La Montse li va dir que decidirien en una setmana."
          - text: "El van rebutjar, però el van avisar per a una altra oferta."
            why: "El van seleccionar: dilluns que ve comença."
    explanation: "El text explica la preparació, l'entrevista i el resultat de la primera entrevista de feina de l'Arnau."

