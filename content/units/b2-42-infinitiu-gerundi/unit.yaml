id: b2-42
level: B2
title: "Infinitiu i gerundi"
summary: "L'infinitiu amb «en», el gerundi simultani, «tot» + gerundi i els usos del gerundi que cal evitar, en el context del món laboral."
vocabulary_theme: "Món laboral i entrevistes de feina"
points:
  - id: en-infinitiu
    title: "En + infinitiu: l'acció immediata"
    refs:
      - label: "GEIEC: Les formes no personals del verb"
        url: "https://geiec.iec.cat"
  - id: gerundi-simultani
    title: "El gerundi simultani"
    refs:
      - label: "GEIEC: Les formes no personals del verb"
        url: "https://geiec.iec.cat"
  - id: tot-gerundi
    title: "*Tot + gerundi*"
    refs:
      - label: "GEIEC: Les formes no personals del verb"
        url: "https://geiec.iec.cat"
  - id: compte-gerundi
    title: "Compte amb el castellà: el gerundi que no s'admet"
    refs:
      - label: "Optimot: Gerundi"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions de la feina"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: en + infinitiu i gerundi"
  - title: "Practicar en + infinitiu i el gerundi"
  - title: "*Tot + gerundi* i el gerundi incorrecte"
  - title: "Produir: reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'entrevista de feina"
    definition: "Conversa en què una empresa coneix una persona que vol treballar-hi."
    example: "Demà tinc l'entrevista de feina a les deu."
  - word: "el currículum"
    definition: "Document que resumeix els estudis i l'experiència d'una persona."
    example: "He actualitzat el currículum abans d'enviar-lo."
  - word: "la carta de presentació"
    definition: "Text breu que acompanya el currículum i explica per què vols la feina."
    example: "La carta de presentació no ha de passar d'una pàgina."
  - word: "la candidatura"
    definition: "Conjunt de papers amb què una persona es presenta a una oferta de feina."
    example: "Vam rebre trenta candidatures per a un sol lloc."
  - word: "l'oferta de feina"
    definition: "Anunci d'una empresa que busca un treballador."
    example: "He vist una oferta de feina molt interessant a Sabadell."
  - word: "el lloc de treball"
    definition: "La feina concreta que fa una persona dins d'una empresa."
    example: "El meu lloc de treball és a la tercera planta."
  - word: "la plantilla"
    definition: "Conjunt de persones que treballen en una empresa."
    example: "L'empresa té una plantilla de cent vint persones."
  - word: "el contracte"
    definition: "Document que fixa les condicions de la feina i el sou."
    example: "Signaré el contracte dilluns a recursos humans."
  - word: "el període de prova"
    definition: "Primer temps de feina en què l'empresa i el treballador es poden deixar sense cap indemnització."
    example: "El període de prova és de tres mesos."
  - word: "el sou"
    definition: "Diners que es cobren cada mes per la feina."
    example: "El sou no m'importa tant com l'horari."
  - word: "la nòmina"
    definition: "Paper que detalla el sou i els descomptes de cada mes."
    example: "A la nòmina hi surten les hores extres."
  - word: "l'horari"
    definition: "Franja de temps en què cal ser a la feina."
    example: "L'horari és flexible, però cal ser-hi de deu a dues."
  - word: "la jornada"
    definition: "Hores de feina d'un dia."
    example: "Aquesta setmana tinc jornada intensiva."
  - word: "les hores extres"
    definition: "Hores que es treballen a més de la jornada pactada."
    example: "A l'abril fem moltes hores extres per la declaració de la renda."
  - word: "el torn"
    definition: "Part del dia que té assignada cada grup de treballadors."
    example: "Aquest mes faig el torn de tarda."
  - word: "la reunió"
    definition: "Trobada de diverses persones per parlar d'un tema de feina."
    example: "La reunió d'equip comença a dos quarts de deu."
  - word: "el cap, la cap"
    definition: "Persona que dirigeix un equip i en respon."
    example: "La meva cap em va felicitar pel resultat."
  - word: "el company, la companya de feina"
    definition: "Persona que treballa al mateix lloc que tu."
    example: "Dino amb els companys de feina cada dijous."
  - word: "recursos humans"
    definition: "Departament que s'ocupa de contractar i de gestionar les persones d'una empresa."
    example: "Recursos humans m'ha convocat per dimecres."
  - word: "contractar"
    definition: "Fer un contracte a una persona perquè treballi en una empresa."
    example: "L'empresa ha contractat quatre administratius."
  - word: "acomiadar"
    definition: "Dir a un treballador que ha de deixar la feina."
    example: "Van acomiadar dues persones quan van tancar la fàbrica."
  - word: "seleccionar"
    definition: "Triar una persona entre diverses candidatures."
    example: "M'han seleccionat per a la segona fase."
  - word: "assessorar"
    definition: "Donar consell tècnic a algú."
    example: "Una gestoria ens assessora en temes fiscals."
  - word: "l'aspirant"
    definition: "Persona que es presenta a una feina o a una plaça."
    example: "Els aspirants esperaven asseguts al passadís."
  - word: "la baixa"
    definition: "Període en què un treballador no va a la feina per malaltia i continua cobrant."
    example: "Va demanar la baixa per un problema d'esquena."
  - word: "plegar"
    definition: "Acabar la jornada de feina (col·loquial)."
    example: "Avui plego a les cinc."
  - word: "el magatzem"
    definition: "Local on es guarden productes o materials."
    example: "El responsable del magatzem ens va ensenyar l'estoc."
  - word: "la gestoria"
    definition: "Empresa que s'ocupa dels tràmits administratius i fiscals d'altres."
    example: "La gestoria prepara les nòmines de tota la plantilla."
  - word: "pactar"
    definition: "Acordar una cosa entre dues parts."
    example: "Vam pactar un horari de cinc hores diàries."
  - word: "puntual"
    definition: "Que arriba o fa una cosa a l'hora."
    example: "A l'entrevista és important ser puntual."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-42-001
    type: choice
    point: en-infinitiu
    lesson: 1
    prompt: "___ l'entrevista, ens van acompanyar fins a la porta i ens van dir que ens trucarien aviat."
    answer: "En acabar"
    distractors:
      - text: "A acabar"
        why: "Amb valor temporal, la preposició és en, no a: *a acabar* no existeix en aquest ús."
      - text: "Quan acabar"
        why: "*Quan* va amb un verb conjugat (quan va acabar). Amb infinitiu, la forma és *en acabar*."
    explanation: "*En + infinitiu* situa l'acció principal just després de la primera: *en acabar* l'entrevista equival a «quan vam acabar l'entrevista»."

  - id: b2-42-002
    type: choice
    point: en-infinitiu
    lesson: 1
    prompt: "Què vol dir «En arribar a l'oficina, el Pau va encendre l'ordinador»?"
    answer: "El Pau va encendre l'ordinador tot just va arribar."
    distractors:
      - text: "El Pau va encendre l'ordinador abans d'arribar a l'oficina."
        why: "«En arribar» situa l'acció després de l'arribada, no abans."
      - text: "El Pau va encendre l'ordinador mentre anava cap a l'oficina."
        why: "La simultaneïtat s'expressa amb gerundi (*arribant*), no amb *en + infinitiu*."
    explanation: "*En + infinitiu* indica que la segona acció es fa immediatament després de la primera. Aquí, l'ordinador s'encén un cop arribat."

  - id: b2-42-003
    type: choice
    point: gerundi-simultani
    lesson: 1
    prompt: "___ molta experiència, la Laia no va tenir problemes per trobar feina."
    answer: "Tenint"
    distractors:
      - text: "Tenent"
        why: "*Tenir* és un verb en *-ir*: el gerundi acaba en *-int* (*tenint*). El gerundi en *-ent* és el dels verbs en *-er* i *-re*."
      - text: "Tingut"
        why: "*Tingut* és el participi. Aquí cal el gerundi, que expressa la causa."
    explanation: "El gerundi pot expressar la causa: «tenint molta experiència» vol dir «com que tenia molta experiència». Els verbs en *-ir* fan el gerundi en *-int*."

  - id: b2-42-004
    type: choice
    point: gerundi-simultani
    lesson: 1
    prompt: "___ a prop de la feina, la Montse arriba sempre puntual."
    answer: "Vivint"
    distractors:
      - text: "Vivent"
        why: "*Viure* és un verb de la segona conjugació, però el seu gerundi és *vivint*. Els gerundis en *-ent* són els dels verbs en *-er* i *-re*."
      - text: "Viscut"
        why: "*Viscut* és el participi, no expressa causa ni simultaneïtat."
    explanation: "«Vivint a prop de la feina» expressa la causa («com que viu a prop»). El gerundi de *viure* és *vivint*."

  - id: b2-42-005
    type: match
    point: gerundi-simultani
    lesson: 1
    instruction: "Relaciona cada infinitiu amb el seu gerundi."
    pairs:
      - ["tenir", "tenint"]
      - ["venir", "venint"]
      - ["escriure", "escrivint"]
      - ["obrir", "obrint"]
    explanation: "Els verbs en *-ar* fan el gerundi en *-ant*; els verbs en *-er* i en *-re*, en *-ent*; els verbs en *-ir*, en *-int*. *Escriure* és irregular: *escrivint*."

  - id: b2-42-006
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["posar-se les piles", "començar a treballar amb més energia"]
      - ["treballar de valent", "treballar molt i amb ganes"]
      - ["fer hores extres", "treballar més enllà de la jornada pactada"]
      - ["anar de bòlit", "tenir molta feina i poc temps"]
      - ["plegar", "acabar la jornada de feina"]
    explanation: "Són expressions molt habituals en la conversa de feina."

  - id: b2-42-007
    type: inline-choice
    point: en-infinitiu
    lesson: 1
    title: "Benvinguda a l'empresa"
    text: "Benvinguts a l'equip! {En|A|Quan} entrar a l'edifici, aneu a recepció. {En|A|Quan} acabar la presentació, la Montse us presentarà l'equip. {En|A|Quan} signar el contracte, rebreu el carnet d'empleat. {En|A|Quan} tenir el carnet, ja podreu entrar sols."
    explanation: "Per expressar que una acció passa tot just després d'una altra fem servir *en + infinitiu*: *en entrar*, *en acabar*, *en signar*, *en tenir*. *Quan* demana un verb conjugat."

  - id: b2-42-008
    type: fill
    point: en-infinitiu
    lesson: 1
    prompt: "___ de casa, em vaig adonar que m'havia deixat el mòbil."
    hint: "sortir, *en + infinitiu*"
    answers: ["En sortir"]
    wrong_answers:
      - text: "En sortit"
        why: "Després de *en* va l'infinitiu (sortir), no el participi."
    grading: tolerant
    explanation: "L'acció d'adonar-se passa just després de sortir de casa: *en + infinitiu*, *en sortir*."

  - id: b2-42-009
    type: fill
    point: gerundi-simultani
    lesson: 1
    prompt: "Vaig arribar a la feina ___ perquè se m'havia fet tard."
    hint: "córrer, gerundi"
    answers: ["corrent"]
    wrong_answers:
      - text: "corrint"
        why: "*Córrer* és un verb en *-er*: el gerundi acaba en *-ent*, no en *-int*."
    grading: tolerant
    explanation: "El gerundi expressa la manera com arribo: *corrent*. Els verbs en *-er* fan el gerundi en *-ent*."

  - id: b2-42-010
    type: choice
    point: en-infinitiu
    lesson: 1
    prompt: "Quina frase vol dir «Quan vaig veure el cap, em vaig posar nerviós»?"
    answer: "En veure el cap, em vaig posar nerviós."
    distractors:
      - text: "Per veure el cap, em vaig posar nerviós."
        why: "*Per + infinitiu* expressa finalitat («per poder veure'l»), no el moment en què passa."
      - text: "En veure el cap, em posaré nerviós."
        why: "El temps verbal canvia: l'original està en passat i aquesta frase és de futur."
    explanation: "«En veure el cap» substitueix «quan vaig veure el cap»: l'acció va passar immediatament després de veure'l."

  - id: b2-42-011
    type: order
    point: en-infinitiu
    lesson: 1
    cue: "Digues que la Montse es va posar contenta tot just va llegir el correu."
    chunks: ["La Montse", "es va posar", "contenta", "en", "llegir el correu"]
    extra: ["a"]
    answers:
      - "La Montse es va posar contenta en llegir el correu."
      - "En llegir el correu, la Montse es va posar contenta."
    explanation: "«En llegir el correu» va darrere de l'acció principal o davant d'ella; el bloc *en + infinitiu* no es pot separar."

  - id: b2-42-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «posar-se les piles» a la feina?"
    answer: "Començar a treballar amb més energia i més ganes."
    distractors:
      - text: "Canviar les piles d'un aparell de l'oficina."
        why: "Aquest és el sentit literal; l'expressió és figurada."
      - text: "Estar molt cansat després d'una jornada llarga."
        why: "És just el contrari: vol dir tenir més energia."
    explanation: "«Posar-se les piles» és una expressió figurada: algú que va fluix i s'activa per acabar la feina."

  - id: b2-42-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "El projecte s'ha de lliurar dimarts: ens toca ___ si volem acabar a temps."
    answer: "posar-nos les piles"
    distractors:
      - text: "fer-nos els sords"
        why: "Vol dir fer veure que no sentim res; no encaixa amb la urgència."
      - text: "deixar-ho córrer"
        why: "Vol dir abandonar un assumpte, justament el contrari del que cal fer."
    explanation: "Amb un termini proper cal activar-se i treballar més de pressa: *posar-nos les piles*."

  # ---------- Lliçó 2 ----------
  - id: b2-42-014
    type: fill
    point: en-infinitiu
    lesson: 2
    prompt: "___ el correu del client, la Carla va respondre de seguida."
    hint: "llegir, *en + infinitiu*"
    answers: ["En llegir"]
    wrong_answers:
      - text: "En llegit"
        why: "Després de *en* va l'infinitiu (llegir), no el participi."
    grading: tolerant
    explanation: "La resposta va venir tot just després de llegir el correu: *en + infinitiu*, *en llegir*."

  - id: b2-42-015
    type: fill
    point: en-infinitiu
    lesson: 2
    prompt: "___ la nòmina, em vaig adonar que no m'havien pagat les hores extres."
    hint: "veure, *en + infinitiu*"
    answers: ["En veure"]
    grading: tolerant
    explanation: "Em vaig adonar de l'error immediatament després de veure la nòmina: *en veure*."

  - id: b2-42-016
    type: fill
    point: en-infinitiu
    lesson: 2
    prompt: "El cap va dir que hi hauria hores extres i, ___, tots vam protestar."
    hint: "sentir, *en + infinitiu* + pronom que substitueix «que hi hauria hores extres»"
    answers: ["en sentir-ho"]
    wrong_answers:
      - text: "en sentir-lo"
        why: "Allò que se sent és tota una idea («que hi hauria hores extres»): el pronom és *ho*, no *lo*."
    grading: strict
    explanation: "Darrere de l'infinitiu el pronom va amb guionet: *sentir-ho*. El pronom *ho* substitueix una idea sencera."

  - id: b2-42-017
    type: fill
    point: gerundi-simultani
    lesson: 2
    prompt: "A les reunions, el director sempre comença ___ que no hi ha pressupost."
    hint: "dir, gerundi"
    answers: ["dient"]
    wrong_answers:
      - text: "diguent"
        why: "El gerundi de *dir* és irregular: *dient*."
    grading: tolerant
    explanation: "El gerundi expressa la manera com comença: *dient*. *Dir* fa el gerundi *dient*."

  - id: b2-42-018
    type: fill
    point: gerundi-simultani
    lesson: 2
    prompt: "La Fàtima es va guanyar la vida ___ oficines durant tres anys."
    hint: "netejar, gerundi"
    answers: ["netejant"]
    grading: tolerant
    explanation: "El gerundi indica el mitjà o la manera: es va guanyar la vida *netejant* oficines."

  - id: b2-42-019
    type: fill
    point: gerundi-simultani
    lesson: 2
    prompt: "___ bé el sector, l'Ibrahim va negociar un bon sou."
    hint: "conèixer, gerundi"
    answers: ["Coneixent"]
    wrong_answers:
      - text: "Coneixint"
        why: "*Conèixer* és un verb en *-er*: el gerundi acaba en *-ent*, no en *-int*."
    grading: tolerant
    explanation: "El gerundi expressa la causa: *coneixent* bé el sector, o sigui «com que el coneixia bé»."

  - id: b2-42-020
    type: order
    point: gerundi-simultani
    lesson: 2
    cue: "Explica com va contestar les preguntes l'Arnau durant l'entrevista."
    chunks: ["L'Arnau", "va contestar", "les preguntes", "somrient"]
    extra: ["somriure"]
    answers:
      - "L'Arnau va contestar les preguntes somrient."
      - "L'Arnau va contestar somrient les preguntes."
    explanation: "El gerundi (*somrient*) expressa la manera i va a prop del verb. *Somriure* fa el gerundi *somrient*."

  - id: b2-42-021
    type: order
    point: en-infinitiu
    lesson: 2
    cue: "El Jordi va trucar a la Laia tot just va sortir de l'entrevista."
    chunks: ["El Jordi", "va trucar", "a la Laia", "en", "sortir", "de l'entrevista"]
    extra: ["a"]
    answers:
      - "El Jordi va trucar a la Laia en sortir de l'entrevista."
      - "En sortir de l'entrevista, el Jordi va trucar a la Laia."
    explanation: "*En + infinitiu* pot anar al final de la frase o al principi, i expressa que l'acció principal passa tot seguit."

  - id: b2-42-022
    type: choice
    point: en-infinitiu
    lesson: 2
    prompt: "Què indica «en + infinitiu» a «En acabar la jornada, vaig plegar»?"
    answer: "Que la segona acció passa tot just després de la primera."
    distractors:
      - text: "Que la segona acció passa mentre es fa la primera."
        why: "La simultaneïtat s'expressa amb gerundi (*acabant*) o amb *tot + gerundi*; *en + infinitiu* indica immediatesa."
      - text: "Que la segona acció només passarà si es compleix la primera."
        why: "La condició s'expressa amb si o amb altres conjuncions, no amb *en + infinitiu*."
    explanation: "En + infinitiu marca la immediatesa: primer s'acaba la jornada i tot seguit es plega."

  - id: b2-42-023
    type: choice
    point: gerundi-simultani
    lesson: 2
    prompt: "La Montse va trobar la sala ___ les indicacions del cartell."
    answer: "seguint"
    distractors:
      - text: "seguent"
        why: "*Seguir* és un verb en *-ir*: el gerundi acaba en *-int* (*seguint*)."
      - text: "seguit"
        why: "*Seguit* és el participi. Aquí cal el gerundi, que expressa la manera."
    explanation: "El gerundi indica com ho va fer: *seguint* les indicacions. Els verbs en *-ir* fan el gerundi en *-int*."

  - id: b2-42-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Aquest mes el Pau ha fet moltes hores extres. Què vol dir?"
    answer: "Ha treballat més hores de les pactades al contracte."
    distractors:
      - text: "Ha cobrat un sou extra per Nadal."
        why: "Les *hores extres* són hores treballades, no un pagament extraordinari."
      - text: "Ha tingut moltes hores lliures durant la jornada."
        why: "Al contrari: ha treballat més, no menys."
    explanation: "Fer *hores extres* és treballar més enllà de la jornada pactada."

  - id: b2-42-025
    type: choice
    point: gerundi-simultani
    lesson: 2
    prompt: "La Montse va passar la tarda ___ cartes de presentació."
    answer: "escrivint"
    distractors:
      - text: "escrivent"
        why: "*Escriure* és irregular: el gerundi és *escrivint*, no *escrivent*."
      - text: "escrit"
        why: "*Escrit* és el participi; el gerundi expressa l'acció que dura."
    explanation: "El gerundi indica què va fer durant la tarda. *Escriure* fa el gerundi *escrivint*."

  - id: b2-42-026
    type: order
    point: gerundi-simultani
    lesson: 2
    cue: "El Pau explica com va trobar feina: va enviar el currículum a moltes empreses."
    chunks: ["El Pau", "va trobar feina", "enviant", "el currículum", "a moltes empreses"]
    extra: ["enviar"]
    answers:
      - "El Pau va trobar feina enviant el currículum a moltes empreses."
      - "El Pau va trobar feina enviant a moltes empreses el currículum."
    explanation: "El gerundi (*enviant*) expressa el mitjà com va trobar feina. Va just després del verb principal."

  # ---------- Lliçó 3 ----------
  - id: b2-42-027
    type: choice
    point: tot-gerundi
    lesson: 3
    prompt: "La Carla prepara l'informe ___ música clàssica."
    answer: "tot escoltant"
    distractors:
      - text: "tot escoltar"
        why: "Darrere de *tot* va un gerundi (*escoltant*), no un infinitiu."
      - text: "tot escoltat"
        why: "*Escoltat* és un participi; cal el gerundi per expressar que les dues accions passen alhora."
    explanation: "*Tot + gerundi* expressa dues accions simultànies i sovint prolongades: prepara l'informe *tot escoltant* música."

  - id: b2-42-028
    type: fill
    point: tot-gerundi
    lesson: 3
    prompt: "La Núria contesta els correus ___ un entrepà."
    hint: "menjar, *tot + gerundi*"
    answers: ["tot menjant"]
    wrong_answers:
      - text: "tot menjar"
        why: "Darrere de *tot* va un gerundi: *menjant*."
    grading: tolerant
    explanation: "Les dues accions passen alhora: *tot menjant* un entrepà."

  - id: b2-42-029
    type: fill
    point: tot-gerundi
    lesson: 3
    prompt: "El Jordi va sortir de la sala ___ i es va acomiadar de tothom."
    hint: "riure, *tot + gerundi*"
    answers: ["tot rient"]
    wrong_answers:
