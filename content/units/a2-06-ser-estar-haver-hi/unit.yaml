id: a2-06
level: A2
title: "Ser, estar i haver-hi"
summary: "Els verbs *ser* i *estar* amb adjectius i llocs, *haver-hi* en tres temps i *ser-hi*, amb indicacions per orientar-se per la ciutat."
vocabulary_theme: "La ciutat i les indicacions"
points:
  - id: ser-estar-adjectius
    title: "Ser i estar amb adjectius"
    refs:
      - label: "GEIEC: Ser i estar"
        url: "https://geiec.iec.cat"
  - id: ser-localitzacio
    title: "La localització amb ser"
    refs:
      - label: "GEIEC: Ser i estar"
        url: "https://geiec.iec.cat"
  - id: haver-hi
    title: "Haver-hi: hi ha, hi havia, hi haurà"
    refs:
      - label: "GEIEC: Haver-hi"
        url: "https://geiec.iec.cat"
  - id: ser-hi
    title: "Ser-hi i no ser-hi"
    refs:
      - label: "GEIEC: Ser-hi"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: estar i hi han"
  - id: expressions
    title: "Expressions per orientar-se"
lessons:
  - title: "Estats i llocs: ser i estar"
  - title: "Practicar ser i estar"
  - title: "Haver-hi i ser-hi"
  - title: "Produir frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el carrer"
    definition: "Via d'una ciutat amb cases a cada costat."
    example: "El carrer Major és ple de botigues."
  - word: "la plaça"
    definition: "Espai obert d'una ciutat on es troba la gent."
    example: "La festa és a la plaça del poble."
  - word: "l'avinguda"
    definition: "Carrer molt ample d'una ciutat."
    example: "L'avinguda té tres rotondes noves."
  - word: "el barri"
    definition: "Part d'una ciutat que té un nom propi."
    example: "Al meu barri hi ha tres escoles."
  - word: "el centre"
    definition: "Part principal d'una ciutat, amb botigues i oficines."
    example: "L'estació és lluny del centre."
  - word: "la farmàcia"
    definition: "Botiga on es venen medicaments."
    example: "La farmàcia és al carrer Major."
  - word: "el banc"
    definition: "Establiment on guardes els diners i demanes préstecs."
    example: "Hi ha dos bancs a la plaça."
  - word: "l'estació"
    definition: "Lloc on surten i arriben els trens."
    example: "L'estació és a tocar de la plaça."
  - word: "la parada"
    definition: "Lloc on s'atura el bus o el metro."
    example: "La parada del metro és al final del carrer."
  - word: "el semàfor"
    definition: "Llum que diu si pots passar o t'has d'aturar."
    example: "Vas a mà dreta al semàfor."
  - word: "la cantonada"
    definition: "Angle on es troben dos carrers."
    example: "Hi ha una farmàcia a la cantonada."
  - word: "el parc"
    definition: "Espai verd amb arbres on passeja la gent."
    example: "L'any que ve hi haurà un parc nou."
  - word: "el museu"
    definition: "Edifici on es veuen obres d'art o objectes antics."
    example: "El museu és a tocar de l'estació."
  - word: "el mercat"
    definition: "Edifici o plaça on es venen fruita, verdura i peix."
    example: "Al meu barri hi ha tres escoles i un mercat."
  - word: "la biblioteca"
    definition: "Lloc on pots llegir llibres i endur-te'ls a casa."
    example: "La biblioteca és a tocar."
  - word: "el cinema"
    definition: "Sala fosca on es projecten pel·lícules."
    example: "Abans hi havia un cinema a la plaça."
  - word: "l'hospital"
    definition: "Edifici gran on els metges curen els malalts."
    example: "La Montse és a l'hospital."
  - word: "el quiosc"
    definition: "Botiga petita del carrer on es venen diaris."
    example: "Ara hi ha un quiosc davant de l'escola."
  - word: "la rotonda"
    definition: "Plaça rodona on els cotxes giren per canviar de carrer."
    example: "Hi ha tres rotondes noves a l'avinguda."
  - word: "la fleca"
    definition: "Botiga on fan i venen pa cada matí."
    example: "Abans hi havia una fleca en aquest carrer."
  - word: "la llibreria"
    definition: "Botiga on es venen llibres."
    example: "Al centre hi ha moltes llibreries antigues."
  - word: "el bar"
    definition: "Local on es prenen cafès i begudes."
    example: "Al meu carrer hi ha tres bars nous."
  - word: "els lavabos"
    definition: "Habitació amb vàters en un lloc públic."
    example: "Els lavabos són al final del passadís."
  - word: "l'oficina"
    definition: "Lloc on treballa gent amb ordinadors i papers."
    example: "L'oficina és a deu minuts de casa."
  - word: "el metro"
    definition: "Tren que va per sota de la ciutat."
    example: "La parada del metro és a prop."
  - word: "el bus"
    definition: "Cotxe gran que porta passatgers per la ciutat."
    example: "L'estació és lluny: has d'agafar el bus."
  - word: "a peu"
    definition: "Caminant, sense cap vehicle."
    example: "Cada matí vaig a peu a la feina."
  - word: "a prop"
    definition: "A poca distància."
    example: "Hi ha una farmàcia a prop."
  - word: "lluny"
    definition: "A molta distància."
    example: "L'estació és lluny del centre."
  - word: "al final"
    definition: "A l'última part d'un lloc o d'un camí."
    example: "Els lavabos són al final del carrer."
  - word: "l'esquerra"
    definition: "El costat del cor, contrari de la dreta."
    example: "Vas a l'esquerra al semàfor."
  - word: "girar"
    definition: "Canviar de direcció en un camí."
    example: "Va tot recte i gira a mà dreta."
  - word: "seguir"
    definition: "Continuar pel mateix camí."
    example: "Seguiu tot recte i trobareu l'estació."
  - word: "la fruiteria"
    definition: "Botiga on es venen fruita i verdura."
    example: "Al carrer hi ha dues fruiteries."
  - word: "el passadís"
    definition: "Corredor llarg dins d'un edifici."
    example: "Els lavabos són al final del passadís."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-06-001
    type: choice
    point: ser-estar-adjectius
    lesson: 1
    prompt: "—Com estàs? —___ molt cansat, avui."
    answer: "Estic"
    distractors:
      - text: "Tinc"
        why: "*Tenir* no va amb *cansat*: diem *estic cansat* o *soc cansat*."
      - text: "Està"
        why: "Parles de tu: la forma és *estic*, no *està*."
    explanation: "Parles de tu mateix: *estic cansat*. *Soc cansat* també és correcte."

  - id: a2-06-002
    type: choice
    point: ser-estar-adjectius
    lesson: 1
    prompt: "La Laia ___ molt contenta de la nota."
    answer: "està"
    distractors:
      - text: "estan"
        why: "«La Laia» és una sola persona: *està*, no *estan*."
      - text: "té"
        why: "Amb *content* no fem servir *tenir*: *està contenta*."
    explanation: "«La Laia» és singular: *està contenta*. *És contenta* també és correcte."

  - id: a2-06-003
    type: choice
    point: ser-estar-adjectius
    lesson: 1
    prompt: "L'Ibrahim ___ trist: el seu equip ha perdut."
    answer: "està"
    distractors:
      - text: "són"
        why: "«L'Ibrahim» és una sola persona: *està*, no *són*."
      - text: "té"
        why: "Amb *trist* no fem servir *tenir*: *està trist*."
    explanation: "«L'Ibrahim» és singular: *està trist*. *És trist* també és correcte."

  - id: a2-06-004
    type: choice
    point: ser-estar-adjectius
    lesson: 1
    prompt: "La Núria i la Carla ___ preocupades per l'examen."
    answer: "estan"
    distractors:
      - text: "està"
        why: "«La Núria i la Carla» són dues persones: *estan*."
      - text: "tenen"
        why: "Amb *preocupat* no fem servir *tenir*: *estan preocupades*."
    explanation: "«La Núria i la Carla» és plural: *estan preocupades*. *Són preocupades* també és correcte."

  - id: a2-06-005
    type: choice
    point: ser-localitzacio
    lesson: 1
    prompt: "—On és en Pau? —___ a la feina."
    answer: "És"
    distractors:
      - text: "Són"
        why: "«En Pau» és una sola persona: *és*, no *són*."
      - text: "Hi ha"
        why: "*Hi ha* presenta una cosa nova: per dir on és algú fem servir *ser*."
    explanation: "La localització es fa amb *ser*: «en Pau» és singular, *és a la feina*."

  - id: a2-06-006
    type: choice
    point: ser-localitzacio
    lesson: 1
    prompt: "Les claus ___ a l'entrada, al calaix."
    answer: "són"
    distractors:
      - text: "és"
        why: "«Les claus» és plural: *són*, no *és*."
      - text: "hi ha"
        why: "*Hi ha* no diu on és una cosa concreta: *són a l'entrada*."
    explanation: "«Les claus» és plural: *són a l'entrada*."

  - id: a2-06-007
    type: choice
    point: ser-localitzacio
    lesson: 1
    prompt: "La farmàcia ___ al carrer Major, a tocar de la plaça."
    answer: "és"
    distractors:
      - text: "són"
        why: "«La farmàcia» és singular: *és*, no *són*."
      - text: "hi ha"
        why: "*Hi ha* presenta una cosa nova: per dir on és un lloc fem servir *ser*."
    explanation: "Per dir on és un lloc concret fem servir *ser*: *és al carrer Major*."

  - id: a2-06-008
    type: choice
    point: ser-localitzacio
    lesson: 1
    prompt: "—On ___ els teus pares? —Són a Girona."
    answer: "són"
    distractors:
      - text: "és"
        why: "«Els teus pares» és plural: *són*, no *és*."
      - text: "hi ha"
        why: "Per preguntar on és algú concret diem *on són*."
    explanation: "«Els teus pares» és plural: *on són*. La localització es fa amb *ser*."

  - id: a2-06-009
    type: choice
    point: ser-localitzacio
    lesson: 1
    prompt: "La Marta ___ casa."
    answer: "és a"
    distractors:
      - text: "és en"
        why: "Diem *a casa*: fer servir *en* és un calc de «en casa»."
      - text: "són a"
        why: "«La Marta» és singular: *és a casa*."
    explanation: "«La Marta» és singular i amb *casa* fem servir *a*: *és a casa*."

  - id: a2-06-010
    type: match
    point: ser-estar-adjectius
    lesson: 1
    instruction: "Relaciona cada masculí amb el seu femení."
    pairs:
      - ["cansat", "cansada"]
      - ["content", "contenta"]
      - ["trist", "trista"]
      - ["malalt", "malalta"]
      - ["nerviós", "nerviosa"]
    explanation: "Els adjectius concorden amb la persona: *cansat/cansada*, *nerviós/nerviosa*."

  - id: a2-06-011
    type: match
    point: ser-localitzacio
    lesson: 1
    instruction: "Relaciona cada pregunta amb la seva resposta."
    pairs:
      - ["On és la farmàcia?", "És al carrer Major."]
      - ["On són els lavabos?", "Són al final del passadís."]
      - ["On sou, vosaltres?", "Som a l'estació."]
      - ["On ets, ara?", "Soc a la feina."]
    explanation: "Per dir on és algú o alguna cosa fem servir *ser*, i el verb concorda: *és, són, som, soc*."

  - id: a2-06-012
    type: inline-choice
    point: ser-localitzacio
    lesson: 1
    title: "On és tot?"
    text: "—Perdoni, {on|què} és el museu? —{És|Són|Hi ha} a tocar de l'estació. —I els lavabos? —{Són|És|Hi ha} al final del carrer. —I la parada del bus? —{És|Són|Hi ha} davant per davant del parc."
    explanation: "Per preguntar on és un lloc concret: *on és*. Les respostes fan servir *ser*: *és a tocar*, *són al final*."

  - id: a2-06-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Vas ___ pel carrer Major i trobaràs la farmàcia."
    answer: "tot recte"
    distractors:
      - text: "a tocar"
        why: "*A tocar* vol dir molt a prop, no en línia recta."
      - text: "davant per davant"
        why: "*Davant per davant* vol dir just al davant, no en línia recta."
    explanation: "*Tot recte* vol dir sense girar: segueixes el carrer fins a la farmàcia."

  # ---------- Lliçó 2 ----------
  - id: a2-06-014
    type: fill
    point: ser-estar-adjectius
    lesson: 2
    prompt: "Avui ___ molt cansat: he treballat deu hores."
    hint: "*ser* o *estar*, jo"
    answers: ["estic", "soc"]
    wrong_answers:
      - text: "tinc"
        why: "Amb *cansat* no fem servir *tenir*: *estic cansat* o *soc cansat*."
    grading: tolerant
    explanation: "Amb *cansat* pots dir *estic* o *soc*: les dues formes són correctes."

  - id: a2-06-015
    type: fill
    point: ser-estar-adjectius
    lesson: 2
    prompt: "La Fàtima ___ molt contenta amb el pis nou."
    hint: "*ser* o *estar*, ella"
    answers: ["està", "és"]
    wrong_answers:
      - text: "té"
        why: "Amb *content* no fem servir *tenir*: *està contenta* o *és contenta*."
    grading: tolerant
    explanation: "Amb *content* pots dir *està* o *és*: les dues formes són correctes."

  - id: a2-06-016
    type: fill
    point: ser-estar-adjectius
    lesson: 2
    prompt: "En Wei i l'Ibrahim ___ nerviosos per l'entrevista."
    hint: "*estar*, ells"
    answers: ["estan"]
    wrong_answers:
      - text: "està"
        why: "«En Wei i l'Ibrahim» són dues persones: *estan*."
      - text: "tenen"
        why: "Amb *nerviós* no fem servir *tenir*."
    grading: tolerant
    explanation: "«En Wei i l'Ibrahim» és plural: *estan nerviosos*. *Són nerviosos* també és correcte."

  - id: a2-06-017
    type: fill
    point: ser-localitzacio
    lesson: 2
    prompt: "—On és la Montse? —___ a l'hospital, amb el seu pare."
    hint: "*ser*, ella"
    answers: ["És"]
    wrong_answers:
      - text: "Són"
        why: "«La Montse» és singular: *és*."
      - text: "Hi ha"
        why: "*Hi ha* no diu on és una persona: *és a l'hospital*."
    grading: tolerant
    explanation: "La localització es fa amb *ser*: «la Montse» és singular, *és a l'hospital*."

  - id: a2-06-018
    type: fill
    point: ser-localitzacio
    lesson: 2
    prompt: "Els meus llibres ___ a l'habitació, sobre la taula."
    hint: "*ser*, ells"
    answers: ["són"]
    wrong_answers:
      - text: "és"
        why: "«Els meus llibres» és plural: *són*."
      - text: "hi ha"
        why: "*Hi ha* no diu on és una cosa concreta: *són a l'habitació*."
    grading: tolerant
    explanation: "«Els meus llibres» és plural: *són a l'habitació*."

  - id: a2-06-019
    type: order
    point: ser-estar-adjectius
    lesson: 2
    cue: "Digues que estàs una mica trist perquè plou."
    chunks: ["estic", "una mica", "trist", "perquè plou"]
    extra: ["tinc"]
    answers:
      - "Estic una mica trist perquè plou."
    explanation: "Amb *trist* fem servir *ser* o *estar*: *estic trist*. *Tinc trist* no és correcte."

  - id: a2-06-020
    type: order
    point: ser-localitzacio
    lesson: 2
    cue: "Explica que les teves claus són a l'entrada de casa."
    chunks: ["les claus", "són", "a l'entrada", "de casa"]
    extra: ["és"]
    answers:
      - "Les claus són a l'entrada de casa."
      - "Les claus de casa són a l'entrada."
    explanation: "«Les claus» és plural: *són a l'entrada*. *És* és singular."

  - id: a2-06-021
    type: order
    point: ser-localitzacio
    lesson: 2
    cue: "Pregunta on és la parada del metro."
    chunks: ["on", "és", "la parada", "del metro"]
    extra: ["són"]
    answers:
      - "On és la parada del metro?"
    explanation: "«La parada» és singular: *on és la parada*. La localització es fa amb *ser*."

  - id: a2-06-022
    type: choice
    point: ser-estar-adjectius
    lesson: 2
    prompt: "—Com esteu? —___ una mica nerviosos, gràcies."
    answer: "Estem"
    distractors:
      - text: "Tenim"
        why: "Amb *nerviós* no fem servir *tenir*."
      - text: "Esteu"
        why: "Parles de tu i d'algú més: *estem*, no *esteu*."
    explanation: "Parles de tu i d'algú més: *estem nerviosos*. *Som nerviosos* també és correcte."

  - id: a2-06-023
    type: choice
    point: ser-localitzacio
    lesson: 2
    prompt: "L'estació ___ lluny del centre: has d'agafar el bus."
    answer: "és"
    distractors:
      - text: "són"
        why: "«L'estació» és singular: *és*."
      - text: "hi ha"
        why: "*Hi ha* no diu on és un lloc concret: *és lluny*."
    explanation: "«L'estació» és singular: *és lluny del centre*."

  - id: a2-06-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "—La farmàcia és lluny? —No, és ___."
    answer: "a tocar"
    distractors:
      - text: "tot recte"
        why: "*Tot recte* diu com hi vas, no si és a prop."
      - text: "davant per davant"
        why: "*Davant per davant* vol dir just al davant d'un lloc concret."
    explanation: "*A tocar* vol dir molt a prop: la farmàcia és a tocar."

  - id: a2-06-025
    type: inline-choice
    point: ser-localitzacio
    lesson: 2
    title: "Un missatge de la Carla"
    text: "Hola! Jo {soc|és} a casa de la meva germana. La festa {és|són} a Girona: els meus pares {són|és} allà tot el cap de setmana. I tu, {ets|són} a Barcelona? Fins aviat!"
    explanation: "La localització es fa amb *ser*, i el verb concorda: *jo soc*, *la festa és*, *els pares són*, *tu ets*."

  - id: a2-06-026
    type: fill
    point: ser-localitzacio
    lesson: 2
    prompt: "L'Anna no ___ a casa: és a la feina."
    hint: "*ser*, ella"
    answers: ["és"]
    wrong_answers:
      - text: "són"
        why: "«L'Anna» és singular: *és*."
      - text: "hi ha"
        why: "La frase diu on no és una persona: *no és a casa*."
    grading: tolerant
    explanation: "«L'Anna» és singular: *no és a casa*."

  # ---------- Lliçó 3 ----------
  - id: a2-06-027
    type: choice
    point: haver-hi
    lesson: 3
    prompt: "Al meu barri ___ tres escoles i un mercat."
    answer: "hi ha"
    distractors:
      - text: "és"
        why: "Per dir que una cosa existeix fem servir *haver-hi*: *hi ha*."
      - text: "són"
        why: "*Ser* diu on és una cosa concreta, no que existeix: *hi ha tres escoles*."
    explanation: "Per dir que una cosa existeix en un lloc fem servir *hi ha*: *hi ha tres escoles*."

  - id: a2-06-028
    type: choice
    point: haver-hi
    lesson: 3
    prompt: "Abans ___ una fleca en aquest carrer, però ha tancat."
    answer: "hi havia"
    distractors:
      - text: "hi ha"
        why: "«Abans» parla del passat: *hi havia*."
      - text: "hi haurà"
        why: "*Hi haurà* és futur: «abans» demana el passat, *hi havia*."
    explanation: "«Abans» situa la frase en el passat: *hi havia una fleca*."

  - id: a2-06-029
    type: choice
    point: haver-hi
    lesson: 3
    prompt: "L'any que ve ___ un parc nou a tocar de l'escola."
    answer: "hi haurà"
    distractors:
      - text: "hi ha"
        why: "«L'any que ve» parla del futur: *hi haurà*."
      - text: "hi havia"
        why: "*Hi havia* és passat: «l'any que ve» demana el futur."
    explanation: "«L'any que ve» situa la frase en el futur: *hi haurà un parc nou*."

  - id: a2-06-030
    type: choice
    point: ser-hi
    lesson: 3
    prompt: "—La Marta hi és? —No, ___."
    answer: "no hi és"
    distractors:
      - text: "no és"
        why: "Per dir que algú no és en un lloc, *ser* porta *hi*: *no hi és*."
      - text: "no hi ha"
        why: "*Hi ha* no respon a *hi és?*: parlem d'una persona concreta."
    explanation: "La resposta a *hi és?* porta *hi*: *no, no hi és*."

  - id: a2-06-031
    type: fill
    point: haver-hi
    lesson: 3
    prompt: "En aquest carrer ___ moltes botigues de roba."
    hint: "*haver-hi*, present"
    answers: ["hi ha", "hi han"]
    wrong_answers:
      - text: "han"
        why: "*Haver-hi* porta sempre el pronom *hi*: *hi ha*."
      - text: "són"
        why: "Per dir que una cosa existeix fem servir *haver-hi*: *hi ha*."
    grading: tolerant
    explanation: "Per dir que una cosa existeix: *hi ha moltes botigues*. *Hi* no es pot ometre. En registre informal també es diu *hi han*."

  - id: a2-06-032
    type: fill
    point: haver-hi
    lesson: 3
    prompt: "Quan era petit, ___ un cinema a la plaça."
    hint: "*haver-hi*, passat"
    answers: ["hi havia"]
    wrong_answers:
      - text: "hi ha"
        why: "«Quan era petit» parla del passat: *hi havia*."
      - text: "hi haurà"
        why: "*Hi haurà* és futur: aquí cal el passat, *hi havia*."
    grading: tolerant
    explanation: "«Quan era petit» situa la frase en el passat: *hi havia un cinema*."

  - id: a2-06-033
    type: fill
    point: ser-hi
    lesson: 3
    prompt: "Truco a l'oficina, però en Marc no ___: deu estar dinant."
    hint: "*ser-hi*, ell"
    answers: ["hi és"]
    wrong_answers:
      - text: "és"
        why: "*Ser-hi* porta el pronom *hi*: *no hi és*."
      - text: "hi ha"
