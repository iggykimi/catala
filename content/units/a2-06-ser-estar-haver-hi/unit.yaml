  # ---------- Lliçó 5 ----------
  - id: a2-06-053
    type: reading
    point: haver-hi
    lesson: 5
    title: "El barri de la Fàtima"
    text: |
      La Fàtima viu al barri de Gràcia des de fa tres anys. El seu pis és a tocar de la plaça, davant per davant d'una fleca molt antiga. Al carrer hi ha moltes botigues petites: una llibreria, dues fruiteries i un bar on sempre hi ha gent del barri.

      Cada matí, la Fàtima va a peu a la feina. Va tot recte pel carrer Major i gira a mà dreta al semàfor. L'oficina és a deu minuts de casa seva.

      «M'agrada Gràcia perquè hi ha de tot», diu. «Abans hi havia menys botigues, però el barri està molt viu.»
    questions:
      - prompt: "On és el pis de la Fàtima?"
        answer: "A tocar de la plaça, davant d'una fleca."
        distractors:
          - text: "Al carrer Major, a deu minuts de l'oficina."
            why: "El carrer Major és el camí a la feina. El pis és a tocar de la plaça."
          - text: "Davant del bar, al costat de la llibreria."
            why: "El bar i la llibreria són al carrer, però el pis és davant de la fleca."
      - prompt: "Com va la Fàtima a la feina?"
        answer: "A peu, tot recte i després a mà dreta."
        distractors:
          - text: "Amb bus, fins al semàfor."
            why: "El text diu que hi va a peu."
          - text: "A peu, tot recte i després a l'esquerra."
            why: "Al semàfor gira a mà dreta, no a l'esquerra."
      - prompt: "Què hi ha al carrer de la Fàtima?"
        answer: "Botigues de llibres i de fruita, i un bar."
        distractors:
          - text: "Una fleca antiga i res més."
            why: "També hi ha una llibreria, fruiteries i un bar."
          - text: "Un bar on no va mai ningú."
            why: "Al bar sempre hi ha gent del barri."
      - prompt: "Què diu la Fàtima del barri?"
        answer: "Que hi ha de tot i que li agrada."
        distractors:
          - text: "Que abans hi havia més botigues."
            why: "Diu que abans hi havia menys botigues."
          - text: "Que la feina és lluny de casa."
            why: "L'oficina és a deu minuts de casa seva."
    explanation: "El text presenta el barri de la Fàtima: el pis, les botigues del carrer i el camí a la feina."

