  # ---------- Lliçó 5 ----------
  - id: b2-44-054
    type: reading
    point: comprensio
    lesson: 5
    title: "El ple de setembre"
    text: |
      El ple de setembre va començar amb una hora de retard. L'alcaldessa va explicar que el retard era perquè un grup havia demanat una reunió d'urgència i que la sessió acabaria més tard del previst. Després va donar la paraula al portaveu del govern, que va anunciar que el pressupost de l'any següent ja estava tancat i que el portaria a votació al ple següent.

      La portaveu de l'oposició va prendre la paraula a continuació. Va dir que el seu grup no havia vist els números, va preguntar quan es publicaria l'informe complet i va demanar que el debat quedés sobre la taula fins al mes següent. També va posar sobre la taula el problema del soroll al barri vell: va explicar que els veïns es queixaven cada cap de setmana i va demanar que l'ajuntament hi intervingués.

      En el torn de paraula dels grups petits, un regidor va preguntar si el govern pensava apujar les taxes. L'alcaldessa va respondre que no hi hauria cap pujada i que el seu equip buscava el consens amb tots els grups. Un altre regidor va proposar que es votés una moció de rebuig, però la majoria hi va votar en contra i la moció no va prosperar.

      Al final, el ple va votar l'ordre del dia. Es van aprovar dues mocions per unanimitat, una es va rebutjar i tres regidors es van abstenir en la votació de l'esmena de la residència. La sessió es va acabar a les onze de la nit. L'acta es publicarà al web municipal al cap d'una setmana.
    questions:
      - prompt: "Per què va començar tard el ple?"
        answer: "Perquè un grup va voler reunir-se amb urgència abans de la sessió."
        distractors:
          - text: "Perquè l'alcaldessa va arribar tard a la sala."
            why: "El text no diu que l'alcaldessa arribés tard: el retard era per una reunió d'urgència."
          - text: "Perquè faltaven regidors per començar la votació."
            why: "El text no parla de regidors absents: el retard era per una reunió d'urgència."
      - prompt: "Què va demanar la portaveu de l'oposició?"
        answer: "Que el debat s'ajornés fins al mes següent."
        distractors:
          - text: "Que es votés la moció de rebuig aquella nit."
            why: "Això ho va proposar un altre regidor, no la portaveu de l'oposició."
          - text: "Que el govern apugés les taxes del barri vell."
            why: "La portaveu va parlar del soroll, no de les taxes: de les taxes en va preguntar un regidor."
      - prompt: "Què va dir l'alcaldessa de les taxes?"
        answer: "Que les taxes no pujarien."
        distractors:
          - text: "Que les taxes pujarien al gener."
            why: "L'alcaldessa va dir que no hi hauria cap pujada."
          - text: "Que el govern encara no ho havia decidit."
            why: "L'alcaldessa va ser clara: no hi hauria cap pujada."
      - prompt: "Com va acabar la votació de l'ordre del dia?"
        answer: "Amb dues mocions aprovades, una rebutjada i tres abstencions."
        distractors:
          - text: "Amb totes les mocions aprovades per unanimitat."
            why: "Només dues es van aprovar per unanimitat: una es va rebutjar i hi va haver tres abstencions."
          - text: "Amb la moció de rebuig aprovada per la majoria."
            why: "La majoria hi va votar en contra: la moció de rebuig no va prosperar."
    explanation: "El text explica com va anar el ple de setembre: el retard inicial, les intervencions de cada grup i el resultat de les votacions."

