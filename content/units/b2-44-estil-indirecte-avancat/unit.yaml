id: b2-44
level: B2
title: "Estil indirecte avançat"
summary: "Les ordres, les preguntes i els temps en estil indirecte, amb els canvis de pronoms i possessius, en el context de la política i les institucions."
vocabulary_theme: "Política i institucions"
points:
  - id: ordres-indirectes
    title: "Les ordres en estil indirecte"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: preguntes-indirectes
    title: "Les preguntes en estil indirecte"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: temps-compostos
    title: "Els temps en estil indirecte"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: pronoms-possessius
    title: "Pronoms, possessius i altres canvis"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: compte-concordanca
    title: "Compte amb el castellà: la concordança de temps"
    refs:
      - label: "Optimot: L'estil indirecte"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions de la política i les institucions"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Les ordres i les preguntes en estil indirecte"
  - title: "Practicar ordres i preguntes"
  - title: "Temps, pronoms i concordança"
  - title: "Reescriure en estil indirecte"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'ajuntament"
    definition: "Institució que governa un municipi."
    example: "L'ajuntament organitza un ple obert cada tres mesos."
  - word: "el ple"
    definition: "Reunió de tots els regidors per debatre i votar."
    example: "El ple va durar fins a mitjanit."
  - word: "la sala de plens"
    definition: "Sala on es reuneix el ple municipal."
    example: "La sala de plens era plena de veïns."
  - word: "l'ordre del dia"
    definition: "Llista de temes que es tractaran en una reunió."
    example: "L'ordre del dia té deu punts."
  - word: "l'acta"
    definition: "Document que recull el que s'ha dit i acordat en una reunió."
    example: "La secretària redacta l'acta de cada sessió."
  - word: "la moció"
    definition: "Proposta que es presenta al ple perquè es voti."
    example: "Van aprovar la moció amb els vots de tots els grups."
  - word: "l'esmena"
    definition: "Canvi que es proposa en un text o en una proposta."
    example: "El grup va presentar una esmena al pressupost."
  - word: "la votació"
    definition: "Acte de votar per prendre una decisió."
    example: "La votació es va fer a mà alçada."
  - word: "l'escrutini"
    definition: "Recompte dels vots d'una votació."
    example: "L'escrutini va durar una hora."
  - word: "l'urna"
    definition: "Caixa on es dipositen els vots."
    example: "Les urnes es tanquen a les vuit del vespre."
  - word: "el pressupost"
    definition: "Càlcul dels diners que es poden gastar en un període."
    example: "El pressupost d'enguany puja a dos milions."
  - word: "el decret"
    definition: "Decisió escrita d'una autoritat, que cal complir."
    example: "L'alcalde va signar el decret dilluns."
  - word: "el regidor, la regidora"
    definition: "Persona elegida que forma part del ple."
    example: "La regidora de cultura va obrir el debat."
  - word: "l'alcalde, l'alcaldessa"
    definition: "Persona que presideix l'ajuntament."
    example: "L'alcaldessa va rebre els veïns al despatx."
  - word: "el president, la presidenta"
    definition: "Persona que dirigeix una reunió o una institució."
    example: "El president va donar pas a les preguntes."
  - word: "el portaveu, la portaveu"
    definition: "Persona que parla en nom d'un grup."
    example: "El portaveu va anunciar el vot favorable."
  - word: "el síndic, la síndica"
    definition: "Persona que defensa els drets dels ciutadans davant l'administració."
    example: "El síndic va recomanar més transparència."
  - word: "el grup municipal"
    definition: "Conjunt de regidors que actuen junts al ple."
    example: "El grup municipal va votar en contra."
  - word: "l'oposició"
    definition: "Grup o grups que no governen i controlen el govern."
    example: "L'oposició va criticar el retard de les obres."
  - word: "la majoria"
    definition: "Més de la meitat dels vots o dels membres."
    example: "La proposta va tenir la majoria dels vots."
  - word: "la unanimitat"
    definition: "Acord de tots els qui voten."
    example: "La moció es va aprovar per unanimitat."
  - word: "el consens"
    definition: "Acord general després de negociar."
    example: "Van arribar al consens a altes hores de la nit."
  - word: "el debat"
    definition: "Discussió ordenada sobre un tema."
    example: "El debat sobre les taxes va ser molt llarg."
  - word: "el torn de paraula"
    definition: "Moment en què algú pot parlar en una reunió."
    example: "Cada grup té un torn de paraula de cinc minuts."
  - word: "la seu"
    definition: "Edifici principal d'una institució."
    example: "La seu nova és al costat de l'estació."
  - word: "aprovar"
    definition: "Acceptar una proposta amb una votació."
    example: "El ple va aprovar el pressupost."
  - word: "rebutjar"
    definition: "No acceptar una proposta."
    example: "Van rebutjar l'esmena per majoria."
  - word: "abstenir-se"
    definition: "No votar ni a favor ni en contra."
    example: "Tres regidors es van abstenir en la votació final."
  - word: "intervenir"
    definition: "Prendre part en un debat o en un assumpte."
    example: "El síndic va intervenir en la discussió."
  - word: "a mà alçada"
    definition: "Amb la mà aixecada, manera de votar en una reunió."
    example: "Van votar a mà alçada."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-44-001
    type: choice
    point: ordres-indirectes
    lesson: 1
    prompt: "«Puja a l'escenari.» La regidora em va dir que ___ a l'escenari."
    answer: "pugés"
    distractors:
      - text: "pugi"
        why: "*Pugi* és present de subjuntiu. Amb «va dir», en passat, cal l'imperfet: *pugés*."
      - text: "puja"
        why: "L'imperatiu (*puja*) no es manté darrere de *que*: cal el subjuntiu (*pugés*)."
    explanation: "«Puja» és una ordre i «va dir» és passat: darrere de *que* cal l'imperfet de subjuntiu (*pugés*)."

  - id: b2-44-002
    type: choice
    point: ordres-indirectes
    lesson: 1
    prompt: "«No parleu durant la votació.» Ens van demanar que ___ durant la votació."
    answer: "no parléssim"
    distractors:
      - text: "no parlem"
        why: "*Parlem* és present. Amb «van demanar», en passat, cal l'imperfet: *parléssim*."
      - text: "no parleu"
        why: "L'imperatiu (*parleu*) no es manté darrere de *que*: cal el subjuntiu."
    explanation: "«Parleu» és una ordre adreçada a «nosaltres» (*ens*): darrere de *que* cal l'imperfet de subjuntiu (*no parléssim*)."

  - id: b2-44-003
    type: choice
    point: ordres-indirectes
    lesson: 1
    prompt: "La cap ens diu: «Truqueu al conserge.» Ens diu que ___ al conserge ara mateix."
    answer: "truquem"
    distractors:
      - text: "truquéssim"
        why: "*Truquéssim* és imperfet de subjuntiu. Amb «diu», en present, el subjuntiu també va en present: *truquem*."
      - text: "truqueu"
        why: "L'imperatiu (*truqueu*) no es manté darrere de *que*: cal el subjuntiu."
    explanation: "«Diu» és present: l'ordre passa a *que* + present de subjuntiu. L'ordre és per a «nosaltres» (*ens*): *truquem*."

  - id: b2-44-004
    type: choice
    point: preguntes-indirectes
    lesson: 1
    prompt: "«Vens al ple?» Em pregunta ___."
    answer: "si hi vaig"
    distractors:
      - text: "què hi vaig"
        why: "«Vens al ple?» es respon amb sí o no: és total i porta *si*, no *què*."
      - text: "si hi aniré"
        why: "«Vens» és present i «pregunta» també: el temps no canvia. *Aniré* és futur."
    explanation: "«Vens al ple?» és una pregunta total: en estil indirecte porta *si*. «Pregunta» és present i «vens» també: el temps no canvia (*hi vaig*)."

  - id: b2-44-005
    type: choice
    point: preguntes-indirectes
    lesson: 1
    prompt: "«On és la sala de plens?» Va preguntar ___."
    answer: "on era la sala de plens"
    distractors:
      - text: "on és la sala de plens"
        why: "Amb «va preguntar», en passat, el present *és* passa a imperfet: *era*."
      - text: "si era la sala de plens"
        why: "«On és…?» és parcial: manté *on* i no porta *si*."
    explanation: "«On és…?» és una pregunta parcial: manté l'interrogatiu (*on*), sense *si*. Amb «va preguntar», en passat, *és* passa a *era*."

  - id: b2-44-006
    type: choice
    point: preguntes-indirectes
    lesson: 1
    prompt: "«Quants regidors hi ha?» Va voler saber ___."
    answer: "quants regidors hi havia"
    distractors:
      - text: "quants regidors hi ha"
        why: "Amb «va voler saber», en passat, *hi ha* passa a *hi havia*."
      - text: "si quants regidors hi havia"
        why: "Les preguntes parcials no porten *si*: mantenen l'interrogatiu (*quants*)."
    explanation: "«Quants…?» és una pregunta parcial: manté l'interrogatiu, sense *si*. Amb el verb principal en passat, *hi ha* passa a *hi havia*."

  - id: b2-44-007
    type: match
    point: ordres-indirectes
    lesson: 1
    instruction: "Relaciona cada ordre amb la frase en estil indirecte."
    pairs:
      - ["«Calla un moment.» (em va dir)", "Em va dir que callés un moment."]
      - ["«Obriu la porta.» (ens va dir)", "Ens va dir que obríssim la porta."]
      - ["«Seu.» (em va dir)", "Em va dir que segués."]
      - ["«Vota en blanc.» (em va dir)", "Em va dir que votés en blanc."]
    explanation: "Amb el verb principal en passat, cada ordre passa a *que* + imperfet de subjuntiu: *callés*, *obríssim*, *segués*, *votés*."

  - id: b2-44-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["donar la paraula", "concedir a algú el torn d'intervenir"]
      - ["prendre la paraula", "començar a parlar en un debat"]
      - ["posar sobre la taula", "plantejar un tema perquè es discuteixi"]
      - ["quedar sobre la taula", "deixar un tema pendent per a un altre dia"]
      - ["fer-se ressò", "recollir i difondre una notícia"]
    explanation: "Són expressions habituals en la vida institucional: concedir i prendre la paraula, plantejar o ajornar un tema i difondre una notícia."

  - id: b2-44-009
    type: inline-choice
    point: ordres-indirectes
    lesson: 1
    title: "Un encàrrec de l'alcalde"
    text: "L'alcalde em va dir que {passés|passi|passa} pel despatx, que {signés|signi|signa} l'acta i que no {arribés|arribi|arriba} tard. Després em va preguntar {si|què|que} necessitava ajuda."
    explanation: "Amb el verb principal en passat, les ordres porten l'imperfet de subjuntiu (*passés*, *signés*, *arribés*), i les preguntes totals porten *si*."

  - id: b2-44-010
    type: fill
    point: ordres-indirectes
    lesson: 1
    prompt: "«Signa l'acta.» Em va dir que ___ l'acta."
    hint: "signar, imperfet de subjuntiu"
    answers: ["signés"]
    wrong_answers:
      - text: "signi"
        why: "*Signi* és present de subjuntiu. Amb «va dir», en passat, cal l'imperfet: *signés*."
    grading: tolerant
    explanation: "«Signa» és una ordre i «va dir» és passat: cal l'imperfet de subjuntiu (*signés*)."

  - id: b2-44-011
    type: fill
    point: preguntes-indirectes
    lesson: 1
    prompt: "«A quina hora comença el ple?» Va preguntar ___ començava el ple."
    hint: "l'interrogatiu de la pregunta directa"
    answers: ["a quina hora"]
    wrong_answers:
      - text: "si a quina hora"
        why: "Les preguntes parcials no porten *si*: l'interrogatiu va sol."
    grading: tolerant
    explanation: "«A quina hora…?» és una pregunta parcial: manté l'interrogatiu (*a quina hora*), sense *si*."

  - id: b2-44-012
    type: order
    point: ordres-indirectes
    lesson: 1
    cue: "La presidenta demana als regidors que seguin. Explica-ho en passat."
    chunks: ["Els", "va", "demanar", "que", "seguessin"]
    extra: ["seguiu"]
    answers:
      - "Els va demanar que seguessin."
    explanation: "L'ordre «seieu» era per als regidors: *els va demanar que seguessin*, amb l'imperfet de subjuntiu."

  - id: b2-44-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «donar la paraula a algú»?"
    answer: "Concedir-li el torn d'intervenir en un debat."
    distractors:
      - text: "Interrompre'l perquè calli."
        why: "Això és el contrari: *donar la paraula* és deixar parlar, no fer callar."
      - text: "Explicar-li un tema en confiança."
        why: "*Donar la paraula* es fa servir en debats i reunions, no en converses privades."
    explanation: "*Donar la paraula* vol dir concedir a algú el torn d'intervenir en un debat."

  # ---------- Lliçó 2 ----------
  - id: b2-44-014
    type: fill
    point: ordres-indirectes
    lesson: 2
    prompt: "«Truca al conserge.» Em va dir que ___ al conserge."
    hint: "trucar, imperfet de subjuntiu"
    answers: ["truqués"]
    wrong_answers:
      - text: "truqui"
        why: "*Truqui* és present de subjuntiu. Amb «va dir», en passat, cal l'imperfet: *truqués*."
    grading: tolerant
    explanation: "«Truca» és una ordre i «va dir» és passat: cal l'imperfet de subjuntiu (*truqués*)."

  - id: b2-44-015
    type: fill
    point: ordres-indirectes
    lesson: 2
    prompt: "«No obriu les urnes fins a les vuit.» Ens van ordenar que ___ les urnes fins a les vuit."
    hint: "obrir, imperfet de subjuntiu, primera persona del plural"
    answers: ["no obríssim"]
    wrong_answers:
      - text: "no obrim"
        why: "*Obrim* és present. Amb «van ordenar», en passat, cal l'imperfet: *obríssim*."
    grading: tolerant
    explanation: "L'ordre «obreu» és per a «nosaltres» (*ens*) i «van ordenar» és passat: cal *no obríssim*."

  - id: b2-44-016
    type: fill
    point: preguntes-indirectes
    lesson: 2
    prompt: "«Qui presideix la comissió?» Van preguntar ___ la comissió."
    hint: "l'interrogatiu «qui» + presidir, imperfet"
    answers: ["qui presidia"]
    wrong_answers:
      - text: "qui presideix"
        why: "Amb «van preguntar», en passat, el present passa a imperfet: *presidia*."
    grading: tolerant
    explanation: "«Qui…?» és una pregunta parcial: manté *qui*, sense *si*. Amb «van preguntar», en passat, *presideix* passa a *presidia*."

  - id: b2-44-017
    type: fill
    point: preguntes-indirectes
    lesson: 2
    prompt: "«T'agrada l'ordre del dia?» Em va preguntar ___ l'ordre del dia."
    hint: "«si» + agradar, imperfet, primera persona"
    answers: ["si m'agradava"]
    wrong_answers:
      - text: "si m'agrada"
        why: "El temps també canvia: amb «va preguntar», en passat, *agrada* passa a *agradava*."
      - text: "si t'agradava"
        why: "«T'agrada» va adreçat a qui ho explica: en estil indirecte passa a primera persona, *m'agradava*."
    grading: tolerant
    explanation: "«T'agrada?» és una pregunta total (*si*). Va adreçada a qui ho explica (*em*): *t'* passa a *m'*. Amb el verb en passat, *agrada* passa a *agradava*."

  - id: b2-44-018
    type: order
    point: preguntes-indirectes
    lesson: 2
    cue: "Ahir no sabies si podies entrar a la sala i ho vas preguntar al conserge. Explica-ho."
    chunks: ["Li", "vaig", "preguntar", "si", "la", "sala", "era", "oberta"]
    extra: ["és"]
    answers:
      - "Li vaig preguntar si la sala era oberta."
      - "Si la sala era oberta, li vaig preguntar."
    explanation: "«La sala és oberta?» és una pregunta total: porta *si*. Amb «vaig preguntar», en passat, *és* passa a *era*."

  - id: b2-44-019
    type: order
    point: ordres-indirectes
    lesson: 2
    cue: "La cap vol que el vostre equip revisi el pressupost. Explica què us demana."
    chunks: ["Ens", "demana", "que", "revisem", "el", "pressupost"]
    extra: ["reviséssim"]
    answers:
      - "Ens demana que revisem el pressupost."
    explanation: "«Demana» és present i l'ordre és per a «nosaltres» (*ens*): *que revisem*, amb el present de subjuntiu."

  - id: b2-44-020
    type: choice
    point: ordres-indirectes
    lesson: 2
    prompt: "«Omple el formulari», em va dir ahir. Explica-ho: em va dir que ___ el formulari."
    answer: "omplís"
    distractors:
      - text: "ompli"
        why: "*Ompli* és present de subjuntiu. Amb «va dir», en passat, cal l'imperfet: *omplís*."
      - text: "ompliria"
        why: "*Ompliria* és condicional. Les ordres darrere de *dir que* porten subjuntiu: *omplís*."
    explanation: "L'ordre «omple» era per a qui ho explica (*em*) i «va dir» és passat: *que omplís*, amb l'imperfet de subjuntiu."

  - id: b2-44-021
    type: choice
    point: preguntes-indirectes
    lesson: 2
    prompt: "«Quan es votarà la moció?» Va preguntar ___."
    answer: "quan es votaria la moció"
    distractors:
      - text: "si es votaria la moció"
        why: "«Quan…?» és una pregunta parcial: manté *quan* i no porta *si*."
      - text: "quan es votarà la moció"
        why: "Amb «va preguntar», en passat, el futur passa a condicional: *es votaria*."
    explanation: "«Quan…?» és parcial: manté l'interrogatiu, sense *si*. Amb «va preguntar», en passat, el futur *es votarà* passa a condicional: *es votaria*."

  - id: b2-44-022
    type: transform
    point: ordres-indirectes
    lesson: 2
    instruction: "Passa l'ordre a estil indirecte."
    source: "L'alcalde va dir als regidors: «[[Seieu i escolteu amb atenció.]]»"
    start: "L'alcalde va dir als regidors que"
    answers: ["L'alcalde va dir als regidors que seguessin i escoltessin amb atenció.", "L'alcalde va dir als regidors que escoltessin i seguessin amb atenció."]
    wrong_answers:
      - text: "L'alcalde va dir als regidors que seguiu i escolteu amb atenció."
        why: "L'imperatiu no es manté darrere de *que*: cal l'imperfet de subjuntiu (*seguessin*, *escoltessin*)."
      - text: "L'alcalde va dir als regidors que seguin i escoltin amb atenció."
        why: "*Seguin* i *escoltin* van en present de subjuntiu. Amb «va dir», en passat, cal l'imperfet."
    grading: tolerant
    explanation: "L'ordre «seieu i escolteu» era per als regidors i «va dir» és passat: *que seguessin i escoltessin*, amb l'imperfet de subjuntiu."

  - id: b2-44-023
    type: transform
    point: preguntes-indirectes
    lesson: 2
    instruction: "Passa la pregunta a estil indirecte."
    source: "La periodista va preguntar: «[[A quina hora comença]] el ple?»"
    start: "La periodista va preguntar"
    answers: ["La periodista va preguntar a quina hora començava el ple."]
    wrong_answers:
      - text: "La periodista va preguntar si a quina hora començava el ple."
        why: "Les preguntes parcials no porten *si*."
      - text: "La periodista va preguntar a quina hora comença el ple."
        why: "El temps també canvia: amb «va preguntar», en passat, *comença* passa a *començava*."
    grading: tolerant
    explanation: "«A quina hora…?» és parcial: manté l'interrogatiu, sense *si*. Amb «va preguntar», en passat, *comença* passa a *començava*."

  - id: b2-44-024
    type: inline-choice
    point: preguntes-indirectes
    lesson: 2
    title: "Una roda de premsa"
    text: "En la roda de premsa, el periodista va preguntar {qui|si|què} havia redactat l'informe, {quan|si|què} es publicaria i {si|qui|què} el ple l'havia aprovat."
    explanation: "Les dues primeres són parcials i mantenen l'interrogatiu (*qui*, *quan*); la tercera és total i porta *si*. El temps fa un pas enrere."

  - id: b2-44-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "El regidor va ___ el problema del soroll: ara tothom en parla."
    answer: "posar sobre la taula"
    distractors:
      - text: "donar la paraula al"
        why: "*Donar la paraula* és concedir a algú el torn d'intervenir, no plantejar un tema."
      - text: "prendre la paraula sobre"
        why: "*Prendre la paraula* és començar a parlar un mateix, no plantejar un tema."
    explanation: "«Ara tothom en parla»: el regidor va plantejar el tema. *Posar sobre la taula* vol dir plantejar un tema perquè es discuteixi."

  - id: b2-44-026
    type: fill
    point: expressions
    lesson: 2
    prompt: "El debat dels pressupostos va ___ fins al setembre."
    hint: "l'expressió que vol dir que un tema s'ajorna, en infinitiu"
    answers: ["quedar sobre la taula"]
    wrong_answers:
      - text: "posar sobre la taula"
        why: "*Posar sobre la taula* vol dir plantejar un tema. Quan un tema s'ajorna, *queda* sobre la taula."
    grading: tolerant
    explanation: "El debat s'ajorna fins al setembre: *quedar sobre la taula* vol dir que un tema queda pendent per a un altre dia."

