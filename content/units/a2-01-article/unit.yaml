id: a2-01
level: A2
title: "L'article, l'apostrofació i les contraccions"
summary: "L'article definit i indefinit, l'apostrofació, les contraccions *al, del, pel* i l'article personal (*en Pere, l'Anna, la Maria*)."
vocabulary_theme: "Presentacions i família"
points:
  - id: article-apostrofacio
    title: "L'article i l'apostrofació"
    refs:
      - label: "GEIEC: L'article"
        url: "https://geiec.iec.cat"
  - id: contraccions
    title: "Les contraccions: *al, del, pel*"
    refs:
      - label: "GEIEC: L'article"
        url: "https://geiec.iec.cat"
  - id: article-personal
    title: "L'article personal: *en Pere, l'Anna, la Maria*"
    refs:
      - label: "GEIEC: L'article personal"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: noms de persona i apòstrofs"
  - id: expressions
    title: "Expressions per presentar-se i saludar"
lessons:
  - title: "Conèixer l'article i les contraccions"
  - title: "Practicar l'apostrofació"
  - title: "L'article personal i els calcs"
  - title: "Produir frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la família"
    definition: "Les persones que són parents: pares, germans, avis, oncles."
    example: "La meva família viu a Tarragona."
  - word: "els pares"
    definition: "El pare i la mare."
    example: "Els meus pares fan cinquanta anys aquest any."
  - word: "el germà, la germana"
    definition: "Fill o filla dels mateixos pares que tu."
    example: "La meva germana treballa a l'hospital."
  - word: "l'avi, l'àvia"
    definition: "El pare o la mare dels teus pares."
    example: "L'avi em porta a l'escola cada dimarts."
  - word: "l'oncle, la tia"
    definition: "Germà o germana del teu pare o de la teva mare."
    example: "L'oncle Ramon fa uns pastissos boníssims."
  - word: "el cosí, la cosina"
    definition: "Fill o filla d'un oncle o d'una tia."
    example: "La meva cosina estudia a Girona."
  - word: "el fill, la filla"
    definition: "Persona que té pare i mare, vista pels pares."
    example: "La filla de la Montse fa teatre."
  - word: "el net, la neta"
    definition: "Fill o filla del teu fill o de la teva filla."
    example: "Els nets dinen amb els avis els diumenges."
  - word: "l'amic, l'amiga"
    definition: "Persona que coneixes bé i que t'estimes."
    example: "L'Ibrahim és un bon amic meu."
  - word: "el company, la companya"
    definition: "Persona amb qui treballes o estudies."
    example: "La Carla és una companya de la feina."
  - word: "el veí, la veïna"
    definition: "Persona que viu a prop teu."
    example: "La veïna del tercer té un gat molt gran."
  - word: "la parella"
    definition: "Persona amb qui tens una relació d'amor."
    example: "La seva parella treballa en una fleca."
  - word: "el nom"
    definition: "La paraula amb què ens diuen."
    example: "El nom de la meva neboda és Aina."
  - word: "el cognom"
    definition: "La part del nom que es comparteix amb la família."
    example: "El cognom de la Fàtima és Puig."
  - word: "presentar"
    definition: "Dir a una persona qui és una altra persona."
    example: "Et presento la meva germana."
  - word: "conèixer"
    definition: "Veure una persona per primera vegada o saber qui és."
    example: "Vaig conèixer la Núria a la universitat."
  - word: "l'aniversari"
    definition: "El dia que algú fa anys."
    example: "Dissabte és l'aniversari de la meva mare."
  - word: "l'escola"
    definition: "Lloc on van els nens a aprendre."
    example: "L'escola del barri tanca a les cinc."
  - word: "la universitat"
    definition: "Lloc on s'estudien els estudis superiors."
    example: "La universitat és a prop de l'estació."
  - word: "l'hospital"
    definition: "Lloc on van els malalts per curar-se."
    example: "La Laia treballa a l'hospital de Vic."
  - word: "l'oficina"
    definition: "Lloc on es fa una feina de despatx."
    example: "L'oficina obre a les vuit."
  - word: "el mercat"
    definition: "Lloc on es venen aliments, sovint cada setmana."
    example: "Dissabte anem al mercat de Vic."
  - word: "el gimnàs"
    definition: "Lloc on es fa esport."
    example: "Surto del gimnàs a les vuit."
  - word: "el cinema"
    definition: "Lloc on es veuen pel·lícules."
    example: "Anem al cinema amb els cosins."
  - word: "el banc"
    definition: "Lloc on guardes els diners."
    example: "El banc tanca a les dues."
  - word: "el supermercat"
    definition: "Botiga gran on es compra de tot per menjar."
    example: "Compro la fruita al supermercat."
  - word: "la fleca"
    definition: "Botiga on es ven pa."
    example: "La fleca del barri obre molt d'hora."
  - word: "la plaça"
    definition: "Espai obert d'una ciutat on es troba la gent."
    example: "Quedem a la plaça a les set."
  - word: "el carrer"
    definition: "Espai d'una ciutat entre dues fileres de cases."
    example: "Visc al carrer Major."
  - word: "l'hora"
    definition: "Moment concret del dia."
    example: "A quina hora quedem?"
  - word: "la idea"
    definition: "Pensament que et ve al cap."
    example: "Quina bona idea!"
  - word: "la història"
    definition: "Relat del que va passar o de què passa a algú."
    example: "La història de la meva família és llarga."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-01-001
    type: choice
    point: article-apostrofacio
    lesson: 1
    prompt: "Dilluns porto la nena a ___ del barri."
    answer: "l'escola"
    distractors:
      - text: "la escola"
        why: "*La* s'apostrofa davant de vocal: *l'escola*. En castellà no s'apostrofa."
      - text: "el escola"
        why: "*Escola* és femení, i no porta *el*."
    explanation: "*Escola* és femení i comença per vocal: l'article s'apostrofa i fa *l'escola*."

  - id: a2-01-002
    type: choice
    point: article-apostrofacio
    lesson: 1
    prompt: "Aquesta nit dormim a ___ del centre de Girona."
    answer: "l'hotel"
    distractors:
      - text: "el hotel"
        why: "*Hotel* comença per *h* muda: *el* s'apostrofa i fa *l'hotel*."
      - text: "la hotel"
        why: "*Hotel* és masculí: no porta *la*."
    explanation: "*Hotel* és masculí i la *h* no es pronuncia: l'article s'apostrofa, *l'hotel*."

  - id: a2-01-003
    type: choice
    point: article-apostrofacio
    lesson: 1
    prompt: "Dissabte celebrem ___ de l'avi: fa vuitanta anys."
    answer: "l'aniversari"
    distractors:
      - text: "el aniversari"
        why: "Davant de vocal, *el* s'apostrofa: *l'aniversari*."
      - text: "la aniversari"
        why: "*Aniversari* és masculí: no porta *la*."
    explanation: "*Aniversari* és masculí i comença per vocal: *el* s'apostrofa i fa *l'aniversari*."

  - id: a2-01-004
    type: choice
    point: article-apostrofacio
    lesson: 1
    prompt: "La Núria treballa a ___ d'aquesta ciutat des de fa dos anys."
    answer: "la universitat"
    distractors:
      - text: "l'universitat"
        why: "La *u* de *universitat* és àtona, i en aquest cas *la* no s'apostrofa."
      - text: "el universitat"
        why: "*Universitat* és femení: porta *la*."
    explanation: "*Universitat* comença per *u* àtona: *la* no s'apostrofa. És una excepció de la regla."

  - id: a2-01-005
    type: choice
    point: article-apostrofacio
    lesson: 1
    prompt: "Tinc ___ germana a Girona i un germà a Reus."
    answer: "una"
    distractors:
      - text: "un"
        why: "*Germana* és femení: l'article indefinit és *una*."
      - text: "uns"
        why: "*Uns* és plural: aquí parlem d'una sola germana."
    explanation: "L'article indefinit femení singular és *una*: *una germana*. Per al masculí, *un germà*."

  - id: a2-01-006
    type: choice
    point: contraccions
    lesson: 1
    prompt: "Torno ___ gimnàs a les vuit."
    answer: "del"
    distractors:
      - text: "de el"
        why: "*De* i *el* s'ajunten en una sola paraula: *del*."
      - text: "de la"
        why: "*Gimnàs* és masculí: no porta *la*."
    explanation: "*De* + *el* = *del*. *Gimnàs* és masculí i comença per consonant: *del gimnàs*."

  - id: a2-01-007
    type: choice
    point: contraccions
    lesson: 1
    prompt: "Aquest matí he anat ___ mercat amb la meva àvia."
    answer: "al"
    distractors:
      - text: "a el"
        why: "*A* i *el* s'ajunten en una sola paraula: *al*."
      - text: "a la"
        why: "*Mercat* és masculí: no porta *la*."
    explanation: "*A* + *el* = *al*: *al mercat*."

  - id: a2-01-008
    type: choice
    point: contraccions
    lesson: 1
    prompt: "Dissabte passem ___ centre de Vic per anar a la fira."
    answer: "pel"
    distractors:
      - text: "per el"
        why: "*Per* i *el* s'ajunten en una sola paraula: *pel*."
      - text: "per la"
        why: "*Centre* és masculí: no porta *la*."
    explanation: "*Per* + *el* = *pel*: *pel centre*."

  - id: a2-01-009
    type: choice
    point: contraccions
    lesson: 1
    prompt: "Parlem sovint ___ avis: viuen a Tortosa."
    answer: "dels"
    distractors:
      - text: "de els"
        why: "*De* i *els* s'ajunten en una sola paraula: *dels*."
      - text: "de les"
        why: "*Avis* és masculí plural: porta *els*, no *les*."
    explanation: "*De* + *els* = *dels*: *dels avis*. Al plural no hi ha apòstrof."

  - id: a2-01-010
    type: match
    point: article-apostrofacio
    lesson: 1
    instruction: "Relaciona cada nom amb el seu article definit."
    pairs:
      - ["pare", "el pare"]
      - ["amiga", "l'amiga"]
      - ["universitat", "la universitat"]
      - ["germanes", "les germanes"]
      - ["home", "l'home"]
    explanation: "*L'amiga* i *l'home* s'apostrofen davant de vocal. *La universitat* és una excepció, i al plural no hi ha apòstrof."

  - id: a2-01-011
    type: match
    point: contraccions
    lesson: 1
    instruction: "Relaciona cada combinació amb la forma correcta."
    pairs:
      - ["a + el", "al"]
      - ["de + els", "dels"]
      - ["per + el", "pel"]
      - ["a + els", "als"]
      - ["per + els", "pels"]
    explanation: "Les preposicions *a*, *de* i *per* s'ajunten amb *el* i *els*: *al*, *dels*, *pel*, *als*, *pels*."

  - id: a2-01-012
    type: inline-choice
    point: article-apostrofacio
    lesson: 1
    title: "Una nota per a la Núria"
    text: "Núria, he anat {al |a el }mercat amb {l'|la }àvia i hem comprat {l'|el }oli i {el |l'}pa. Després he passat per {la |l'}universitat per recollir {l'|el }horari. Torno a {l'|la }hora de dinar."
    explanation: "*L'àvia*, *l'oli*, *l'horari* i *l'hora* s'apostrofen. *La universitat* és una excepció. *A* + *el* = *al*."

  - id: a2-01-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Com va la feina, Marc? —Doncs ___: ni bé ni malament."
    answer: "anar fent"
    distractors:
      - text: "fins aviat"
        why: "*Fins aviat* serveix per acomiadar-se: no respon a *Com va?*"
      - text: "molt de gust"
        why: "*Molt de gust* es diu quan coneixes algú per primera vegada."
    explanation: "*Anar fent* respon a *Com va?* quan les coses no van ni bé ni malament."

  # ---------- Lliçó 2 ----------
  - id: a2-01-014
    type: fill
    point: article-apostrofacio
    lesson: 2
    prompt: "Aquest estiu fem un curs a ___ de la ciutat."
    hint: "*universitat*, article definit"
    answers: ["la universitat"]
    wrong_answers:
      - text: "l'universitat"
        why: "La *u* de *universitat* és àtona, i *la* no s'apostrofa: *la universitat*."
    grading: strict
    explanation: "Si la *u* inicial és àtona, *la* no s'apostrofa: *la universitat*."

  - id: a2-01-015
    type: fill
    point: article-apostrofacio
    lesson: 2
    prompt: "Quan arribem, ___ ja ha parat taula."
    hint: "*àvia*, article definit"
    answers: ["l'àvia"]
    wrong_answers:
      - text: "la àvia"
        why: "Davant de vocal, *la* s'apostrofa: *l'àvia*."
    grading: strict
    explanation: "*Àvia* és femení i comença per vocal: *la* s'apostrofa i fa *l'àvia*."

  - id: a2-01-016
    type: fill
    point: article-apostrofacio
    lesson: 2
    prompt: "Em sembla que ___ de la Fàtima és molt bona: fem un sopar de sorpresa."
    hint: "*idea*, article definit"
    answers: ["la idea"]
    wrong_answers:
      - text: "l'idea"
        why: "La *i* de *idea* és àtona, i *la* no s'apostrofa: *la idea*."
    grading: strict
    explanation: "*Idea* comença per *i* àtona: *la* no s'apostrofa. És una excepció de la regla."

  - id: a2-01-017
    type: fill
    point: article-apostrofacio
    lesson: 2
    prompt: "Ens trobem a ___ de sempre, davant del cinema."
    hint: "*hora*, article definit"
    answers: ["l'hora"]
    wrong_answers:
      - text: "la hora"
        why: "*Hora* comença per *h* muda: *la* s'apostrofa i fa *l'hora*."
    grading: strict
    explanation: "*Hora* és femení i la *h* no es pronuncia: *la* s'apostrofa, *l'hora*."

  - id: a2-01-018
    type: fill
    point: contraccions
    lesson: 2
    prompt: "Demà anem ___ cinema amb els nens."
    hint: "*a* + *el*"
    answers: ["al"]
    wrong_answers:
      - text: "a el"
        why: "*A* i *el* s'ajunten en una sola paraula: *al*."
    grading: strict
    explanation: "*A* + *el* = *al*: *al cinema*."

  - id: a2-01-019
    type: fill
    point: contraccions
    lesson: 2
    prompt: "Aquest cap de setmana dinem a casa ___ cosins."
    hint: "*de* + *els*"
    answers: ["dels"]
    wrong_answers:
      - text: "de els"
        why: "*De* i *els* s'ajunten en una sola paraula: *dels*."
      - text: "del"
        why: "*Cosins* és plural: la forma és *dels*, no *del*."
    grading: strict
    explanation: "*De* + *els* = *dels*: *dels cosins*."

  - id: a2-01-020
    type: fill
    point: contraccions
    lesson: 2
    prompt: "Cada tarda passegem ___ carrers del barri."
    hint: "*per* + *els*"
    answers: ["pels"]
    wrong_answers:
      - text: "per els"
        why: "*Per* i *els* s'ajunten en una sola paraula: *pels*."
      - text: "pel"
        why: "*Carrers* és plural: la forma és *pels*, no *pel*."
    grading: strict
    explanation: "*Per* + *els* = *pels*: *pels carrers*."

  - id: a2-01-021
    type: inline-choice
    point: contraccions
    lesson: 2
    title: "Una tarda de gestions"
    text: "Avui he sortit {de l'|de la |del }oficina a les cinc. He passat {pel |per el |per la }carrer Major, he anat {al |a el |a la }banc i he tornat {de la |del |de l'}plaça a peu."
    explanation: "Davant de *la* i *l'* no hi ha contracció: *de l'oficina*, *de la plaça*. *Per* + *el* = *pel*; *a* + *el* = *al*."

  - id: a2-01-022
    type: fill
    point: contraccions
    lesson: 2
    prompt: "Sortim ___ a les cinc i anem a fer un cafè."
    hint: "*de* + *oficina*, article definit"
    answers: ["de l'oficina"]
    wrong_answers:
      - text: "de la oficina"
        why: "Davant de vocal, *la* s'apostrofa: *l'oficina*."
      - text: "del oficina"
        why: "*Oficina* és femení: *del* només serveix per als masculins."
    grading: strict
    explanation: "*De* no es contrau amb *l'*: *de l'oficina*. La contracció només es fa amb *el* i *els*."

  - id: a2-01-023
    type: order
    point: contraccions
    lesson: 2
    cue: "Digues que cada dimarts vas al mercat amb el teu avi."
    chunks: ["cada dimarts", "vaig", "al mercat", "amb l'avi"]
    extra: ["a el mercat"]
    answers:
      - "Cada dimarts vaig al mercat amb l'avi."
      - "Vaig al mercat amb l'avi cada dimarts."
      - "Vaig al mercat cada dimarts amb l'avi."
      - "Amb l'avi vaig al mercat cada dimarts."
      - "Cada dimarts amb l'avi vaig al mercat."
    explanation: "*A* + *el* = *al*, i *el* s'apostrofa davant de vocal: *amb l'avi*."

  - id: a2-01-024
    type: order
    point: article-personal
    lesson: 2
    cue: "Pregunta on és l'oficina de la Núria."
    chunks: ["on", "és", "l'oficina", "de la Núria"]
    extra: ["del Núria"]
    answers:
      - "On és l'oficina de la Núria?"
    explanation: "Davant d'un nom de dona va *la*: *de la Núria*. *De* no es contrau amb *la*."

  - id: a2-01-025
    type: choice
    point: contraccions
    lesson: 2
    prompt: "Aquest estiu viatgem ___ Pirineus amb uns amics."
    answer: "als"
    distractors:
      - text: "a els"
        why: "*A* i *els* s'ajunten en una sola paraula: *als*."
      - text: "a les"
        why: "*Pirineus* és masculí plural: porta *els*, no *les*."
    explanation: "*A* + *els* = *als*: *als Pirineus*."

  - id: a2-01-026
    type: choice
    point: article-apostrofacio
    lesson: 2
    prompt: "___ història de la nostra ciutat és molt llarga."
    answer: "La"
    distractors:
      - text: "L'"
        why: "*Història* comença per *i* àtona (*hi*): *la* no s'apostrofa."
      - text: "El"
        why: "*Història* és femení: porta *la*."
    explanation: "*Història* és femení i la *i* inicial és àtona: *la* no s'apostrofa, *la història*."

  # ---------- Lliçó 3 ----------
  - id: a2-01-027
    type: choice
    point: article-personal
    lesson: 3
    prompt: "Aquesta és ___ Núria, la meva companya de pis."
    answer: "la"
    distractors:
      - text: "en"
        why: "*En* és l'article personal masculí. *Núria* és un nom de dona."
      - text: "l'"
        why: "*L'* només va davant de vocal o *h*. *Núria* comença per consonant."
    explanation: "Els noms de dona porten *la*, o *l'* davant de vocal: *la Núria*."

  - id: a2-01-028
    type: choice
    point: article-personal
    lesson: 3
    prompt: "Aquest és ___ Jordi, el meu cunyat: viu a Manresa."
    answer: "en"
    distractors:
      - text: "la"
        why: "*La* és per als noms de dona. *Jordi* és un nom d'home."
      - text: "l'"
        why: "*L'* només va davant de vocal o *h*. *Jordi* comença per consonant."
    explanation: "Davant d'un nom d'home que comença per consonant, l'article personal estàndard és *en*: *en Jordi*."

  - id: a2-01-029
    type: choice
    point: article-personal
    lesson: 3
    prompt: "Aquest cap de setmana vindran ___ i la seva germana."
    answer: "l'Arnau"
    distractors:
      - text: "el Arnau"
        why: "Davant de vocal, *el* s'apostrofa: *l'Arnau*."
      - text: "la Arnau"
        why: "*Arnau* és un nom d'home: no porta *la*."
    explanation: "Davant d'un nom que comença per vocal, l'article personal masculí és *l'*: *l'Arnau*."

  - id: a2-01-030
    type: choice
    point: article-personal
    lesson: 3
    prompt: "Aquest matí he vist ___ al tren."
    answer: "l'Anna"
    distractors:
      - text: "la Anna"
        why: "Davant de vocal, *la* s'apostrofa: *l'Anna*."
      - text: "en Anna"
        why: "*En* és per als noms d'home. *Anna* és un nom de dona."
    explanation: "*Anna* és un nom de dona i comença per vocal: l'article personal és *l'*, *l'Anna*."

  - id: a2-01-031
    type: fill
    point: article-personal
    lesson: 3
    prompt: "—Has vist ___ Carla? —Sí, és a la cuina."
    hint: "article personal"
    answers: ["la"]
    wrong_answers:
      - text: "en"
        why: "*En* és per als noms d'home. *Carla* és un nom de dona."
      - text: "l'"
        why: "*L'* només va davant de vocal o *h*."
    grading: tolerant
    explanation: "*Carla* és un nom de dona que comença per consonant: l'article personal és *la*."

  - id: a2-01-032
    type: fill
    point: article-personal
    lesson: 3
    prompt: "—Has vist ___ Marc? —Sí, és al jardí."
    hint: "article personal masculí"
    answers: ["en", "el"]
    wrong_answers:
      - text: "la"
        why: "*La* és per als noms de dona. *Marc* és un nom d'home."
    grading: tolerant
    explanation: "Davant d'un nom d'home que comença per consonant diem *en Marc*; en registre col·loquial també *el Marc*."

  - id: a2-01-033
    type: fill
    point: article-personal
    lesson: 3
    prompt: "—On és ___? —Ha sortit a comprar el pa."
    hint: "article personal + *Eva*"
    answers: ["l'Eva"]
    wrong_answers:
      - text: "la Eva"
        why: "Davant de vocal, *la* s'apostrofa: *l'Eva*."
    grading: strict
