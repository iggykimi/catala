  # ---------- Lliçó 5 ----------
  - id: a2-01-053
    type: reading
    point: article-personal
    lesson: 5
    title: "Una festa de família"
    text: |
      Dissabte, la Montse fa una festa a casa per celebrar l'aniversari de la seva mare. Hi van els pares, l'oncle Jordi i la tia Carme. També hi ha la Laia, una companya de la feina, i l'Arnau, un veí.

      La Laia no coneix la família de la Montse, i la Montse la presenta als pares. «Mare, aquesta és la Laia», diu. «Molt de gust», respon la Laia.

      Després, l'oncle Jordi pregunta a l'Arnau com va tot. L'Arnau diu que va fent, perquè treballa molt. Al final de la tarda, tothom s'acomiada amb un «fins aviat».
    questions:
      - prompt: "Per què fa una festa la Montse?"
        answer: "Perquè la seva mare fa anys."
        distractors:
          - text: "Perquè la Laia fa anys."
            why: "La Laia és una companya de feina de la Montse. L'aniversari és de la mare."
          - text: "Perquè l'Arnau canvia de feina."
            why: "De l'Arnau només diu que treballa molt."
      - prompt: "Qui és la Laia?"
        answer: "Una companya de feina."
        distractors:
          - text: "Una veïna de la Montse."
            why: "El veí del text és l'Arnau."
          - text: "Una tia de la Montse."
            why: "La tia de la Montse es diu Carme."
      - prompt: "Què fa la Montse quan arriba la Laia?"
        answer: "Li presenta els seus pares."
        distractors:
          - text: "La presenta a l'Arnau."
            why: "El text diu que la Montse presenta la Laia als pares."
          - text: "Li ensenya la feina."
            why: "El text no parla d'això: la Montse presenta la Laia als pares."
      - prompt: "Què respon l'Arnau a l'oncle Jordi?"
        answer: "Que va fent, perquè treballa molt."
        distractors:
          - text: "Que té una festa a casa seva aquesta nit."
            why: "La festa és a casa de la Montse, no de l'Arnau."
          - text: "Que ha de celebrar l'aniversari de la mare."
            why: "L'aniversari és de la mare de la Montse."
    explanation: "El text explica una festa d'aniversari, com es fan les presentacions i com s'acomiada la gent."

