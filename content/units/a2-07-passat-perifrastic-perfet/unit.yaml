id: a2-07
level: A2
title: "El passat perifràstic i el perfet"
summary: "El passat perifràstic (*vaig anar*), el perfet (*he anat*), els participis irregulars i quan es fa servir cada temps."
vocabulary_theme: "Viatges i transports"
points:
  - id: passat-perifrastic
    title: "El passat perifràstic"
    refs:
      - label: "GEIEC: El passat perifràstic"
        url: "https://geiec.iec.cat"
  - id: perfet
    title: "El perfet"
    refs:
      - label: "GEIEC: El perfet"
        url: "https://geiec.iec.cat"
  - id: participis-irregulars
    title: "Participis irregulars"
    refs:
      - label: "GEIEC: El participi"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *vaig anar* i *vaig a anar*"
  - id: expressions
    title: "Expressions de viatge"
lessons:
  - title: "El passat perifràstic i el perfet"
  - title: "Practicar els dos passats"
  - title: "Participis irregulars i el calc"
  - title: "Produir frases en passat"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el viatge"
    definition: "Sortida llarga per anar a un altre lloc."
    example: "El viatge a Galícia dura vuit hores en cotxe."
  - word: "viatjar"
    definition: "Fer un viatge, anar a un altre lloc."
    example: "Viatjo molt per feina: cada mes agafo l'avió."
  - word: "el bitllet"
    definition: "Paper o missatge que et deixa pujar al tren o a l'avió."
    example: "He comprat dos bitllets per a divendres."
  - word: "el tren"
    definition: "Transport que va per la via, amb vagons."
    example: "El tren de les vuit sempre va ple."
  - word: "l'avió"
    definition: "Transport que vola pel cel."
    example: "L'avió surt a les set del matí."
  - word: "l'autobús"
    definition: "Cotxe gran que porta molta gent per la ciutat o per carretera."
    example: "L'autobús de les nou passa per casa meva."
  - word: "el metro"
    definition: "Tren que va per sota de la ciutat."
    example: "Per anar a la feina agafo el metro."
  - word: "el taxi"
    definition: "Cotxe amb conductor que et porta on vols."
    example: "Com que plou, tornem en taxi."
  - word: "el vaixell"
    definition: "Transport gran que va pel mar."
    example: "El vaixell a Mallorca surt al vespre."
  - word: "la bicicleta"
    definition: "Vehicle de dues rodes que va amb els peus."
    example: "Vaig a la feina en bicicleta."
  - word: "el cotxe"
    definition: "Vehicle petit per a quatre o cinc persones."
    example: "Hem llogat un cotxe per al cap de setmana."
  - word: "l'estació"
    definition: "Lloc on surten i arriben els trens i els autobusos."
    example: "L'estació de Sants és molt gran."
  - word: "l'aeroport"
    definition: "Lloc on surten i arriben els avions."
    example: "Cal ser a l'aeroport dues hores abans."
  - word: "la parada"
    definition: "Lloc on el bus s'atura per pujar i baixar."
    example: "Baixo a la parada del mercat."
  - word: "l'andana"
    definition: "Costat de la via on la gent espera el tren."
    example: "El tren surt de l'andana 3."
  - word: "la maleta"
    definition: "Caixa amb rodes per portar la roba de viatge."
    example: "Aquest matí he fet la maleta."
  - word: "la motxilla"
    definition: "Bossa que es porta a l'esquena."
    example: "Porto el dinar a la motxilla."
  - word: "el passaport"
    definition: "Document per viatjar a un altre país."
    example: "No trobo el passaport: mira a la motxilla."
  - word: "el seient"
    definition: "Cadira del tren, de l'avió o del cotxe."
    example: "El meu seient és al costat de la finestra."
  - word: "el vol"
    definition: "Viatge en avió, d'un lloc a un altre."
    example: "El vol a Madrid dura una hora."
  - word: "el retard"
    definition: "Temps que un tren o un avió surt més tard del previst."
    example: "El tren porta deu minuts de retard."
  - word: "l'horari"
    definition: "Hora de sortida i d'arribada dels trens o dels avions."
    example: "Mira l'horari: potser hi ha un tren més tard."
  - word: "el mapa"
    definition: "Dibuix d'una ciutat o d'un país per no perdre's."
    example: "Amb el mapa del mòbil no ens perdem."
  - word: "l'hotel"
    definition: "Lloc on pots dormir quan viatges."
    example: "L'hotel és a prop de l'estació."
  - word: "la reserva"
    definition: "Plaça guardada abans d'arribar: a l'hotel, al tren, al restaurant."
    example: "He fet la reserva per internet."
  - word: "el turista, la turista"
    definition: "Persona que visita un lloc per plaer."
    example: "A l'estiu hi ha molts turistes a la platja."
  - word: "el passatger, la passatgera"
    definition: "Persona que viatja en un tren, un avió o un vaixell."
    example: "Els passatgers ja pugen a l'avió."
  - word: "el conductor, la conductora"
    definition: "Persona que porta un cotxe, un autobús o un tren."
    example: "La conductora ens ha dit on cal baixar."
  - word: "agafar"
    definition: "Pujar a un transport per fer-lo servir."
    example: "Cada dia agafo el metro a les vuit."
  - word: "perdre"
    definition: "No arribar a temps a un tren o a un avió."
    example: "Corre, que perdem el tren!"
  - word: "pujar"
    definition: "Entrar en un tren, un avió o un cotxe."
    example: "Pugem al tren: surt d'aquí a cinc minuts."
  - word: "baixar"
    definition: "Sortir d'un tren, un avió o un cotxe."
    example: "Baixem a la parada següent."
  - word: "arribar"
    definition: "Ser ja al lloc on vas."
    example: "El tren arriba a les nou en punt."
  - word: "tornar"
    definition: "Anar una altra vegada al lloc d'on has sortit."
    example: "Diumenge tornem a casa."
  - word: "sortir"
    definition: "Començar un viatge o marxar d'un lloc."
    example: "El tren surt de l'andana 2."
  - word: "visitar"
    definition: "Anar a veure un lloc o una persona."
    example: "Demà visitem el museu amb els nens."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-07-001
    type: choice
    point: passat-perifrastic
    lesson: 1
    prompt: "Ahir la Núria ___ a Girona en tren."
    answer: "va anar"
    distractors:
      - text: "van anar"
        why: "*Van* és per a «ells». «La Núria» és «ella»: *va anar*."
      - text: "vam anar"
        why: "*Vam* és per a «nosaltres». «La Núria» és «ella»: *va anar*."
    explanation: "«La Núria» és «ella»: el perifràstic fa *va* + infinitiu: *va anar*."

  - id: a2-07-002
    type: choice
    point: passat-perifrastic
    lesson: 1
    prompt: "La setmana passada nosaltres ___ el museu de Figueres."
    answer: "vam visitar"
    distractors:
      - text: "van visitar"
        why: "*Van* és per a «ells». Amb «nosaltres»: *vam visitar*."
      - text: "vau visitar"
        why: "*Vau* és per a «vosaltres». Amb «nosaltres»: *vam visitar*."
    explanation: "Amb «nosaltres», el perifràstic fa *vam* + infinitiu: *vam visitar*."

  - id: a2-07-003
    type: choice
    point: passat-perifrastic
    lesson: 1
    prompt: "Ahir vosaltres ___ tard a l'estació, oi?"
    answer: "vau arribar"
    distractors:
      - text: "vam arribar"
        why: "*Vam* és per a «nosaltres». Amb «vosaltres»: *vau arribar*."
      - text: "van arribar"
        why: "*Van* és per a «ells». Amb «vosaltres»: *vau arribar*."
    explanation: "Amb «vosaltres», el perifràstic fa *vau* + infinitiu: *vau arribar*."

  - id: a2-07-004
    type: choice
    point: passat-perifrastic
    lesson: 1
    prompt: "Dilluns passat l'Ibrahim ___ el bitllet per internet."
    answer: "va comprar"
    distractors:
      - text: "vas comprar"
        why: "*Vas* és per a «tu». «L'Ibrahim» és «ell»: *va comprar*."
      - text: "vam comprar"
        why: "*Vam* és per a «nosaltres». «L'Ibrahim» és «ell»: *va comprar*."
    explanation: "«L'Ibrahim» és «ell»: el perifràstic fa *va* + infinitiu: *va comprar*."

  - id: a2-07-005
    type: choice
    point: perfet
    lesson: 1
    prompt: "—On és en Pau? —Aquest matí ___ el tren de les vuit."
    answer: "ha agafat"
    distractors:
      - text: "han agafat"
        why: "*Han* és per a «ells». «En Pau» és «ell»: *ha agafat*."
      - text: "hem agafat"
        why: "*Hem* és per a «nosaltres». «En Pau» és «ell»: *ha agafat*."
    explanation: "«En Pau» és «ell»: el perfet fa *ha* + participi: *ha agafat*."

  - id: a2-07-006
    type: choice
    point: perfet
    lesson: 1
    prompt: "—Ja heu dinat? —Sí, ___ a l'estació."
    answer: "hem dinat"
    distractors:
      - text: "han dinat"
        why: "Responen «nosaltres», no «ells»: *hem dinat*."
      - text: "he dinat"
        why: "Responen «nosaltres», no «jo»: *hem dinat*."
    explanation: "Responen «nosaltres»: el perfet fa *hem* + participi: *hem dinat*."

  - id: a2-07-007
    type: choice
    point: perfet
    lesson: 1
    prompt: "Aquesta setmana la Carla ___ dos viatges a Madrid."
    answer: "ha fet"
    distractors:
      - text: "han fet"
        why: "*Han* és per a «ells». «La Carla» és «ella»: *ha fet*."
      - text: "hem fet"
        why: "*Hem* és per a «nosaltres». «La Carla» és «ella»: *ha fet*."
    explanation: "«La Carla» és «ella»: el perfet fa *ha* + participi: *ha fet*."

  - id: a2-07-008
    type: choice
    point: perfet
    lesson: 1
    prompt: "Avui en Jordi i la Núria ___ en vaixell a Barcelona."
    answer: "han arribat"
    distractors:
      - text: "hem arribat"
        why: "*Hem* és per a «nosaltres». Aquí el subjecte és «ells»: *han arribat*."
      - text: "ha arribat"
        why: "*Ha* és singular. «En Jordi i la Núria» són dos: *han arribat*."
    explanation: "«En Jordi i la Núria» és «ells»: *han* + participi: *han arribat*."

  - id: a2-07-009
    type: match
    point: passat-perifrastic
    lesson: 1
    instruction: "Relaciona cada persona amb la forma del passat perifràstic."
    pairs:
      - ["jo", "vaig sortir"]
      - ["tu", "vas sortir"]
      - ["ella", "va sortir"]
      - ["nosaltres", "vam sortir"]
      - ["vosaltres", "vau sortir"]
      - ["ells", "van sortir"]
    explanation: "El perifràstic és *vaig, vas, va, vam, vau, van* + infinitiu."

  - id: a2-07-010
    type: match
    point: perfet
    lesson: 1
    instruction: "Relaciona cada persona amb la forma del perfet."
    pairs:
      - ["jo", "he sortit"]
      - ["tu", "has sortit"]
      - ["ell", "ha sortit"]
      - ["nosaltres", "hem sortit"]
      - ["vosaltres", "heu sortit"]
      - ["elles", "han sortit"]
    explanation: "El perfet és *he, has, ha, hem, heu, han* + participi."

  - id: a2-07-011
    type: inline-choice
    point: passat-perifrastic
    lesson: 1
    title: "Un dissabte a Tarragona"
    text: "Dissabte passat la Carla i jo {vam|van|vau} anar a Tarragona amb els nens. Jo {vaig|vas|vam} conduir tot el camí. La Carla {va|van|vam} comprar les entrades del museu. Després {vam|van|vau} dinar tots junts al port i els nens {van|vam|va} jugar una estona a la platja."
    explanation: "Amb «dissabte passat» fem servir el perifràstic: *vam anar*, *vaig conduir*, *va comprar*, *vam dinar*, *van jugar*."

  - id: a2-07-012
    type: inline-choice
    point: perfet
    lesson: 1
    title: "Aquest matí a l'aeroport"
    text: "Soc a l'aeroport. Són les vuit del matí i jo ja {he|has|ha} arribat. En Pau i jo {hem|han|heu} esmorzat al bar de la terminal. La Núria {ha|han|hem} comprat el diari. Els meus pares ja {han|hem|ha} pujat a l'avió. Jo encara no {he|ha|han} passat el control de seguretat. L'avió va ple de passatgers."
    explanation: "Amb «aquest matí» fem servir el perfet: *he arribat*, *hem esmorzat*, *ha comprat*, *han pujat*, *he passat*."

  - id: a2-07-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «perdre el tren»?"
    answer: "No arribar a temps per pujar al tren."
    distractors:
      - text: "Anar molt de pressa per l'andana."
        why: "Córrer per l'andana no és perdre el tren: és intentar no perdre'l."
      - text: "Canviar de tren a mig viatge."
        why: "Canviar de tren no és perdre'l: és continuar el viatge amb un altre tren."
    explanation: "*Perdre el tren* vol dir no arribar a temps per pujar al tren."

  # ---------- Lliçó 2 ----------
  - id: a2-07-014
    type: fill
    point: passat-perifrastic
    lesson: 2
    prompt: "Ahir ___ a peu fins a l'estació."
    hint: "*anar*, passat perifràstic, jo"
    answers: ["vaig anar", "jo vaig anar"]
    wrong_answers:
      - text: "vas anar"
        why: "*Vas* és per a «tu». Aquí el subjecte és «jo»: *vaig anar*."
      - text: "he anat"
        why: "Amb «ahir» fem servir el perifràstic, no el perfet: *vaig anar*."
    grading: tolerant
    explanation: "Amb «ahir» i el subjecte «jo»: *vaig anar*."

  - id: a2-07-015
    type: fill
    point: passat-perifrastic
    lesson: 2
    prompt: "La setmana passada la Fàtima ___ els bitllets per internet i va mirar l'horari."
    hint: "*comprar*, passat perifràstic"
    answers: ["va comprar"]
    wrong_answers:
      - text: "van comprar"
        why: "*Van* és per a «ells». «La Fàtima» és «ella»: *va comprar*."
      - text: "ha comprat"
        why: "Amb «la setmana passada» fem servir el perifràstic, no el perfet."
    grading: tolerant
    explanation: "«La Fàtima» és «ella», i «la setmana passada» és passat: *va comprar*."

  - id: a2-07-016
    type: fill
    point: passat-perifrastic
    lesson: 2
    prompt: "Dilluns passat, vosaltres ___ a l'aeroport molt d'hora."
    hint: "*arribar*, passat perifràstic"
    answers: ["vau arribar", "vàreu arribar"]
    wrong_answers:
      - text: "vam arribar"
        why: "*Vam* és per a «nosaltres». Amb «vosaltres»: *vau arribar*."
      - text: "heu arribat"
        why: "Amb «dilluns passat» fem servir el perifràstic, no el perfet."
    grading: tolerant
    explanation: "Amb «vosaltres»: *vau arribar*. *Vàreu arribar* també és correcte."

  - id: a2-07-017
    type: fill
    point: perfet
    lesson: 2
    prompt: "Avui ___ l'avió de les set, com sempre."
    hint: "*agafar*, perfet, jo"
    answers: ["he agafat", "jo he agafat"]
    wrong_answers:
      - text: "has agafat"
        why: "*Has* és per a «tu». Aquí el subjecte és «jo»: *he agafat*."
      - text: "vaig agafar"
        why: "Amb «avui» fem servir el perfet, no el perifràstic: *he agafat*."
    grading: tolerant
    explanation: "Amb «avui» i el subjecte «jo»: *he agafat*."

  - id: a2-07-018
    type: fill
    point: perfet
    lesson: 2
    prompt: "Aquest matí en Wei ___ tard a classe."
    hint: "*arribar*, perfet"
    answers: ["ha arribat"]
    wrong_answers:
      - text: "han arribat"
        why: "*Han* és per a «ells». «En Wei» és «ell»: *ha arribat*."
      - text: "va arribar"
        why: "Amb «aquest matí» fem servir el perfet, no el perifràstic."
    grading: tolerant
    explanation: "«En Wei» és «ell», i «aquest matí» demana el perfet: *ha arribat*."

  - id: a2-07-019
    type: fill
    point: perfet
    lesson: 2
    prompt: "Aquesta setmana ___ tres cops en tren a Barcelona, la Núria i jo."
    hint: "*anar*, perfet, nosaltres"
    answers: ["hem anat"]
    wrong_answers:
      - text: "han anat"
        why: "*Han* és per a «ells». «La Núria i jo» és «nosaltres»: *hem anat*."
      - text: "vam anar"
        why: "Amb «aquesta setmana» fem servir el perfet, no el perifràstic."
    grading: tolerant
    explanation: "«La Núria i jo» és «nosaltres»: *hem anat*."

  - id: a2-07-020
    type: order
    point: passat-perifrastic
    lesson: 2
    cue: "Digues que ahir vas visitar la teva àvia a Vic."
    chunks: ["ahir", "vaig visitar", "la meva àvia", "a Vic"]
    extra: ["he visitat"]
    answers:
      - "Ahir vaig visitar la meva àvia a Vic."
      - "Vaig visitar la meva àvia a Vic ahir."
    explanation: "Amb «ahir» fem servir el perifràstic: *vaig visitar*. *He visitat* és perfet."

  - id: a2-07-021
    type: order
    point: perfet
    lesson: 2
    cue: "Digues que aquest matí has perdut el tren de les vuit."
    chunks: ["aquest matí", "he perdut", "el tren", "de les vuit"]
    extra: ["vaig perdre"]
    answers:
      - "Aquest matí he perdut el tren de les vuit."
      - "He perdut el tren de les vuit aquest matí."
    explanation: "Amb «aquest matí» fem servir el perfet: *he perdut*. *Vaig perdre* és perifràstic."

  - id: a2-07-022
    type: order
    point: passat-perifrastic
    lesson: 2
    cue: "Digues que els teus pares van tornar de Menorca dissabte passat."
    chunks: ["els meus pares", "van tornar", "de Menorca", "dissabte passat"]
    extra: ["han tornat"]
    answers:
      - "Els meus pares van tornar de Menorca dissabte passat."
      - "Dissabte passat els meus pares van tornar de Menorca."
    explanation: "«Els meus pares» és «ells»: *van tornar*. *Han tornat* és perfet."

  - id: a2-07-023
    type: choice
    point: passat-perifrastic
    lesson: 2
    prompt: "___ vam baixar del metro a la parada del centre."
    answer: "Ahir"
    distractors:
      - text: "Demà"
        why: "*Demà* parla del futur. Amb el passat perifràstic cal un marcador de passat."
      - text: "Ara"
        why: "*Ara* parla del present. Amb el passat perifràstic cal un marcador de passat."
    explanation: "*Vam baixar* és passat perifràstic: necessita un marcador de passat, com *ahir*."

  - id: a2-07-024
    type: choice
    point: perfet
    lesson: 2
    prompt: "___ he dinat a l'aeroport."
    answer: "Avui"
    distractors:
      - text: "Ahir"
        why: "Amb «ahir» fem servir el perifràstic: *vaig dinar*. *He dinat* és perfet."
      - text: "La setmana passada"
        why: "Amb «la setmana passada» fem servir el perifràstic: *vaig dinar*."
    explanation: "*He dinat* és perfet: va amb *avui*, no amb *ahir*."

  - id: a2-07-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «fer un tomb»?"
    answer: "Passejar una estona, sense pressa."
    distractors:
      - text: "Córrer per no perdre el tren."
        why: "Això és anar de pressa. *Fer un tomb* és passejar sense pressa."
      - text: "Viatjar molt lluny de casa."
        why: "*Fer un tomb* és una passejada curta, no un viatge llarg."
    explanation: "*Fer un tomb* vol dir passejar una estona, sense pressa."

  - id: a2-07-026
    type: fill
    point: perfet
    lesson: 2
    prompt: "Aquest mes vosaltres ___ molt en avió per feina."
    hint: "*viatjar*, perfet"
    answers: ["heu viatjat"]
    wrong_answers:
      - text: "han viatjat"
        why: "*Han* és per a «ells». Amb «vosaltres»: *heu viatjat*."
      - text: "vau viatjar"
        why: "Amb «aquest mes» fem servir el perfet, no el perifràstic."
    grading: tolerant
    explanation: "«Aquest mes» demana el perfet. Amb «vosaltres»: *heu viatjat*."

  # ---------- Lliçó 3 ----------
  - id: a2-07-027
    type: choice
    point: participis-irregulars
    lesson: 3
    prompt: "Aquest matí he ___ la maleta de pressa."
    answer: "fet"
    distractors:
      - text: "fer"
        why: "Després de *he* va el participi, no l'infinitiu: *fet*."
      - text: "dit"
        why: "*Dit* és el participi de *dir*. De *fer* és *fet*."
    explanation: "El participi de *fer* és *fet*: *he fet la maleta*."

  - id: a2-07-028
    type: choice
    point: participis-irregulars
    lesson: 3
    prompt: "La Núria m'ha ___ que el vol porta retard."
    answer: "dit"
    distractors:
      - text: "dir"
        why: "Després de *ha* va el participi, no l'infinitiu: *dit*."
      - text: "parlat"
        why: "*Parlar* no porta *que* darrere: *m'ha dit que…*."
    explanation: "El participi de *dir* és *dit*: *m'ha dit que…*."

  - id: a2-07-029
    type: fill
    point: participis-irregulars
    lesson: 3
    prompt: "Avui ___ molt de fred al tren."
    hint: "*fer*, perfet, ell"
    answers: ["ha fet"]
    wrong_answers:
      - text: "ha fer"
        why: "Després de *ha* va el participi, no l'infinitiu: *ha fet*."
      - text: "va fer"
        why: "Amb «avui» fem servir el perfet, no el perifràstic: *ha fet*."
    grading: tolerant
    explanation: "«Avui» demana el perfet, i el participi de *fer* és *fet*: *ha fet*."

  - id: a2-07-030
    type: fill
    point: participis-irregulars
