  # ---------- Lliçó 5 ----------
  - id: a2-07-053
    type: reading
    point: passat-perifrastic
    lesson: 5
    title: "Un cap de setmana a Menorca"
    text: |
      Divendres passat vam agafar el vaixell a Barcelona. Vam pujar a bord amb les maletes i vam buscar els nostres seients. El vaixell va sortir amb una hora de retard, però el viatge va anar molt bé.

      Dissabte vam visitar Ciutadella amb un mapa de l'hotel. Vam dinar en un bar del port i a la tarda vam tornar a l'hotel en autobús. El conductor va dir que diumenge hi ha mercat al port.

      Diumenge vam fer un tomb pel mercat i vam comprar formatge. A la tarda vam tornar a Barcelona. Va ser un cap de setmana curt, però genial!
    questions:
      - prompt: "Com van anar a Menorca?"
        answer: "En vaixell, des de Barcelona."
        distractors:
          - text: "En avió, des de Barcelona."
            why: "El text diu que van agafar el vaixell."
          - text: "En autobús, des de Ciutadella."
            why: "L'autobús el van agafar a Menorca, per tornar a l'hotel."
      - prompt: "Què van fer dissabte?"
        answer: "Visitar Ciutadella i dinar al port."
        distractors:
          - text: "Comprar formatge al mercat."
            why: "Això ho van fer diumenge."
          - text: "Agafar el vaixell a Barcelona."
            why: "Això ho van fer divendres."
      - prompt: "Què va dir el conductor de l'autobús?"
        answer: "Que diumenge hi ha mercat."
        distractors:
          - text: "Que el bar del port era tancat."
            why: "El text no diu això: hi van dinar dissabte."
          - text: "Que diumenge no hi ha mercat."
            why: "Va dir el contrari: que sí que hi ha mercat."
      - prompt: "Quan van tornar a Barcelona?"
        answer: "Diumenge a la tarda."
        distractors:
          - text: "Dissabte a la tarda."
            why: "Dissabte a la tarda van tornar a l'hotel, no a Barcelona."
          - text: "Dilluns al matí."
            why: "El text diu que van tornar diumenge."
    explanation: "El text explica un cap de setmana a Menorca: el viatge en vaixell, la visita a Ciutadella i el mercat de diumenge."

