id: b2-47
level: B2
title: "Puntuació, majúscules i abreviatures"
summary: "La coma, els dos punts, el punt i coma, les cometes i el guió; les majúscules i les abreviatures dels textos formals."
vocabulary_theme: "Correspondència i textos formals"
points:
  - id: coma
    title: "La coma: vocatius, aclariments i enumeracions"
    refs:
      - label: "GEIEC: La puntuació"
        url: "https://geiec.iec.cat"
  - id: signes-puntuacio
    title: "Dos punts, punt i coma, cometes i guió"
    refs:
      - label: "GEIEC: La puntuació"
        url: "https://geiec.iec.cat"
  - id: majuscules-abreviatures
    title: "Majúscules i abreviatures"
    refs:
      - label: "GEIEC: La puntuació"
        url: "https://geiec.iec.cat"
  - id: sense-obertura
    title: "Compte amb el castellà: sense signes d'obertura"
    refs:
      - label: "GEIEC: La puntuació"
        url: "https://geiec.iec.cat"
  - id: expressions
    title: "Expressions de precisió"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: la coma i els signes"
  - title: "La coma, les majúscules i les abreviatures"
  - title: "Els signes i els interrogants"
  - title: "Produir: escriure amb la puntuació correcta"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la carta"
    definition: "Full o fulls escrits que s'envien a una persona."
    example: "Vaig rebre una carta del banc ahir."
  - word: "el correu electrònic"
    definition: "Missatge que s'envia per internet."
    example: "T'he enviat el rebut per correu electrònic."
  - word: "l'assumpte"
    definition: "Tema d'una carta o d'un correu, escrit a la capçalera."
    example: "A l'assumpte hi posa: confirmació de visita."
  - word: "la salutació"
    definition: "Paraules amb què comença una carta: «Benvolgut senyor…»."
    example: "La salutació d'una carta formal acaba amb dos punts."
  - word: "la factura"
    definition: "Paper on una empresa diu què has de pagar i quant."
    example: "La factura de la llum ha pujat molt."
  - word: "el rebut"
    definition: "Paper que demostra que has pagat una cosa."
    example: "Guarda el rebut del lloguer de cada mes."
  - word: "el termini"
    definition: "Temps màxim per fer una cosa."
    example: "El termini per presentar la sol·licitud acaba divendres."
  - word: "la sol·licitud"
    definition: "Paper amb què demanes una cosa a una empresa o a l'administració."
    example: "He omplert la sol·licitud d'ajuda."
  - word: "la reclamació"
    definition: "Queixa formal per demanar que es corregeixi un error."
    example: "Vaig posar una reclamació a l'empresa de llum."
  - word: "el formulari"
    definition: "Full amb caselles per omplir amb les teves dades."
    example: "Omple el formulari amb el teu nom i l'adreça."
  - word: "el certificat"
    definition: "Paper oficial que demostra una cosa."
    example: "Necessito un certificat de residència."
  - word: "la convocatòria"
    definition: "Avís que et cita a una reunió o a una prova."
    example: "He rebut la convocatòria de la reunió de dijous."
  - word: "l'expedient"
    definition: "Conjunt de papers d'un assumpte de l'administració."
    example: "El meu expedient encara està obert."
  - word: "el despatx"
    definition: "Habitació on treballa una persona en una oficina."
    example: "La directora m'espera al despatx."
  - word: "l'adreça"
    definition: "Carrer, número, pis i població on viu o és algú."
    example: "Escriu l'adreça completa al sobre."
  - word: "adjuntar"
    definition: "Enviar un document amb una carta o un correu."
    example: "Us adjunto el rebut en aquest correu."
  - word: "rebre"
    definition: "Arribar-te una carta, un correu o una visita."
    example: "Encara no he rebut resposta."
  - word: "respondre"
    definition: "Contestar una carta, un correu o una pregunta."
    example: "Responeu abans de divendres, si us plau."
  - word: "reclamar"
    definition: "Queixar-se formalment per un error."
    example: "Si la factura és incorrecta, pots reclamar."
  - word: "sol·licitar"
    definition: "Fer una petició formal a una empresa o a l'administració."
    example: "Vull sol·licitar hora per renovar el DNI."
  - word: "el pressupost"
    definition: "Càlcul de quant costarà una feina."
    example: "El fuster m'ha passat un pressupost de mil euros."
  - word: "l'acta"
    definition: "Paper on s'escriu què s'ha dit en una reunió."
    example: "La secretària escriu l'acta de cada reunió."
  - word: "el taulell"
    definition: "Taula llarga on atenen el públic en una oficina."
    example: "Deixa la sol·licitud al taulell de l'entrada."
  - word: "el funcionari, la funcionària"
    definition: "Persona que treballa per a l'administració."
    example: "Un funcionari em va ajudar a omplir el formulari."
  - word: "el segell"
    definition: "Marca oficial que es posa en un paper."
    example: "Aquest certificat porta el segell de l'Ajuntament."
  - word: "el codi postal"
    definition: "Número que identifica la zona d'una adreça."
    example: "El codi postal de Vic és 08500."
  - word: "el sobre"
    definition: "Funda de paper on es posa una carta."
    example: "Vaig tancar el sobre i hi vaig escriure l'adreça."
  - word: "la signatura"
    definition: "Nom escrit a mà al final d'un paper."
    example: "Posa la signatura a sota de la data."
  - word: "el tractament"
    definition: "Fórmula per adreçar-se a algú: «senyor», «senyora»."
    example: "En una carta formal, el tractament és «senyor» o «senyora»."
  - word: "l'abreviatura"
    definition: "Forma curta d'una paraula: «Sr.», «núm.»."
    example: "«Sr.» és l'abreviatura de «senyor»."
  - word: "el DNI"
    definition: "Document que identifica una persona."
    example: "Cal portar el DNI per entrar a l'examen."
  - word: "el contracte"
    definition: "Paper que fixa un acord entre dues parts."
    example: "Llegeix el contracte abans de signar-lo."
  - word: "la nòmina"
    definition: "Paper que detalla el sou de cada mes."
    example: "La nòmina de gener porta un error."
  - word: "el comptador"
    definition: "Aparell que mesura el consum de llum, aigua o gas."
    example: "El tècnic ha vingut a mirar el comptador."
  - word: "l'import"
    definition: "Quantitat de diners d'una factura."
    example: "L'import total és de dos-cents euros."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-47-001
    type: choice
    point: coma
    lesson: 1
    prompt: "Quina frase porta la coma del vocatiu?"
    answer: "Marta, vine a signar aquest pressupost."
    distractors:
      - text: "Marta vine a signar aquest pressupost."
        why: "«Marta» és el vocatiu, la persona a qui parles: cal separar-lo amb una coma."
      - text: "Marta; vine a signar aquest pressupost."
        why: "El vocatiu es marca amb una coma, no amb un punt i coma."
    explanation: "«Marta» és la persona a qui parles (el vocatiu): darrere del nom hi va una coma."

  - id: b2-47-002
    type: choice
    point: coma
    lesson: 1
    prompt: "Quina frase marca bé l'aclariment?"
    answer: "La directora, doctora Martí, signarà la carta demà."
    distractors:
      - text: "La directora doctora Martí signarà la carta demà."
        why: "«Doctora Martí» és un aclariment: cal posar-lo entre comes."
      - text: "La directora, doctora Martí signarà la carta demà."
        why: "L'aclariment s'obre i es tanca: falta la coma de darrere de «Martí»."
    explanation: "«Doctora Martí» aclareix qui és la directora: és un incís i va entre dues comes."

  - id: b2-47-003
    type: choice
    point: coma
    lesson: 1
    prompt: "Quina frase és correcta?"
    answer: "Els veïns que van venir van protestar per les obres."
    distractors:
      - text: "Els veïns que van venir, van protestar per les obres."
        why: "Entre el subjecte («els veïns que van venir») i el verb (*van protestar*) no hi va mai cap coma."
      - text: "Els veïns, que van venir van protestar per les obres."
        why: "Una sola coma trenca la frase: un incís aniria entre dues comes, i aquí «que van venir» identifica quins veïns, sense comes."
    explanation: "El subjecte sencer és «els veïns que van venir»: entre el subjecte i el verb no hi va una coma sola."

  - id: b2-47-004
    type: choice
    point: signes-puntuacio
    lesson: 1
    prompt: "Com comença una carta formal adreçada a la senyora Puig?"
    answer: "Benvolguda senyora Puig:"
    distractors:
      - text: "Benvolguda senyora Puig."
        why: "Darrere de la salutació d'una carta hi van els dos punts, no un punt."
      - text: "Benvolguda senyora Puig,"
        why: "La coma darrere de la salutació és un calc de l'anglès. En català hi van els dos punts."
    explanation: "La salutació d'una carta formal acaba amb els dos punts: *Benvolguda senyora Puig:*."

  - id: b2-47-005
    type: choice
    point: signes-puntuacio
    lesson: 1
    prompt: "Quina frase separa bé els elements de la llista?"
    answer: "A la reunió hi havia en Jordi, el president; la Laia, la secretària."
    distractors:
      - text: "A la reunió hi havia en Jordi, el president, la Laia, la secretària."
        why: "Amb només comes no se sap on acaba cada grup: quan els elements porten comes a dins, se separen amb punt i coma."
      - text: "A la reunió hi havia en Jordi: el president; la Laia: la secretària."
        why: "Els dos punts no separen elements d'una llista: introdueixen una llista o una explicació."
    explanation: "Cada grup («en Jordi, el president») porta una coma a dins: per això els grups se separen amb un punt i coma."

  - id: b2-47-006
    type: choice
    point: signes-puntuacio
    lesson: 1
    prompt: "Quina frase cita bé les paraules de la Laia?"
    answer: "La Laia va dir: «Vine demà a les nou»."
    distractors:
      - text: "La Laia va dir: Vine demà a les nou."
        why: "Les paraules textuals d'algú van entre cometes."
      - text: "La Laia va dir: «Vine» demà a les nou."
        why: "S'ha de citar tota la frase de la Laia, no només «Vine»."
    explanation: "Les paraules exactes de la Laia van entre cometes baixes."

  - id: b2-47-007
    type: match
    point: signes-puntuacio
    lesson: 1
    instruction: "Relaciona cada signe amb el seu ús."
    pairs:
      - ["els dos punts", "van darrere de la salutació d'una carta"]
      - ["el punt i coma", "separa els grups d'una llista amb comes"]
      - ["les cometes", "marquen les paraules exactes d'algú"]
      - ["el guió llarg", "marca cada intervenció d'un diàleg"]
      - ["l'interrogant", "es posa al final d'una pregunta"]
    explanation: "Cada signe té un ús concret: els dos punts obren, el punt i coma separa, les cometes citen, el guió marca el diàleg i l'interrogant tanca la pregunta."

  - id: b2-47-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["posar els punts sobre les is", "precisar les coses perquè no hi hagi dubtes"]
      - ["al peu de la lletra", "sense canviar ni una coma del que hi diu"]
      - ["dir-ho amb totes les lletres", "dir clarament allò que costa de dir"]
      - ["posar-ho negre sobre blanc", "un acord escrit en un paper"]
      - ["fil per randa", "explicant tots els detalls, un per un"]
    explanation: "Són expressions de la precisió: serveixen per parlar clar i per escrit."

  - id: b2-47-009
    type: inline-choice
    point: coma
    lesson: 1
    title: "Una nota per a en Pau"
    text: "Tinc dues cartes al calaix. Escolta{,|∅} Pau{,|∅} vine al despatx un moment. La carta{∅|,} que et vaig donar{∅|,} ja està signada. Truca a la Marta{,|∅} si us plau{,|∅} i digues-li que vingui."
    explanation: "«Pau» és el vocatiu i «si us plau» és un incís: van entre comes. «La carta que et vaig donar» identifica una carta d'entre dues: és una relativa especificativa i no porta cap coma."

  - id: b2-47-010
    type: inline-choice
    point: signes-puntuacio
    lesson: 1
    title: "Convocatòria de reunió"
    text: "La Laia va dir{:|,} «Porteu tres documents{:|.|,} el DNI, el contracte i l'última nòmina». A la reunió hi assistiran en Jordi, el president{;|,|:} la Laia, la secretària{;|,|:} en Pau, el tresorer."
    explanation: "Els dos punts introdueixen les paraules de la Laia i la llista de documents. Els tres grups de la llista porten una coma a dins: per això se separen amb un punt i coma."

  - id: b2-47-011
    type: fill
    point: coma
    lesson: 1
    prompt: "___ vine a portar aquest sobre a Correus."
    hint: "nom + coma del vocatiu: Marta"
    answers: ["Marta,"]
    wrong_answers:
      - text: "Marta"
        why: "«Marta» és el vocatiu: cal la coma darrere del nom."
    grading: strict
    explanation: "«Marta» és la persona a qui parles (el vocatiu): darrere del nom hi va una coma."

  - id: b2-47-012
    type: fill
    point: coma
    lesson: 1
    prompt: "___ us adjunto la factura del mes passat."
    hint: "connector + coma: a més"
    answers: ["A més,"]
    wrong_answers:
      - text: "A més"
        why: "«A més» obre la frase: darrere d'un connector inicial hi va una coma."
    grading: strict
    explanation: "«A més» és un connector a l'inici de la frase: darrere hi va una coma."

  - id: b2-47-013
    type: order
    point: coma
    lesson: 1
    cue: "Digues a la Marta que vingui a posar la signatura."
    chunks: ["Escolta,", "Marta,", "vine", "a posar", "la signatura"]
    extra: ["escolteu"]
    answers:
      - "Escolta, Marta, vine a posar la signatura."
      - "Marta, escolta, vine a posar la signatura."
    explanation: "«Marta» és el vocatiu: va entre comes. Pot anar després del verb *escolta* o al principi de la frase."

  # ---------- Lliçó 2 ----------
  - id: b2-47-014
    type: fill
    point: coma
    lesson: 2
    prompt: "___ us recordo que el termini acaba divendres."
    hint: "connector + coma: per cert"
    answers: ["Per cert,"]
    wrong_answers:
      - text: "Per cert"
        why: "Darrere d'un connector inicial hi va una coma: *Per cert,*."
    grading: strict
    explanation: "«Per cert» obre la frase: és un connector inicial i darrere hi va una coma."

  - id: b2-47-015
    type: fill
    point: majuscules-abreviatures
    lesson: 2
    prompt: "A l'atenció del ___, director de l'oficina."
    hint: "tractament abreujat + nom: senyor Rius"
    answers: ["Sr. Rius"]
    wrong_answers:
      - text: "Sr Rius"
        why: "*Sr.* s'escriu amb un punt al final."
      - text: "Sr, Rius"
        why: "*Sr.* porta un punt, no una coma."
    grading: strict
    explanation: "El tractament *senyor* s'abreuja *Sr.*, amb majúscula i amb un punt al final."

  - id: b2-47-016
    type: fill
    point: majuscules-abreviatures
    lesson: 2
    prompt: "L'expedient ___ ja està tancat."
    hint: "abreviatura + número: número 452"
    answers: ["núm. 452"]
    wrong_answers:
      - text: "num. 452"
        why: "*Número* porta accent: l'abreviatura és *núm.*, no *num.*."
      - text: "núm 452"
        why: "*Núm.* s'escriu amb un punt al final."
    grading: strict
    explanation: "«Número» s'abreuja *núm.*, en minúscula, amb accent i amb un punt al final."

  - id: b2-47-017
    type: fill
    point: majuscules-abreviatures
    lesson: 2
    prompt: "Visc al ___ Mallorca, 120."
    hint: "abreviatura de «carrer»"
    answers: ["c/", "c."]
    wrong_answers:
      - text: "car."
        why: "«Carrer» s'abreuja *c/* (o *c.*), no *car.*."
    grading: strict
    explanation: "«Carrer» s'abreuja *c/*, en minúscula i amb la barra inclinada. També s'admet *c.*."

  - id: b2-47-018
    type: fill
    point: coma
    lesson: 2
    prompt: "___ Marta, vine un moment al taulell."
    hint: "verb + coma: escolta"
    answers: ["Escolta,"]
    wrong_answers:
      - text: "Escolta"
        why: "Davant del vocatiu «Marta» hi va una coma."
    grading: strict
    explanation: "«Marta» és el vocatiu: davant del nom hi va una coma."

  - id: b2-47-019
    type: inline-choice
    point: majuscules-abreviatures
    lesson: 2
    title: "Avís de reunió"
    text: "La reunió de {maig|Maig} serà {dilluns|Dilluns} a {l'Ajuntament|l'ajuntament} de Girona. A la {primavera|Primavera} l'horari canvia."
    explanation: "Els dies, els mesos i les estacions van en minúscula (*dilluns*, *maig*, *primavera*). Les institucions van en majúscula (*l'Ajuntament*)."

  - id: b2-47-020
    type: choice
    point: majuscules-abreviatures
    lesson: 2
    prompt: "Expedient ___ 452 (sol·licitud d'ajuda)."
    answer: "núm."
    distractors:
      - text: "num."
        why: "*Número* porta accent: és *núm.*, no *num.*."
      - text: "n."
        why: "«Número» s'abreuja *núm.*, no *n.*."
    explanation: "«Número» s'abreuja *núm.*: en minúscula, amb accent i amb punt."

  - id: b2-47-021
    type: choice
    point: majuscules-abreviatures
    lesson: 2
    prompt: "Destinatària: ___, c/ Mallorca, 120, Girona."
    answer: "Sra. Martí"
    distractors:
      - text: "Sra Martí"
        why: "*Sra.* s'escriu amb un punt al final."
      - text: "Sra, Martí"
        why: "*Sra.* porta un punt, no una coma."
    explanation: "El tractament *senyora* s'abreuja *Sra.*, amb majúscula i amb un punt al final."

  - id: b2-47-022
    type: choice
    point: coma
    lesson: 2
    prompt: "Quina frase és correcta?"
    answer: "La carta que em vas enviar va arribar ahir."
    distractors:
      - text: "La carta que em vas enviar, va arribar ahir."
        why: "Entre el subjecte («la carta que em vas enviar») i el verb (*va arribar*) no hi va cap coma."
      - text: "La carta, que em vas enviar va arribar ahir."
        why: "Una sola coma trenca la frase: un incís aniria entre dues comes, mai amb una de sola."
    explanation: "El subjecte sencer és «la carta que em vas enviar»: entre el subjecte i el verb no hi va una coma sola."

  - id: b2-47-023
    type: order
    point: majuscules-abreviatures
    lesson: 2
    cue: "Escriu l'adreça amb l'abreviatura de «carrer»: vius al carrer de Mallorca, número 120."
    chunks: ["Visc", "al", "c/ Mallorca,", "120"]
    extra: ["carrer"]
    answers:
      - "Visc al c/ Mallorca, 120."
    explanation: "L'adreça s'escriu amb l'abreviatura *c/*: «Visc al *c/* Mallorca, 120.»"

  - id: b2-47-024
    type: order
    point: coma
    lesson: 2
    cue: "Digues que en Pau, que és el tresorer, revisarà l'acta dilluns."
    chunks: ["En Pau,", "el tresorer,", "revisarà", "l'acta", "dilluns"]
    extra: ["la tresorera"]
    answers:
      - "En Pau, el tresorer, revisarà l'acta dilluns."
      - "Dilluns, en Pau, el tresorer, revisarà l'acta."
    explanation: "«El tresorer» aclareix qui és en Pau: és un incís i va entre dues comes."

  - id: b2-47-025
    type: inline-choice
    point: majuscules-abreviatures
    lesson: 2
    title: "Dades de contacte"
    text: "El {Sr.|Sr} Rius us rebrà {dilluns|Dilluns} 12 de {gener|Gener} a la {pl.|Pl.|pl} Catalunya, 5. A l'{hivern|Hivern} l'oficina tanca a les sis. Truqueu al {tel.|tel|Tel.} 972 10 20 30. El codi postal és 17001."
    explanation: "Els tractaments abreujats porten punt (*Sr.*). Els dies, els mesos i les estacions van en minúscula (*dilluns*, *gener*, *hivern*). I les abreviatures, en minúscula i amb punt (*pl.*, *tel.*)."

  - id: b2-47-026
    type: find-error
    point: majuscules-abreviatures
    lesson: 2
    sentence: "La reunió és Dilluns a les tres."
    error: "Dilluns"
    fix: "dilluns"
    fix_distractors:
      - text: "Dilluns,"
        why: "El dia continua en majúscula, i a més aquí no hi cal cap coma."
      - text: "el proper Dilluns"
        why: "«Dilluns» continua en majúscula: els dies van en minúscula."
    explanation: "«Dilluns» va a mig de frase: els dies de la setmana van en minúscula (*dilluns*)."

  # ---------- Lliçó 3 ----------
  - id: b2-47-027
    type: inline-choice
    point: sense-obertura
    lesson: 3
    title: "Correu a la gestoria"
    text: "{Heu|¿Heu} rebut la carta{?|∅} Truqueu-me quan arribeu{!|∅} {Que|¿Que} tingueu un bon dia{!|∅}"
    explanation: "En català, les preguntes i les exclamacions no s'obren: «Heu rebut…?» es tanca amb *?* i «Truqueu-me…!» i «Que tingueu…!» es tanquen amb *!*."

  - id: b2-47-028
    type: inline-choice
    point: sense-obertura
    lesson: 3
    title: "Missatge a la Laia"
    text: "{Saps|¿Saps} quan acaba el termini{?|∅} {M'ho|¿M'ho} pots confirmar avui{?|∅} Moltes gràcies{!|∅}"
    explanation: "Les dues preguntes es tanquen amb *?* i no s'obren. «Moltes gràcies!» és una exclamació: es tanca amb *!*."

  - id: b2-47-029
    type: find-error
    point: sense-obertura
    lesson: 3
    sentence: "Heu rebut la carta del 12 de gener?"
    no_error: true
