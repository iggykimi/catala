  # ---------- Lliçó 5 ----------
  - id: b2-47-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una reclamació a l'empresa de llum"
    text: |
      Benvolgut senyor Rius:

      Li escric en relació amb la factura del mes de gener, que acabo de rebre. Soc clienta de la seva empresa des de fa tres anys i fins ara no havia tingut cap problema, però aquesta factura no és correcta.

      L'import és de dos-cents quaranta euros, quan la factura normal és de menys de seixanta. He trucat tres vegades al servei d'atenció al client i cada vegada m'han dit una cosa diferent. El primer operador em va dir que era una estimació; la segona, que era un error del comptador. La tercera em va penjar el telèfon. Ja es pot imaginar com em sento.

      He revisat les factures dels últims sis mesos i totes són d'entre quaranta i seixanta euros. El consum d'aquest gener ha estat normal: no he comprat cap aparell nou i he passat deu dies fora de casa per feina. Per això estic segura que la lectura del comptador no és correcta.

      A més, a la factura hi ha un concepte que no entenc: «servei de potència addicional». Ningú m'havia parlat mai d'aquest servei i no l'he contractat. Al final de la factura hi diu que puc reclamar en un termini de trenta dies, i és el que faig amb aquesta carta.

      Per tot això, li demano tres coses: que revisi la factura de gener, que m'enviï una factura nova amb l'import correcte i que em confirmi per escrit que no em cobrarà el «servei de potència addicional». Li adjunto una foto del comptador i les factures dels últims sis mesos.

      Resto a l'espera de la seva resposta.

      Atentament,

      Núria Vidal
    questions:
      - prompt: "Per què escriu la Núria al senyor Rius?"
        answer: "Perquè la factura de gener és molt més alta del normal."
        distractors:
          - text: "Perquè vol donar-se de baixa de l'empresa."
            why: "No parla de marxar de l'empresa: vol una factura correcta."
          - text: "Perquè fa tres anys que no paga la llum."
            why: "És clienta des de fa tres anys i fins ara no havia tingut cap problema."
      - prompt: "Què li van dir al servei d'atenció al client?"
        answer: "Tres respostes diferents, i l'última vegada li van penjar el telèfon."
        distractors:
          - text: "Que la factura era correcta i l'havia de pagar."
            why: "Ningú li va dir que fos correcta: li van donar tres respostes diferents."
          - text: "Que li enviarien una factura nova en trenta dies."
            why: "Els trenta dies són el termini per reclamar, no per rebre la factura."
      - prompt: "Què és el «servei de potència addicional»?"
        answer: "Un concepte de la factura que la Núria no ha contractat."
        distractors:
          - text: "Un servei nou que la Núria vol contractar."
            why: "No el vol: diu que no l'ha contractat i que no el vol pagar."
          - text: "Un descompte per als clients de més de tres anys."
            why: "No és cap descompte: és un càrrec que no entén."
      - prompt: "Què demana la Núria al final de la carta?"
        answer: "Una factura revisada, una de nova i una confirmació per escrit."
        distractors:
          - text: "Una cita amb el senyor Rius i una foto del comptador."
            why: "La foto l'adjunta ella, i no demana cap cita."
          - text: "Que li tornin els diners dels últims sis mesos."
            why: "Només reclama la factura de gener, no les anteriors."
    explanation: "La Núria reclama una factura de gener molt més alta del normal i demana que la revisin."

