  # ---------- Lliçó 5 ----------
  - id: b2-39-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una biòloga al Pirineu"
    text: |
      La Núria és biòloga i treballa en un centre de recerca del Pirineu on s'estudia el canvi climàtic. El centre, en el qual treballen vint persones, recull dades de les glaceres des de fa trenta anys. Cada mes, la Núria puja a prendre mostres de gel, cosa que a l'hivern fa amb raquetes de neu. L'aire atrapat en el gel des de fa segles, del qual s'analitza la composició, revela com era l'atmosfera del passat.

      L'any en què va arribar al centre, la Núria no sabia què esperar: venia d'un laboratori de Barcelona on tot era automatitzat. Aquí, en canvi, no hi ha res a donar per fet, perquè un dia de tempesta pot espatllar setmanes de feina. L'hivern passat, una allau va tallar la pista d'accés, cosa que va deixar l'equip aïllat durant cinc dies. Van haver de fondre neu per beure, tot i que tenien menjar de sobra.

      El que més li agrada de la feina és la calma del laboratori a primera hora, quan analitza les dades que ha recollit la setmana abans. Diu que cada bombolla d'aire és una carta del passat per a qui la sap llegir. El seu cap, amb qui comparteix el despatx, estudia els fòssils que apareixen quan el gel es retira.

      Aquest estiu presentaran els resultats en un congrés a Tromsø, una ciutat on a l'estiu no es fa mai de nit. La Núria hi presentarà un pòster amb què explicarà com el gel perd bombolles cada any, cosa que preocupa tot l'equip. Encara no sap com resumir-ho en cinc minuts, però recorda el refrany que li deia el seu avi: el saber no ocupa lloc.
    questions:
      - prompt: "On treballa la Núria?"
        answer: "En un centre de recerca del Pirineu que estudia el clima."
        distractors:
          - text: "En un laboratori automatitzat de Barcelona."
            why: "Allà treballava abans d'arribar al Pirineu."
          - text: "En una universitat de Tromsø, a Noruega."
            why: "A Tromsø hi anirà a un congrés, però no hi treballa."
      - prompt: "Què permet saber l'aire atrapat en el gel?"
        answer: "Com era l'atmosfera fa segles."
        distractors:
          - text: "Quan caurà la pròxima allau."
            why: "L'allau va tallar la pista, però el gel no prediu allaus."
          - text: "On hi ha fòssils per estudiar."
            why: "Els fòssils els estudia el seu cap quan el gel es retira."
      - prompt: "Què va passar l'hivern passat al centre?"
        answer: "Una allau va aïllar l'equip durant cinc dies."
        distractors:
          - text: "Es va espatllar el laboratori per la tempesta."
            why: "El text diu que una tempesta pot espatllar feina, però no que s'espatllés el laboratori."
          - text: "Es van perdre totes les mostres de gel."
            why: "El text no parla de mostres perdudes: diu que l'equip va quedar aïllat."
      - prompt: "Què farà la Núria al congrés de Tromsø?"
        answer: "Presentarà un pòster sobre les bombolles que perd el gel."
        distractors:
          - text: "Recollirà mostres de gel amb raquetes de neu."
            why: "Les mostres les recull al Pirineu, no al congrés."
          - text: "Escoltarà la ponència del seu cap sobre fòssils."
            why: "El text no diu que el seu cap hi faci cap ponència."
    explanation: "El text explica la feina de la Núria en un centre de recerca del Pirineu i la comunicació que prepara per a un congrés."

