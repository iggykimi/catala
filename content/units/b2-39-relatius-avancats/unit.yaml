id: b2-39
level: B2
title: "Relatius avançats"
summary: "Els relatius formals (el qual, cosa que, on i en què), el relatiu amb infinitiu i el calc «lo que», en textos de ciència i tecnologia."
vocabulary_theme: "Ciència i tecnologia"
points:
  - id: relatiu-qual
    title: "El qual, la qual i qui"
    refs:
      - label: "GEIEC: Les oracions de relatiu"
        url: "https://geiec.iec.cat"
  - id: cosa-que
    title: "Cosa que i la qual cosa"
    refs:
      - label: "GEIEC: Les oracions de relatiu"
        url: "https://geiec.iec.cat"
  - id: relatiu-infinitiu
    title: "El relatiu amb infinitiu"
    refs:
      - label: "GEIEC: Les oracions de relatiu"
        url: "https://geiec.iec.cat"
  - id: on-en-que
    title: "On i en què"
    refs:
      - label: "GEIEC: Les oracions de relatiu"
        url: "https://geiec.iec.cat"
  - id: compte-lo-que
    title: "Compte amb el castellà: *lo que*"
    refs:
      - label: "Optimot: El que"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Refranys amb relatius"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: el qual i cosa que"
  - title: "Practicar el qual i cosa que"
  - title: "L'infinitiu, on / en què i lo que"
  - title: "Produir: unir frases amb relatius"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la recerca"
    definition: "Estudi sistemàtic per descobrir coses noves."
    example: "La Laia fa recerca sobre el canvi climàtic."
  - word: "l'experiment"
    definition: "Prova que es fa per comprovar una hipòtesi."
    example: "L'experiment va durar tres setmanes."
  - word: "la hipòtesi"
    definition: "Idea que encara cal demostrar amb proves."
    example: "La hipòtesi inicial era equivocada."
  - word: "la mostra"
    definition: "Petita part d'una cosa que serveix per analitzar-la."
    example: "Van prendre mostres d'aigua del riu."
  - word: "el laboratori"
    definition: "Lloc amb aparells on es fan experiments."
    example: "El laboratori obre a les vuit del matí."
  - word: "el resultat"
    definition: "Allò que s'obté al final d'un experiment."
    example: "Els resultats confirmen la teoria."
  - word: "les dades"
    definition: "Informacions o xifres que es recullen per analitzar."
    example: "Les dades mostren un augment clar."
  - word: "el científic, la científica"
    definition: "Persona que fa recerca."
    example: "La científica va presentar l'estudi al congrés."
  - word: "l'article científic"
    definition: "Text on es publiquen els resultats d'una recerca."
    example: "Ha publicat un article en una revista anglesa."
  - word: "la conferència"
    definition: "Xerrada pública sobre un tema."
    example: "La conferència sobre l'espai va omplir la sala."
  - word: "el microscopi"
    definition: "Aparell per veure coses molt petites."
    example: "Amb el microscopi es veuen les cèl·lules."
  - word: "el telescopi"
    definition: "Aparell per observar els astres."
    example: "Amb el telescopi vam veure els anells de Saturn."
  - word: "el satèl·lit"
    definition: "Aparell que gira al voltant de la Terra i envia informació."
    example: "El satèl·lit passa per sobre nostre cada dia."
  - word: "la gravetat"
    definition: "Força que atrau els cossos cap a terra."
    example: "A la Lluna la gravetat és més petita."
  - word: "l'energia"
    definition: "Força que fa moure o funcionar les coses."
    example: "Aquesta casa funciona amb energia solar."
  - word: "la molècula"
    definition: "Part més petita d'una substància."
    example: "Una molècula d'aigua té dos àtoms d'hidrogen."
  - word: "la cèl·lula"
    definition: "Unitat més petita d'un ésser viu."
    example: "El cos humà té milions de cèl·lules."
  - word: "el gen"
    definition: "Part de l'ADN que determina un caràcter hereditari."
    example: "Aquest gen causa els ulls blaus."
  - word: "el fòssil"
    definition: "Resta d'un animal o una planta de fa milions d'anys."
    example: "Van trobar un fòssil de dinosaure."
  - word: "el clima"
    definition: "Conjunt de condicions del temps en un lloc."
    example: "El clima del país és cada cop més sec."
  - word: "el programari"
    definition: "Conjunt de programes d'un ordinador o un mòbil."
    example: "Cal actualitzar el programari cada mes."
  - word: "l'aplicació"
    definition: "Programa petit, sovint per al mòbil."
    example: "Hi ha una aplicació per regar les plantes."
  - word: "la intel·ligència artificial"
    definition: "Sistemes informàtics que fan tasques que semblen humanes."
    example: "La intel·ligència artificial ja tradueix llibres sencers."
  - word: "el robot"
    definition: "Màquina que fa una feina automàticament."
    example: "Un robot neteja el magatzem cada nit."
  - word: "la base de dades"
    definition: "Conjunt d'informació organitzada en un ordinador."
    example: "La biblioteca té una base de dades enorme."
  - word: "la xarxa"
    definition: "Sistema d'ordinadors connectats; també, internet."
    example: "La xarxa de la feina va molt lenta."
  - word: "la contrasenya"
    definition: "Paraula secreta per accedir a un compte."
    example: "Canvia la contrasenya cada tres mesos."
  - word: "l'enllaç"
    definition: "Text o imatge que duu a una altra pàgina d'internet."
    example: "T'envio l'enllaç de l'article."
  - word: "el fitxer"
    definition: "Document guardat en un ordinador."
    example: "Desa el fitxer abans de tancar el programa."
  - word: "desar"
    definition: "Guardar un fitxer en un ordinador."
    example: "Deso el document cada deu minuts."
  - word: "el senyal"
    definition: "Ona o llum que porta informació."
    example: "Aquí el senyal del mòbil és molt fluix."
  - word: "l'assaig"
    definition: "Prova per comprovar un aparell o un producte."
    example: "L'assaig de la vacuna va durar un any."
  - word: "l'invent"
    definition: "Aparell o mètode nou que crea algú."
    example: "L'invent de la Núria estalvia molta aigua."
  - word: "la vacuna"
    definition: "Medicament que protegeix d'una malaltia."
    example: "La nova vacuna es conserva a la nevera."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-39-001
    type: choice
    point: relatiu-qual
    lesson: 1
    prompt: "L'informe ___ parlem descriu un experiment amb cèl·lules mare."
    answer: "del qual"
    distractors:
      - text: "de que"
        why: "Darrere de preposició, *que* tot sol és incorrecte: *del qual* (o *de què*)."
      - text: "dels quals"
        why: "*El qual* concorda amb l'antecedent: «l'informe» és singular, *del qual*."
    explanation: "«L'informe» és una cosa i el verb és *parlar de*: darrere de la preposició, el relatiu és *del qual* (també *de què*)."

  - id: b2-39-002
    type: choice
    point: relatiu-qual
    lesson: 1
    prompt: "La investigadora ___ treballo ha guanyat una beca europea."
    answer: "amb qui"
    distractors:
      - text: "amb que"
        why: "*Que* no pot anar darrere de preposició: amb una persona, *amb qui*."
      - text: "amb què"
        why: "*Què* és per a coses. «La investigadora» és una persona: *amb qui*."
    explanation: "«La investigadora» és una persona: darrere de preposició, el relatiu de persona és *qui*."

  - id: b2-39-003
    type: choice
    point: cosa-que
    lesson: 1
    prompt: "L'assaig del coet va ser un èxit, ___ no esperava ningú."
    answer: "cosa que"
    distractors:
      - text: "lo qual"
        why: "*Lo qual* és un calc de «lo cual». En català: *cosa que* (o *la qual cosa*)."
      - text: "la cosa que"
        why: "La forma fixa no porta article: *cosa que* (o *la qual cosa*)."
    explanation: "*Cosa que* reprèn tota la frase anterior: l'èxit de l'assaig no l'esperava ningú."

  - id: b2-39-004
    type: choice
    point: cosa-que
    lesson: 1
    prompt: "Què vol dir «cosa que» a «Va nevar a l'abril, cosa que va sorprendre tothom»?"
    answer: "Que la nevada va sorprendre tothom."
    distractors:
      - text: "Que tothom esperava la nevada."
        why: "Al contrari: la frase diu que va sorprendre tothom, és a dir, que no s'esperava."
      - text: "Que la nevada va durar tot l'abril."
        why: "La frase no diu quant va durar la nevada."
    explanation: "*Cosa que* reprèn tota la frase anterior: la nevada va sorprendre tothom."

  - id: b2-39-005
    type: choice
    point: relatiu-qual
    lesson: 1
    prompt: "Les dades ___ partim són de l'any passat."
    answer: "de les quals"
    distractors:
      - text: "dels quals"
        why: "«Les dades» és femení plural, no masculí: *de les quals*."
      - text: "de que"
        why: "Darrere de preposició, *que* tot sol és incorrecte: *de les quals*."
    explanation: "*El qual* concorda amb l'antecedent: «les dades» és femení plural, *de les quals*."

  - id: b2-39-006
    type: match
    point: relatiu-qual
    lesson: 1
    instruction: "Relaciona cada nom amb el relatiu que hi concorda."
    pairs:
      - ["l'article científic", "sobre el qual"]
      - ["la hipòtesi", "de la qual"]
      - ["els resultats", "amb els quals"]
      - ["les mostres", "entre les quals"]
      - ["l'investigador", "amb qui"]
    explanation: "*El qual* concorda en gènere i nombre amb l'antecedent; per a persones, el relatiu és *qui*."

  - id: b2-39-007
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada refrany amb el seu significat."
    pairs:
      - ["a qui matina, Déu l'ajuda", "qui comença d'hora té més èxit"]
      - ["qui calla, atorga", "qui no protesta sembla que hi està d'acord"]
      - ["qui sembra vents, recull tempestats", "les males accions tenen conseqüències pitjors"]
      - ["el saber no ocupa lloc", "aprendre coses noves mai no fa nosa"]
    explanation: "Són refranys per donar consells; gairebé tots porten el relatiu *qui*."

  - id: b2-39-008
    type: inline-choice
    point: relatiu-qual
    lesson: 1
    title: "Resum d'un article"
    text: "Aquest és l'estudi {del qual|de que|de la qual} us parlava ahir. La tècnica {amb la qual|amb que|amb el qual} analitzem les mostres és nova. Els investigadors {amb qui|amb que|amb què} col·laborem són de la UAB. Les dades {de les quals|de que|dels quals} partim són públiques. Us passo l'enllaç de l'estudi."
    explanation: "Darrere de preposició fem servir *el qual* (que concorda), *què* per a coses i *qui* per a persones."

  - id: b2-39-009
    type: inline-choice
    point: cosa-que
    lesson: 1
    title: "La sonda va fallar"
    text: "La sonda va perdre el senyal a mitjanit, {cosa que|lo qual|la cosa que} va alarmar tot l'equip. Van provar de recuperar el fitxer durant tres hores, {cosa que|lo que|la cosa que} no va servir de res. Finalment, van descobrir un error al programari, {la qual cosa|lo qual|el qual cosa} explica la fallada."
    explanation: "Per reprendre tota una frase: *cosa que* o *la qual cosa* (formal). *Lo qual* i *lo que* són calcs."

  - id: b2-39-010
    type: fill
    point: relatiu-qual
    lesson: 1
    prompt: "El principi ___ es basa aquest invent és de fa dos segles."
    hint: "relatiu amb antecedent «el principi», verb *basar-se en*"
    answers: ["en el qual", "en què"]
    wrong_answers:
      - text: "en que"
        why: "El relatiu s'escriu amb accent: *en què* (o *en el qual*)."
      - text: "que"
        why: "El verb és *basar-se en*: cal mantenir la preposició."
    grading: strict
    explanation: "El verb és *basar-se en* i «el principi» és masculí: *en el qual* (o *en què*)."

  - id: b2-39-011
    type: fill
    point: cosa-que
    lesson: 1
    prompt: "Han tancat el laboratori una setmana, ___ ha endarrerit tots els experiments."
    hint: "relatiu que reprèn tota la frase anterior"
    answers: ["cosa que", "la qual cosa"]
    wrong_answers:
      - text: "lo qual"
        why: "*Lo qual* és un calc de «lo cual». En català: *cosa que*."
    grading: tolerant
    explanation: "La segona part comenta tota la frase anterior: *cosa que* (formalment *la qual cosa*)."

  - id: b2-39-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «El saber no ocupa lloc»?"
    answer: "Que aprendre coses noves mai no és un destorb."
    distractors:
      - text: "Que els llibres ocupen molt poc espai."
        why: "Aquest és el sentit literal; el refrany parla del coneixement, no de l'espai."
      - text: "Que cal oblidar el que no serveix."
        why: "És el contrari: el refrany diu que aprendre sempre és útil."
    explanation: "És un refrany: el coneixement no fa nosa, sempre hi cap."

  - id: b2-39-013
    type: order
    point: relatiu-qual
    lesson: 1
    cue: "Digues que l'article de què parleu estudia la intel·ligència artificial."
    chunks: ["L'article", "del qual", "parleu", "estudia", "la intel·ligència artificial"]
    extra: ["de que"]
    answers:
      - "L'article del qual parleu estudia la intel·ligència artificial."
    explanation: "El verb és *parlar de*: l'article *del qual* parleu. *De que* és incorrecte."

  # ---------- Lliçó 2 ----------
  - id: b2-39-014
    type: fill
    point: relatiu-qual
    lesson: 2
    prompt: "La llei ___ parlen tots els diaris protegeix les dades personals."
    hint: "relatiu: «la llei», *parlar de*"
    answers: ["de la qual", "de què"]
    wrong_answers:
      - text: "de que"
        why: "El relatiu s'escriu amb accent: *de què* (o *de la qual*)."
      - text: "que"
        why: "El verb és *parlar de*: cal mantenir la preposició."
    grading: strict
    explanation: "El verb és *parlar de* i «la llei» és femení: *de la qual* (o *de què*)."

  - id: b2-39-015
    type: fill
    point: relatiu-qual
    lesson: 2
    prompt: "Els enginyers ___ vaig dissenyar el gestor de contrasenyes treballen a Terrassa."
    hint: "relatiu de persona, *dissenyar amb*"
    answers: ["amb qui", "amb els quals"]
    wrong_answers:
      - text: "amb que"
        why: "Darrere de preposició, *que* tot sol és incorrecte."
      - text: "amb què"
        why: "*Què* és per a coses. Amb persones: *amb qui* o *amb els quals*."
    grading: tolerant
    explanation: "«Els enginyers» són persones: *amb qui* (o *amb els quals* en registre formal)."

  - id: b2-39-016
    type: order
    point: cosa-que
    lesson: 2
    cue: "L'ordinador es va espatllar i això va fer perdre totes les dades."
    chunks: ["L'ordinador", "es va espatllar", "cosa que", "va fer perdre", "totes les dades"]
    extra: ["lo qual"]
    answers:
      - "L'ordinador es va espatllar, cosa que va fer perdre totes les dades."
    explanation: "*Cosa que* reprèn tota la frase anterior: l'avaria va fer perdre les dades."

  - id: b2-39-017
    type: choice
    point: relatiu-qual
    lesson: 2
    prompt: "El programa ___ analitza les dades s'ha bloquejat."
    answer: "que"
    distractors:
      - text: "el qual"
        why: "Sense preposició ni comes, *el qual* és incorrecte: el subjecte és *que*."
      - text: "lo qual"
        why: "*Lo qual* és un calc de «lo cual». El subjecte és *que*."
    explanation: "El relatiu de subjecte sense preposició és *que*. *El qual* necessita una preposició (o comes, en registre formal)."

  - id: b2-39-018
    type: choice
    point: cosa-que
    lesson: 2
    prompt: "El termòmetre marcava quaranta graus, ___ va confirmar la sospita."
    answer: "la qual cosa"
    distractors:
      - text: "lo qual"
        why: "*Lo qual* és un calc de «lo cual». En català: *la qual cosa*."
      - text: "el qual cosa"
        why: "El mot *cosa* és femení: la forma fixa és *la qual cosa*."
    explanation: "*La qual cosa* reprèn tota la frase anterior i és invariable."

  - id: b2-39-019
    type: fill
    point: cosa-que
    lesson: 2
    prompt: "El satèl·lit envia fotos cada hora, ___ permet seguir la tempesta."
    hint: "relatiu que reprèn tota la frase anterior"
    answers: ["cosa que", "la qual cosa"]
    wrong_answers:
      - text: "lo que"
        why: "*Lo que* és un calc de «lo que». En català: *cosa que*."
    grading: tolerant
    explanation: "La segona part comenta tota la frase anterior: *cosa que* (o *la qual cosa*)."

  - id: b2-39-020
    type: order
    point: relatiu-qual
    lesson: 2
    cue: "Explica que analitzeu les molècules amb una tècnica nova."
    chunks: ["La tècnica", "amb la qual", "analitzem", "les molècules", "és nova"]
    extra: ["amb que"]
    answers:
      - "La tècnica amb la qual analitzem les molècules és nova."
    explanation: "«La tècnica» és femení: *amb la qual*. *Amb que* és incorrecte."

  - id: b2-39-021
    type: choice
    point: expressions
    lesson: 2
    prompt: "—El nen s'ha llevat a les sis per estudiar. —___"
    answer: "A qui matina, Déu l'ajuda."
    distractors:
      - text: "Qui calla, atorga."
        why: "Aquí ningú no calla: el nen s'ha llevat d'hora."
      - text: "El saber no ocupa lloc."
        why: "El refrany adient parla de matinar, no d'aprendre."
    explanation: "Llevar-se d'hora per estudiar és matinar: *a qui matina, Déu l'ajuda*."

  - id: b2-39-022
    type: fill
    point: relatiu-qual
    lesson: 2
    prompt: "L'edifici ___ treballo és del segle passat."
    hint: "relatiu de lloc: «l'edifici»"
    answers: ["on", "en què", "en el qual"]
    wrong_answers:
      - text: "que"
        why: "El relatiu de lloc no pot ser *que* tot sol: *on* o *en què*."
    grading: strict
    explanation: "«L'edifici» és un lloc: *on* (formalment *en què* o *en el qual*)."

  - id: b2-39-023
    type: choice
    point: relatiu-qual
    lesson: 2
    prompt: "La conferència ___ vaig assistir era sobre el clima."
    answer: "a la qual"
    distractors:
      - text: "a que"
        why: "Darrere de preposició, *que* tot sol és incorrecte: *a la qual*."
      - text: "al qual"
        why: "*El qual* concorda amb l'antecedent: «la conferència» és femení, *a la qual*."
    explanation: "*Assistir* regeix la preposició *a*: la conferència *a la qual* vaig assistir."

  - id: b2-39-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Quin refrany diries a algú que aprofita els trajectes per escoltar pòdcasts de ciència?"
    answer: "El saber no ocupa lloc."
    distractors:
      - text: "Qui calla, atorga."
        why: "Aquí ningú no calla: algú aprèn als trajectes."
      - text: "Qui sembra vents, recull tempestats."
        why: "Aquí no hi ha cap mala acció: algú aprofita el temps."
    explanation: "Aprofitar el temps per aprendre: *el saber no ocupa lloc*."

  - id: b2-39-025
    type: order
    point: relatiu-qual
    lesson: 2
    cue: "Van aprovar una llei i, a causa d'aquesta llei, el projecte es va aturar."
    chunks: ["Van aprovar", "una llei", "a causa de la qual", "el projecte", "es va aturar"]
    extra: ["a causa de que"]
    answers:
      - "Van aprovar una llei a causa de la qual el projecte es va aturar."
    explanation: "Darrere d'una locució prepositiva (*a causa de*), el relatiu és *la qual*, que concorda amb «una llei»."

  - id: b2-39-026
    type: choice
    point: relatiu-qual
    lesson: 2
    prompt: "El professor ___ vaig aprendre la llei de la gravetat es jubila enguany."
    answer: "de qui"
    distractors:
      - text: "de que"
        why: "Darrere de preposició, *que* tot sol és incorrecte: *de qui*."
      - text: "de què"
        why: "*Què* és per a coses. «El professor» és una persona: *de qui*."
    explanation: "El verb és *aprendre de* i «el professor» és una persona: *de qui*."

  # ---------- Lliçó 3 ----------
  - id: b2-39-027
    type: choice
    point: relatiu-infinitiu
    lesson: 3
    prompt: "Busco un despatx ___ treballar tranquil."
    answer: "on"
    distractors:
      - text: "que"
        why: "El relatiu de lloc no pot ser *que* tot sol: *on*."
      - text: "qui"
        why: "*Qui* és per a persones. Per a un lloc: *on*."
    explanation: "Amb infinitiu, el relatiu de lloc és *on*: un despatx *on* treballar."

  - id: b2-39-028
    type: choice
    point: relatiu-infinitiu
    lesson: 3
    prompt: "No sé ___ fer amb aquesta base de dades."
    answer: "què"
    distractors:
      - text: "que"
        why: "En pregunta indirecta, el pronom s'accentua: *què*."
      - text: "el que"
        why: "*El que fer* és incorrecte: amb infinitiu, *què fer*."
    explanation: "En les preguntes indirectes amb infinitiu: no sé *què* fer."

  - id: b2-39-029
    type: choice
    point: on-en-que
    lesson: 3
    prompt: "El poble ___ vaig néixer té un observatori amb un telescopi gegant."
    answer: "on"
    distractors:
      - text: "que"
        why: "El verb indica lloc (*néixer*): el relatiu és *on*, no *que*."
      - text: "en que"
        why: "S'escriu amb accent: *en què*. Amb un poble, el més habitual és *on*."
    explanation: "«El poble» és un lloc: *on* (formalment *en què*)."

  - id: b2-39-030
    type: choice
    point: on-en-que
    lesson: 3
    prompt: "Va ser una època ___ la ciència avançava molt de pressa."
    answer: "en què"
