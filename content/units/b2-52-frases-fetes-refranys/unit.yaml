  # ---------- Lliçó 5 ----------
  - id: b2-52-053
    type: reading
    point: comprensio
    lesson: 5
    title: "La festa major de Vilafranca"
    text: |
      Feia mesos que la colla castellera de Vilafranca preparava la festa major. L'any passat la pluja havia suspès l'actuació de la vigília i, a més, s'havia trencat el local d'assaig: havia plogut sobre mullat. Enguany, però, tot anava bé: els assajos eren plens i els nous castellers aprenien a posar-se la faixa de mica en mica.

      La Laia, que feia dos anys que era a la colla, estava pengim-penjam: no sabia si pujar al castell de vuit o quedar-se a la pinya. La cap de colla li va dir que no patís, que més val tard que mai, i que si no pujava enguany ja pujaria l'any vinent. Al final la Laia va fer el cor fort i va acceptar el repte.

      Dissabte al matí la cercavila va omplir els carrers: gegants, capgrossos, ball de bastons i trabucaires. A la tarda, a la plaça, la colla va descarregar el tres de vuit i el quatre de vuit. Entre un castell i l'altre, les gralles no paraven i el tabal marcava el ritme.

      A la nit, el correfoc va tancar la festa. La Montse, que havia organitzat la traca a correcuita perquè el proveïdor havia fallat, respirava tranquil·la: tot havia sortit bé. L'alcaldessa va llegir el pregó de cloenda i va recordar que la festa la fan els veïns, any rere any, amb calma i constància.

      Diumenge, la colla va dinar junta a la plaça. Van brindar pels castells descarregats i pels que vindran. Algú va dir que l'any passat havien estirat més el braç que la màniga amb el sopar, i tothom va riure: enguany cadascú havia portat un plat. A la tarda van ballar sardanes a la plaça.
    questions:
      - prompt: "Què va passar l'any passat?"
        answer: "La pluja va suspendre l'actuació i es va trencar el local."
        distractors:
          - text: "La colla no va fer castells perquè no tenia prou gent."
            why: "El text no diu això: parla de la pluja i del local trencat."
          - text: "La festa es va suspendre perquè no hi havia traca."
            why: "La traca és d'enguany: la Montse la va organitzar a correcuita."
      - prompt: "Per què dubtava la Laia?"
        answer: "Dubtava entre pujar al castell de vuit i quedar-se a la pinya."
        distractors:
          - text: "No sabia si anar a la cercavila o al correfoc."
            why: "La cercavila i el correfoc hi surten, però el dubte és pujar o quedar-se a la pinya."
          - text: "No sabia si pujar al tres de vuit o al quatre de vuit."
            why: "La colla va descarregar aquests dos castells, però el dubte de la Laia és pujar o quedar-se a la pinya."
      - prompt: "Què va fer la colla dissabte a la tarda?"
        answer: "Va descarregar dos castells de vuit a la plaça."
        distractors:
          - text: "Va fer la cercavila amb gegants i capgrossos."
            why: "La cercavila va ser dissabte al matí."
          - text: "Va organitzar el correfoc i la traca."
            why: "El correfoc va ser a la nit."
      - prompt: "Com va acabar la festa major?"
        answer: "Amb un dinar de la colla i brindis pels castells."
        distractors:
          - text: "Amb una discussió pel preu del sopar."
            why: "Del sopar car només en riuen: és una broma."
          - text: "Amb el pregó de l'alcaldessa a la plaça."
            why: "El pregó va ser dissabte a la nit, abans del dinar de diumenge."
    explanation: "El text explica com la colla de Vilafranca prepara i viu la festa major, de la cercavila al dinar de diumenge."

