  # ---------------- Lliçó 5 ----------------
  - id: b1-14-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Dissabte al mercat de Vic"
    text: |
      Cada dissabte, la Montse va al mercat de Vic amb la seva filla, la Laia. Hi arriben d'hora, perquè a les deu ja hi ha cua a totes les parades.

      Avui volen preparar un arròs de verdures per a vuit persones. A la parada del Pere, el fruiter, la Montse demana pebrots, però ell només en té un de vermell. En canvi, tomàquets n'hi ha de molts tipus, i la Montse en compra dos quilos. També agafa mitja dotzena de cebes.

      La Laia mira les cireres. Voldria comprar-ne per a les postres, però el Pere li explica que encara no n'hi ha cap: no arribaran fins d'aquí a dues setmanes. Llavors la Laia tria un meló dolç i el paga ella.

      A la carnisseria no compren gens de carn, perquè dos dels convidats són vegetarians. Quan passen per l'última parada, la Montse ja no pot portar res més a les mans.

      —Ja n'hi ha prou —diu rient—. Tornem a casa, que se'ns farà tard.

      Surten del mercat amb tres bosses plenes.
    questions:
      - prompt: "Què volen preparar la Montse i la Laia?"
        answer: "Un plat d'arròs amb verdures per a vuit convidats."
        distractors:
          - text: "Una sopa de tomàquet per a tota la família."
            why: "Compren tomàquets, però el plat que volen fer és un arròs."
          - text: "Un pastís de cireres per a les postres."
            why: "Les cireres no les poden comprar: encara no n'hi ha."
      - prompt: "Quants pebrots vermells té el Pere?"
        answer: "Només un."
        distractors:
          - text: "Dos quilos."
            why: "Els dos quilos són de tomàquets."
          - text: "Mitja dotzena."
            why: "Mitja dotzena és la quantitat de cebes."
      - prompt: "Per què la Laia no compra cireres?"
        answer: "Perquè el fruiter encara no en té."
        distractors:
          - text: "Perquè ja ha comprat un meló dolç."
            why: "Tria el meló després d'haver sabut que no hi ha cireres."
          - text: "Perquè el Pere només en té de vermelles."
            why: "El que només té de vermell són els pebrots, no les cireres."
      - prompt: "Per què no compren carn?"
        answer: "Perquè dos convidats no en mengen."
        distractors:
          - text: "Perquè la carnisseria és tancada."
            why: "El text no diu que sigui tancada."
          - text: "Perquè ja porten massa bosses."
            why: "Les bosses les porten en acabar, i no és el motiu."
    explanation: "El text explica què compren la Montse i la Laia i per què no compren cireres ni carn."

