  # ---------- Lliçó 5 ----------
  - id: a2-02-053
    type: reading
    point: concordanca
    lesson: 5
    title: "La família de la Núria"
    text: |
      La Núria viu a Granollers amb la seva mare, la Rosa, i els seus dos germans. La Rosa és alta i prima, i té els cabells llargs i castanys. És molt treballadora: té una botiga de roba i l'obre cada dia a les nou.

      El germà gran, l'Arnau, és baix i una mica tímid, però molt simpàtic. Treballa de cuiner en un restaurant del centre. El germà petit, en Pau, només té catorze anys. Té els ulls verds i sempre està alegre.

      Els diumenges dinen tots a casa de l'àvia, que és una dona amable i generosa. Les cosines de la Núria també hi van, i la casa s'omple de gent.
    questions:
      - prompt: "Com és la mare de la Núria?"
        answer: "Alta i prima, de cabells llargs."
        distractors:
          - text: "Baixa i una mica tímida."
            why: "Això descriu l'Arnau, el germà gran."
          - text: "Jove, amb els ulls verds."
            why: "Els ulls verds són d'en Pau."
      - prompt: "Quina feina fa l'Arnau?"
        answer: "Cuina en un restaurant del centre."
        distractors:
          - text: "Té una botiga de roba."
            why: "La botiga és de la Rosa, la mare."
          - text: "És cambrer en un restaurant."
            why: "El text diu que és cuiner, no cambrer."
      - prompt: "Quan dinen tots a casa de l'àvia?"
        answer: "Els diumenges."
        distractors:
          - text: "Els dissabtes."
          - text: "Cada dia."
      - prompt: "Com és en Pau?"
        answer: "Té els ulls verds i està alegre."
        distractors:
          - text: "És baix i tímid, i cuina."
            why: "Això descriu l'Arnau."
          - text: "És alt i té una botiga."
            why: "La botiga és de la mare, que és alta i treballadora."
    explanation: "El text descriu la família de la Núria: observa com concorden els adjectius amb cada persona."

