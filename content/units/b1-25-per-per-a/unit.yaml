  # ---------------- Lliçó 5 ----------------
  - id: b1-25-054
    type: reading
    point: comprensio
    lesson: 5
    title: "Un cap de setmana a Menorca"
    text: |
      La Carla i en Marc volen passar un cap de setmana a Menorca. Han reservat els bitllets per internet: surten divendres a les set del matí i tornen diumenge al vespre.

      Divendres es lleven a les cinc. De camí a l'aeroport, passen per Santa Coloma sense aturar-se. A la porta d'embarcament, porten el passaport i la targeta d'embarcament a la mà. Una hostessa els diu que l'avió porta una hora de retard per la boira. «Per fi sortim!», diu en Marc quan embarquen.

      A Maó, un taxi els porta a l'hotel. L'habitació és per a dues persones i té vistes al port. Per cert, l'hotel no té ascensor, però només han de pujar un pis. A la recepció, demanen un mapa per a l'excursió de dissabte.

      Dissabte fan una excursió amb un vaixell petit. L'avió anava ple de turistes, però el vaixell va mig buit. La guia parla a poc a poc i explica històries de pescadors. La Carla es mareja i en Marc li dona una pastilla per al mareig. El preu del bitllet és vint euros. Diumenge compren formatge per a tota la família i tornen a casa contents.
    questions:
      - prompt: "Com han comprat els bitllets de l'avió?"
        answer: "Per internet, abans del viatge."
        distractors:
          - text: "A l'aeroport, el dia del vol."
            why: "Quan arriben a l'aeroport, els bitllets ja estan reservats."
          - text: "A la recepció de l'hotel."
            why: "A la recepció demanen un mapa, no els bitllets."
      - prompt: "Per què l'avió surt amb retard?"
        answer: "Per la boira."
        distractors:
          - text: "Perquè els turistes arriben tard."
            why: "El text no diu que els turistes arribin tard."
          - text: "Perquè a Maó fa mal temps."
            why: "La boira és a la sortida, no a Maó."
      - prompt: "Què li passa a la Carla dissabte?"
        answer: "Es mareja al vaixell i pren una pastilla."
        distractors:
          - text: "Perd el mapa de l'excursió."
            why: "El mapa el demanen divendres i el text no diu que el perdin."
          - text: "Compra formatge per a la família."
            why: "El formatge el compren diumenge, no dissabte."
      - prompt: "Com és l'hotel?"
        answer: "No té ascensor i l'habitació té vistes al port."
        distractors:
          - text: "Té ascensor i és al port."
            why: "L'hotel no té ascensor; el que dona al port són les vistes."
          - text: "És a Santa Coloma, de camí a l'aeroport."
            why: "Per Santa Coloma només hi passen; l'hotel és a Maó."
    explanation: "El text explica el viatge de la Carla i en Marc: el retard per la boira, l'hotel de Maó i l'excursió amb vaixell."

