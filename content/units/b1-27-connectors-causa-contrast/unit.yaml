id: b1-27
level: B1
title: "Connectors de causa, conseqüència i contrast"
summary: "Aprens a enllaçar idees amb *perquè*, *com que* i *ja que* (causa), *per tant*, *així que*, *de manera que* i *doncs* (conseqüència), i *però*, *sinó*, *en canvi*, *tot i que* i *encara que* (contrast)."
vocabulary_theme: "Educació i estudis"
points:
  - id: connectors-causa
    title: "La causa: *perquè*, *com que* i *ja que*"
    refs:
      - label: "GEIEC: Les conjuncions"
        url: "https://geiec.iec.cat"
  - id: connectors-consequencia
    title: "La conseqüència: *per tant*, *així que*, *de manera que* i *doncs*"
    refs:
      - label: "GEIEC: Les conjuncions"
        url: "https://geiec.iec.cat"
  - id: connectors-contrast
    title: "El contrast: *però*, *sinó*, *en canvi*, *tot i que* i *encara que*"
    refs:
      - label: "GEIEC: Les conjuncions"
        url: "https://geiec.iec.cat"
  - id: compte-castella-doncs
    title: "Compte amb el castellà: *doncs* no dona una causa"
  - id: expressions
    title: "Expressions per enllaçar idees"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "La causa i la conseqüència"
  - title: "Practiquem: causes i resultats"
  - title: "El contrast i el *doncs*"
  - title: "Produïm: tot junt"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'examen"
    definition: "Prova escrita o oral per comprovar què ha après un alumne."
    example: "L'examen de matemàtiques és dijous a primera hora."
  - word: "l'apunt"
    definition: "Nota que un alumne escriu a classe per estudiar després."
    example: "Em deixes els apunts de la lliçó d'ahir?"
  - word: "el professor, la professora"
    definition: "Persona que ensenya una assignatura a l'institut o a la universitat."
    example: "La professora d'història explica molt bé."
  - word: "l'alumne, l'alumna"
    definition: "Persona que estudia en una escola o un institut."
    example: "Tots els alumnes han lliurat el treball."
  - word: "la classe"
    definition: "Lliçó que fa un professor, o grup d'alumnes que estudien junts."
    example: "La classe de ciències comença a les nou."
  - word: "l'aula"
    definition: "Sala d'una escola on es fan les classes."
    example: "La nostra aula és al segon pis."
  - word: "el pati"
    definition: "Espai obert d'una escola on els alumnes surten a l'hora del descans."
    example: "A l'hora del pati juguem a futbol."
  - word: "el passadís"
    definition: "Corredor llarg que porta a les aules."
    example: "No corregueu pel passadís."
  - word: "la biblioteca"
    definition: "Lloc on es poden llegir i demanar llibres en préstec."
    example: "Estudio a la biblioteca perquè a casa hi ha soroll."
  - word: "el gimnàs"
    definition: "Sala gran d'una escola per fer esport."
    example: "La festa de final de curs serà al gimnàs."
  - word: "la nota"
    definition: "Qualificació que un alumne treu en un examen o un treball."
    example: "Ha tret molt bona nota en anglès."
  - word: "l'assignatura"
    definition: "Cadascuna de les matèries que s'estudien en un curs."
    example: "La meva assignatura preferida és la biologia."
  - word: "les matemàtiques"
    definition: "Assignatura dels nombres, les operacions i els problemes."
    example: "Les matemàtiques em costen més que la història."
  - word: "la història"
    definition: "Assignatura que estudia el passat de les persones i els països."
    example: "A història estudiem l'edat mitjana."
  - word: "les ciències"
    definition: "Assignatures que estudien la natura: física, química i biologia."
    example: "Al laboratori fem pràctiques de ciències."
  - word: "dibuixar"
    definition: "Fer figures amb un llapis o un pinzell sobre un paper."
    example: "Al meu fill li agrada dibuixar animals."
  - word: "el batxillerat"
    definition: "Estudis de dos cursos abans de la universitat."
    example: "Faré el batxillerat científic a l'institut del barri."
  - word: "la universitat"
    definition: "Centre on s'estudien els graus després del batxillerat."
    example: "Vol entrar a la universitat l'any que ve."
  - word: "el cicle"
    definition: "Estudis de formació professional, més pràctics que el batxillerat."
    example: "Fa un cicle de grau mitjà d'informàtica."
  - word: "la beca"
    definition: "Diners que un alumne rep per estudiar."
    example: "Li han donat una beca per les bones notes."
  - word: "la matrícula"
    definition: "Inscripció oficial en un curs o uns estudis."
    example: "La matrícula del curs vinent obre al maig."
  - word: "el curs"
    definition: "Any d'estudis, o conjunt de classes d'una matèria."
    example: "Repeteixo el curs perquè he suspès quatre assignatures."
  - word: "l'avaluació"
    definition: "Valoració del que ha après un alumne en un trimestre."
    example: "Aquesta avaluació he aprovat totes les assignatures."
  - word: "el company, la companya"
    definition: "Persona que estudia o treballa amb tu."
    example: "La meva companya de classe m'ajuda amb els deures."
  - word: "el tutor, la tutora"
    definition: "Professor que s'encarrega d'un grup d'alumnes."
    example: "Parla amb el tutor si tens cap problema."
  - word: "el director, la directora"
    definition: "Persona que dirigeix una escola o un institut."
    example: "La directora ha convocat una reunió de pares."
  - word: "estudiar"
    definition: "Aprendre una matèria llegint i practicant."
    example: "Estudia cada tarda a la biblioteca."
  - word: "aprendre"
    definition: "Arribar a saber una cosa que no sabies."
    example: "Vull aprendre a tocar la guitarra."
  - word: "aprovar"
    definition: "Treure una nota prou bona en un examen o un curs."
    example: "Si estudies, aprovaràs sense problemes."
  - word: "suspendre"
    definition: "No arribar a la nota mínima en un examen o un curs."
    example: "Ha suspès perquè no va estudiar gens."
  - word: "repetir"
    definition: "Tornar a fer un curs que no s'ha aprovat."
    example: "No vull repetir: estudiaré tot l'estiu."
  - word: "lliurar"
    definition: "Donar un treball o un examen al professor."
    example: "Hem de lliurar el treball divendres."
  - word: "la pissarra"
    definition: "Superfície gran on el professor escriu a classe."
    example: "La professora ha escrit els deures a la pissarra."
  - word: "el guix"
    definition: "Barreta blanca per escriure a la pissarra."
    example: "No queda guix: escriuré amb el retolador."
  - word: "el projector"
    definition: "Aparell que mostra imatges grans en una pantalla."
    example: "El projector no funciona: truqueu al conserge."
  - word: "l'expedient"
    definition: "Conjunt de les notes d'un alumne durant els estudis."
    example: "Amb aquest expedient entrarà a medicina."
  - word: "el justificant"
    definition: "Paper que explica per què un alumne no ha anat a classe."
    example: "Porta el justificant del metge a secretaria."
  - word: "el delegat, la delegada"
    definition: "Alumne que representa la classe davant dels professors."
    example: "La delegada ha demanat canviar la data de l'examen."
  - word: "la vaga"
    definition: "Dia que els treballadors o els alumnes no van a la feina o a classe per protestar."
    example: "Demà hi ha vaga de busos: anirem a peu."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-27-001
    type: choice
    point: connectors-causa
    lesson: 1
    prompt: "—Per què estudies medicina? —___ vull ser metgessa."
    answer: "Perquè"
    distractors:
      - text: "Per què"
        why: "*Per què*, en dues paraules, serveix per preguntar. Aquí responem la pregunta: *perquè*."
      - text: "Però"
        why: "*Però* indica un contrast. «Vull ser metgessa» és la causa: *perquè*."
    explanation: "«Per què» pregunta i *perquè* respon: «vull ser metgessa» és la causa."

  - id: b1-27-002
    type: choice
    point: connectors-causa
    lesson: 1
    prompt: "___ plovia molt, la professora va fer la classe al gimnàs."
    answer: "Com que"
    distractors:
      - text: "Per què"
        why: "*Per què* només serveix per preguntar, i aquí no hi ha cap pregunta."
      - text: "Però"
        why: "*Però* indica un contrast. «Plovia molt» és la causa de fer la classe al gimnàs."
      - text: "Així que"
        why: "*Així que* va davant del resultat. Aquest buit va davant de la causa: *com que*."
    explanation: "«Plovia molt» és una causa coneguda al principi de la frase: *com que*."

  - id: b1-27-003
    type: choice
    point: connectors-causa
    lesson: 1
    prompt: "___ has aprovat el batxillerat, pots demanar la beca."
    answer: "Ja que"
    distractors:
      - text: "Per què"
        why: "*Per què* només serveix per preguntar, i aquí no hi ha cap pregunta."
      - text: "Tot i que"
        why: "*Tot i que* indica un contrast. Haver aprovat és la causa que permet demanar la beca."
    explanation: "«Has aprovat el batxillerat» és una causa coneguda: *ja que*."

  - id: b1-27-004
    type: choice
    point: connectors-consequencia
    lesson: 1
    prompt: "L'Ibrahim ha suspès tres assignatures; ___, haurà de repetir el curs."
    answer: "per tant"
    distractors:
      - text: "perquè"
        why: "*Perquè* dona una causa. «Haurà de repetir» és la conseqüència: *per tant*."
      - text: "però"
        why: "*Però* indica un contrast, i aquí un fet és el resultat de l'altre."
    explanation: "«Haurà de repetir el curs» és el resultat de suspendre: *per tant*."

  - id: b1-27-005
    type: choice
    point: connectors-consequencia
    lesson: 1
    prompt: "No quedaven places a la biblioteca, ___ vam estudiar al bar."
    answer: "així que"
    distractors:
      - text: "perquè"
        why: "*Perquè* donaria la causa. «Vam estudiar al bar» és el resultat."
      - text: "com que"
        why: "*Com que* va al principi, davant de la causa. El buit va davant del resultat: *així que*."
    explanation: "«Vam estudiar al bar» és el resultat de no tenir places: *així que*."

  - id: b1-27-006
    type: choice
    point: connectors-consequencia
    lesson: 1
    prompt: "Què vol dir «La Laia estudiava de nit, de manera que treia males notes»?"
    answer: "Treia males notes perquè estudiava de nit."
    distractors:
      - text: "Estudiava de nit perquè treia males notes."
        why: "Això inverteix la frase: la causa és estudiar de nit, i el resultat, les males notes."
      - text: "Estudiava de nit encara que treia males notes."
        why: "*De manera que* no indica un contrast, sinó un resultat."
    explanation: "*De manera que* introdueix el resultat: estudiar de nit va causar les males notes."

  - id: b1-27-007
    type: choice
    point: connectors-consequencia
    lesson: 1
    prompt: "L'examen és demà. Cal repassar, ___."
    answer: "doncs"
    distractors:
      - text: "perquè"
        why: "*Perquè* necessita una frase amb verb darrere. Al final de la frase, la conseqüència és *doncs*."
      - text: "ja que"
        why: "*Ja que* dona una causa amb verb. Aquí tanquem amb la conseqüència: *doncs*."
    explanation: "«Cal repassar» és la conseqüència de tenir examen: *doncs*, darrere del verb."

  - id: b1-27-008
    type: match
    point: connectors-causa
    lesson: 1
    instruction: "Relaciona cada principi amb el seu final."
    pairs:
      - ["Com que neva molt", "l'institut ha tancat dos dies"]
      - ["Ja que tens els apunts", "em pots dir què entra a l'examen?"]
      - ["La Núria estudia anglès", "perquè vol fer un màster a Londres"]
      - ["En Pau no ha vingut a classe", "perquè té febre"]
    explanation: "Cada causa va amb el seu resultat: *com que* i *ja que* al principi, *perquè* darrere."

  - id: b1-27-009
    type: match
    point: connectors-consequencia
    lesson: 1
    instruction: "Relaciona cada fet amb el seu resultat."
    pairs:
      - ["No entenia els exercicis", "per tant va demanar ajuda al tutor"]
      - ["S'ha espatllat el projector", "així que farem l'examen en paper"]
      - ["Va copiar a l'examen", "de manera que el van suspendre"]
      - ["Demà hi ha vaga de busos", "les classes començaran més tard, doncs"]
    explanation: "Cada fet va amb el seu resultat: *per tant*, *així que*, *de manera que* i *doncs*."

  - id: b1-27-010
    type: inline-choice
    point: connectors-causa
    lesson: 1
    title: "Un correu al tutor"
    text: "Benvolgut tutor: {Per què|Perquè} no vaig venir ahir a classe? {Perquè|Per què} tenia metge. {Com que|Tot i que} tinc el justificant, us l'adjunto. {Ja que|Tot i que} demà hi ha examen, voldria saber què entra. Gràcies, Arnau."
    explanation: "La pregunta és *per què* i la resposta, *perquè*. Les dues causes conegudes porten *com que* i *ja que*."

  - id: b1-27-011
    type: inline-choice
    point: connectors-consequencia
    lesson: 1
    title: "Avís a l'aula"
    text: "L'aula era buida, {per tant|perquè}, hi hem entrat. El guix s'ha acabat, {així que|com que} la Carla anirà a buscar-ne. La Carla ha explicat molt bé el tema, {de manera que|perquè} tothom l'ha entès. Us ho preguntarem a l'examen; estudieu-ho, {doncs|perquè}."
    explanation: "Els quatre buits són resultats: *per tant*, *així que*, *de manera que* i *doncs*."

  - id: b1-27-012
    type: fill
    point: connectors-causa
    lesson: 1
    prompt: "___ tens el llibre, em pots dir què entra a l'examen?"
    hint: "connector de causa coneguda"
    answers: ["Ja que", "Com que"]
    wrong_answers:
      - text: "Per què"
        why: "*Per què* només serveix per preguntar, i aquí no hi ha cap pregunta."
    grading: tolerant
    explanation: "«Tens el llibre» és una causa coneguda al principi: *ja que* o *com que*."

  - id: b1-27-013
    type: fill
    point: connectors-consequencia
    lesson: 1
    prompt: "L'aula era plena, ___ vam seure al passadís."
    hint: "connector de conseqüència"
    answers: ["per tant", "així que", "de manera que"]
    wrong_answers:
      - text: "perquè"
        why: "*Perquè* donaria la causa. «Vam seure al passadís» és el resultat."
      - text: "ja que"
        why: "*Ja que* dona una causa. Aquí cal el resultat: *per tant* o *així que*."
    grading: tolerant
    explanation: "«Vam seure al passadís» és el resultat: *per tant*, *així que* o *de manera que*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-27-014
    type: choice
    point: connectors-causa
    lesson: 2
    prompt: "—___ has suspès? —No havia estudiat prou."
    answer: "Per què"
    distractors:
      - text: "Perquè"
        why: "*Perquè*, en una paraula, dona la causa. La pregunta és *per què*."
      - text: "Com que"
        why: "*Com que* presenta una causa coneguda, no fa una pregunta."
    explanation: "És una pregunta: *per què*, en dues paraules."

  - id: b1-27-015
    type: choice
    point: connectors-causa
    lesson: 2
    prompt: "La Montse fa classes de repàs ___ li costa aprovar les matemàtiques."
    answer: "perquè"
    distractors:
      - text: "per què"
        why: "*Per què* només pregunta. Aquí donem la causa: *perquè*."
      - text: "per tant"
        why: "*Per tant* donaria el resultat. «Li costa aprovar» és la causa de fer repàs."
    explanation: "«Li costa aprovar» és la causa de fer classes de repàs: *perquè*."

  - id: b1-27-016
    type: choice
    point: connectors-consequencia
    lesson: 2
    prompt: "En Wei no ha lliurat el treball, ___, ha suspès l'avaluació."
    answer: "per tant"
    distractors:
      - text: "perquè"
        why: "*Perquè* donaria la causa. «Ha suspès» és el resultat de no lliurar el treball."
      - text: "ja que"
        why: "*Ja que* dona una causa. Aquí cal el resultat: *per tant*."
    explanation: "«Ha suspès l'avaluació» és el resultat: *per tant*."

  - id: b1-27-017
    type: choice
    point: connectors-consequencia
    lesson: 2
    prompt: "Hem perdut l'autobús; ___ arribarem tard a l'examen."
    answer: "així que"
    distractors:
      - text: "perquè"
        why: "*Perquè* donaria la causa. «Arribarem tard» és el resultat."
      - text: "tot i que"
        why: "*Tot i que* indica un contrast. Arribar tard és el resultat de perdre l'autobús."
    explanation: "«Arribarem tard» és el resultat: *així que*."

  - id: b1-27-018
    type: fill
    point: connectors-causa
    lesson: 2
    prompt: "___ hi havia vaga de trens, molts alumnes van arribar tard."
    hint: "connector de causa al principi"
    answers: ["Com que", "Ja que"]
    wrong_answers:
      - text: "Per què"
        why: "*Per què* només serveix per preguntar, i aquí no hi ha cap pregunta."
    grading: tolerant
    explanation: "«Hi havia vaga» és una causa coneguda al principi: *com que* o *ja que*."

  - id: b1-27-019
    type: fill
    point: connectors-causa
    lesson: 2
    prompt: "L'Arnau estudia al bar ___ a casa té massa soroll."
    hint: "connector de causa"
    answers: ["perquè", "ja que"]
    wrong_answers:
      - text: "per què"
        why: "*Per què*, en dues paraules, només pregunta. La causa és *perquè*."
      - text: "per tant"
        why: "*Per tant* donaria un resultat. «Té massa soroll» és la causa."
    grading: tolerant
    explanation: "«Té massa soroll» és la causa d'estudiar al bar: *perquè* o *ja que*."

  - id: b1-27-020
    type: fill
    point: connectors-consequencia
    lesson: 2
    prompt: "No hi havia llum a l'edifici, ___ es van ajornar els exàmens."
    hint: "connector de conseqüència"
    answers: ["per tant", "així que", "de manera que"]
    wrong_answers:
      - text: "perquè"
        why: "*Perquè* donaria la causa. «Es van ajornar els exàmens» és el resultat."
      - text: "ja que"
        why: "*Ja que* dona una causa. Aquí cal el resultat: *per tant* o *així que*."
    grading: tolerant
    explanation: "«Es van ajornar els exàmens» és el resultat: *per tant*, *així que* o *de manera que*."

  - id: b1-27-021
    type: fill
    point: connectors-consequencia
    lesson: 2
    prompt: "Plou molt; queda't a casa, ___."
    hint: "connector de conseqüència al final"
    answers: ["doncs"]
    wrong_answers:
      - text: "perquè"
        why: "*Perquè* necessita una frase amb verb darrere. Al final, la conseqüència és *doncs*."
      - text: "ja que"
        why: "*Ja que* dona una causa amb verb. Aquí tanquem amb *doncs*."
    grading: tolerant
    explanation: "«Queda't a casa» és la conseqüència: *doncs*, al final de la frase."

  - id: b1-27-022
    type: fill
    point: connectors-causa
    lesson: 2
    prompt: "___ tens germans a l'institut, coneixes bé els professors."
    hint: "connector de causa coneguda"
    answers: ["Ja que", "Com que"]
    wrong_answers:
      - text: "Per què"
        why: "*Per què* només serveix per preguntar, i aquí no hi ha cap pregunta."
    grading: tolerant
    explanation: "«Tens germans» és una causa coneguda: *ja que* o *com que*."

  - id: b1-27-023
    type: fill
    point: connectors-consequencia
    lesson: 2
    prompt: "Era el delegat de la classe, ___ parlava en nom de tothom."
    hint: "connector de conseqüència"
    answers: ["per tant", "així que", "de manera que"]
    wrong_answers:
      - text: "perquè"
        why: "*Perquè* donaria la causa. «Parlava en nom de tothom» és el resultat."
    grading: tolerant
    explanation: "«Parlava en nom de tothom» és el resultat de ser delegat: *per tant*, *així que* o *de manera que*."

  - id: b1-27-024
    type: order
    point: connectors-causa
    lesson: 2
    cue: "Explica que, com que nevava, vau fer l'examen al gimnàs."
    chunks: ["Com que", "nevava", "vam fer", "l'examen", "al gimnàs"]
    extra: ["perquè"]
    answers:
      - "Com que nevava, vam fer l'examen al gimnàs."
      - "Com que nevava, al gimnàs vam fer l'examen."
    explanation: "*Com que* va al principi, amb la causa coneguda: *com que nevava*."

  - id: b1-27-025
    type: order
    point: connectors-consequencia
    lesson: 2
    cue: "Digues que no hi havia guix per a la pissarra i que per això vau fer servir el projector."
    chunks: ["No hi havia", "guix per a la pissarra", "així que", "vam fer servir", "el projector"]
    extra: ["perquè"]
    answers:
      - "No hi havia guix per a la pissarra, així que vam fer servir el projector."
    explanation: "«Vam fer servir el projector» és el resultat: *així que*."

  - id: b1-27-026
    type: inline-choice
    point: connectors-causa
    lesson: 2
    title: "Nota de la directora"
    text: "{Com que|Per què} demà hi ha vaga, les classes començaran a les deu. Molts professors venen de fora, {per tant|perquè}, no hi haurà primera hora. {Ja que|Tot i que} la biblioteca obre igualment, podeu estudiar-hi. Us demanaran el carnet; porteu-lo, {doncs|perquè}. Si teniu dubtes, pregunteu, {perquè|per què} volem ajudar-vos."
    explanation: "*Com que* i *ja que* donen causes conegudes; *per tant* i *doncs*, resultats; i *perquè* respon *per què*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-27-027
    type: choice
    point: connectors-contrast
    lesson: 3
    prompt: "Volia estudiar medicina, ___ finalment va triar dret."
    answer: "però"
    distractors:
      - text: "sinó"
