    title: "La tria de la Júlia"
    text: |
      La Júlia té setze anys i estudia quart d'ESO a Sabadell. Com que sempre ha tret bones notes en ciències, tothom pensava que faria el batxillerat científic. Però ella dubtava: li agradava la biologia, però també li agradava dibuixar, i passava hores fent còmics i volia aprendre a dibuixar de debò.

      Ja que la data de la matrícula s'acostava, va demanar hora amb la tutora. La tutora li va dir que no calia triar entre ciències i art, perquè hi ha un batxillerat artístic amb assignatures de disseny. Tot i que la Júlia no coneixia ningú que l'hagués fet, la idea li va agradar.

      Així que va parlar amb els seus pares. El pare volia que fes ciències; la mare, en canvi, li va dir que triés el que la fes feliç. Al cap i a la fi, la Júlia es va matricular a l'artístic. Estudia molt, però no ha perdut la il·lusió: diu que, si no dibuixa cada dia, es posa trista.
    questions:
      - prompt: "Per què tothom pensava que la Júlia faria el científic?"
        answer: "Perquè treia bones notes en ciències."
        distractors:
          - text: "Perquè volia ser dissenyadora."
            why: "Li agradava dibuixar, però el text no diu que volgués ser dissenyadora."
          - text: "Perquè la tutora li ho havia aconsellat."
            why: "La tutora li va parlar de l'artístic, no del científic."
      - prompt: "Què li va proposar la tutora?"
        answer: "Un batxillerat que barreja l'art amb el disseny."
        distractors:
          - text: "Un cicle formatiu de grau mitjà per dibuixar còmics."
            why: "El text no parla de cap cicle."
