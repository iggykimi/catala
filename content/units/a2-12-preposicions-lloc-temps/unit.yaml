  # ---------- Lliçó 5 ----------
  - id: a2-12-053
    type: reading
    point: lloc-a-en
    lesson: 5
    title: "Un dissabte a Girona"
    text: |
      Abans de sortir, la Carla i en Pau miren l'horari al mòbil i arriben puntuals a l'estació, deu minuts abans. Viuen en un poble petit a prop de Girona. Dissabte van a la ciutat en tren: el tren arriba a les deu a l'estació del centre.

      Al matí passegen per la muralla i compren formatge al mercat de la plaça. A les dues dinen en un restaurant del barri vell amb els avis, que viuen en aquell barri des de fa anys.

      A la tarda visiten una exposició al museu i tornen a casa a les set. El cap de setmana que ve tornen a Girona: la data és al calendari de la cuina. El mes de juny hi ha la festa major.
    questions:
      - prompt: "Com van a Girona?"
        answer: "En transport públic."
        distractors:
          - text: "Amb els avis."
            why: "Dinen amb els avis, però el viatge el fan en tren."
          - text: "Amb el cotxe dels avis."
            why: "El text parla d'un tren, no d'un cotxe."
      - prompt: "On dinen?"
        answer: "En un local del barri antic."
        distractors:
          - text: "A casa dels avis."
            why: "Dinen en un restaurant, no a casa dels avis."
          - text: "Al mercat de la plaça."
            why: "Al mercat compren formatge: dinen en un restaurant."
      - prompt: "Què fan a la tarda?"
        answer: "Van al museu i després marxen."
        distractors:
          - text: "Passegen per la muralla."
            why: "Per la muralla passegen al matí."
          - text: "Dinen amb els avis."
            why: "Amb els avis dinen a les dues, al migdia."
    explanation: "La Carla i en Pau passen el dissabte a Girona: mercat, dinar amb els avis i museu."

  - id: a2-12-054
    type: reading
    point: temps
    lesson: 5
    title: "La festa de Sant Joan"
    text: |
      La revetlla de Sant Joan és el 23 de juny. A l'escola del barri fan una festa grossa: comença a les cinc de la tarda i acaba a les nou del vespre.

      Els nens canten cançons i els pares porten coca. Al migdia els mestres paren les taules al pati. A les vuit fan un sopar fred al pati. La Maria, que és mestra, diu que és la millor festa de l'estiu.

      L'any passat va ploure i van sopar al gimnàs. Aquest any fa bon temps i tothom vol sopar fora. L'horari de la festa surt al calendari del barri. Aquest Nadal van fer una festa petita, però la festa grossa és la festa major de la tardor.
    questions:
      - prompt: "Quan és la festa de l'escola?"
        answer: "El 23 de juny a la tarda."
        distractors:
          - text: "El 23 de juny al matí."
            why: "La festa comença a les cinc de la tarda."
          - text: "Aquest Nadal."
            why: "La festa petita va ser aquest Nadal: aquesta és la de Sant Joan."
      - prompt: "Què fan a les vuit?"
        answer: "Sopen junts al pati."
        distractors:
          - text: "Canten cançons."
            why: "Els nens canten, però el sopar és a les vuit."
          - text: "Paren les taules."
            why: "Les taules les paren al migdia, abans de la festa."
      - prompt: "Com va anar la festa de l'any passat?"
        answer: "Va ploure i van sopar a dins."
        distractors:
          - text: "Va fer bon temps i van sopar fora."
            why: "Això és aquest any: l'any passat va ploure."
          - text: "No van fer festa."
            why: "Sí que la van fer: van sopar al gimnàs."
    explanation: "L'escola celebra Sant Joan amb una festa a la tarda: cançons, coca i sopar al pati."

