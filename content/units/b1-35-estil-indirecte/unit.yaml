  # ---------------- Lliçó 5 ----------------
  - id: b1-35-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un malentès per telèfon"
    text: |
      Dimarts al matí, la Núria truca a l'Ibrahim per preparar la reunió de dijous. Serà per videotrucada. Li diu que el cap vol avançar la reunió a dimecres i li demana que avisi la resta de l'equip. L'Ibrahim té poca cobertura i ho entén malament: es pensa que la reunió és dimecres a les nou, quan en realitat la Núria ha dit «dimecres a les deu».

      L'Ibrahim envia un correu a l'equip amb l'assumpte «reunió»: «La reunió és dimecres a les nou.» La Laia el llegeix i truca a la Núria per confirmar-ho. La Núria li explica que no, que és a les deu, i li pregunta si pot avisar tothom. La Laia reenvia el correu a tot l'equip amb l'hora bona.

      Dimecres a les nou, l'Ibrahim és l'únic que es connecta a la videotrucada des del despatx. Espera deu minuts davant de la pantalla, amb el micròfon apagat i la càmera tancada. Després marca el número de la Núria i ella li diu que encara és a casa. Aleshores l'Ibrahim entén l'error: va sentir «nou» on la Núria havia dit «deu».

      «Ja m'ha passat altres vegades», pensa. Des d'aquell dia, quan rep un avís important per telèfon, demana que li ho posin per escrit.
    questions:
      - prompt: "Què li demana la Núria a l'Ibrahim dimarts?"
        answer: "Que avisi l'equip que la reunió canvia de dia."
        distractors:
          - text: "Que prepari la reunió de dijous."
            why: "La reunió ja no és dijous: el cap la vol avançar a dimecres."
          - text: "Que truqui al cap per confirmar l'hora."
            why: "La Núria no li demana això: li demana que avisi l'equip."
      - prompt: "Quin és el malentès?"
        answer: "L'Ibrahim confon les nou amb les deu."
        distractors:
          - text: "La Núria confon dimecres amb dijous."
            why: "La Núria no es confon: qui s'equivoca és l'Ibrahim, i amb l'hora."
          - text: "La Laia confon l'hora en reenviar el correu."
            why: "La Laia no es confon: reenvia el correu amb l'hora bona."
      - prompt: "Què fa la Laia quan llegeix el correu?"
        answer: "Truca a la Núria per confirmar l'hora."
        distractors:
          - text: "Avisa tothom al xat de la feina."
            why: "Avisa tothom per correu, no pel xat, i després de parlar amb la Núria."
          - text: "Es connecta a la videotrucada dimecres a les nou."
            why: "Qui es connecta a les nou és l'Ibrahim, no la Laia."
      - prompt: "Què decideix l'Ibrahim al final?"
        answer: "Demanar per escrit els avisos importants."
        distractors:
          - text: "No tornar a agafar el telèfon a la feina."
            why: "Això no ho diu: només vol els avisos importants per escrit."
          - text: "Trucar a la Núria cada dimecres a les nou."
            why: "No: decideix demanar els avisos importants per escrit."
    explanation: "L'Ibrahim entén «nou» on la Núria havia dit «deu», i arriba una hora abans a la reunió."

