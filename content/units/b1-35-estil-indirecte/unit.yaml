id: b1-35
level: B1
title: "L'estil indirecte"
summary: "Aprens a explicar què ha dit algú: *dir que* amb canvis de temps i de persona, *preguntar si* o *què*, *demanar que* + subjuntiu i els canvis de *aquí*, *avui* i *demà*."
vocabulary_theme: "Comunicació, missatges i telèfon"
points:
  - id: dir-que
    title: "Les afirmacions: *dir que* i els canvis de temps"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: preguntes-indirectes
    title: "Les preguntes indirectes: *si, què, on...*"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: peticions-subjuntiu
    title: "Les peticions: *demanar que* + subjuntiu"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: deictics
    title: "Els canvis de lloc i de temps: *allà, aquell dia...*"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *preguntar si* en registre formal"
  - id: expressions
    title: "Expressions per comunicar-se"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: dir, preguntar i demanar"
  - title: "Practicar: preguntes i peticions"
  - title: "Canvis de lloc i de temps, i registre formal"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el missatge"
    definition: "Text curt que enviem pel mòbil o per internet."
    example: "T'he enviat un missatge amb l'hora de la reunió."
  - word: "la trucada"
    definition: "Conversa que fem per telèfon."
    example: "He rebut una trucada del banc aquest matí."
  - word: "el contestador"
    definition: "Aparell o servei que respon quan no hi som."
    example: "No hi era i va deixar el missatge al contestador."
  - word: "el correu electrònic"
    definition: "Missatge que s'envia per internet."
    example: "T'envio l'informe per correu electrònic."
  - word: "l'assumpte"
    definition: "Tema d'un correu, escrit a dalt de tot."
    example: "Posa «reunió de dijous» a l'assumpte."
  - word: "adjuntar"
    definition: "Enviar un document amb un correu."
    example: "T'adjunto el contracte."
  - word: "respondre"
    definition: "Dir o escriure una resposta."
    example: "Encara no m'ha respost."
  - word: "reenviar"
    definition: "Enviar a una altra persona un missatge que hem rebut."
    example: "Reenvia'm la foto del Pau."
  - word: "la videotrucada"
    definition: "Trucada en què també ens veiem."
    example: "Cada diumenge fem una videotrucada amb els avis."
  - word: "el xat"
    definition: "Conversa per missatges curts a internet."
    example: "En vam parlar pel xat de la feina."
  - word: "trucar"
    definition: "Parlar amb algú per telèfon."
    example: "Truca'm quan surtis de classe."
  - word: "el número de telèfon"
    definition: "Xifres que cal marcar per trucar a algú."
    example: "No recordo el teu número de telèfon."
  - word: "marcar"
    definition: "Prémer els números per fer una trucada."
    example: "Marca el número a poc a poc."
  - word: "la cobertura"
    definition: "Senyal que permet trucar amb el mòbil."
    example: "Al poble no hi ha cobertura."
  - word: "la bateria"
    definition: "Part del mòbil que guarda l'energia."
    example: "Em queda poca bateria."
  - word: "carregar"
    definition: "Posar energia a la bateria."
    example: "He oblidat carregar el mòbil."
  - word: "el carregador"
    definition: "Aparell per carregar la bateria."
    example: "Em deixes el carregador?"
  - word: "la pantalla"
    definition: "Part del mòbil on veiem les imatges."
    example: "Se m'ha trencat la pantalla del mòbil."
  - word: "el micròfon"
    definition: "Aparell que recull la veu."
    example: "Apaga el micròfon si no parles."
  - word: "la càmera"
    definition: "Aparell que ensenya la nostra imatge."
    example: "Obre la càmera, que no et veig."
  - word: "avisar"
    definition: "Dir a algú una cosa que ha de saber."
    example: "Avisa'm si arribes tard."
  - word: "quedar"
    definition: "Acordar un dia i una hora per trobar-se."
    example: "Hem quedat a les cinc a l'estació."
  - word: "la bústia de veu"
    definition: "Lloc on queden guardats els missatges de veu."
    example: "No respon ningú: parla a la bústia de veu."
  - word: "el despatx"
    definition: "Habitació on treballa una persona a l'oficina."
    example: "El cap m'espera al seu despatx."
  - word: "el company de feina"
    definition: "Persona que treballa amb nosaltres."
    example: "Un company de feina m'ha passat l'avís."
  - word: "el cap"
    definition: "Persona que mana a la feina."
    example: "El cap vol parlar amb tu."
  - word: "l'oficina"
    definition: "Lloc on es fa feina d'escriptori."
    example: "L'oficina tanca a les sis."
  - word: "la reunió"
    definition: "Trobada per parlar de feina."
    example: "La reunió comença a les deu."
  - word: "el retard"
    definition: "Arribar més tard de l'hora."
    example: "El tren porta deu minuts de retard."
  - word: "l'informe"
    definition: "Document que explica una feina o una situació."
    example: "El cap vol l'informe abans de divendres."
  - word: "penjar"
    definition: "Tancar el telèfon en acabar."
    example: "No pengis, que ara vinc!"
  - word: "el favor"
    definition: "Ajuda que demanem a algú."
    example: "Em pots fer un favor?"
  - word: "l'avís"
    definition: "Missatge curt que informa d'una cosa."
    example: "M'ha arribat un avís de l'escola."
  - word: "la conversa"
    definition: "Estona en què dues persones parlen."
    example: "Vam tenir una conversa molt llarga."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-35-001
    type: choice
    point: dir-que
    lesson: 1
    prompt: "La Núria et truca i et diu: «Estic cansada.» Ho expliques ara mateix: «La Núria diu que ___ cansada.»"
    answer: "està"
    distractors:
      - text: "estigui"
        why: "*Estigui* és subjuntiu. Després de *dir que*, amb una afirmació, va indicatiu: *està*."
      - text: "estava"
        why: "El verb *diu* és present: el temps no canvia. Cal *està*."
    explanation: "«Diu» és present: el temps no canvia. Només canvia la persona: *estic* → *està*."

  - id: b1-35-002
    type: choice
    point: dir-que
    lesson: 1
    prompt: "Fa un mes el Pau et va dir: «Estic malalt.» Ara ja està bé. Ho expliques: «El Pau em va dir que ___ malalt.»"
    answer: "estava"
    distractors:
      - text: "està"
        why: "El Pau ja està bé: la situació ha passat i, amb *va dir*, el present es converteix en imperfet: *estava*."
      - text: "estigui"
        why: "*Estigui* és subjuntiu, per a ordres i peticions. Una afirmació porta indicatiu: *estava*."
    explanation: "Amb *va dir*, el present (*estic*) passa a imperfet (*estava*). La persona també canvia."

  - id: b1-35-003
    type: choice
    point: dir-que
    lesson: 1
    prompt: "La Fàtima et diu: «Soc de Girona.» Ho expliques: «La Fàtima diu que ___ de Girona.»"
    answer: "és"
    distractors:
      - text: "soc"
        why: "*Soc* és primera persona («jo»). La Fàtima parla d'ella: *és*."
      - text: "era"
        why: "*Diu* és present: el temps no canvia. Només canvia la persona: *és*."
    explanation: "«Diu» és present: el temps no canvia. La persona sí: *soc* (jo) → *és* (ella)."

  - id: b1-35-004
    type: choice
    point: preguntes-indirectes
    lesson: 1
    prompt: "El Jordi et pregunta: «Vols cafè?» Ho expliques: «El Jordi em pregunta ___ vull cafè.»"
    answer: "si"
    distractors:
      - text: "que"
        why: "*Que* introdueix afirmacions (*diu que...*). Una pregunta total demana *si*."
      - text: "què"
        why: "*Què* és per a preguntes parcials («què vols?»). Aquí la pregunta és total: *si*."
    explanation: "«Vols cafè?» és una pregunta total (sí o no). En estil indirecte porta *si*: *pregunta si vull cafè*."

  - id: b1-35-005
    type: choice
    point: preguntes-indirectes
    lesson: 1
    prompt: "La Carla et pregunta: «Què vols?» Ho expliques: «La Carla em pregunta ___ vull.»"
    answer: "què"
    distractors:
      - text: "que"
        why: "*Que* introdueix afirmacions. L'interrogatiu *què* es manté: *pregunta què vull*."
      - text: "si"
        why: "*Si* és per a preguntes totals. «Què vols?» porta l'interrogatiu *què*."
    explanation: "A les preguntes parcials, l'interrogatiu es manté i no hi ha interrogant: *pregunta què vull*."

  - id: b1-35-006
    type: choice
    point: preguntes-indirectes
    lesson: 1
    prompt: "Ahir l'Arnau et va preguntar: «On vius?» Ho expliques avui: «L'Arnau em va preguntar on ___.»"
    answer: "vivia"
    distractors:
      - text: "vius"
        why: "*Vius* és «tu». L'Arnau preguntava on vius tu, que ara ho expliques: la persona canvia a «jo»."
      - text: "viuria"
        why: "*Viuria* és condicional, per al futur. «Vius» és present: passa a imperfet, *vivia*."
    explanation: "Amb un verb en passat (*va preguntar*), el present (*vius*) passa a imperfet: *on vivia*."

  - id: b1-35-007
    type: inline-choice
    point: dir-que
    lesson: 1
    title: "Un missatge de la Laia"
    text: "Fa una setmana la Laia em va escriure. Deia que {estava|està} molt cansada, que {havia plegat|ha plegat} a les vuit i que {aniria|anirà} a Girona {l'endemà|demà}. També deia que no havia pogut carregar el mòbil."
    explanation: "Amb *deia* (passat), el present passa a imperfet (*estava*), el perfet a plusquamperfet (*havia plegat*) i el futur a condicional (*aniria*). *Demà* passa a *l'endemà*."

  - id: b1-35-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["deixar un missatge", "dir què vols quan no et responen al telèfon"]
      - ["tornar la trucada", "trucar a qui t'ha trucat abans"]
      - ["posar-se en contacte", "escriure o trucar a algú per parlar-hi"]
      - ["agafar el telèfon", "respondre una trucada"]
      - ["penjar el telèfon", "tancar el telèfon en acabar"]
    explanation: "Són les expressions bàsiques per parlar del telèfon: *agafar*, *penjar*, *deixar un missatge*, *tornar la trucada* i *posar-se en contacte*."

  - id: b1-35-009
    type: fill
    point: dir-que
    lesson: 1
    prompt: "—Què et va dir el Wei? —Em va dir que ___ molt cansat."
    hint: "*estar*, imperfet"
    answers: ["estava"]
    wrong_answers:
      - text: "està"
        why: "Amb *va dir* (passat), el present passa a imperfet: *estava*."
    grading: tolerant
    explanation: "El Wei va dir «estic cansat». Amb *va dir*, el present passa a imperfet: *estava*."

  - id: b1-35-010
    type: fill
    point: dir-que
    lesson: 1
    prompt: "—D'on és la Montse? —Diu que ___ de Vic."
    hint: "*ser*, present; parla d'ella"
    answers: ["és"]
    wrong_answers:
      - text: "soc"
        why: "*Soc* és primera persona. La Montse parla d'ella: *és*."
      - text: "era"
        why: "*Diu* és present: el temps no canvia. Cal *és*."
    grading: tolerant
    explanation: "La Montse ha dit «soc de Vic». Amb *diu* (present), només canvia la persona: *és*."

  - id: b1-35-011
    type: choice
    point: expressions
    lesson: 1
    prompt: "Truques al Pau, però no respon. Li deixes la teva petició al contestador. Què has fet?"
    answer: "Deixar un missatge."
    distractors:
      - text: "Tornar la trucada."
        why: "*Tornar la trucada* és trucar a qui t'ha trucat. Aquí ets tu qui truca primer."
      - text: "Penjar el telèfon."
        why: "*Penjar el telèfon* és tancar-lo en acabar. Aquí has parlat al contestador."
    explanation: "Si no et responen i parles al contestador, deixes un missatge."

  - id: b1-35-012
    type: order
    point: dir-que
    lesson: 1
    cue: "La Laia et truca: està cansada. Explica-ho ara mateix a un company de feina."
    chunks: ["la Laia", "diu", "que", "està cansada"]
    extra: ["estava cansada"]
    answers:
      - "La Laia diu que està cansada."
      - "Diu la Laia que està cansada."
    explanation: "Amb *diu* (present), el temps no canvia: *està cansada*. Només canvia la persona."

  - id: b1-35-013
    type: order
    point: preguntes-indirectes
    lesson: 1
    cue: "El Pau et pregunta on vius. Explica-ho a la Núria."
    chunks: ["el Pau", "em pregunta", "on", "visc"]
    extra: ["que"]
    answers:
      - "El Pau em pregunta on visc."
      - "Em pregunta el Pau on visc."
    explanation: "És una pregunta parcial: l'interrogatiu (*on*) va sense *que*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-35-014
    type: fill
    point: preguntes-indirectes
    lesson: 2
    prompt: "—Què et va preguntar el metge? —Em va preguntar ___ fumava."
    hint: "conjunció de pregunta total"
    answers: ["si"]
    wrong_answers:
      - text: "sí"
        why: "*Sí* és la resposta afirmativa («sí, fumo»). La conjunció de pregunta és *si*."
      - text: "que"
        why: "*Que* introdueix afirmacions. Una pregunta total demana *si*."
    grading: strict
    explanation: "«Fumes?» és una pregunta total. En estil indirecte porta *si*: *pregunta si fumava*."

  - id: b1-35-015
    type: fill
    point: preguntes-indirectes
    lesson: 2
    prompt: "A l'oficina em van demanar el número de telèfon i em van preguntar ___ vivia."
    hint: "interrogatiu de lloc"
    answers: ["on"]
    wrong_answers:
      - text: "si"
        why: "«Vius?» seria una pregunta total. Aquí pregunten el lloc: *on*."
    grading: tolerant
    explanation: "Pregunten el lloc on vius. L'interrogatiu *on* es manté, sense interrogant i sense *que*."

  - id: b1-35-016
    type: fill
    point: preguntes-indirectes
    lesson: 2
    prompt: "—Què et va preguntar la Laia? —Em va preguntar què ___ per sopar."
    hint: "*voler*, imperfet; parla de mi"
    answers: ["volia"]
    wrong_answers:
      - text: "vull"
        why: "Amb *va preguntar* (passat), el present passa a imperfet: *volia*."
      - text: "voldria"
        why: "*Voldria* és condicional. «Vols» és present: passa a imperfet, *volia*."
    grading: tolerant
    explanation: "La Laia va preguntar «què vols?». Amb *va preguntar*, el verb passa a imperfet i la persona canvia: *què volia*."

  - id: b1-35-017
    type: fill
    point: peticions-subjuntiu
    lesson: 2
    prompt: "El cap em demana que ___ l'informe abans de divendres."
    hint: "*acabar*, present de subjuntiu; parla de mi"
    answers: ["acabi"]
    wrong_answers:
      - text: "acabo"
        why: "Després de *demanar que* va subjuntiu, no indicatiu: *acabi*."
      - text: "acabés"
        why: "*Demana* és present: cal present de subjuntiu, *acabi*. *Acabés* és imperfet."
    grading: tolerant
    explanation: "*Demanar que* demana subjuntiu. Com que *demana* és present, el verb va en present de subjuntiu: *acabi*."

  - id: b1-35-018
    type: fill
    point: peticions-subjuntiu
    lesson: 2
    prompt: "La Núria em demana que ___ a buscar-la a l'estació."
    hint: "*anar*, present de subjuntiu; parla de mi"
    answers: ["vagi"]
    wrong_answers:
      - text: "vaig"
        why: "*Vaig* és indicatiu («jo vaig»). Després de *demanar que* va subjuntiu: *vagi*."
      - text: "anés"
        why: "*Demana* és present: cal present de subjuntiu, *vagi*."
    grading: tolerant
    explanation: "Després de *demanar que* va subjuntiu. *Anar* fa *vagi* en present de subjuntiu."

  - id: b1-35-019
    type: choice
    point: peticions-subjuntiu
    lesson: 2
    prompt: "El teu company et diu: «Parla més fluix.» Ho expliques: «Em demana que ___ més fluix.»"
    answer: "parli"
    distractors:
      - text: "parlo"
        why: "Després de *demanar que* va subjuntiu, no indicatiu."
      - text: "parles"
        why: "*Parles* és «tu» i indicatiu. Cal primera persona i subjuntiu: *parli*."
    explanation: "«Parla més fluix» és una ordre per a tu. Amb *demanar que* va en subjuntiu i en primera persona: *parli*."

  - id: b1-35-020
    type: choice
    point: peticions-subjuntiu
    lesson: 2
    prompt: "Quina frase és una petició?"
    answer: "Em demana que tanqui la porta."
    distractors:
      - text: "Em pregunta si tanco la porta."
        why: "Això és una pregunta: vol saber si la tanques, no et demana que ho facis."
      - text: "Em diu que tanco la porta."
        why: "Això explica un fet. Una petició porta *demanar que* + subjuntiu."
    explanation: "*Demanar que* + subjuntiu (*tanqui*) expressa una petició, a diferència de *preguntar si* i de *dir que*."

  - id: b1-35-021
    type: order
    point: preguntes-indirectes
    lesson: 2
    cue: "La Fàtima et pregunta si vindràs dijous. Explica-ho a l'Ibrahim."
    chunks: ["la Fàtima", "em pregunta", "si", "vindré dijous"]
    extra: ["vindràs dijous"]
    answers:
      - "La Fàtima em pregunta si vindré dijous."
      - "Em pregunta la Fàtima si vindré dijous."
    explanation: "La pregunta és total: porta *si*. La persona canvia: *vindràs* (tu) → *vindré* (jo)."

  - id: b1-35-022
    type: order
    point: peticions-subjuntiu
    lesson: 2
    cue: "El metge t'aconsella beure molta aigua. Explica-ho al Pau."
    chunks: ["el metge", "em demana", "que", "begui molta aigua"]
    extra: ["bec molta aigua"]
    answers:
      - "El metge em demana que begui molta aigua."
      - "Em demana el metge que begui molta aigua."
    explanation: "*Demanar que* porta subjuntiu: *begui*. *Bec* és indicatiu i no serveix."

  - id: b1-35-023
    type: choice
    point: preguntes-indirectes
    lesson: 2
    prompt: "Ahir vas rebre aquest missatge: «Has llegit el correu?» Ho expliques: «Em va preguntar si ___ llegit el correu.»"
    answer: "havia"
    distractors:
      - text: "hauria"
        why: "*Hauria* és condicional. «Has llegit» és perfet: amb *va preguntar*, passa a plusquamperfet, *havia llegit*."
      - text: "hagi"
        why: "*Hagi* és subjuntiu. Les preguntes indirectes porten indicatiu: *havia*."
    explanation: "«He llegit» és perfet. Amb *va preguntar*, passa a plusquamperfet: *havia llegit*."

  - id: b1-35-024
    type: choice
    point: preguntes-indirectes
    lesson: 2
    prompt: "La Laia et pregunta: «Quan tornes?» Ho expliques: «La Laia em pregunta ___ torno.»"
    answer: "quan"
    distractors:
      - text: "que"
        why: "«Quan tornes?» és una pregunta parcial: cal l'interrogatiu *quan*, no *que*."
      - text: "si"
        why: "*Si* és per a preguntes totals. «Quan tornes?» porta l'interrogatiu *quan*."
    explanation: "«Quan tornes?» és una pregunta parcial: l'interrogatiu *quan* es manté, sense *que*."

  - id: b1-35-025
    type: fill
    point: dir-que
    lesson: 2
    prompt: "Dilluns el cap em va dir: «Et trucaré demà.» Ho explico divendres: «Em va dir que em ___ l'endemà.»"
    hint: "*trucar*, condicional; parla de mi"
    answers: ["trucaria"]
    wrong_answers:
      - text: "trucarà"
        why: "Amb *va dir* (passat), el futur passa a condicional: *trucaria*."
      - text: "truca"
        why: "«Trucaré» és futur: amb *va dir* passa a condicional, *trucaria*."
    grading: tolerant
    explanation: "«Trucaré» és futur. Amb *va dir*, passa a condicional: *trucaria*. I *demà* passa a *l'endemà*."

  - id: b1-35-026
    type: choice
    point: deictics
    lesson: 2
    prompt: "Dilluns el Pau et va dir: «Quedem demà.» Ho expliques divendres: «Em va dir que quedaríem ___.»"
    answer: "l'endemà"
    distractors:
      - text: "demà"
        why: "*Demà*, dit divendres, és dissabte. Ell parlava de dimarts: *l'endemà*."
      - text: "el dia abans"
        why: "«El dia abans» correspon a «ahir». Aquí l'original és «demà»: *l'endemà*."
    explanation: "Ell va dir «demà» dilluns, és a dir, dimarts. Explicat divendres, aquell dia és *l'endemà*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-35-027
    type: choice
    point: deictics
    lesson: 3
    prompt: "Ahir la Carla et va escriure: «Soc aquí.» Ho expliques des d'un altre lloc: «Em va escriure que era ___.»"
    answer: "allà"
    distractors:
      - text: "aquí"
        why: "*Aquí* és on ets tu ara. Ella era en un altre lloc: *allà*."
      - text: "a allà"
        why: "*Allà* no porta preposició: *era allà*."
