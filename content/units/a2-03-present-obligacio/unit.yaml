id: a2-03
level: A2
title: "El present i l'obligació"
summary: "El present d'indicatiu (regulars, incoatius i irregulars freqüents) i l'obligació amb *haver de* i *cal*."
vocabulary_theme: "Rutina diària i hores"
points:
  - id: present-regular
    title: "El present: verbs regulars i incoatius"
    refs:
      - label: "GEIEC: El verb. Formes verbals"
        url: "https://geiec.iec.cat"
  - id: present-irregular
    title: "El present: verbs irregulars freqüents"
    refs:
      - label: "GEIEC: El verb. Formes verbals"
        url: "https://geiec.iec.cat"
  - id: haver-de-cal
    title: "L'obligació: *haver de* i *cal*"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *tenir que* i *hi ha que*"
  - id: expressions
    title: "Expressions de la rutina"
lessons:
  - title: "Conèixer el present"
  - title: "Practicar el present"
  - title: "L'obligació i els calcs"
  - title: "Produir frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el despertador"
    definition: "Rellotge que sona a l'hora que has triat per llevar-te."
    example: "El despertador sona a les set, però jo em llevo a dos quarts de vuit."
  - word: "llevar-se"
    definition: "Sortir del llit al matí."
    example: "Els dies de feina em llevo a les sis."
  - word: "dutxar-se"
    definition: "Rentar-se el cos sota la dutxa."
    example: "Quan torno del gimnàs, em dutxo i sopo."
  - word: "esmorzar"
    definition: "Menjar alguna cosa al matí."
    example: "Esmorzo una torrada i un cafè amb llet."
  - word: "dinar"
    definition: "Menjar al migdia."
    example: "Dinem a la una al menjador de l'empresa."
  - word: "sopar"
    definition: "Menjar al vespre o a la nit."
    example: "Divendres sopem a casa dels meus sogres."
  - word: "la migdiada"
    definition: "Estona de son després de dinar."
    example: "L'avi fa una migdiada d'una hora cada dia."
  - word: "l'horari"
    definition: "Les hores en què algú treballa o obre una botiga."
    example: "L'horari de la farmàcia és de nou a nou."
  - word: "el torn"
    definition: "Part del dia en què treballa una persona o un grup."
    example: "La Laia fa el torn de nit aquesta setmana."
  - word: "la reunió"
    definition: "Trobada de diverses persones per parlar de la feina."
    example: "La reunió comença a les nou en punt."
  - word: "plegar"
    definition: "Acabar la feina del dia."
    example: "Divendres plego a les tres."
  - word: "afanyar-se"
    definition: "Fer una cosa més de pressa."
    example: "Afanya't, que el bus surt d'aquí a cinc minuts."
  - word: "arribar"
    definition: "Ser en un lloc després d'haver-hi anat."
    example: "Arribo a la feina a les vuit."
  - word: "sortir"
    definition: "Marxar d'un lloc, com ara de casa o de la feina."
    example: "Surto de casa a dos quarts de vuit."
  - word: "quedar"
    definition: "Posar-se d'acord amb algú per veure's."
    example: "Quedem a la plaça a les set."
  - word: "l'agenda"
    definition: "Llibre o aplicació on apuntes les cites i les tasques."
    example: "Apunto la reunió a l'agenda."
  - word: "la cita"
    definition: "Hora fixada per veure un metge o una altra persona."
    example: "Dijous tinc cita amb el dentista."
  - word: "tard"
    definition: "Després de l'hora prevista."
    example: "Avui arribo tard perquè hi ha vaga de trens."
  - word: "d'hora"
    definition: "Abans de l'hora normal."
    example: "Els diumenges no em llevo d'hora."
  - word: "puntual"
    definition: "Que arriba a l'hora prevista."
    example: "La Carla sempre és puntual."
  - word: "el cap de setmana"
    definition: "Els dissabtes i els diumenges."
    example: "El cap de setmana vaig a Vic a veure els pares."
  - word: "la fleca"
    definition: "Botiga on es ven pa."
    example: "Compro el pa a la fleca del barri."
  - word: "la pastisseria"
    definition: "Botiga on es venen pastissos i dolços."
    example: "La pastisseria obre a les vuit del matí."
  - word: "el forn"
    definition: "Aparell o lloc on es couen el pa i els pastissos."
    example: "El pa surt del forn a les set."
  - word: "el portàtil"
    definition: "Ordinador petit que es pot portar d'un lloc a un altre."
    example: "Demà porto el portàtil a la reunió."
  - word: "el contracte"
    definition: "Paper que signes quan comences una feina."
    example: "El contracte ha d'estar signat abans de dilluns."
  - word: "renovar"
    definition: "Fer vàlid un document una altra vegada."
    example: "Per renovar el DNI cal demanar hora."
  - word: "fer festa"
    definition: "No treballar un dia."
    example: "El primer de maig tothom fa festa."
  - word: "el menú del dia"
    definition: "Dinar de preu fix, amb primer plat, segon i postres."
    example: "El menú del dia val deu euros."
  - word: "la vaga"
    definition: "Aturada de la feina per demanar millores."
    example: "Avui hi ha vaga de trens."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-03-001
    type: choice
    point: present-regular
    lesson: 1
    prompt: "En Pau ___ en una farmàcia de Reus."
    answer: "treballa"
    distractors:
      - text: "treballo"
        why: "*Treballo* és per a *jo*. En Pau és «ell»: la terminació és *-a*."
      - text: "treballen"
        why: "*Treballen* és per a «ells». En Pau és una sola persona."
    explanation: "El subjecte és «ell» (en Pau), i els verbs en *-ar* fan *-a*: *treballa*."

  - id: a2-03-002
    type: choice
    point: present-regular
    lesson: 1
    prompt: "Nosaltres ___ a les dues a la feina."
    answer: "dinem"
    distractors:
      - text: "dineu"
        why: "*Dineu* és per a «vosaltres»."
      - text: "dinen"
        why: "*Dinen* és per a «ells»."
    explanation: "Amb «nosaltres», la terminació del present és *-em*: *dinem*."

  - id: a2-03-003
    type: choice
    point: present-regular
    lesson: 1
    prompt: "La Laia ___ el diari al tren cada matí."
    answer: "llegeix"
    distractors:
      - text: "llegi"
        why: "*Llegi* no és el present d'«ella». *Llegir* és incoatiu: *llegeix*."
      - text: "llegeixo"
        why: "*Llegeixo* és per a *jo*. La Laia és «ella»."
    explanation: "*Llegir* és incoatiu: *llegeixo*, *llegeixes*, *llegeix*. La Laia és «ella»: *llegeix*."

  - id: a2-03-004
    type: choice
    point: present-regular
    lesson: 1
    prompt: "Jo ___ el cafè sense sucre."
    answer: "prefereixo"
    distractors:
      - text: "prefero"
        why: "*Preferir* és incoatiu: la primera persona és *prefereixo*, no *prefero*."
      - text: "prefereixes"
        why: "*Prefereixes* és per a «tu»."
    explanation: "*Preferir* és un verb incoatiu: amb *jo*, afegeix *-eix-* i fa *prefereixo*."

  - id: a2-03-005
    type: choice
    point: present-irregular
    lesson: 1
    prompt: "Jo ___ vint-i-cinc anys i visc a Girona."
    answer: "tinc"
    distractors:
      - text: "tens"
        why: "*Tens* és per a «tu»."
      - text: "té"
        why: "*Té* és per a «ell» o «ella»."
    explanation: "*Tenir* és irregular. Amb *jo* fa *tinc*, i l'edat es diu amb *tenir*."

  - id: a2-03-006
    type: choice
    point: present-irregular
    lesson: 1
    prompt: "Jo ___ a la feina en bus."
    answer: "vaig"
    distractors:
      - text: "vas"
        why: "*Vas* és per a «tu»."
      - text: "va"
        why: "*Va* és per a «ell» o «ella»."
    explanation: "*Anar* és irregular: *vaig*, *vas*, *va*, *anem*, *aneu*, *van*. Amb *jo*: *vaig*."

  - id: a2-03-007
    type: choice
    point: present-irregular
    lesson: 1
    prompt: "Nosaltres ___ de Terrassa. I vosaltres?"
    answer: "som"
    distractors:
      - text: "sou"
        why: "*Sou* és per a «vosaltres»."
      - text: "estem"
        why: "Per dir d'on som fem servir *ser*: *som de Terrassa*."
    explanation: "L'origen es diu amb *ser*. Amb «nosaltres», *ser* fa *som*."

  - id: a2-03-008
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Aneu al cinema? —Només ___, potser dos cops l'any."
    answer: "de tant en tant"
    distractors:
      - text: "cada dos per tres"
        why: "*Cada dos per tres* vol dir «molt sovint». Dos cops l'any és molt poc."
      - text: "cada matí"
        why: "*Cada matí* vol dir «cada dia», i no encaixa amb dos cops l'any."
    explanation: "*De tant en tant* vol dir «a vegades, no gaire sovint»: dos cops l'any."

  - id: a2-03-009
    type: inline-choice
    point: present-irregular
    lesson: 1
    title: "Una nota per a l'Arnau"
    text: "Hola, Arnau! Avui jo {arribo|arribes|arriba} tard perquè {tinc|tens|té} una reunió. Tu {vas|vaig|va} a l'escola amb la Carla i {fas|faig|fa} els deures a la biblioteca. Jo {sopo|sopa|sopes} fora, però a les deu ja {soc|som|ets} a casa."
    explanation: "El verb concorda amb el subjecte: *jo arribo*, *jo tinc*, *tu vas*, *tu fas*, *jo sopo*, *jo soc*."

  - id: a2-03-010
    type: inline-choice
    point: present-regular
    lesson: 1
    title: "El matí d'en Jordi"
    text: "En Jordi {es lleva|em llevo|es lleven} a les sis. {Esmorza|Esmorzo|Esmorzen} un cafè i {surt|surto|surten} de casa a les set. {Treballa|Treballo|Treballes} en un taller de Manresa i {dina|dino|dinen} a la una amb els companys. A la tarda {llegeix|llegeixo|llegeixen} el diari."
    explanation: "El subjecte és «ell» en totes les frases: *es lleva*, *esmorza*, *surt*, *treballa*, *dina*, *llegeix*."

  - id: a2-03-011
    type: match
    point: present-irregular
    lesson: 1
    instruction: "Relaciona cada persona i verb amb la forma del present."
    pairs:
      - ["jo + anar", "vaig"]
      - ["tu + fer", "fas"]
      - ["ell + veure", "veu"]
      - ["nosaltres + dir", "diem"]
      - ["vosaltres + venir", "veniu"]
    explanation: "Són verbs irregulars: *vaig*, *fas*, *veu*, *diem*, *veniu*. Convé saber-los de memòria."

  - id: a2-03-012
    type: match
    point: present-regular
    lesson: 1
    instruction: "Relaciona cada verb amb la forma de «jo»."
    pairs:
      - ["llegir", "llegeixo"]
      - ["servir", "serveixo"]
      - ["dormir", "dormo"]
      - ["obrir", "obro"]
      - ["preferir", "prefereixo"]
    explanation: "*Llegir*, *servir* i *preferir* són incoatius (*-eixo*). *Dormir* i *obrir* no ho són."

  - id: a2-03-013
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["de tant en tant", "a vegades, no gaire sovint"]
      - ["cada dos per tres", "molt sovint"]
      - ["fer tard", "arribar més tard del que toca"]
      - ["anar de bòlit", "tenir molta feina i poc temps"]
      - ["fer festa", "no treballar un dia"]
    explanation: "Són expressions de la rutina diària, molt habituals en català."

  # ---------- Lliçó 2 ----------
  - id: a2-03-014
    type: fill
    point: present-regular
    lesson: 2
    prompt: "Cada matí jo ___ el pa a la fleca del barri."
    hint: "*comprar*, present"
    answers: ["compro"]
    wrong_answers:
      - text: "compres"
        why: "*Compres* és per a «tu». Aquí el subjecte és *jo*."
      - text: "compra"
        why: "*Compra* és per a «ell» o «ella»."
    grading: tolerant
    explanation: "Amb *jo*, els verbs en *-ar* acaben en *-o*: *compro*."

  - id: a2-03-015
    type: fill
    point: present-regular
    lesson: 2
    prompt: "Vosaltres ___ molt tard els dissabtes."
    hint: "*dormir*, present"
    answers: ["dormiu"]
    wrong_answers:
      - text: "dormeu"
        why: "*Dormir* és un verb en *-ir*: amb «vosaltres» fa *-iu*, com *sortiu*."
      - text: "dormen"
        why: "*Dormen* és per a «ells»."
    grading: tolerant
    explanation: "Amb «vosaltres», els verbs en *-ir* acaben en *-iu*: *dormiu*."

  - id: a2-03-016
    type: fill
    point: present-regular
    lesson: 2
    prompt: "Aquest bar ___ esmorzars fins a les onze."
    hint: "*servir*, present"
    answers: ["serveix"]
    wrong_answers:
      - text: "serv"
        why: "*Servir* és incoatiu: amb «ell» o «ella» fa *serveix*."
      - text: "servi"
        why: "*Servi* no és el present d'«ell»: la forma és *serveix*."
    grading: tolerant
    explanation: "*Servir* és incoatiu: *serveixo*, *serveixes*, *serveix*. El bar és «ell»: *serveix*."

  - id: a2-03-017
    type: fill
    point: present-regular
    lesson: 2
    prompt: "Jo ___ els correus abans de fer el cafè."
    hint: "*llegir*, present"
    answers: ["llegeixo"]
    wrong_answers:
      - text: "llegi"
        why: "*Llegi* no és el present de *jo*: la forma és *llegeixo*."
      - text: "llego"
        why: "*Llegir* és incoatiu: la primera persona acaba en *-eixo*."
    grading: tolerant
    explanation: "*Llegir* és incoatiu: amb *jo* afegeix *-eix-* i fa *llegeixo*."

  - id: a2-03-018
    type: fill
    point: present-irregular
    lesson: 2
    prompt: "Cada dia jo ___ el dinar per a tota la família."
    hint: "*fer*, present"
    answers: ["faig"]
    wrong_answers:
      - text: "fas"
        why: "*Fas* és per a «tu». Aquí el subjecte és *jo*."
      - text: "fa"
        why: "*Fa* és per a «ell» o «ella»."
    grading: tolerant
    explanation: "*Fer* és irregular: *faig*, *fas*, *fa*, *fem*, *feu*, *fan*. Amb *jo*: *faig*."

  - id: a2-03-019
    type: fill
    point: present-irregular
    lesson: 2
    prompt: "Tu ___ amb nosaltres al cinema aquesta nit?"
    hint: "*venir*, present"
    answers: ["vens"]
    wrong_answers:
      - text: "ve"
        why: "*Ve* és per a «ell» o «ella»."
      - text: "veniu"
        why: "*Veniu* és per a «vosaltres»."
    grading: tolerant
    explanation: "*Venir* és irregular: *vinc*, *vens*, *ve*. Amb «tu»: *vens*."

  - id: a2-03-020
    type: order
    point: present-regular
    lesson: 2
    cue: "Explica el teu horari: els dissabtes no treballes a l'oficina."
    chunks: ["els dissabtes", "no", "treballo", "a l'oficina"]
    extra: ["treballes"]
    answers:
      - "Els dissabtes no treballo a l'oficina."
      - "No treballo a l'oficina els dissabtes."
      - "No treballo els dissabtes a l'oficina."
      - "A l'oficina no treballo els dissabtes."
      - "Els dissabtes a l'oficina no treballo."
    explanation: "Parles de tu mateix: el verb és *treballo*. La negació *no* va just davant del verb."

  - id: a2-03-021
    type: order
    point: present-irregular
    lesson: 2
    cue: "Pregunta a uns companys de feina a quina hora van a dinar avui."
    chunks: ["avui", "a quina hora", "aneu", "a dinar"]
    extra: ["anem"]
    answers:
      - "Avui a quina hora aneu a dinar?"
      - "A quina hora aneu a dinar avui?"
    explanation: "Parles amb diverses persones, així que el verb és *aneu*, de *anar*."

  - id: a2-03-022
    type: order
    point: present-regular
    lesson: 2
    cue: "Pregunta a un company a quina hora surt de la feina avui."
    chunks: ["avui", "a quina hora", "surts", "de la feina"]
    extra: ["surt"]
    answers:
      - "Avui a quina hora surts de la feina?"
      - "A quina hora surts de la feina avui?"
    explanation: "Parles amb una sola persona: *tu surts*. *Sortir* no és incoatiu: *surto*, *surts*, *surt*."

  - id: a2-03-023
    type: choice
    point: present-regular
    lesson: 2
    prompt: "La Montse i l'Arnau ___ pel parc cada tarda."
    answer: "passegen"
    distractors:
      - text: "passeja"
        why: "*Passeja* és per a una sola persona. Aquí són dues."
      - text: "passegem"
        why: "*Passegem* és per a «nosaltres»."
    explanation: "Són «ells»: la terminació és *-en*. *Passejar* canvia la *j* en *g* davant de *e*: *passegen*."

  - id: a2-03-024
    type: choice
    point: present-irregular
    lesson: 2
    prompt: "Avui ___ molt cansat: he dormit poc."
    answer: "estic"
    distractors:
      - text: "estàs"
        why: "*Estàs* és per a «tu». Aquí parla *jo*."
      - text: "tinc"
        why: "*Tinc cansat* és un calc de «tengo cansado». En català: *estic cansat*."
    explanation: "*Estar* és irregular: amb *jo* fa *estic*. Amb *cansat* no es fa servir *tenir*."

  - id: a2-03-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "Si no marxem ara, ___ a la reunió."
    answer: "farem tard"
    distractors:
      - text: "farem festa"
        why: "*Fer festa* és no treballar un dia."
      - text: "anirem de bòlit"
        why: "*Anar de bòlit* és tenir molta feina i poc temps."
    explanation: "*Fer tard* vol dir «arribar més tard del que toca»."

  - id: a2-03-026
    type: choice
    point: present-irregular
    lesson: 2
    prompt: "Des de l'àtic jo ___ tot el poble."
    answer: "veig"
    distractors:
      - text: "veus"
        why: "*Veus* és per a «tu»."
      - text: "veu"
        why: "*Veu* és per a «ell» o «ella»."
    explanation: "*Veure* és irregular: *veig*, *veus*, *veu*, *veiem*, *veieu*, *veuen*. Amb *jo*: *veig*."

  # ---------- Lliçó 3 ----------
  - id: a2-03-027
    type: choice
    point: haver-de-cal
    lesson: 3
    prompt: "Demà ___ llevar-me a les sis: tinc el tren a dos quarts de set."
    answer: "he de"
    distractors:
      - text: "tinc que"
        why: "*Tinc que* és un calc de «tengo que». En català diem *he de*."
      - text: "he que"
        why: "*Haver de* porta sempre la preposició *de*: *he de llevar-me*."
    explanation: "L'obligació d'una persona es diu amb *haver de* + infinitiu: *he de llevar-me*."

  - id: a2-03-028
    type: choice
    point: compte-castella
    lesson: 3
    prompt: "Per entrar al museu ___ comprar l'entrada abans."
    answer: "cal"
    distractors:
      - text: "hi ha que"
        why: "*Hi ha que* és un calc de «hay que». En català diem *cal*."
      - text: "té que"
        why: "*Té que* és un calc de «tiene que». I aquí l'obligació és general."
    explanation: "L'obligació general, sense una persona concreta, es diu *cal* + infinitiu."

  - id: a2-03-029
    type: choice
    point: haver-de-cal
    lesson: 3
    prompt: "Quina frase és correcta?"
    answer: "Els nens han d'anar al llit a les nou."
    distractors:
      - text: "Els nens tenen que anar al llit a les nou."
        why: "*Tenir que* és un calc de «tener que». En català: *han d'anar*."
      - text: "Els nens han de anar al llit a les nou."
        why: "Davant de vocal, *de* s'apostrofa: *han d'anar*."
    explanation: "*Haver de* + infinitiu. Davant de vocal, *de* s'apostrofa: *han d'anar*."

  - id: a2-03-030
    type: fill
    point: haver-de-cal
    lesson: 3
    prompt: "Aquest cap de setmana ___ netejar el pis."
    hint: "*haver de*, jo"
    answers: ["he de"]
    wrong_answers:
      - text: "tinc que"
        why: "*Tinc que* és un calc de «tengo que». En català: *he de*."
      - text: "he que"
        why: "*Haver de* porta sempre la preposició *de*."
    grading: tolerant
    explanation: "L'obligació d'una persona es diu amb *haver de* + infinitiu: *he de netejar*."

  - id: a2-03-031
    type: fill
    point: haver-de-cal
    lesson: 3
    prompt: "Els nens ___ fer els deures abans de sopar."
    hint: "*haver de*, ells"
    answers: ["han de"]
    wrong_answers:
      - text: "tenen que"
        why: "*Tenir que* és un calc de «tener que»."
      - text: "han que"
        why: "*Haver de* porta sempre la preposició *de*."
    grading: tolerant
    explanation: "Amb «ells», *haver de* fa *han de*: *han de fer*."

  - id: a2-03-032
    type: fill
    point: haver-de-cal
    lesson: 3
    prompt: "Per renovar el DNI ___ demanar hora."
    hint: "*caldre*, present"
    answers: ["cal"]
    wrong_answers:
      - text: "hi ha que"
        why: "*Hi ha que* és un calc de «hay que». Diem *cal*."
    grading: tolerant
    explanation: "Una obligació que no és d'una persona concreta es diu *cal* + infinitiu."

  - id: a2-03-033
    type: fill
    point: haver-de-cal
    lesson: 3
    prompt: "Dissabte passat la Núria ___ treballar."
    hint: "*haver de*, passat perifràstic"
    answers: ["va haver de"]
    wrong_answers:
      - text: "va tenir que"
        why: "*Tenir que* és un calc de «tener que». En català: *va haver de*."
