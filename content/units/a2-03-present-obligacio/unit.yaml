  # ---------- Lliçó 5 ----------
  - id: a2-03-053
    type: reading
    point: present-regular
    lesson: 5
    title: "El matí de la Fàtima"
    text: |
      La Fàtima treballa en una pastisseria de Sabadell. Es lleva a les cinc del matí, perquè a les set ha de tenir el pa a punt. Esmorza una torrada i un cafè a la cuina de casa.

      Entre setmana acaba de treballar a les tres. Dina a casa, fa una migdiada d'una hora i després va a buscar el seu fill a l'escola.

      Els dissabtes la pastisseria tanca a les dues. Llavors la Fàtima queda amb unes amigues per prendre un te. De tant en tant fan una passejada fins al riu. Els diumenges no treballa.
    questions:
      - prompt: "A quina hora ha de tenir el pa a punt la Fàtima?"
        answer: "A les set del matí."
        distractors:
          - text: "A les cinc del matí."
            why: "A les cinc es lleva, però el pa ha d'estar a punt a les set."
          - text: "A les tres de la tarda."
            why: "A les tres acaba de treballar."
      - prompt: "Què fa la Fàtima després de dinar, entre setmana?"
        answer: "Dorm una hora i va a buscar el seu fill."
        distractors:
          - text: "Torna a la pastisseria fins a les dues."
            why: "La pastisseria tanca a les dues només els dissabtes."
          - text: "Pren un te amb unes amigues."
            why: "Això ho fa els dissabtes, no entre setmana."
      - prompt: "Què fa la Fàtima de tant en tant els dissabtes?"
        answer: "Va a passejar fins al riu amb les amigues."
        distractors:
          - text: "Treballa a la pastisseria fins a les tres."
            why: "Els dissabtes la pastisseria tanca a les dues."
          - text: "Fa una migdiada a la cuina."
            why: "La migdiada la fa entre setmana, a casa."
      - prompt: "Quin dia de la setmana no treballa la Fàtima?"
        answer: "Els diumenges."
        distractors:
          - text: "Els dissabtes."
            why: "Els dissabtes treballa fins a les dues."
          - text: "Els divendres."
            why: "Entre setmana treballa fins a les tres."
    explanation: "El text descriu la rutina d'una setmana de la Fàtima: hores, feina i estones lliures."

