  # ---------------- Lliçó 5 ----------------
  - id: b1-33-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una mudança amb entrebancs"
    text: |
      La Fàtima i el Wei viuen de lloguer al barri de Gràcia des de fa tres anys, però el pis se'ls ha quedat petit: ell treballa des de casa i necessita un despatx. Al març van trobar un pis més gran a Sants, amb tres dormitoris i una terrassa on cau el sol a la tarda.

      La mudança va ser dissabte passat. L'Ibrahim, un amic que té una furgoneta, va dur totes les caixes de llibres d'una vegada. La Fàtima va treure la pols dels prestatges buits mentre el Wei penjava les cortines del menjador. A mig matí van seure tots tres a les escales a beure un cafè amb llet: l'ascensor estava espatllat i pujar el sofà els havia deixat fets pols.

      A la tarda va caure un got de la cuina i es va trencar. El Wei va riure i va dir: «Si cau un got, diuen que porta sort». La Fàtima no s'ho creu, aquestes coses, però admet que la tarda va acabar bé: a les vuit tots els mobles eren al seu lloc.

      Diumenge van fer dissabte al pis nou: van fregar el terra, van penjar els llums i van cobrir el sofà vell amb una manta. «Ara sí que hi vivim», va dir la Fàtima.
    questions:
      - prompt: "Per què marxen del pis de Gràcia?"
        answer: "Perquè és massa petit per treballar-hi."
        distractors:
          - text: "Perquè el lloguer és massa car."
            why: "El text diu que se'ls ha quedat petit, no que sigui car."
          - text: "Perquè volen viure a Sants."
            why: "Sants és on van, no el motiu: el motiu és la mida del pis."
      - prompt: "Què fa l'Ibrahim durant la mudança?"
        answer: "Porta les caixes de llibres amb la furgoneta."
        distractors:
          - text: "Penja les cortines del menjador tot sol."
            why: "Les cortines les penja el Wei."
          - text: "Puja el sofà amb l'ascensor."
            why: "L'ascensor està espatllat: no el fan servir."
      - prompt: "Què passa dissabte a la tarda?"
        answer: "Es trenca un got de la cuina."
        distractors:
          - text: "Es trenca una cortina del menjador."
            why: "El que es trenca és un got, no una cortina."
          - text: "El Wei cau per les escales."
            why: "El Wei riu; el que cau és el got."
      - prompt: "Què fan diumenge?"
        answer: "Netegen el pis nou a fons."
        distractors:
          - text: "Fan la mudança amb la furgoneta."
            why: "La mudança és dissabte; diumenge netegen."
          - text: "Tornen al pis de Gràcia."
            why: "Diumenge són al pis nou, no a Gràcia."
    explanation: "El text explica la mudança de la Fàtima i el Wei: dissabte traslladen els mobles i diumenge netegen."

