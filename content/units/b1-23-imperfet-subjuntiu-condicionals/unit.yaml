id: b1-23
level: B1
title: "Imperfet de subjuntiu i condicionals"
summary: "Aprens les formes de l'imperfet de subjuntiu (*tingués*, *fos*, *anés*) i les frases condicionals (*Si tingués temps, hi aniria*)."
vocabulary_theme: "Somnis, hipòtesis i diners"
points:
  - id: formes-subjuntiu
    title: "L'imperfet de subjuntiu: *tingués*, *fos*, *anés*"
    refs:
      - label: "GEIEC: El subjuntiu"
        url: "https://geiec.iec.cat"
  - id: condicionals-si
    title: "*Si* + imperfet de subjuntiu + condicional"
    refs:
      - label: "GEIEC: Les oracions condicionals"
        url: "https://geiec.iec.cat"
  - id: desitjos-consells
    title: "Desitjos i consells irreals"
    refs:
      - label: "GEIEC: El subjuntiu"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *si tindria*"
  - id: expressions
    title: "Expressions per parlar de somnis"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: formes i hipòtesis"
  - title: "Practicar: formes i condicionals"
  - title: "Desitjos, consells i interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el somni"
    definition: "Cosa que imaginem mentre dormim o que volem aconseguir."
    example: "El meu somni és viure un any a l'estranger."
  - word: "el desig"
    definition: "Ganes de tenir una cosa."
    example: "El seu desig és tenir una casa amb jardí."
  - word: "la hipòtesi"
    definition: "Idea que imaginem per pensar què passaria."
    example: "Fem una hipòtesi: i si guanyem la loteria?"
  - word: "el supòsit"
    definition: "Situació imaginada, que potser no és real."
    example: "En aquest supòsit, caldrien dos cotxes."
  - word: "el premi"
    definition: "Diners o regal que guanya algú."
    example: "El primer premi és un viatge al Carib."
  - word: "la loteria"
    definition: "Joc on es guanyen diners per sort."
    example: "Cada Nadal comprem loteria amb la família."
  - word: "el dècim"
    definition: "Bitllet de loteria que és la desena part d'un número."
    example: "Hem comprat un dècim del número del barri."
  - word: "l'herència"
    definition: "Diners o béns que rebem d'un familiar que s'ha mort."
    example: "Amb l'herència de l'àvia van pagar l'entrada del pis."
  - word: "l'estalvi"
    definition: "Diners que guardem per al futur."
    example: "Cada mes posem cent euros a l'estalvi."
  - word: "el deute"
    definition: "Diners que devem a algú."
    example: "Encara té un deute amb el banc."
  - word: "la hipoteca"
    definition: "Préstec gran per comprar una casa, que es torna a poc a poc."
    example: "Paguen mil euros d'hipoteca cada mes."
  - word: "el lloguer"
    definition: "Diners que paguem cada mes per viure en un pis que no és nostre."
    example: "El lloguer a Barcelona és caríssim."
  - word: "el sou"
    definition: "Diners que guanyem cada mes amb la feina."
    example: "Amb aquest sou no pot estalviar gens."
  - word: "la beca"
    definition: "Diners que rep un estudiant per estudiar."
    example: "Va aconseguir una beca per estudiar a Lió."
  - word: "el préstec"
    definition: "Diners que el banc ens deixa i que hem de tornar."
    example: "Van demanar un préstec per obrir la botiga."
  - word: "el bitllet"
    definition: "Paper que serveix per viatjar o per entrar en un lloc."
    example: "Hem comprat dos bitllets per a Roma."
  - word: "el viatge"
    definition: "Desplaçament llarg per plaer o per feina."
    example: "Somien fer un viatge al Japó."
  - word: "l'illa"
    definition: "Terra petita envoltada d'aigua."
    example: "Somia viure en una illa del Mediterrani."
  - word: "la masia"
    definition: "Casa gran de pagès, típica del camp català."
    example: "Si fossin rics, comprarien una masia al Penedès."
  - word: "el negoci"
    definition: "Activitat per guanyar diners, com una botiga o un taller."
    example: "Vol obrir un negoci de bicicletes."
  - word: "la jubilació"
    definition: "Etapa de la vida quan ja no es treballa."
    example: "Pensa en la jubilació: vol viure a prop del mar."
  - word: "jubilar-se"
    definition: "Deixar de treballar per l'edat."
    example: "Es jubilarà l'any que ve."
  - word: "estalviar"
    definition: "Guardar diners per al futur."
    example: "Si estalviés una mica, podria viatjar."
  - word: "gastar"
    definition: "Fer servir diners per comprar coses."
    example: "Gasta molt en restaurants."
  - word: "tocar"
    definition: "Aconseguir un premi de la loteria per sort."
    example: "Diuen que li va tocar la loteria."
  - word: "guanyar"
    definition: "Aconseguir diners o un premi."
    example: "Si guanyés el premi, deixaria la feina."
  - word: "apostar"
    definition: "Jugar diners a un resultat incert."
    example: "No aposta mai: diu que és llençar els diners."
  - word: "imaginar-se"
    definition: "Pensar una cosa que no és real."
    example: "Imagina't que tens un milió d'euros!"
  - word: "somiar"
    definition: "Veure imatges mentre dormim, o desitjar molt una cosa."
    example: "Somia que té una casa al mar."
  - word: "desitjar"
    definition: "Voler molt una cosa."
    example: "Desitja tenir més temps lliure."
  - word: "la sort"
    definition: "Fet que passin coses bones sense buscar-les."
    example: "Va tenir sort: li va tocar un viatge."
  - word: "la fortuna"
    definition: "Molts diners."
    example: "Diuen que té una fortuna, però viu en un pis petit."
  - word: "el compte"
    definition: "Diners que tenim al banc."
    example: "Mira el compte cada setmana."
  - word: "la volta al món"
    definition: "Viatge que passa per molts països."
    example: "El seu somni és fer la volta al món."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-23-001
    type: choice
    point: formes-subjuntiu
    lesson: 1
    prompt: "Si ___ prou diners, faria la volta al món."
    answer: "tingués"
    distractors:
      - text: "tindria"
        why: "En una condició, darrere de *si* no va el condicional: va l'imperfet de subjuntiu, *tingués*."
      - text: "tingui"
        why: "*Tingui* és present de subjuntiu. En una hipòtesi amb *si* va l'imperfet: *tingués*."
    explanation: "En una hipòtesi amb *si*, *tenir* (jo) fa *tingués*."

  - id: b1-23-002
    type: choice
    point: formes-subjuntiu
    lesson: 1
    prompt: "Si ___ ric, no treballaria més."
    answer: "fos"
    distractors:
      - text: "seria"
        why: "*Seria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *fos*."
      - text: "sigui"
        why: "*Sigui* és present de subjuntiu. En una condició amb *si* va l'imperfet: *fos*."
    explanation: "*Ser* és irregular: en imperfet de subjuntiu (jo) fa *fos*."

  - id: b1-23-003
    type: choice
    point: formes-subjuntiu
    lesson: 1
    prompt: "Si ___ a la festa, vindria amb tu."
    answer: "anés"
    distractors:
      - text: "aniria"
        why: "*Aniria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *anés*."
      - text: "vagi"
        why: "*Vagi* és present de subjuntiu. En una condició amb *si* va l'imperfet: *anés*."
    explanation: "*Anar* (jo) en imperfet de subjuntiu fa *anés*."

  - id: b1-23-004
    type: choice
    point: formes-subjuntiu
    lesson: 1
    prompt: "Si ___ la resposta, la diria."
    answer: "sabés"
    distractors:
      - text: "sabria"
        why: "*Sabria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *sabés*."
      - text: "sàpiga"
        why: "*Sàpiga* és present de subjuntiu. En una condició amb *si* va l'imperfet: *sabés*."
    explanation: "*Saber* (jo) en imperfet de subjuntiu fa *sabés*."

  - id: b1-23-005
    type: choice
    point: condicionals-si
    lesson: 1
    prompt: "Si guanyés la loteria, ___ una masia al Penedès."
    answer: "compraria"
    distractors:
      - text: "comprés"
        why: "La condició ja és a la primera part («si guanyés»); el resultat va en condicional: *compraria*."
      - text: "compro"
        why: "*Compro* és present. Amb una hipòtesi irreal («si guanyés»), el resultat va en condicional: *compraria*."
    explanation: "La condició («si guanyés») ja porta l'imperfet de subjuntiu; el resultat va en condicional: *compraria*."

  - id: b1-23-006
    type: choice
    point: condicionals-si
    lesson: 1
    prompt: "Si plogués, ___ a casa."
    answer: "ens quedaríem"
    distractors:
      - text: "ens quedéssim"
        why: "El resultat va en condicional, no en subjuntiu: *ens quedaríem*."
      - text: "ens quedem"
        why: "*Ens quedem* és present. Amb una hipòtesi («si plogués»), el resultat va en condicional: *ens quedaríem*."
    explanation: "Amb «si plogués» (hipòtesi), el resultat va en condicional: *ens quedaríem*."

  - id: b1-23-007
    type: choice
    point: condicionals-si
    lesson: 1
    prompt: "Fem una hipòtesi: si fossis ric, què ___?"
    answer: "faries"
    distractors:
      - text: "fessis"
        why: "*Fessis* és imperfet de subjuntiu. La condició ja hi és («si fossis»); la pregunta demana el resultat: *faries*."
      - text: "fas"
        why: "*Fas* és present. Amb una hipòtesi («si fossis») cal el condicional: *faries*."
    explanation: "La condició ja hi és («si fossis»); la pregunta demana el resultat, en condicional: *faries*."

  - id: b1-23-008
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «Tant de bo!»?"
    answer: "Expressa un desig."
    distractors:
      - text: "Expressa una ordre."
        why: "No és una ordre: no mana res a ningú."
      - text: "Expressa un dubte."
        why: "No parla de dubtes: parla de ganes que passi una cosa."
    explanation: "*Tant de bo* serveix per expressar un desig: *Tant de bo plogui!*."

  - id: b1-23-009
    type: match
    point: formes-subjuntiu
    lesson: 1
    instruction: "Relaciona cada infinitiu amb la forma de *jo* en imperfet de subjuntiu."
    pairs:
      - ["tenir", "tingués"]
      - ["ser", "fos"]
      - ["anar", "anés"]
      - ["fer", "fes"]
      - ["poder", "pogués"]
    explanation: "Són formes irregulars: *tingués*, *fos*, *anés*, *fes* i *pogués*."

  - id: b1-23-010
    type: inline-choice
    point: condicionals-si
    lesson: 1
    title: "Un somni"
    text: "Si {tingués|tindria|tingui} molts diners, {compraria|comprés|compro} una casa a prop del mar. Si {fos|seria|sigui} allà, {convidaria|convidés|convido} els meus amics cada estiu. Si em {toqués|tocaria|toqui} la loteria, no {apostaria|apostés|aposto} més."
    explanation: "Les hipòtesis porten *si* + imperfet (*tingués*, *fos*, *toqués*) i el resultat va en condicional (*compraria*, *convidaria*, *apostaria*)."

  - id: b1-23-011
    type: fill
    point: formes-subjuntiu
    lesson: 1
    prompt: "Si ___ (*poder*, jo) triar, viatjaria al Japó."
    hint: "*poder*, imperfet de subjuntiu (jo)"
    answers: ["pogués"]
    wrong_answers:
      - text: "podria"
        why: "*Podria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *pogués*."
      - text: "pugui"
        why: "*Pugui* és present de subjuntiu. En una condició amb *si* va l'imperfet: *pogués*."
    grading: tolerant
    explanation: "*Poder* (jo) en imperfet de subjuntiu fa *pogués*."

  - id: b1-23-012
    type: fill
    point: formes-subjuntiu
    lesson: 1
    prompt: "Si ___ (*fer*, vosaltres) vacances al juliol, vindríeu amb nosaltres?"
    hint: "*fer*, imperfet de subjuntiu (vosaltres)"
    answers: ["féssiu"]
    wrong_answers:
      - text: "faríeu"
        why: "*Faríeu* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *féssiu*."
      - text: "feu"
        why: "*Feu* no és imperfet de subjuntiu. En una condició amb *si* va *féssiu*."
    grading: tolerant
    explanation: "*Fer* (vosaltres) en imperfet de subjuntiu fa *féssiu*."

  - id: b1-23-013
    type: order
    point: condicionals-si
    lesson: 1
    cue: "Explica a un amic què faria ell: si tingués temps, ajudaria la Laia."
    chunks: ["si", "tinguessis", "temps", "ajudaries", "la Laia"]
    extra: ["tindries"]
    answers:
      - "Si tinguessis temps, ajudaries la Laia."
      - "Ajudaries la Laia si tinguessis temps."
    explanation: "La condició («si tinguessis») va en imperfet de subjuntiu i el resultat (*ajudaries*) en condicional."

  # ---------------- Lliçó 2 ----------------
  - id: b1-23-014
    type: fill
    point: formes-subjuntiu
    lesson: 2
    prompt: "Si ___ (*estar*, jo) jubilat, viatjaria tot l'any."
    hint: "*estar*, imperfet de subjuntiu (jo)"
    answers: ["estigués"]
    wrong_answers:
      - text: "estaria"
        why: "*Estaria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *estigués*."
      - text: "estigui"
        why: "*Estigui* és present de subjuntiu. En una condició amb *si* va l'imperfet: *estigués*."
    grading: tolerant
    explanation: "*Estar* (jo) en imperfet de subjuntiu fa *estigués*."

  - id: b1-23-015
    type: fill
    point: formes-subjuntiu
    lesson: 2
    prompt: "Si ___ (*venir*, tu) amb nosaltres, gaudiries molt."
    hint: "*venir*, imperfet de subjuntiu (tu)"
    answers: ["vinguessis"]
    wrong_answers:
      - text: "vindries"
        why: "*Vindries* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *vinguessis*."
      - text: "vinguis"
        why: "*Vinguis* és present de subjuntiu. En una condició amb *si* va l'imperfet: *vinguessis*."
    grading: tolerant
    explanation: "*Venir* (tu) en imperfet de subjuntiu fa *vinguessis*."

  - id: b1-23-016
    type: fill
    point: formes-subjuntiu
    lesson: 2
    prompt: "Si ___ (*dir*, ell) la veritat, l'ajudaríem."
    hint: "*dir*, imperfet de subjuntiu (ell)"
    answers: ["digués"]
    wrong_answers:
      - text: "diria"
        why: "*Diria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *digués*."
    grading: tolerant
    explanation: "*Dir* (ell) en imperfet de subjuntiu fa *digués*."

  - id: b1-23-017
    type: fill
    point: condicionals-si
    lesson: 2
    prompt: "Si tingués molts diners al compte, ___ (*deixar*) la feina."
    hint: "*deixar*, condicional (jo)"
    answers: ["deixaria"]
    wrong_answers:
      - text: "deixés"
        why: "La condició ja hi és («si tingués»); el resultat va en condicional: *deixaria*."
      - text: "deixo"
        why: "*Deixo* és present. El resultat d'una hipòtesi va en condicional: *deixaria*."
    grading: tolerant
    explanation: "El resultat d'una hipòtesi va en condicional: *deixaria*."

  - id: b1-23-018
    type: fill
    point: condicionals-si
    lesson: 2
    prompt: "Si visquéssim a prop del mar, ___ cada dia."
    hint: "*banyar-se*, condicional (nosaltres)"
    answers: ["ens banyaríem"]
    wrong_answers:
      - text: "ens banyéssim"
        why: "El resultat va en condicional, no en subjuntiu: *ens banyaríem*."
    grading: tolerant
    explanation: "El resultat va en condicional: *ens banyaríem*."

  - id: b1-23-019
    type: fill
    point: condicionals-si
    lesson: 2
    prompt: "Si no ___ (*ploure*) tant, sortiríem a passejar."
    hint: "*ploure*, imperfet de subjuntiu"
    answers: ["plogués"]
    wrong_answers:
      - text: "plouria"
        why: "*Plouria* és condicional. En una condició, darrere de *si* va l'imperfet de subjuntiu: *plogués*."
    grading: tolerant
    explanation: "*Ploure* en imperfet de subjuntiu fa *plogués*."

  - id: b1-23-020
    type: order
    point: formes-subjuntiu
    lesson: 2
    cue: "Explica a una amiga què faria ella: si pogués, es quedaria a casa."
    chunks: ["si", "poguessis", "et", "quedaries", "a casa"]
    extra: ["podries"]
    answers:
      - "Si poguessis, et quedaries a casa."
      - "Et quedaries a casa si poguessis."
    explanation: "«Si poguessis»: la condició va en imperfet de subjuntiu; el resultat, en condicional."

  - id: b1-23-021
    type: order
    point: condicionals-si
    lesson: 2
    cue: "Explica que compraries un cotxe nou si tinguessis diners."
    chunks: ["compraria", "un cotxe nou", "si", "tingués", "diners"]
    extra: ["tindria"]
    answers:
      - "Compraria un cotxe nou si tingués diners."
      - "Si tingués diners, compraria un cotxe nou."
    explanation: "El resultat (*compraria*) va en condicional i la condició («si tingués») en imperfet de subjuntiu."

  - id: b1-23-022
    type: order
    point: condicionals-si
    lesson: 2
    cue: "Digues que la Núria vindria si pogués."
    chunks: ["la Núria", "vindria", "si", "pogués"]
    extra: ["podria"]
    answers:
      - "La Núria vindria si pogués."
      - "Si pogués, la Núria vindria."
    explanation: "El resultat (*vindria*) va en condicional i la condició («si pogués») en imperfet de subjuntiu."

  - id: b1-23-023
    type: choice
    point: formes-subjuntiu
    lesson: 2
    prompt: "Imagina't que ___ més trens: aniries a treballar en tren?"
    answer: "hi hagués"
    distractors:
      - text: "hi hauria"
        why: "*Hi hauria* és condicional. En una hipòtesi va l'imperfet de subjuntiu: *hi hagués*."
      - text: "hi hagi"
        why: "*Hi hagi* és present de subjuntiu. En una hipòtesi va l'imperfet: *hi hagués*."
    explanation: "«Aniries» (condicional) marca una hipòtesi: *haver-hi* en imperfet de subjuntiu fa *hi hagués*."

  - id: b1-23-024
    type: choice
    point: condicionals-si
    lesson: 2
    prompt: "Si estalviessis una mica cada mes, ___ anar al Japó."
    answer: "podries"
    distractors:
      - text: "poguessis"
        why: "La condició ja hi és («si estalviessis»); el resultat va en condicional: *podries*."
      - text: "pots"
        why: "*Pots* és present. Amb una hipòtesi («si estalviessis»), el resultat va en condicional: *podries*."
    explanation: "El resultat d'una hipòtesi irreal va en condicional: *podries*."

  - id: b1-23-025
    type: choice
    point: condicionals-si
    lesson: 2
    prompt: "Si guanyés el premi, ___ la hipoteca."
    answer: "pagaria"
    distractors:
      - text: "pagués"
        why: "La condició ja hi és («si guanyés»); el resultat va en condicional: *pagaria*."
      - text: "pago"
        why: "*Pago* és present. El resultat d'una hipòtesi va en condicional: *pagaria*."
    explanation: "El resultat va en condicional: *pagaria*."

  - id: b1-23-026
    type: inline-choice
    point: condicionals-si
    lesson: 2
    title: "Plans per al futur"
    text: "Si {pogués|podria|pugui} triar, {estudiaria|estudiés|estudio} medicina. En aquest supòsit, {necessitaria|necessités|necessitin} una beca."
    explanation: "Les hipòtesis porten *si* + imperfet (*pogués*) i el resultat va en condicional (*estudiaria*, *necessitaria*)."

  # ---------------- Lliçó 3 ----------------
  - id: b1-23-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Si tindria temps, aprendria anglès."
    error: "tindria"
    fix: "tingués"
    fix_distractors:
      - text: "tindré"
        why: "*Tindré* és futur. En una condició, darrere de *si* va l'imperfet de subjuntiu: *tingués*."
      - text: "tingui"
        why: "*Tingui* és present de subjuntiu. En una hipòtesi amb *si* va l'imperfet de subjuntiu: *tingués*."
    explanation: "En una condició, darrere de *si* no va mai el condicional. «Si tindria» és un error: cal *si tingués*. Aquest error també surt en castellà col·loquial («si tendría»)."

  - id: b1-23-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Si podria triar, viatjaria sola."
    error: "podria"
    fix: "pogués"
    fix_distractors:
      - text: "puc"
        why: "*Puc* és present. En una condició, darrere de *si* va l'imperfet de subjuntiu: *pogués*."
      - text: "podré"
        why: "*Podré* és futur. En una condició, darrere de *si* va l'imperfet de subjuntiu: *pogués*."
    explanation: "En una condició, darrere de *si* no va mai el condicional: «si podria» és un error. La forma correcta és *si pogués*. També és un error típic en castellà («si podría»)."

  - id: b1-23-029
    type: find-error
    point: compte-castella
    lesson: 3
