  # ---------------- Lliçó 5 ----------------
  - id: b1-23-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Si em toqués la loteria"
    text: |
      En Jordi té trenta-vuit anys i treballa en un taller de bicicletes a Sabadell. Cada divendres compra un dècim de la loteria amb els companys de la feina. De moment no els ha tocat mai res, però aquell dia, a l'hora de dinar, sempre fan la mateixa broma: què farien si els toqués el primer premi?

      En Jordi ho té clar. Si guanyés el premi, deixaria el lloguer i compraria una masia petita a prop del mar. Pagaria els deutes del seu germà i estalviaria la resta. «I després?» li pregunta la Laia, una companya. «Doncs faria la volta al món amb bicicleta», respon ell. La Laia riu: ella, si fos rica, no deixaria la feina. Obriria un negoci propi, una botiga de llibres al barri.

      També fan hipòtesis més petites. Si no gastessin tant en cafès, estalviarien prou per a un bitllet d'avió. I la Laia diu que el seu desig no és car: una setmana de vacances sense mòbil.

      El somni dura fins a les tres, quan tornen al taller. En Jordi sap que és difícil: la probabilitat de guanyar és mínima. Però somia truites una estona cada setmana i li agrada. «Tant de bo ens toqui una mica de sort!», diu abans de tornar a la feina.
    questions:
      - prompt: "Què fan cada divendres en Jordi i els companys?"
        answer: "Compren un dècim i parlen de què farien."
        distractors:
          - text: "Es reparteixen el primer premi entre tots."
            why: "No els ha tocat mai res, no es reparteixen res."
          - text: "Dinen en un restaurant a prop del taller."
            why: "El text no diu on dinen: diu que, a l'hora de dinar, parlen de què farien amb el premi."
      - prompt: "Què faria en Jordi si guanyés el premi?"
        answer: "Compraria una casa al camp i faria un gran viatge."
        distractors:
          - text: "Obriria una botiga de llibres al barri."
            why: "Això és el que faria la Laia."
          - text: "Continuaria vivint de lloguer."
            why: "Ell deixaria el lloguer i compraria una masia."
      - prompt: "I la Laia, què faria si fos rica?"
        answer: "Obriria el seu propi negoci."
        distractors:
          - text: "Deixaria la feina per viure del premi."
            why: "Ella diu que no deixaria la feina."
          - text: "Compraria una masia a prop del mar."
            why: "La masia és el somni d'en Jordi."
      - prompt: "Com acaba el somni cada divendres?"
        answer: "Tornen al taller a les tres."
        distractors:
          - text: "Guanyen el primer premi."
            why: "No els ha tocat mai res."
          - text: "Van a comprar el dècim."
            why: "El dècim ja l'han comprat abans."
    explanation: "En Jordi i la Laia somien cada divendres amb allò que farien si guanyessin la loteria."

