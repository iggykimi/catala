    sentence: "Si tindries diners, ajudaries tothom."
    error: "tindries"
    fix: "tinguessis"
    fix_distractors:
      - text: "tens"
        why: "*Tens* és present. En una condició, darrere de *si* va l'imperfet de subjuntiu: *tinguessis*."
      - text: "tindràs"
        why: "*Tindràs* és futur. En una condició, darrere de *si* va l'imperfet de subjuntiu: *tinguessis*."
