  # ---------- Lliçó 5 ----------
  - id: b2-59-051
    type: reading
    point: comprensio
    lesson: 5
    title: "Un debat al centre cívic"
    text: |
      Dissabte passat el centre cívic del barri va acollir un debat sobre el nou carril bici del carrer Major. L'Ajuntament proposa eliminar un carril de circulació per fer-hi passar el carril bici. La sala era plena: hi havia unes cent cinquanta persones i l'acte va durar gairebé tres hores. La Laia, la moderadora, va obrir el torn de paraula recordant les normes: intervencions de dos minuts i respecte per totes les opinions.

      El primer a parlar va ser en Pere, en nom de l'associació de veïns. Va defensar la proposta amb tres arguments: menys cotxes, menys soroll i més seguretat per als infants. «No és que vulguem eliminar els cotxes —va matisar—, sinó que volem un carrer on tothom hi càpiga.»

      La Montse, que té una botiga al carrer, va presentar el contraargument principal: amb les obres perdrà clients durant mesos. «Estic d'acord que cal pacificar el trànsit —va dir—. Ara bé, qui pagarà les pèrdues dels comerciants?» El desacord va créixer quan en Jordi va dir que els comerciants sempre «tenen la paella pel mànec». La moderadora el va interrompre i li va recordar que calia respectar les opinions de tothom.

      Al final, tot i que no hi va haver consens, la majoria va acceptar una solució intermèdia: fer el carril bici per fases i obrir una votació en línia sobre el calendari. En Pere va dir que hi estava en part d'acord, però que calia concretar les dates. «Tenim el deure d'escoltar tothom —va concloure la Laia—, però també de decidir.» La votació serà el mes vinent.
    questions:
      - prompt: "Què proposa l'Ajuntament?"
        answer: "Convertir un carril de circulació en carril bici."
        distractors:
          - text: "Eliminar tots els cotxes del carrer Major."
            why: "En Pere ho nega: «No és que vulguem eliminar els cotxes»."
          - text: "Tancar totes les botigues del carrer durant les obres."
            why: "La Montse parla de perdre clients, no de tancar botigues."
      - prompt: "Quin és el contraargument de la Montse?"
        answer: "Les obres faran perdre clients als comerciants."
        distractors:
          - text: "El carril bici és perillós per als infants."
            why: "Al contrari: en Pere diu que donarà més seguretat als infants."
          - text: "Els veïns no podran votar el calendari."
            why: "La votació en línia es va acceptar al final del debat."
      - prompt: "Per què la moderadora interromp en Jordi?"
        answer: "Perquè va faltar al respecte als comerciants."
        distractors:
          - text: "Perquè va parlar més de dos minuts."
            why: "El text no diu quants minuts va parlar."
          - text: "Perquè no estava d'acord amb la proposta."
            why: "El desacord no és cap motiu: el problema és la falta de respecte."
      - prompt: "Com acaba el debat?"
        answer: "Amb una solució per fases i una votació sobre el calendari."
        distractors:
          - text: "Amb un consens total a favor del carril bici."
            why: "El text diu que no hi va haver consens."
          - text: "Amb la retirada de la proposta de l'Ajuntament."
            why: "La proposta continua: es farà per fases."
    explanation: "El text explica el debat sobre el carril bici del carrer Major: els arguments, el desacord i l'acord final."

