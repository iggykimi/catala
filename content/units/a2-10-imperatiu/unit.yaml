id: a2-10
level: A2
title: "L'imperatiu"
summary: "L'imperatiu afirmatiu i negatiu (*parla, no parlis*), set verbs irregulars (*ves, vine, fes, digues, sigues, tingues, vegeu*) i l'imperatiu amb pronoms (*obre-la, digues-me*), amb receptes i instruccions de cuina."
vocabulary_theme: "Cuina, receptes i instruccions"
points:
  - id: imperatiu-afirmatiu
    title: "L'imperatiu afirmatiu"
    refs:
      - label: "GEIEC: L'imperatiu"
        url: "https://geiec.iec.cat"
  - id: imperatiu-negatiu
    title: "L'imperatiu negatiu"
    refs:
      - label: "GEIEC: L'imperatiu"
        url: "https://geiec.iec.cat"
  - id: imperatius-irregulars
    title: "Els imperatius irregulars"
    refs:
      - label: "GEIEC: L'imperatiu"
        url: "https://geiec.iec.cat"
  - id: imperatiu-amb-pronom
    title: "L'imperatiu amb un pronom"
    refs:
      - label: "GEIEC: L'imperatiu"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: el negatiu i les ordres"
  - id: expressions
    title: "Expressions per animar i avisar"
lessons:
  - title: "Ordres en afirmatiu i en negatiu"
  - title: "Practicar l'imperatiu"
  - title: "Irregulars, pronoms i errors típics"
  - title: "Transformar frases"
  - title: "Repàs i una recepta"
vocabulary:
  - word: "el forn"
    definition: "Aparell molt calent on es cou el menjar."
    example: "El pa ja és al forn."
  - word: "la cassola"
    definition: "Recipient rodó i fondo per cuinar."
    example: "Posa l'arròs a la cassola."
  - word: "l'olla"
    definition: "Recipient alt per fer sopa o brou."
    example: "Fes el dinar amb l'olla gran."
  - word: "el ganivet"
    definition: "Eina amb fulla per tallar."
    example: "No agafis el ganivet per la fulla."
  - word: "la cullera"
    definition: "Eina per menjar la sopa o remenar."
    example: "Fes servir la cullera grossa."
  - word: "el plat"
    definition: "Peça plana on es posa el menjar."
    example: "Posa els plats a taula."
  - word: "la sal"
    definition: "Pols blanca que dona gust al menjar."
    example: "No posis la sal encara."
  - word: "l'oli"
    definition: "Líquid groc per fregir i amanir."
    example: "Posa l'oli a la cassola."
  - word: "la recepta"
    definition: "Explicació de com es fa un plat."
    example: "Llegeix la recepta abans de començar."
  - word: "l'all"
    definition: "Planta petita de gust molt fort."
    example: "Compra all: a casa no n'hi ha gens."
  - word: "la ceba"
    definition: "Verdura rodona que fa plorar quan es talla."
    example: "Talla una ceba petita."
  - word: "el tomàquet"
    definition: "Fruita vermella que es menja en amanida."
    example: "Agafa els tomàquets de la nevera."
  - word: "la nevera"
    definition: "Aparell fred on es guarda el menjar."
    example: "Mira què hi ha a la nevera."
  - word: "el rebost"
    definition: "Lloc fresc de la casa on es guarda el menjar."
    example: "No poseu la llet al rebost."
  - word: "el sopar"
    definition: "Menjar que es fa al vespre."
    example: "El sopar encara no està a punt."
  - word: "el foc"
    definition: "Flames on es cou el menjar."
    example: "No toquis el foc."
  - word: "el drap"
    definition: "Tros de roba per agafar coses calentes."
    example: "Agafa l'olla amb el drap."
  - word: "el got"
    definition: "Recipient per beure aigua o vi."
    example: "Beu un got d'aigua."
  - word: "la tassa"
    definition: "Got petit per al cafè amb llet."
    example: "No trenqueu les tasses."
  - word: "la farina"
    definition: "Pols blanca per fer pa."
    example: "La farina pesa molt."
  - word: "el sucre"
    definition: "Pols dolça que es posa al cafè."
    example: "Posa sucre al cafè."
  - word: "l'ou"
    definition: "Menjar rodó per fer una truita."
    example: "Trenca quatre ous en un plat."
  - word: "la patata"
    definition: "Verdura rodona de color marró."
    example: "Renta bé les patates."
  - word: "l'arròs"
    definition: "Grans blancs que es couen en aigua."
    example: "Remena l'arròs a poc a poc."
  - word: "el brou"
    definition: "Aigua calenta amb gust de verdura."
    example: "Tasta el brou abans de servir."
  - word: "la truita"
    definition: "Plat pla i rodó fet amb ous."
    example: "Fes la truita ara."
  - word: "la cuina"
    definition: "Lloc de la casa on es prepara el menjar."
    example: "Surt de la cuina un moment."
  - word: "tallar"
    definition: "Dividir el menjar amb el ganivet."
    example: "Talla el pa ben fi."
  - word: "remenar"
    definition: "Moure el menjar dins l'olla o la cassola."
    example: "Remena la sopa a poc a poc."
  - word: "afegir"
    definition: "Posar una cosa més a una altra."
    example: "Afegeix una ceba a la cassola."
  - word: "bullir"
    definition: "Coure en aigua molt i molt calenta."
    example: "L'olla bull molt fort."
  - word: "fregir"
    definition: "Coure en oli molt calent."
    example: "Fregeix-ho tot amb molt d'oli."
  - word: "tastar"
    definition: "Menjar una mica per saber quin gust té."
    example: "Tasta el brou abans de servir."
  - word: "escalfar"
    definition: "Fer tornar calent una cosa freda."
    example: "Escalfa la llet i afegeix el sucre."
  - word: "servir"
    definition: "Posar el menjar al plat per menjar."
    example: "Serveix-la calenta amb pa."
  - word: "pelar"
    definition: "Treure la pell d'una fruita o verdura."
    example: "Pela tres patates."
  - word: "parar"
    definition: "Posar els plats i els gots a taula."
    example: "Pareu taula, que ja portem el sopar."
  - word: "encendre"
    definition: "Fer que el foc o una màquina comenci."
    example: "Encén el forn a dos-cents graus."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-10-001
    type: choice
    point: imperatiu-afirmatiu
    lesson: 1
    prompt: "Pau, ___ l'arròs a poc a poc, que és calent!"
    answer: "Remena"
    distractors:
      - text: "Remenes"
        why: "*Remenes* és el present. Per donar una ordre a una persona: *remena*."
      - text: "Remeneu"
        why: "*Remeneu* és per a més d'una persona. Aquí parlem a en Pau."
    explanation: "Parlem a una persona (en Pau): l'imperatiu de *tu* de *remenar* és *remena*."

  - id: a2-10-002
    type: choice
    point: imperatiu-afirmatiu
    lesson: 1
    prompt: "Nois, ___ el forn a dos-cents graus."
    answer: "Enceneu"
    distractors:
      - text: "Encén"
        why: "*Encén* és per a una persona. «Nois» en són més d'una."
      - text: "Encenguis"
        why: "*Encenguis* és del negatiu (*no encenguis*). La frase és afirmativa."
    explanation: "Parlem a més d'una persona («nois»): l'imperatiu de *encendre* és *enceneu*."

  - id: a2-10-003
    type: choice
    point: imperatiu-afirmatiu
    lesson: 1
    prompt: "La nevera és oberta: ___ la porta, si us plau."
    answer: "Tanca"
    distractors:
      - text: "Tanques"
        why: "*Tanques* és el present. L'ordre per a una persona és *tanca*."
      - text: "Tanqueu"
        why: "*Tanqueu* és per a més d'una persona."
    explanation: "Donem una ordre a una persona: de *tancar* és *tanca*."

  - id: a2-10-004
    type: choice
    point: imperatiu-afirmatiu
    lesson: 1
    prompt: "___ la finestra, que fa molta olor de fregit."
    answer: "Obre"
    distractors:
      - text: "Obres"
        why: "*Obres* és el present. L'ordre per a una persona és *obre*."
      - text: "Obriu"
        why: "*Obriu* és per a més d'una persona."
    explanation: "Donem una ordre a una persona: de *obrir* és *obre*."

  - id: a2-10-005
    type: choice
    point: imperatiu-negatiu
    lesson: 1
    prompt: "No ___ la sal encara: primer tasta el brou."
    answer: "posis"
    distractors:
      - text: "posa"
        why: "*Posa* és l'afirmatiu. En negatiu la forma canvia: *no posis*."
      - text: "poses"
        why: "*Poses* és el present. En negatiu, l'ordre és *no posis*."
    explanation: "En negatiu, *posar* fa *posis*: la forma porta una *-s*."

  - id: a2-10-006
    type: choice
    point: imperatiu-negatiu
    lesson: 1
    prompt: "No ___ el foc amb les mans mullades."
    answer: "toquis"
    distractors:
      - text: "toca"
        why: "*Toca* és l'afirmatiu. Amb *no*: *no toquis*."
      - text: "toques"
        why: "*Toques* és el present. L'ordre negativa és *no toquis*."
    explanation: "Amb *no*, *tocar* fa *toquis*: cal la *-s* del negatiu."

  - id: a2-10-007
    type: choice
    point: imperatiu-negatiu
    lesson: 1
    prompt: "Nois, no ___ la llet al rebost: va a la nevera."
    answer: "poseu"
    distractors:
      - text: "posa"
        why: "*Posa* és per a una persona i en afirmatiu. Aquí: *no poseu*."
      - text: "posem"
        why: "*Posem* és «nosaltres». Per a «vosaltres»: *poseu*."
    explanation: "«Nois» són més d'una persona: de *posar* és *no poseu*."

  - id: a2-10-008
    type: choice
    point: imperatiu-afirmatiu
    lesson: 1
    prompt: "___ una ceba a la cassola."
    answer: "Afegeix"
    distractors:
      - text: "Afegeixes"
        why: "*Afegeixes* és el present. L'ordre per a una persona és *afegeix*."
      - text: "Afegiu"
        why: "*Afegiu* és per a més d'una persona."
    explanation: "Amb «tu», *afegir* (verb en *-eix-*) fa *afegeix*."

  - id: a2-10-009
    type: match
    point: imperatiu-afirmatiu
    lesson: 1
    instruction: "Relaciona cada verb amb l'ordre per a «tu»."
    pairs:
      - ["tallar", "talla"]
      - ["obrir", "obre"]
      - ["servir", "serveix"]
      - ["encendre", "encén"]
      - ["beure", "beu"]
    explanation: "Amb «tu», l'imperatiu fa *talla, obre, serveix, encén, beu*."

  - id: a2-10-010
    type: match
    point: imperatiu-negatiu
    lesson: 1
    instruction: "Relaciona cada verb amb l'ordre negativa per a «tu»."
    pairs:
      - ["posar", "no posis"]
      - ["tallar", "no tallis"]
      - ["obrir", "no obris"]
      - ["servir", "no serveixis"]
      - ["beure", "no beguis"]
    explanation: "En negatiu, l'imperatiu de «tu» porta *-s*: *no posis, no tallis, no obris, no serveixis, no beguis*."

  - id: a2-10-011
    type: inline-choice
    point: imperatiu-afirmatiu
    lesson: 1
    title: "Recepta d'arròs"
    text: "Per fer l'arròs: primer {posa|poses|posis} l'oli a la cassola, després {afegeix|afegeixes|afegiu} l'arròs i {remena|remenes|remeneu} bé. {Tasta|Tastes|Tasteu} el brou i {serveix|serveixes|serviu} l'arròs calent."
    explanation: "Una recepta dona ordres a una persona: *posa, afegeix, remena, tasta, serveix*."

  - id: a2-10-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "—El tren surt en cinc minuts! —___, que el perdem!"
    answer: "Vinga!"
    distractors:
      - text: "Tranquil!"
        why: "*Tranquil* calma. Aquí no cal calma: cal córrer."
      - text: "Ves amb compte!"
        why: "*Ves amb compte* avisa d'un perill. Aquí cal córrer."
    explanation: "El tren marxa: cal fer córrer algú. Per això fem servir *vinga*."

  - id: a2-10-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Estic ple, no puc més. —___, tasta el brou, que és molt bo!"
    answer: "Au, va!"
    distractors:
      - text: "Ves amb compte!"
        why: "No hi ha cap perill: volem animar. Per això: *au, va*."
      - text: "Tranquil!"
        why: "No pateix ningú: volem animar. Per això: *au, va*."
    explanation: "Insistim perquè tasti el brou. Per animar fem servir *au, va*."

  # ---------- Lliçó 2 ----------
  - id: a2-10-014
    type: fill
    point: imperatiu-afirmatiu
    lesson: 2
    prompt: "___ bé les patates abans de fregir."
    hint: "rentar, tu"
    answers: ["Renta"]
    wrong_answers:
      - text: "Rentes"
        why: "*Rentes* és el present. L'ordre per a una persona és *renta*."
      - text: "Renteu"
        why: "*Renteu* és per a més d'una persona."
    grading: tolerant
    explanation: "L'ordre és per a una persona: de *rentar* és *renta*."

  - id: a2-10-015
    type: fill
    point: imperatiu-afirmatiu
    lesson: 2
    prompt: "Nois, ___ taula, que ja portem el sopar."
    hint: "parar, vosaltres"
    answers: ["Pareu"]
    wrong_answers:
      - text: "Para"
        why: "*Para* és per a una persona. «Nois» en són més d'una."
      - text: "Parem"
        why: "*Parem* és «nosaltres». Per a «vosaltres»: *pareu*."
    grading: tolerant
    explanation: "«Nois» són més d'una persona: de *parar* és *pareu*."

  - id: a2-10-016
    type: fill
    point: imperatiu-afirmatiu
    lesson: 2
    prompt: "___ la porta del forn amb el drap."
    hint: "obrir, tu"
    answers: ["Obre"]
    wrong_answers:
      - text: "Abre"
        why: "«Abre» és castellà. En català, de *obrir*: *obre*."
      - text: "Obriu"
        why: "*Obriu* és per a més d'una persona."
    grading: tolerant
    explanation: "L'ordre és per a una persona: de *obrir* és *obre*."

  - id: a2-10-017
    type: fill
    point: imperatiu-negatiu
    lesson: 2
    prompt: "No ___ el forn sense el drap: crema molt."
    hint: "obrir, tu"
    answers: ["obris"]
    wrong_answers:
      - text: "obre"
        why: "*Obre* és l'afirmatiu. Amb *no*: *no obris*."
      - text: "obres"
        why: "*Obres* és el present. En negatiu: *no obris*."
    grading: tolerant
    explanation: "Amb *no*, *obrir* fa *obris*."

  - id: a2-10-018
    type: fill
    point: imperatiu-negatiu
    lesson: 2
    prompt: "No ___ el ganivet per la fulla."
    hint: "agafar, tu"
    answers: ["agafis"]
    wrong_answers:
      - text: "agafa"
        why: "*Agafa* és l'afirmatiu. Amb *no*: *no agafis*."
      - text: "agafes"
        why: "*Agafes* és el present. L'ordre negativa és *no agafis*."
    grading: tolerant
    explanation: "Amb *no*, *agafar* fa *agafis*."

  - id: a2-10-019
    type: fill
    point: imperatiu-negatiu
    lesson: 2
    prompt: "Nois, no ___ les tasses: són de l'àvia."
    hint: "trencar, vosaltres"
    answers: ["trenqueu"]
    wrong_answers:
      - text: "trenca"
        why: "*Trenca* és per a una persona i en afirmatiu. Aquí: *no trenqueu*."
      - text: "trenquen"
        why: "*Trenquen* és «ells». Per a «vosaltres»: *trenqueu*."
    grading: tolerant
    explanation: "«Nois» són més d'una persona: de *trencar* és *no trenqueu*."

  - id: a2-10-020
    type: order
    point: imperatiu-afirmatiu
    lesson: 2
    cue: "Escriu l'ordre: en Pau ha de pelar les patates fredes."
    chunks: ["pela", "les", "patates", "fredes"]
    extra: ["peles", "peleu"]
    answers:
      - "Pela les patates fredes."
    explanation: "A una persona (en Pau): *pela*."

  - id: a2-10-021
    type: order
    point: imperatiu-negatiu
    lesson: 2
    cue: "La cassola crema. Escriu l'ordre per a en Pau."
    chunks: ["no", "toquis", "la", "cassola"]
    extra: ["toca", "toques"]
    answers:
      - "No toquis la cassola."
    explanation: "A una persona (en Pau) i en negatiu: *no toquis*."

  - id: a2-10-022
    type: order
    point: imperatiu-afirmatiu
    lesson: 2
    cue: "La sopa és freda. Escriu l'ordre per als nens."
    chunks: ["escalfeu", "la", "sopa", "ben", "calenta"]
    extra: ["escalfem", "escalfa"]
    answers:
      - "Escalfeu la sopa ben calenta."
    explanation: "Als nens (més d'una persona): *escalfeu*."

  - id: a2-10-023
    type: choice
    point: imperatiu-afirmatiu
    lesson: 2
    prompt: "___ un got d'aigua, que fa molta calor."
    answer: "Beu"
    distractors:
      - text: "Bebe"
        why: "«Bebe» és castellà. En català, de *beure*: *beu*."
      - text: "Beveu"
        why: "*Beveu* és per a més d'una persona."
    explanation: "L'ordre és per a una persona: de *beure* és *beu*."

  - id: a2-10-024
    type: choice
    point: imperatiu-negatiu
    lesson: 2
    prompt: "No ___ del got de l'Ibrahim: és brut."
    answer: "beguis"
    distractors:
      - text: "beu"
        why: "*Beu* és l'afirmatiu. Amb *no*: *no beguis*."
      - text: "beus"
        why: "*Beus* és el present. L'ordre negativa és *no beguis*."
    explanation: "Amb *no*, *beure* fa *beguis*."

  - id: a2-10-025
    type: choice
    point: imperatiu-afirmatiu
    lesson: 2
    prompt: "___ la llet i afegeix el sucre."
    answer: "Escalfa"
    distractors:
      - text: "Escalfes"
        why: "*Escalfes* és el present. L'ordre per a una persona és *escalfa*."
      - text: "Escalfeu"
        why: "*Escalfeu* és per a més d'una persona."
    explanation: "Donem una ordre a una persona: *escalfa* (i *afegeix*)."

  - id: a2-10-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "—Estic molt nerviós, Núria: venen dotze persones a sopar. —___, que t'ajudo jo."
    answer: "Tranquil!"
    distractors:
      - text: "Vinga!"
        why: "*Vinga* fa córrer. Aquí cal calmar: *tranquil*."
      - text: "Ves amb compte!"
        why: "No hi ha cap perill: cal calmar: *tranquil*."
    explanation: "Algú pateix i el volem calmar. Per això fem servir *tranquil*."

  # ---------- Lliçó 3 ----------
  - id: a2-10-027
    type: choice
    point: imperatius-irregulars
    lesson: 3
    prompt: "___ al mercat i compra all: a casa no n'hi ha gens."
    answer: "Ves"
    distractors:
      - text: "Vine"
        why: "*Vine* és de *venir*. Aquí el verb és *anar*: *ves*."
      - text: "Aneu"
        why: "*Aneu* és per a més d'una persona."
    explanation: "El verb és *anar* i parlem a una persona: *ves*."

  - id: a2-10-028
    type: choice
    point: imperatius-irregulars
    lesson: 3
    prompt: "___ demà a dinar: fem arròs."
    answer: "Vine"
    distractors:
      - text: "Ves"
        why: "*Ves* és de *anar*. Aquí el verb és *venir*: *vine*."
      - text: "Veniu"
        why: "*Veniu* és per a més d'una persona."
    explanation: "El verb és *venir* i parlem a una persona: *vine*."

  - id: a2-10-029
    type: choice
    point: imperatius-irregulars
    lesson: 3
    prompt: "___ la truita ara, Pau: tens vint minuts."
    answer: "Fes"
    distractors:
      - text: "Feu"
        why: "*Feu* és per a més d'una persona. Aquí parlem a en Pau."
      - text: "Haz"
        why: "«Haz» és castellà. En català, de *fer*: *fes*."
    explanation: "El verb és *fer* i parlem a una persona (en Pau): *fes*."

  - id: a2-10-030
    type: choice
    point: imperatius-irregulars
    lesson: 3
    prompt: "Nois, ___ el favor de parar taula."
    answer: "Feu"
    distractors:
      - text: "Fes"
        why: "*Fes* és per a una persona. «Nois» en són més d'una."
      - text: "Facis"
        why: "*Facis* és del negatiu (*no facis*). La frase és afirmativa."
    explanation: "«Nois» són més d'una persona: de *fer* és *feu*."

  - id: a2-10-031
    type: fill
    point: imperatius-irregulars
    lesson: 3
    prompt: "___ amable i ajuda l'àvia a parar taula."
    hint: "ser, tu"
    answers: ["Sigues"]
    wrong_answers:
      - text: "Sé"
        why: "*Sé* és de *saber* (jo sé). De *ser*: *sigues*."
      - text: "Sigueu"
        why: "*Sigueu* és per a més d'una persona."
    grading: tolerant
    explanation: "El verb és *ser* i parlem a una persona: *sigues*."

  - id: a2-10-032
    type: fill
    point: imperatius-irregulars
    lesson: 3
    prompt: "___ paciència: el sopar encara no està a punt."
    hint: "tenir, tu"
    answers: ["Tingues"]
    wrong_answers:
      - text: "Ten"
        why: "«Ten» és castellà. En català, de *tenir*: *tingues*."
      - text: "Tingueu"
        why: "*Tingueu* és per a més d'una persona."
    grading: tolerant
    explanation: "El verb és *tenir* i parlem a una persona: *tingues*."

  - id: a2-10-033
    type: fill
    point: imperatiu-amb-pronom
    lesson: 3
    prompt: "L'olla crema: ___ amb el drap!"
    hint: "agafar, tu, + «l'olla»"
    answers: ["Agafa-la"]
