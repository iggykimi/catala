  # ---------- Lliçó 5 ----------
  - id: a2-10-053
    type: reading
    point: imperatiu-afirmatiu
    lesson: 5
    title: "Truita de patates"
    text: |
      Truita de patates per a dos. Primer, pela tres patates i talla-les ben fines. Talla una ceba petita i fregeix-ho tot en una cassola grossa amb molt d'oli. Mentrestant, trenca quatre ous en un plat gros i afegeix-hi una mica de sal.
      Quan les patates ja estan fetes, posa-les en un plat i afegeix els ous. Després torna a posar les patates amb els ous a la cassola. Fes la truita a poc a poc. No la cremis! Serveix-la calenta amb pa.
    questions:
      - prompt: "Què fas amb les patates al principi?"
        answer: "Les peles i les talles fines."
        distractors:
          - text: "Les bulls amb sal."
            why: "Al text, no bulls les patates: les peles i les talles."
          - text: "Les fregeixes soles."
            why: "Les fregeixes amb la ceba, no soles."
      - prompt: "Quan hi poses la sal?"
        answer: "Quan trenques els ous."
        distractors:
          - text: "Quan fregeixes les patates."
            why: "La sal va amb els ous, no amb les patates."
          - text: "Quan la truita ja és a taula."
            why: "La sal s'hi posa abans, amb els ous."
      - prompt: "Com fas la truita al final?"
        answer: "A poc a poc, amb compte."
        distractors:
          - text: "De pressa i amb molt d'oli."
            why: "«De pressa» és el contrari del text: a poc a poc."
          - text: "En un plat gros, amb molta sal."
            why: "El plat gros és per trencar-hi els ous."
      - prompt: "Per a quantes persones és la recepta?"
        answer: "Per a dues."
        distractors:
          - text: "Per a tres."
            why: "Tres són les patates."
          - text: "Per a quatre."
            why: "Quatre són els ous."
    explanation: "La recepta explica com fer una truita de patates per a dues persones."

