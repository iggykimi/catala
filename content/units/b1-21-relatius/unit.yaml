id: b1-21
level: B1
title: "Els relatius: que, on i els relatius amb preposició"
summary: "Aprens els relatius *que* (subjecte i complement directe) i *on* (lloc), les formes amb preposició (*de què*, *amb qui*, *el qual*) i l'error típic *del que*."
vocabulary_theme: "Feina i professions"
points:
  - id: relatiu-que
    title: "El relatiu *que*: subjecte i complement directe"
    refs:
      - label: "GEIEC: Els relatius"
        url: "https://geiec.iec.cat"
  - id: relatiu-on
    title: "El relatiu *on*: el lloc"
    refs:
      - label: "GEIEC: Els relatius"
        url: "https://geiec.iec.cat"
  - id: relatiu-preposicio
    title: "Preposició + *què*/*qui* i *el qual*"
    refs:
      - label: "GEIEC: Els relatius"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *del que* → *de què*"
  - id: expressions
    title: "Expressions de la feina"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: *que* i *on*"
  - title: "Practicar *que* i *on*"
  - title: "Preposició + *què*/*qui* i interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "la feina"
    definition: "Allò que fas per guanyar diners."
    example: "Va trobar feina en una escola de Vic."
  - word: "la professió"
    definition: "Feina per a la qual cal una formació."
    example: "La seva professió és mestra."
  - word: "l'ofici"
    definition: "Professió manual que s'aprèn amb la pràctica."
    example: "El seu ofici és fuster."
  - word: "el contracte"
    definition: "Document que explica les condicions d'una feina."
    example: "Va signar el contracte dilluns passat."
  - word: "el sou"
    definition: "Diners que reps cada mes per la feina."
    example: "Amb aquest sou no arriba a final de mes."
  - word: "la nòmina"
    definition: "Paper que diu quant has cobrat i què t'han descomptat."
    example: "Mira la nòmina: hi ha un error."
  - word: "l'entrevista"
    definition: "Conversa per saber si ets adequat per a una feina."
    example: "Tinc una entrevista demà a les deu."
  - word: "el currículum"
    definition: "Document amb la teva formació i experiència."
    example: "Envia el currículum per correu electrònic."
  - word: "l'empresa"
    definition: "Organització on treballa la gent."
    example: "L'empresa té cent treballadors."
  - word: "el despatx"
    definition: "Habitació on treballa una persona, en una oficina."
    example: "La Núria té despatx propi."
  - word: "l'oficina"
    definition: "Lloc amb taules i ordinadors on es fa feina d'administració."
    example: "L'oficina tanca a les sis."
  - word: "la fàbrica"
    definition: "Edifici gran on es fan productes."
    example: "La fàbrica fa mobles de fusta."
  - word: "el taller"
    definition: "Lloc on es reparen cotxes i màquines."
    example: "Va portar el cotxe al taller."
  - word: "el magatzem"
    definition: "Lloc gran on es guarden productes i materials."
    example: "El magatzem és al polígon."
  - word: "el client, la clienta"
    definition: "Persona que compra o rep un servei."
    example: "Aquest client ve cada setmana."
  - word: "el cap, la cap"
    definition: "Persona que mana en una feina."
    example: "El meu cap em va demanar l'informe."
  - word: "el company, la companya"
    definition: "Persona que treballa amb tu."
    example: "La meva companya m'ajuda molt."
  - word: "la jornada"
    definition: "Hores de feina d'un dia."
    example: "Fa jornada completa: vuit hores."
  - word: "el torn"
    definition: "Part del dia en què treballes: matí, tarda o nit."
    example: "Aquesta setmana faig torn de nit."
  - word: "les hores extres"
    definition: "Hores de feina que passen de la jornada normal."
    example: "Aquest mes he fet deu hores extres."
  - word: "la baixa"
    definition: "Temps sense anar a la feina per malaltia."
    example: "Està de baixa des de dilluns."
  - word: "les vacances"
    definition: "Dies de descans pagats, sense anar a la feina."
    example: "A l'agost faig vacances."
  - word: "la jubilació"
    definition: "Final de la vida laboral, per l'edat."
    example: "Es prepara per a la jubilació."
  - word: "la reunió"
    definition: "Trobada per parlar de feina."
    example: "La reunió és a les nou."
  - word: "el projecte"
    definition: "Pla de feina amb un objectiu i un termini."
    example: "El projecte nou és molt interessant."
  - word: "el termini"
    definition: "Dia màxim per acabar una feina."
    example: "El termini és divendres."
  - word: "la tasca"
    definition: "Feina petita i concreta que has de fer."
    example: "La primera tasca és llegir el correu."
  - word: "l'encàrrec"
    definition: "Feina que algú et demana que facis."
    example: "Tinc un encàrrec urgent del cap."
  - word: "el becari, la becària"
    definition: "Persona jove que aprèn un ofici en una empresa."
    example: "La becària porta les factures."
  - word: "el funcionari, la funcionària"
    definition: "Persona que treballa per a l'administració."
    example: "El seu pare és funcionari a l'ajuntament."
  - word: "l'autònom, l'autònoma"
    definition: "Persona que treballa per compte propi, sense cap."
    example: "Com a autònoma, factura cada mes."
  - word: "l'atur"
    definition: "Situació de no tenir feina, quan en vols tenir."
    example: "Després de dos anys a l'atur, va trobar feina."
  - word: "contractar"
    definition: "Donar feina a una persona."
    example: "Han contractat dos dependents nous."
  - word: "acomadiar"
    definition: "Prendre la feina a una persona."
    example: "Van acomiadar deu treballadors."
  - word: "jubilar-se"
    definition: "Deixar de treballar per l'edat."
    example: "Es va jubilar als seixanta anys."
  - word: "dimitir"
    definition: "Deixar un càrrec per decisió pròpia."
    example: "El director va dimitir al gener."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-21-001
    type: choice
    point: relatiu-que
    lesson: 1
    prompt: "El company ___ parla anglès és l'Arnau."
    answer: "que"
    distractors:
      - text: "què"
        why: "*Què* amb accent només va darrere d'una preposició o en preguntes. Aquí el relatiu no porta preposició: *que*."
      - text: "on"
        why: "*On* és per a un lloc. «El company» és una persona: *que*."
      - text: "el que"
        why: "Amb un nom davant («el company»), el relatiu és *que*, sense article."
    explanation: "«El company» és el subjecte de «parla»: el relatiu és *que*, sense accent ni article."

  - id: b1-21-002
    type: choice
    point: relatiu-que
    lesson: 1
    prompt: "El programa ___ gestiona les nòmines no funciona."
    answer: "que"
    distractors:
      - text: "qui"
        why: "*Qui* sense preposició no va amb un nom de cosa. «El programa» és una cosa: *que*."
      - text: "què"
        why: "*Què* necessita una preposició davant («de què», «amb què»). Aquí no n'hi ha cap: *que*."
      - text: "on"
        why: "*On* és per a un lloc. «El programa» és una cosa: *que*."
    explanation: "«El programa» fa l'acció de «gestiona»: és el subjecte, i el relatiu és *que*."

  - id: b1-21-003
    type: choice
    point: relatiu-que
    lesson: 1
    prompt: "La candidata ___ vam entrevistar ahir comença dilluns."
    answer: "que"
    distractors:
      - text: "què"
        why: "*Què* necessita una preposició. Aquí el verb «vam entrevistar» no en porta cap: *que*."
      - text: "on"
        why: "*On* és per a un lloc. «La candidata» és una persona: *que*."
      - text: "el que"
        why: "«La candidata» ja porta article: el relatiu és *que*, sense cap altre article."
    explanation: "«La candidata» és el complement directe de «vam entrevistar»: el relatiu és *que*."

  - id: b1-21-004
    type: choice
    point: relatiu-que
    lesson: 1
    prompt: "El contracte ___ vaig signar era de sis mesos."
    answer: "que"
    distractors:
      - text: "qui"
        why: "«El contracte» és una cosa, i *qui* és per a persones: *que*."
      - text: "què"
        why: "*Què* necessita una preposició davant. Aquí no n'hi ha: *que*."
      - text: "on"
        why: "*On* és per a un lloc. «El contracte» és una cosa: *que*."
    explanation: "«El contracte» és el complement directe de «vaig signar»: el relatiu és *que*."

  - id: b1-21-005
    type: choice
    point: relatiu-que
    lesson: 1
    prompt: "Els clients ___ venen al matí sempre tenen pressa."
    answer: "que"
    distractors:
      - text: "què"
        why: "*Què* amb accent necessita una preposició («de què»). Aquí el relatiu va sol: *que*."
      - text: "on"
        why: "«Els clients» són persones, no un lloc: *on* no hi va."
      - text: "els que"
        why: "El nom («els clients») ja hi és: el relatiu és *que*, sense cap article."
    explanation: "«Els clients» és el subjecte de «venen»: el relatiu és *que*, igual en singular i en plural."

  - id: b1-21-006
    type: choice
    point: relatiu-on
    lesson: 1
    prompt: "L'oficina ___ treballo és al centre de Girona."
    answer: "on"
    distractors:
      - text: "qui"
        why: "*Qui* és per a persones. «L'oficina» és un lloc: *on*."
      - text: "què"
        why: "*Què* necessita una preposició. Aquí el relatiu va sol i és de lloc: *on*."
      - text: "quan"
        why: "*Quan* és per al temps. «L'oficina» és un lloc: *on*."
    explanation: "«L'oficina» és el lloc on passa l'acció: el relatiu de lloc és *on*."

  - id: b1-21-007
    type: choice
    point: relatiu-on
    lesson: 1
    prompt: "El poble ___ va néixer el meu avi és molt petit."
    answer: "on"
    distractors:
      - text: "qui"
        why: "«El poble» és un lloc, no una persona: *qui* no hi va."
      - text: "què"
        why: "*Què* necessita una preposició davant. El relatiu de lloc sense preposició és *on*."
      - text: "quan"
        why: "«El poble» és un lloc, no un moment: *quan* no hi va."
    explanation: "«El poble» és el lloc on va néixer: el relatiu és *on*."

  - id: b1-21-008
    type: inline-choice
    point: relatiu-que
    lesson: 1
    title: "Una oferta de feina"
    text: "La Carla ha trobat una oferta {que|qui|què} li agrada molt. És d'una empresa {on|qui|quan} fan programes per a hospitals. L'oficina {on|qui|quan} treballaria és a Mataró. El sou {que|on|qui} ofereixen és bo, i l'horari {que|quan|on} proposen li va bé. Diuen que no hi ha gaires hores extres. Si la contracten, començarà al juliol."
    explanation: "*Que* va amb el subjecte i el complement directe («oferta», «sou», «horari»); *on*, amb el lloc («empresa», «oficina»)."

  - id: b1-21-009
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["qui dia passa, any empeny", "el temps passa de pressa"]
      - ["cadascú a casa seva", "cadascú ha de fer la seva feina"]
      - ["guanyar-se la vida", "treballar per tenir diners"]
      - ["fer carrera", "progressar en una professió"]
    explanation: "Són quatre expressions per parlar de la feina i del temps: fixa't en quina va amb cada situació."

  - id: b1-21-010
    type: fill
    point: relatiu-que
    lesson: 1
    prompt: "El torn ___ faig jo és el de nit."
    hint: "relatiu per a «el torn»"
    answers: ["que"]
    wrong_answers:
      - text: "què"
        why: "*Què* amb accent necessita una preposició. Aquí el relatiu va sol: *que*."
    grading: strict
    explanation: "«El torn» és el complement directe de «faig»: el relatiu és *que*, sense accent."

  - id: b1-21-011
    type: fill
    point: relatiu-que
    lesson: 1
    prompt: "La companya ___ m'ajuda sempre es diu Fàtima."
    hint: "relatiu per a «la companya»"
    answers: ["que"]
    wrong_answers:
      - text: "què"
        why: "*Què* necessita una preposició davant. Aquí no n'hi ha cap: *que*."
    grading: strict
    explanation: "«La companya» és el subjecte de «m'ajuda»: el relatiu és *que*."

  - id: b1-21-012
    type: order
    point: relatiu-que
    lesson: 1
    cue: "Digues que el teu contracte acaba al juny."
    chunks: ["el contracte", "que", "tinc", "acaba", "al juny"]
    extra: ["què"]
    answers:
      - "El contracte que tinc acaba al juny."
      - "Al juny el contracte que tinc acaba."
    explanation: "El relatiu *que* va just darrere del nom («el contracte»): *el contracte que tinc*."

  - id: b1-21-013
    type: order
    point: relatiu-on
    lesson: 1
    cue: "Digues que el taller on treballes és molt gran."
    chunks: ["el taller", "on", "treballo", "és", "molt gran"]
    extra: ["quan"]
    answers:
      - "El taller on treballo és molt gran."
    explanation: "*On* va just darrere del nom de lloc («el taller»): *el taller on treballo*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-21-014
    type: choice
    point: relatiu-que
    lesson: 2
    prompt: "Els informes ___ has d'enviar són a la taula."
    answer: "que"
    distractors:
      - text: "qui"
        why: "«Els informes» són coses, no persones: *qui* no hi va."
      - text: "què"
        why: "Sense preposició, el relatiu és *que*, sense accent."
      - text: "on"
        why: "«Els informes» no són un lloc: el relatiu és *que*."
    explanation: "«Els informes» és el complement directe de «has d'enviar»: el relatiu és *que*."

  - id: b1-21-015
    type: choice
    point: relatiu-que
    lesson: 2
    prompt: "La becària ___ porta les factures és nova."
    answer: "que"
    distractors:
      - text: "què"
        why: "*Què* necessita una preposició. Aquí no n'hi ha cap: *que*."
      - text: "on"
        why: "«La becària» és una persona, no un lloc: *que*."
      - text: "la que"
        why: "Amb el nom davant («la becària»), el relatiu és *que*, sense article."
    explanation: "«La becària» és el subjecte de «porta»: el relatiu és *que*."

  - id: b1-21-016
    type: choice
    point: relatiu-on
    lesson: 2
    prompt: "El despatx ___ treballa la Núria té molta llum."
    answer: "on"
    distractors:
      - text: "qui"
        why: "«El despatx» és un lloc, no una persona."
      - text: "què"
        why: "El relatiu de lloc sense preposició és *on*, no *què*."
      - text: "quan"
        why: "«El despatx» és un lloc, no un moment."
    explanation: "«El despatx» és el lloc on treballa: el relatiu és *on*."

  - id: b1-21-017
    type: choice
    point: relatiu-on
    lesson: 2
    prompt: "La fàbrica ___ fan els mobles és a Vic."
    answer: "on"
    distractors:
      - text: "qui"
        why: "«La fàbrica» és un lloc, no una persona: *on*."
      - text: "què"
        why: "*Què* necessita una preposició. El relatiu de lloc va sol: *on*."
      - text: "quan"
        why: "«La fàbrica» és un lloc, no un moment: *on*."
    explanation: "«La fàbrica» és el lloc on fan els mobles: el relatiu és *on*."

  - id: b1-21-018
    type: fill
    point: relatiu-que
    lesson: 2
    prompt: "El funcionari ___ m'ha atès és molt amable."
    hint: "relatiu per a «el funcionari»"
    answers: ["que"]
    wrong_answers:
      - text: "què"
        why: "*Què* amb accent necessita una preposició. Aquí el relatiu va sol: *que*."
    grading: strict
    explanation: "«El funcionari» és el subjecte de «m'ha atès»: el relatiu és *que*."

  - id: b1-21-019
    type: fill
    point: relatiu-que
    lesson: 2
    prompt: "Les tasques ___ tinc per avui són urgents."
    hint: "relatiu per a «les tasques»"
    answers: ["que"]
    wrong_answers:
      - text: "què"
        why: "Sense preposició, el relatiu és *que*, sense accent."
    grading: strict
    explanation: "«Les tasques» és el complement directe de «tinc»: el relatiu és *que*."

  - id: b1-21-020
    type: fill
    point: relatiu-que
    lesson: 2
    prompt: "L'autònoma ___ fa la neteja ve els dimarts."
    hint: "relatiu per a «l'autònoma»"
    answers: ["que"]
    wrong_answers:
      - text: "què"
        why: "*Què* necessita una preposició davant. Aquí no n'hi ha cap: *que*."
    grading: strict
    explanation: "«L'autònoma» és el subjecte de «fa»: el relatiu és *que*."

  - id: b1-21-021
    type: order
    point: relatiu-on
    lesson: 2
    cue: "Digues que l'edifici on vius és a prop de l'estació."
    chunks: ["l'edifici", "on", "visc", "és", "a prop de l'estació"]
    extra: ["quan"]
    answers:
      - "L'edifici on visc és a prop de l'estació."
    explanation: "El relatiu de lloc va darrere del nom: *l'edifici on visc*."

  - id: b1-21-022
    type: order
    point: relatiu-que
    lesson: 2
    cue: "Explica que tens una cap que ho entén tot."
    chunks: ["tinc", "una cap", "que", "ho", "entén", "tot"]
    extra: ["què"]
    answers:
      - "Tinc una cap que ho entén tot."
      - "Tinc una cap que tot ho entén."
    explanation: "*Que* va just darrere del nom («una cap»): *una cap que ho entén tot*."

  - id: b1-21-023
    type: order
    point: relatiu-on
    lesson: 2
    cue: "Digues que el bar on esmorzes és davant de l'escola."
    chunks: ["el bar", "on", "esmorzo", "és", "davant de l'escola"]
    extra: ["qui"]
    answers:
      - "El bar on esmorzo és davant de l'escola."
    explanation: "*On* va darrere del nom de lloc: *el bar on esmorzo*."

  - id: b1-21-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «qui dia passa, any empeny»?"
    answer: "Que el temps passa molt de pressa."
    distractors:
      - text: "Que cada dia cal treballar més."
        why: "No parla de treballar més, sinó del temps que passa."
      - text: "Que els anys fan la gent més sàvia."
        why: "No parla de l'edat, sinó de com passen els dies."
    explanation: "*Qui dia passa, any empeny* vol dir que els dies passen tan de pressa que sembla que s'acabi l'any."

  - id: b1-21-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «guanyar-se la vida»?"
    answer: "Treballar per tenir diners per viure."
    distractors:
      - text: "Guanyar un premi important."
        why: "No és un premi: és la feina de cada dia."
      - text: "Viure sense haver de treballar."
        why: "Vol dir el contrari: treballar per viure."
    explanation: "*Guanyar-se la vida* vol dir treballar per tenir els diners necessaris per viure."

  - id: b1-21-026
    type: inline-choice
    point: expressions
    lesson: 2
    title: "A la pausa del cafè"
    text: "—El nou becari es fica en tot. —Ja ho saps: {cadascú a casa seva|qui dia passa, any empeny|fer carrera}. —I el temps vola: ja fa un any que soc aquí! —Sí, {qui dia passa, any empeny|cadascú a casa seva|fer carrera}. —Vols ser cap algun dia? —No: això de {fer carrera|guanyar-me la vida|qui dia passa, any empeny} no m'interessa."
    explanation: "*Cadascú a casa seva* demana que ningú es fiqui en la feina dels altres; *qui dia passa, any empeny* parla del temps; *fer carrera* és progressar en la professió."

  # ---------------- Lliçó 3 ----------------
  - id: b1-21-027
    type: choice
    point: relatiu-preposicio
    lesson: 3
    prompt: "El tema ___ parlàvem ahir és molt delicat."
    answer: "de què"
    distractors:
      - text: "de qui"
        why: "«El tema» és una cosa, no una persona: *de què*."
      - text: "del que"
        why: "*Del que* és un calc del castellà «del que». En català: *de què*."
      - text: "què"
        why: "Falta la preposició: el verb és «parlar de», i el relatiu és *de què*."
    explanation: "«Parlar» demana *de*, i «el tema» és una cosa: *de què*."

  - id: b1-21-028
    type: choice
    point: relatiu-preposicio
    lesson: 3
    prompt: "La companya ___ comparteixo despatx és de Tarragona."
    answer: "amb qui"
    distractors:
      - text: "amb què"
        why: "«La companya» és una persona: *amb qui*."
      - text: "amb el que"
        why: "*Amb el que* és un calc del castellà «con el que». Amb una persona: *amb qui*."
      - text: "qui"
        why: "El relatiu de persona amb preposició és *amb qui*: sense *amb* no hi va."
    explanation: "«La companya» és una persona i el complement porta *amb*: *amb qui*."

  - id: b1-21-029
    type: choice
    point: relatiu-preposicio
    lesson: 3
    prompt: "El projecte ___ participo és molt interessant."
    answer: "en què"
    distractors:
      - text: "en qui"
        why: "«El projecte» és una cosa: *en què*."
      - text: "en el que"
        why: "*En el que* és un calc del castellà «en el que». En català: *en què*."
      - text: "on"
        why: "*On* és per a un lloc. «El projecte» no és un lloc: *en què*."
    explanation: "«Participar» demana *en*, i «el projecte» és una cosa: *en què*."

  - id: b1-21-030
