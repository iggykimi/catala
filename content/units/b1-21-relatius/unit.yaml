  - id: b1-21-063
    type: reading
    point: comprensio
    lesson: 5
    title: "Un canvi de feina"
    text: |
      La Fàtima té trenta-dos anys i viu a Mataró. Mai no ha estat a l'atur. Durant sis anys ha treballat en una fàbrica on fan peces de plàstic. La feina no li agradava: el torn que feia era de nit, la jornada era molt llarga i el sou que cobrava no arribava a mil euros.

      Al gener, una companya amb qui dinava cada dia li va parlar d'un curs de cuina. La Fàtima s'hi va apuntar de seguida. El curs va durar tres mesos, i el restaurant on va fer les pràctiques era al centre de la ciutat. El professor de qui va aprendre més, l'Oriol, li va ensenyar a organitzar bé la feina.

      Quan va acabar el curs, el xef amb qui havia fet les pràctiques li va oferir una plaça a la cuina. Ara la Fàtima treballa en un restaurant petit del barri. Guanya menys que abans, però diu que per fi fa una feina que li agrada.

      —Qui dia passa, any empeny —diu rient—: ja fa mig any que soc aquí i sembla que va ser ahir. A l'agost farà vacances per primera vegada en anys.
    questions:
      - prompt: "On treballava la Fàtima abans?"
        answer: "En una fàbrica de peces de plàstic."
        distractors:
          - text: "En un restaurant del centre."
            why: "Al restaurant hi va fer les pràctiques, però no hi treballava."
          - text: "En una escola de cuina."
            why: "Hi va fer un curs, però no hi treballava."
      - prompt: "Per què no li agradava la feina de la fàbrica?"
        answer: "Pel torn de nit, la jornada llarga i el sou baix."
        distractors:
          - text: "Perquè no tenia companyes."
            why: "Hi dinava cada dia amb una companya."
          - text: "Perquè passava moltes hores a l'atur."
            why: "A l'atur no hi ha estat mai: treballava a la fàbrica."
      - prompt: "Com va trobar la feina de cuina?"
        answer: "Gràcies a un curs i a les pràctiques."
        distractors:
          - text: "Perquè l'Oriol li va oferir una plaça."
            why: "L'Oriol era el professor; qui li va oferir la plaça és el xef."
          - text: "Perquè el xef era el seu professor."
            why: "L'Oriol era el professor del curs; el xef és del restaurant."
      - prompt: "Què diu la Fàtima de la feina nova?"
        answer: "Que guanya menys, però li agrada més."
        distractors:
          - text: "Que guanya més que a la fàbrica."
            why: "El text diu que guanya menys."
          - text: "Que vol tornar a la fàbrica."
            why: "Diu que per fi fa una feina que li agrada."
    explanation: "El text explica com la Fàtima va passar de la fàbrica a la cuina d'un restaurant."

