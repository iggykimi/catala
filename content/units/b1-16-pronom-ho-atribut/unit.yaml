id: b1-16
level: B1
title: "El pronom *ho* i l'atribut"
summary: "Aprens a fer servir *ho* per a les idees (*ho sé*, *no ho entenc*) i per a l'atribut (*sí que ho és*, *ho sembla*), davant i darrere del verb."
vocabulary_theme: "Personalitat i emocions"
points:
  - id: ho-neutre
    title: "*Ho* neutre: *ho sé*, *ho faré*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: ho-atribut
    title: "*Ho* atribut amb *ser*, *estar* i *semblar*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: ho-posicio
    title: "La posició de *ho*: davant i darrere del verb"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: no ometre *ho*"
  - id: expressions
    title: "Expressions amb *ho*"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: *ho* neutre i *ho* atribut"
  - title: "Practicar *ho*: idees i atributs"
  - title: "La posició de *ho* i interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "tranquil, tranquil·la"
    definition: "Que no es posa nerviós amb facilitat."
    example: "L'Ibrahim és un home tranquil: mai crida."
  - word: "nerviós, nerviosa"
    definition: "Que està tens o preocupat per alguna cosa."
    example: "Estic nerviosa: demà tinc l'entrevista."
  - word: "alegre"
    definition: "Que mostra alegria o bon humor."
    example: "És una noia alegre: sempre riu."
  - word: "trist, trista"
    definition: "Que sent pena o melancolia."
    example: "Avui estic trista: ha marxat la meva germana."
  - word: "vergonyós, vergonyosa"
    definition: "A qui li costa parlar o actuar davant dels altres."
    example: "De petit era molt vergonyós."
  - word: "tossut, tossuda"
    definition: "Que no canvia d'opinió amb facilitat."
    example: "El meu germà és tossut: sempre vol tenir raó."
  - word: "generós, generosa"
    definition: "Que dona amb gust als altres."
    example: "La veïna és generosa: ens porta pastís."
  - word: "gelós, gelosa"
    definition: "Que té por de perdre l'estima d'algú."
    example: "El seu gat és gelós del gos nou."
  - word: "orgullós, orgullosa"
    definition: "Que se sent molt satisfet d'alguna cosa."
    example: "Estan orgullosos del seu fill."
  - word: "poruc, poruga"
    definition: "Que té por amb facilitat."
    example: "El meu gat és poruc: s'amaga quan truquen."
  - word: "valent"
    definition: "Que no té por davant d'una dificultat."
    example: "Vas ser molt valenta, ahir."
  - word: "sincer, sincera"
    definition: "Que diu el que pensa, sense mentir."
    example: "Sigues sincera: t'ha agradat?"
  - word: "simpàtic, simpàtica"
    definition: "Que cau bé als altres."
    example: "El nou company és molt simpàtic."
  - word: "pacient"
    definition: "Que sap esperar sense posar-se nerviós."
    example: "Has de ser pacient amb els nens."
  - word: "impacient"
    definition: "Que no sap esperar."
    example: "Soc impacient: ho vull tot de seguida."
  - word: "optimista"
    definition: "Que espera que les coses aniran bé."
    example: "Soc optimista: segur que ho aconseguim."
  - word: "sensible"
    definition: "Que nota amb força les emocions."
    example: "És una nena sensible: plora amb les pel·lícules."
  - word: "el caràcter"
    definition: "La manera de ser d'una persona."
    example: "Té un caràcter tranquil, com el seu pare."
  - word: "l'humor"
    definition: "L'estat d'ànim en un moment concret."
    example: "Avui està de bon humor."
  - word: "la por"
    definition: "El sentiment davant d'un perill."
    example: "Tinc por de parlar en públic."
  - word: "l'alegria"
    definition: "El sentiment de felicitat."
    example: "Quina alegria veure't!"
  - word: "la tristesa"
    definition: "El sentiment de pena."
    example: "La tristesa marxarà amb el temps."
  - word: "la vergonya"
    definition: "El sentiment de qui ha fet el ridícul o se sent observat."
    example: "Quina vergonya: m'he equivocat de porta."
  - word: "la ràbia"
    definition: "Un enuig molt fort."
    example: "Em fa ràbia perdre el tren."
  - word: "la calma"
    definition: "L'absència de nervis."
    example: "Respira amb calma abans de parlar."
  - word: "la paciència"
    definition: "La capacitat de saber esperar."
    example: "Amb els nens cal molta paciència."
  - word: "l'enuig"
    definition: "Un disgust petit amb algú."
    example: "El seu enuig va durar un dia."
  - word: "fer por"
    definition: "Causar por."
    example: "Les aranyes em fan por."
  - word: "fer vergonya"
    definition: "Causar vergonya."
    example: "Em fa vergonya parlar en públic."
  - word: "fer ràbia"
    definition: "Causar un enuig fort."
    example: "Em fa ràbia suspendre l'examen."
  - word: "fer pena"
    definition: "Causar tristesa."
    example: "Em fa pena veure'l tan trist."
  - word: "enfadar-se"
    definition: "Posar-se en contra d'algú per una cosa que ha fet."
    example: "No t'enfadis: ha estat un error."
  - word: "calmar-se"
    definition: "Tornar a la calma."
    example: "Escolta música per calmar-te."
  - word: "confiar"
    definition: "Creure que algú farà una cosa bé."
    example: "Confio en tu: ho faràs bé."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-16-001
    type: choice
    point: ho-neutre
    lesson: 1
    prompt: "—Saps que tanquen el bar del barri? —Sí, ___ sé."
    answer: "ho"
    distractors:
      - text: "el"
        why: "*El* substitueix un nom masculí. Aquí substituïm tota la idea «que tanquen el bar»: *ho*."
      - text: "hi"
        why: "*Hi* és per a un lloc. Aquí no hi ha cap lloc: és una idea, *ho*."
    explanation: "«Que tanquen el bar» és una idea sencera, no un nom. Les idees se substitueixen per *ho*: *ho sé*."

  - id: b1-16-002
    type: choice
    point: ho-neutre
    lesson: 1
    prompt: "—Creus que demà plourà? —No ___ crec: el cel és ben blau."
    answer: "ho"
    distractors:
      - text: "el"
        why: "*El* necessitaria un nom masculí, i aquí no n'hi ha cap: el que no creus és la idea «que plourà», *ho*."
      - text: "hi"
        why: "*Hi* és per a un lloc. Aquí és una idea: *ho*."
    explanation: "«Que demà plourà» és una idea, no un nom. Les idees van amb *ho*: *no ho crec*."

  - id: b1-16-003
    type: choice
    point: ho-neutre
    lesson: 1
    prompt: "«Ho va dir la directora.» Què substitueix «ho»?"
    answer: "El que va dir."
    distractors:
      - text: "La directora."
        why: "*La directora* és el subjecte, no el que se substitueix."
      - text: "Un nom concret."
        why: "*Ho* aquí substitueix tota la idea. Si fos un nom masculí concret, el pronom seria *el*."
    explanation: "*Ho* substitueix el que va dir (una idea o una frase sencera), no qui ho va dir."

  - id: b1-16-004
    type: choice
    point: ho-atribut
    lesson: 1
    prompt: "—És veritat que plegues? —Sí que ___ és."
    answer: "ho"
    distractors:
      - text: "el"
        why: "*El* substitueix un nom masculí. «Veritat» és l'atribut: *ho*."
      - text: "la"
        why: "*Ho* atribut no concorda: encara que «veritat» sigui femení, el pronom és *ho*."
    explanation: "«Veritat» és l'atribut de *ser*. L'atribut se substitueix per *ho*, que no canvia mai."

  - id: b1-16-005
    type: choice
    point: ho-atribut
    lesson: 1
    prompt: "—Està contenta, la Montse, amb el nou horari? —Sí que ___ està."
    answer: "ho"
    distractors:
      - text: "la"
        why: "*Ho* atribut no concorda amb el subjecte: encara que la Montse sigui «ella», és *ho*."
      - text: "hi"
        why: "*Hi està* voldria dir que és en un lloc. Aquí és l'atribut «contenta»: *ho*."
    explanation: "«Contenta» és l'atribut de *estar*. El verb es repeteix igual i l'atribut es converteix en *ho*."

  - id: b1-16-006
    type: choice
    point: ho-atribut
    lesson: 1
    prompt: "—Sembla fàcil, l'examen de divendres? —Sí, ___ sembla."
    answer: "ho"
    distractors:
      - text: "el"
        why: "*El* seria un nom masculí. «Fàcil» és l'atribut: *ho*."
      - text: "hi"
        why: "*Hi* és per a un lloc. Aquí és l'atribut «fàcil»: *ho*."
    explanation: "«Fàcil» és l'atribut de *semblar*. Com amb *ser* i *estar*, l'atribut se substitueix per *ho*."

  - id: b1-16-007
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["ja ho veuràs", "Si no estudies, suspendràs."]
      - ["tant m'és", "Cafè o te? Totes dues opcions em van bé."]
      - ["ho sento molt", "He arribat tard a la reunió."]
      - ["no ho sé pas", "No en tinc ni idea, de veritat."]
    explanation: "Són quatre expressions molt habituals: fixa't en quina situació va cadascuna."

  - id: b1-16-008
    type: inline-choice
    point: ho-neutre
    lesson: 1
    title: "Un missatge de l'Arnau"
    text: "Hola, Laia. Ja {ho|el} sé, que demà plourà: {ho|el} ha dit el meteoròleg. Si vols, {ho|el} comentem a la feina. Jo no {ho|la} entenc: tot canvia cada dia, i el meu avi tampoc {ho|el} entén."
    explanation: "En tots els forats substituïm una idea: *ho*. *El* i *la* només van amb un nom concret."

  - id: b1-16-009
    type: fill
    point: ho-neutre
    lesson: 1
    prompt: "—Diuen que pujaran el lloguer. —Sí, ___ va dir la veïna del tercer."
    hint: "pronom per a «que pujaran el lloguer»"
    answers: ["ho"]
    wrong_answers:
      - text: "el"
        why: "*El* seria un nom masculí. «Que pujaran el lloguer» és una idea: *ho*."
    grading: tolerant
    explanation: "«Que pujaran el lloguer» és una idea sencera: *ho va dir*."

  - id: b1-16-010
    type: fill
    point: ho-atribut
    lesson: 1
    prompt: "—És tossut, el teu germà? —Sí que ___ és: té un caràcter molt fort."
    hint: "pronom per a «tossut»"
    answers: ["ho"]
    wrong_answers:
      - text: "el"
        why: "*El* substitueix un nom. «Tossut» és l'atribut: *ho*, que no canvia mai."
    grading: tolerant
    explanation: "«Tossut» és l'atribut de *ser*: *sí que ho és*."

  - id: b1-16-011
    type: fill
    point: ho-atribut
    lesson: 1
    prompt: "—Estàs tranquil·la, abans de l'entrevista? —Sí que ___ estic."
    hint: "pronom per a «tranquil·la»"
    answers: ["ho"]
    wrong_answers:
      - text: "la"
        why: "*Ho* atribut no concorda: encara que el subjecte sigui femení, el pronom és *ho*."
    grading: tolerant
    explanation: "«Tranquil·la» és l'atribut de *estar*. El verb es repeteix i l'atribut es converteix en *ho*."

  - id: b1-16-012
    type: order
    point: ho-neutre
    lesson: 1
    cue: "La Fàtima t'explica una notícia. Digues que ja ho saps."
    chunks: ["ja", "ho", "sé"]
    extra: ["el"]
    answers:
      - "Ja ho sé."
    explanation: "El pronom *ho* va just davant del verb: *ja ho sé*."

  - id: b1-16-013
    type: order
    point: ho-atribut
    lesson: 1
    cue: "Et pregunten si en Pau era vergonyós de petit. Digues que sí que ho era."
    chunks: ["sí", "que", "ho", "era"]
    extra: ["el"]
    answers:
      - "Sí que ho era."
    explanation: "«Vergonyós» era l'atribut: *sí que ho era*. En passat, el verb també es repeteix."

  # ---------------- Lliçó 2 ----------------
  - id: b1-16-014
    type: fill
    point: ho-neutre
    lesson: 2
    prompt: "—Explicaràs que vols plegar? El cap s'enfadarà. —Sí, ___ explicaré demà amb calma."
    hint: "pronom per a «que vols plegar»"
    answers: ["ho"]
    wrong_answers:
      - text: "el"
        why: "*El* seria un nom masculí. «Que vols plegar» és una idea: *ho*."
    grading: tolerant
    explanation: "«Que vols plegar» és una idea sencera: *ho explicaré*."

  - id: b1-16-015
    type: fill
    point: ho-neutre
    lesson: 2
    prompt: "La Núria vol canviar de feina, però encara no ___ ha decidit."
    hint: "pronom per a «canviar de feina»"
    answers: ["ho"]
    wrong_answers:
      - text: "la"
        why: "*La* seria un nom femení. «Canviar de feina» és una idea: *ho*."
    grading: tolerant
    explanation: "«Canviar de feina» és una idea, no un nom: *no ho ha decidit*."

  - id: b1-16-016
    type: fill
    point: ho-neutre
    lesson: 2
    prompt: "—Saps el número de l'Ibrahim? —Sí, ___ sé de memòria."
    hint: "pronom per a «el número»"
    answers: ["el", "me'l"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* és per a una idea. «El número» és un nom masculí concret: *el*."
    grading: tolerant
    explanation: "«El número» és un nom masculí concret que fa de complement directe: *el sé*."

  - id: b1-16-017
    type: fill
    point: ho-atribut
    lesson: 2
    prompt: "—Sou optimistes, amb el nou projecte? —Sí que ___ som, per sort."
    hint: "pronom per a «optimistes»"
    answers: ["ho"]
    wrong_answers:
      - text: "hi"
        why: "*Hi som* voldria dir que som en un lloc. Aquí és l'atribut «optimistes»: *ho*."
    grading: tolerant
    explanation: "«Optimistes» és l'atribut de *ser*, en plural: *sí que ho som*."

  - id: b1-16-018
    type: fill
    point: ho-atribut
    lesson: 2
    prompt: "—La Fàtima sembla cansada. —Sí, ___ sembla des de dilluns."
    hint: "pronom per a «cansada»"
    answers: ["ho"]
    wrong_answers:
      - text: "la"
        why: "*Ho* no concorda: encara que la Fàtima sigui «ella», l'atribut és *ho*."
    grading: tolerant
    explanation: "«Cansada» és l'atribut de *semblar*: *ho sembla*."

  - id: b1-16-019
    type: order
    point: ho-neutre
    lesson: 2
    cue: "Algú t'explica una norma nova. Digues que no ho entens."
    chunks: ["no", "ho", "entenc"]
    extra: ["el"]
    answers:
      - "No ho entenc."
    explanation: "*Ho* va davant del verb: *no ho entenc*."

  - id: b1-16-020
    type: order
    point: ho-neutre
    lesson: 2
    cue: "Digues que ja ho faràs demà."
    chunks: ["ja", "ho", "faré", "demà"]
    extra: ["el"]
    answers:
      - "Ja ho faré demà."
      - "Demà ja ho faré."
    explanation: "*Ho* va davant del verb: *ja ho faré*. *Demà* pot anar al principi o al final."

  - id: b1-16-021
    type: order
    point: ho-atribut
    lesson: 2
    cue: "Et pregunten si estàs nerviós. Respon que no ho estàs gens."
    chunks: ["no", "ho", "estic", "gens"]
    extra: ["el"]
    answers:
      - "No ho estic gens."
    explanation: "En negatiu: *no ho estic gens*. *Ho* no canvia mai, ni en negatiu."

  - id: b1-16-022
    type: choice
    point: ho-neutre
    lesson: 2
    prompt: "—Has promès que vindràs a ajudar-me? —Sí, ___ he promès."
    answer: "ho"
    distractors:
      - text: "el"
        why: "*El* seria un nom masculí. «Que vindràs» és una idea: *ho*."
      - text: "li"
        why: "*Li* és complement indirecte. «Que vindràs» és una idea: *ho*."
    explanation: "«Que vindràs a ajudar-me» és una idea sencera: *ho he promès*."

  - id: b1-16-023
    type: choice
    point: ho-atribut
    lesson: 2
    prompt: "—És gelós, l'Arnau? —No, no ___ és gens."
    answer: "ho"
    distractors:
      - text: "el"
        why: "*El* substitueix un nom. «Gelós» és l'atribut: *ho*."
      - text: "hi"
        why: "*Hi és* voldria dir que és en un lloc. Aquí és l'atribut: *ho*."
    explanation: "«Gelós» és l'atribut de *ser*. En negatiu: *no ho és gens*."

  - id: b1-16-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «Tant m'és»?"
    answer: "Que li és igual."
    distractors:
      - text: "Que no ho sap."
        why: "Això seria *no ho sé pas*, no *tant m'és*."
      - text: "Que ho sent molt."
        why: "Això és una disculpa: *ho sento molt*."
    explanation: "*Tant m'és* vol dir que totes les opcions et van bé: t'és igual."

  - id: b1-16-025
    type: choice
    point: ho-neutre
    lesson: 2
    prompt: "—Has vist la pel·lícula nova de divendres? —Sí, ___ vaig veure dos cops."
    answer: "la"
    distractors:
      - text: "ho"
        why: "*Ho* és per a una idea. «La pel·lícula» és un nom femení concret: *la*."
      - text: "hi"
        why: "*Hi* és per a un lloc. «La pel·lícula» és un complement directe femení: *la*."
    explanation: "«La pel·lícula» és un nom femení concret que fa de complement directe: *la vaig veure*."

  - id: b1-16-026
    type: choice
    point: ho-atribut
    lesson: 2
    prompt: "—Eren simpàtics, els veïns nous? —Sí que ___ eren."
    answer: "ho"
    distractors:
      - text: "els"
        why: "*Els* seria un nom masculí plural. L'atribut «simpàtics» es converteix en *ho*, que no canvia mai."
      - text: "hi"
        why: "*Hi eren* voldria dir que eren en un lloc. Aquí és l'atribut: *ho*."
    explanation: "«Simpàtics» és l'atribut de *ser*. *Ho* no té plural: *sí que ho eren*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-16-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Saps que la Carla plega? —Sí, ja sé."
    error: "ja sé"
    fix: "ja ho sé"
    fix_distractors:
      - text: "ja el sé"
        why: "*El* seria un nom masculí. «Que la Carla plega» és una idea: *ho*."
      - text: "ja hi sé"
        why: "*Hi* és per a un lloc. «Que la Carla plega» no és un lloc: és una idea, *ho*."
    explanation: "En català, si no repetim la idea, el pronom és obligatori: *ja ho sé*."

  - id: b1-16-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—És veritat que vindràs? —Sí que és."
    error: "Sí que és"
    fix: "Sí que ho és"
    fix_distractors:
      - text: "Sí que l'és"
        why: "*El* substitueix un nom masculí. «Veritat» és l'atribut: *ho*."
      - text: "Sí que hi és"
        why: "*Hi és* voldria dir que és en un lloc. Aquí és l'atribut «veritat»: *ho*."
    explanation: "L'atribut «veritat» no es repeteix, però el pronom *ho* és obligatori: *sí que ho és*."

  - id: b1-16-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "No ho entenc: el metge diu que he de descansar i el cap diu que he de treballar."
    no_error: true
    explanation: "La frase és correcta: *ho* substitueix tota la idea de després dels dos punts."

  - id: b1-16-030
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Vindràs a la festa? —Sí, et prometo."
    error: "et prometo"
    fix: "t'ho prometo"
    fix_distractors:
      - text: "te'l prometo"
        why: "*El* necessitaria un nom masculí, i aquí no n'hi ha cap: és la idea «que vindré», *ho*."
      - text: "t'hi prometo"
        why: "*Hi* és per a un lloc. Aquí és una idea: *ho*."
    explanation: "*Prometre* necessita el complement. Si no repetim la idea («que vindré»), cal *ho*: *t'ho prometo*."

  - id: b1-16-031
    type: find-error
    point: ho-posicio
    lesson: 3
    sentence: "No t'he sentit: digues-lo més alt, sense vergonya."
    error: "digues-lo"
    fix: "digues-ho"
    fix_distractors:
      - text: "digues-la"
        why: "*La* seria un nom femení. «El que has dit» és una idea: *ho*."
      - text: "digues-los"
        why: "*Els* seria un nom plural. Aquí és una idea: *ho*."
    explanation: "«El que has dit» és una idea, no un nom: *digues-ho*. Darrere de l'imperatiu, *ho* va amb guionet."

  - id: b1-16-032
    type: find-error
    point: ho-posicio
    lesson: 3
    sentence: "Si vols venir, has de dir-ho abans de divendres."
    no_error: true
    explanation: "La frase és correcta: *dir-ho* porta *ho* darrere de l'infinitiu, i *has de* és l'obligació."

  - id: b1-16-033
    type: fill
    point: ho-posicio
    lesson: 3
    prompt: "—Vols dir que plegaràs? —Sí. —Doncs explica-___ a la reunió."
    hint: "pronom per a «això», darrere l'imperatiu"
    answers: ["ho"]
    wrong_answers:
      - text: "la"
        why: "*La* necessitaria un nom femení, i aquí no n'hi ha cap: és la idea «que plegaràs», *ho*."
    grading: tolerant
    explanation: "«Que plegaràs» és una idea: *explica-ho*. Darrere de l'imperatiu, el pronom va amb guionet."

  - id: b1-16-034
    type: fill
