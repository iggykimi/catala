  # ---------------- Lliçó 5 ----------------
  - id: b1-16-053
    type: reading
    point: comprensio
    lesson: 5
    title: "La Carla canvia de feina"
    text: |
      La Carla té trenta-quatre anys i treballa en un banc de Sabadell des de fa deu anys. Guanya un bon sou, però fa mesos que està trista: diu que la feina l'avorreix i li fa ràbia perdre el temps. El seu germà, en Pau, és mestre i sempre li diu que provi de canviar.

      Al gener, la Carla ho explica als seus pares. S'esperava un enuig i una discussió, però el seu pare, un home sincer, ho entén de seguida: ell també va canviar de feina als quaranta anys. La seva mare està nerviosa: és molt impacient i li fa moltes preguntes. Li fa pena veure-la trista. Però al cap d'una setmana es calma.

      El canvi li feia una mica de por, però al març la Carla ho decideix: deixa el banc i comença un curs per ser infermera. «No ho sé pas, si podré», diu el primer dia, «però ho intentaré amb calma». Les companyes són alegres, simpàtiques i pacients, i els professors són generosos i tenen molta paciència. La Carla confia en ells.

      Ara la Carla està contenta i sempre de bon humor: l'alegria ha tornat i la tristesa ha marxat. «Ho sé: guanyaré menys diners», diu rient, «però soc molt més feliç. Si ets valent, ja ho veuràs: tot canvia». Els seus pares estan orgullosos d'ella: sempre ha estat una noia sensible.
    questions:
      - prompt: "Per què vol canviar de feina, la Carla?"
        answer: "Perquè la feina del banc l'avorreix."
        distractors:
          - text: "Perquè guanya pocs diners al banc."
            why: "El text diu que guanya un bon sou."
          - text: "Perquè vol treballar amb el seu germà."
            why: "El text no diu que vulgui treballar amb el seu germà."
      - prompt: "Com reacciona el pare quan la Carla ho explica?"
        answer: "Ho accepta bé: ell també va canviar de feina."
        distractors:
          - text: "Discuteix amb ella durant dies."
            why: "El text diu que s'esperava una discussió, però no n'hi ha cap."
          - text: "Es posa nerviós i li fa preguntes."
            why: "Qui es posa nerviosa és la mare, no el pare."
      - prompt: "Què fa la Carla al març?"
        answer: "Deixa el banc i comença un curs d'infermeria."
        distractors:
          - text: "Comença a treballar d'infermera."
            why: "Al març comença el curs, no la feina."
          - text: "Demana un augment de sou al banc."
            why: "El text no diu res del sou al març: deixa el banc."
      - prompt: "Com està la Carla al final?"
        answer: "Contenta, encara que guanyarà menys."
        distractors:
          - text: "Trista, perquè troba a faltar el banc."
            why: "Al final està contenta: és molt més feliç."
          - text: "Nerviosa, perquè el curs és difícil."
            why: "El text no diu que el curs sigui difícil."
    explanation: "El text explica com la Carla deixa el banc, fa un curs d'infermera i queda contenta."

