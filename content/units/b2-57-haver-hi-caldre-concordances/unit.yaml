id: b2-57
level: B2
title: "Haver-hi, caldre i les concordances"
summary: "Haver-hi invariable en registre formal, la concordança de caldre, els impersonals del temps, la concordança del participi i expressions amb caldre, en el context de la sanitat."
vocabulary_theme: "Salut pública i sanitat"
points:
  - id: haver-hi-formal
    title: "Haver-hi invariable en registre formal"
    refs:
      - label: "GEIEC: haver-hi"
        url: "https://geiec.iec.cat"
  - id: caldre
    title: "El verb caldre: cal, calen"
    refs:
      - label: "GEIEC: caldre"
        url: "https://geiec.iec.cat"
  - id: impersonals-meteo
    title: "Els impersonals meteorològics"
    refs:
      - label: "GEIEC: els verbs impersonals"
        url: "https://geiec.iec.cat"
  - id: participi-concordanca
    title: "La concordança del participi"
    refs:
      - label: "GEIEC: la concordança del participi"
        url: "https://geiec.iec.cat"
  - id: compte-cal
    title: "Compte amb el castellà: cal sense concordar"
    refs:
      - label: "Optimot: caldre"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions amb caldre"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: haver-hi i caldre"
  - title: "Practicar haver-hi i caldre"
  - title: "El temps, el participi i el calc de cal"
  - title: "Produir: tot junt"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el metge de família, la metgessa de família"
    definition: "Metge que atén els problemes de salut habituals de cada persona."
    example: "Demana hora amb la metgessa de família per la tos."
  - word: "el metge de guàrdia, la metgessa de guàrdia"
    definition: "Metge que atén les urgències fora de l'horari normal."
    example: "De nit, et rep el metge de guàrdia."
  - word: "urgències"
    definition: "Servei de l'hospital que atén els casos greus i immediats."
    example: "El van portar a urgències en ambulància."
  - word: "l'ambulància"
    definition: "Vehicle que porta els malalts i els ferits a l'hospital."
    example: "L'ambulància va arribar en deu minuts."
  - word: "l'infermer, la infermera"
    definition: "Persona que cuida els malalts i ajuda el metge."
    example: "La infermera em va prendre la tensió."
  - word: "el pacient, la pacient"
    definition: "Persona que rep atenció mèdica."
    example: "El pacient de l'habitació tres ja pot sortir."
  - word: "la recepta"
    definition: "Paper on el metge escriu els medicaments que cal prendre."
    example: "El metge m'ha fet la recepta per a un mes."
  - word: "el medicament"
    definition: "Producte que serveix per curar o alleujar una malaltia."
    example: "Aquest medicament es pren amb el menjar."
  - word: "la farmàcia de guàrdia"
    definition: "Farmàcia que obre de nit o en festiu, per torns."
    example: "Diumenge només obre la farmàcia de guàrdia del carrer Major."
  - word: "la vacuna"
    definition: "Producte que es posa per prevenir una malaltia."
    example: "La vacuna de la grip es posa cada tardor."
  - word: "la campanya de vacunació"
    definition: "Acció organitzada per vacunar molta gent en poc temps."
    example: "La campanya de vacunació comença dilluns als CAP."
  - word: "la dosi"
    definition: "Quantitat de medicament o de vacuna que es pren cada cop."
    example: "Amb una sola dosi ja queda protegit."
  - word: "la targeta sanitària"
    definition: "Targeta que identifica cada usuari de la sanitat pública."
    example: "Porta la targeta sanitària a la primera visita."
  - word: "el centre de salut"
    definition: "Edifici del barri on hi ha els metges de família."
    example: "El centre de salut obre a les vuit del matí."
  - word: "la sala d'espera"
    definition: "Sala on els pacients esperen el torn de visita."
    example: "La sala d'espera era plena de gent."
  - word: "la llista d'espera"
    definition: "Llista de pacients que esperen una operació o una prova."
    example: "Fa tres mesos que és a la llista d'espera."
  - word: "l'ingrés"
    definition: "Entrada d'un malalt a l'hospital per quedar-s'hi uns dies."
    example: "L'ingrés va ser dilluns i dijous ja era a casa."
  - word: "ingressar"
    definition: "Entrar en un hospital com a pacient per quedar-s'hi."
    example: "L'han ingressat per una pneumònia."
  - word: "el tractament"
    definition: "Conjunt de cures i medicaments per a una malaltia."
    example: "El tractament dura tres setmanes."
  - word: "l'analítica"
    definition: "Prova de sang o d'orina que es fa al laboratori."
    example: "M'han demanat una analítica completa."
  - word: "el diagnòstic"
    definition: "Nom de la malaltia que el metge identifica en un pacient."
    example: "El diagnòstic va ser una grip forta."
  - word: "el símptoma"
    definition: "Senyal d'una malaltia, com la febre o la tos."
    example: "El primer símptoma va ser el mal de cap."
  - word: "la grip"
    definition: "Malaltia d'hivern amb febre, tos i dolor al cos."
    example: "Aquest hivern hi ha molta grip."
  - word: "el contagi"
    definition: "Transmissió d'una malaltia d'una persona a una altra."
    example: "El contagi es frena amb la higiene de mans."
  - word: "el brot"
    definition: "Aparició de diversos casos d'una malaltia en un lloc."
    example: "Hi ha hagut un brot de grip a l'escola."
  - word: "la prevenció"
    definition: "Conjunt de mesures per evitar les malalties."
    example: "La prevenció comença amb l'esport i el menjar sa."
  - word: "donar sang"
    definition: "Deixar que et treguin sang per ajudar altres malalts."
    example: "Cada any dono sang dues vegades."
  - word: "el quiròfan"
    definition: "Sala de l'hospital on es fan les operacions."
    example: "L'han portat al quiròfan a les nou."
  - word: "operar"
    definition: "Intervenir un pacient en un quiròfan per curar-lo."
    example: "L'operen dimarts del genoll."
  - word: "el cirurgià, la cirurgiana"
    definition: "Metge que fa operacions al quiròfan."
    example: "El cirurgià diu que tot ha anat bé."
  - word: "atendre"
    definition: "Rebre un pacient i ocupar-se'n mèdicament."
    example: "El metge m'ha atès sense cita."
  - word: "la UCI"
    definition: "Unitat de Cures Intensives, per als malalts més greus."
    example: "Després de l'operació va passar dos dies a l'UCI."
  - word: "el protocol"
    definition: "Normes que cal seguir en cada situació mèdica."
    example: "El protocol diu que cal aïllar el pacient."
  - word: "la mostra"
    definition: "Petita quantitat de sang o d'orina que s'analitza."
    example: "Han enviat la mostra al laboratori."
  - word: "el laboratori"
    definition: "Lloc on s'analitzen les mostres mèdiques."
    example: "El laboratori triga dos dies a donar el resultat."
  - word: "el voluntari, la voluntària"
    definition: "Persona que ajuda en una tasca sense cobrar."
    example: "Els voluntaris reparteixen mascaretes a l'entrada."
  - word: "la llitera"
    definition: "Llit estret per portar malalts i ferits."
    example: "El van treure en llitera."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-57-001
    type: choice
    point: haver-hi-formal
    lesson: 1
    prompt: "A la tercera planta ___ una farmàcia i dues consultes."
    answer: "hi ha"
    distractors:
      - text: "han"
        why: "Sense *hi* no hi ha existència: *han* tot sol no té sentit aquí."
      - text: "és"
        why: "Per dir que una cosa existeix en un lloc no es fa servir *ser*: cal *haver-hi*."
      - text: "n'hi ha"
        why: "*En* necessita un referent («quantes?»); aquí no n'hi ha cap: *hi ha*."
    explanation: "«Una farmàcia i dues consultes» existeixen: l'existència s'expressa amb *hi ha*, que no varia."

  - id: b2-57-002
    type: choice
    point: haver-hi-formal
    lesson: 1
    prompt: "En un text formal: ahir ___ tres pacients a urgències."
    answer: "hi havia"
    distractors:
      - text: "hi havien"
        why: "En registre formal, *haver-hi* no concorda. *Hi havien* només s'admet en la parla col·loquial."
      - text: "hi ha"
        why: "«Ahir» demana passat: *hi havia*."
    explanation: "«Ahir» demana imperfet, i en un text formal *haver-hi* no concorda: *hi havia*."

  - id: b2-57-003
    type: choice
    point: haver-hi-formal
    lesson: 1
    prompt: "L'hivern que ve ___ més casos de grip, segons els experts."
    answer: "hi haurà"
    distractors:
      - text: "hi ha"
        why: "«L'hivern que ve» és futur, no present: *hi haurà*."
      - text: "haurà"
        why: "L'existència s'expressa amb *haver-hi*: sense *hi* la frase no és correcta."
    explanation: "«L'hivern que ve» és futur: *hi haurà*. L'error típic és oblidar el pronom *hi*."

  - id: b2-57-004
    type: choice
    point: caldre
    lesson: 1
    prompt: "Per a la campanya ___ més voluntaris."
    answer: "calen"
    distractors:
      - text: "cal"
        why: "*Cal* és singular; amb «voluntaris» cal el plural *calen*."
      - text: "necessiten"
        why: "*Necessitar* necessita un subjecte (qui necessita?). Per a la necessitat impersonal: *calen*."
    explanation: "«Més voluntaris» és plural: *caldre* concorda amb el subjecte: *calen*."

  - id: b2-57-005
    type: choice
    point: caldre
    lesson: 1
    prompt: "Per donar sang ___ tenir més de divuit anys."
    answer: "cal"
    distractors:
      - text: "calen"
        why: "*Calen* demana un subjecte plural; amb un infinitiu, sempre *cal*."
      - text: "han"
        why: "*Han* + infinitiu no existeix: l'obligació impersonal és *cal* + infinitiu."
      - text: "s'ha"
        why: "*S'ha* demana un participi (*s'ha fet*), no un infinitiu."
    explanation: "«Tenir» és un infinitiu: amb infinitiu, *caldre* va sempre en singular: *cal*."

  - id: b2-57-006
    type: choice
    point: caldre
    lesson: 1
    prompt: "L'any que ve ___ més infermeres a l'hospital nou."
    answer: "caldran"
    distractors:
      - text: "caldrà"
        why: "*Caldrà* és singular; amb «infermeres» cal el plural *caldran*."
      - text: "calen"
        why: "«L'any que ve» és futur, no present: *caldran*."
    explanation: "«Més infermeres» és plural i «l'any que ve» és futur: *caldran*."

  - id: b2-57-007
    type: match
    point: haver-hi-formal
    lesson: 1
    instruction: "Relaciona cada forma amb el seu temps verbal."
    pairs:
      - ["hi ha", "present"]
      - ["hi havia", "passat (imperfet)"]
      - ["hi ha hagut", "passat (perfet)"]
      - ["hi haurà", "futur"]
      - ["hi hauria", "condicional"]
    explanation: "*Haver-hi* no concorda mai: *hi ha* (present), *hi havia* i *hi ha hagut* (passat), *hi haurà* (futur), *hi hauria* (condicional)."

  - id: b2-57-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["no cal dir", "és evident"]
      - ["tant com calgui", "tot el temps que faci falta"]
      - ["si cal", "si és necessari"]
      - ["no cal", "no fa falta"]
    explanation: "Són expressions amb *caldre*: *no cal dir*, *tant com calgui*, *si cal* i *no cal*."

  - id: b2-57-009
    type: inline-choice
    instruction: "Tria la forma del registre formal."
    point: haver-hi-formal
    lesson: 1
    title: "Informe del CAP (text formal)"
    text: "El mes passat {hi va haver|hi van haver} un brot de grip al barri. A urgències {hi havia|hi havien} cada dia més de vint pacients, i també {hi ha hagut|hi han hagut} moltes consultes per telèfon. Aquest mes {hi ha|hi han} menys casos nous."
    explanation: "En registre formal, *haver-hi* no concorda mai: *hi va haver*, *hi havia*, *hi ha hagut*, *hi ha*. Les formes en plural només s'admeten en la parla col·loquial."

  - id: b2-57-010
    type: fill
    point: haver-hi-formal
    lesson: 1
    prompt: "En registre formal: abans ___ un hospital petit a cada poble."
    hint: "*haver-hi*, imperfet"
    answers: ["hi havia"]
    wrong_answers:
      - text: "hi havien"
        why: "En registre formal, *haver-hi* és invariable: *hi havia*."
      - text: "hi ha"
        why: "«Abans» demana passat: *hi havia*."
    grading: tolerant
    explanation: "«Abans» demana imperfet: *hi havia*. En registre formal, *haver-hi* no concorda mai."

  - id: b2-57-011
    type: fill
    point: caldre
    lesson: 1
    prompt: "Per a l'operació ___ dos cirurgians i una anestesista."
    hint: "*caldre*, present"
    answers: ["calen"]
    wrong_answers:
      - text: "cal"
        why: "*Cal* és singular; amb un subjecte plural cal *calen*."
      - text: "necessiten"
        why: "Sense subjecte, *necessiten* no té sentit. La necessitat impersonal és *calen*."
    grading: tolerant
    explanation: "«Dos cirurgians i una anestesista» és un subjecte plural: *calen*."

  - id: b2-57-012
    type: order
    point: haver-hi-formal
    lesson: 1
    cue: "En registre formal: el poble té un hospital nou."
    chunks: ["Hi", "ha", "un", "hospital", "nou", "al", "poble"]
    extra: ["han"]
    answers:
      - "Hi ha un hospital nou al poble."
      - "Al poble hi ha un hospital nou."
    explanation: "En registre formal, *haver-hi* no concorda: *hi ha*."

  - id: b2-57-013
    type: choice
    point: caldre
    lesson: 1
    prompt: "Quan hi ha febre, ___ beure molta aigua."
    answer: "cal"
    distractors:
      - text: "calen"
        why: "*Calen* demana un subjecte plural; amb un infinitiu, sempre *cal*."
      - text: "té que"
        why: "*Tenir que* és un calc de «tener que»; la necessitat impersonal és *cal*."
    explanation: "«Beure» és un infinitiu: amb infinitiu, *caldre* va sempre en singular: *cal*."

  # ---------- Lliçó 2 ----------
  - id: b2-57-014
    type: fill
    point: haver-hi-formal
    lesson: 2
    prompt: "En registre formal: aquest hivern ___ molts ingressos per la grip."
    hint: "*haver-hi*, perfet"
    answers: ["hi ha hagut"]
    wrong_answers:
      - text: "hi han hagut"
        why: "En registre formal, *haver-hi* no concorda: *hi ha hagut*."
      - text: "hi havia hagut"
        why: "El plusquamperfet és per a un passat anterior a un altre passat; aquí cal el perfet."
    grading: tolerant
    explanation: "«Aquest hivern» és un període no acabat: perfet, *hi ha hagut*. En registre formal, invariable."

  - id: b2-57-015
    type: fill
    point: haver-hi-formal
    lesson: 2
    prompt: "De llits lliures, avui ___ quatre a la tercera planta."
    hint: "*haver-hi* amb el pronom *en*"
    answers: ["n'hi ha"]
    wrong_answers:
      - text: "hi ha"
        why: "Amb «de llits lliures» cal reprendre el complement amb *en*: *n'hi ha*."
      - text: "en hi ha"
        why: "L'ordre és *n'hi ha*: *en hi ha* no existeix."
    grading: tolerant
    explanation: "«De llits lliures» es reprèn amb el pronom *en*: *n'hi ha*."

  - id: b2-57-016
    type: fill
    point: caldre
    lesson: 2
    prompt: "Abans ___ demanar hora per telèfon; ara es fa per internet."
    hint: "*caldre*, imperfet"
    answers: ["calia"]
    wrong_answers:
      - text: "calien"
        why: "*Calien* demana un subjecte plural; amb un infinitiu, sempre singular: *calia*."
      - text: "cal"
        why: "«Abans» demana passat: *calia*."
    grading: tolerant
    explanation: "«Abans» demana imperfet, i «demanar» és un infinitiu: *calia*."

  - id: b2-57-017
    type: fill
    point: caldre
    lesson: 2
    prompt: "Si el barri fos més gran, ___ més metges de família."
    hint: "*caldre*, condicional"
    answers: ["caldrien"]
    wrong_answers:
      - text: "caldria"
        why: "*Caldria* és singular; amb «metges» cal el plural *caldrien*."
      - text: "calen"
        why: "Darrere de «si fos» cal el condicional, no el present: *caldrien*."
    grading: tolerant
    explanation: "«Si fos» planteja una hipòtesi: condicional. I «més metges» és plural: *caldrien*."

  - id: b2-57-018
    type: order
    point: haver-hi-formal
    lesson: 2
    cue: "En registre formal: ahir a la tarda, tres pacients a urgències."
    chunks: ["Ahir", "hi", "havia", "tres", "pacients", "a", "urgències"]
    extra: ["havien"]
    answers:
      - "Ahir hi havia tres pacients a urgències."
      - "Hi havia tres pacients a urgències ahir."
    explanation: "En registre formal, *haver-hi* no concorda: *hi havia*, encara que hi hagi tres pacients."

  - id: b2-57-019
    type: order
    point: caldre
    lesson: 2
    cue: "Digues que per a aquest tractament fan falta dues receptes."
    chunks: ["Calen", "dues", "receptes", "per", "a", "aquest", "tractament"]
    extra: ["Cal"]
    answers:
      - "Calen dues receptes per a aquest tractament."
      - "Per a aquest tractament calen dues receptes."
    explanation: "«Dues receptes» és plural: *calen*. L'ordre pot canviar, però la concordança no."

  - id: b2-57-020
    type: choice
    point: haver-hi-formal
    lesson: 2
    prompt: "Sense l'ambulància, ___ un problema greu."
    answer: "hi hauria"
    distractors:
      - text: "hi haurà"
        why: "No és un futur segur, sinó una hipòtesi: *hi hauria*."
      - text: "hi ha"
        why: "El present no expressa la hipòtesi de «sense l'ambulància»: *hi hauria*."
      - text: "hi hagués"
        why: "*Hi hagués* és subjuntiu; en l'oració principal cal el condicional *hi hauria*."
    explanation: "«Sense l'ambulància» planteja una hipòtesi: condicional, *hi hauria*."

  - id: b2-57-021
    type: choice
    point: caldre
    lesson: 2
    prompt: "___ dues persones per portar la llitera."
    answer: "Calen"
    distractors:
      - text: "Cal"
        why: "*Cal* és singular; amb «dues persones» cal *calen*."
      - text: "Necessiten"
        why: "Sense subjecte, *necessiten* no té sentit: la necessitat impersonal és *calen*."
    explanation: "«Dues persones» és plural: *caldre* concorda amb el subjecte: *calen*."

  - id: b2-57-022
    type: choice
    point: caldre
    lesson: 2
    prompt: "Per visitar un pacient ingressat ___ demanar permís a recepció."
    answer: "cal"
    distractors:
      - text: "calen"
        why: "*Calen* demana un subjecte plural; amb un infinitiu, sempre *cal*."
      - text: "han"
        why: "*Han* + infinitiu no existeix: l'obligació impersonal és *cal* + infinitiu."
      - text: "té que"
        why: "*Tenir que* és un calc de «tener que»; aquí cal l'impersonal *cal*."
    explanation: "«Demanar» és un infinitiu: amb infinitiu, *caldre* va sempre en singular: *cal*."

  - id: b2-57-023
    type: inline-choice
    point: caldre
    lesson: 2
    title: "Avís del centre de salut"
    text: "Atenció, usuaris: per demanar hora {cal|calen} trucar abans de les vuit. Per a les analítiques {calen|cal} dues mostres de sang. Si teniu febre, {cal|calen} que aviseu per telèfon. L'any que ve {caldran|caldrà} més infermeres al torn de nit."
    explanation: "«Trucar» és un infinitiu: *cal*. «Dues mostres» és plural: *calen*. «Que aviseu» demana *cal que*. «Més infermeres» en futur: *caldran*."

  - id: b2-57-024
    type: fill
    point: haver-hi-formal
    lesson: 2
    prompt: "En registre formal: cal que ___ un metge de guàrdia a l'hospital."
    hint: "*haver-hi*, present de subjuntiu"
    answers: ["hi hagi"]
    wrong_answers:
      - text: "hi ha"
        why: "«Cal que» demana subjuntiu, no indicatiu: *hi hagi*."
      - text: "hi hagin"
        why: "En registre formal, *haver-hi* no concorda ni en subjuntiu: *hi hagi*."
    grading: tolerant
    explanation: "«Cal que» demana subjuntiu: *hi hagi*. En registre formal, invariable."

  - id: b2-57-025
    type: choice
    point: haver-hi-formal
    lesson: 2
    prompt: "En un text formal, quina frase és correcta?"
    answer: "Ahir hi havia tres casos nous al barri."
    distractors:
      - text: "Ahir hi havien tres casos nous al barri."
        why: "En registre formal, *haver-hi* no concorda: *hi havia*."
      - text: "Ahir hi ha tres casos nous al barri."
        why: "«Ahir» demana passat: *hi havia*."
    explanation: "«Ahir» demana imperfet, i en un text formal *haver-hi* no concorda: *hi havia*."

  - id: b2-57-026
    type: fill
    point: caldre
    lesson: 2
    prompt: "L'any que ve ___ més llits a l'UCI nova."
    hint: "*caldre*, futur"
    answers: ["caldran"]
    wrong_answers:
      - text: "caldrà"
        why: "*Caldrà* és singular; amb «llits» cal el plural *caldran*."
      - text: "calen"
        why: "«L'any que ve» és futur, no present: *caldran*."
    grading: tolerant
    explanation: "«Més llits» és plural i «l'any que ve» és futur: *caldran*."

  # ---------- Lliçó 3 ----------
  - id: b2-57-027
    type: choice
    point: impersonals-meteo
    lesson: 3
    prompt: "Aquest matí ___ i les carreteres són cobertes de neu."
    answer: "ha nevat"
    distractors:
      - text: "ha plogut"
        why: "La pluja no cobreix de neu: amb «neu», *ha nevat*."
      - text: "ha pedregat"
        why: "La pedra no és neu: *ha nevat*."
