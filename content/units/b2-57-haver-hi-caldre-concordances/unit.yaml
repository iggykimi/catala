  # ---------- Lliçó 5 ----------
  - id: b2-57-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Una setmana de grip al CAP"
    text: |
      La setmana passada hi va haver un brot de grip a Vic i el centre de salut va haver de reforçar el servei. Dilluns al matí hi havia més de quaranta pacients a la sala d'espera, i dimarts calien dues metgesses més per atendre tothom. No cal dir que el personal va treballar de valent tota la setmana.

      Segons la doctora Miralles, metgessa de família, calen tres coses per frenar el contagi: rentar-se les mans, ventilar les sales i quedar-se a casa si hi ha febre. La prevenció comença a casa, diu. «Si cal, truqueu al centre abans de venir», afegeix. Les analítiques dels primers pacients ja han estat enviades al laboratori i els resultats confirmen el diagnòstic.

      A la farmàcia de guàrdia també hi ha hagut molta feina: han venut el doble de medicaments per a la tos i la febre. La infermera recorda que per demanar hora cal trucar abans de les vuit, i que amb la targeta sanitària n'hi ha prou per a la primera visita.

      El temps no ha ajudat gens: ha plogut cada dia i a les nits ha glaçat, i els carrers mullats han provocat diverses caigudes. «Diumenge farà sol», anuncia la previsió, «i si tot va bé la setmana que ve caldran menys llits a urgències».

      El brot també ha afectat l'hospital: han ingressat tres pacients grans amb símptomes greus i han hagut d'obrir dues sales noves. També hi ha un pacient greu a l'UCI. Els protocols ja estaven preparats des de la tardor, i el quiròfan funciona amb normalitat perquè les operacions programades no s'han suspès.

      De moment, el centre demana voluntaris per a la campanya de vacunació: tant com calgui, diuen, fins que el brot estigui controlat.
    questions:
      - prompt: "Què va passar dilluns al centre de salut?"
        answer: "La sala d'espera era plena: més de quaranta pacients."
        distractors:
          - text: "Van obrir dues sales noves a l'hospital."
            why: "Això va passar a l'hospital, més tard."
          - text: "Van vendre el doble de medicaments."
            why: "Això va passar a la farmàcia de guàrdia."
      - prompt: "Què cal fer per frenar el contagi, segons la doctora Miralles?"
        answer: "Higiene de mans, ventilació i quedar-se a casa amb febre."
        distractors:
          - text: "Trucar al centre abans de les vuit."
            why: "Això és per demanar hora, no per frenar el contagi."
          - text: "Anar a urgències amb la targeta sanitària."
            why: "Amb febre cal quedar-se a casa, no anar a urgències."
      - prompt: "Per què el temps no ha ajudat?"
        answer: "La pluja de cada dia i el gel de nit."
        distractors:
          - text: "Ha nevat i els carrers són blancs."
            why: "El text parla de pluja i gel, no de neu."
          - text: "Ha fet molta calor tota la setmana."
            why: "Al contrari: ha plogut i ha glaçat."
      - prompt: "Què diu el text de la setmana que ve?"
        answer: "Es preveu menys feina a urgències i bon temps diumenge."
        distractors:
          - text: "Caldran dues metgesses més al centre."
            why: "Això va ser dimarts passat."
          - text: "Se suspendran les operacions programades."
            why: "El text diu que no s'han suspès."
    explanation: "El text explica com un brot de grip ha omplert el CAP de Vic i què cal fer per frenar-lo."

