  - id: b1-36-065
    type: reading
    point: comprensio
    lesson: 5
    title: "Un pòdcast de barri"
    text: |
      La Carla és periodista i en Pau és tècnic de so. Fa un any van crear «Gràcia en veu alta», un pòdcast setmanal sobre el barri. Cada dijous pengen un capítol nou de vint minuts: una entrevista a un veí, les notícies del casal i la recomanació del presentador.

      Al principi només els escoltaven els amics. Però la Carla va compartir el programa a les xarxes, va demanar als oients que deixessin comentaris i va contestar cada missatge. Ara tenen més de dos mil seguidors, una subscripció per als oients més fidels i una petita emissora local que emet el capítol cada divendres al vespre.

      El secret, diuen, és la constància: graven cada dimarts al vespre, tant si plou com si fa calor, i preparen el guió amb una setmana d'antelació. També fan un directe al mes, on els oients truquen per telèfon i fan preguntes als convidats.

      El mes que ve volen organitzar una festa al carrer per celebrar el primer aniversari, amb música i una tertúlia oberta. «Volem que el pòdcast surti de la pantalla», diu la Carla.
    questions:
      - prompt: "Què és «Gràcia en veu alta»?"
        answer: "Un pòdcast setmanal sobre el barri de Gràcia."
        distractors:
          - text: "Una emissora local que emet cada divendres."
            why: "L'emissora només emet el capítol; el programa és un pòdcast."
          - text: "Un directe mensual amb trucades dels oients."
            why: "El directe és una activitat al mes; el programa és setmanal."
      - prompt: "Com van aconseguir els primers seguidors?"
        answer: "La Carla el va compartir a les xarxes i contestava els missatges."
        distractors:
          - text: "Els amics van compartir el programa a les xarxes."
