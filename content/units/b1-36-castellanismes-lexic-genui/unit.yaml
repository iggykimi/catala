id: b1-36
level: B1
title: "Castellanismes freqüents i lèxic genuí"
summary: "Aprens a formar noms amb els sufixos *-ada, -esa, -ció, -ment, -isme* i *-ista*, i a substituir els barbarismes de cada dia per les formes genuïnes."
vocabulary_theme: "Mitjans de comunicació i xarxes"
points:
  - id: derivacio-ada-esa
    title: "Els sufixos *-ada* i *-esa*: *trucada*, *bellesa*"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: derivacio-cio-ment
    title: "Els sufixos *-ció* i *-ment*: *presentació*, *naixement*"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: derivacio-isme-ista
    title: "Els sufixos *-isme* i *-ista*: *periodisme*, *periodista*"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: barbarismes de cada dia"
  - id: expressions
    title: "Expressions de cada dia"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: noms en -ada, -esa, -ció i -ment"
  - title: "Practicar la derivació"
  - title: "-isme i -ista, i barbarismes"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el diari"
    definition: "Fulls amb notícies que surten cada dia."
    example: "Compro el diari cada matí al quiosc."
  - word: "la revista"
    definition: "Publicació setmanal o mensual amb reportatges i fotos."
    example: "Aquesta revista de cuina surt cada mes."
  - word: "la notícia"
    definition: "Informació nova sobre un fet recent."
    example: "La notícia va sortir a tots els diaris."
  - word: "el titular"
    definition: "Frase gran que resumeix una notícia."
    example: "El titular de portada parla de la vaga."
  - word: "la portada"
    definition: "Primera pàgina d'un diari o una revista."
    example: "La foto de la portada és preciosa."
  - word: "el reportatge"
    definition: "Article llarg que explica un tema amb detall."
    example: "El reportatge mostra la riquesa del barri."
  - word: "l'entrevista"
    definition: "Conversa amb preguntes i respostes que es publica."
    example: "L'entrevista al director dura deu minuts."
  - word: "el periodista, la periodista"
    definition: "Persona que escriu notícies o fa reportatges."
    example: "La periodista va cobrir el ple de l'Ajuntament."
  - word: "la redacció"
    definition: "Lloc on els periodistes escriuen les notícies."
    example: "La redacció del diari és al centre."
  - word: "el programa"
    definition: "Espai de ràdio o televisió amb un tema i un horari."
    example: "El programa de cinema comença a les deu."
  - word: "el presentador, la presentadora"
    definition: "Persona que condueix un programa."
    example: "La presentadora saluda els espectadors."
  - word: "l'espectador, l'espectadora"
    definition: "Persona que mira un programa o un espectacle."
    example: "Els espectadors van aplaudir al final."
  - word: "l'oient"
    definition: "Persona que escolta la ràdio o un pòdcast."
    example: "Els oients poden trucar al directe."
  - word: "l'audiència"
    definition: "Conjunt de persones que segueixen un programa."
    example: "El concurs té molta audiència jove."
  - word: "l'emissora"
    definition: "Empresa que emet programes de ràdio o televisió."
    example: "L'emissora local emet en català."
  - word: "el directe"
    definition: "Programa que s'emet en el mateix moment."
    example: "El directe de demà començarà a les vuit."
  - word: "el pòdcast"
    definition: "Programa d'àudio que pots escoltar quan vols."
    example: "Escolto un pòdcast d'història cada nit."
  - word: "la sèrie"
    definition: "Història explicada en molts capítols."
    example: "La sèrie té tres temporades curtes."
  - word: "el capítol"
    definition: "Cadascuna de les parts d'una sèrie."
    example: "Cada dijous pengen un capítol nou."
  - word: "la pantalla"
    definition: "Superfície on es veuen les imatges."
    example: "La pantalla del mòbil és massa petita."
  - word: "el teclat"
    definition: "Conjunt de tecles per escriure a l'ordinador."
    example: "El teclat nou va molt bé."
  - word: "la contrasenya"
    definition: "Paraula secreta per entrar en un compte."
    example: "No recordo la contrasenya del correu."
  - word: "l'enllaç"
    definition: "Text que et porta a una altra pàgina d'internet."
    example: "T'envio l'enllaç del vídeo per missatge."
  - word: "el perfil"
    definition: "Pàgina personal en una xarxa social."
    example: "Va penjar el vídeo al seu perfil."
  - word: "el compte"
    definition: "Accés personal a una web o una aplicació."
    example: "Vaig obrir un compte nou ahir."
  - word: "el seguidor, la seguidora"
    definition: "Persona que segueix un compte a les xarxes."
    example: "Cada setmana guanya cent seguidors."
  - word: "el comentari"
    definition: "Text curt per opinar en una publicació."
    example: "Vaig deixar un comentari al vídeo."
  - word: "publicar"
    definition: "Posar un text o una foto a internet."
    example: "Va publicar l'entrevista al vespre."
  - word: "compartir"
    definition: "Enviar una publicació a altres persones."
    example: "Comparteix el programa amb els amics."
  - word: "penjar"
    definition: "Posar un fitxer o una foto a internet."
    example: "Pengen un capítol nou cada dijous."
  - word: "la subscripció"
    definition: "Pagament regular per rebre un servei."
    example: "La subscripció inclou tots els capítols."
  - word: "la privadesa"
    definition: "Dret que les dades pròpies no es difonguin."
    example: "Configura la privadesa del perfil."
  - word: "el cercador"
    definition: "Eina per trobar pàgines a internet."
    example: "Ho vaig trobar amb el cercador."
  - word: "el fil"
    definition: "Conversa seguida de missatges a les xarxes."
    example: "Va desar el fil de la tertúlia."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-36-001
    type: choice
    point: derivacio-ada-esa
    lesson: 1
    prompt: "La Laia truca a la redacció del diari cada tarda: hi fan una ___ de mitja hora."
    answer: "trucada"
    distractors:
      - text: "trucament"
        why: "De *trucar*, el nom habitual és *trucada*, no *trucament*."
      - text: "trucació"
        why: "De *trucar*, el nom habitual és *trucada*, no *trucació*."
    explanation: "De *trucar* fem el nom *trucada* amb *-ada*. «Mitja hora» indica la durada de la conversa."

  - id: b1-36-002
    type: choice
    point: derivacio-ada-esa
    lesson: 1
    prompt: "Aquesta foto de la portada és d'una ___ increïble."
    answer: "bellesa"
    distractors:
      - text: "belleza"
        why: "«Belleza», amb *z*, és la forma castellana. En català: *bellesa*, amb *ss*."
      - text: "bellitat"
        why: "El nom de *bell* és *bellesa*, no *bellitat*."
    explanation: "De l'adjectiu *bell* fem *bellesa* amb *-esa*. S'escriu amb *ss*, no amb *z*."

  - id: b1-36-003
    type: choice
    point: derivacio-ada-esa
    lesson: 1
    prompt: "L'___ del tren de Girona serà a les vuit del vespre."
    answer: "arribada"
    distractors:
      - text: "arribament"
        why: "De *arribar*, el nom habitual és *arribada*, no *arribament*."
      - text: "arribació"
        why: "De *arribar*, el nom habitual és *arribada*, no *arribació*."
    explanation: "De *arribar* fem *arribada* amb *-ada*. «L'» indica que cal un nom femení."

  - id: b1-36-004
    type: choice
    point: derivacio-ada-esa
    lesson: 1
    prompt: "El reportatge de la revista mostra la ___ cultural de la ciutat."
    answer: "riquesa"
    distractors:
      - text: "riqueza"
        why: "«Riqueza», amb *z*, és castellà. En català: *riquesa*, amb *qu* i *s*."
      - text: "riquitat"
        why: "El nom de *ric* és *riquesa*, no *riquitat*."
    explanation: "De *ric* fem *riquesa* amb *-esa*. En català s'escriu amb *qu* i una sola *s*."

  - id: b1-36-005
    type: choice
    point: derivacio-cio-ment
    lesson: 1
    prompt: "La notícia diu que la ___ del nou disc serà divendres."
    answer: "presentació"
    distractors:
      - text: "presentament"
        why: "De *presentar*, el nom habitual és *presentació*, no *presentament*."
      - text: "presenta"
        why: "*Presenta* és el verb (*ell presenta*). Després de *la* cal un nom: *presentació*."
    explanation: "De *presentar* fem el nom femení *presentació* amb *-ció*. «La» demana un nom."

  - id: b1-36-006
    type: choice
    point: derivacio-cio-ment
    lesson: 1
    prompt: "El seu ___ del català millora cada setmana."
    answer: "coneixement"
    distractors:
      - text: "coneixeció"
        why: "De *conèixer*, el nom habitual és *coneixement*, no *coneixeció*."
      - text: "coneixença"
        why: "*Coneixença* és femení (*la coneixença*) i és una persona que coneixes poc."
    explanation: "De *conèixer* fem el masculí *coneixement* amb *-ment*. «El seu» demana un masculí."

  - id: b1-36-007
    type: choice
    point: derivacio-cio-ment
    lesson: 1
    prompt: "___ del festival va molt bé, aquest any."
    answer: "L'organització"
    distractors:
      - text: "El organització"
        why: "*Organització* és femení. *El* és masculí: aquí cal *l'*."
      - text: "La organització"
        why: "Davant de vocal, *la* s'apostrofa: *l'organització*."
    explanation: "Els noms en *-ció* són femenins. Davant de vocal, *la* s'apostrofa: *l'organització*."

  - id: b1-36-008
    type: match
    point: derivacio-ada-esa
    lesson: 1
    instruction: "Relaciona cada verb o adjectiu amb el nom corresponent."
    pairs:
      - ["trucar", "la trucada"]
      - ["abraçar", "l'abraçada"]
      - ["pobre", "la pobresa"]
      - ["vell", "la vellesa"]
      - ["mirar", "la mirada"]
    explanation: "Els verbs fan noms en *-ada* (*trucada*); els adjectius, noms en *-esa* (*pobresa*)."

  - id: b1-36-009
    type: match
    point: derivacio-cio-ment
    lesson: 1
    instruction: "Relaciona cada verb amb el nom corresponent."
    pairs:
      - ["presentar", "la presentació"]
      - ["organitzar", "l'organització"]
      - ["néixer", "el naixement"]
      - ["moure", "el moviment"]
      - ["traduir", "la traducció"]
    explanation: "Els noms en *-ció* són femenins; els noms en *-ment*, masculins."

  - id: b1-36-010
    type: inline-choice
    point: derivacio-ada-esa
    lesson: 1
    title: "Una abraçada a l'estació"
    text: "Hola! Ahir a l'estació ens vam fer una {abraçada|abraçament|abraçació} molt forta: feia mesos que no ens vèiem. L'{arribada|arribament|arribació} del tren portava retard, però l'espera va valer la pena: la {bellesa|belleza|bellitat} de retrobar-nos no es pot explicar. Vam fer una {passejada|passejament|passejació} pel barri antic i vam riure tota l'estona."
    explanation: "Dels verbs fem noms en *-ada* (*abraçada, arribada, passejada*). De *bell* fem *bellesa*, amb *ss*."

  - id: b1-36-011
    type: inline-choice
    point: derivacio-cio-ment
    lesson: 1
    title: "Nota de la redacció"
    text: "La {presentació|presentament|presenta} del nou programa serà dilluns. L'{organització|organitzament|organitza} de l'acte va a càrrec de la redacció. Necessitem el teu {coneixement|coneixeció|coneixença} de les xarxes per fer-ne difusió. El {llançament|llançació|llança} del pòdcast serà al març."
    explanation: "Els noms en *-ció* són femenins (*presentació, organització*); els noms en *-ment*, masculins (*coneixement, llançament*)."

  - id: b1-36-012
    type: fill
    point: derivacio-ada-esa
    lesson: 1
    prompt: "Abans de marxar, l'Ibrahim em va fer una ___ molt forta."
    hint: "ABRAÇAR, nom en *-ada*"
    answers: ["abraçada"]
    wrong_answers:
      - text: "abraçament"
        why: "De *abraçar*, el nom habitual és *abraçada*, no *abraçament*."
      - text: "abraç"
        why: "*Abraç* és masculí (*un abraç*). Aquí «una» demana el femení: *abraçada*."
    grading: tolerant
    explanation: "«Una» demana un nom femení. De *abraçar* fem *abraçada* amb *-ada*."

  - id: b1-36-013
    type: fill
    point: derivacio-cio-ment
    lesson: 1
    prompt: "Celebrem el centenari del ___ del poeta a Vilafranca."
    hint: "NÉIXER, nom en *-ment*"
    answers: ["naixement"]
    wrong_answers:
      - text: "naixeció"
        why: "De *néixer*, el nom habitual és *naixement*, no *naixeció*."
      - text: "naixença"
        why: "*Naixença* és femení (*la naixença*). Aquí «del» demana el masculí: *naixement*."
    grading: tolerant
    explanation: "«Del» demana un nom masculí. De *néixer* fem *naixement* amb *-ment*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-36-014
    type: fill
    point: derivacio-ada-esa
    lesson: 2
    prompt: "La ___ del museu atrau visitants de tot el món."
    hint: "RIC, nom en *-esa*"
    answers: ["riquesa"]
    wrong_answers:
      - text: "riqueza"
        why: "«Riqueza», amb *z*, és castellà. En català: *riquesa*."
      - text: "riquessa"
        why: "*Riquesa* s'escriu amb una sola *s*, no amb dues."
    grading: tolerant
    explanation: "De *ric* fem *riquesa* amb *-esa*: amb *qu* i una sola *s*."

  - id: b1-36-015
    type: fill
    point: derivacio-ada-esa
    lesson: 2
    prompt: "Vam fer una ___ pel passeig marítim al capvespre."
    hint: "PASSEJAR, nom en *-ada*"
    answers: ["passejada"]
    wrong_answers:
      - text: "passejament"
        why: "De *passejar*, el nom habitual és *passejada*, no *passejament*."
      - text: "passeig"
        why: "*Passeig* és masculí (*un passeig*). Aquí «una» demana el femení: *passejada*."
    grading: tolerant
    explanation: "«Una» demana un nom femení. De *passejar* fem *passejada* amb *-ada*."

  - id: b1-36-016
    type: fill
    point: derivacio-cio-ment
    lesson: 2
    prompt: "La ___ del llibre tindrà lloc a la biblioteca."
    hint: "PRESENTAR, nom en *-ció*"
    answers: ["presentació"]
    wrong_answers:
      - text: "presentament"
        why: "De *presentar*, el nom habitual és *presentació*, no *presentament*."
      - text: "presenta"
        why: "*Presenta* és el verb (*ell presenta*). Aquí cal el nom: *presentació*."
    grading: tolerant
    explanation: "«La» demana un nom femení. De *presentar* fem *presentació* amb *-ció*."

  - id: b1-36-017
    type: fill
    point: derivacio-cio-ment
    lesson: 2
    prompt: "El ___ de viatgers creix cada estiu a l'aeroport."
    hint: "MOURE, nom en *-ment*"
    answers: ["moviment"]
    wrong_answers:
      - text: "movició"
        why: "De *moure*, el nom habitual és *moviment*, no *movició*."
      - text: "mou"
        why: "*Mou* és el verb (*ell mou*). Després de *el* cal un nom: *moviment*."
    grading: tolerant
    explanation: "«El» demana un nom masculí. De *moure* fem *moviment* amb *-ment*."

  - id: b1-36-018
    type: fill
    point: derivacio-ada-esa
    lesson: 2
    prompt: "Amb la ___, l'àvia hi veu menys bé."
    hint: "VELL, nom en *-esa*"
    answers: ["vellesa"]
    wrong_answers:
      - text: "velleza"
        why: "«Velleza», amb *z*, és castellà. En català: *vellesa*, amb *ll* i *ss*."
      - text: "velleria"
        why: "El nom de *vell* és *vellesa*, no *velleria*."
    grading: tolerant
    explanation: "De *vell* fem *vellesa* amb *-esa*: amb *ll* i *ss*."

  - id: b1-36-019
    type: fill
    point: derivacio-cio-ment
    lesson: 2
    prompt: "El teu ___ d'internet ens anirà molt bé per al projecte."
    hint: "CONÈIXER, nom en *-ment*"
    answers: ["coneixement"]
    wrong_answers:
      - text: "coneixeció"
        why: "De *conèixer*, el nom habitual és *coneixement*, no *coneixeció*."
      - text: "coneixença"
        why: "*Coneixença* és femení. Aquí «el teu» demana el masculí: *coneixement*."
    grading: tolerant
    explanation: "«El teu» demana un masculí. De *conèixer* fem *coneixement* amb *-ment*."

  - id: b1-36-020
    type: order
    point: derivacio-ada-esa
    lesson: 2
    cue: "Digues que ahir vas fer una trucada llarga a la teva germana."
    chunks: ["ahir", "vaig fer", "una trucada", "llarga", "a la meva germana"]
    extra: ["trucament"]
    answers:
      - "Ahir vaig fer una trucada llarga a la meva germana."
      - "Vaig fer una trucada llarga a la meva germana ahir."
    explanation: "De *trucar* fem *trucada*. L'ordre és: temps, verb i complements."

  - id: b1-36-021
    type: order
    point: derivacio-cio-ment
    lesson: 2
    cue: "Digues que la presentació del disc nou serà demà a la tarda."
    chunks: ["la presentació", "del disc nou", "serà", "demà a la tarda"]
    extra: ["presentament"]
    answers:
      - "La presentació del disc nou serà demà a la tarda."
      - "Demà a la tarda serà la presentació del disc nou."
    explanation: "De *presentar* fem *presentació*, femení: *la presentació*. El temps va al final."

  - id: b1-36-022
    type: order
    point: derivacio-cio-ment
    lesson: 2
    cue: "Digues que el naixement del teu fill va ser a Girona."
    chunks: ["el naixement", "del meu fill", "va ser", "a Girona"]
    extra: ["naixença"]
    answers:
      - "El naixement del meu fill va ser a Girona."
      - "A Girona va ser el naixement del meu fill."
    explanation: "De *néixer* fem *naixement*, masculí: aquí cal *el*, no *la*."

  - id: b1-36-023
    type: choice
    point: derivacio-ada-esa
    lesson: 2
    prompt: "En entrar a l'estudi, la presentadora va dedicar una ___ amable als espectadors."
    answer: "mirada"
    distractors:
      - text: "mirament"
        why: "De *mirar*, el nom habitual és *mirada*, no *mirament*."
      - text: "miració"
        why: "De *mirar*, el nom habitual és *mirada*, no *miració*."
    explanation: "De *mirar* fem *mirada* amb *-ada*. «Una» demana un nom femení."

  - id: b1-36-024
    type: choice
    point: derivacio-ada-esa
    lesson: 2
    prompt: "La ___ del titular de portada va commoure tot l'estudi."
    answer: "tristesa"
    distractors:
      - text: "tristeza"
        why: "«Tristeza», amb *z*, és castellà. En català: *tristesa*, amb *ss*."
      - text: "tristetat"
        why: "El nom de *trist* és *tristesa*, no *tristetat*."
    explanation: "De *trist* fem *tristesa* amb *-esa*. S'escriu amb *ss*, no amb *z*."

  - id: b1-36-025
    type: choice
    point: derivacio-cio-ment
    lesson: 2
    prompt: "La ___ catalana de la sèrie sortirà a la tardor."
    answer: "traducció"
    distractors:
      - text: "traduïment"
        why: "De *traduir*, el nom habitual és *traducció*, no *traduïment*."
      - text: "tradueix"
        why: "*Tradueix* és el verb (*ell tradueix*). Aquí cal el nom: *traducció*."
    explanation: "De *traduir* fem el femení *traducció* amb *-ció*. «La» demana un nom."

  - id: b1-36-026
    type: choice
    point: derivacio-cio-ment
    lesson: 2
    prompt: "L'emissora prepara el ___ d'un pòdcast nou per a l'audiència jove."
    answer: "llançament"
    distractors:
      - text: "llançació"
        why: "De *llançar*, el nom habitual és *llançament*, no *llançació*."
      - text: "llança"
        why: "*Llança* és el verb (*ell llança*) o un nom femení. Aquí cal el masculí: *llançament*."
    explanation: "De *llançar* fem el masculí *llançament* amb *-ment*. «El» demana un masculí."

  # ---------------- Lliçó 3 ----------------
  - id: b1-36-027
    type: choice
    point: derivacio-isme-ista
    lesson: 3
    prompt: "La Carla escriu notícies per a un diari: és ___."
    answer: "periodista"
    distractors:
      - text: "periodisme"
        why: "*Periodisme* és la professió. La persona que escriu notícies és *periodista*."
      - text: "periodistessa"
        why: "La forma és *periodista* per a homes i dones: *periodistessa* no existeix."
    explanation: "La persona és *periodista* (el o la). *Periodisme* és el nom de la professió."

  - id: b1-36-028
    type: choice
    point: derivacio-isme-ista
    lesson: 3
    prompt: "L'Ibrahim veu el futur amb il·lusió: és un gran ___."
    answer: "optimista"
    distractors:
      - text: "optimisme"
        why: "*Optimisme* és l'actitud positiva. La persona és *optimista*."
      - text: "optimist"
        why: "En català la paraula acaba en *-a*: *optimista*."
    explanation: "La persona és *optimista*. L'actitud de veure el futur amb il·lusió és *l'optimisme*."

  - id: b1-36-029
    type: choice
    point: compte-castella
    lesson: 3
    prompt: "___! Comencem el programa d'avui amb les notícies."
    answer: "Bé"
    distractors:
      - text: "Bueno"
