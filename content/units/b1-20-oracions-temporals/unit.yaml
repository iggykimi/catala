  # ---------------- Lliçó 5 ----------------
  - id: b1-20-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un matí a l'oficina d'atenció"
    text: |
      La Fàtima s'ha traslladat a Mataró i vol entrar al padró: ha d'empadronar-se. Com que no té cita prèvia, arriba a l'oficina d'atenció a les vuit, abans que obrin. Quan obren la porta, agafa un tiquet i s'asseu a la sala d'espera.

      Mentre espera el seu torn, omple el formulari de sol·licitud. Li demanen el DNI, una fotocòpia del contracte de lloguer i el número de compte. Quan li falta una dada, truca a en Pau, que li envia una foto del contracte d'un moment a l'altre.

      Al cap d'una hora l'atenen: el funcionari la crida i revisa els papers. Li explica que hi falta la signatura. La Fàtima signa de seguida i paga una taxa de deu euros al taulell. El funcionari posa el segell al rebut i li diu que, quan tinguin la resolució, li enviaran una notificació al mòbil.

      Abans de marxar, la Fàtima demana un justificant. Surt de l'oficina a les deu, contenta: de mica en mica, va resolent tots els tràmits.
    questions:
      - prompt: "Per què va la Fàtima a l'oficina?"
        answer: "Per empadronar-se a Mataró, on viu ara."
        distractors:
          - text: "Per demanar cita prèvia per a un altre dia."
            why: "No en té: hi va directament a primera hora."
          - text: "Per recollir el certificat d'empadronament."
            why: "La resolució encara no hi és: li arribarà més tard."
      - prompt: "Què fa la Fàtima mentre espera el torn?"
        answer: "Omple el formulari i truca a en Pau per una dada."
        distractors:
          - text: "Paga la taxa de deu euros al taulell."
            why: "La paga després, quan l'atenen."
          - text: "Parla amb el funcionari del seu expedient."
            why: "El funcionari la crida al cap d'una hora."
      - prompt: "Quin problema hi ha amb els papers?"
        answer: "Hi falta la signatura de la Fàtima."
        distractors:
          - text: "Hi falta la fotocòpia del contracte."
            why: "La fotocòpia sí que la porta."
          - text: "No porta el número de compte."
            why: "El número de compte l'omple al formulari sense problemes."
      - prompt: "Com sabrà la Fàtima que ja té la resolució?"
        answer: "Li enviaran un avís al mòbil."
        distractors:
          - text: "El funcionari li trucarà d'un moment a l'altre."
            why: "«D'un moment a l'altre» és quan en Pau envia la foto."
          - text: "Haurà de tornar divendres a preguntar-ho."
            why: "No ha de tornar: l'avisaran."
    explanation: "El text explica com la Fàtima fa el tràmit d'empadronament en un matí."

