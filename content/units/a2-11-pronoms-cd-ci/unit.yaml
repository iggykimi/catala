  - id: a2-11-065
    type: reading
    point: pronoms-cd
    lesson: 5
    title: "Una festa sorpresa"
    text: |
      La Núria fa quaranta anys dissabte i els seus amics li preparen una festa sorpresa per celebrar-ho. En Pau convida vint amics i busca una sala al barri. La Carla compra el pastís i decora la sala. L'Ibrahim porta les begudes i la Montse prepara la música.

      La Núria no sap res. En Pau li diu que dissabte sopa amb ella en un restaurant, però és mentida: a les vuit la porta a la sala. Quan obre la porta, tots criden «Per molts anys!» i ella plora una mica.

      Després demana un desig i bufa les espelmes, i tothom canta. Brinden per la Núria amb les copes. Rep tres regals: un llibre, un ram de flors i una targeta llarga. Els obre i llegeix la targeta en veu alta. Tothom riu i després mengen pastís i ballen fins tard. «Em sap greu plorar —diu—, però no m'esperava res.»
    questions:
      - prompt: "Per què és una festa sorpresa?"
        answer: "La Núria no sap que els amics li preparen una festa."
        distractors:
          - text: "En Pau no sap que la Núria fa anys."
            why: "En Pau prepara la festa; qui no sap res és la Núria."
          - text: "Els amics no saben on és la sala."
            why: "En Pau busca la sala; sí que saben on és."
      - prompt: "Què fa en Pau dissabte a les vuit?"
        answer: "Porta la Núria a la sala de la festa."
        distractors:
          - text: "Sopa amb la Núria en un restaurant."
            why: "És el que li diu, però és mentida."
          - text: "Compra el pastís amb la Carla."
            why: "El pastís el compra la Carla tota sola."
      - prompt: "Què fa la Núria amb la targeta?"
        answer: "La llegeix en veu alta davant de tothom."
        distractors:
          - text: "L'escriu per als seus amics."
            why: "La targeta és un regal per a ella; ella la llegeix."
          - text: "L'obre abans dels altres regals."
            why: "Obre els tres regals i després llegeix la targeta."
      - prompt: "Per què plora la Núria?"
        answer: "Perquè no s'esperava la festa sorpresa."
        distractors:
          - text: "Perquè en Pau li diu una mentida."
            why: "La mentida és per portar-la a la festa; plora d'emoció."
          - text: "Perquè no li agraden els regals."
            why: "Plora perquè no s'esperava res, no pels regals."
    explanation: "Els amics preparen una festa sorpresa i la Núria s'emociona."
