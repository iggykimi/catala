  - id: a2-08-065
    type: reading
    point: imperfet-us
    lesson: 5
    title: "Els estius de la Núria"
    text: |
      La Núria va néixer a Barcelona, però cada estiu anava al poble dels avis, a la Garrotxa. La casa era vella i fresca, amb un hort gran al darrere. Cada matí la Núria ajudava l'avi a regar les tomaqueres i a donar menjar a les gallines. A la tarda nedava al riu amb els cosins o llegia contes a l'ombra d'un arbre.

      L'avi explicava històries de quan ell era jove. Deia que abans no hi havia cotxes al poble i tothom anava a peu. La Núria escoltava amb els ulls oberts.

      Un dia d'agost va perdre la bicicleta al bosc i va plorar molt. Però l'endemà el cosí gran va trobar la bicicleta darrere d'un pi. Encara avui, quan torna al poble, recorda aquell estiu.
    questions:
      - prompt: "On passava l'estiu la Núria?"
        answer: "Al poble dels avis, a la Garrotxa."
        distractors:
          - text: "A Barcelona, amb els pares."
            why: "Vivia a Barcelona. A l'estiu anava al poble."
          - text: "Al bosc, amb el cosí gran."
            why: "Va perdre la bicicleta al bosc. Vivia a casa dels avis."
      - prompt: "Què feia la Núria cada matí?"
        answer: "Ajudava l'avi amb l'hort i les gallines."
        distractors:
          - text: "Nedava al riu amb els cosins."
            why: "Nedava al riu a la tarda."
          - text: "Escoltava les històries de l'avi."
            why: "El text no diu quan explicava històries."
      - prompt: "Què va passar un dia d'agost?"
        answer: "Va perdre la bicicleta i va plorar."
        distractors:
          - text: "Va trobar una bicicleta darrere d'un pi."
            why: "El cosí va trobar la bicicleta l'endemà."
          - text: "No va voler nedar al riu."
            why: "Això no surt al text. Va perdre la bicicleta."
    explanation: "La Núria passava l'estiu al poble: ajudava l'avi, nedava al riu i un dia va perdre la bicicleta."
