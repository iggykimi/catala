    instruction: "Reescriu amb «Caldria que»."
    source: "M'hauries de respondre [[al més aviat possible]]."
    start: "Caldria que"
    answers: ["Caldria que em responguessis com més aviat millor."]
    wrong_answers:
      - text: "Caldria que em respons com més aviat millor."
        why: "Després de «caldria que» cal l'imperfet de subjuntiu: *responguessis*."
      - text: "Caldria que em respondries com més aviat millor."
        why: "Després de «caldria que» va el subjuntiu, no el condicional."
