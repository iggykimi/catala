  - id: b2-60-053
    type: reading
    point: comprensio
    lesson: 4
    title: "L'hort del barri"
    text: |
      Fa tres anys, un grup de veïns del barri de Gràcia va decidir recuperar un solar buit del carrer de la Riera. L'Ajuntament els va cedir el terreny per cinc anys i, amb l'ajuda d'una associació de Sant Andreu, hi van plantar l'hort comunitari que avui coneix tothom.

      Al principi, només eren vuit persones i no sabien gairebé res de pagesia. La Fàtima, que havia viscut en un poble de Lleida, els va ensenyar a preparar la terra i a fer els cavallons. En Pere, jubilat de seixanta-set anys, va muntar el sistema de reg amb materials reciclats. Cada dissabte al matí, de deu a una, obren la porta a tothom qui vulgui ajudar.

      Avui, l'hort té més de quaranta parcel·les i una llista d'espera de vint famílies. Cada família conrea la seva parcel·la i, un cop al mes, fan un dinar popular amb les verdures que han collit. També tenen un galliner amb sis gallines i un porxo on guarden les eines. El mes passat van collir vuitanta quilos de tomàquets i cinquanta de carabassons.

      La Montse, coordinadora del projecte, explica que l'èxit no són només les verdures. «Abans no coneixia els veïns de l'escala. Ara, cada setmana dinem plegats i ens ajudem amb els nens», diu. Les escoles del barri hi porten els alumnes un cop per trimestre. L'Ajuntament vol repetir l'experiència en dos solars més, al Clot i a Sants, i el grup de Gràcia assessorarà els nous horts. El pròxim dissabte faran una jornada de portes obertes per ensenyar l'hort.
    questions:
      - prompt: "Qui va ensenyar als veïns a preparar la terra?"
        answer: "Una veïna que sabia de pagesia perquè havia viscut a Lleida."
        distractors:
          - text: "En Pere, el jubilat que va muntar el sistema de reg."
            why: "En Pere va muntar el sistema de reg, no va ensenyar a preparar la terra."
          - text: "La Montse, la coordinadora del projecte."
            why: "La Montse coordina el projecte; qui ensenya a preparar la terra és la Fàtima."
      - prompt: "Quantes parcel·les té avui l'hort?"
        answer: "Més de quaranta, amb vint famílies en espera."
        distractors:
          - text: "Vuit parcel·les per a vuit persones."
            why: "Vuit eren les persones del principi, no les parcel·les d'avui."
          - text: "Quaranta parcel·les sense llista d'espera."
            why: "El text diu que hi ha una llista d'espera de vint famílies."
      - prompt: "Què fan amb les verdures que cullen?"
        answer: "Fan un dinar popular un cop al mes."
        distractors:
          - text: "Les venen al mercat del barri."
            why: "El text no diu que venguin res: fan un dinar popular."
          - text: "Les reparteixen entre les escoles."
            why: "Les escoles hi porten alumnes, però les verdures són per al dinar."
      - prompt: "Què vol fer l'Ajuntament?"
        answer: "Repetir l'experiència en dos solars més."
        distractors:
          - text: "Recuperar el solar del carrer de la Riera."
            why: "Aquest solar ja funciona com a hort; volen obrir-ne dos més."
          - text: "Tancar l'hort per manca de participants."
            why: "Al contrari: hi ha llista d'espera i l'experiència és un èxit."
    explanation: "El text explica com un hort comunitari de Gràcia ha passat de vuit veïns a més de quaranta parcel·les."

