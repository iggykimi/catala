  - id: b2-60-066
    type: reading
    point: comprensio
    lesson: 5
    title: "Una parella lingüística"
    text: |
      En Marc té trenta-quatre anys, és informàtic i fa dos anys que viu a Vic. Quan hi va arribar, entenia el català, però li feia vergonya parlar-lo: a la feina tothom li responia en castellà i, a poc a poc, va deixar d'intentar-ho.

      L'any passat, una companya li va parlar del programa de parelles lingüístiques del centre cultural. S'hi va apuntar sense gaire convicció i li van assignar la Teresa, una mestra jubilada de seixanta-vuit anys que volia practicar l'anglès. Van acordar de trobar-se cada dijous en un bar de la plaça i de parlar mitja hora en cada llengua.

      Al principi, en Marc només parlava del temps i de la feina, i la Teresa l'interrompia cada dos per tres per corregir-lo. Al cap de dos mesos, però, ja explicava pel·lícules senceres i discutia de futbol i de cinema sense por d'equivocar-se.

      «La Teresa no m'ensenya gramàtica: m'escolta i em fa repetir les frases fins que sonen bé», explica en Marc. Aquest curs s'ha apuntat a una acadèmia per preparar l'examen del nivell B2. La prova escrita no li fa por, però vol perdre la vergonya de l'expressió oral. La Teresa l'acompanyarà el dia de l'examen i, si aprova, ho celebraran amb un dinar a la costa.

      El programa té més de cent parelles a la ciutat i sempre busca voluntaris. Només cal tenir una hora lliure a la setmana i ganes de conversar. En Marc diu que, gràcies a la Teresa, ara parla català cada dia: amb els veïns, al mercat i, fins i tot, amb els companys de feina.
    questions:
      - prompt: "Per què en Marc va deixar de parlar català a la feina?"
        answer: "Perquè tothom li responia en castellà."
        distractors:
          - text: "Perquè no entenia el català."
            why: "El text diu que l'entenia, però li feia vergonya parlar-lo."
          - text: "Perquè els companys es reien d'ell."
            why: "El text no diu això: li responien en castellà."
      - prompt: "Com funcionen les trobades d'en Marc i la Teresa?"
        answer: "Cada dijous parlen mitja hora de cada llengua."
        distractors:
          - text: "Es troben cada dia al centre cultural."
            why: "Es troben cada dijous en un bar de la plaça."
          - text: "La Teresa li fa classes de gramàtica."
            why: "La Teresa no li ensenya gramàtica: el fa repetir les frases."
      - prompt: "Què vol aconseguir en Marc aquest curs?"
        answer: "Aprovar l'examen del nivell B2."
        distractors:
          - text: "Trobar una feina nova a Vic."
            why: "En Marc ja té feina: és informàtic."
          - text: "Ensenyar anglès a la Teresa."
            why: "La Teresa vol practicar l'anglès, però l'objectiu d'en Marc és el B2."
      - prompt: "Què necessita el programa de parelles lingüístiques?"
        answer: "Voluntaris amb una hora lliure a la setmana."
        distractors:
          - text: "Diners per pagar els professors."
            why: "El programa és de voluntaris, no de professors pagats."
          - text: "Un bar nou a la plaça."
            why: "Ja es troben en un bar; el que calen són voluntaris."
    explanation: "El text explica com una parella lingüística ha ajudat en Marc a perdre la vergonya de parlar català."
