id: b2-60
level: B2
title: "Repàs final: simulació de l'examen B2"
summary: "Els sis exercicis de gramàtica i vocabulari del model d'examen B2, amb contingut nou, i dues lectures de comprensió."
vocabulary_theme: "La vida quotidiana: barri, botigues i feina"
points:
  - id: lletres-que-falten
    title: "Exercici 1: lletres que falten"
    refs:
      - label: "GEIEC: L'ortografia"
        url: "https://geiec.iec.cat"
  - id: morfologia-nom-adjectiu
    title: "Exercici 2: morfologia del nom i de l'adjectiu"
    refs:
      - label: "GEIEC: El nom i l'adjectiu"
        url: "https://geiec.iec.cat"
  - id: paraula-adient
    title: "Exercici 3: la paraula adient"
    refs:
      - label: "GEIEC: Sintaxi i pronoms febles"
        url: "https://geiec.iec.cat"
  - id: transformacions
    title: "Exercici 4: transformacions"
    refs:
      - label: "GEIEC: L'estil indirecte"
        url: "https://geiec.iec.cat"
  - id: significat
    title: "Exercici 5: significat"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
  - id: derivacio
    title: "Exercici 6: derivació"
    refs:
      - label: "GEIEC: La formació de mots"
        url: "https://geiec.iec.cat"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Lletres que falten i morfologia"
  - title: "La paraula adient"
  - title: "Transformacions"
  - title: "Significat, derivació i lectura"
  - title: "Repàs final i lectura"
vocabulary:
  - word: "la fleca"
    definition: "Botiga on es fa i es ven el pa."
    example: "Compro el pa a la fleca del carrer Major."
  - word: "el taulell"
    definition: "Taula llarga d'una botiga on s'atenen els clients."
    example: "El flequer posa les barres al taulell."
  - word: "la llesca"
    definition: "Tall pla de pa, de formatge o d'embotit."
    example: "Esmorzo una llesca amb tomàquet i oli."
  - word: "el veí, la veïna"
    definition: "Persona que viu a prop teu, a la mateixa escala o barri."
    example: "Els veïns fan cua a la fleca cada matí."
  - word: "l'esmorzar"
    definition: "Primer àpat del dia, al matí."
    example: "L'esmorzar: una llesca amb tomàquet."
  - word: "l'autobús"
    definition: "Vehicle públic que fa un recorregut fix per la ciutat."
    example: "Agafo l'autobús de les vuit per anar a la feina."
  - word: "la parada"
    definition: "Lloc on l'autobús s'atura a recollir passatgers."
    example: "La parada nova està ben senyalitzada."
  - word: "el conductor, la conductora"
    definition: "Persona que mena un vehicle."
    example: "El conductor de l'autobús saluda tothom."
  - word: "el revisor, la revisora"
    definition: "Persona que comprova els bitllets al transport públic."
    example: "El revisor passa amb molta atenció."
  - word: "la biblioteca"
    definition: "Edifici on es deixen llibres i es pot estudiar."
    example: "Vaig a la biblioteca cada setmana."
  - word: "la bibliotecària, el bibliotecari"
    definition: "Persona que treballa en una biblioteca."
    example: "La bibliotecària sempre és molt amable."
  - word: "el carnet"
    definition: "Targeta que acredita que ets membre d'una cosa."
    example: "Si tens el carnet, pots entrar lliurement."
  - word: "la cantonada"
    definition: "Angle on es troben dos carrers."
    example: "Han obert un parc nou a la cantonada."
  - word: "el lloguer"
    definition: "Diners que es paguen cada mes per viure en un pis."
    example: "El lloguer d'aquest barri no és barat."
  - word: "la calçotada"
    definition: "Àpat popular on es mengen calçots fets a la brasa."
    example: "Dissabte fem una calçotada amb els veïns."
  - word: "el regal"
    definition: "Cosa que es dona a algú per celebrar alguna cosa."
    example: "Encara no li he donat el regal."
  - word: "l'enllaç"
    definition: "Combinació entre dos trens o autobusos per arribar enlloc."
    example: "Vam perdre l'enllaç i vam arribar tard."
  - word: "el jurat"
    definition: "Grup de persones que decideix qui guanya un concurs."
    example: "El jurat va tastar cada plat abans de votar."
  - word: "el concurs"
    definition: "Competició per triar el millor en alguna cosa."
    example: "El jurat del concurs va votar per unanimitat."
  - word: "el musclo"
    definition: "Marisc de closca fosca que viu agafat a les roques."
    example: "Per a la paella calen musclos de roca."
  - word: "la paella"
    definition: "Arròs cuinat amb peix, carn o verdures."
    example: "Fem paella els diumenges."
  - word: "el cometa"
    definition: "Astre amb cua que passa pel cel cada molts anys."
    example: "El cometa de Halley passa cada 76 anys."
  - word: "la samarreta"
    definition: "Peça de roba lleugera, sovint de màniga curta."
    example: "He comprat quatre samarretes vermelles."
  - word: "el mal de panxa"
    definition: "Dolor a la panxa, sovint per haver menjat massa."
    example: "Si menges tant, tindràs mal de panxa."
  - word: "el rebut"
    definition: "Paper que demostra que has pagat una cosa."
    example: "Fes-me el rebut del lloguer, si us plau."
  - word: "la contrasenya"
    definition: "Clau secreta per entrar a un ordinador o un compte."
    example: "Fes servir la meva contrasenya per entrar-hi."
  - word: "l'ordinador"
    definition: "Màquina per treballar, estudiar i comunicar-se."
    example: "Treballo amb aquest ordinador cada dia."
  - word: "el metge, la metgessa de guàrdia"
    definition: "Metge que atén les urgències fora de l'horari normal."
    example: "Si tens febre, truca al metge de guàrdia."
  - word: "les dades"
    definition: "Informacions concretes sobre un tema."
    example: "A partir de les dades, el preu baixarà."
  - word: "l'accident"
    definition: "Fet imprevist que causa danys."
    example: "Es va assabentar de l'accident per la ràdio."
items:
  - id: b2-60-001
    type: inline-choice
    point: lletres-que-falten
    lesson: 1
    title: "El pa de cada dia"
    text: "El pa és un aliment {b|v}àsic. Cada matí, al taulell de la fleca {h|∅}i ha barres acabades de fer i els {v|b}eïns fan cua. La Maria sempre tria el mateix: una llesca grui{x|ix}uda amb tomàquet, oli i sal. Diu que és el millor {e|a}smorzar del món."
    explanation: "*Bàsic* s'escriu amb *b*. *Hi ha* porta *h*. *Veí* s'escriu amb *v*. *Gruixut* porta *x*. *Esmorzar* comença amb *e*, com *escola*."

  - id: b2-60-002
    type: inline-choice
    point: lletres-que-falten
    lesson: 1
    title: "A l'autobús"
    text: "Ahir al matí vaig {a|e}gafar l'autobús de les vuit. La parada nova està ben {s|ss}enyalitzada i el condu{c|ç}tor saluda tothom. Els pa{ss|s}atgers pugen amb calma. Cal portar l'entrada a la mà: el revisor passa amb molta atenci{ó|o}."
    explanation: "*Agafar* comença amb *a*. *Senyalitzat* porta *s* inicial. *Conductor* s'escriu amb *c*. *Passatger* porta *ss*. *Atenció* porta accent, com les paraules en *-ció*."

  - id: b2-60-003
    type: inline-choice
    point: lletres-que-falten
    lesson: 1
    title: "Un cafè amb la veïna"
    text: "Aquesta tarda he pres un caf{è|é} amb la ve{ï|i}na. M'ha explicat que el seu fill estudia als Pa{ï|i}sos Baixos i que truca cada diumenge per tel{è|é}fon. Jo no sé {què|que} li diria, si fos ella: marxar tan lluny costa molt."
    explanation: "*Cafè* i *telèfon* porten accent obert. *Veïna* i *països* porten dièresi. *Què* amb accent és interrogatiu: *no sé què diria*."

  - id: b2-60-004
    type: inline-choice
    point: lletres-que-falten
    lesson: 1
    title: "Llibres i biblioteca"
    text: "La Laia llegeix una nove{l·l|ll}a cada setmana. La treu de la biblioteca del co{l·l|ll}egi on treballa. Diu que un bon llibre és i{m|mm}illorable per desconnectar. Quan acaba, e{n|m}via un missatge a la seva amiga per recomanar-li."
    explanation: "*Novel·la* i *col·legi* porten ela geminada. *Immillorable* s'escriu amb *mm*. Davant de *v*, la nasal és *n*: *envia*."

  - id: b2-60-005
    type: fill
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "Aquesta és una de les zones més ___ de la ciutat."
    hint: "TRANQUIL, adjectiu"
    answers: ["tranquil·les"]
    wrong_answers:
      - text: "tranquiles"
        why: "*Tranquil* fa el femení plural amb ela geminada: *tranquil·les*."
    grading: strict
    explanation: "«Zones» és femení plural: *tranquil·les*, amb ela geminada."

  - id: b2-60-006
    type: fill
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "Les ___ que treballen al jaciment són molt bones."
    hint: "ARQUEÒLEG, nom femení plural"
    answers: ["arqueòlogues"]
    wrong_answers:
      - text: "arqueòlegs"
        why: "«Les que treballen» és femení: cal el femení plural *arqueòlogues*."
      - text: "arqueòloges"
        why: "El femení de *-leg* és *-loga*: *arqueòloga*, plural *arqueòlogues*."
    grading: tolerant
    explanation: "És un nom femení plural: el femení de *arqueòleg* és *arqueòloga*, i el plural, *arqueòlogues*."

  - id: b2-60-007
    type: fill
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "Els ___ del barri tancaven cada diumenge."
    hint: "COMERÇ, nom masculí plural"
    answers: ["comerços"]
    wrong_answers:
      - text: "comerçs"
        why: "La *ç* passa a *c* davant de *o*: el plural de *comerç* és *comerços*."
    grading: strict
    explanation: "El plural de *comerç* és *comerços*: la *ç* es converteix en *c* davant de *o*."

  - id: b2-60-008
    type: fill
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "Van inaugurar una exposició de fotos ___ de la ciutat."
    hint: "ANTIC, adjectiu femení plural"
    answers: ["antigues"]
    wrong_answers:
      - text: "antiques"
        why: "*Antic* fa el femení amb *g*: *antiga*, plural *antigues*."
    grading: tolerant
    explanation: "«Fotos» és femení plural. *Antic* canvia la *c* per *g* en femení: *antigues*."

  - id: b2-60-009
    type: fill
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "L'actor principal va haver d'anar a tots els ___ de l'obra."
    hint: "ASSAIG, nom masculí plural"
    answers: ["assajos"]
    wrong_answers:
      - text: "assaigs"
        why: "Els noms en *-aig* fan el plural en *-ajos*: *assajos*."
    grading: tolerant
    explanation: "El plural de *assaig* és *assajos*: el grup *-aig* passa a *-aj-* davant de *o*."

  - id: b2-60-010
    type: fill
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "La teva mare em sembla una dona molt ___."
    hint: "ELEGANT, adjectiu femení singular"
    answers: ["elegant"]
    wrong_answers:
      - text: "eleganta"
        why: "*Elegant* és invariable: no canvia en femení."
      - text: "elegants"
        why: "«Una dona» és singular: *elegant*, sense *-s*."
    grading: tolerant
    explanation: "Els adjectius en *-ant* no canvien en femení: *elegant* serveix per a masculí i femení."

  - id: b2-60-011
    type: choice
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "___ de Halley passa a prop de la Terra cada 76 anys."
    answer: "El cometa"
    distractors:
      - text: "La cometa"
        why: "*La cometa* és l'estel de paper que vola amb el vent. L'astre és masculí: *el cometa*."
      - text: "Els cometes"
        why: "El cometa de Halley és un de sol: el subjecte és singular."
    explanation: "*Cometa* canvia de significat segons el gènere: *el cometa* és l'astre, *la cometa* és la joguina que vola."

  - id: b2-60-012
    type: choice
    point: morfologia-nom-adjectiu
    lesson: 1
    prompt: "El projecte va arribar a ___ sense cap problema."
    answer: "la fi"
    distractors:
      - text: "el fi"
        why: "*El fi* és l'objectiu, el propòsit («amb el fi de»). El final d'una cosa és *la fi*."
      - text: "les fins"
        why: "«El projecte» és singular: cal el singular *la fi*."
    explanation: "*La fi* és el final; *el fi* és l'objectiu. Aquí parlem del final del projecte: *la fi*."

  - id: b2-60-013
    type: match
    point: morfologia-nom-adjectiu
    lesson: 1
    instruction: "Relaciona cada masculí amb el seu femení."
    pairs:
      - ["actor", "actriu"]
      - ["poeta", "poetessa"]
      - ["metge", "metgessa"]
      - ["jutge", "jutgessa"]
      - ["arqueòleg", "arqueòloga"]
    explanation: "Són femenins irregulars que cal memoritzar: *actriu*, *poetessa*, *metgessa*, *jutgessa*, *arqueòloga*."

  - id: b2-60-014
    type: inline-choice
    point: paraula-adient
    lesson: 2
    title: "Un barri tranquil"
    text: "Han obert un parc nou a la cantonada. La Núria {hi|en|ho} porta els nens cada tarda. Al barri {hi|en|∅} ha molts comerços nous, i els veïns {en|hi|ho} parlen molt bé. El lloguer no és barat, {però|doncs|per tant} la zona és molt tranquil·la. {Per|Per a|En} cert, dissabte fem una calçotada: esteu convidats!"
    explanation: "*Hi* substitueix «al parc». *Hi ha* presenta una cosa nova. *En* substitueix «dels comerços» (*parlar-ne*). *Però* contrasta dues idees. *Per cert* introdueix un tema nou."

  - id: b2-60-015
    type: inline-choice
    point: paraula-adient
    lesson: 2
    title: "A la biblioteca"
    text: "La biblioteca {on|en què|que} vaig cada setmana és a deu minuts de casa. La bibliotecària {amb qui|amb què|amb la que} parlo sempre és molt amable. Quan {arribis|arribaràs|arribaries}, truca'm i hi anem junts. Si {tens|tinguis|tindries} el carnet, pots entrar lliurement. El llibre {que|què|el qual} busques és a la segona planta."
    explanation: "*On* indica el lloc on vas. Amb persones, *amb qui*. *Quan* amb futur demana subjuntiu: *arribis*. *Si* amb valor real demana indicatiu: *tens*. El complement directe de cosa és *que*."

  - id: b2-60-016
    type: inline-choice
    point: paraula-adient
    lesson: 2
    title: "Feina i plans"
    text: "Aquest regal és {per|per a|en} la Laia. Passarem {per|per a|en} Girona per anar a França. Vam suspendre l'excursió, {perquè|doncs|per tant} plovia molt. El tren va arribar tard; {per tant|perquè|ja que}, vam perdre l'enllaç. La Montse està malalta; {per això|perquè|ja que} no vindrà demà."
    explanation: "El destinatari és *per a la Laia*. El lloc de pas és *per Girona*. La causa és *perquè*; *doncs* no introdueix causes. La conseqüència és *per tant*. *Per això* reprèn la causa anterior."

  - id: b2-60-017
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "—Vas a la platja demà? —Sí, ___ vaig amb la Núria."
    answer: "hi"
    distractors:
      - text: "en"
        why: "*En* indica origen o part («en vinc», «en vull dos»). Anar a un lloc demana *hi*."
      - text: "ho"
        why: "*Ho* substitueix una idea, no un lloc. El lloc on vas és *hi*."
    explanation: "«A la platja» és el lloc on vas: el pronom és *hi*."

  - id: b2-60-018
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "—Tens germans? —Sí, ___ tinc dos."
    answer: "en"
    distractors:
      - text: "els"
        why: "Amb una quantitat («dos»), el pronom és *en*: *en tinc dos*."
      - text: "ho"
        why: "*Ho* substitueix una idea. Amb una quantitat, el pronom partitiu és *en*."
    explanation: "Amb una quantitat darrere, el pronom és *en*: *en tinc dos*."

  - id: b2-60-019
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "___ pocs dies, obriran la piscina nova del barri."
    answer: "D'aquí a"
    distractors:
      - text: "Des de fa"
        why: "*Des de fa* mira al passat («des de fa dos anys»). Aquí parlem del futur: *d'aquí a*."
      - text: "De mica en mica"
        why: "*De mica en mica* vol dir «a poc a poc». Per situar un fet en el futur: *d'aquí a*."
    explanation: "«Obriran» és futur: per dir quan passarà, *d'aquí a pocs dies*."

  - id: b2-60-020
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "La Laia no vindrà demà ___ està refredada."
    answer: "perquè"
    distractors:
      - text: "doncs"
        why: "*Doncs* no introdueix una causa. La causa és *perquè* o *ja que*."
      - text: "per tant"
        why: "*Per tant* introdueix una conseqüència, no una causa. Aquí la causa és que està refredada."
    explanation: "«Està refredada» és la causa: *perquè*."

  - id: b2-60-021
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "El metge li va dir que no ___ tant i que descansés."
    answer: "treballés"
    distractors:
      - text: "treballi"
        why: "Amb el verb principal en passat («va dir»), el subjuntiu va en imperfet: *treballés*."
      - text: "treballaria"
        why: "Després de «dir que» cal el subjuntiu, no el condicional: *treballés*."
    explanation: "Estil indirecte amb verb en passat: «dir que» + imperfet de subjuntiu, *treballés*."

  - id: b2-60-022
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "Si ___ més temps, hi aniria cada setmana."
    answer: "tingués"
    distractors:
      - text: "tindria"
        why: "Després de *si* no pot anar el condicional: *si tingués*."
      - text: "tinc"
        why: "Amb el condicional («aniria»), la condició és irreal: *si tingués*."
    explanation: "Condició irreal: *si* + imperfet de subjuntiu (*tingués*) + condicional (*aniria*)."

  - id: b2-60-023
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "És la persona ___ confio més de l'equip."
    answer: "en qui"
    distractors:
      - text: "en què"
        why: "*En què* és per a coses. Per a persones, darrere de preposició: *en qui*."
      - text: "que"
        why: "El verb és *confiar en*: cal mantenir la preposició, *en qui*."
    explanation: "*Confiar* regeix *en*, i «la persona» és una persona: *en qui*."

  - id: b2-60-024
    type: choice
    point: paraula-adient
    lesson: 2
    prompt: "M'alegro ___ hagis aprovat l'examen."
    answer: "que"
    distractors:
      - text: "de que"
        why: "La preposició cau davant de *que*: *m'alegro que*, sense *de*."
      - text: "perquè"
        why: "*Perquè* indica causa i demana indicatiu. *Alegrar-se* demana *que* + subjuntiu."
    explanation: "Davant de *que*, la preposició cau: *m'alegro que hagis aprovat*."

  - id: b2-60-025
    type: fill
    point: paraula-adient
    lesson: 2
    prompt: "Quan ___ a casa, truca'm i sopem junts."
    hint: "arribar, tu (futur)"
    answers: ["arribis"]
    wrong_answers:
      - text: "arribaràs"
        why: "*Quan* amb valor de futur demana subjuntiu: *arribis*."
      - text: "arribes"
        why: "El present (*arribes*) és per a hàbits. Per a un fet futur: *arribis*."
    grading: tolerant
    explanation: "*Quan* + futur demana el present de subjuntiu: *quan arribis*."

  - id: b2-60-026
    type: fill
    point: paraula-adient
    lesson: 2
    prompt: "No crec que la Laia ___ la resposta."
    hint: "saber, ella (subjuntiu)"
    answers: ["sàpiga"]
    wrong_answers:
      - text: "sap"
        why: "Després de «no crec que» cal el subjuntiu, no l'indicatiu."
      - text: "sabeixi"
        why: "*Saber* no és incoatiu: el subjuntiu és *sàpiga*."
    grading: tolerant
    explanation: "«No crec que» demana subjuntiu. El subjuntiu de *saber* és *sàpiga*."

  - id: b2-60-027
    type: transform
    point: transformacions
    lesson: 3
    instruction: "Passa a estil indirecte."
    source: "«[[Vindràs]] demà a la reunió?», em va preguntar en Jordi."
    start: "En Jordi em va preguntar si"
    answers: ["En Jordi em va preguntar si vindria l'endemà a la reunió."]
    wrong_answers:
      - text: "En Jordi em va preguntar si vindrà demà a la reunió."
        why: "En estil indirecte, el futur passa a condicional (*vindria*) i *demà* passa a *l'endemà*."
      - text: "En Jordi em va preguntar si vingués l'endemà a la reunió."
        why: "Després de «preguntar si» va l'indicatiu (*vindria*), no el subjuntiu."
    grading: tolerant
    explanation: "Pregunta indirecta en passat: el futur es converteix en condicional (*vindria*) i *demà* en *l'endemà*."

  - id: b2-60-028
    type: transform
    point: transformacions
    lesson: 3
    instruction: "Substitueix la part marcada per un pronom."
    source: "He comprat [[quatre samarretes vermelles]] i tres de grogues."
    answers: ["N'he comprat quatre de vermelles i tres de grogues.", "Jo n'he comprat quatre de vermelles i tres de grogues."]
