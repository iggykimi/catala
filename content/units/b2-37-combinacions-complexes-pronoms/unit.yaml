  - id: b2-37-066
    type: reading
    point: comprensio
    lesson: 5
    title: "Pau a l'escala del número 12"
    text: |
      Fa dos mesos, la convivència es va trencar a l'escala del número 12 del carrer Major. El llogater del quart va començar unes obres sense el permís d'obres: cada matí, a les set en punt, el soroll del martell despertava tot l'edifici, i la pols arribava fins al pati interior.

      La veïna del tercer, la Montse, va parlar amb ell dues vegades, però ell no li va fer cas. Aleshores la Montse se'n va anar a veure l'administrador de finques i li ho va explicar tot: el llogater incomplia l'horari de descans i, si no aturava les obres, posaria una queixa formal.

      El propietari del pis, que viu a Girona, també hi va intervenir. La Montse li ho va explicar per telèfon i ell va dir al llogater que o demanava el permís o se n'anava al carrer. El llogater va respondre que la fiança que havia pagat li donava dret a fer el que volgués.

      La setmana passada, el president de l'escala va convocar una reunió de veïns. Hi van anar gairebé tots, i l'ambient estava tens: el llogater deia que ningú no l'havia avisat de res, i la Montse deia que ningú no respectava les normes de convivència.

      Al final, amb l'ajuda de la Fàtima, una mediadora del barri, van arribar a un acord: el llogater demanaria el permís, faria les obres només de deu a una i pagaria la neteja del pati. La Montse, per la seva banda, no posaria cap queixa. La mediació va durar dues sessions. A més, van aprovar apujar la quota cinc euros per arreglar l'ascensor i van recordar que les mascotes no poden anar soles pel replà.

      «Hem après que parlar val més que cridar», va dir el president en tancar la reunió. I els dos veïns, que feia setmanes que no se saludaven, van fer les paus al replà.
    questions:
      - prompt: "Per què va començar el conflicte?"
        answer: "El llogater feia obres sorolloses sense tenir el permís."
        distractors:
          - text: "La Montse no pagava la quota de l'escala."
            why: "La quota només surt quan l'apugen per a l'ascensor."
          - text: "L'administrador no volia rebre la Montse."
            why: "L'administrador sí que la va rebre i la va escoltar."
      - prompt: "Què va fer la Montse abans de la reunió?"
        answer: "Va parlar amb el llogater, amb l'administrador i amb el propietari."
        distractors:
          - text: "Va posar una queixa formal contra el llogater."
            why: "Va amenaçar de posar-ne una, però no ho va fer."
          - text: "Va demanar al president que expulsés el llogater."
            why: "El text no diu que parlés amb el president: qui va dir al llogater que se n'anés va ser el propietari."
      - prompt: "Quin acord van prendre a la reunió?"
        answer: "El llogater regularitzaria les obres i la Montse no es queixaria."
        distractors:
          - text: "El llogater marxaria del pis i perdria la fiança."
            why: "El llogater es queda: només ha de demanar el permís i respectar l'horari."
          - text: "Apujarien la quota per pagar la mediació."
            why: "La quota apujada és per a l'ascensor, no per a la mediació."
      - prompt: "Com va acabar la reunió?"
        answer: "Els dos veïns es van reconciliar al replà."
        distractors:
          - text: "El llogater va prometre que marxaria del pis."
            why: "El llogater no marxa: van fer les paus."
          - text: "La Montse va decidir vendre el seu pis."
            why: "El text no diu res d'això."
    explanation: "El text explica un conflicte per unes obres sense permís i com els veïns el resolen amb una mediadora."
