id: b2-37
level: B2
title: "Combinacions complexes de pronoms"
summary: "Tres pronoms junts, les combinacions de pronoms febles, els verbs anar-se'n i endur-se i les dues maneres d'oblidar, en el context dels conflictes de veïns."
vocabulary_theme: "Conflictes, convivència i veïnat"
points:
  - id: tres-pronoms
    title: "Tres pronoms: l'ordre no canvia mai"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: combinacions-en-hi
    title: "*N'hi*, *li'n*, *l'hi* i *els en*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: pronominals
    title: "*Anar-se'n* i *endur-se*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-oblidar
    title: "Compte amb el castellà: *oblidar*"
    refs:
      - label: "Optimot: Oblidar"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions de conflicte i convivència"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Tres pronoms i combinacions amb en i hi"
  - title: "Practiquem les combinacions"
  - title: "Pronominals i oblidar"
  - title: "Produïm: reescrivim frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el veïnat"
    definition: "Tots els veïns d'una escala o d'un barri."
    example: "Tot el veïnat va anar a la reunió de dimarts."
  - word: "la convivència"
    definition: "Fet de viure juntes persones diferents amb respecte."
    example: "El soroll a la nit fa malbé la convivència."
  - word: "el conflicte"
    definition: "Desacord greu entre dues persones o dos grups."
    example: "Van resoldre el conflicte amb l'ajuda d'un mediador."
  - word: "la discussió"
    definition: "Conversa enfadada entre persones que no estan d'acord."
    example: "La discussió va començar per una plaça d'aparcament."
  - word: "la baralla"
    definition: "Discussió molt forta, sovint amb crits."
    example: "La baralla del replà es va sentir a tot l'edifici."
  - word: "el soroll"
    definition: "So fort o continuat que molesta."
    example: "El soroll de les obres comença a les vuit del matí."
  - word: "la queixa"
    definition: "Paraules amb què algú diu que una cosa el molesta."
    example: "La presidenta ha rebut tres queixes pel soroll."
  - word: "queixar-se"
    definition: "Acció de dir que una cosa molesta o no funciona bé."
    example: "Els veïns es queixen de l'olor del pati."
  - word: "la reunió de veïns"
    definition: "Trobada dels veïns per decidir coses de l'edifici."
    example: "A la reunió de veïns vam aprovar les obres."
  - word: "el president, la presidenta de l'escala"
    definition: "Veí que representa l'edifici i organitza les reunions."
    example: "El president de l'escala convoca la reunió cada tres mesos."
  - word: "l'administrador, l'administradora de finques"
    definition: "Professional que porta els papers i els diners d'un edifici."
    example: "L'administrador de finques ens ha enviat la quota."
  - word: "la quota"
    definition: "Diners que cada veí paga cada mes per a l'edifici."
    example: "La quota puja cinc euros per l'ascensor nou."
  - word: "l'acord"
    definition: "Decisió que prenen juntes dues o més persones."
    example: "Van arribar a l'acord de no fer soroll a la nit."
  - word: "la mediació"
    definition: "Ajuda d'una persona neutral per resoldre un conflicte."
    example: "La mediació del barri és gratuïta."
  - word: "el mediador, la mediadora"
    definition: "Persona que ajuda a resoldre un conflicte sense prendre partit."
    example: "La mediadora va escoltar les dues parts."
  - word: "el llogater, la llogatera"
    definition: "Persona que viu en un pis de lloguer."
    example: "El llogater del quart fa obres sense permís."
  - word: "el propietari, la propietària"
    definition: "Persona que té un pis o una casa."
    example: "La propietària viu a Girona i lloga el pis."
  - word: "el lloguer"
    definition: "Diners que es paguen cada mes per viure en un pis d'un altre."
    example: "El lloguer puja cada any una mica."
  - word: "la fiança"
    definition: "Diners que el llogater deixa al propietari en començar el lloguer."
    example: "En marxar, li van tornar la fiança."
  - word: "el replà"
    definition: "Espai de l'escala davant de la porta dels pisos."
    example: "Hem posat dues cadires al replà per a la reunió."
  - word: "el pati interior"
    definition: "Pati tancat entre edificis on donen finestres i balcons."
    example: "La pols de les obres arriba al pati interior."
  - word: "el terrat"
    definition: "Part de dalt de tot d'un edifici, a l'aire lliure."
    example: "El vent es va endur les cadires del terrat."
  - word: "el traster"
    definition: "Habitació petita on es guarden les coses que no es fan servir."
    example: "Les claus de recanvi són al traster."
  - word: "l'aparcament"
    definition: "Lloc on es deixen els cotxes."
    example: "No vaig poder sortir de l'aparcament."
  - word: "les obres"
    definition: "Feines per arreglar o canviar una casa o un edifici."
    example: "Les obres del quart comencen a les vuit."
  - word: "l'horari de descans"
    definition: "Hores del dia en què no es pot fer soroll."
    example: "L'horari de descans és de deu de la nit a vuit del matí."
  - word: "la mascota"
    definition: "Animal que viu amb una persona a casa seva."
    example: "La mascota dels veïns és un gos molt tranquil."
  - word: "el permís d'obres"
    definition: "Paper de l'ajuntament que permet fer obres."
    example: "Sense el permís d'obres, cal aturar-ho tot."
  - word: "incomplir"
    definition: "No fer una cosa que mana una norma o un acord."
    example: "Qui incompleix l'horari paga una multa."
  - word: "respectar"
    definition: "Tractar bé les persones i complir les normes."
    example: "Cal respectar el descans dels veïns."
  - word: "cedir"
    definition: "Renunciar a una part del que vols per arribar a un acord."
    example: "Tots van cedir una mica i van fer les paus."
  - word: "la norma de convivència"
    definition: "Regla que ajuda a viure bé amb els veïns."
    example: "Aparcar al lloc d'un altre incompleix les normes de convivència."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-37-001
    type: choice
    point: tres-pronoms
    lesson: 1
    prompt: "El meu fill gran ___ va anar a viure tot sol i la casa se'm fa gran."
    answer: "se me'n"
    distractors:
      - text: "me se'n"
        why: "*Es* va sempre primer: l'ordre és *se me'n*."
      - text: "se me en"
        why: "*Me* i *en* s'escriuen junts: *me'n*."
    explanation: "«El meu fill» + *anar-se'n* (*en*) + el datiu *me*: l'ordre és *se me'n*."

  - id: b2-37-002
    type: choice
    point: tres-pronoms
    lesson: 1
    prompt: "Tenia un lloc lliure per aparcar, però un cotxe ___ va ficar abans que jo."
    answer: "se m'hi"
    distractors:
      - text: "se me hi"
        why: "*Me + hi* s'apostrofa: *m'hi*."
      - text: "m'hi se"
        why: "*Es* va sempre primer: *se m'hi*."
    explanation: "*Ficar-se* (*se*) + el datiu *me* + el lloc lliure (*hi*): *se m'hi va ficar*."

  - id: b2-37-003
    type: choice
    point: combinacions-en-hi
    lesson: 1
    prompt: "—A qui dono els documents? —A la presidenta. ___ pots donar demà a la reunió."
    answer: "Els hi"
    distractors:
      - text: "Els els"
        why: "Amb una sola persona («la presidenta»), el datiu és *li*: *li + els* fa *els hi*."
      - text: "Li els"
        why: "*Li + els* no van separats: la forma és *els hi*."
    explanation: "«Els documents» (plural) + *li* (a la presidenta): *li + els* fa *els hi*."

  - id: b2-37-004
    type: choice
    point: combinacions-en-hi
    lesson: 1
    prompt: "—I als veïns del tercer, ja els heu dit que les obres comencen dilluns? —No, ___ diem demà a la reunió."
    answer: "els ho"
    distractors:
      - text: "els el"
        why: "«Que les obres comencen» és una idea, no una cosa: el pronom és *ho*."
      - text: "li ho"
        why: "*Li* és singular; «als veïns» és plural: *els ho*."
    explanation: "«Als veïns» (plural) → *els*; «que les obres comencen» (una idea) → *ho*."

  - id: b2-37-005
    type: choice
    point: combinacions-en-hi
    lesson: 1
    prompt: "—Heu portat cadires al replà? —Sí, ___ hem posat quatre per a la reunió."
    answer: "n'hi"
    distractors:
      - text: "hi'n"
        why: "No existeix *hi'n*: l'ordre és *en + hi*."
      - text: "en hi"
        why: "*En + hi* s'escriuen junts: *n'hi*."
    explanation: "«Quatre» (de cadires) → *en*; «al replà» → *hi*: *en + hi* fa *n'hi*."

  - id: b2-37-006
    type: choice
    point: combinacions-en-hi
    lesson: 1
    prompt: "—Els veïns ja tenen la còpia dels estatuts? —Sí, la presidenta ___ va donar ahir."
    answer: "els la"
    distractors:
      - text: "les la"
        why: "*Les* no és mai datiu plural; el datiu és *els*: *els la*."
      - text: "li la"
        why: "*Li* és singular; «els veïns» és plural: *els la*."
    explanation: "«Als veïns» (plural) → *els*; «la còpia» → *la*: *els la va donar*."

  - id: b2-37-007
    type: match
    point: tres-pronoms
    lesson: 1
    instruction: "Relaciona cada frase amb els pronoms que hi falten."
    pairs:
      - ["El meu fill ___ va anar a Madrid.", "se me'n"]
      - ["Tenia lloc per aparcar, però un cotxe ___ va ficar.", "se m'hi"]
      - ["El vendaval ___ va endur tot del terrat.", "se m'ho"]
      - ["El germà gran ___ va anar a Vic i el seu pare el troba a faltar.", "se li'n"]
    explanation: "L'ordre és sempre *es* + datiu + acusatiu o *en* o *hi*: *se me'n*, *se m'hi*, *se m'ho*, *se li'n*."

  - id: b2-37-008
    type: match
    point: combinacions-en-hi
    lesson: 1
    instruction: "Relaciona cada combinació amb la seva forma."
    pairs:
      - ["li + els", "els hi"]
      - ["li + en", "li'n"]
      - ["en + hi", "n'hi"]
      - ["els + la", "els la"]
      - ["el + hi", "l'hi"]
    explanation: "Les combinacions s'escriuen juntes: *els hi*, *li'n*, *n'hi*; amb datiu plural, *els* no canvia: *els la*."

  - id: b2-37-009
    type: inline-choice
    point: tres-pronoms
    lesson: 1
    title: "Notícies de l'escala"
    text: "La Maria ens ha explicat que el seu fill {se li'n|se me'n|li se'n} va anar a treballar a Alemanya. I a mi també m'han passat coses: ahir vaig trobar un lloc per aparcar, però un cotxe {se m'hi|se me hi|m'hi se} va ficar abans que jo. Amb el vendaval d'octubre, el vent {se m'ho|se me ho|m'ho se} va endur tot del meu terrat. I, per acabar-ho d'adobar, vaig deixar les sabatilles al replà i el gos del tercer {se me'n|me se'n|se m'en} va endur una."
    explanation: "Tres pronoms en ordre fix: *se li'n*, *se m'hi* (ficar-se, a mi, al lloc), *se m'ho* (endur-se, a mi, tot) i *se me'n* (endur-se'n, a mi, una)."

  - id: b2-37-010
    type: inline-choice
    point: combinacions-en-hi
    lesson: 1
    title: "Ordre del dia"
    text: "Els veïns no tenien la còpia dels estatuts: la presidenta {els la|les la|li la} va donar ahir. La Maria demanava rebuts: el tresorer {li'n|li en|en li} va donar dos. Faltaven cadires al replà: {n'hi|en hi|hi'n} vam posar dues. El llibre d'actes és a l'armari: {l'hi|la hi|li el} trobaràs demà al matí. A l'ordre del dia també hi ha el soroll del bar del pati interior i com fer respectar les normes de convivència."
    explanation: "«Als veïns + la còpia» → *els la*; «a la Maria + dos» → *li'n*; «dues + al replà» → *n'hi*; «el llibre + a l'armari» → *l'hi*."

  - id: b2-37-011
    type: fill
    point: tres-pronoms
    lesson: 1
    prompt: "—Com està la Montse? —El seu fill ___ va anar a Irlanda i està una mica trista."
    hint: "anar-se'n + datiu"
    answers: ["se li'n"]
    wrong_answers:
      - text: "li se'n"
        why: "L'ordre és fix: *es* va primer: *se li'n*."
      - text: "se l'hi"
        why: "*Anar-se'n* porta *en*, no *hi*: *se li'n*."
    grading: tolerant
    explanation: "«El seu fill» + *anar-se'n* (*en*) + *li* (a la Montse): *se li'n va anar*."

  - id: b2-37-012
    type: fill
    point: combinacions-en-hi
    lesson: 1
    prompt: "—Té els rebuts, la Maria? —Sí, el tresorer ___ va donar dos ahir."
    hint: "pronoms per a «a la Maria» + «dos»"
    answers: ["li'n", "n'hi"]
    wrong_answers:
      - text: "en li"
        why: "L'ordre és *li + en*: *li'n*."
    grading: tolerant
    explanation: "«A la Maria» → *li*; «dos» (de rebuts) → *en*: *li'n va donar dos* (en català central, també *n'hi*)."

  - id: b2-37-013
    type: order
    point: combinacions-en-hi
    lesson: 1
    cue: "Digues que donaràs els documents a la presidenta demà a la reunió."
    chunks: ["Els hi", "donaré", "demà", "a la reunió"]
    extra: ["li"]
    answers:
      - "Els hi donaré demà a la reunió."
      - "Demà a la reunió els hi donaré."
      - "Demà els hi donaré a la reunió."
      - "A la reunió els hi donaré demà."
    explanation: "«Els documents» + *li* (a la presidenta): *li + els* fa *els hi*."

  # ---------- Lliçó 2 ----------
  - id: b2-37-014
    type: fill
    point: tres-pronoms
    lesson: 2
    prompt: "El temporal ___ va endur tot del meu terrat."
    hint: "endur-se + datiu + ho"
    answers: ["se m'ho"]
    wrong_answers:
      - text: "se me ho"
        why: "*Me + ho* s'apostrofa: *m'ho*."
      - text: "m'ho se"
        why: "*Es* va primer: *se m'ho*."
    grading: tolerant
    explanation: "*Endur-se* (*se*) + *me* (a mi) + *ho* («tot»): *se m'ho va endur*."

  - id: b2-37-015
    type: fill
    point: tres-pronoms
    lesson: 2
    prompt: "—On para el teu germà? —___ va anar a viure a Sants amb uns amics."
    hint: "anar-se'n + datiu"
    answers: ["se me'n"]
    wrong_answers:
      - text: "me se'n"
        why: "*Es* va primer: *se me'n*."
      - text: "se m'en"
        why: "*Me + en* fa *me'n*."
    grading: tolerant
    explanation: "«El teu germà» + *anar-se'n* (*en*) + *me* (a qui respon): *se me'n va anar*."

  - id: b2-37-016
    type: fill
    point: combinacions-en-hi
    lesson: 2
    prompt: "—Ja heu posat cadires al replà? —Sí, ___ hem posat sis."
    hint: "pronoms per a «sis» + «al replà»"
    answers: ["n'hi"]
    wrong_answers:
      - text: "hi'n"
        why: "No existeix *hi'n*: l'ordre és *en + hi*."
      - text: "en hi"
        why: "*En + hi* s'escriuen junts: *n'hi*."
    grading: tolerant
    explanation: "«Sis» (de cadires) → *en*; «al replà» → *hi*: *n'hi hem posat sis*."

  - id: b2-37-017
    type: fill
    point: combinacions-en-hi
    lesson: 2
    prompt: "La circular nova és al tauler del replà: ___ veuràs en passar."
    hint: "pronoms per a «la circular» + «al tauler»"
    answers: ["la hi"]
    wrong_answers:
      - text: "l'hi"
        why: "«La circular» és femení: *la hi*."
      - text: "li la"
        why: "Aquí no hi ha cap persona (*li*); hi ha un lloc: *la hi*."
    grading: tolerant
    explanation: "«La circular» → *la*; «al tauler» → *hi*: *la hi veuràs*."

  - id: b2-37-018
    type: fill
    point: combinacions-en-hi
    lesson: 2
    prompt: "—Els veïns ja tenen la circular? —Sí, ___ aquest matí."
    hint: "pronoms per a «als veïns» + «la circular»; enviar, perfet"
    answers: ["els l'hem enviada", "els l'hem enviat"]
    wrong_answers:
      - text: "els la hem enviada"
        why: "Davant de vocal, *la* s'apostrofa: *els l'hem enviada*."
      - text: "les l'hem enviada"
        why: "El datiu plural és *els*, no *les*: *els l'hem enviada*."
    grading: tolerant
    explanation: "«Als veïns» → *els*; «la circular» → *la*, que davant de *hem* s'apostrofa: *els l'hem enviada*."

  - id: b2-37-019
    type: order
    point: tres-pronoms
    lesson: 2
    cue: "Explica que la teva filla va anar a viure a Girona."
    chunks: ["La meva filla", "se me'n", "va anar", "a Girona"]
    extra: ["me se'n"]
    answers:
      - "La meva filla se me'n va anar a Girona."
      - "A Girona la meva filla se me'n va anar."
    explanation: "*Anar-se'n* (*en*) + *me* (a mi): *se me'n va anar*."

  - id: b2-37-020
    type: order
    point: tres-pronoms
    lesson: 2
    cue: "Volies aparcar en un lloc lliure. Digues que un cotxe s'hi va ficar abans que tu."
    chunks: ["Un cotxe", "se m'hi", "va ficar", "abans que jo"]
    extra: ["se me hi"]
    answers:
      - "Un cotxe se m'hi va ficar abans que jo."
    explanation: "*Ficar-se* (*se*) + *me* (a mi) + *hi* (al lloc lliure): *se m'hi va ficar*."

  - id: b2-37-021
    type: order
    point: combinacions-en-hi
    lesson: 2
    cue: "La presidenta pregunta si posareu cadires al replà. Digues que demà n'hi posareu dues."
    chunks: ["N'hi", "posarem", "dues", "demà"]
    extra: ["en hi"]
    answers:
      - "N'hi posarem dues demà."
      - "Demà n'hi posarem dues."
    explanation: "«Dues» (de cadires) → *en*; «al replà» → *hi*: *n'hi posarem dues*."

  - id: b2-37-022
    type: choice
    point: tres-pronoms
    lesson: 2
    prompt: "La veïna del tercer està trista: el seu home ___ va anar de casa al gener."
    answer: "se li'n"
    distractors:
      - text: "li se'n"
        why: "*Es* va primer: *se li'n*."
      - text: "se l'hi"
        why: "*Anar-se'n* porta *en*, no *hi*: *se li'n*."
    explanation: "«El seu home» + *anar-se'n* (*en*) + *li* (a la veïna): *se li'n va anar*."

  - id: b2-37-023
    type: choice
    point: combinacions-en-hi
    lesson: 2
    prompt: "—Té còpies, la Maria? —Sí, l'administrador ___ va donar tres."
    answer: "li'n"
    distractors:
      - text: "li en"
        why: "*Li + en* s'escriuen junts: *li'n*."
      - text: "l'hi"
        why: "*L'hi* és *li + el*. «Tres» és una quantitat: cal *en*, *li'n*."
    explanation: "«A la Maria» → *li*; «tres» (de còpies) → *en*: *li'n va donar tres*."

  - id: b2-37-024
    type: choice
    point: combinacions-en-hi
    lesson: 2
    prompt: "—I el llogater, sap quan comencen les obres? —Sí, ___ hem dit aquest matí."
    answer: "li ho"
    distractors:
      - text: "li el"
        why: "«Quan comencen les obres» és una idea: *ho*, no *el*."
      - text: "els ho"
        why: "*Els* és plural; «el llogater» és singular: *li ho*."
    explanation: "«Al llogater» → *li*; «quan comencen les obres» (una idea) → *ho*."

  - id: b2-37-025
    type: choice
    point: tres-pronoms
    lesson: 2
    prompt: "—I en Pau, el propietari, què diu? —Que el llogater ___ va anar sense pagar el lloguer."
    answer: "se li'n"
    distractors:
      - text: "se li en"
        why: "*Li + en* s'escriuen junts: *li'n*."
      - text: "li se'n"
        why: "*Es* va primer: *se li'n*."
    explanation: "«El llogater» + *anar-se'n* (*en*) + *li* (a en Pau): *se li'n va anar*."

  - id: b2-37-026
    type: match
    point: combinacions-en-hi
    lesson: 2
    instruction: "Relaciona cada situació amb la combinació de pronoms."
    pairs:
      - ["tres rebuts per a la Maria", "li'n"]
      - ["quatre cadires al replà", "n'hi"]
      - ["els documents a la presidenta", "els hi"]
      - ["una còpia als veïns", "els la"]
      - ["trobar el llibre a l'armari", "l'hi"]
    explanation: "El datiu diu a qui (*li*, *els*); *en* substitueix una quantitat i *hi* un lloc: *li'n*, *n'hi*, *els hi*, *els la*, *l'hi*."

  # ---------- Lliçó 3 ----------
  - id: b2-37-027
    type: find-error
    point: pronominals
    lesson: 3
    sentence: "Avui me'n he anat aviat de la reunió de veïns."
    error: "me'n he"
    fix: "me n'he"
    fix_distractors:
      - text: "m'he"
