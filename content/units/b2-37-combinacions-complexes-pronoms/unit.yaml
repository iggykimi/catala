    text: "Veïns, recordeu: els acords de l'última reunió, la secretària {els els|els ho|li els} enviarà per correu. La porteria és oberta fins a les set: si voleu còpies en paper, {n'hi|hi'n|en hi} demaneu dues. La Maria encara no sap res de les obres: el president de l'escala {li ho|li el|els ho} explicarà tot demà. També parlarem de la quota de l'ascensor, de l'horari de descans i dels veïns que incompleixen els acords."
    explanation: "«Als veïns + els acords» → *els els*; «dues + a la porteria» → *n'hi*; «a la Maria + tot» → *li ho*."

