  # ---------- Lliçó 5 ----------
  - id: a2-09-053
    type: reading
    point: futur-simple
    lesson: 5
    title: "Un cap de setmana a Cadaqués"
    text: |
      La Carla i en Pau passen el cap de setmana a Cadaqués. Dijous hi va haver una tempesta amb trons i llamps, però ja ha passat. El pronòstic diu que dissabte farà sol i calor, i que diumenge el cel estarà tapat, amb núvols i potser pluja.

      Dissabte pensen anar a la platja al matí i fer un pícnic al migdia. A la tarda visitaran el poble i al vespre soparan en un restaurant de la plaça: ja han fet la reserva. A la nit hi haurà un concert a la plaça.

      Diumenge, si plou, no es mullaran: visitaran el museu i dinaran a casa. Si fa sol, aniran d'excursió pel camí de ronda.

      «Si tot va bé, tornarem diumenge a les vuit», diu la Carla. «Ja veurem què diu el cel demà al matí», respon en Pau.
    questions:
      - prompt: "Què faran dissabte al matí?"
        answer: "Aniran a la platja."
        distractors:
          - text: "Visitaran el museu."
            why: "El museu és el pla de diumenge, si plou."
          - text: "Faran un pícnic a la platja."
            why: "El pícnic és al migdia, no al matí."
      - prompt: "Què faran diumenge si plou?"
        answer: "Visitaran el museu i dinaran a casa."
        distractors:
          - text: "Aniran d'excursió pel camí de ronda."
            why: "L'excursió és el pla de diumenge si fa sol."
          - text: "Aniran al concert de la plaça."
            why: "El concert és dissabte a la nit."
      - prompt: "Quan pensen tornar?"
        answer: "Diumenge a les vuit."
        distractors:
          - text: "Dissabte a la nit."
            why: "Dissabte a la nit hi haurà el concert."
          - text: "Dissabte al matí."
            why: "Dissabte al matí aniran a la platja."
      - prompt: "On soparan dissabte?"
        answer: "En un restaurant de la plaça."
        distractors:
          - text: "A casa, amb els amics."
            why: "A casa dinaran diumenge, si plou."
          - text: "A la platja, amb el pícnic."
            why: "El pícnic és al migdia, no al vespre."
    explanation: "La Carla i en Pau passen el cap de setmana a Cadaqués, entre la platja i el museu."

