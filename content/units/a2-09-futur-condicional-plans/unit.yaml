id: a2-09
level: A2
title: "Futur, condicional i plans"
summary: "El futur simple, el condicional de cortesia (*voldria, podries*), els plans amb *pensar* + infinitiu i els futurs irregulars que no coincideixen amb el castellà."
vocabulary_theme: "El temps i els plans de cap de setmana"
points:
  - id: futur-simple
    title: "El futur: formes regulars i irregulars"
    refs:
      - label: "GEIEC: El futur"
        url: "https://geiec.iec.cat"
  - id: condicional-cortesia
    title: "El condicional de cortesia"
    refs:
      - label: "GEIEC: El condicional"
        url: "https://geiec.iec.cat"
  - id: plans-pensar-anar
    title: "Els plans: pensar i anar a + infinitiu"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: els futurs irregulars"
  - id: expressions
    title: "Expressions per parlar del futur"
lessons:
  - title: "El futur i els plans"
  - title: "Practiquem el futur"
  - title: "Cortesia i futurs difícils"
  - title: "Tots junts: produïm"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el pronòstic"
    definition: "Informació sobre el temps que farà."
    example: "El pronòstic diu que diumenge plourà."
  - word: "fer sol"
    definition: "Lluir el sol, sense núvols."
    example: "Demà farà sol a la costa."
  - word: "la pluja"
    definition: "Aigua que cau del cel."
    example: "Aquesta tarda vindrà la pluja."
  - word: "ploure"
    definition: "Caure aigua del cel."
    example: "Diu que plourà tot el cap de setmana."
  - word: "la neu"
    definition: "Aigua blanca que cau quan fa molt fred."
    example: "Aquest hivern hi haurà neu al Pirineu."
  - word: "nevar"
    definition: "Caure neu del cel."
    example: "Demà nevarà a la muntanya."
  - word: "el vent"
    definition: "Aire que es mou amb força."
    example: "Diumenge farà molt vent a la costa."
  - word: "el núvol"
    definition: "Massa grisa o blanca que tapa el sol."
    example: "Hi ha molts núvols, però no plourà."
  - word: "tapat, tapada"
    definition: "Dit del cel ple de núvols."
    example: "Demà el cel estarà tapat tot el dia."
  - word: "serè, serena"
    definition: "Dit del cel sense núvols."
    example: "Quin cel més serè farà dissabte!"
  - word: "la boira"
    definition: "Núvol baix que no deixa veure lluny."
    example: "Al matí hi haurà boira a Vic."
  - word: "la tempesta"
    definition: "Pluja forta amb trons i llamps."
    example: "Aquesta tarda vindrà una tempesta."
  - word: "el tro"
    definition: "Soroll fort d'una tempesta."
    example: "Els trons no em deixen dormir."
  - word: "el llamp"
    definition: "Llum forta d'una tempesta."
    example: "Els llamps fan por al gos."
  - word: "el paraigua"
    definition: "Objecte per no mullar-se quan plou."
    example: "Agafa el paraigua: plourà."
  - word: "la temperatura"
    definition: "Mesura de la calor o el fred."
    example: "La temperatura pujarà fins als vint graus."
  - word: "el grau"
    definition: "Unitat per mesurar la temperatura."
    example: "Demà arribarem als trenta graus."
  - word: "la calor"
    definition: "Temperatura alta de l'aire."
    example: "A l'agost fa molta calor a Lleida."
  - word: "el fred"
    definition: "Temperatura baixa de l'aire."
    example: "Aquest cap de setmana farà fred."
  - word: "mullar-se"
    definition: "Quedar ple d'aigua de la pluja."
    example: "Corre, que et mullaràs!"
  - word: "el cap de setmana"
    definition: "Dissabte i diumenge."
    example: "Aquest cap de setmana anirem a la platja."
  - word: "el pla"
    definition: "Cosa que penses fer."
    example: "Quins plans tens per a dissabte?"
  - word: "quedar"
    definition: "Trobar-se amb algú a una hora."
    example: "Dissabte quedaré amb la Laia."
  - word: "quedar-se"
    definition: "No sortir de casa o d'un lloc."
    example: "Si plou, ens quedarem a casa."
  - word: "el pícnic"
    definition: "Dinar a l'aire lliure."
    example: "Diumenge farem un pícnic al parc."
  - word: "l'excursió"
    definition: "Sortida a la muntanya o al camp."
    example: "Pensem anar d'excursió al Montseny."
  - word: "la platja"
    definition: "Vora del mar amb sorra."
    example: "Si fa sol, anirem a la platja."
  - word: "la muntanya"
    definition: "Lloc alt amb boscos i camins."
    example: "Diumenge pujarem a la muntanya."
  - word: "el concert"
    definition: "Música en directe davant del públic."
    example: "Dissabte hi haurà un concert a la plaça."
  - word: "el partit"
    definition: "Encontre entre dos equips."
    example: "Diumenge veurem el partit a casa."
  - word: "el museu"
    definition: "Lloc on es poden veure obres d'art."
    example: "Si plou, visitarem el museu."
  - word: "el passeig"
    definition: "Sortida curta per caminar."
    example: "A la tarda farem un passeig pel barri."
  - word: "la bicicleta"
    definition: "Vehicle de dues rodes."
    example: "Dissabte anirem amb bicicleta fins al riu."
  - word: "el bitllet"
    definition: "Paper per pujar al tren o a l'avió."
    example: "Compraré els bitllets per internet."
  - word: "la reserva"
    definition: "Plaça guardada en un restaurant o hotel."
    example: "Trucaré per fer la reserva."
  - word: "sopar"
    definition: "Menjar de la nit."
    example: "Diumenge soparem amb els avis."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-09-001
    type: choice
    point: futur-simple
    lesson: 1
    prompt: "Demà ___ sol tot el dia, diu el pronòstic."
    answer: "farà"
    distractors:
      - text: "va fer"
        why: "*Va fer* és passat. El pronòstic parla de demà: *farà*."
      - text: "fan"
        why: "«Fan» és plural. El temps és singular: *farà*."
    explanation: "El pronòstic parla de demà: futur. El futur de *fer* és irregular: *farà*."

  - id: a2-09-002
    type: choice
    point: futur-simple
    lesson: 1
    prompt: "Diu el pronòstic que diumenge ___ a la muntanya."
    answer: "nevarà"
    distractors:
      - text: "va nevar"
        why: "*Va nevar* és passat. Un pronòstic parla del futur: *nevarà*."
      - text: "nevaran"
        why: "*Nevar* aquí no té plural: *nevarà*."
    explanation: "Un pronòstic parla del futur. *Nevar* no té plural: *nevarà*."

  - id: a2-09-003
    type: choice
    point: futur-simple
    lesson: 1
    prompt: "Aquest cap de setmana ___ els avis a dinar."
    answer: "vindran"
    distractors:
      - text: "veniran"
        why: "*Venir* és irregular: *vindran*, no *veniran*."
      - text: "vindrà"
        why: "«Vindrà» és singular. «Els avis» és plural: *vindran*."
    explanation: "Un pla per al cap de setmana, en futur. *Venir* és irregular: *vindran* en plural."

  - id: a2-09-004
    type: choice
    point: futur-simple
    lesson: 1
    prompt: "Demà la Montse i jo ___ de casa a les vuit."
    answer: "sortirem"
    distractors:
      - text: "vam sortir"
        why: "*Vam sortir* és passat. «Demà» parla del futur: *sortirem*."
      - text: "sortiran"
        why: "«Sortiran» és «ells». El subjecte és «la Montse i jo»: *sortirem*."
    explanation: "El subjecte és «nosaltres». El futur de *sortir* és *sortirem*."

  - id: a2-09-005
    type: choice
    point: futur-simple
    lesson: 1
    prompt: "Si plou, jo ___ el paraigua gran."
    answer: "agafaré"
    distractors:
      - text: "agafiré"
        why: "El futur es fa amb l'infinitiu sencer: *agafar* + *é* = *agafaré*."
      - text: "agafaràs"
        why: "«Agafaràs» és «tu». El subjecte és «jo»: *agafaré*."
    explanation: "El subjecte és «jo» i és un pla: el futur de *agafar* és *agafaré*."

  - id: a2-09-006
    type: choice
    point: plans-pensar-anar
    lesson: 1
    prompt: "La Laia ___ anar a la platja dissabte."
    answer: "pensa"
    distractors:
      - text: "pensen"
        why: "«Pensen» és plural. «La Laia» és singular: *pensa*."
      - text: "pensar"
        why: "«Pensar» és infinitiu. El verb va conjugat: *pensa*."
    explanation: "«La Laia» és singular: *pensa*. Darrere va l'infinitiu: *anar*."

  - id: a2-09-007
    type: choice
    point: plans-pensar-anar
    lesson: 1
    prompt: "«Pensem quedar-nos a casa» vol dir que ___."
    answer: "ens quedarem a casa"
    distractors:
      - text: "som a casa ara"
        why: "Això és ara. «Pensem» parla d'un pla de futur."
      - text: "ens vam quedar a casa"
        why: "Això és passat. «Pensem» parla d'un pla de futur."
    explanation: "«Pensem» + infinitiu és un pla de futur: *ens quedarem*."

  - id: a2-09-008
    type: choice
    point: plans-pensar-anar
    lesson: 1
    prompt: "«Demà anem a dinar amb els avis» vol dir que ___."
    answer: "demà dinarem amb els avis"
    distractors:
      - text: "avui dinem amb els avis"
        why: "«Demà» és futur, no avui."
      - text: "ahir vam dinar amb els avis"
        why: "«Demà» és futur, no ahir."
    explanation: "«Anem a dinar» parla de demà: és un pla, com *dinarem*."

  - id: a2-09-009
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Què fareu si plou diumenge? —___. Ja ho decidirem dissabte."
    answer: "Ja veurem"
    distractors:
      - text: "Si tot va bé"
        why: "«Si tot va bé» vol dir «si no hi ha cap problema». Aquí encara no ho saben."
      - text: "D'aquí a una estona"
        why: "«D'aquí a una estona» diu quan. Aquí no diuen quan."
    explanation: "«Ja veurem» vol dir que ho decidiran més tard: dissabte."

  - id: a2-09-010
    type: match
    point: futur-simple
    lesson: 1
    instruction: "Relaciona cada forma de futur amb el seu infinitiu."
    pairs:
      - ["faré", "fer"]
      - ["aniré", "anar"]
      - ["tindré", "tenir"]
      - ["vindré", "venir"]
      - ["sabré", "saber"]
    explanation: "Són futurs irregulars: canvien l'arrel (*far-*, *anir-*, *tindr-*, *vindr-*, *sabr-*)."

  - id: a2-09-011
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["ja veurem", "ho decidirem més tard"]
      - ["com més aviat millor", "tot seguit, sense esperar"]
      - ["si tot va bé", "si no hi ha cap problema"]
      - ["d'aquí a una estona", "d'aquí a poc temps"]
    explanation: "Són quatre maneres de parlar del futur sense donar una hora exacta."

  - id: a2-09-012
    type: inline-choice
    point: futur-simple
    lesson: 1
    title: "El pronòstic del cap de setmana"
    text: "Dissabte {farà|ferà|fan} sol al matí, amb el cel serè, i la temperatura {pujarà|pujaran|pujirà} fins als vint graus. A la tarda {hi haurà|hi habrà|hi haverà} núvols a la muntanya. Diumenge {plourà|ploverà|plouran} a Girona i {farà|faran|ferà} vent a la costa."
    explanation: "El pronòstic va en futur: *farà*, *pujarà*, *hi haurà*, *plourà*. *Ferà*, *pujirà*, *hi habrà*, *hi haverà* i *ploverà* no existeixen."

  - id: a2-09-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «com més aviat millor»?"
    answer: "Que ho vols tot seguit, sense esperar."
    distractors:
      - text: "Que ho decidiràs més tard."
        why: "Això vol dir «ja veurem», no «com més aviat millor»."
      - text: "Que no saps quan ho vols."
        why: "Això és una indecisió. «Com més aviat millor» demana pressa."
    explanation: "«Com més aviat millor» demana una cosa sense esperar."

  # ---------- Lliçó 2 ----------
  - id: a2-09-014
    type: fill
    point: futur-simple
    lesson: 2
    prompt: "Segons el pronòstic, dissabte ___ molta calor a Lleida."
    hint: "fer, futur"
    answers: ["farà"]
    wrong_answers:
      - text: "va fer"
        why: "*Va fer* és passat. La pista demana el futur: *farà*."
      - text: "ferà"
        why: "*Fer* és irregular: *farà*, no *ferà*."
    grading: tolerant
    explanation: "Un pronòstic va en futur. *Fer* és irregular: *farà*, no *ferà*."

  - id: a2-09-015
    type: fill
    point: futur-simple
    lesson: 2
    prompt: "Diumenge ___ els cosins a dinar."
    hint: "venir, futur"
    answers: ["vindran"]
    wrong_answers:
      - text: "veniran"
        why: "*Venir* és irregular: *vindran*, no *veniran*."
      - text: "vindrà"
        why: "*Vindrà* és singular. «Els cosins» és plural: *vindran*."
    grading: tolerant
    explanation: "El futur de *venir* és irregular, i «els cosins» és plural: *vindran*."

  - id: a2-09-016
    type: fill
    point: futur-simple
    lesson: 2
    prompt: "Aquest estiu jo ___ tres setmanes de vacances."
    hint: "tenir, futur"
    answers: ["tindré"]
    wrong_answers:
      - text: "teneré"
        why: "*Teneré* és un calc de «tendré». En català: *tindré*."
      - text: "tindràs"
        why: "*Tindràs* és «tu». El subjecte és «jo»: *tindré*."
    grading: tolerant
    explanation: "El subjecte és «jo». El futur de *tenir* és *tindré*."

  - id: a2-09-017
    type: fill
    point: futur-simple
    lesson: 2
    prompt: "La Núria diu que demà no ___ venir a la feina: té metge."
    hint: "poder, futur"
    answers: ["podrà"]
    wrong_answers:
      - text: "poderà"
        why: "*Poder* és irregular: *podrà*, no *poderà*."
      - text: "podré"
        why: "*Podré* és «jo». «La Núria» és «ella»: *podrà*."
    grading: tolerant
    explanation: "«La Núria» és «ella». El futur de *poder* és *podrà*."

  - id: a2-09-018
    type: fill
    point: plans-pensar-anar
    lesson: 2
    prompt: "En Pau i jo ___ anar d'excursió al Montseny."
    hint: "pensar, present"
    answers: ["pensem"]
    wrong_answers:
      - text: "penseu"
        why: "«Penseu» és «vosaltres». El subjecte és «en Pau i jo»: *pensem*."
      - text: "pensar"
        why: "«Pensar» és infinitiu. El verb va conjugat: *pensem*."
    grading: tolerant
    explanation: "«En Pau i jo» és «nosaltres»: *pensem*. Darrere va l'infinitiu."

  - id: a2-09-019
    type: fill
    point: plans-pensar-anar
    lesson: 2
    prompt: "L'Ibrahim ___ quedar-se a casa tot el cap de setmana."
    hint: "pensar, present"
    answers: ["pensa"]
    wrong_answers:
      - text: "pensen"
        why: "«Pensen» és plural. «L'Ibrahim» és singular: *pensa*."
      - text: "penses"
        why: "«Penses» és «tu». El subjecte és «l'Ibrahim»: *pensa*."
    grading: tolerant
    explanation: "«L'Ibrahim» és singular: *pensa* + infinitiu."

  - id: a2-09-020
    type: fill
    point: condicional-cortesia
    lesson: 2
    prompt: "___ un cafè amb llet, si us plau."
    hint: "voler, condicional"
    answers: ["Voldria"]
    wrong_answers:
      - text: "Voleria"
        why: "*Voler* és irregular: *voldria*, no *voleria*."
      - text: "Vull"
        why: "«Vull» és present. Per demanar, el condicional és més educat."
    grading: tolerant
    explanation: "Per demanar amb educació fem servir el condicional: *voldria*."

  - id: a2-09-021
    type: order
    point: futur-simple
    lesson: 2
    cue: "Digues que demà aniràs a la platja amb en Pau."
    chunks: ["demà", "aniré", "a la platja", "amb en Pau"]
    extra: ["anaré"]
    answers:
      - "Demà aniré a la platja amb en Pau."
      - "Aniré a la platja amb en Pau demà."
      - "Demà aniré amb en Pau a la platja."
      - "Amb en Pau aniré a la platja demà."
    explanation: "El futur de *anar* és *aniré*, no *anaré*. «Demà» pot anar al principi o al final."

  - id: a2-09-022
    type: order
    point: futur-simple
    lesson: 2
    cue: "Digues que diumenge farà fred i us quedareu a casa."
    chunks: ["diumenge", "farà fred", "i", "ens quedarem", "a casa"]
    extra: ["quedarem-nos"]
    answers:
      - "Diumenge farà fred i ens quedarem a casa."
      - "Farà fred diumenge i ens quedarem a casa."
    explanation: "Amb el verb conjugat, el pronom va davant: *ens quedarem*. «Diumenge» pot canviar de lloc."

  - id: a2-09-023
    type: choice
    point: condicional-cortesia
    lesson: 2
    prompt: "Què dius per demanar el pa amb educació al restaurant?"
    answer: "Em podries portar el pa, si us plau?"
    distractors:
      - text: "Porta'm el pa ara mateix."
        why: "Això és una ordre, no una petició educada."
      - text: "Vull el pa, de pressa."
        why: "Això sona maleducat. El condicional és més educat."
    explanation: "Per demanar amb educació fem servir el condicional: *podries*."

  - id: a2-09-024
    type: choice
    point: condicional-cortesia
    lesson: 2
    prompt: "___ reservar taula per a quatre, si us plau."
    answer: "M'agradaria"
    distractors:
      - text: "M'agrada"
        why: "«M'agrada» és present. Per demanar, el condicional és més educat."
      - text: "M'agraden"
        why: "«M'agraden» és plural. «Reservar taula» és singular."
    explanation: "Per demanar amb educació: *m'agradaria* + infinitiu. És singular."

  - id: a2-09-025
    type: choice
    point: futur-simple
    lesson: 2
    prompt: "—Què farà demà a Olot? —Diu el pronòstic que ___ tot el dia."
    answer: "plourà"
    distractors:
      - text: "ploverà"
        why: "*Ploure* fa *plourà*, no *ploverà*."
      - text: "plouran"
        why: "*Ploure* aquí no té plural: *plourà*."
    explanation: "El pronòstic parla de demà: futur. *Ploure* fa *plourà*, sense plural."

  - id: a2-09-026
    type: inline-choice
    point: plans-pensar-anar
    lesson: 2
    title: "Missatge de la Carla"
    text: "Hola! Dissabte {pensem|pensen|pensar} anar a Sitges: diuen que {farà|ferà|fan} sol. Hem quedat a les nou a l'estació. {Vindràs|Veniràs|Vindran} amb nosaltres? Portarem el dinar i {tornarem|tornaran|tornàrem} a les vuit."
    explanation: "*Pensem* és «nosaltres». Els plans van en futur: *farà*, *vindràs* (irregular), *tornarem*."

  # ---------- Lliçó 3 ----------
  - id: a2-09-027
    type: choice
    point: condicional-cortesia
    lesson: 3
    prompt: "Perdoni, ___ dir on és l'estació?"
    answer: "em podria"
    distractors:
      - text: "em poderia"
        why: "*Poder* és irregular: *podria*, no *poderia*."
      - text: "em podrien"
        why: "*Podrien* és plural. «Perdoni» és per a una persona (vostè): *em podria*."
    explanation: "Amb «perdoni» parles de vostè. La petició educada és *em podria* + infinitiu."

  - id: a2-09-028
    type: choice
    point: condicional-cortesia
    lesson: 3
    prompt: "—Vols aigua? —Sí, ___ un got, gràcies."
    answer: "voldria"
    distractors:
      - text: "voleria"
        why: "*Voler* és irregular: *voldria*, no *voleria*."
      - text: "voldran"
        why: "«Voldran» és «ells». El subjecte és «jo»: *voldria*."
    explanation: "Per acceptar amb educació: *voldria*. És la forma de «jo»."

  - id: a2-09-029
    type: choice
    point: compte-castella
    lesson: 3
    prompt: "Diu el pronòstic que demà ___ tempesta a la tarda."
    answer: "hi haurà"
    distractors:
      - text: "hi habrà"
        why: "*Hi habrà* és un calc de «habrá». En català: *hi haurà*."
      - text: "hi va haver"
        why: "*Hi va haver* és passat. El pronòstic parla de demà."
    explanation: "El pronòstic parla de demà: futur. *Haver-hi* fa *hi haurà*, no *hi habrà*."

  - id: a2-09-030
    type: choice
    point: compte-castella
    lesson: 3
    prompt: "Si plou demà, ___ agafar el paraigua."
    answer: "caldrà"
    distractors:
      - text: "calerà"
        why: "*Caldre* és irregular: *caldrà*, no *calerà*."
      - text: "va caldre"
        why: "*Va caldre* és passat. «Si plou demà» parla del futur."
    explanation: "«Si plou demà» parla del futur. *Caldre* és irregular: *caldrà*."

  - id: a2-09-031
    type: fill
    point: condicional-cortesia
    lesson: 3
    prompt: "Perdoni, ___ dir-me a quina hora tanquen?"
    hint: "poder, condicional"
    answers: ["podria"]
    wrong_answers:
      - text: "poderia"
        why: "*Poder* és irregular: *podria*, no *poderia*."
      - text: "pot"
        why: "*Pot* és present. La pista demana el condicional: *podria*."
    grading: tolerant
