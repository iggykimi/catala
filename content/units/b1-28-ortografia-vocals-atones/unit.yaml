id: b1-28
level: B1
title: "Ortografia: les vocals àtones"
summary: "Aprens a escriure les vocals àtones a/e i o/u amb el truc de la família, les terminacions verbals i els mots que cal memoritzar."
vocabulary_theme: "Roba i botigues de roba"
points:
  - id: vocals-a-e
    title: "Les vocals àtones a/e: el truc de la família"
  - id: vocals-o-u
    title: "Les vocals àtones o/u: el truc de la família"
  - id: terminacions-memoria
    title: "Terminacions verbals i mots sense família"
  - id: compte-castella
    title: "Compte amb el castellà: vocals diferents"
  - id: expressions
    title: "Expressions de vestir"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Les vocals àtones: a/e i o/u"
  - title: "Practiquem el truc de la família"
  - title: "Verbs, interferències i memòria"
  - title: "Escrivim bé: tot junt"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la samarreta"
    definition: "Peça de roba de màniga curta que es porta a l'estiu."
    example: "M'he comprat una samarreta blanca per anar a la platja."
  - word: "els texans"
    definition: "Pantalons de tela forta de color blau, per a cada dia."
    example: "Els texans nous encara fan olor de botiga."
  - word: "la jaqueta"
    definition: "Peça de roba que es porta damunt de la camisa quan refresca."
    example: "Posa't la jaqueta: a la nit refresca."
  - word: "la faldilla"
    definition: "Peça de roba que va de la cintura cap avall."
    example: "La Carla porta una faldilla plisada grisa."
  - word: "la sabata"
    definition: "Calçat que tapa el peu fins al turmell."
    example: "Aquestes sabates fan mal als peus."
  - word: "l'emprovador"
    definition: "Cabina d'una botiga on et proves la roba."
    example: "L'emprovador del fons està lliure."
  - word: "la dependenta, el dependent"
    definition: "Persona que atén els clients en una botiga."
    example: "La dependenta m'ha portat una talla més gran."
  - word: "la rebaixa"
    definition: "Baixada del preu en un període de descomptes."
    example: "A les rebaixes de gener tot és més barat."
  - word: "el descompte"
    definition: "Rebaixa d'una part del preu."
    example: "Amb la targeta tens un deu per cent de descompte."
  - word: "el mocador"
    definition: "Peça de tela per mocar-se o per portar al coll."
    example: "L'àvia sempre porta un mocador a la butxaca."
  - word: "el cotonet"
    definition: "Tela fina de cotó per a camises d'estiu."
    example: "Aquesta camisa de cotonet és molt fresca."
  - word: "el cotó"
    definition: "Fibra blanca i suau amb què es fan moltes peces de roba."
    example: "Prefereixo els llençols de cotó."
  - word: "el polo"
    definition: "Samarreta amb coll i dos o tres botons."
    example: "En Jordi porta un polo blau marí."
  - word: "la bufanda"
    definition: "Peça llarga de roba per abrigar el coll."
    example: "A l'hivern no surto sense bufanda."
  - word: "l'abric"
    definition: "Peça llarga i gruixuda per protegir-se del fred."
    example: "Aquest abric pesa massa per viatjar."
  - word: "la botiga"
    definition: "Local on es venen productes."
    example: "La botiga del barri tanca a les vuit."
  - word: "la talla"
    definition: "Mida d'una peça de roba."
    example: "Quina talla fas de sabates?"
  - word: "el preu"
    definition: "Quantitat de diners que costa una cosa."
    example: "El preu de la jaqueta em sembla alt."
  - word: "la caixa"
    definition: "Lloc de la botiga on es paga."
    example: "Hi havia cua a la caixa."
  - word: "la llana"
    definition: "Fibra del pèl de les ovelles per a roba d'hivern."
    example: "Aquests mitjons de llana abriguen molt."
  - word: "la seda"
    definition: "Teixit fi i brillant, d'aspecte elegant."
    example: "El mocador de seda era de la meva àvia."
  - word: "la camisa"
    definition: "Peça de roba amb coll, botons i mànigues llargues."
    example: "Planxa la camisa abans de la reunió."
  - word: "la marca"
    definition: "Nom comercial d'un producte."
    example: "Aquesta marca catalana fa texans bons."
  - word: "el mirall"
    definition: "Vidre on et pots veure reflectit."
    example: "Mira't al mirall de l'emprovador."
  - word: "els pantalons"
    definition: "Peça de roba que cobreix les cames per separat."
    example: "Els pantalons negres combinen amb tot."
  - word: "el vestit"
    definition: "Peça d'una sola part, o conjunt de jaqueta i pantalons."
    example: "Es va comprar el vestit per al casament."
  - word: "els guants"
    definition: "Peça que cobreix cada dit de la mà per al fred."
    example: "M'he deixat els guants al calaix."
  - word: "el jersei"
    definition: "Peça de punt per abrigar el cos."
    example: "Aquest jersei verd és de la meva germana."
  - word: "el barret"
    definition: "Peça per cobrir el cap."
    example: "A l'estiu porto barret quan fa sol."
  - word: "la cremallera"
    definition: "Tanca de dues tires amb dents que s'uneixen."
    example: "La cremallera de la bossa no tanca."
  - word: "el cinturó"
    definition: "Tira que subjecta els pantalons a la cintura."
    example: "Et cal un cinturó amb aquests pantalons."
  - word: "la màniga"
    definition: "Part de la roba que cobreix el braç."
    example: "Aquesta camisa té les mànigues massa llargues."
  - word: "la butxaca"
    definition: "Bossa petita cosida a la roba per guardar-hi coses."
    example: "Porto les claus a la butxaca."
  - word: "els mitjons"
    definition: "Peça de punt que cobreix el peu."
    example: "Cada matí em poso mitjons nets."
  - word: "l'armilla"
    definition: "Peça sense mànigues que es porta damunt de la camisa."
    example: "Amb el fred, porta l'armilla de llana."
  - word: "la dessuadora"
    definition: "Jersei gruixut de cotó per fer esport."
    example: "Es posa la dessuadora per anar a córrer."
  - word: "les sabatilles"
    definition: "Calçat lleuger i còmode per caminar o fer esport."
    example: "Aquestes sabatilles van bé per caminar."
  - word: "el teixit"
    definition: "Tela feta entrellaçant fils."
    example: "M'agrada el teixit d'aquesta cortina."
  - word: "l'escot"
    definition: "Obertura de la roba a la part del coll."
    example: "Aquesta brusa té un escot discret."
  - word: "el vestidor"
    definition: "Sala on et canvies per fer esport."
    example: "Deixa la motxilla al vestidor del gimnàs."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-28-001
    type: choice
    point: vocals-a-e
    lesson: 1
    prompt: "Ahir vam ___ la càpsula al jardí de l'escola."
    answer: "enterrar"
    distractors:
      - text: "anterrar"
        why: "«Enterrar» és de la família de «terra»: la primera vocal és e."
      - text: "entarrar"
        why: "La segona vocal també és e: és de la família de «terra»."
      - text: "enterrer"
        why: "L'infinitiu d'aquest verb acaba en -ar, no en -er."
    explanation: "«Enterrar» és de la família de «terra» (amb e) i l'infinitiu acaba en -ar."

  - id: b1-28-002
    type: choice
    point: vocals-a-e
    lesson: 1
    prompt: "Els veïns ___ la castanyada amb castanyes torrades."
    answer: "festegen"
    distractors:
      - text: "festajen"
        why: "«Festejar» és de la família de «festa»: la primera vocal és e."
      - text: "festegan"
        why: "Amb «ells», la 3a del plural acaba en -en."
    explanation: "«Festejar» és de la família de «festa» (amb e) i «ells» acaba en -en."

  - id: b1-28-003
    type: choice
    point: vocals-o-u
    lesson: 1
    prompt: "Al magatzem hi ha molta ___."
    answer: "foscor"
    distractors:
      - text: "fuscor"
        why: "«Foscor» és de la família de «fosc»: la vocal àtona és o."
      - text: "foscur"
        why: "El sufix és -or, amb o: «foscor»."
    explanation: "«Foscor» és de la família de «fosc»: la vocal àtona és o."

  - id: b1-28-004
    type: choice
    point: vocals-o-u
    lesson: 1
    prompt: "Aquesta camisa és de ___, un teixit molt fresc."
    answer: "cotonet"
    distractors:
      - text: "cutonet"
        why: "«Cotonet» és de la família de «cotó»: la primera vocal és o."
      - text: "cotonut"
        why: "«Cotonet» és de la família de «cotó»: la segona vocal és o."
      - text: "cutunut"
        why: "«Cotonet» és de la família de «cotó»: les dues vocals són o."
    explanation: "«Cotonet» és de la família de «cotó»: les dues vocals àtones són o."

  - id: b1-28-005
    type: choice
    point: vocals-a-e
    lesson: 1
    prompt: "La porta no tanca: falta la ___."
    answer: "maneta"
    distractors:
