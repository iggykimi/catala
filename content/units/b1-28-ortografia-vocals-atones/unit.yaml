  # ---------------- Lliçó 3 ----------------
  - id: b1-28-027
    type: choice
    point: terminacions-memoria
    lesson: 3
    prompt: "La Marta ___ la roba al mercat cada dissabte."
    answer: "compra"
    distractors:
      - text: "compre"
        why: "Amb «la Marta» (3a singular), el verb acaba en -a."
      - text: "comprar"
        why: "Amb «la Marta» cal el verb conjugat, no l'infinitiu."
      - text: "compren"
        why: "«La Marta» és singular: el verb acaba en -a, no en -en."
    explanation: "Amb «la Marta» (3a singular), el verb acaba en -a: compra."

