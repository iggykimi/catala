        why: "La 3a del plural acaba en -en, no en -an."
      - text: "parla"
        why: "El subjecte és plural: el verb acaba en -en."
      - text: "parlar"
        why: "Amb «en Pere i la Laia» cal el verb conjugat, no l'infinitiu."
    explanation: "Amb un subjecte plural, la 3a persona acaba en -en: parlen."

