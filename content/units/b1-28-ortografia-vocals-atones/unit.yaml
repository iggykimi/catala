        why: "«Maneta» és de la família de «mà»: la primera vocal és a."
      - text: "manete"
        why: "La majoria dels noms femenins acaben en -a: «maneta»."
      - text: "menete"
        why: "«Maneta» és de la família de «mà» (amb a) i és femenina (acaba en -a)."
    explanation: "«Maneta» és de la família de «mà» (amb a) i és femenina (acaba en -a)."

  - id: b1-28-006
    type: match
    point: vocals-a-e
    lesson: 1
    instruction: "Relaciona cada mot amb el mot de la família on la vocal és tònica."
    pairs:
      - ["enterrar", "terra"]
      - ["festejar", "festa"]
      - ["blanquejar", "blanc"]
      - ["panet", "pa"]
    explanation: "Si la vocal és tònica, se sent si és a o e: terra, festa, blanc i pa."

  - id: b1-28-007
    type: inline-choice
    point: vocals-a-e
    lesson: 1
    title: "Una nota de la botiga"
    text: "Hola, Laia: han arribat les s{a|e}marretes noves, les j{a|e}quetes de primavera i un b{a|e}rret de palla. També tenim els t{e|a}xans rebaixats, les s{a|e}bates de taló i les f{a|e}ldilles de la nova col·lecció."
    explanation: "Samarretes, jaquetes, barret, sabates i faldilles s'escriuen amb a; texans (de Texas) amb e."

  - id: b1-28-008
    type: inline-choice
    point: vocals-o-u
    lesson: 1
    title: "Al magatzem"
    text: "Al magatzem hi ha molta f{o|u}scor. Hem desat el c{o|u}tonet blanc, els m{o|u}cadors de seda, les caixes de c{o|u}tó i els pol{o|u}s negres."
    explanation: "Foscor (de fosc), cotonet i cotó (de cotó), mocador (de moc) i polo s'escriuen amb o."

  - id: b1-28-009
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «anar de punt en blanc»?"
    answer: "Anar molt ben vestit."
    distractors:
      - text: "Anar vestit de blanc."
        why: "No té a veure amb el color blanc: vol dir anar elegant."
      - text: "Anar amb pressa."
        why: "La pressa no hi té res a veure: parla de com vas vestit."
    explanation: "«Anar de punt en blanc» vol dir anar molt elegant, amb la millor roba."

  - id: b1-28-010
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «vestir-se de diumenge»?"
    answer: "Posar-se la millor roba."
    distractors:
      - text: "Posar-se roba vella."
        why: "És al revés: vol dir posar-se la millor roba."
      - text: "Vestir-se només els diumenges."
        why: "No parla del dia: vol dir posar-se la millor roba."
    explanation: "«Vestir-se de diumenge» vol dir posar-se la millor roba."

