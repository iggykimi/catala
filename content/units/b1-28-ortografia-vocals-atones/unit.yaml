  - id: b1-28-065
    type: reading
    point: comprensio
    lesson: 5
    title: "Rebaixes al centre"
    text: |
      La Marta vol aprofitar les rebaixes d'hivern i dissabte al matí va al centre amb en Jordi, el seu germà. Primer entren en una botiga de roba jove, on la Marta es vol comprar uns texans i una samarreta de cotó. També es mira una camisa blanca de marca italiana al mirall de l'entrada. Es prova tres talles diferents a l'emprovador, però cap no li va bé: unes li són massa llargues i les altres, massa estretes. La dependenta, molt amable, li porta un altre model amb un vint per cent de descompte.

      Mentrestant, en Jordi mira les sabates de la segona planta. En troba unes de pell que li agraden, però valen noranta euros i decideix esperar fins a final de mes. La cremallera de la jaqueta vella ja no tanca, però la Marta no en compra cap de nova. Al final, la Marta es compra la samarreta, una bufanda de llana i un jersei verd, paga a la caixa i surt contenta de la botiga. En Jordi no compra res, però convida la seva germana a esmorzar en un bar de la plaça. Abans de marxar, acorden tornar-hi el mes que ve.
    questions:
      - prompt: "Què es vol comprar la Marta al principi?"
        answer: "Uns pantalons i una samarreta de cotó."
        distractors:
          - text: "Una bufanda de llana i un jersei verd."
            why: "Això és el que compra al final, no al principi."
          - text: "Unes sabates de pell de noranta euros."
            why: "Les sabates les mira en Jordi, no la Marta."
      - prompt: "Per què no li va bé cap talla dels texans?"
        answer: "Perquè li són llargs o estrets."
        distractors:
          - text: "Perquè no hi ha la seva talla."
            why: "Es prova tres talles: el problema és com li cauen."
          - text: "Perquè valen noranta euros."
            why: "Els noranta euros són de les sabates d'en Jordi."
      - prompt: "Què fa en Jordi a la botiga?"
        answer: "Mira el calçat de la segona planta, però no s'emporta res."
        distractors:
          - text: "Es compra unes sabates de pell de noranta euros."
            why: "Li agraden, però decideix esperar fins a final de mes."
          - text: "Es prova tres talles diferents a l'emprovador."
            why: "Qui es prova talles és la Marta, no en Jordi."
      - prompt: "Què compra la Marta al final?"
        answer: "La samarreta, la bufanda i el jersei."
        distractors:
          - text: "Els texans amb un vint per cent de descompte."
            why: "Els texans no li van bé: no els compra."
          - text: "Una jaqueta nova amb cremallera."
            why: "La cremallera és de la jaqueta vella, i no en compra cap de nova."
    explanation: "La Marta aprofita les rebaixes per comprar roba, i en Jordi no compra res, però la convida a esmorzar."
