id: b2-58
level: B2
title: "Sinònims, antònims i parònims"
summary: "Paraules que s'assemblen (parònims), paraules que diuen el mateix (sinònims) i contraris amb prefixos, en el context de la tecnologia."
vocabulary_theme: "Tecnologia i món digital"
points:
  - id: paronims-propers
    title: "Parònims propers"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: sinonims
    title: "Sinònims per variar el text"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: antonims-prefixos
    title: "Antònims amb prefixos"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: compte-paronims
    title: "Compte amb el castellà: parònims que no coincideixen"
    refs:
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions per parlar clar"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Parònims propers (I)"
  - title: "Parònims i sinònims en context"
  - title: "Antònims i parònims del castellà"
  - title: "Produir: reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'ordinador"
    definition: "Aparell electrònic per treballar, estudiar i comunicar-se."
    example: "He de portar l'ordinador a reparar."
  - word: "el portàtil"
    definition: "Ordinador petit que es pot transportar fàcilment."
    example: "Treballo amb el portàtil des de casa."
  - word: "la tauleta"
    definition: "Aparell pla i tàctil, més gran que un mòbil."
    example: "La Laia llegeix els diaris a la tauleta."
  - word: "el mòbil"
    definition: "Telèfon petit que es porta a sobre."
    example: "M'he deixat el mòbil a l'oficina."
  - word: "la pantalla"
    definition: "Superfície on es veuen les imatges d'un aparell."
    example: "Aquesta pantalla és massa petita per treballar."
  - word: "la contrasenya"
    definition: "Paraula secreta per entrar en un compte."
    example: "Canvia la contrasenya cada tres mesos."
  - word: "el compte"
    definition: "Espai personal en un servei d'internet."
    example: "M'he creat un compte nou per a la feina."
  - word: "la sessió"
    definition: "Temps que passes dins d'un compte obert."
    example: "Tanca la sessió quan acabis."
  - word: "el navegador"
    definition: "Programa per visitar pàgines web."
    example: "Aquest navegador va molt de pressa."
  - word: "l'enllaç"
    definition: "Text o imatge que et porta a una altra pàgina."
    example: "T'he enviat l'enllaç de la reunió."
  - word: "el correu electrònic"
    definition: "Sistema per enviar missatges per internet."
    example: "T'he escrit un correu electrònic amb els detalls."
  - word: "l'adjunt"
    definition: "Fitxer que acompanya un missatge."
    example: "No puc obrir l'adjunt del teu missatge."
  - word: "la safata d'entrada"
    definition: "Lloc on arriben els missatges nous."
    example: "Tens deu missatges a la safata d'entrada."
  - word: "el correu brossa"
    definition: "Missatges de publicitat que no has demanat."
    example: "Esborra el correu brossa cada setmana."
  - word: "el fitxer"
    definition: "Conjunt de dades desades amb un nom."
    example: "Aquest fitxer és massa gran per enviar-lo."
  - word: "la carpeta"
    definition: "Espai on es guarden fitxers ordenats."
    example: "Desa el document a la carpeta del projecte."
  - word: "desar"
    definition: "Conservar un document perquè no es perdi."
    example: "Desa els canvis abans de tancar el programa."
  - word: "descarregar"
    definition: "Baixar un fitxer d'internet a l'aparell."
    example: "He descarregat l'aplicació nova."
  - word: "carregar"
    definition: "Transmetre dades a internet o donar energia a un aparell."
    example: "Aquesta pàgina triga molt a carregar."
  - word: "la còpia de seguretat"
    definition: "Còpia de les dades per si es perden."
    example: "Fes una còpia de seguretat cada setmana."
  - word: "el núvol"
    definition: "Espai d'internet on es desen dades."
    example: "Tinc les fotos al núvol."
  - word: "les dades"
    definition: "Informació que rep o guarda un aparell."
    example: "Aquesta aplicació demana massa dades personals."
  - word: "la data"
    definition: "Dia del calendari."
    example: "Quina és la data de la reunió?"
  - word: "la privadesa"
    definition: "Dret que la informació personal no es difongui."
    example: "La privadesa a internet és molt important."
  - word: "l'antivirus"
    definition: "Programa que elimina els virus."
    example: "Actualitza l'antivirus cada mes."
  - word: "la xarxa"
    definition: "Sistema d'aparells connectats entre ells."
    example: "La xarxa de l'hotel no funciona."
  - word: "el wifi"
    definition: "Xarxa sense fils per connectar-se a internet."
    example: "El wifi de casa va molt lent."
  - word: "la bateria"
    definition: "Peça que dona energia a un aparell."
    example: "La bateria del mòbil dura poc."
  - word: "actualitzar"
    definition: "Posar la versió més nova d'un programa."
    example: "Has d'actualitzar l'aplicació."
  - word: "instal·lar"
    definition: "Posar un programa en un aparell."
    example: "M'han instal·lat un programa nou a la feina."
  - word: "l'aplicació"
    definition: "Programa petit, sovint per al mòbil."
    example: "Aquesta aplicació va molt bé per aprendre idiomes."
  - word: "el sistema operatiu"
    definition: "Programa principal que fa funcionar l'aparell."
    example: "Aquest sistema operatiu és molt vell."
  - word: "reiniciar"
    definition: "Tancar i tornar a engegar un aparell."
    example: "Prova de reiniciar l'ordinador."
  - word: "la videotrucada"
    definition: "Trucada en què també es veu la imatge."
    example: "Tenim una videotrucada a les nou."
  - word: "la notificació"
    definition: "Avís que envia una aplicació."
    example: "M'ha arribat una notificació del banc."
  - word: "trametre"
    definition: "Enviar (formal)."
    example: "Us trameto el contracte per correu."
  - word: "compartir"
    definition: "Deixar que altres vegin o facin servir una cosa."
    example: "No comparteixis la contrasenya amb ningú."
  - word: "l'usuari, la usuària"
    definition: "Persona que fa servir un servei."
    example: "Cada usuari té la seva contrasenya."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-58-001
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "Aquest antivirus és molt ___: detecta tots els virus."
    answer: "eficaç"
    distractors:
      - text: "eficient"
        why: "*Eficient* vol dir que gasta pocs recursos. Aquí el que importa és que aconsegueix l'efecte: és *eficaç*."
      - text: "deficient"
        why: "*Deficient* vol dir que té defectes. Aquest antivirus funciona bé: és *eficaç*."
    explanation: "«Detecta tots els virus» vol dir que aconsegueix l'efecte desitjat: és *eficaç*."

  - id: b2-58-002
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "Aquest programa és molt ___: fa la feina amb molt poca memòria."
    answer: "eficient"
    distractors:
      - text: "eficaç"
        why: "*Eficaç* vol dir que aconsegueix l'efecte. Aquí es destaca que gasta pocs recursos: és *eficient*."
      - text: "exigent"
        why: "*Exigent* vol dir que demana molt. Aquest programa demana poca memòria: és *eficient*."
    explanation: "«Amb molt poca memòria» parla dels recursos que gasta: és *eficient*."

  - id: b2-58-003
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "Què vol dir «una persona eficaç»?"
    answer: "Una persona que aconsegueix el que es proposa."
    distractors:
      - text: "Una persona que treballa amb pocs recursos."
        why: "Això és una persona *eficient*, no *eficaç*."
      - text: "Una persona que fa moltes coses alhora."
        why: "Fer moltes coses alhora no és el sentit del mot *eficaç*."
    explanation: "*Eficaç* vol dir que aconsegueix l'efecte desitjat."

  - id: b2-58-004
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "Per atendre el públic cal una bona ___."
    answer: "actitud"
    distractors:
      - text: "aptitud"
        why: "*Aptitud* és una capacitat (per als idiomes, per a la música). Aquí es parla de la manera de tractar la gent."
      - text: "altitud"
        why: "*Altitud* és l'altura sobre el mar. No hi té cap sentit."
    explanation: "«Atendre el públic» demana una manera de comportar-se: *actitud*."

  - id: b2-58-005
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "La Fàtima té una gran ___ per als idiomes."
    answer: "aptitud"
    distractors:
      - text: "actitud"
        why: "*Actitud* és la manera de comportar-se. Aquí es parla d'una capacitat: *aptitud*."
      - text: "longitud"
        why: "*Longitud* és la mida d'una cosa llarga. No hi té cap sentit."
    explanation: "«Per als idiomes» parla d'una capacitat: *aptitud*."

  - id: b2-58-006
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "___ les normes del fòrum té conseqüències greus."
    answer: "Infringir"
    distractors:
      - text: "Infligir"
        why: "*Infligir* és causar (un càstig, un dolor). Les normes no es causen: s'incompleixen."
      - text: "Influir"
        why: "*Influir* vol dir tenir efecte sobre algú, i demana la preposició *en*."
    explanation: "Les normes s'incompleixen: *infringir*. *Infligir* és causar un càstig."

  - id: b2-58-007
    type: choice
    point: paronims-propers
    lesson: 1
    prompt: "El jutge li va ___ una multa molt alta."
    answer: "infligir"
    distractors:
      - text: "infringir"
        why: "El verb *infringir* porta una norma darrere. Una multa es causa: el verb és *infligir*."
      - text: "infringit"
        why: "Després de *va* cal l'infinitiu, no el participi."
    explanation: "Una multa es causa o s'imposa: *infligir*."

  - id: b2-58-008
    type: match
    point: sinonims
    lesson: 1
    instruction: "Relaciona cada verb amb un sinònim."
    pairs:
      - ["triar", "escollir"]
      - ["començar", "iniciar"]
      - ["utilitzar", "fer servir"]
      - ["esborrar", "eliminar"]
      - ["enviar", "trametre"]
    explanation: "Són parells de sinònims: en el context adequat es poden intercanviar."

  - id: b2-58-009
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["dir les coses pel seu nom", "dir la veritat sense eufemismes"]
      - ["no és el mateix", "dues coses semblants que cal no confondre"]
      - ["amb pèls i senyals", "amb tots els detalls"]
      - ["posar blanc sobre negre", "escriure un acord perquè quedi clar"]
    explanation: "Són expressions per parlar amb precisió."

  - id: b2-58-010
    type: inline-choice
    point: sinonims
    lesson: 1
    title: "Missatge al suport tècnic"
    text: "Hola: m'he comprat un portàtil nou. He comparat deu models i he {triat|tret|traït} el més lleuger. El dependent em va {assegurar|assegurat|asseguren} que la bateria dura deu hores. A casa no puc {obrir|obrint|obert} els adjunts del correu electrònic i el programa em recomana {esborrar|esborrany|recuperar} els fitxers temporals. A la safata d'entrada tinc deu missatges sense llegir. Em podeu ajudar?"
    explanation: "He *triat* (= *escollit*) un model; el dependent em va *assegurar* (= *dir, afirmar*) que la bateria dura; no puc *obrir* els adjunts; em recomana *esborrar* (= *eliminar*) els temporals."

  - id: b2-58-011
    type: fill
    point: paronims-propers
    lesson: 1
    prompt: "Els meteoròlegs ___ pluja per al cap de setmana."
    hint: "PREVEURE, present"
    answers: ["preveuen"]
    wrong_answers:
      - text: "prevenen"
        why: "*Prevenen* és de *prevenir*: prendre mesures contra una amenaça. La pluja no es pot impedir: es preveu."
    grading: tolerant
    explanation: "Els meteoròlegs anuncien el que vindrà: *preveure*. *Prevenir* seria impedir-ho."

  - id: b2-58-012
    type: fill
    point: sinonims
    lesson: 1
    prompt: "Aquest programa ___ molta memòria."
    hint: "FER SERVIR, present"
    answers: ["fa servir"]
    wrong_answers:
      - text: "fan servir"
        why: "El subjecte («aquest programa») és singular: *fa servir*."
    grading: tolerant
    explanation: "«Aquest programa» és singular: *fa servir*, sinònim de *utilitza*."

  - id: b2-58-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «dir-ho amb totes les lletres»?"
    answer: "Dir una cosa delicada obertament, sense amagar res."
    distractors:
      - text: "Escriure un text amb lletra molt gran."
        why: "Aquest és el sentit literal; l'expressió és figurada."
      - text: "Lletrejar una paraula perquè s'entengui."
        why: "L'expressió no parla de lletrejar, sinó de parlar obertament."
    explanation: "«Amb totes les lletres» vol dir explícitament: sense eufemismes ni mitges paraules."

  # ---------- Lliçó 2 ----------
  - id: b2-58-014
    type: fill
    point: paronims-propers
    lesson: 2
    prompt: "Per ___ els incendis, cal no fer foc al bosc."
    hint: "PREVENIR"
    answers: ["prevenir"]
    wrong_answers:
      - text: "preveure"
        why: "*Preveure* és veure per endavant. Aquí cal impedir: *prevenir*."
    grading: tolerant
    explanation: "No fer foc impedeix els incendis: *prevenir*."

  - id: b2-58-015
    type: fill
    point: paronims-propers
    lesson: 2
    prompt: "Aquestes pastilles ___ el mal de cap si les prens a temps."
    hint: "PREVENIR, present"
    answers: ["prevenen"]
    wrong_answers:
      - text: "preveuen"
        why: "*Preveure* és anunciar el futur. Les pastilles impedeixen el mal: *prevenen*."
    grading: tolerant
    explanation: "Les pastilles impedeixen el mal: *prevenir*. *Preveure* seria anunciar-lo."

  - id: b2-58-016
    type: fill
    point: paronims-propers
    lesson: 2
    prompt: "La llei ___ sancions molt dures per a aquest delicte."
    hint: "PREVEURE, present"
    answers: ["preveu"]
    wrong_answers:
      - text: "preveure"
        why: "El subjecte («la llei») demana un verb conjugat: *preveu*."
    grading: tolerant
    explanation: "La llei anuncia les sancions: *preveure*."

  - id: b2-58-017
    type: fill
    point: sinonims
    lesson: 2
    prompt: "Vam ___ el projecte al juny."
    hint: "CONCLOURE, passat perifràstic"
    answers: ["concloure"]
    wrong_answers:
      - text: "concluir"
        why: "L'infinitiu és *concloure*, no *concluir*."
    grading: tolerant
    explanation: "*Concloure* és el sinònim formal de *acabar*."

  - id: b2-58-018
    type: fill
    point: sinonims
    lesson: 2
    prompt: "El tècnic ha ___ el model més segur."
    hint: "ESCOLLIR, participi"
    answers: ["escollit"]
    wrong_answers:
      - text: "escogit"
        why: "*Escogit* és un calc de «escogido». En català: *escollit*."
    grading: tolerant
    explanation: "*Escollir* (= *triar*) fa el participi *escollit*."

  - id: b2-58-019
    type: order
    point: paronims-propers
    lesson: 2
    cue: "Digues que cal prevenir els riscos abans de començar l'obra."
    chunks: ["Cal", "prevenir", "els riscos", "abans de", "començar l'obra"]
    extra: ["preveure"]
    answers:
      - "Cal prevenir els riscos abans de començar l'obra."
      - "Abans de començar l'obra, cal prevenir els riscos."
    explanation: "Els riscos s'impedeixen: *prevenir*. El bloc «abans de començar l'obra» pot anar al final o al principi."

  - id: b2-58-020
    type: order
    point: sinonims
    lesson: 2
    cue: "Digues que vas efectuar la reserva per internet."
    chunks: ["Vaig", "efectuar", "la reserva", "per internet"]
    extra: ["fer"]
    answers:
      - "Vaig efectuar la reserva per internet."
      - "Per internet vaig efectuar la reserva."
    explanation: "*Efectuar* és el sinònim formal de *fer* (una reserva, un pagament)."

  - id: b2-58-021
    type: choice
    point: sinonims
    lesson: 2
    prompt: "«Vam haver de triar un model nou.» Quin mot pot substituir «triar»?"
    answer: "escollir"
    distractors:
      - text: "treure"
        why: "*Treure* és treure una cosa d'un lloc, no decidir-se per una opció."
      - text: "trair"
        why: "*Trair* és enganyar la confiança d'algú."
    explanation: "*Triar* i *escollir* són sinònims: decidir-se per una opció."

  - id: b2-58-022
    type: choice
    point: sinonims
    lesson: 2
    prompt: "«El programa utilitza molta bateria.» Quin mot pot substituir «utilitza»?"
    answer: "fa servir"
    distractors:
      - text: "utilitat"
        why: "*Utilitat* és un nom (la qualitat de ser útil), no un verb."
      - text: "usat"
        why: "*Usat* és un participi que aquí no hi fa res: cal el verb *fa servir*."
    explanation: "*Utilitzar* i *fer servir* són sinònims."

  - id: b2-58-023
    type: choice
    point: sinonims
    lesson: 2
    prompt: "«Vaig haver d'esborrar tres fotos.» Quin mot pot substituir «esborrar»?"
    answer: "eliminar"
    distractors:
      - text: "esborrany"
        why: "Un *esborrany* és un primer text provisional, no l'acció d'esborrar."
      - text: "recuperar"
        why: "És l'antònim: tornar a tenir una cosa."
    explanation: "*Esborrar* i *eliminar* (un fitxer, una foto) són sinònims."

  - id: b2-58-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "—Un virus i un error del sistema són el mateix? —No, ___."
    answer: "no és el mateix"
    distractors:
      - text: "no fa el mateix"
        why: "*Fer* el mateix parla d'una acció, no de dues coses diferents."
      - text: "no vol dir el mateix"
        why: "*Voler dir* parla del significat de les paraules, no de si dues coses són diferents."
    explanation: "Un virus i un error són coses semblants, però diferents: *no és el mateix*."

  - id: b2-58-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «explicar fil per randa»?"
    answer: "Explicar una cosa pas a pas, amb ordre."
    distractors:
      - text: "Explicar una cosa molt de pressa, sense detalls."
        why: "És el contrari: sense ordre ni detalls."
      - text: "Explicar una cosa saltant de tema en tema."
        why: "És el contrari: sense ordre."
    explanation: "«Fil per randa» vol dir amb ordre, punt per punt."

  # ---------- Lliçó 3 ----------
  - id: b2-58-026
    type: choice
    point: antonims-prefixos
    lesson: 3
    prompt: "Aquest fitxer és ___: ningú no el pot llegir sense la clau."
    answer: "il·legible"
    distractors:
      - text: "deslegible"
        why: "No existeix: l'antònim de *llegible* és *il·legible*."
      - text: "inlegible"
        why: "Davant de *l* el prefix *in-* es converteix en *il-*."
    explanation: "«Ningú no el pot llegir» vol dir que no es pot llegir: *il·legible*."

  - id: b2-58-027
    type: choice
    point: antonims-prefixos
    lesson: 3
    prompt: "És ___ obrir aquest programa amb un sistema operatiu tan vell."
    answer: "impossible"
    distractors:
      - text: "despossible"
        why: "No existeix: l'antònim de *possible* és *impossible*."
      - text: "inpossible"
        why: "Davant de *p* el prefix *in-* es converteix en *im-*."
    explanation: "Amb un sistema tan vell no es pot obrir: és *impossible*."

  - id: b2-58-028
    type: choice
    point: antonims-prefixos
    lesson: 3
    prompt: "El nou company és molt ___: sempre arriba tard i no avisa mai."
    answer: "irresponsable"
    distractors:
      - text: "desresponsable"
        why: "No existeix: l'antònim de *responsable* és *irresponsable*."
      - text: "inresponsable"
        why: "Davant de *r* el prefix *in-* es converteix en *ir-*."
    explanation: "Arribar tard i no avisar és no ser responsable: *irresponsable*."

  - id: b2-58-029
    type: fill
    point: antonims-prefixos
    lesson: 3
    prompt: "Aquesta contrasenya és massa curta: és totalment ___."
    hint: "SEGUR, antònim amb prefix"
    answers: ["insegura"]
    wrong_answers:
      - text: "desegura"
        why: "No existeix: l'antònim de *segur* és *insegur*."
      - text: "insegur"
        why: "«Contrasenya» és femení: *insegura*."
    grading: tolerant
    explanation: "Una contrasenya curta no és segura: és *insegura*."

  - id: b2-58-030
    type: fill
    point: antonims-prefixos
    lesson: 3
    prompt: "La Montse no va respondre: el número era ___ i no el coneixia."
    hint: "CONEGUT, antònim amb prefix"
    answers: ["desconegut"]
    wrong_answers:
      - text: "inconegut"
