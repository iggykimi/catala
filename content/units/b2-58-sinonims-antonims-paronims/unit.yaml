  # ---------- Lliçó 5 ----------
  - id: b2-58-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un dilluns de teletreball"
    text: |
      La Núria treballa tres dies per setmana des de casa. Dilluns passat tenia una videotrucada important a les nou amb un client nou, i es va llevar una hora abans per preparar-ho tot amb calma. Va encendre el portàtil, va obrir el navegador i va comprovar que la xarxa funcionava bé.

      Mitja hora abans de la reunió, però, va arribar el primer problema: l'aplicació de videotrucades no s'obria. L'havia actualitzat divendres, però ara només sortia un missatge d'error i una notificació que no entenia. Va provar de reiniciar l'ordinador dues vegades, sense èxit. Aleshores va trucar a l'Ibrahim, el tècnic de l'empresa.

      —Explica'm fil per randa què has fet —li va dir ell.

      La Núria li ho va explicar amb pèls i senyals: l'actualització, el missatge d'error, els dos reinicis. L'Ibrahim va escoltar en silenci i després li va fer una pregunta que la va deixar glaçada:

      —I la còpia de seguretat de les dades, quan la vas fer?

      La Núria no ho recordava. Sempre ajornava aquella tasca i ara no sabia si perdria els fitxers del projecte. L'Ibrahim li va dir que no patís: primer havien de desinstal·lar l'aplicació i tornar-la a instal·lar, i després comprovarien la carpeta del núvol.

      Cinc minuts abans de les nou, l'aplicació ja funcionava. La videotrucada va començar amb retard, però el client no s'hi va estar: li va dir amb totes les lletres que el pressupost li semblava car. La Núria, que s'ho havia preparat bé, li va proposar una alternativa més barata i van posar l'acord blanc sobre negre en un correu.

      Quan va acabar la trucada, la Núria va fer immediatament la còpia de seguretat. Havia après la lliçó: un antivirus eficaç i una bona contrasenya no serveixen de res si no deses les dades. També va activar la verificació en dos passos per protegir la privadesa. Ara també fa servir la tauleta per llegir els informes.
    questions:
      - prompt: "Per què es va llevar d'hora la Núria?"
        answer: "Tenia una videotrucada important a les nou."
        distractors:
          - text: "Havia de portar el portàtil a reparar."
            why: "El portàtil funcionava; el problema era l'aplicació."
          - text: "Volia fer la còpia de seguretat abans de treballar."
            why: "La còpia la va fer al final, després de la trucada."
      - prompt: "Què va fer l'Ibrahim?"
        answer: "La va calmar i li va dir com arreglar l'aplicació."
        distractors:
          - text: "Va anar a casa seva a reparar l'ordinador."
            why: "Tot ho van resoldre per telèfon."
          - text: "Li va dir que comprés un portàtil nou."
            why: "No parlen de comprar res."
      - prompt: "Què li va dir el client a la videotrucada?"
        answer: "Que el pressupost era massa car."
        distractors:
          - text: "Que volia anul·lar el projecte."
            why: "Al contrari: van arribar a un acord."
          - text: "Que la connexió es tallava tota l'estona."
            why: "La videotrucada va funcionar; no parlen de la connexió."
      - prompt: "Què va aprendre la Núria aquell dia?"
        answer: "Que cal fer còpies de seguretat de les dades."
        distractors:
          - text: "Que no ha de comprar antivirus cars."
            why: "El text no diu que l'antivirus fos car."
          - text: "Que és millor treballar des de l'oficina."
            why: "No diu això; el dia va acabar bé."
    explanation: "El text explica com la Núria va resoldre un problema tècnic abans d'una videotrucada i va aprendre a fer còpies de seguretat."

