id: b1-32
level: B1
title: "Apòstrof, guionet, ela geminada i numerals"
summary: "Aprens a apostrofar (*l'oferta*, *m'han pagat*), a escriure els numerals amb guionet (*vint-i-tres*, *dos-cents*), la ela geminada (*col·legi*, *novel·la*) i els cardinals i ordinals (*quinze*, *tercer*, *dues*)."
vocabulary_theme: "Diners, banc i preus"
points:
  - id: apostrofacio
    title: "L'apostrofació: article, *de* i pronoms"
    refs:
      - label: "GEIEC: L'apostrofació"
        url: "https://geiec.iec.cat"
  - id: guionet
    title: "El guionet: numerals i pronoms"
    refs:
      - label: "GEIEC: El guionet"
        url: "https://geiec.iec.cat"
  - id: ela-geminada
    title: "La ela geminada: *col·legi*, *novel·la*"
    refs:
      - label: "GEIEC: La ela geminada"
        url: "https://geiec.iec.cat"
  - id: numerals
    title: "Cardinals, ordinals, *mig* i *quart*"
    refs:
      - label: "GEIEC: Els numerals"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: els numerals"
  - id: expressions
    title: "Expressions amb diners"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: l'apòstrof i el guionet"
  - title: "Practicar: apòstrof, guionet i ela geminada"
  - title: "Numerals i interferències del castellà"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el compte"
    definition: "Compte que tens al banc per guardar-hi els diners."
    example: "M'han ingressat el sou al compte."
  - word: "el caixer"
    definition: "Màquina on pots treure diners amb la targeta."
    example: "El caixer del mercat no funciona."
  - word: "la targeta"
    definition: "Plàstic del banc que serveix per pagar o treure diners."
    example: "He pagat amb la targeta de dèbit."
  - word: "el rebut"
    definition: "Paper que demostra que has pagat una cosa."
    example: "Guarda el rebut de la compra."
  - word: "la factura"
    definition: "Document que diu quant has de pagar i a qui."
    example: "La factura de la llum arriba cada mes."
  - word: "el tiquet"
    definition: "Paper petit que et donen quan pagues a una botiga."
    example: "Necessito el tiquet per tornar la camisa."
  - word: "el canvi"
    definition: "Diners que et tornen quan pagues de més."
    example: "M'ha tornat malament el canvi."
  - word: "el deute"
    definition: "Diners que deus a algú."
    example: "Té un deute de mil euros amb el banc."
  - word: "el préstec"
    definition: "Diners que el banc et deixa i que has de tornar."
    example: "Han demanat un préstec per al cotxe."
  - word: "el pressupost"
    definition: "Càlcul dels diners que costarà una feina."
    example: "El lampista ens farà un pressupost."
  - word: "la quota"
    definition: "Part fixa que pagues cada mes o cada any."
    example: "La quota del gimnàs puja al gener."
  - word: "l'assegurança"
    definition: "Contracte que et cobreix si tens un accident."
    example: "L'assegurança del pis és obligatòria."
  - word: "el descompte"
    definition: "Rebaixa del preu d'una cosa."
    example: "Amb aquest cupó tens un descompte."
  - word: "l'oferta"
    definition: "Preu més baix durant uns dies."
    example: "Aquesta oferta acaba diumenge."
  - word: "el preu"
    definition: "Diners que costa una cosa."
    example: "El preu del pa ha apujat."
  - word: "el cèntim"
    definition: "La moneda més petita de l'euro."
    example: "No em queda ni un cèntim."
  - word: "l'euro"
    definition: "Moneda de la majoria de països d'Europa."
    example: "El bitllet val cinc euros."
  - word: "el bitllet"
    definition: "Paper moneda d'un valor determinat."
    example: "El caixer no dona bitllets petits."
  - word: "la moneda"
    definition: "Diners de metall."
    example: "Té una col·lecció de monedes antigues."
  - word: "la cartera"
    definition: "Objecte pla per portar bitllets i targetes."
    example: "M'he deixat la cartera a la feina."
  - word: "el moneder"
    definition: "Bossa petita per portar monedes."
    example: "Al moneder només hi ha cèntims."
  - word: "el sou"
    definition: "Diners que guanyes cada mes per la feina."
    example: "Amb aquest sou no arriba a final de mes."
  - word: "la nòmina"
    definition: "Document que diu quant has guanyat aquell mes."
    example: "La nòmina arriba l'últim dia del mes."
  - word: "el lloguer"
    definition: "Diners que pagues per viure en un pis que no és teu."
    example: "Aquest lloguer costa un ull de la cara."
  - word: "la hipoteca"
    definition: "Préstec gran per comprar una casa."
    example: "Encara paguen la hipoteca del pis."
  - word: "l'estalvi"
    definition: "Diners que guardes i no gastes."
    example: "Els estalvis van a un compte a part."
  - word: "l'ingrés"
    definition: "Diners que entren al teu compte."
    example: "He fet un ingrés de dos-cents euros."
  - word: "la despesa"
    definition: "Diners que gastes; allò que pagues."
    example: "Les despeses del gener són molt altes."
  - word: "gastar"
    definition: "Fer servir els diners per comprar coses."
    example: "Aquest mes hem gastat massa."
  - word: "estalviar"
    definition: "Guardar diners per al futur."
    example: "Estalvia una mica cada mes."
  - word: "apujar"
    definition: "Fer més alt un preu."
    example: "Han apujat el lloguer un 5 %."
  - word: "tornar"
    definition: "Donar a algú els diners que sobren."
    example: "M'ha tornat cinc euros de canvi."
  - word: "deure"
    definition: "Haver de pagar diners a algú."
    example: "Encara em deu vint euros."
  - word: "el client, la clienta"
    definition: "Persona que compra o fa servir un servei."
    example: "El banc tanca a les dues per als clients."
  - word: "la caixa"
    definition: "Lloc de la botiga on pagues."
    example: "A la caixa només accepten targeta."
  - word: "barat, barata"
    definition: "Que costa pocs diners."
    example: "Aquest mercat és més barat que el del centre."
  - word: "car, cara"
    definition: "Que costa molts diners."
    example: "Aquest restaurant és massa car."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-32-001
    type: choice
    point: apostrofacio
    lesson: 1
    prompt: "—On és el rebut del gas? —A ___ entrada, al calaix de la cuina."
    answer: "l'"
    distractors:
      - text: "la"
        why: "*La* no va davant de vocal: *entrada* comença per *e*, i *la* s'apostrofa."
      - text: "el"
        why: "*Entrada* és femení: l'article és *la*, que davant de vocal s'escriu *l'*."
    explanation: "«Entrada» és femení i comença per vocal: *la* s'apostrofa."

  - id: b1-32-002
    type: choice
    point: apostrofacio
    lesson: 1
    prompt: "La Núria estudia a ___ Universitat de Barcelona."
    answer: "la"
    distractors:
      - text: "l'"
        why: "*La* no s'apostrofa davant de *u* àtona + vocal: *la universitat*."
      - text: "el"
        why: "*Universitat* és femení: l'article és *la*."
    explanation: "«Universitat» comença per *u* àtona + vocal: és l'excepció i *la* no s'apostrofa."

  - id: b1-32-003
    type: choice
    point: apostrofacio
    lesson: 1
    prompt: "Aquest anell és ___ or pur, no és bijuteria."
    answer: "d'"
    distractors:
      - text: "de"
        why: "*De* s'apostrofa davant de vocal: *d'or*."
      - text: "del"
        why: "Aquí *or* no porta article, així que no hi ha contracció: *d'or*."
    explanation: "«Or» comença per vocal i no porta article: *de* s'apostrofa."

  - id: b1-32-004
    type: choice
    point: apostrofacio
    lesson: 1
    prompt: "—Qui ha pagat el dinar? —___ ha pagat l'Ibrahim, com sempre."
    answer: "L'"
    distractors:
      - text: "El"
        why: "Davant de vocal, *el* s'apostrofa: *l'ha pagat*."
      - text: "La"
        why: "El pronom substitueix «el dinar», masculí: *el*, que davant de vocal és *l'*."
    explanation: "El pronom *el* («el dinar») va davant de *ha*: s'apostrofa."

  - id: b1-32-005
    type: fill
    point: apostrofacio
    lesson: 1
    prompt: "L'assegurança puja cada any: aquest gener ___ han apujat un 10 %."
    hint: "pronom *em*, davant de vocal"
    answers: ["m'"]
    wrong_answers:
      - text: "em"
        why: "Davant de vocal, *em* s'apostrofa: *m'han apujat*."
      - text: "me"
        why: "Davant del verb la forma és *em*, i davant de vocal s'apostrofa: *m'han*."
    grading: strict
    explanation: "Davant de *han*, *em* s'apostrofa: *m'han apujat*."

  - id: b1-32-006
    type: order
    point: apostrofacio
    lesson: 1
    cue: "Digues que el rebut de la llum ja l'has pagat."
    chunks: ["el", "rebut", "ja", "l'he", "pagat"]
    extra: ["la"]
    answers:
      - "El rebut ja l'he pagat."
      - "Ja l'he pagat, el rebut."
    explanation: "Davant de *he*, el pronom *el* («el rebut») s'apostrofa: *l'he pagat*."

  - id: b1-32-007
    type: choice
    point: guionet
    lesson: 1
    prompt: "La quota del col·legi és de ___ euros."
    answer: "trenta-dos"
    distractors:
      - text: "trenta i dos"
        why: "Les desenes (menys la vintena) s'uneixen a la unitat amb guionet i sense *i*: *trenta-dos*."
      - text: "treinta-dos"
        why: "«Treinta» és castellà: en català és *trenta-dos*."
    explanation: "*Trenta-dos* s'escriu amb guionet i sense la conjunció *i*."

  - id: b1-32-008
    type: choice
    point: guionet
    lesson: 1
    prompt: "Han comprat ___ entrades per al concert."
    answer: "vint-i-una"
    distractors:
      - text: "vint-i-un"
        why: "*Vint-i-un* és masculí. «Entrades» és femení: *vint-i-una*."
      - text: "vintiuna"
        why: "La vintena porta la conjunció *i* amb guionets: *vint-i-una*."
    explanation: "«Entrades» és femení: *vint-i-una*, amb la *i* i dos guionets."

  - id: b1-32-009
    type: choice
    point: guionet
    lesson: 1
    prompt: "Aquesta bici de segona mà val ___ euros."
    answer: "dos-cents"
    distractors:
      - text: "dos cents"
        why: "El multiplicador i *cents* s'uneixen amb guionet: *dos-cents*."
      - text: "doscientos"
        why: "«Doscientos» és castellà: en català és *dos-cents*."
    explanation: "*Dos-cents* s'escriu amb guionet entre el multiplicador i *cents*."

  - id: b1-32-010
    type: inline-choice
    point: guionet
    lesson: 1
    title: "El pressupost del lampista"
    text: "El lampista ens ha fet un pressupost de {dos-cents|dos cents|doscientos} euros per canviar la caldera. Si paguem aquesta setmana, ens fa un descompte de {trenta-dos|trenta i dos|treinta-dos} euros. Tenim {vint-i-un|vint i un|veintiún} dies per decidir-nos."
    explanation: "*Dos-cents* i *trenta-dos* porten guionet. *Vint-i-un*, amb la *i*: davant d'un nom masculí acaba en *-un*. «Doscientos», «treinta» i «veintiún» són castellans."

  - id: b1-32-011
    type: fill
    point: guionet
    lesson: 1
    prompt: "El curs d'anglès costa noranta-___ euros al trimestre."
    hint: "NORANTA-NOU: escriu la unitat"
    answers: ["nou"]
    wrong_answers:
      - text: "nueve"
        why: "«Nueve» és castellà: *nou*."
      - text: "nòu"
        why: "*Nou* no porta accent."
    grading: strict
    explanation: "El numeral és *noranta-nou*: el guionet ja hi és, només falta *nou*."

  - id: b1-32-012
    type: order
    point: guionet
    lesson: 1
    cue: "Digues que vols comprar el tiquet d'autobús per internet."
    chunks: ["vull", "comprar-lo", "per", "internet"]
    extra: ["lo"]
    answers:
      - "Vull comprar-lo per internet."
      - "Per internet vull comprar-lo."
    explanation: "Darrere de l'infinitiu, el pronom va unit amb guionet: *comprar-lo*."

  - id: b1-32-013
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["fer números", "Cal calcular si el sou arriba a final de mes."]
      - ["costar un ull de la cara", "Un lloguer molt més car del normal."]
      - ["tirar la casa per la finestra", "Gastar molt en el casament de la filla."]
      - ["no tenir ni cinc", "Quedar-se sense diners a final de mes."]
    explanation: "Són expressions per parlar de diners: calcular (*fer números*), el preu (*costar un ull de la cara*), gastar molt (*tirar la casa per la finestra*) o no tenir res (*no tenir ni cinc*)."

  # ---------------- Lliçó 2 ----------------
  - id: b1-32-014
    type: fill
    point: apostrofacio
    lesson: 2
    prompt: "No estic d'acord amb ___ import del rebut: és massa alt."
    hint: "article *el*, davant de vocal"
    answers: ["l'"]
    wrong_answers:
      - text: "el"
        why: "Davant de vocal, *el* s'apostrofa: *amb l'import*."
      - text: "la"
        why: "*Import* és masculí: *amb l'import*."
    grading: strict
    explanation: "«Import» és masculí i comença per vocal: *amb l'import*."

  - id: b1-32-015
    type: fill
    point: apostrofacio
    lesson: 2
    prompt: "Quan tinguis el pressupost, ___ sense falta."
    hint: "TRUCAR + *em*, imperatiu"
    answers: ["truca'm"]
    wrong_answers:
      - text: "trucam"
        why: "Darrere d'una vocal, *em* s'apostrofa: *truca'm*."
      - text: "truca-me"
        why: "Darrere d'una vocal, *em* es redueix a *'m*: *truca'm*."
    grading: strict
    explanation: "Darrere d'un imperatiu acabat en vocal, *em* s'apostrofa: *truca'm*."

  - id: b1-32-016
    type: choice
    point: apostrofacio
    lesson: 2
    prompt: "T'han tornat tot el canvi. Quina frase ho diu?"
    answer: "M'han tornat el canvi sencer."
    distractors:
      - text: "Em han tornat el canvi sencer."
        why: "Davant de vocal, *em* s'apostrofa: *m'han tornat*."
      - text: "Me han tornat el canvi sencer."
        why: "Davant del verb la forma és *em*, i davant de vocal s'apostrofa: *m'han*."
    explanation: "Davant de *han*, *em* perd la vocal: *m'han tornat*."

  - id: b1-32-017
    type: fill
    point: guionet
    lesson: 2
    prompt: "Aquest rebut important, cal ___ abans de divendres."
    hint: "PAGAR + *el*"
    answers: ["pagar-lo"]
    wrong_answers:
      - text: "pagar lo"
        why: "Darrere de l'infinitiu, el pronom va unit amb guionet: *pagar-lo*."
      - text: "pagar el"
        why: "Darrere del verb, *el* canvia de forma: *pagar-lo*."
    grading: strict
    explanation: "Darrere de l'infinitiu, el pronom *el* s'escriu *-lo*: *pagar-lo*."

  - id: b1-32-018
    type: fill
    point: guionet
    lesson: 2
    prompt: "El viatge costa dos-___ euros per persona."
    hint: "DOS-CENTS: escriu la segona part"
    answers: ["cents"]
    wrong_answers:
      - text: "cientos"
        why: "«Cientos» és castellà: *cents*."
      - text: "cent"
        why: "Amb un multiplicador (*dos*), *cent* porta *-s* i concorda: *dos-cents*."
    grading: strict
    explanation: "Amb un multiplicador, *cent* fa el plural: *dos-cents*."

  - id: b1-32-019
    type: choice
    point: guionet
    lesson: 2
    prompt: "Vol pagar el rebut per internet. Quina frase ho diu?"
    answer: "Vol pagar-lo aquesta nit."
    distractors:
      - text: "Vol el pagar aquesta nit."
        why: "El pronom no pot anar entre el verb i l'infinitiu: o *el vol pagar* o *vol pagar-lo*."
      - text: "Vol pagar lo aquesta nit."
        why: "Darrere de l'infinitiu, *el* canvia a *-lo*: *pagar-lo*."
    explanation: "El pronom pot anar davant del verb (*el vol pagar*) o darrere l'infinitiu amb guionet."

  - id: b1-32-020
    type: choice
    point: ela-geminada
    lesson: 2
    prompt: "La Fàtima té una ___ de monedes antigues."
    answer: "col·lecció"
    distractors:
      - text: "colecció"
        why: "*Col·lecció* s'escriu amb ela geminada: *col·lecció*, no *colecció*."
      - text: "collecció"
        why: "No és *ll* (ela palatal), és *l·l* (ela geminada): *col·lecció*."
    explanation: "*Col·lecció* porta ela geminada: sona *col-lec-ci-ó*."

  - id: b1-32-021
    type: choice
    point: ela-geminada
    lesson: 2
    prompt: "Aquest estiu llegiré una ___ policíaca."
    answer: "novel·la"
    distractors:
      - text: "novela"
        why: "«Novela» és castellà: en català és *novel·la*."
      - text: "novella"
        why: "No és *ll*, és *l·l*: *novel·la*."
    explanation: "*Novel·la* s'escriu amb ela geminada."

  - id: b1-32-022
    type: choice
    point: ela-geminada
    lesson: 2
    prompt: "El caixer només dona ___ de vint euros."
    answer: "bitllets"
    distractors:
      - text: "bit·llets"
        why: "*Bitllet* no porta ela geminada: la *ll* és la ela palatal, com a *illa*."
      - text: "bitlets"
        why: "*Bitllet* s'escriu amb dues eles (*ll*), no amb una."
    explanation: "*Bitllet* porta *ll* (ela palatal), no *l·l*."

  - id: b1-32-023
    type: inline-choice
    point: ela-geminada
    lesson: 2
    title: "Un missatge del banc"
    text: "Benvolgut client: hem {anul·lat|anulat|anullat} la targeta que vas perdre. Pots {instal·lar|instalar|installar} l'aplicació del banc per demanar-ne una de nova. És un servei {intel·ligent|inteligent|intelligent} i gratuït."
    explanation: "*Anul·lar*, *instal·lar* i *intel·ligent* s'escriuen amb ela geminada."

  - id: b1-32-024
    type: order
    point: ela-geminada
    lesson: 2
    cue: "Digues que la novel·la que llegeixes és molt bona."
    chunks: ["la", "novel·la", "és", "molt", "bona"]
    extra: ["novela"]
    answers:
      - "La novel·la és molt bona."
    explanation: "*Novel·la* s'escriu amb ela geminada (*l·l*)."

  - id: b1-32-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «Hem de fer números abans de comprar el cotxe»?"
    answer: "Que cal calcular si ho podem pagar."
    distractors:
      - text: "Que han de comptar els cotxes del carrer."
        why: "No és comptar cotxes: és calcular els diners."
      - text: "Que el cotxe porta números a la matrícula."
        why: "No parla de matrícules: parla de calcular les despeses."
    explanation: "*Fer números* vol dir fer comptes, calcular si arriben els diners."

  - id: b1-32-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "—Compreu el pis del centre? —Ni parlar-ne: ___."
    answer: "costa un ull de la cara"
    distractors:
      - text: "costa un ull a la cara"
        why: "L'expressió fixa és *costar un ull de la cara*."
      - text: "costa molt barat"
        why: "Si és car, no pot ser barat: l'expressió vol dir que és molt car."
    explanation: "*Costar un ull de la cara* vol dir ser molt car."

  # ---------------- Lliçó 3 ----------------
  - id: b1-32-027
    type: find-error
    point: ela-geminada
    lesson: 3
    sentence: "Vaig llegir una novela molt bona durant les vacances."
    error: "novela"
    fix: "novel·la"
    fix_distractors:
      - text: "novella"
        why: "No és *ll* (ela palatal): és *l·l* (ela geminada)."
      - text: "nove·la"
        why: "El punt va entre les dues eles: *novel·la*."
    explanation: "*Novel·la* s'escriu amb ela geminada: *l·l*."

  - id: b1-32-028
    type: find-error
    point: ela-geminada
    lesson: 3
    sentence: "El banc ha cancelat el rebut perquè el compte no tenia diners."
    error: "cancelat"
    fix: "cancel·lat"
    fix_distractors:
      - text: "cancellat"
        why: "No és *ll*: és *l·l*: *cancel·lat*."
      - text: "cance·lat"
        why: "El punt va entre les dues eles: *cancel·lat*."
    explanation: "*Cancel·lar* s'escriu amb ela geminada: *cancel·lat*."

  - id: b1-32-029
    type: choice
    point: ela-geminada
    lesson: 3
    prompt: "Has perdut la targeta. El banc l'ha ___."
    answer: "anul·lada"
    distractors:
      - text: "anulada"
        why: "*Anul·lar* porta ela geminada: *anul·lada*."
      - text: "anullada"
        why: "No és *ll*, és *l·l*: *anul·lada*."
    explanation: "*Anul·lar* s'escriu amb ela geminada; el participi és *anul·lat, anul·lada*."

  - id: b1-32-030
    type: inline-choice
    point: ela-geminada
    lesson: 3
    title: "La col·lecció de l'Ibrahim"
