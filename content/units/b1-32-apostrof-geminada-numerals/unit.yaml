  # ---------------- Lliçó 5 ----------------
  - id: b1-32-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un matí al banc"
    text: |
      La Carla va al banc cada primer dilluns de mes. Aquest dilluns hi va amb dues factures: la de la llum, de noranta-dos euros, i la de l'aigua, de vint-i-u. A la caixa, el client de davant paga amb un bitllet de cinquanta i la caixera li torna el canvi amb tres monedes. La cua és llarga, però avança de pressa.

      Després, la Carla passa pel despatx de l'Ibrahim, que és el director. Vol anul·lar la targeta vella i demanar-ne una de nova. L'Ibrahim li explica que pot instal·lar l'aplicació del banc i fer-ho tot des del mòbil. «És molt intel·ligent», li diu. «I gratuït.» La Carla no ho sabia: sempre ho feia tot a la finestreta.

      També parlen del préstec del cotxe. Fins ara pagava dos-cents trenta-quatre euros al mes, però vol pagar una mica més i acabar abans. Fan números junts i, amb els estalvis, queden que pagarà tres-cents euros al mes.

      Abans de marxar, la Carla passa pel caixer i treu quaranta euros. La nòmina ja li ha arribat aquest matí. «Aquest mes no em quedaré sense un cèntim», pensa. Li fa il·lusió acabar el préstec aviat.
    questions:
      - prompt: "Què porta la Carla al banc?"
        answer: "Dues factures per pagar."
        distractors:
          - text: "Un xec per ingressar."
            why: "No porta cap xec: porta la factura de la llum i la de l'aigua."
          - text: "La targeta vella per anul·lar."
            why: "Vol anul·lar-la, però no diu que la porti: en parla al despatx."
      - prompt: "Què li proposa l'Ibrahim?"
        answer: "Fer servir l'aplicació del banc."
        distractors:
          - text: "Anar sempre a la finestreta."
            why: "És el que feia abans: ell li proposa el mòbil."
          - text: "Pagar una mica més cada mes."
            why: "Pagar més és idea de la Carla, per al préstec."
      - prompt: "Quant pagarà ara pel préstec?"
        answer: "Tres-cents euros al mes."
        distractors:
          - text: "Dos-cents trenta-quatre euros."
            why: "Això pagava fins ara: ara pagarà més."
          - text: "Quaranta euros."
            why: "Quaranta euros és el que treu del caixer."
      - prompt: "Què pensa la Carla en sortir?"
        answer: "Que aquest mes no es quedarà sense diners."
        distractors:
          - text: "Que ha de tornar un altre dia."
            why: "El text no diu que hagi de tornar."
          - text: "Que no té ni cinc per pagar el préstec."
            why: "Ella pensa que no es quedarà sense diners: tot el contrari."
    explanation: "El text explica què fa la Carla al banc: paga factures, demana una targeta nova i apuja la quota del préstec."

