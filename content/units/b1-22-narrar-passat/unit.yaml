id: b1-22
level: B1
title: "Narrar en passat"
summary: "Aprens a combinar el perifràstic, l'imperfet i el plusquamperfet en un relat, amb connectors (*aleshores*, *l'endemà*, *al cap de*) i sense el perfet amb *ahir*."
vocabulary_theme: "Notícies i successos"
points:
  - id: imperfet-relat
    title: "L'imperfet i el perifràstic: descriure i narrar"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: plusquamperfet
    title: "El plusquamperfet: *havia fet*"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: connectors-relat
    title: "Connectors: *aleshores*, *l'endemà*, *al cap de*, *de cop*"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: el perfet no va amb *ahir*"
  - id: expressions
    title: "Expressions per explicar fets"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: descriure i narrar"
  - title: "Practicar els tres temps"
  - title: "Connectors i el perfet amb ahir"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "la notícia"
    definition: "Informació d'un fet recent que surt als mitjans."
    example: "Ahir van donar la notícia per la ràdio."
  - word: "el diari"
    definition: "Fulls o web amb les notícies de cada dia."
    example: "El diari d'avui porta la foto de l'incendi."
  - word: "el titular"
    definition: "Frase gran que resumeix una notícia."
    example: "El titular diu que el tren portava retard."
  - word: "el periodista, la periodista"
    definition: "Persona que escriu o explica notícies."
    example: "Una periodista va entrevistar els veïns."
  - word: "el testimoni"
    definition: "Persona que ha vist un fet i l'explica."
    example: "Un testimoni va trucar als bombers."
  - word: "l'accident"
    definition: "Fet sobtat que fa mal o trenca coses."
    example: "L'accident va tallar la carretera dues hores."
  - word: "l'incendi"
    definition: "Foc gran que crema un edifici o un bosc."
    example: "L'incendi va començar a la cuina."
  - word: "el robatori"
    definition: "Fet d'emportar-se una cosa que no és teva."
    example: "El robatori va ser de matinada."
  - word: "el lladre, la lladra"
    definition: "Persona que roba."
    example: "Els lladres van entrar per la finestra."
  - word: "la policia"
    definition: "Cos que manté l'ordre i persegueix els delictes."
    example: "La policia va arribar en deu minuts."
  - word: "el bomber, la bombera"
    definition: "Persona que apaga focs i ajuda en accidents."
    example: "Els bombers van arribar en cinc minuts."
  - word: "l'ambulància"
    definition: "Vehicle que porta els malalts a l'hospital."
    example: "L'ambulància va arribar de seguida."
  - word: "l'hospital"
    definition: "Edifici on els metges curen els malalts i els ferits."
    example: "El van portar a l'hospital per precaució."
  - word: "el trànsit"
    definition: "Cotxes que circulen per carrers i carreteres."
    example: "A les vuit el trànsit és impossible."
  - word: "la retenció"
    definition: "Fila de cotxes aturats per un accident o unes obres."
    example: "Hi havia tres quilòmetres de retenció."
  - word: "el xoc"
    definition: "Cop fort entre dos vehicles o contra una cosa."
    example: "El xoc va trencar un fanal."
  - word: "la víctima"
    definition: "Persona que rep el mal d'un accident o un delicte."
    example: "La víctima només tenia un cop al braç."
  - word: "el soroll"
    definition: "So fort que molesta o avisa."
    example: "Van sentir un soroll i van sortir al balcó."
  - word: "el fum"
    definition: "Núvol gris que surt del foc."
    example: "El fum es veia des de l'altra punta del poble."
  - word: "la tempesta"
    definition: "Pluja forta amb trons i llamps."
    example: "La tempesta va trencar les branques dels arbres."
  - word: "el llamp"
    definition: "Llum del cel que cau durant una tempesta."
    example: "Un llamp va caure sobre l'antena."
  - word: "la inundació"
    definition: "Aigua que cobreix un lloc on no hauria de ser."
    example: "La inundació va mullar tot el pàrquing."
  - word: "l'apagada"
    definition: "Estona que no hi ha llum elèctrica."
    example: "Durant l'apagada vam sopar amb espelmes."
  - word: "el rescat"
    definition: "Acció de treure algú d'un perill."
    example: "El rescat del gos va sortir als diaris."
  - word: "la denúncia"
    definition: "Escrit que es porta a la policia per explicar un delicte."
    example: "Va posar una denúncia a la comissaria."
  - word: "la comissaria"
    definition: "Oficina de la policia."
    example: "El van portar a la comissaria a declarar."
  - word: "declarar"
    definition: "Explicar a la policia o al jutge què ha passat."
    example: "El testimoni va declarar que no havia vist res."
  - word: "el dany"
    definition: "Mal que un accident fa a una cosa."
    example: "El foc només va fer danys a la cuina."
  - word: "el semàfor"
    definition: "Aparell amb llums que ordena el trànsit."
    example: "El semàfor de la cantonada no funcionava."
  - word: "la vorera"
    definition: "Part del carrer per on van les persones."
    example: "El cotxe va pujar a la vorera."
  - word: "el pas de vianants"
    definition: "Ratlles blanques per on es creua el carrer."
    example: "Travessava el carrer pel pas de vianants."
  - word: "el vianant"
    definition: "Persona que va a peu pel carrer."
    example: "El vianant no es va fer mal."
  - word: "la sirena"
    definition: "So fort d'una ambulància o dels bombers."
    example: "Se sentien les sirenes de lluny."
  - word: "apagar"
    definition: "Fer que un foc s'acabi."
    example: "Van apagar el foc en una hora."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-22-001
    type: choice
    point: imperfet-relat
    lesson: 1
    prompt: "Mentre els bombers ___ el foc, els veïns miraven des de la vorera."
    answer: "apagaven"
    distractors:
      - text: "van apagar"
        why: "Amb *mentre* expliquem què passava en aquell moment: imperfet, *apagaven*."
      - text: "han apagat"
        why: "*Han apagat* és perfet, i aquí cal l'imperfet de l'acció en curs."
    explanation: "«Mentre» presenta l'acció en curs: l'imperfet *apagaven*."

  - id: b1-22-002
    type: choice
    point: imperfet-relat
    lesson: 1
    prompt: "Cada estiu, els avis ___ els nets a veure els castells de Tarragona."
    answer: "portaven"
    distractors:
      - text: "van portar"
        why: "*Van portar* és un fet puntual; «cada estiu» és un costum: imperfet."
      - text: "han portat"
        why: "El perfet no va amb un costum del passat."
    explanation: "«Cada estiu» indica un costum: l'imperfet *portaven*."

  - id: b1-22-003
    type: choice
    point: imperfet-relat
    lesson: 1
    prompt: "Ahir a les tres, un camió ___ contra un semàfor a la Gran Via. El xoc només va fer danys al semàfor."
    answer: "va xocar"
    distractors:
      - text: "xocava"
        why: "*Xocava* seria un costum o una descripció; aquí és un fet puntual d'ahir."
      - text: "ha xocat"
        why: "*Ha xocat* és perfet, i el perfet no va amb *ahir*."
    explanation: "«Ahir a les tres» i un fet puntual demanen el perifràstic: *va xocar*."

  - id: b1-22-004
    type: choice
    point: imperfet-relat
    lesson: 1
    prompt: "Quan la Núria va arribar a la plaça, ja ___ molt i els carrers eren buits."
    answer: "plovia"
    distractors:
      - text: "va ploure"
        why: "Amb *ja* la pluja és el fons de l'escena, no un fet nou: *plovia*."
      - text: "ha plogut"
        why: "El perfet no encaixa en una descripció del passat."
    explanation: "La frase descriu el moment en què va arribar: imperfet, *plovia*."

  - id: b1-22-005
    type: choice
    point: plusquamperfet
    lesson: 1
    prompt: "Quan els bombers van arribar, el foc ja ___ tota la cuina."
    answer: "havia cremat"
    distractors:
      - text: "va cremar"
        why: "*Va cremar* passaria després de l'arribada; el foc ho va fer abans: *havia cremat*."
      - text: "ha cremat"
        why: "El perfet no va en un relat del passat amb «quan van arribar»."
    explanation: "El foc ho va fer abans de l'arribada: plusquamperfet, *havia cremat*."

  - id: b1-22-006
    type: choice
    point: plusquamperfet
    lesson: 1
    prompt: "L'Ibrahim no va poder entrar a casa: ___ les claus a la feina."
    answer: "s'havia deixat"
    distractors:
      - text: "es va deixar"
        why: "Ho va fer abans de tornar: plusquamperfet, *s'havia deixat*."
      - text: "s'ha deixat"
        why: "El perfet no encaixa en un relat d'un passat ja tancat."
    explanation: "Es va deixar les claus abans de tornar: plusquamperfet, *s'havia deixat*."

  - id: b1-22-007
    type: choice
    point: plusquamperfet
    lesson: 1
    prompt: "El tren portava retard perquè una tempesta ja ___ un arbre a la via."
    answer: "havia fet caure"
    distractors:
      - text: "va fer caure"
        why: "Amb *ja* cal marcar l'anterioritat: plusquamperfet, *havia fet caure*."
      - text: "ha fet caure"
        why: "El perfet no encaixa en un relat d'un passat ja tancat."
    explanation: "La tempesta ho va fer abans del retard: plusquamperfet, *havia fet caure*."

  - id: b1-22-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["de cop i volta", "de sobte, quan ningú s'ho espera"]
      - ["tot d'una", "de seguida, sense esperar"]
      - ["ves per on", "expressa sorpresa per una coincidència"]
      - ["com qui no vol la cosa", "sense que es noti, dissimuladament"]
    explanation: "Són quatre expressions per explicar fets: rapidesa, sorpresa i dissimulació."

  - id: b1-22-009
    type: inline-choice
    point: imperfet-relat
    lesson: 1
    title: "Un matí de tempesta"
    text: "Ahir al matí, mentre anava a la feina, ja {feia|va fer|ha fet} molt de vent i els carrers {eren|van ser|han estat} buits. De cop, un llamp {va caure|queia|ha caigut} sobre una antena i molts veïns {van sortir|sortien|han sortit} al balcó."
    explanation: "*Feia* i *eren* descriuen el moment; *va caure* i *van sortir* són fets puntuals."

  - id: b1-22-010
    type: fill
    point: imperfet-relat
    lesson: 1
    prompt: "Mentre el periodista ___ amb el testimoni, va començar a ploure."
    hint: "parlar, imperfet"
    answers: ["parlava"]
    wrong_answers:
      - text: "va parlar"
        why: "Aquí *mentre* presenta l'acció en curs quan comença a ploure: imperfet, *parlava*."
      - text: "ha parlat"
        why: "El perfet no encaixa en un relat d'un passat ja tancat."
    grading: tolerant
    explanation: "«Mentre» presenta l'acció en curs: imperfet, *parlava*."

  - id: b1-22-011
    type: fill
    point: imperfet-relat
    lesson: 1
    prompt: "De petit, en Pau ___ cada diumenge a comprar el diari amb el seu avi."
    hint: "anar, imperfet"
    answers: ["anava"]
    wrong_answers:
      - text: "va anar"
        why: "«Cada diumenge» és un costum del passat: imperfet, *anava*."
    grading: tolerant
    explanation: "«De petit» i «cada diumenge» indiquen un costum: imperfet, *anava*."

  - id: b1-22-012
    type: order
    point: imperfet-relat
    lesson: 1
    cue: "Explica que ahir, mentre plovia, vas veure un llamp."
    chunks: ["ahir", "mentre plovia", "vaig veure", "un llamp"]
    extra: ["he vist"]
    answers:
      - "Ahir, mentre plovia, vaig veure un llamp."
      - "Mentre plovia, ahir vaig veure un llamp."
      - "Ahir vaig veure un llamp mentre plovia."
      - "Mentre plovia, vaig veure un llamp ahir."
      - "Vaig veure un llamp ahir mentre plovia."
    explanation: "L'imperfet *plovia* descriu el moment; el fet puntual és *vaig veure*."

  - id: b1-22-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «El lladre va entrar com qui no vol la cosa»?"
    answer: "Que va entrar dissimuladament."
    distractors:
      - text: "Que va entrar de pressa i fent soroll."
        why: "Això és el contrari: l'expressió vol dir sense cridar l'atenció."
      - text: "Que no volia entrar."
        why: "Sí que volia entrar: ho va fer dissimuladament."
    explanation: "*Com qui no vol la cosa* vol dir dissimuladament, sense cridar l'atenció."

  # ---------------- Lliçó 2 ----------------
  - id: b1-22-014
    type: fill
    point: imperfet-relat
    lesson: 2
    prompt: "Ahir a la nit els carrers ___ buits i només se sentien les sirenes."
    hint: "ser, imperfet"
    answers: ["eren"]
    wrong_answers:
      - text: "van ser"
        why: "Aquí *eren* descriu els carrers, no explica un canvi: imperfet."
    grading: tolerant
    explanation: "La frase descriu els carrers: imperfet, *eren*."

  - id: b1-22-015
    type: fill
    point: imperfet-relat
    lesson: 2
    prompt: "Mentre els agents ___ notes, el testimoni declarava què havia vist."
    hint: "prendre, imperfet"
    answers: ["prenien"]
    wrong_answers:
      - text: "van prendre"
        why: "Aquí *mentre* presenta una acció en curs, com «declarava»: imperfet, *prenien*."
    grading: tolerant
    explanation: "«Mentre» presenta l'acció en curs: imperfet, *prenien*."

  - id: b1-22-016
    type: fill
    point: imperfet-relat
    lesson: 2
    prompt: "Ahir un cotxe ___ a la vorera, però el vianant que hi passava no es va fer mal."
    hint: "pujar, perifràstic"
    answers: ["va pujar"]
    wrong_answers:
      - text: "pujava"
        why: "És un fet puntual d'ahir, no una descripció: *va pujar*."
      - text: "ha pujat"
        why: "El perfet no va amb *ahir*: *va pujar*."
    grading: tolerant
    explanation: "«Ahir» i un fet puntual demanen el perifràstic: *va pujar*."

  - id: b1-22-017
    type: fill
    point: plusquamperfet
    lesson: 2
    prompt: "Quan va arribar l'ambulància, els veïns ja ___ la porta de l'edifici."
    hint: "obrir, plusquamperfet"
    answers: ["havien obert"]
    wrong_answers:
      - text: "van obrir"
        why: "Ho van fer abans de l'arribada: plusquamperfet, *havien obert*."
      - text: "obrien"
        why: "*Obrien* seria l'acció en curs; aquí ja estava feta: *havien obert*."
    grading: tolerant
    explanation: "«Ja» indica anterioritat: plusquamperfet, *havien obert*."

  - id: b1-22-018
    type: fill
    point: plusquamperfet
    lesson: 2
    prompt: "La Fàtima no va trobar el gos: algú ja ___ oberta la porta del jardí."
    hint: "deixar, plusquamperfet"
    answers: ["havia deixat"]
    wrong_answers:
      - text: "va deixar"
        why: "Ho va fer abans: plusquamperfet, *havia deixat*."
    grading: tolerant
    explanation: "«Ja» indica anterioritat: plusquamperfet, *havia deixat*."

  - id: b1-22-019
    type: fill
    point: plusquamperfet
    lesson: 2
    prompt: "Els passatgers es van enfadar perquè el tren ja ___ sense ells."
    hint: "marxar, plusquamperfet"
    answers: ["havia marxat"]
    wrong_answers:
      - text: "va marxar"
        why: "Amb *ja* cal marcar l'anterioritat: *havia marxat*."
    grading: tolerant
    explanation: "El tren va marxar abans: plusquamperfet, *havia marxat*."

  - id: b1-22-020
    type: order
    point: plusquamperfet
    lesson: 2
    cue: "Explica que quan vas arribar a l'estació, el tren ja havia marxat."
    chunks: ["quan vaig arribar", "el tren", "ja", "havia marxat"]
    extra: ["ha marxat"]
    answers:
      - "Quan vaig arribar, el tren ja havia marxat."
      - "El tren ja havia marxat quan vaig arribar."
      - "Ja el tren havia marxat quan vaig arribar."
      - "Ja havia marxat el tren quan vaig arribar."
    explanation: "El tren va marxar abans de l'arribada: plusquamperfet, *havia marxat*."

  - id: b1-22-021
    type: order
    point: plusquamperfet
    lesson: 2
    cue: "Digues que els lladres van entrar per una finestra que algú ja havia deixat oberta."
    chunks: ["els lladres", "van entrar", "per una finestra", "que algú ja havia deixat oberta"]
    extra: ["que algú ja va deixar oberta"]
    answers:
      - "Els lladres van entrar per una finestra que algú ja havia deixat oberta."
    explanation: "La finestra ja estava oberta quan van entrar: *havia deixat*."

  - id: b1-22-022
    type: choice
    point: imperfet-relat
    lesson: 2
    prompt: "___ les sirenes dels bombers mentre els veïns baixaven al carrer."
    answer: "Se sentien"
    distractors:
      - text: "Es van sentir"
        why: "Amb *mentre* i *baixaven* cal l'imperfet: *se sentien*."
      - text: "S'han sentit"
        why: "El perfet no encaixa en un relat d'un passat ja tancat."
    explanation: "«Mentre» i *baixaven* demanen l'imperfet: *se sentien*."

  - id: b1-22-023
    type: choice
    point: imperfet-relat
    lesson: 2
    prompt: "Ahir a la tarda, la policia ___ el trànsit durant dues hores."
    answer: "va tallar"
    distractors:
      - text: "tallava"
        why: "*Tallava* seria l'acció en curs; aquí és un fet tancat d'ahir: *va tallar*."
      - text: "ha tallat"
        why: "El perfet no va amb *ahir*: *va tallar*."
    explanation: "«Ahir» i un fet tancat demanen el perifràstic: *va tallar*."

  - id: b1-22-024
    type: choice
    point: plusquamperfet
    lesson: 2
    prompt: "La Laia va haver de tornar a l'oficina: ___ el mòbil a la taula."
    answer: "s'havia deixat"
    distractors:
      - text: "es va deixar"
        why: "Ho va fer abans de tornar: plusquamperfet, *s'havia deixat*."
      - text: "es deixava"
        why: "*Es deixava* seria un costum; aquí és un fet anterior concret."
    explanation: "Va ser abans de tornar: plusquamperfet, *s'havia deixat*."

  - id: b1-22-025
    type: inline-choice
    point: plusquamperfet
    lesson: 2
    title: "El tren de les vuit"
    text: "En Pau va perdre el tren de les vuit: ja {havia sortit|va sortir|ha sortit}. Quan va arribar a casa, tots ja {havien sopat|van sopar|han sopat}. L'endemà, quan va trucar a la cap, ella ja {havia llegit|va llegir|ha llegit} el missatge."
    explanation: "Són fets anteriors a un altre fet del passat: *havia sortit*, *havien sopat*, *havia llegit*."

  - id: b1-22-026
    type: order
    point: imperfet-relat
    lesson: 2
    cue: "Explica que cada tarda anaves a comprar el pa a la fleca del barri."
    chunks: ["cada tarda", "anava", "a comprar el pa", "a la fleca del barri"]
    extra: ["vaig anar"]
    answers:
      - "Cada tarda anava a comprar el pa a la fleca del barri."
      - "Anava a comprar el pa a la fleca del barri cada tarda."
      - "Anava cada tarda a comprar el pa a la fleca del barri."
      - "Anava a comprar el pa cada tarda a la fleca del barri."
    explanation: "«Cada tarda» és un costum: imperfet, *anava*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-22-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Ahir la Laia ha perdut el tren de les vuit."
    error: "ha perdut"
    fix: "va perdre"
    fix_distractors:
      - text: "perdia"
        why: "*Perdia* seria un costum; aquí és un fet puntual d'ahir."
      - text: "havia perdut"
        why: "*Havia perdut* seria anterior a un altre fet; aquí és el fet principal."
    explanation: "El perfet no va amb *ahir*: *ahir la Laia va perdre el tren*."

  - id: b1-22-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Ahir a la nit hi ha hagut un incendi en un restaurant del barri."
    error: "hi ha hagut"
    fix: "va haver-hi"
    fix_distractors:
      - text: "ha hagut"
        why: "Sense *hi*, la frase no té el verb *haver-hi*: *va haver-hi*."
      - text: "havia"
        why: "*Havia* sense *hi* no és el verb *haver-hi*: *va haver-hi*."
    explanation: "El perfet no va amb *ahir*: *ahir a la nit va haver-hi un incendi*."

  - id: b1-22-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Avui hi ha hagut tres accidents a la ronda."
    no_error: true
    explanation: "La frase és correcta: *avui* és un període obert i el perfet *hi ha hagut* hi va bé."

  - id: b1-22-030
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "La setmana passada hem publicat tres notícies sobre el robatori del banc."
    error: "hem publicat"
    fix: "vam publicar"
    fix_distractors:
      - text: "publicàvem"
        why: "*Publicàvem* seria un costum; aquí són fets tancats: *vam publicar*."
      - text: "havíem publicat"
        why: "*Havíem publicat* seria anterior a un altre fet; aquí és el fet principal."
    explanation: "El perfet no va amb un passat tancat com *la setmana passada*: *vam publicar*."

  - id: b1-22-031
