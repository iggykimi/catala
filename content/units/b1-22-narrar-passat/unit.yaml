  # ---------------- Lliçó 5 ----------------
  - id: b1-22-053
    type: reading
    point: comprensio
    lesson: 5
    title: "Un incendi a Gràcia"
    text: |
      Dimarts a la tarda la Carla tornava de la feina quan va veure una columna de fum al seu carrer, a Gràcia. Una botiga de roba s'estava cremant: les flames sortien per la porta i una vintena de veïns miraven des de la vorera del davant.

      La Carla va trucar tot d'una als bombers. Mentrestant, el forner del costat va tancar el gas del seu edifici i dos veïns van ajudar una dona gran a baixar al carrer. Al cap de deu minuts van arribar dues ambulàncies i tres camions de bombers, que van apagar el foc en menys d'una hora.

      Segons els bombers, el foc havia començat a la rebotiga, on hi havia capses de cartó. Per sort, ningú havia entrat a la botiga aquella tarda i no hi va haver ferits. Només una bombera va respirar fum, i la van portar a l'hospital per precaució.

      L'endemà, el titular del diari del barri deia que la botiga ja havia tingut un petit incendi feia dos anys. La Carla, que havia comprat un jersei allà mateix la setmana anterior, encara no s'ho creia.

      —Ves per on —va dir—. La setmana passada hi vaig comprar un jersei!
    questions:
      - prompt: "Què va veure la Carla quan tornava de la feina?"
        answer: "Fum que sortia d'una botiga del seu carrer."
        distractors:
          - text: "Els bombers davant de casa seva."
            why: "Els bombers van arribar després, quan la Carla ja havia trucat."
          - text: "Tres camions a la vorera del davant."
            why: "A la vorera hi havia els veïns; els camions van arribar més tard."
      - prompt: "Què van fer els veïns abans que arribessin els bombers?"
        answer: "Van acompanyar una dona gran fins al carrer."
        distractors:
          - text: "Van tancar el gas de tot el barri."
            why: "El forner va tancar el gas del seu edifici, no de tot el barri."
          - text: "Van entrar a la botiga a treure les capses."
            why: "Ningú havia entrat a la botiga aquella tarda."
      - prompt: "Per què no hi va haver ferits?"
        answer: "Perquè no hi havia ningú a la botiga."
        distractors:
          - text: "Perquè els veïns van apagar el foc."
            why: "El foc el van apagar els bombers, no els veïns."
          - text: "Perquè només es va cremar la rebotiga."
            why: "El foc va començar a la rebotiga, però les flames sortien per la porta."
      - prompt: "Què deia el diari de l'endemà?"
        answer: "Que la botiga ja s'havia cremat una vegada."
        distractors:
          - text: "Que la Carla hi havia comprat un jersei."
            why: "Això ho pensa la Carla, no és el que diu el diari."
          - text: "Que una bombera estava greu a l'hospital."
            why: "La bombera només havia respirat fum i hi era per precaució."
    explanation: "El text explica un incendi en una botiga de Gràcia i com el van apagar."

