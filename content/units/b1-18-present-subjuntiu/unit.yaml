  - id: b1-18-065
    type: reading
    point: comprensio
    lesson: 5
    title: "La festa sorpresa de l'Ibrahim"
    text: |
      L'Ibrahim fa quaranta anys divendres i els amics li preparen una festa sorpresa. La Fàtima vol que tot sigui perfecte: ha comprat un pastís de maduixa, ha convidat vint persones i ha demanat a en Quim que porti el cava. Ningú no li ha dit res a l'Ibrahim; volen que arribi a casa i que trobi tothom al menjador.

      El pla és senzill. La Fàtima demana que els convidats arribin a les set i que portin alguna cosa per picar. També demana que ningú truqui a l'Ibrahim aquella tarda, perquè no sospiti res. En Quim espera que el cava sigui bo: l'ha triat ell mateix.

      «Vull que bufem les espelmes tots junts», diu la Fàtima, «i que després brindem per l'Ibrahim. Tant de bo no plogui i puguem sopar a la terrassa!»

      L'Ibrahim, mentrestant, només vol que divendres sigui un dia tranquil. No sap que els amics li volen fer una abraçada gegant i cridar tots junts: «Per molts anys!»
    questions:
      - prompt: "Per què fan una festa?"
        answer: "Perquè l'Ibrahim fa quaranta anys."
        distractors:
          - text: "Perquè en Quim ha triat un cava."
            why: "El cava és per a la festa, però el motiu és l'aniversari."
          - text: "Perquè estrenen la terrassa."
            why: "Volen sopar a la terrassa, però la festa és per l'aniversari."
      - prompt: "Què ha de portar en Quim?"
        answer: "El cava."
        distractors:
          - text: "El pastís de maduixa."
            why: "El pastís l'ha comprat la Fàtima."
          - text: "Les espelmes."
            why: "Les espelmes són per al pastís; en Quim porta el cava."
      - prompt: "Què demana la Fàtima als convidats?"
        answer: "Que arribin a les set i portin menjar."
        distractors:
          - text: "Que truquin a l'Ibrahim a la tarda."
            why: "Demana just el contrari: que no li truquin."
          - text: "Que portin el pastís."
            why: "El pastís ja l'ha comprat ella."
      - prompt: "Què vol l'Ibrahim per divendres?"
        answer: "Que sigui un dia tranquil."
        distractors:
          - text: "Una festa amb vint persones."
            why: "Això és el que volen els amics, no ell."
          - text: "Un brindis a la terrassa."
            why: "El brindis és idea de la Fàtima."
    explanation: "Els amics preparen una festa sorpresa per als quaranta anys de l'Ibrahim, que no en sap res."
