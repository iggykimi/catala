id: b1-18
level: B1
title: "El present de subjuntiu"
summary: "Aprens les formes del present de subjuntiu (*parli*, *facis*, *vingui*) i a fer-les servir amb *vull que*, *espero que*, *demano que* i *cal que*."
vocabulary_theme: "Desitjos, peticions i celebracions"
points:
  - id: subjuntiu-formes
    title: "Les formes regulars: *parli*, *perdis*, *dormis*"
    refs:
      - label: "GEIEC: El mode subjuntiu"
        url: "https://geiec.iec.cat"
  - id: subjuntiu-irregulars
    title: "Els irregulars: *sigui*, *faci*, *vagi*"
    refs:
      - label: "GEIEC: El mode subjuntiu"
        url: "https://geiec.iec.cat"
  - id: voler-esperar-demanar
    title: "«Vull que vinguis»: *voler*, *esperar*, *demanar* i *caldre*"
    refs:
      - label: "GEIEC: El mode subjuntiu"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: formes que no es poden deduir"
  - id: expressions
    title: "Expressions de desig"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Les formes: regulars i irregulars"
  - title: "Practiquem les formes"
  - title: "«Vull que vinguis»: usos del subjuntiu"
  - title: "Formes que no es poden deduir del castellà"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el desig"
    definition: "Cosa que vols que passi."
    example: "El meu desig és que vinguis a la festa."
  - word: "desitjar"
    definition: "Voler que passi una cosa bona."
    example: "Et desitjo que aprovis l'examen."
  - word: "la petició"
    definition: "Demanda formal d'una cosa."
    example: "Han fet una petició per canviar l'horari."
  - word: "demanar"
    definition: "Dir a algú que vols una cosa."
    example: "Li demano que em truqui demà."
  - word: "esperar"
    definition: "Tenir esperança que una cosa passarà."
    example: "Espero que arribis aviat."
  - word: "la celebració"
    definition: "Festa per un motiu alegre."
    example: "La celebració serà dissabte a casa."
  - word: "celebrar"
    definition: "Fer una festa per un motiu especial."
    example: "Diumenge celebrem l'aniversari del Pau."
  - word: "la festa"
    definition: "Trobada per divertir-se amb gent."
    example: "La festa comença a les vuit del vespre."
  - word: "l'aniversari"
    definition: "Dia en què una persona fa anys."
    example: "Per al seu aniversari vol un llibre."
  - word: "fer anys"
    definition: "Complir un any més de vida."
    example: "La Laia fa anys al març."
  - word: "el pastís"
    definition: "Dolç gran per a les celebracions."
    example: "Vull que el pastís sigui de xocolata."
  - word: "l'espelma"
    definition: "Barra de cera amb foc per al pastís."
    example: "Bufarem les espelmes tots junts."
  - word: "bufar"
    definition: "Treure aire per la boca per apagar el foc."
    example: "El nen bufa les espelmes del pastís."
  - word: "el regal"
    definition: "Cosa que dones a una persona estimada."
    example: "Espero que t'agradi el regal."
  - word: "embolicar"
    definition: "Posar paper al voltant d'un regal."
    example: "Cal que emboliquis el regal abans de sortir."
  - word: "la sorpresa"
    definition: "Cosa inesperada que fa il·lusió."
    example: "Li preparen una festa sorpresa."
  - word: "la invitació"
    definition: "Paper o missatge per convidar algú."
    example: "M'ha arribat la invitació del casament."
  - word: "convidar"
    definition: "Demanar a algú que vingui a un acte."
    example: "Vull que convidis també els veïns."
  - word: "el brindis"
    definition: "Acció d'aixecar la copa per celebrar una cosa."
    example: "Fem un brindis per la Núria!"
  - word: "brindar"
    definition: "Aixecar la copa per celebrar."
    example: "Brindem per la salut dels nuvis."
  - word: "el cava"
    definition: "Vi amb bombolles de les celebracions."
    example: "Cal que portis una ampolla de cava."
  - word: "la copa"
    definition: "Got alt per al cava o el vi."
    example: "Aixeca la copa i demana un desig."
  - word: "el ram"
    definition: "Conjunt de flors per regalar."
    example: "Li han portat un ram de flors."
  - word: "l'abraçada"
    definition: "Gest d'afecte: estrènyer algú amb els braços."
    example: "Espero que em facis una abraçada gran."
  - word: "felicitar"
    definition: "Dir coses bones a algú en un dia especial."
    example: "Li truco per felicitar-la."
  - word: "l'enhorabona"
    definition: "Paraula per felicitar algú."
    example: "Enhorabona! Espero que siguis molt feliç."
  - word: "el casament"
    definition: "Festa quan dues persones es casen."
    example: "El casament serà a la primavera."
  - word: "els nuvis"
    definition: "Les dues persones que es casen."
    example: "Els nuvis volen que hi anem tots."
  - word: "el premi"
    definition: "Cosa que guanya qui ho fa millor."
    example: "Tant de bo guanyis el primer premi!"
  - word: "l'èxit"
    definition: "Resultat bo d'un projecte."
    example: "Li desitjo molt d'èxit a la feina nova."
  - word: "la sort"
    definition: "Cosa bona que passa sense esperar-la."
    example: "Que tinguis molta sort a l'entrevista!"
  - word: "agrair"
    definition: "Donar les gràcies per una cosa."
    example: "T'agraeixo que m'ajudis amb la mudança."
  - word: "el discurs"
    definition: "Paraules que es diuen en públic."
    example: "El director farà un petit discurs."
  - word: "aplaudir"
    definition: "Picar de mans per mostrar alegria."
    example: "Tothom aplaudeix els nuvis."
  - word: "el somni"
    definition: "Cosa que vols aconseguir."
    example: "El seu somni és que els fills vagin a la universitat."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-18-001
    type: choice
    point: subjuntiu-formes
    lesson: 1
    prompt: "Vull que la Laia ___ la porta."
    answer: "tanqui"
    distractors:
      - text: "tanca"
        why: "*Tanca* és indicatiu. Darrere de *vull que* cal el subjuntiu: *tanqui*."
      - text: "tanquis"
        why: "*Tanquis* és per a *tu*. «La Laia» és tercera persona: *tanqui*."
    explanation: "«La Laia» és tercera persona: *tanqui*. Davant de *i*, la *c* s'escriu *qu*."

  - id: b1-18-002
    type: choice
    point: subjuntiu-formes
    lesson: 1
    prompt: "Vols que jo ___ el pa?"
    answer: "compri"
    distractors:
      - text: "compro"
        why: "*Compro* és indicatiu. Darrere de *vols que* cal *compri*."
      - text: "compra"
        why: "*Compra* és per a *ell* (o una ordre). Per a *jo*: *compri*."
    explanation: "«Jo» fa *compri*. *Compra* és de *ell* o l'imperatiu."

  - id: b1-18-003
    type: choice
    point: subjuntiu-formes
    lesson: 1
    prompt: "Cal que els nens ___ vuit hores."
    answer: "dormin"
    distractors:
      - text: "dormen"
        why: "*Dormen* és indicatiu. Darrere de *cal que* cal *dormin*."
      - text: "dormiu"
        why: "*Dormiu* és per a *vosaltres*. «Els nens» és tercera persona plural: *dormin*."
    explanation: "«Els nens» és tercera persona plural: *dormin*."

  - id: b1-18-004
    type: choice
    point: subjuntiu-formes
    lesson: 1
    prompt: "—Vull que em ___ per l'aniversari. —I tant!"
    answer: "felicitis"
    distractors:
      - text: "felicites"
        why: "*Felicites* és indicatiu. Darrere de *vull que* cal *felicitis*."
      - text: "feliciti"
        why: "Parles amb *tu*: *felicitis*. *Feliciti* és per a *ell*."
    explanation: "Parles amb l'altra persona (*tu*): *felicitis*."

  - id: b1-18-005
    type: choice
    point: subjuntiu-formes
    lesson: 1
    prompt: "Voleu que nosaltres ___ el cava?"
    answer: "obrim"
    distractors:
      - text: "obren"
        why: "*Obren* és per a *ells*. «Nosaltres» fa *obrim*."
      - text: "obriu"
        why: "*Obriu* és per a *vosaltres*. «Nosaltres» fa *obrim*."
    explanation: "«Nosaltres» fa *obrim*, igual que en indicatiu."

  - id: b1-18-006
    type: choice
    point: subjuntiu-irregulars
    lesson: 1
    prompt: "Vull que la festa ___ perfecta."
    answer: "sigui"
    distractors:
      - text: "sea"
        why: "«Sea» és castellà. En català: *sigui*."
      - text: "sigues"
        why: "*Sigues* és l'imperatiu. Darrere de *vull que* cal *sigui*."
    explanation: "*Ser* és irregular: el subjuntiu és *sigui*."

  - id: b1-18-007
    type: choice
    point: subjuntiu-irregulars
    lesson: 1
    prompt: "Vull que en Pau ___ demà."
    answer: "vingui"
    distractors:
      - text: "venga"
        why: "«Venga» és castellà. En català: *vingui*."
      - text: "ve"
        why: "*Ve* és indicatiu. Darrere de *vull que* cal *vingui*."
    explanation: "*Venir* és irregular: el subjuntiu (*ell*) és *vingui*."

  - id: b1-18-008
    type: choice
    point: subjuntiu-irregulars
    lesson: 1
    prompt: "Vols que jo ___ el discurs?"
    answer: "faci"
    distractors:
      - text: "haga"
        why: "«Haga» és castellà. En català: *faci*."
      - text: "faig"
        why: "*Faig* és indicatiu. Darrere de *vols que* cal *faci*."
    explanation: "*Fer* és irregular: el subjuntiu (*jo*) és *faci*."

  - id: b1-18-009
    type: choice
    point: subjuntiu-irregulars
    lesson: 1
    prompt: "Cal que tu ___ la invitació."
    answer: "tinguis"
    distractors:
      - text: "tengas"
        why: "«Tengas» és castellà. En català: *tinguis*."
      - text: "tingues"
        why: "*Tingues* és l'imperatiu. Darrere de *cal que* cal *tinguis*."
    explanation: "El subjuntiu de *tenir* (*tu*) és *tinguis*."

  - id: b1-18-010
    type: choice
    point: subjuntiu-irregulars
    lesson: 1
    prompt: "Vull que vosaltres ___ la veritat."
    answer: "sapigueu"
    distractors:
      - text: "sabeu"
        why: "*Sabeu* és indicatiu. Darrere de *vull que* cal *sapigueu*."
      - text: "sàpiguen"
        why: "*Sàpiguen* és per a *ells*. «Vosaltres» fa *sapigueu*."
    explanation: "El subjuntiu de *saber* (*vosaltres*) és *sapigueu*."

  - id: b1-18-011
    type: inline-choice
    point: subjuntiu-formes
    lesson: 1
    title: "Missatge al grup de la festa"
    text: "Hola! Dissabte fem la festa. Vull que la Laia {compri|compra|compris} el pastís i que en Pau {porti|porta|portis} el cava. Cal que tothom {arribi|arriba|arribin} a les vuit. Voleu que jo {truqui|truca|truquis} als veïns?"
    explanation: "Són subjuntius regulars: *compri*, *porti*, *arribi* i *truqui*. *Tothom* és singular."

  - id: b1-18-012
    type: inline-choice
    point: subjuntiu-irregulars
    lesson: 1
    title: "Desitjos per a l'any nou"
    text: "Enguany vull que {siguis|ets|sigues} feliç i que {tinguis|tens|tingues} salut. Desitjo que {puguem|podem|pugueu} viatjar molt i que tot {vagi|va|vagin} bé."
    explanation: "*Siguis*, *tinguis*, *puguem* i *vagi* són formes irregulars que cal memoritzar."

  - id: b1-18-013
    type: match
    point: subjuntiu-irregulars
    lesson: 1
    instruction: "Relaciona cada verb amb el seu subjuntiu (*jo*)."
    pairs:
      - ["ser", "sigui"]
      - ["fer", "faci"]
      - ["anar", "vagi"]
      - ["tenir", "tingui"]
      - ["poder", "pugui"]
      - ["voler", "vulgui"]
    explanation: "Són els irregulars més freqüents. La primera persona no s'assembla a l'indicatiu."

  # ---------------- Lliçó 2 ----------------
  - id: b1-18-014
    type: fill
    point: subjuntiu-formes
    lesson: 2
    prompt: "Vull que la Carla ___ amb el ram."
    hint: "*arribar*, ella"
    answers: ["arribi"]
    wrong_answers:
      - text: "arriba"
        why: "*Arriba* és indicatiu. Darrere de *vull que* cal *arribi*."
      - text: "arribis"
        why: "*Arribis* és per a *tu*. «La Carla» és tercera persona: *arribi*."
    grading: tolerant
    explanation: "«La Carla» és tercera persona: *arribi*."

  - id: b1-18-015
    type: fill
    point: subjuntiu-formes
    lesson: 2
    prompt: "Cal que vosaltres ___ la porta amb clau."
    hint: "*tancar*, vosaltres"
    answers: ["tanqueu"]
    wrong_answers:
      - text: "tanquen"
        why: "*Tanquen* és per a *ells*. «Vosaltres» fa *tanqueu*."
      - text: "tanquem"
        why: "*Tanquem* és per a *nosaltres*. «Vosaltres» fa *tanqueu*."
    grading: tolerant
    explanation: "«Vosaltres» fa *tanqueu*: la *c* s'escriu *qu*."

  - id: b1-18-016
    type: fill
    point: subjuntiu-formes
    lesson: 2
    prompt: "Vols que jo ___ el regal?"
    hint: "*embolicar*, jo"
    answers: ["emboliqui"]
    wrong_answers:
      - text: "embolico"
        why: "*Embolico* és indicatiu. Darrere de *vols que* cal *emboliqui*."
      - text: "emboliquis"
        why: "*Emboliquis* és per a *tu*. Amb *jo*: *emboliqui*."
    grading: tolerant
    explanation: "El subjuntiu del verb *embolicar* (*jo*) és *emboliqui*: la *c* s'escriu *qu*."

  - id: b1-18-017
    type: fill
    point: subjuntiu-formes
    lesson: 2
    prompt: "Vull que els convidats ___ molt fort."
    hint: "*aplaudir*, 3a plural"
    answers: ["aplaudeixin"]
    wrong_answers:
      - text: "aplaudeixen"
        why: "*Aplaudeixen* és indicatiu. En subjuntiu, *ells* fan *aplaudeixin*."
      - text: "aplaudeixi"
        why: "*Aplaudeixi* és singular. «Els convidats» és plural: *aplaudeixin*."
    grading: tolerant
    explanation: "*Aplaudir* és incoatiu: conserva *-eix-*. «Els convidats» fa *aplaudeixin*."

  - id: b1-18-018
    type: order
    point: subjuntiu-formes
    lesson: 2
    cue: "Vols parlar amb la Laia. Digues que vols una trucada demà."
    chunks: ["vull", "que", "la Laia", "truqui", "demà"]
    extra: ["truca"]
    answers:
      - "Vull que la Laia truqui demà."
      - "Demà vull que la Laia truqui."
    explanation: "El subjuntiu de *trucar* (*ella*) és *truqui*: la *c* es converteix en *qu*."

  - id: b1-18-019
    type: choice
    point: subjuntiu-formes
    lesson: 2
    prompt: "Tothom vol que nosaltres ___ l'enhorabona del director."
    answer: "rebem"
    distractors:
      - text: "reben"
        why: "*Reben* és per a *ells*. «Nosaltres» fa *rebem*."
      - text: "rebeu"
        why: "*Rebeu* és per a *vosaltres*. «Nosaltres» fa *rebem*."
    explanation: "«Nosaltres» fa *rebem*, igual que en indicatiu."

  - id: b1-18-020
    type: fill
    point: subjuntiu-irregulars
    lesson: 2
    prompt: "El somni d'en Pau és que la Núria ___ venir."
    hint: "*poder*, ella"
    answers: ["pugui"]
    wrong_answers:
      - text: "pueda"
        why: "«Pueda» és castellà. En català: *pugui*."
      - text: "pot"
        why: "*Pot* és indicatiu. Un desig demana el subjuntiu: *pugui*."
    grading: tolerant
    explanation: "El subjuntiu de *poder* (*ella*) és *pugui*."

  - id: b1-18-021
    type: fill
    point: subjuntiu-irregulars
    lesson: 2
    prompt: "Vull que tu ___ paciència."
    hint: "*tenir*, tu"
    answers: ["tinguis"]
    wrong_answers:
      - text: "tengas"
        why: "«Tengas» és castellà. En català: *tinguis*."
      - text: "tingues"
        why: "*Tingues* és l'imperatiu. Darrere de *vull que* cal *tinguis*."
    grading: tolerant
    explanation: "El subjuntiu de *tenir* (*tu*) és *tinguis*."

  - id: b1-18-022
    type: fill
    point: subjuntiu-irregulars
    lesson: 2
    prompt: "Cal que hi ___ cadires per a tothom."
    hint: "*haver-hi*, subjuntiu"
    answers: ["hagi"]
    wrong_answers:
      - text: "haya"
        why: "«Haya» és castellà. En català: *hagi*."
      - text: "ha"
        why: "*Hi ha* és indicatiu. Darrere de *cal que* cal *hagi*: *hi hagi*."
    grading: tolerant
    explanation: "El subjuntiu del verb *haver-hi* és *hagi*: *cal que hi hagi*."

  - id: b1-18-023
    type: fill
    point: subjuntiu-irregulars
    lesson: 2
    prompt: "Cal que vosaltres ___ resoldre el problema."
    hint: "*saber*, vosaltres"
    answers: ["sapigueu"]
    wrong_answers:
      - text: "sabeu"
        why: "*Sabeu* és indicatiu. Darrere de *cal que* cal *sapigueu*."
      - text: "sàpiguen"
        why: "*Sàpiguen* és per a *ells*. «Vosaltres» fa *sapigueu*."
    grading: tolerant
    explanation: "El subjuntiu de *saber* (*vosaltres*) és *sapigueu*."

  - id: b1-18-024
    type: order
    point: subjuntiu-irregulars
    lesson: 2
    cue: "Vols que tot surti bé a la celebració. Expressa-ho com un desig."
    chunks: ["que", "la festa", "tingui", "èxit"]
    extra: ["tenga"]
    answers:
      - "Que la festa tingui èxit."
    explanation: "Els desitjos comencen amb *que* + subjuntiu: *tingui*. «Tenga» és castellà."

  - id: b1-18-025
    type: order
    point: subjuntiu-irregulars
    lesson: 2
    cue: "Vols que tothom vingui a la festa. Digues-ho amb el verb anar."
    chunks: ["vull", "que", "hi", "vagin", "tots"]
    extra: ["vayan"]
    answers:
      - "Vull que hi vagin tots."
      - "Vull que tots hi vagin."
    explanation: "El subjuntiu del verb *anar* (*ells*) és *vagin*. «Vayan» és castellà."

  - id: b1-18-026
    type: choice
    point: subjuntiu-irregulars
    lesson: 2
    prompt: "Tant de bo ___ bon temps diumenge!"
    answer: "faci"
    distractors:
      - text: "haga"
        why: "«Haga» és castellà. En català: *faci*."
      - text: "fa"
        why: "*Fa* és indicatiu. Darrere de *tant de bo* cal *faci*."
    explanation: "El subjuntiu de *fer* és *faci*. *Tant de bo* sempre porta subjuntiu."

  # ---------------- Lliçó 3 ----------------
  - id: b1-18-027
    type: choice
    point: voler-esperar-demanar
    lesson: 3
    prompt: "—Qui ve a buscar el pastís? —Vull ___ jo mateix."
    answer: "venir"
    distractors:
      - text: "que vingui"
        why: "«Jo mateix» és el mateix subjecte que *vull*: cal l'infinitiu, sense *que*."
      - text: "que vinc"
        why: "Amb el mateix subjecte, *vull* porta infinitiu: *vull venir*."
    explanation: "El subjecte és el mateix (*jo*): *vull venir*, sense *que*."

  - id: b1-18-028
    type: choice
    point: voler-esperar-demanar
    lesson: 3
    prompt: "Vull que la Laia ___ demà a celebrar l'aniversari."
    answer: "vingui"
    distractors:
      - text: "venir"
        why: "«La Laia» no és el mateix subjecte: cal *que* + subjuntiu: *vingui*."
      - text: "ve"
        why: "*Ve* és indicatiu. Amb dos subjectes diferents: *que vingui*."
    explanation: "Dos subjectes diferents (*jo, la Laia*): *vull que vingui*."

  - id: b1-18-029
    type: choice
    point: voler-esperar-demanar
    lesson: 3
    prompt: "Et demano que tu em ___ demà."
    answer: "truquis"
    distractors:
      - text: "truques"
        why: "*Truques* és indicatiu. Darrere de *demanar que* cal *truquis*."
      - text: "truqui"
        why: "*Truqui* és per a *ell*. «Tu» fa *truquis*."
    explanation: "«Tu» fa *truquis*. *Demanar que* porta subjuntiu."

  - id: b1-18-030
    type: choice
    point: voler-esperar-demanar
    lesson: 3
    prompt: "Cal que en Pau ___ el regal al casament."
    answer: "porti"
    distractors:
      - text: "porta"
        why: "*Porta* és indicatiu. Darrere de *cal que* cal *porti*."
      - text: "portin"
        why: "*Portin* és plural. «En Pau» és singular: *porti*."
    explanation: "«En Pau» és tercera persona: *porti*."

  - id: b1-18-031
    type: fill
    point: voler-esperar-demanar
    lesson: 3
    prompt: "Voleu que jo ___ les copes?"
    hint: "*portar*, jo"
    answers: ["porti"]
    wrong_answers:
      - text: "porto"
        why: "*Porto* és indicatiu. Darrere de *voleu que* cal *porti*."
      - text: "portin"
        why: "*Portin* és plural. «Jo» fa *porti*."
    grading: tolerant
    explanation: "«Jo» fa *porti*."

  - id: b1-18-032
    type: fill
    point: voler-esperar-demanar
    lesson: 3
    prompt: "Li han demanat que ___ la invitació."
    hint: "*agrair*, ell"
    answers: ["agraeixi"]
    wrong_answers:
      - text: "agraeix"
        why: "*Agraeix* és indicatiu. Darrere de *demanar que* cal *agraeixi*."
      - text: "agraeixin"
