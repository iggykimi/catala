  - id: b2-48-064
    type: reading
    point: comprensio
    lesson: 5
    title: "Una visita al Museu d'Arqueologia"
    text: |
      La Núria i en Pau passen un dissabte al Museu d'Arqueologia de Barcelona. La Núria és metgessa, però l'apassiona la història; en Pau és mestre i prepara una visita amb els alumnes de la seva escola.

      Comencen per la sala de la prehistòria. En una vitrina hi ha un fòssil de dinosaure, eines de pedra i els ossos d'un animal gegant. «Aquests ossos tenen més de deu mil anys», explica la guia. La Núria ho apunta amb un llapis a la seva llibreta. La llum de la sala és tènue perquè la claredat forta fa malbé les peces antigues.

      La segona sala és la de l'imperi romà: un terra de mosaic protegit per un vidre, vasos de ceràmica, monedes, la tapa d'una tomba i una inscripció que parla d'un temple. També hi ha una foto de l'aqüeducte de Tarragona i una maqueta de l'amfiteatre. En Pau s'atura davant d'una estàtua sense braços. «La fi de l'imperi va ser un temps de grans canvis», llegeix en un plafó.

      La sala de l'edat mitjana mostra una pedra de la muralla romana, la maqueta d'un castell, una creu de la catedral de Girona, manuscrits en pergamí i la corona i el tron d'un rei del segle XII. Una carta del rei explica com era la vida al seu regne. La guia explica que la restauració d'una peça pot durar mesos: cal treure la pols, conservar els colors i datar cada resta amb cura. L'equip de l'arqueòloga Laia excava cada estiu a Empúries i porta les troballes al museu.

      Abans de sortir, visiten l'exposició del tresor iber, la peça més famosa de la col·lecció: un conjunt de joies que va passar a la història quan un pagès el va treure a la llum l'any 1932. «Aquest museu és de tota la vida», diu la Núria, «i cada visita hi descobreixo una peça nova». En Pau compra un llibre de llegendes per als alumnes i surten al jardí, on uns nens fan volar la cometa.
    questions:
      - prompt: "Per què visiten el museu, la Núria i en Pau?"
        answer: "Ella hi va per afició i ell prepara una visita escolar."
        distractors:
          - text: "Tots dos hi treballen com a guies."
            why: "La Núria és metgessa i en Pau és mestre; els guies són altres persones."
          - text: "Volen excavar amb l'equip de la Laia."
            why: "L'equip de la Laia excava a Empúries; ells només visiten el museu."
      - prompt: "Què hi ha a la sala de la prehistòria?"
        answer: "Un fòssil, eines de pedra i ossos antics."
        distractors:
          - text: "Mosaics, monedes i una inscripció."
            why: "Això és a la sala de l'imperi romà."
          - text: "La maqueta d'un castell i manuscrits."
            why: "Això és a la sala de l'edat mitjana."
      - prompt: "Què explica la guia sobre la restauració?"
        answer: "Que pot durar mesos i cal tractar cada peça amb cura."
        distractors:
          - text: "Que es fa en un sol dia amb màquines noves."
            why: "El text diu que pot durar mesos."
          - text: "Que només cal per a les peces romanes."
            why: "La guia parla de la restauració en general, no només de Roma."
      - prompt: "Com es va descobrir el tresor iber?"
        answer: "El va trobar un pagès l'any 1932."
        distractors:
          - text: "El va portar l'equip de la Laia des d'Empúries."
            why: "L'equip porta les troballes d'Empúries, però el tresor el va trobar un pagès."
          - text: "El van trobar uns nens al jardí."
            why: "Els nens del jardí fan volar la cometa; el tresor el va trobar un pagès."
    explanation: "La Núria i en Pau visiten el museu: hi veuen la prehistòria, Roma, l'edat mitjana i el tresor iber."

