id: b2-48
level: B2
title: "Morfologia del nom i de l'adjectiu"
summary: "Femenins i plurals irregulars, noms que canvien de sentit segons el gènere i professions en femení, amb història, patrimoni i arqueologia."
vocabulary_theme: "Història, patrimoni i arqueologia"
points:
  - id: femenins-irregulars
    title: "Femenins irregulars: actriu, metgessa, arqueòloga"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: plurals-irregulars
    title: "Plurals irregulars: gossos, braços, llapis"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: genere-i-significat
    title: "El gènere canvia el significat: el fi / la fi"
    refs:
      - label: "GEIEC"
        url: "https://geiec.iec.cat"
  - id: compte-metgessa
    title: "Compte amb el castellà: la metgessa"
    refs:
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions amb història"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: femenins i plurals"
  - title: "Practicar femenins i plurals"
  - title: "El gènere i el significat"
  - title: "Produir: canviar gènere i nombre"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el jaciment"
    definition: "Terreny on hi ha restes antigues i on treballen els arqueòlegs."
    example: "El jaciment d'Empúries rep milers de visitants cada any."
  - word: "l'excavació"
    definition: "Feina de treure terra per trobar i estudiar restes antigues."
    example: "L'excavació d'aquest estiu ha tret a la llum un temple."
  - word: "excavar"
    definition: "Treure terra amb cura per trobar restes antigues."
    example: "Cada juliol excaven una zona nova del poblat iber."
  - word: "les restes"
    definition: "Allò que queda d'una construcció o d'una època passada."
    example: "Les restes de la muralla es veuen des de la carretera."
  - word: "el fòssil"
    definition: "Resta d'un animal o d'una planta de fa milers d'anys, conservada en la pedra."
    example: "Al museu hi ha un fòssil de dinosaure de dos metres."
  - word: "la ceràmica"
    definition: "Objectes fets de fang cuit, com plats, vasos i gerres."
    example: "Han datat la ceràmica trobada a la tomba."
  - word: "el mosaic"
    definition: "Dibuix fet amb pedretes de colors enganxades a terra o a la paret."
    example: "El mosaic de l'entrada mostra dos gossos."
  - word: "la muralla"
    definition: "Paret alta de pedra que protegia una ciutat antiga."
    example: "La muralla restaurada es pot visitar a peu."
  - word: "el castell"
    definition: "Edifici fort de pedra on vivien els senyors medievals."
    example: "Des del castell es veu tot el poble."
  - word: "el monestir"
    definition: "Edifici on viu una comunitat de monjos."
    example: "El comte i la comtessa van fundar el monestir l'any 1150."
  - word: "la catedral"
    definition: "Església principal d'una ciutat, normalment molt gran."
    example: "La creu de la catedral de Girona és d'argent."
  - word: "el museu"
    definition: "Edifici on es guarden i s'exposen peces d'art o d'història."
    example: "El museu tanca els dilluns al matí."
  - word: "la vitrina"
    definition: "Armari de vidre on s'exposen objectes delicats."
    example: "Els pesos de teler són a la vitrina petita."
  - word: "la peça"
    definition: "Cada objecte d'una col·lecció o d'una exposició."
    example: "La restauració d'una peça pot durar mesos."
  - word: "la col·lecció"
    definition: "Conjunt d'objectes de valor que es guarden i s'exposen junts."
    example: "El tresor iber és la peça més famosa de la col·lecció."
  - word: "el patrimoni"
    definition: "Conjunt de béns històrics i culturals que cal protegir."
    example: "Aquesta llei vol protegir el patrimoni del poble."
  - word: "la restauració"
    definition: "Feina de reparar una obra antiga perquè torni al seu estat original."
    example: "La restauració del retaule ha durat sis mesos."
  - word: "conservar"
    definition: "Mantenir una cosa en bon estat perquè no es faci malbé."
    example: "Cal conservar els colors originals del quadre."
  - word: "el segle"
    definition: "Període de cent anys."
    example: "Les monedes són del segle III."
  - word: "l'edat mitjana"
    definition: "Època de la història entre els segles V i XV."
    example: "La sala de l'edat mitjana té una maqueta d'un castell."
  - word: "medieval"
    definition: "De l'edat mitjana o que hi té relació."
    example: "Han publicat unes cartes medievals inèdites."
  - word: "antic, antiga"
    definition: "De fa molt de temps."
    example: "Guarden les eines antigues en un magatzem."
  - word: "l'imperi"
    definition: "Conjunt de terres governades per un emperador."
    example: "La fi de l'imperi va ser un temps de grans canvis."
  - word: "el regne"
    definition: "Territori governat per un rei."
    example: "Una carta del rei explica com era la vida al seu regne."
  - word: "la corona"
    definition: "Joia d'or que porten els reis al cap."
    example: "La corona i el tron són del segle XII."
  - word: "el tron"
    definition: "Cadira de luxe on seu el rei en els actes importants."
    example: "El tron del rei presideix la sala."
  - word: "el manuscrit"
    definition: "Text antic escrit a mà."
    example: "Els manuscrits en pergamí es conserven a la sala fosca."
  - word: "el pergamí"
    definition: "Pell d'animal preparada per escriure-hi, que es feia servir abans del paper."
    example: "Aquest pergamí té més de vuit-cents anys."
  - word: "la inscripció"
    definition: "Text gravat en pedra o en metall."
    example: "La inscripció de la porta parla d'un temple."
  - word: "l'arqueòleg, l'arqueòloga"
    definition: "Persona que excava i estudia les restes del passat."
    example: "L'arqueòloga Laia dirigeix la visita guiada."
  - word: "la tomba"
    definition: "Lloc on s'enterra una persona morta."
    example: "A la tomba hi havia dos cranis i diversos ossos."
  - word: "el temple"
    definition: "Edifici on es fan cerimònies religioses."
    example: "L'excavació ha tret a la llum un temple romà."
  - word: "l'amfiteatre"
    definition: "Edifici romà ovalat amb grades per als espectacles."
    example: "A la sala hi ha una maqueta de l'amfiteatre de Tarragona."
  - word: "l'aqüeducte"
    definition: "Construcció que portava l'aigua a les ciutats romanes."
    example: "L'aqüeducte de Tarragona també es diu el Pont del Diable."
  - word: "la moneda"
    definition: "Peça de metall que es fa servir com a diners."
    example: "Cada moneda antiga explica una història."
  - word: "el tresor"
    definition: "Conjunt de joies o monedes de gran valor, sovint amagat."
    example: "Un pagès va trobar el tresor l'any 1932."
  - word: "la llegenda"
    definition: "Història antiga que barreja fets reals i fantasia."
    example: "En Pau ha comprat un llibre de llegendes per als alumnes."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-48-001
    type: choice
    point: femenins-irregulars
    lesson: 1
    prompt: "La Laia és la millor ___ de l'equip del jaciment."
    answer: "arqueòloga"
    distractors:
      - text: "arqueòleg"
        why: "És masculí. «La millor» i «la Laia» demanen el femení: *arqueòloga*."
      - text: "arqueòlega"
        why: "Els noms en *-òleg* fan el femení en *-òloga*: *arqueòloga*, no *arqueòlega*."
    explanation: "«La millor» i «la Laia» demanen el femení: *arqueòleg* fa *arqueòloga*."

  - id: b2-48-002
    type: choice
    point: femenins-irregulars
    lesson: 1
    prompt: "Teodora va ser ___ de Bizanci."
    answer: "emperadriu"
    distractors:
      - text: "emperadora"
        why: "*Emperador* fa el femení irregular *emperadriu*."
      - text: "emperatriz"
        why: "«Emperatriz» és castellà. En català: *emperadriu*."
    explanation: "Teodora va governar l'imperi: *emperador* fa *emperadriu*."

  - id: b2-48-003
    type: choice
    point: femenins-irregulars
    lesson: 1
    prompt: "A l'obra del festival romà, la protagonista és una ___ molt coneguda."
    answer: "actriu"
    distractors:
      - text: "actora"
        why: "*Actor* fa el femení irregular *actriu*."
      - text: "actor"
        why: "És masculí. «Una» i «protagonista» demanen el femení: *actriu*."
    explanation: "La protagonista és una dona: *actor* fa *actriu*."

  - id: b2-48-004
    type: choice
    point: plurals-irregulars
    lesson: 1
    prompt: "Al mosaic de l'entrada de la vil·la hi ha dos ___."
    answer: "gossos"
    distractors:
      - text: "gosos"
        why: "*Gos* fa el plural amb doble essa: *gossos*."
      - text: "gos"
        why: "«Dos» demana el plural: *gossos*."
    explanation: "Els noms com *gos* fan el plural en *-ssos*: un gos, dos *gossos*."

  - id: b2-48-005
    type: choice
    point: plurals-irregulars
    lesson: 1
    prompt: "L'estàtua va aparèixer sense ___."
    answer: "braços"
    distractors:
      - text: "braçs"
        why: "Davant de la *o* del plural, la *ç* esdevé *c*: *braços*."
      - text: "braçsos"
        why: "La *ç* no es manté davant de *o*: el plural de *braç* és *braços*."
    explanation: "Els noms en *-ç* fan el plural en *-ços*: un braç, dos *braços*."

  - id: b2-48-006
    type: choice
    point: plurals-irregulars
    lesson: 1
    prompt: "L'arqueòleg sempre porta dos ___ a la butxaca per dibuixar."
    answer: "llapis"
    distractors:
      - text: "llapisos"
        why: "Els noms acabats en *-s* àtona no canvien: un llapis, dos *llapis*."
      - text: "llapissos"
        why: "*Llapis* és invariable en plural: un llapis, dos *llapis*."
    explanation: "*Llapis* acaba en *-s* àtona i no canvia: un llapis, dos *llapis*."

  - id: b2-48-007
    type: match
    point: femenins-irregulars
    lesson: 1
    instruction: "Relaciona cada masculí amb el seu femení."
    pairs:
      - ["actor", "actriu"]
      - ["poeta", "poetessa"]
      - ["jutge", "jutgessa"]
      - ["metge", "metgessa"]
      - ["arqueòleg", "arqueòloga"]
    explanation: "Són femenins irregulars: *actriu*, *poetessa*, *jutgessa*, *metgessa* i *arqueòloga*. Cal memoritzar-los."

  - id: b2-48-008
    type: match
    point: plurals-irregulars
    lesson: 1
    instruction: "Relaciona cada singular amb el seu plural."
    pairs:
      - ["el gos", "els gossos"]
      - ["el mes", "els mesos"]
      - ["el braç", "els braços"]
      - ["el llapis", "els llapis"]
      - ["el tros", "els trossos"]
      - ["el nas", "els nassos"]
    explanation: "Cada nom té el seu plural: *gossos*, *mesos*, *braços*, *llapis*, *trossos* i *nassos*."

  - id: b2-48-009
    type: inline-choice
    point: plurals-irregulars
    lesson: 1
    title: "La nova sala"
    text: "A la nova sala hi trobareu {braços|braçs|braçsos} d'estàtues romanes, un mosaic amb dos {gossos|gosos|gos}, tres {vasos|vassos|vas} de ceràmica i diversos {trossos|trosos|tros} de motllures antigues."
    explanation: "Els plurals són *braços* (la *ç* esdevé *c*), *gossos* i *trossos* (amb doble essa) i *vasos* (amb una essa)."

  - id: b2-48-010
    type: fill
    point: femenins-irregulars
    lesson: 1
    prompt: "La ___ va ordenar protegir el jaciment."
    hint: "JUTGE, en femení"
    answers: ["jutgessa"]
    wrong_answers:
      - text: "jutgesa"
        why: "S'escriu amb doble essa: *jutgessa*."
      - text: "jutja"
        why: "El femení de *jutge* és irregular: *jutgessa*."
    grading: tolerant
    explanation: "Qui ordena és una dona: el femení de *jutge* és *jutgessa*."

  - id: b2-48-011
    type: fill
    point: femenins-irregulars
    lesson: 1
    prompt: "Per als grecs, Atena era la ___ de la saviesa."
    hint: "DÉU, en femení"
    answers: ["deessa"]
    wrong_answers:
      - text: "diosa"
        why: "«Diosa» és castellà. En català: *deessa*."
      - text: "deesa"
        why: "S'escriu amb doble essa: *deessa*."
    grading: tolerant
    explanation: "Atena és una divinitat femenina: *déu* fa el femení *deessa*."

  - id: b2-48-012
    type: fill
    point: plurals-irregulars
    lesson: 1
    prompt: "Els treballs duraran dos ___."
    hint: "MES, en plural"
    answers: ["mesos"]
    wrong_answers:
      - text: "messos"
        why: "*Mes* fa el plural amb una sola essa: *mesos*."
    grading: strict
    explanation: "El plural de *mes* és *mesos*, amb una sola essa."

  - id: b2-48-013
    type: order
    point: plurals-irregulars
    lesson: 1
    cue: "Digues que al calaix hi ha tres objectes per dibuixar."
    chunks: ["Al calaix", "hi ha", "tres", "llapis"]
    extra: ["llapisos"]
    answers:
      - "Al calaix hi ha tres llapis."
      - "Hi ha tres llapis al calaix."
    explanation: "*Llapis* no canvia en plural: cal dir *tres llapis*, no *llapisos*."

  # ---------- Lliçó 2 ----------
  - id: b2-48-014
    type: fill
    point: femenins-irregulars
    lesson: 2
    prompt: "L'___ de Tarragona ha inaugurat l'exposició."
    hint: "ALCALDE, en femení"
    answers: ["alcaldessa"]
    wrong_answers:
      - text: "alcaldesa"
        why: "«Alcaldesa» és castellà. En català, amb doble essa: *alcaldessa*."
      - text: "alcalda"
        why: "El femení de *alcalde* no es fa en *-a*: *alcaldessa*."
    grading: tolerant
    explanation: "En femení, *alcalde* fa *alcaldessa*, amb doble essa."

  - id: b2-48-015
    type: fill
    point: femenins-irregulars
    lesson: 2
    prompt: "La ___ del conte té poders màgics."
    hint: "PRÍNCEP, en femení"
    answers: ["princesa"]
    wrong_answers:
      - text: "princepa"
        why: "El femení de *príncep* és irregular: *princesa*."
      - text: "príncep"
        why: "És masculí. «La» demana el femení: *princesa*."
    grading: tolerant
    explanation: "La protagonista és una dona: el femení de *príncep* és *princesa*."

  - id: b2-48-016
    type: choice
    point: femenins-irregulars
    lesson: 2
    prompt: "A la llegenda, la noia que salva el poble del drac és l'___."
    answer: "heroïna"
    distractors:
      - text: "heroina"
        why: "S'escriu amb dièresi: *heroïna*."
      - text: "heroa"
        why: "*Heroi* fa *heroïna*."
    explanation: "Qui salva el poble és una noia: *heroi* fa *heroïna*, amb dièresi."

  - id: b2-48-017
    type: choice
    point: femenins-irregulars
    lesson: 2
    prompt: "El comte Berenguer i la ___ van fundar el monestir l'any 1150."
    answer: "comtessa"
    distractors:
      - text: "comta"
        why: "El femení de *comte* és irregular: *comtessa*."
      - text: "condesa"
        why: "«Condesa» és castellà. En català: *comtessa*."
    explanation: "L'esposa del comte és la *comtessa*: el femení de *comte* és irregular."

  - id: b2-48-018
    type: fill
    point: plurals-irregulars
    lesson: 2
    prompt: "De la porta a l'altar hi ha vint ___."
    hint: "PAS, en plural"
    answers: ["passos"]
    wrong_answers:
      - text: "pasos"
        why: "«Pasos» és la forma castellana. En català, amb doble essa: *passos*."
    grading: strict
    explanation: "El plural de *pas* és *passos*, amb doble essa."

  - id: b2-48-019
    type: fill
    point: plurals-irregulars
    lesson: 2
    prompt: "Han trobat dos ___ de ceràmica pintada."
    hint: "TROS, en plural"
    answers: ["trossos"]
    wrong_answers:
      - text: "trosos"
        why: "*Tros* fa el plural amb doble essa: *trossos*."
    grading: strict
    explanation: "El plural de *tros* és *trossos*, amb doble essa."

  - id: b2-48-020
    type: choice
    point: plurals-irregulars
    lesson: 2
    prompt: "Els arqueòlegs han datat els ___ trobats a la tomba."
    answer: "ossos"
    distractors:
      - text: "osos"
        why: "*Os* fa el plural amb doble essa: *ossos*."
      - text: "òssos"
        why: "*Os* s'escriu sense accent: *ossos*."
    explanation: "*Os* fa el plural *ossos*, amb doble essa i sense accent."

  - id: b2-48-021
    type: order
    point: femenins-irregulars
    lesson: 2
    cue: "Presenta la Núria: és la doctora nova del poble."
    chunks: ["La Núria", "és", "la metgessa", "nova", "del poble"]
    extra: ["metga"]
    answers:
      - "La Núria és la metgessa nova del poble."
      - "La metgessa nova del poble és la Núria."
    explanation: "La Núria és una dona: el femení de *metge* és *metgessa*, no *metga*."

  - id: b2-48-022
    type: order
    point: plurals-irregulars
    lesson: 2
    cue: "Digues que els objectes de fang del teler són a la vitrina petita."
    chunks: ["Els pesos de teler", "són", "a la vitrina", "petita"]
    extra: ["pessos"]
    answers:
      - "Els pesos de teler són a la vitrina petita."
      - "A la vitrina petita són els pesos de teler."
    explanation: "El plural de *pes* és *pesos*, amb una sola essa."

  - id: b2-48-023
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «fer història»?"
    answer: "Aconseguir una fita que tothom recordarà."
    distractors:
      - text: "Estudiar història a la universitat."
        why: "Aquest és el sentit literal de la paraula; l'expressió és figurada."
      - text: "Explicar una història molt llarga."
        why: "Explicar no és fer: l'expressió parla d'una fita memorable."
    explanation: "«Fer història» és aconseguir una fita tan gran que tothom la recordarà."

  - id: b2-48-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "—La Laia ha descobert un mosaic intacte. —Sí, ___."
    answer: "ha fet història"
    distractors:
      - text: "ha fet tard"
        why: "Vol dir arribar tard; no té res a veure amb el descobriment."
      - text: "ha tret foc pels queixals"
        why: "Vol dir enfadar-se molt; aquí cal celebrar el descobriment."
    explanation: "Un descobriment excepcional és una fita memorable: la Laia *ha fet història*."

  - id: b2-48-025
    type: inline-choice
    point: femenins-irregulars
    lesson: 2
    title: "Notícies del patrimoni"
    text: "La {jutgessa|jutja|jutgesa} ha ordenat aturar les obres del pàrquing i la nova {alcaldessa|alcalda|alcaldesa} ha promès més diners per al museu. La {poetessa|poetisa|poetesa} local llegirà versos a la inauguració i l'{arqueòloga|arqueòleg|arqueòlega} Laia dirigirà la visita guiada."
    explanation: "Els femenins són *jutgessa*, *alcaldessa*, *poetessa* i *arqueòloga*: tots són irregulars."

  # ---------- Lliçó 3 ----------
  - id: b2-48-026
    type: choice
    point: genere-i-significat
    lesson: 3
    prompt: "___ dels nadons és molt lleuger."
    answer: "El son"
    distractors:
      - text: "La son"
        why: "*La son* és la gana de dormir. El dormir, com a període, és *el son*."
      - text: "Els sons"
        why: "El verb («és») i l'adjectiu («lleuger») són en singular: *el son*."
    explanation: "El dormir dels nadons és *el son*, en masculí. *La son* és la gana de dormir."

  - id: b2-48-027
    type: choice
    point: genere-i-significat
    lesson: 3
    prompt: "Quina frase parla de la claredat, no de l'aparell?"
    answer: "La llum del matí entra per la finestra."
    distractors:
      - text: "El llum del sostre no funciona."
        why: "Parla de l'aparell, que és masculí: *el llum*."
      - text: "Els llums del carrer són nous."
        why: "Parla dels aparells del carrer, en masculí."
    explanation: "La claredat és *la llum*, en femení. L'aparell és *el llum*, en masculí."

  - id: b2-48-028
    type: choice
    point: genere-i-significat
    lesson: 3
    prompt: "«Els llums de la sala» són ___."
    answer: "els aparells que il·luminen la sala"
    distractors:
      - text: "la claredat que entra per les finestres"
        why: "La claredat és *la llum*, en femení i en singular."
      - text: "els quadres penjats a la paret"
        why: "Els quadres no són llums."
    explanation: "En plural i en masculí, *els llums* són els aparells que fan llum."

  - id: b2-48-029
    type: choice
    point: genere-i-significat
    lesson: 3
    prompt: "___ d'aquesta llei és protegir el patrimoni."
    answer: "El fi"
    distractors:
      - text: "La fi"
        why: "*La fi* és l'acabament. L'objectiu és *el fi*."
      - text: "La fin"
        why: "«Fin» és castellà. En català: *el fi* o *la fi*, segons el sentit."
