id: b1-17
level: B1
title: "Combinacions de dos pronoms"
summary: "Aprens a combinar dos pronoms (*me'l*, *l'hi*, *n'hi*) i a posar-los amb l'infinitiu i l'imperatiu (*dona-me'l*, *vull donar-te-la*)."
vocabulary_theme: "Préstecs, favors i serveis"
points:
  - id: combinacions-ordre
    title: "Ordre i formes: *me'l*, *te la*, *ens ho*, *se'ls*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: li-cd
    title: "*Li* + *el/la/els/les/ho*: *l'hi*, *la hi*, *li ho*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: en-hi
    title: "La combinació *n'hi*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: posicio-infinitiu-imperatiu
    title: "Amb infinitiu i imperatiu: *dona-me'l*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *se lo* → *l'hi* / *li ho*"
  - id: expressions
    title: "Expressions: favors i insistència"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: dos pronoms junts"
  - title: "Practicar: *me'l*, *l'hi*, *la hi*"
  - title: "*N'hi*, l'imperatiu i *se lo*"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el préstec"
    definition: "Deixar una cosa a algú perquè la faci servir i la torni."
    example: "El préstec del trepant és per una setmana."
  - word: "deixar en préstec"
    definition: "Donar una cosa a algú per un temps: després l'ha de tornar."
    example: "Et deixo la bicicleta en préstec fins divendres."
  - word: "tornar"
    definition: "Donar una cosa al seu propietari quan ja l'has fet servir."
    example: "Demà torno el llibre a la biblioteca."
  - word: "el favor"
    definition: "Cosa que fas per ajudar algú, sense cobrar."
    example: "Et demano un favor: pots regar les plantes?"
  - word: "l'eina"
    definition: "Objecte que serveix per arreglar o construir coses."
    example: "Aquesta eina serveix per arreglar endolls."
  - word: "la caixa d'eines"
    definition: "Capsa on es guarden les eines."
    example: "El martell és a la caixa d'eines."
  - word: "el martell"
    definition: "Eina que serveix per donar cops."
    example: "Amb aquest martell pots penjar el quadre."
  - word: "el tornavís"
    definition: "Eina que serveix per posar i treure caragols."
    example: "Necessito un tornavís petit per arreglar l'endoll."
  - word: "l'escala de mà"
    definition: "Escala que es pot moure per arribar als llocs alts."
    example: "Puja a l'escala de mà i canvia la bombeta."
  - word: "la clau"
    definition: "Peça de metall que obre una porta."
    example: "He perdut la clau de casa."
  - word: "la clau anglesa"
    definition: "Eina per estrènyer caragols grossos."
    example: "La clau anglesa és a la caixa d'eines."
  - word: "el paraigua"
    definition: "Objecte per no mullar-se quan plou."
    example: "Agafa el paraigua, que avui plourà."
  - word: "el carregador"
    definition: "Aparell per carregar la bateria del mòbil."
    example: "Em deixes el carregador? No tinc bateria."
  - word: "la bicicleta"
    definition: "Vehicle de dues rodes que es mou amb pedals."
    example: "Vaig a la feina amb bicicleta."
  - word: "la biblioteca"
    definition: "Lloc on et deixen llibres en préstec."
    example: "He tornat tres llibres a la biblioteca."
  - word: "el taller"
    definition: "Lloc on s'arreglen bicicletes, cotxes o màquines."
    example: "He deixat la bicicleta al taller."
  - word: "el magatzem"
    definition: "Lloc gran on es guarden productes o eines."
    example: "Al magatzem queden dues cadires."
  - word: "el calaix"
    definition: "Part d'un moble que s'obre estirant."
    example: "Els rebuts són al calaix de dalt."
  - word: "la prestatgeria"
    definition: "Mobles amb lleixes per a llibres i objectes."
    example: "Hem penjat la prestatgeria al menjador."
  - word: "el paquet"
    definition: "Capsa o embolcall amb una cosa a dins."
    example: "Ha arribat un paquet per a tu."
  - word: "l'encàrrec"
    definition: "Feina o compra que demanes a algú que faci."
    example: "Tinc un encàrrec per a tu al mercat."
  - word: "el rebut"
    definition: "Paper que diu que has pagat una cosa."
    example: "Guarda el rebut de la compra."
  - word: "la fiança"
    definition: "Diners que deixes com a garantia i et tornen després."
    example: "En marxar del pis, et tornen la fiança."
  - word: "el torn"
    definition: "Moment en què et toca fer una cosa."
    example: "Espera el teu torn a la cua."
  - word: "la cita"
    definition: "Dia i hora fixats per trobar algú."
    example: "Tinc cita amb el metge a les deu."
  - word: "el lampista"
    definition: "Persona que arregla les coses del bany i la cuina."
    example: "El lampista vindrà dimarts al matí."
  - word: "l'electricista"
    definition: "Persona que arregla endolls i llums."
    example: "L'electricista ha canviat l'endoll."
  - word: "arreglar"
    definition: "Deixar una cosa espatllada com nova."
    example: "El taller m'ha arreglat la bicicleta."
  - word: "espatllat, espatllada"
    definition: "Que no funciona."
    example: "El mòbil està espatllat."
  - word: "confiar"
    definition: "Creure que algú farà bé les coses."
    example: "Confio en tu: deixa-li les claus."
  - word: "emportar-se"
    definition: "Agafar una cosa i anar amb ella a un altre lloc."
    example: "Emporta't el paraigua, que plourà."
  - word: "quedar-se"
    definition: "No tornar una cosa; guardar-la per a tu."
    example: "Si vols, queda't el llibre."
  - word: "l'endoll"
    definition: "Peça de la paret on connectes els aparells elèctrics."
    example: "L'endoll del menjador no funciona."
  - word: "penjar"
    definition: "Posar una cosa a la paret perquè no caigui."
    example: "Hem penjat dos quadres al menjador."
  - word: "el trepant"
    definition: "Eina elèctrica per fer forats a la paret."
    example: "Amb el trepant penjarem els prestatges."
  - word: "el replà"
    definition: "Espai de l'escala davant la porta del pis."
    example: "No deixeu les bicicletes al replà."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-17-001
    type: choice
    point: combinacions-ordre
    lesson: 1
    prompt: "—Em deixes el martell en préstec? —Sí, ___ deixo ara mateix."
    answer: "te'l"
    distractors:
      - text: "et el"
        why: "*Et* i *el* es combinen en una sola forma: *te'l*. *Et el* no existeix."
      - text: "el te"
        why: "L'ordre és indirecte + directe: primer *te* (a tu) i després *el* (el martell): *te'l*."
    explanation: "«A tu» és *te* i «el martell» és *el*. Van junts, l'indirecte primer: *te'l deixo*."

  - id: b1-17-002
    type: choice
    point: combinacions-ordre
    lesson: 1
    prompt: "—Em tornes la clau anglesa? —Sí, ___ torno demà."
    answer: "te la"
    distractors:
      - text: "te'l"
        why: "*Te'l* és masculí (*el*). «La clau» és femenina: *te la*."
      - text: "la te"
        why: "L'indirecte (*te*) va primer: *te la*."
    explanation: "«A tu» és *te* i «la clau» és *la*: *te la torno*."

  - id: b1-17-003
    type: choice
    point: combinacions-ordre
    lesson: 1
    prompt: "—Em pots explicar això del rebut? —Sí, ___ explico ara."
    answer: "t'ho"
    distractors:
      - text: "te ho"
        why: "*Te* i *ho* es combinen en *t'ho*. *Te ho* no existeix."
      - text: "te'l"
        why: "*Te'l* substitueix un nom masculí. «Això del rebut» és una idea: *t'ho*."
    explanation: "«A tu» és *te* i «això» és *ho*: *t'ho explico*."

  - id: b1-17-004
    type: choice
    point: combinacions-ordre
    lesson: 1
    prompt: "L'Ibrahim s'emporta dos entrepans i ___ menja a l'oficina."
    answer: "se'ls"
    distractors:
      - text: "es els"
        why: "*Es* i *els* es combinen en *se'ls*. *Es els* no existeix."
      - text: "se les"
        why: "*Entrepans* és masculí plural: *els*. *Se les* seria per a un nom femení."
    explanation: "«Es» + «els entrepans» donen *se'ls*: *se'ls menja*."

  - id: b1-17-005
    type: choice
    point: combinacions-ordre
    lesson: 1
    prompt: "El taller ___ arreglarà demà: hi hem deixat dues bicicletes i tenim el primer torn."
    answer: "ens les"
    distractors:
      - text: "ens els"
        why: "*Bicicletes* és femení: *les*. *Ens els* seria per a un nom masculí."
      - text: "les ens"
        why: "L'indirecte (*ens*) va primer: *ens les*."
    explanation: "«A nosaltres» és *ens* i «les bicicletes» és *les*: *ens les arreglarà*."

  - id: b1-17-006
    type: choice
    point: li-cd
    lesson: 1
    prompt: "—Has donat el paquet a la veïna? —Sí, ___ he donat aquest matí."
    answer: "l'hi"
    distractors:
      - text: "se lo"
        why: "*Se lo* és un calc del castellà «se lo». En català, *li* + *el* donen *l'hi*."
      - text: "li el"
        why: "*Li* i *el* no van separats: es combinen en *l'hi*. *Li el* no existeix."
    explanation: "«A la veïna» és *li* i «el paquet» és *el*. La combinació és *l'hi*: *l'hi he donat*."

  - id: b1-17-007
    type: choice
    point: li-cd
    lesson: 1
    prompt: "—Has explicat la norma a en Pau? —Sí, ___ he explicat dues vegades."
    answer: "la hi"
    distractors:
      - text: "l'hi"
        why: "*L'hi* porta *el* (masculí). «La norma» és femenina: *la hi*."
      - text: "se la"
        why: "«A en Pau» és *li*, no *es*: *li* + *la* donen *la hi*."
    explanation: "«A en Pau» és *li* i «la norma» és *la*: *la hi he explicat*."

  - id: b1-17-008
    type: inline-choice
    point: combinacions-ordre
    lesson: 1
    title: "Un missatge a en Jordi"
    text: "Hola, Jordi: {me'l|me la|m'ho} pots deixar, el tornavís? {Te'l|Te la|T'ho} torno demà al matí, que l'he de fer servir aquest vespre. Si tens també la clau anglesa, {me la|me'l|m'ho} pots deixar? {T'ho|Te'l|Te la} agrairé molt!"
    explanation: "*Me'l* (a mi + el tornavís), *te'l* (a tu + el tornavís), *me la* (a mi + la clau) i *t'ho* (a tu + això)."

  - id: b1-17-009
    type: inline-choice
    point: li-cd
    lesson: 1
    title: "A la biblioteca"
    text: "—Has tornat el llibre a la Núria? —Sí, {l'hi|la hi|li ho} he tornat avui. I les revistes? —També {les hi|els hi|li ho} he donat. I li has dit que tanquen a les vuit? —Sí, {li ho|l'hi|la hi} he dit per telèfon."
    explanation: "*L'hi* (li + el llibre), *les hi* (li + les revistes) i *li ho* (li + això)."

  - id: b1-17-010
    type: match
    point: combinacions-ordre
    lesson: 1
    instruction: "Relaciona cada combinació amb els complements que substitueix."
    pairs:
      - ["me'l", "a mi + el tornavís"]
      - ["te la", "a tu + la clau"]
      - ["ens ho", "a nosaltres + això"]
      - ["se'ls", "es + els entrepans"]
      - ["m'ho", "a mi + això"]
    explanation: "Davant del verb, l'indirecte va primer i el directe després: *me'l*, *te la*, *ens ho*, *se'ls*, *m'ho*."

  - id: b1-17-011
    type: fill
    point: combinacions-ordre
    lesson: 1
    prompt: "—Em deixes la bicicleta? —Sí, ___ deixo, però torna-la aviat."
    hint: "pronom per a «a tu» i «la bicicleta»"
    answers: ["te la"]
    wrong_answers:
      - text: "te'l"
        why: "*Te'l* és masculí. «La bicicleta» és femenina: *te la*."
      - text: "la te"
        why: "L'indirecte (*te*) va primer: *te la*."
    grading: tolerant
    explanation: "«A tu» és *te* i «la bicicleta» és *la*: *te la deixo*."

  - id: b1-17-012
    type: fill
    point: combinacions-ordre
    lesson: 1
    prompt: "—Ens dieu l'hora de la cita? —Sí, ___ diem ara mateix."
    hint: "pronom per a «a vosaltres» i «l'hora»"
    answers: ["us la"]
    wrong_answers:
      - text: "us el"
        why: "*Us el* és masculí. «L'hora» és femenina: *us la*."
      - text: "us ho"
        why: "*Us ho* seria per a una idea («això»). «L'hora» és un nom femení: *us la*."
    grading: tolerant
    explanation: "«A vosaltres» és *us* i «l'hora» és *la*: *us la diem*."

  - id: b1-17-013
    type: order
    point: combinacions-ordre
    lesson: 1
    cue: "Digues a un company que li pots deixar el carregador demà."
    chunks: ["te'l", "puc", "deixar", "demà"]
    extra: ["se'l"]
    answers:
      - "Te'l puc deixar demà."
      - "Demà te'l puc deixar."
    explanation: "«A tu» + «el carregador» donen *te'l*, davant del verb: *te'l puc deixar*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-17-014
    type: fill
    point: combinacions-ordre
    lesson: 2
    prompt: "—Ens porteu els paquets? —Sí, ___ portem a les cinc."
    hint: "pronom per a «a vosaltres» i «els paquets»"
    answers: ["us els"]
    wrong_answers:
      - text: "us les"
        why: "*Paquets* és masculí: *els*. *Us les* seria per a un nom femení."
      - text: "us ho"
        why: "*Us ho* és per a una idea. «Els paquets» és un nom: *us els*."
    grading: tolerant
    explanation: "«A vosaltres» és *us* i «els paquets» és *els*: *us els portem*."

  - id: b1-17-015
    type: fill
    point: combinacions-ordre
    lesson: 2
    prompt: "La Fàtima es prova les sabates i ___ queda: li van molt bé."
    hint: "pronom per a «es» i «les sabates»"
    answers: ["se les"]
    wrong_answers:
      - text: "se'ls"
        why: "*Sabates* és femení: *les*. *Se'ls* seria per a un nom masculí."
      - text: "es les"
        why: "*Es* i *les* es combinen en *se les*. *Es les* no existeix."
    grading: tolerant
    explanation: "«Es» + «les sabates» donen *se les*: *se les queda*."

  - id: b1-17-016
    type: fill
    point: combinacions-ordre
    lesson: 2
    prompt: "—M'expliques això del rebut? —Sí, ___ explico amb calma."
    hint: "pronom per a «a tu» i «això»"
    answers: ["t'ho"]
    wrong_answers:
      - text: "te'l"
        why: "*Te'l* és per a un nom masculí. «Això» és una idea: *t'ho*."
      - text: "te ho"
        why: "*Te* i *ho* es combinen en *t'ho*. *Te ho* no existeix."
    grading: tolerant
    explanation: "«A tu» + «això» donen *t'ho*: *t'ho explico*."

  - id: b1-17-017
    type: fill
    point: li-cd
    lesson: 2
    prompt: "—Has dit a en Jordi que vindràs? —Sí, ___ he dit per missatge."
    hint: "pronom per a «a en Jordi» i «això»"
    answers: ["li ho"]
    wrong_answers:
      - text: "l'hi"
        why: "*L'hi* porta *el*, per a un nom masculí. «Que vindràs» és una idea: *li ho*."
      - text: "se lo"
        why: "*Se lo* és un calc del castellà «se lo». En català: *li ho*."
    grading: tolerant
    explanation: "«A en Jordi» és *li* i «que vindràs» és una idea (*ho*): *li ho he dit*."

  - id: b1-17-018
    type: fill
    point: li-cd
    lesson: 2
    prompt: "—Heu ensenyat les fotos a l'àvia? —Sí, ___ hem ensenyat totes."
    hint: "pronom per a «a l'àvia» i «les fotos»"
    answers: ["les hi"]
    wrong_answers:
      - text: "els hi"
        why: "*Els hi* és per a un nom masculí plural. «Les fotos» és femení: *les hi*."
      - text: "se les"
        why: "«A l'àvia» és *li*, no *es*: *li* + *les* donen *les hi*."
    grading: tolerant
    explanation: "«A l'àvia» és *li* i «les fotos» és *les*: *les hi hem ensenyat*."

  - id: b1-17-019
    type: order
    point: combinacions-ordre
    lesson: 2
    cue: "Explica que el lampista us mostrarà demà l'endoll espatllat."
    chunks: ["el lampista", "us el", "mostrarà", "demà"]
    extra: ["els el"]
    answers:
      - "El lampista us el mostrarà demà."
      - "Demà el lampista us el mostrarà."
    explanation: "«A vosaltres» + «l'endoll» donen *us el*, davant del verb: *us el mostrarà*."

  - id: b1-17-020
    type: order
    point: li-cd
    lesson: 2
    cue: "Digues que ahir vas dir a la Montse que la reunió era a les nou."
    chunks: ["ahir", "li ho", "vaig", "dir"]
    extra: ["l'hi"]
    answers:
      - "Ahir li ho vaig dir."
      - "Li ho vaig dir ahir."
    explanation: "«A la Montse» + «això» donen *li ho*: *li ho vaig dir*."

  - id: b1-17-021
    type: choice
    point: combinacions-ordre
    lesson: 2
    prompt: "A nosaltres, l'electricista ___ dirà demà si pot venir."
    answer: "ens ho"
    distractors:
      - text: "ens el"
        why: "*Ens el* és per a un nom masculí. «Si pot venir» és una idea: *ens ho*."
      - text: "us ho"
        why: "*Us ho* vol dir «a vosaltres». La frase parla d'«a nosaltres»: *ens ho*."
    explanation: "«A nosaltres» + «això» donen *ens ho*: *ens ho dirà*."

  - id: b1-17-022
    type: choice
    point: combinacions-ordre
    lesson: 2
    prompt: "La Núria es mira el rebut i ___ guarda a la bossa."
    answer: "se'l"
    distractors:
      - text: "es el"
        why: "*Es* i *el* es combinen en *se'l*. *Es el* no existeix."
      - text: "l'hi"
        why: "*L'hi* porta *li* (a ell o a ella). El verb és pronominal (*es mira...*): *se'l*."
    explanation: "El verb és pronominal (*es mira...*): «es» + «el rebut» donen *se'l*."

  - id: b1-17-023
    type: choice
    point: li-cd
    lesson: 2
    prompt: "—Li has donat els documents al gestor? —Sí, ___ he donat avui."
    answer: "els hi"
    distractors:
      - text: "se'ls"
        why: "*Se'ls* porta *es*, no *li*. «Al gestor» és *li*, i *li* + *els* donen *els hi*."
      - text: "les hi"
        why: "*Les hi* és femení. «Els documents» és masculí: *els hi*."
    explanation: "«Al gestor» és *li* i «els documents» és *els*: *els hi he donat*."

  - id: b1-17-024
    type: choice
    point: li-cd
    lesson: 2
    prompt: "—I a la Laia, li has dit l'hora? —No, encara no ___ he dit."
    answer: "la hi"
    distractors:
      - text: "li ho"
        why: "*Li ho* seria per a una idea («això»). «L'hora» és un nom femení: *la hi*."
      - text: "se la"
        why: "«A la Laia» és *li*, no *es*: *li* + *la* donen *la hi*."
    explanation: "«A la Laia» és *li* i «l'hora» és *la*: *la hi he dit*."

  - id: b1-17-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «Em pots fer un favor»?"
    answer: "Em pots ajudar en una cosa."
    distractors:
      - text: "Em pots deixar diners."
        why: "*Fer un favor* és ajudar en general, no només amb diners."
      - text: "Em pots fer companyia."
        why: "*Fer companyia* és estar amb algú. *Fer un favor* és fer una cosa per ajudar-lo."
    explanation: "*Fer un favor* vol dir fer una cosa per ajudar algú."

  - id: b1-17-026
    type: inline-choice
    point: li-cd
    lesson: 2
    title: "Missatges amb la Núria"
    text: "—Núria, li has deixat el paraigua a en Quim? —Sí, {l'hi|la hi|li ho} he deixat aquest matí. I els guants? —També {els hi|les hi|se'ls} he deixat. I li has dit que plourà? —És clar que {li ho|l'hi|la hi} he dit!"
    explanation: "*L'hi* (li + el paraigua), *els hi* (li + els guants) i *li ho* (li + això)."

  - id: b1-17-027
    type: transform
    point: combinacions-ordre
    lesson: 2
    instruction: "Substitueix la part marcada per pronoms."
    source: "La Laia es quedarà [[la bicicleta]] del seu germà."
    answers: ["La Laia se la quedarà del seu germà."]
    wrong_answers:
      - text: "La Laia es la quedarà del seu germà."
        why: "*Es* i *la* es combinen en *se la*: *se la quedarà*."
      - text: "La Laia se'l quedarà del seu germà."
        why: "*Se'l* és masculí. «La bicicleta» és femenina: *se la*."
    grading: tolerant
    explanation: "«Es» + «la bicicleta» donen *se la*: *se la quedarà*."

  # ---------------- Lliçó 3 ----------------
