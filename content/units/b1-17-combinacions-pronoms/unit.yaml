  - id: b1-17-066
    type: reading
    point: comprensio
    lesson: 5
    title: "La caixa d'eines del replà"
    text: |
      Al replà de la Laia hi ha una caixa d'eines de tots els veïns. La idea va ser de l'Ibrahim: un préstec d'eines entre veïns. Cada família hi posa les eines que no fa servir cada dia, i tothom les pot agafar quan en necessita una. A la caixa hi ha de tot: martells, tornavisos, una escala de mà i fins i tot un trepant.

      La setmana passada, la Laia va penjar tres prestatges amb el trepant de la caixa. Quan va acabar, el va netejar i el va tornar al seu lloc. «Si el tornes net, el pròxim el troba a punt», li va dir l'Ibrahim.

      En Pau, en canvi, s'hi ha tornat: es va emportar l'escala de mà per pintar el menjador i encara no la hi ha tornat. La Laia li ha enviat dos missatges, però ell diu que encara no la hi pot tornar perquè no ha acabat.

      Ahir, la Fàtima va demanar el trepant per penjar una prestatgeria. La Laia li ho va explicar tot: que el trepant hi era, però que l'escala no. «Deixa't estar i truca a en Pau», li va dir la Fàtima rient.

      Al final, en Pau va tornar l'escala al vespre i es va disculpar. Avui la caixa torna a ser plena.
    questions:
      - prompt: "Què és la caixa d'eines del replà?"
        answer: "Unes eines compartides entre els veïns."
        distractors:
          - text: "La caixa on en Pau guarda les seves eines."
            why: "La caixa és de tots; en Pau només hi torna l'escala."
          - text: "Les eines personals de la Laia."
            why: "La caixa és al seu replà, però les eines són de tots els veïns."
      - prompt: "Què va fer la Laia amb el trepant?"
        answer: "Va penjar prestatges i el va tornar net."
        distractors:
          - text: "Va penjar una prestatgeria per a la Fàtima."
            why: "La prestatgeria la vol penjar la Fàtima, no la Laia."
          - text: "Es va emportar l'escala per pintar."
            why: "L'escala se la va emportar en Pau, no la Laia."
      - prompt: "Per què es queixa la Laia d'en Pau?"
        answer: "Perquè encara no ha tornat l'escala."
        distractors:
          - text: "Perquè ha trencat el trepant."
            why: "El trepant funciona: la Laia l'acaba de fer servir."
          - text: "Perquè no ha netejat l'escala."
            why: "La Laia no li demana que la netegi: vol que la torni."
      - prompt: "Com acaba la història?"
        answer: "En Pau torna l'escala i es disculpa."
        distractors:
          - text: "La Fàtima truca a en Pau."
            why: "La Fàtima ho proposa, però el text no diu que ho faci."
          - text: "En Pau penja la prestatgeria de la Fàtima."
            why: "La prestatgeria és un pla de la Fàtima; en Pau només torna l'escala."
    explanation: "El text explica com funciona la caixa d'eines compartida i què passa quan en Pau no torna l'escala."
