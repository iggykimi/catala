  - id: b2-50-065
    type: reading
    point: comprensio
    lesson: 5
    title: "La reforma del pis de Gràcia"
    text: |
      La Laia i en Pau van comprar un pis a Gràcia l'any passat. Era un tercer sense ascensor, amb el parquet aixecat, una taca d'humitat al sostre i la caldera espatllada. El preu era raonable, però sabien que haurien de fer mans i mànigues per deixar-lo habitable.

      Primer van posar fil a l'agulla: van demanar tres pressupostos i van formular moltes preguntes a cada paleta. Un pressupost era tan baix que van dubtar de seguida; un altre arribava un mes tard. Al final van triar una empresa petita de Sabadell que els va merèixer confiança.

      L'obra va començar al març, amb el permís d'obres penjat a l'entrada. El manobre portava els maons i barrejava el ciment, mentre el paleta aixecava una paret nova. El fuster va col·locar les portes i va canviar el pany de l'entrada; el lampista va instal·lar l'aixeta i el desguàs del bany, i l'electricista va canviar els endolls i els interruptors de tot el pis. Quan van engegar la caldera nova, van descobrir una esquerda darrere del radiador. L'arquitecta va prendre la decisió de reforçar aquell tros de paret, i l'obra es va allargar dues setmanes. A la primavera, muntaran una bastida per pintar la façana.

      Els veïns del replà no van posar cap inconvenient, però el veí del quart sempre hi posava cullerada: opinava del color de la rajola i del model de persiana sense que ningú li demanés res. La Laia, que ja el coneixia, no li feia cas.

      Al juny, l'obra es va acabar. El pis fa molt bona pinta: parquet nou, cuina clara i una aixeta que ja no degota. «Hem comès pocs errors», diu en Pau, «però no tornaríem a reformar sense un bon plànol».
    questions:
      - prompt: "Per què van haver de reformar el pis?"
        answer: "El parquet, el sostre i la caldera estaven en mal estat."
        distractors:
          - text: "No els agradava el color de la rajola del bany."
            why: "Van triar la rajola durant l'obra; el pis tenia problemes més greus."
          - text: "El veí del tercer els va denunciar a l'ajuntament."
            why: "El veí del quart opinava de tot, però no els va denunciar."
      - prompt: "Què va passar quan van engegar la caldera nova?"
        answer: "Van trobar una esquerda darrere del radiador."
        distractors:
          - text: "El desguàs del bany es va embussar."
            why: "El desguàs el va instal·lar el lampista sense cap problema."
          - text: "Van veure que el parquet estava aixecat."
            why: "El parquet ja estava aixecat quan van comprar el pis."
      - prompt: "En el text, què vol dir «els va merèixer confiança»?"
