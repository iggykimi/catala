id: b2-50
level: B2
title: "Lèxic precís: verbs i mots comodí"
summary: "Els verbs precisos que substitueixen «fer», «posar», «donar» i «tenir», els noms precisos que substitueixen «cosa» i «això», i els calcs lèxics que cal evitar, en el context de l'habitatge i les reformes."
vocabulary_theme: "Habitatge, obres i reformes"
points:
  - id: verbs-fer
    title: "Més enllà de *fer*"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
  - id: verbs-posar-donar
    title: "Més enllà de *posar*, *donar* i *tenir*"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
  - id: noms-precisos
    title: "Més enllà de *cosa* i *això*"
    refs:
      - label: "DIEC2"
        url: "https://dlc.iec.cat"
  - id: compte-calcs
    title: "Compte amb el castellà: calcs lèxics"
    refs:
      - label: "Optimot"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions amb *fer* i *posar*"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: el verb precís"
  - title: "Practicar el verb precís"
  - title: "El nom precís i els calcs"
  - title: "Produir: reescriure amb precisió"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el paleta"
    definition: "Persona que construeix o reforma parets i altres parts d'un edifici."
    example: "El paleta vindrà dilluns a aixecar la paret."
  - word: "el manobre"
    definition: "Ajudant del paleta en una obra."
    example: "El manobre prepara el ciment i porta els maons."
  - word: "el fuster, la fustera"
    definition: "Persona que fa i col·loca mobles i peces de fusta."
    example: "La fustera ens ha muntat un armari a mida."
  - word: "el lampista"
    definition: "Persona que instal·la i arregla canonades i aixetes."
    example: "El lampista ha canviat l'aixeta de la cuina."
  - word: "l'electricista"
    definition: "Persona que instal·la i arregla la instal·lació elèctrica."
    example: "L'electricista ha afegit tres endolls nous al despatx."
  - word: "el pintor, la pintora"
    definition: "Persona que pinta parets i sostres."
    example: "La pintora pintarà el menjador de color crema."
  - word: "l'obra"
    definition: "Feina de construir o reformar un edifici."
    example: "L'obra del bany durarà tres setmanes."
  - word: "la reforma"
    definition: "Obra que canvia o millora un habitatge."
    example: "La reforma de la cuina ha costat nou mil euros."
  - word: "el permís d'obres"
    definition: "Autorització de l'ajuntament per fer una obra."
    example: "Sense el permís d'obres no podem començar."
  - word: "el pressupost"
    definition: "Càlcul dels diners que costarà una feina."
    example: "Hem demanat tres pressupostos a tres empreses."
  - word: "la bastida"
    definition: "Estructura de tubs i taulons per treballar en una façana."
    example: "Han muntat una bastida per pintar la façana."
  - word: "el guix"
    definition: "Material blanc per allisar parets i sostres."
    example: "El paleta ha tapat l'esquerda amb guix."
  - word: "el ciment"
    definition: "Material gris que, barrejat amb aigua, uneix maons i rajoles."
    example: "El manobre està barrejant el ciment."
  - word: "el maó"
    definition: "Peça de terra cuita per construir parets."
    example: "Falten maons per acabar la paret del jardí."
  - word: "la rajola"
    definition: "Peça quadrada de ceràmica per cobrir terres i parets."
    example: "Hem triat una rajola clara per al bany."
  - word: "el parquet"
    definition: "Terra de làmines de fusta."
    example: "El parquet del menjador és de roure."
  - word: "l'aixeta"
    definition: "Aparell que obre i tanca el pas de l'aigua."
    example: "L'aixeta del lavabo degota."
  - word: "el desguàs"
    definition: "Forat i tub per on marxa l'aigua bruta."
    example: "El desguàs de la dutxa s'ha embussat."
  - word: "l'endoll"
    definition: "Peça de la paret on es connecten els aparells elèctrics."
    example: "Darrere del sofà hi ha dos endolls."
  - word: "l'interruptor"
    definition: "Aparell per encendre i apagar el llum."
    example: "L'interruptor de l'entrada no funciona."
  - word: "la caldera"
    definition: "Aparell que escalfa l'aigua de la casa."
    example: "Hem engegat la caldera perquè ja fa fred."
  - word: "el radiador"
    definition: "Aparell que reparteix la calor de la calefacció."
    example: "El radiador del dormitori no s'escalfa."
  - word: "la humitat"
    definition: "Aigua que entra en una paret o en un sostre."
    example: "Hi ha una taca d'humitat al sostre."
  - word: "la gotera"
    definition: "Forat petit del terrat per on entra la pluja."
    example: "Amb la tempesta ha sortit una gotera al replà."
  - word: "l'esquerda"
    definition: "Obertura llarga i estreta en una paret."
    example: "El terratrèmol va obrir una esquerda a la façana."
  - word: "el plànol"
    definition: "Dibuix tècnic d'un habitatge o d'una obra."
    example: "En el plànol, la cuina fa dotze metres quadrats."
  - word: "el trepant"
    definition: "Eina elèctrica per fer forats."
    example: "Passa'm el trepant per penjar el quadre."
  - word: "el terrat"
    definition: "Part plana de dalt d'un edifici."
    example: "Tenim una taula i quatre cadires al terrat."
  - word: "el replà"
    definition: "Espai de l'escala davant de cada pis."
    example: "Hem deixat la bicicleta al replà."
  - word: "la persiana"
    definition: "Cortina de làmines que tapa la finestra."
    example: "Apuja la persiana, que hi entri llum."
  - word: "el pany"
    definition: "Mecanisme de la porta que s'obre amb clau."
    example: "El pany de l'entrada s'ha espatllat."
  - word: "l'aïllament"
    definition: "Material que protegeix del fred, de la calor i del soroll."
    example: "Amb un bon aïllament gastarem menys calefacció."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-50-001
    type: choice
    point: verbs-fer
    lesson: 1
    instruction: "Tria el verb més precís."
    prompt: "Abans de signar el pressupost, la Laia vol ___ una pregunta al paleta."
    answer: "formular"
    distractors:
      - text: "fer"
        why: "«Fer una pregunta» no és incorrecte, però et demanem el verb més precís: *formular*."
      - text: "posar"
        why: "A una persona no se li *posa* una pregunta: se li *fa* o, més precís, se li *formula*."
    explanation: "Per a «una pregunta», el verb precís és *formular*. *Fer* és correcte, però vague."

  - id: b2-50-002
    type: choice
    point: verbs-fer
    lesson: 1
    instruction: "Tria el verb més precís."
    prompt: "L'any passat van ___ una casa de fusta a prop de Vic."
    answer: "construir"
    distractors:
      - text: "fer"
        why: "«Fer una casa» no és incorrecte, però et demanem el verb més precís: *construir*."
      - text: "posar"
        why: "*Posar casa* vol dir instal·lar-s'hi a viure, no construir-la."
    explanation: "Per a «una casa», el verb precís és *construir*. *Fer* és correcte, però vague."

  - id: b2-50-003
    type: choice
    point: verbs-fer
    lesson: 1
    instruction: "Tria el verb més precís."
    prompt: "Si ___ un error en el plànol, l'obra pot sortir molt cara."
    answer: "comets"
    distractors:
      - text: "fas"
        why: "«Fer un error» no és incorrecte, però et demanem el verb més precís: *cometre*."
      - text: "poses"
        why: "Els errors no es *posen*: es *fan* o, més precís, es *cometen*."
    explanation: "Per a «un error», el verb precís és *cometre*: *comets*."

  - id: b2-50-004
    type: choice
    point: verbs-posar-donar
    lesson: 1
    instruction: "Tria el verb més precís."
    prompt: "Fa molt de fred: ___ la caldera cada matí."
    answer: "engeguem"
    distractors:
      - text: "posem"
        why: "«Posar la caldera» s'entén, però et demanem el verb més precís: *engegar*."
      - text: "tanquem"
        why: "*Tancar la caldera* no vol dir «posar-la en marxa»."
    explanation: "Per a «posar en marxa», el verb precís és *engegar*: *engeguem*."

  - id: b2-50-005
    type: choice
    point: verbs-posar-donar
    lesson: 1
    instruction: "Tria el verb més precís."
    prompt: "Per canviar les finestres, cal que l'ajuntament us ___."
    answer: "autoritzi"
    distractors:
      - text: "doni"
        why: "*Donar* necessita dir què es dona («donar permís»). «Doni» tot sol no funciona aquí: cal *autoritzar*."
      - text: "posi"
        why: "*Posar*, tot sol, no té sentit aquí. El verb precís és *autoritzar*."
    explanation: "Per a «donar permís», el verb precís és *autoritzar*: *autoritzi*."

  - id: b2-50-006
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «posar fil a l'agulla»?"
    answer: "Començar una feina, fer el primer pas."
    distractors:
      - text: "Deixar una feina a mitges."
        why: "És el contrari: l'expressió vol dir començar, no abandonar."
      - text: "Cosir un botó d'una camisa."
        why: "Aquest és el sentit literal; l'expressió és figurada."
    explanation: "«Posar fil a l'agulla» és començar una feina: *El mes que ve posem fil a l'agulla amb la reforma*."

  - id: b2-50-007
    type: match
    point: verbs-fer
    lesson: 1
    instruction: "Relaciona cada verb amb el nom que li correspon."
    pairs:
      - ["formular", "una pregunta"]
      - ["cometre", "un error"]
      - ["pronunciar", "un discurs"]
      - ["convocar", "una reunió"]
    explanation: "Són combinacions fixes: *formular una pregunta*, *cometre un error*, *pronunciar un discurs*, *convocar una reunió*."

  - id: b2-50-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["posar fil a l'agulla", "Dilluns truquem al paleta i comencem."]
      - ["fer mans i mànigues", "Ho provarem tot per acabar a temps."]
      - ["posar-hi cullerada", "El veí opina de tot sense que li demanin."]
      - ["fer campana", "L'aprenent no ha anat a classe i no ha avisat ningú."]
    explanation: "Cada expressió descriu una actitud davant la feina: començar, esforçar-se, ficar-s'hi on no et demanen o no presentar-se."

  - id: b2-50-009
    type: inline-choice
    point: verbs-fer
    lesson: 1
    instruction: "Tria el verb més precís."
    title: "Un correu al paleta"
    text: "Benvolgut Pau: et {formulo|faig|poso} una pregunta sobre el pressupost. Si {cometem|fem|posem} un error en el plànol, quant costa arreglar-lo? També voldria {convocar|fer|posar} una reunió amb tu i la fustera. Gràcies, Núria."
    explanation: "Els verbs precisos són *formular una pregunta*, *cometre un error* i *convocar una reunió*. *Fer* no és incorrecte, però és vague; *posar* no hi funciona."

  - id: b2-50-010
    type: fill
    point: verbs-posar-donar
    lesson: 1
    prompt: "—I la taula? —L'Ibrahim ja l'ha ___."
    hint: "verb precís per a «posar la taula»: PARAR"
    answers: ["parada", "parat"]
    wrong_answers:
      - text: "parado"
        why: "En català, el participi de *parar* és *parat* (*parada* en femení), no «parado»."
    grading: tolerant
    explanation: "El verb precís per a «posar la taula» és *parar*: *l'ha parada* (o *l'ha parat*)."

  - id: b2-50-011
    type: fill
    point: verbs-fer
    lesson: 1
    prompt: "El paleta ___ la paret del jardí en dos dies."
    hint: "verb precís per a «fer una paret»: AIXECAR, passat perifràstic"
    answers: ["va aixecar"]
    wrong_answers:
      - text: "va aixecat"
        why: "Després de *va* cal l'infinitiu: *va aixecar*."
    grading: tolerant
    explanation: "El verb precís és *aixecar*: *va aixecar la paret*. *Fer una paret* és vague."

  - id: b2-50-012
    type: order
    point: verbs-posar-donar
    lesson: 1
    cue: "Digues que cal engegar la caldera perquè ja fa fred."
    chunks: ["Cal", "engegar", "la caldera:", "ja", "fa", "fred"]
    extra: ["engegant"]
    answers:
      - "Cal engegar la caldera: ja fa fred."
    explanation: "Després de *cal* va l'infinitiu: *cal engegar*. *Engegar* és el verb precís per a «posar en marxa»."

  - id: b2-50-013
    type: choice
    point: verbs-posar-donar
    lesson: 1
    instruction: "Tria el verb més precís."
    prompt: "En Jordi ha de ___ el quadre nou al menjador."
    answer: "penjar"
    distractors:
      - text: "posar"
        why: "«Posar el quadre» s'entén, però et demanem el verb més precís: *penjar*."
      - text: "parar"
        why: "*Parar* es diu de la taula (*parar taula*); un quadre es *penja*."
    explanation: "Per a «un quadre», el verb precís és *penjar*."
  # ---------- Lliçó 2 ----------
  - id: b2-50-014
    type: fill
    point: verbs-fer
    lesson: 2
    prompt: "Voldria ___ una pregunta sobre la humitat del sostre."
    hint: "FORMULAR"
    answers: ["formular"]
    wrong_answers:
      - text: "formule"
        why: "Amb *voldria* va l'infinitiu, no el subjuntiu: *formular*."
    grading: tolerant
    explanation: "Després de *voldria* va l'infinitiu: *formular*. És el verb precís per a «fer una pregunta»."

  - id: b2-50-015
    type: fill
    point: verbs-fer
    lesson: 2
    prompt: "L'arquitecta ___ un discurs breu a la inauguració."
    hint: "PRONUNCIAR, passat perifràstic"
    answers: ["va pronunciar"]
    wrong_answers:
      - text: "va pronunciat"
        why: "Després de *va* cal l'infinitiu: *va pronunciar*."
    grading: tolerant
    explanation: "El verb precís per a «fer un discurs» és *pronunciar*: *va pronunciar un discurs*."

  - id: b2-50-016
    type: fill
    point: verbs-fer
    lesson: 2
    prompt: "Si vols penjar els prestatges, hauràs de ___ la paret."
    hint: "verb precís per a «fer un forat»: FORADAR"
    answers: ["foradar"]
    wrong_answers:
      - text: "foradat"
        why: "Després de *hauràs de* cal l'infinitiu: *foradar*."
    grading: tolerant
    explanation: "*Foradar* vol dir «fer un forat»: *hauràs de foradar la paret*."

  - id: b2-50-017
    type: fill
    point: verbs-posar-donar
    lesson: 2
    prompt: "La Núria vol ___ sobre el plànol."
    hint: "verb precís per a «donar la seva opinió»: OPINAR"
    answers: ["opinar"]
    wrong_answers:
      - text: "opinió"
        why: "Aquí cal el verb *opinar*, no el nom *opinió*."
    grading: tolerant
    explanation: "El verb precís per a «donar la seva opinió» és *opinar*."

  - id: b2-50-018
    type: fill
    point: verbs-posar-donar
    lesson: 2
    prompt: "Ens ___ dimarts per triar la rajola del bany."
    hint: "verb precís per a «tenir una reunió»: REUNIR-SE, present"
    answers: ["reunim"]
    wrong_answers:
      - text: "reunem"
        why: "*Reunir* és de la tercera conjugació: amb «nosaltres» fa *reunim*."
      - text: "reuneixem"
        why: "Amb «nosaltres», *reunir* no porta l'increment *-eix-*: *reunim*."
    grading: tolerant
    explanation: "El verb precís per a «tenir una reunió» és *reunir-se*: *ens reunim dimarts*."

  - id: b2-50-019
    type: order
    point: verbs-fer
    lesson: 2
    cue: "Digues que organitzareu una festa quan acabi l'obra."
    chunks: ["Quan", "acabi", "l'obra,", "organitzarem", "una", "festa"]
    extra: ["organitzant"]
    answers:
      - "Quan acabi l'obra, organitzarem una festa."
      - "Organitzarem una festa quan acabi l'obra."
    explanation: "El verb precís per a «fer una festa» és *organitzar*: *organitzarem una festa*."

  - id: b2-50-020
    type: order
    point: verbs-posar-donar
    lesson: 2
    cue: "Digues a l'Ibrahim que t'ajudi a moure el sofà."
    chunks: ["Ibrahim,", "m'ajudes", "a", "moure", "el", "sofà?"]
    extra: ["m'ajudar"]
    answers:
      - "Ibrahim, m'ajudes a moure el sofà?"
      - "M'ajudes a moure el sofà, Ibrahim?"
    explanation: "El verb precís per a «donar un cop de mà» és *ajudar*: *m'ajudes a moure el sofà?*"

  - id: b2-50-021
    type: choice
    point: verbs-fer
    lesson: 2
    instruction: "Tria el verb més precís."
    prompt: "L'empresa vol ___ el bany i la cuina aquest estiu."
    answer: "reformar"
    distractors:
      - text: "fer"
        why: "«Fer el bany» s'entén, però et demanem el verb més precís: *reformar*."
      - text: "desfer"
        why: "*Desfer el bany* vol dir destruir-lo, no millorar-lo."
    explanation: "Canviar i millorar un espai és *reformar*: *reformar el bany*."

  - id: b2-50-022
    type: choice
    point: verbs-posar-donar
    lesson: 2
    instruction: "Tria el verb més precís."
    prompt: "L'electricista ___ l'aire condicionat del despatx aquesta setmana."
    answer: "instal·larà"
    distractors:
      - text: "posarà"
        why: "«Posar l'aire condicionat» s'entén, però et demanem el verb més precís: *instal·lar*."
      - text: "construirà"
        why: "*Construir* es diu d'edificis i parets; un aparell s'*instal·la*."
    explanation: "Per a «un aparell», el verb precís és *instal·lar*: *instal·larà*."

  - id: b2-50-023
    type: choice
    point: verbs-posar-donar
    lesson: 2
    instruction: "Tria el verb més precís."
    prompt: "No ___ gens del pressupost: és clar i detallat."
    answer: "dubto"
    distractors:
      - text: "tinc"
        why: "*Tenir* necessita un nom («tenir dubtes»). «Tinc» tot sol no funciona aquí: cal *dubtar*."
      - text: "poso"
        why: "*Posar* no hi té cap sentit. El verb precís és *dubtar*."
    explanation: "El verb precís per a «tenir dubtes» és *dubtar*: *no dubto gens*."

  - id: b2-50-024
    type: inline-choice
    point: verbs-posar-donar
    lesson: 2
    instruction: "Tria el verb més precís."
    title: "Nota de la Montse"
    text: "Hola, Carla: demà ve el fuster a {instal·lar|posar|engegar} l'armari. {Ajuda'l|Dona-li un cop de mà|Posa-li un cop de mà} a pujar-lo, que pesa molt. Jo {endreçaré|posaré en ordre|trencaré} el despatx abans que arribi. Montse."
    explanation: "Els verbs precisos són *instal·lar*, *ajudar* i *endreçar*. *Posar* i *donar un cop de mà* s'entenen, però són vagues; *posar un cop de mà* no es diu."

  - id: b2-50-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "L'obra s'ha de lliurar divendres: cal ___."
    answer: "posar mans a l'obra"
    distractors:
      - text: "posar-hi cullerada"
        why: "*Posar-hi cullerada* és ficar-se on no el demanen; aquí cal treballar: *posar mans a l'obra*."
      - text: "deixar-ho córrer"
        why: "*Deixar-ho córrer* vol dir abandonar-ho, just el contrari del que cal fer."
    explanation: "Amb un termini proper cal treballar de debò: *posar mans a l'obra*."

  - id: b2-50-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "El veí del tercer sempre ha de ___, encara que ningú li demani res."
    answer: "posar-hi cullerada"
    distractors:
      - text: "posar fil a l'agulla"
        why: "*Posar fil a l'agulla* vol dir començar una feina; aquí el veí opina sense que li demanin."
      - text: "fer mans i mànigues"
        why: "*Fer mans i mànigues* és fer tot el possible; aquí el veí es fica on no el demanen."
    explanation: "Opinar sense que li demanin és *posar-hi cullerada*."

  # ---------- Lliçó 3 ----------
  - id: b2-50-027
    type: choice
    point: noms-precisos
    lesson: 3
    instruction: "Tria el mot més precís."
    prompt: "Hi ha un ___ del pressupost que no entenc."
    answer: "detall"
    distractors:
      - text: "cosa"
        why: "*Cosa* és femení («una cosa») i, a més, és un mot vague: *un detall*."
      - text: "ferro"
        why: "*El ferro* és un material; aquí parlem d'una part del pressupost: *detall*."
    explanation: "Una part concreta d'un tema és un *detall*. *Cosa* és vague."

  - id: b2-50-028
    type: choice
    point: noms-precisos
    lesson: 3
    instruction: "Tria el mot més precís."
    prompt: "Passa'm el ___ per foradar la paret."
    answer: "trepant"
    distractors:
      - text: "cosa"
        why: "*Cosa* és femení («la cosa») i no diu de quin objecte parlem: *el trepant*."
      - text: "guix"
        why: "*El guix* és per allisar, no per foradar. L'eina per foradar és el *trepant*."
    explanation: "L'eina per foradar és el *trepant*. *Cosa* no diu de quin objecte parlem."

  - id: b2-50-029
    type: choice
    point: noms-precisos
    lesson: 3
    instruction: "Tria el mot més precís."
    prompt: "___ és urgent: hem de decidir avui si canviem la caldera."
    answer: "Aquest assumpte"
    distractors:
      - text: "Aquesta cosa"
