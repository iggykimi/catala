  - id: b2-53-064
    type: reading
    point: comprensio
    lesson: 5
    title: "La Núria i el certificat digital"
    text: |
      La Núria es va assabentar per una companya que, a partir del gener, tots els tràmits de l'ajuntament s'han de fer per internet. En sentir la notícia, es va adonar que no tenia el certificat digital i que el seu DNI caducava al març. Volia solucionar-ho tan aviat com fos possible, perquè el termini d'una beca acabava aviat. Va demanar hora per internet i, l'endemà, va acudir a l'oficina amb el DNI i una fotocòpia.

      A la finestreta, el funcionari li va demanar el justificant del pagament de la taxa. La Núria es va adonar que l'havia deixat a casa. Se li va ocórrer tornar-hi a la tarda: pel que fa als horaris, l'oficina obre fins a les set. A la tarda, el caixer automàtic s'havia espatllat i va haver de fer cua a la finestreta del costat, però finalment va aconseguir el certificat.

      D'acord amb les instruccions, va instal·lar el programa a l'ordinador. Al principi es va espantar: el programa semblava complicat. Però, en relació amb el manual, tot era molt clar: calia omplir un formulari, adjuntar-hi el DNI i signar amb la contrasenya. En pocs minuts va assolir el seu objectiu: va presentar la primera sol·licitud sense sortir de casa.

