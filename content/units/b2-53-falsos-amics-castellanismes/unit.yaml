id: b2-53
level: B2
title: "Falsos amics i castellanismes (II)"
summary: "Els verbs que es confonen amb el castellà: assabentar-se, adonar-se, espatllar-se, acudir, ocórrer-se, assolir i aconseguir. I el registre formal dels tràmits de l'administració."
vocabulary_theme: "Administració pública i tràmits"
points:
  - id: assabentar-adonar
    title: "Assabentar-se i adonar-se"
  - id: espatllar-acudir
    title: "Espatllar-se, acudir i ocórrer-se"
  - id: assolir-aconseguir
    title: "Assolir i aconseguir"
  - id: compte-formal
    title: "Compte amb el castellà: el registre formal"
    refs:
      - label: "Optimot: dubtes del català"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions dels tràmits"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: assabentar-se, adonar-se i espatllar-se"
  - title: "Practicar: acudir, ocórrer-se i assolir"
  - title: "El registre formal i les locucions"
  - title: "Produir: corregir tràmits"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la sol·licitud"
    definition: "Document amb què es demana una cosa a l'administració."
    example: "Vaig presentar la sol·licitud per internet."
  - word: "el formulari"
    definition: "Full amb caselles que cal omplir per fer un tràmit."
    example: "El formulari té dues pàgines."
  - word: "l'imprès"
    definition: "Formulari oficial en paper."
    example: "L'imprès es recull a la finestreta dos."
  - word: "la instància"
    definition: "Escrit formal amb què es demana o es comunica una cosa a l'administració."
    example: "Va presentar una instància al registre."
  - word: "el tràmit"
    definition: "Gestió que cal fer davant de l'administració."
    example: "Renovar el DNI és un tràmit senzill."
  - word: "tramitar"
    definition: "Fer les gestions d'un tràmit."
    example: "La gestoria ens tramita les sol·licituds."
  - word: "l'expedient"
    definition: "Conjunt de papers d'un mateix assumpte."
    example: "El seu expedient ja està resolt."
  - word: "el termini"
    definition: "Temps màxim per fer una cosa."
    example: "El termini acaba divendres."
  - word: "la taxa"
    definition: "Diners que es paguen per un servei públic."
    example: "Cal pagar la taxa abans de la prova."
  - word: "el rebut"
    definition: "Paper que demostra que has pagat una cosa."
    example: "Guarda el rebut de la matrícula."
  - word: "el justificant"
    definition: "Paper que demostra que has fet un tràmit."
    example: "Et donen un justificant de l'entrega."
  - word: "el certificat"
    definition: "Document oficial que acredita un fet."
    example: "Necessito un certificat d'empadronament."
  - word: "el volant"
    definition: "Certificat curt que lliura l'ajuntament."
    example: "M'han demanat el volant d'empadronament."
  - word: "l'empadronament"
    definition: "Registre de les persones que viuen en un municipi."
    example: "L'empadronament es fa a l'ajuntament."
  - word: "el padró"
    definition: "Llista oficial dels veïns d'un municipi."
    example: "Consta al padró des del 2019."
  - word: "la cita"
    definition: "Dia i hora reservats per ser atès."
    example: "Tinc cita demà a les nou."
  - word: "la finestreta"
    definition: "Taulell on atenen el públic."
    example: "Passi per la finestreta tres."
  - word: "el funcionari, la funcionària"
    definition: "Persona que treballa per a l'administració."
    example: "El funcionari em va revisar els papers."
  - word: "el registre"
    definition: "Oficina on es presenten els documents oficials."
    example: "Presenta la instància al registre."
  - word: "segellar"
    definition: "Posar el segell en un document."
    example: "Li van segellar la sol·licitud."
  - word: "el segell"
    definition: "Marca oficial en un document."
    example: "Al justificant hi falta el segell."
  - word: "signar"
    definition: "Escriure el nom en un document per acceptar-lo."
    example: "Cal signar totes les pàgines."
  - word: "la signatura"
    definition: "Nom escrit a mà en un document."
    example: "La signatura ha de ser l'original."
  - word: "la fotocòpia"
    definition: "Còpia en paper d'un document."
    example: "Porta l'original i una fotocòpia."
  - word: "compulsar"
    definition: "Donar validesa oficial a una fotocòpia."
    example: "A l'oficina et compulsen les còpies de franc."
  - word: "adjuntar"
    definition: "Afegir un document a una sol·licitud."
    example: "Cal adjuntar el DNI a la sol·licitud."
  - word: "sol·licitar"
    definition: "Demanar formalment."
    example: "Va sol·licitar un ajut de lloguer."
  - word: "l'ajut"
    definition: "Diners que l'administració dona per a una necessitat."
    example: "Ha demanat un ajut per als llibres."
  - word: "la convocatòria"
    definition: "Anunci oficial que obre un termini."
    example: "La convocatòria surt al butlletí."
  - word: "el requisit"
    definition: "Condició necessària per aconseguir una cosa."
    example: "Un requisit és estar empadronat."
  - word: "la plaça"
    definition: "Lloc de treball o d'estudi que s'ofereix."
    example: "Hi ha tres places d'administratiu."
  - word: "el recurs"
    definition: "Escrit per reclamar contra una decisió."
    example: "Va presentar un recurs contra la multa."
  - word: "l'al·legació"
    definition: "Raó escrita que es presenta en un tràmit."
    example: "Les al·legacions es fan en deu dies."
  - word: "la resolució"
    definition: "Decisió oficial sobre un assumpte."
    example: "La resolució arriba per correu."
  - word: "renovar"
    definition: "Fer de nou un document que caduca."
    example: "He de renovar el passaport."
  - word: "caducar"
    definition: "Deixar de tenir validesa un document."
    example: "El DNI caduca al mes de maig."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-53-001
    type: choice
    point: assabentar-adonar
    lesson: 1
    prompt: "La Carla es va ___ de la convocatòria per una veïna de l'escala."
    answer: "assabentar"
    distractors:
      - text: "enterar"
        why: "*Enterar-se* és un castellanisme, calc de «enterarse». En català: *assabentar-se*."
      - text: "assabentat"
        why: "El passat perifràstic és *va* + infinitiu: *es va assabentar*, no *es va assabentat*."
    explanation: "«Per una veïna» indica com ho va saber: *assabentar-se de* vol dir rebre una notícia. *Enterar-se* és un castellanisme."

  - id: b2-53-002
    type: choice
    point: assabentar-adonar
    lesson: 1
    prompt: "En obrir el sobre, en Jordi es va ___ que hi faltava el segell."
    answer: "adonar"
    distractors:
      - text: "donar compte"
        why: "*Donar-se compte* és un calc de «darse cuenta». En català: *adonar-se*."
      - text: "adonat"
        why: "El passat perifràstic és *va* + infinitiu: *es va adonar*, no *es va adonat*."
    explanation: "«En obrir el sobre» indica que ho nota en aquell moment: *adonar-se* vol dir notar una cosa que tens davant."

  - id: b2-53-003
    type: choice
    point: espatllar-acudir
    lesson: 1
    prompt: "El caixer de l'oficina es va ___ i vam haver de tornar l'endemà."
    answer: "espatllar"
    distractors:
      - text: "averiar"
        why: "*Averiar-se* és un castellanisme. En català, una màquina *s'espatlla*."
      - text: "espatllat"
        why: "El passat perifràstic és *va* + infinitiu: *es va espatllar*, no *es va espatllat*."
    explanation: "Una màquina que deixa de funcionar *s'espatlla*. *Averiar-se* és un castellanisme."

  - id: b2-53-004
    type: choice
    point: espatllar-acudir
    lesson: 1
    prompt: "Els aspirants han d'___ a l'oficina el dia de la prova amb el DNI."
    answer: "acudir"
    distractors:
      - text: "ocórrer"
        why: "*Ocórrer* vol dir passar, i *ocórrer-se*, venir una idea al cap. Per anar a un lloc, el verb és *acudir*."
      - text: "acudit"
        why: "*Haver de* va amb infinitiu: *han d'acudir*, no *han d'acudit*."
    explanation: "*Acudir* vol dir anar, presentar-se a un lloc: aquí, anar a l'oficina el dia de la prova."

  - id: b2-53-005
    type: choice
    point: espatllar-acudir
    lesson: 1
    prompt: "—Com vas aconseguir cita tan de pressa? —Se'm va ___ demanar-la per internet a les vuit del matí."
    answer: "ocórrer"
    distractors:
      - text: "ocurrir"
        why: "En català s'escriu *ocórrer*, amb *o*. *Ocurrir* és la forma castellana."
      - text: "acudir"
        why: "*Acudir* vol dir anar a un lloc. Una idea que ve al cap *s'ocorre*."
    explanation: "Una idea que ve al cap *s'ocorre*: *ocórrer-se*. *Acudir* vol dir anar, i *ocurrir* és la forma castellana."

  - id: b2-53-006
    type: match
    point: assabentar-adonar
    lesson: 1
    instruction: "Relaciona cada frase amb la seva continuació."
    pairs:
      - ["M'he assabentat de la convocatòria:", "l'he llegida al tauler d'anuncis."]
      - ["En Pau es va adonar de l'error:", "al justificant hi faltava el segell."]
      - ["Ens hem assabentat del canvi d'horari:", "ens ho ha dit el funcionari."]
      - ["La Laia es va adonar de la cua:", "arribava fins a la porta."]
    explanation: "*Assabentar-se* és rebre una notícia; *adonar-se* és notar una cosa que tens davant."

  - id: b2-53-007
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["fer cua", "esperar el torn en una fila"]
      - ["omplir un formulari", "escriure les dades en un imprès"]
      - ["demanar hora", "reservar dia i hora per ser atès"]
      - ["fer un tràmit", "fer una gestió a l'administració"]
      - ["presentar una sol·licitud", "entregar un document per demanar una cosa"]
      - ["pagar una taxa", "pagar un servei públic"]
    explanation: "Són les gestions més habituals davant de l'administració."

  - id: b2-53-008
    type: inline-choice
    point: assabentar-adonar
    lesson: 1
    title: "Convocatòria urgent"
    text: "La Núria {es va assabentar|es va enterar} de la convocatòria per un cartell. {Es va adonar|Es va donar compte} que el termini acabava divendres. A l'oficina, el funcionari {es va adonar|es va donar compte} que al formulari hi faltava la signatura. La Núria no {se n'havia assabentat|se n'havia enterat}."
    explanation: "*Assabentar-se* és rebre una notícia; *adonar-se* és notar una cosa. *Enterar-se* i *donar-se compte* són castellanismes."

  - id: b2-53-009
    type: fill
    point: assabentar-adonar
    lesson: 1
    prompt: "Ahir la Montse ___ de l'ajut per la carta de l'ajuntament."
    hint: "ASSABENTAR-SE, passat perifràstic"
    answers: ["es va assabentar"]
    wrong_answers:
      - text: "es va enterar"
        why: "*Enterar-se* és un castellanisme, calc de «enterarse». En català: *assabentar-se*."
      - text: "es va assabentat"
        why: "El passat perifràstic és *va* + infinitiu: *es va assabentar*."
    grading: tolerant
    explanation: "«Per la carta» indica com ho va saber: *assabentar-se de* vol dir rebre una notícia."

  - id: b2-53-010
    type: fill
    point: assabentar-adonar
    lesson: 1
    prompt: "En mirar el rebut, l'Ibrahim ___ que li havien cobrat dues vegades."
    hint: "ADONAR-SE, passat perifràstic"
    answers: ["es va adonar"]
    wrong_answers:
      - text: "es va donar compte"
        why: "*Donar-se compte* és un calc de «darse cuenta». En català: *adonar-se*."
      - text: "es va adonat"
        why: "El passat perifràstic és *va* + infinitiu: *es va adonar*."
    grading: tolerant
    explanation: "«En mirar el rebut» indica que ho nota en aquell moment: *adonar-se* vol dir notar una cosa que tens davant."

  - id: b2-53-011
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «omplir un formulari»?"
    answer: "Escriure les dades que demana un imprès."
    distractors:
      - text: "Lliurar un document al registre."
        why: "Això és *presentar* un document. *Omplir* és escriure-hi les dades."
      - text: "Pagar la taxa d'un tràmit."
        why: "La taxa es paga a part. *Omplir* és escriure les dades a l'imprès."
    explanation: "*Omplir un formulari* és escriure les dades a les caselles de l'imprès."

  - id: b2-53-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "—I per renovar el passaport, què he de fer? —Primer cal ___, per internet o per telèfon."
    answer: "demanar hora"
    distractors:
      - text: "fer cua"
        why: "La cua es fa a l'oficina, sense cita. Aquí cal reservar dia i hora: *demanar hora*."
      - text: "pagar una taxa"
        why: "La taxa és un pagament; aquí cal reservar dia i hora: *demanar hora*."
    explanation: "«Per internet o per telèfon» indica que cal reservar dia i hora abans d'anar-hi: *demanar hora*."

  - id: b2-53-013
    type: order
    point: assabentar-adonar
    lesson: 1
    cue: "Explica que en Pau va saber la notícia per un amic."
    chunks: ["en Pau", "es", "va", "assabentar", "de", "la", "notícia", "per", "un amic"]
    extra: ["enterar"]
    answers:
      - "En Pau es va assabentar de la notícia per un amic."
      - "Per un amic, en Pau es va assabentar de la notícia."
    explanation: "*Assabentar-se* vol dir rebre una notícia. *Enterar-se* és un castellanisme."

  # ---------- Lliçó 2 ----------
  - id: b2-53-014
    type: fill
    point: espatllar-acudir
    lesson: 2
    prompt: "La impressora de l'oficina ___ cada dos per tres."
    hint: "ESPATLLAR-SE, present"
    answers: ["s'espatlla"]
    wrong_answers:
      - text: "s'averia"
        why: "*Averiar-se* és un castellanisme. Una màquina *s'espatlla*."
      - text: "espatlla"
        why: "*Espatllar-se* és pronominal: la impressora *s'espatlla*."
    grading: tolerant
    explanation: "Una màquina que deixa de funcionar *s'espatlla*. El verb és pronominal: *s'espatlla*."

  - id: b2-53-015
    type: fill
    point: espatllar-acudir
    lesson: 2
    prompt: "Al funcionari se li va ___ una solució molt senzilla."
    hint: "OCÓRRER-SE, passat perifràstic"
    answers: ["ocórrer"]
    wrong_answers:
      - text: "ocurrir"
        why: "En català s'escriu *ocórrer*, amb *o*. *Ocurrir* és la forma castellana."
      - text: "acudir"
        why: "*Acudir* vol dir anar a un lloc. Una idea que ve al cap *s'ocorre*."
    grading: tolerant
    explanation: "Una idea que ve al cap *s'ocorre*: *ocórrer-se*. En català s'escriu amb *o*."

  - id: b2-53-016
    type: fill
    point: assolir-aconseguir
    lesson: 2
    prompt: "El ple de l'ajuntament va ___ un acord per unanimitat."
    hint: "ASSOLIR, passat perifràstic"
    answers: ["assolir"]
    wrong_answers:
      - text: "lograr"
        why: "*Lograr* és un castellanisme. Un acord és un objectiu: *assolir*."
      - text: "assolit"
        why: "El passat perifràstic és *va* + infinitiu: *va assolir*."
    grading: tolerant
    explanation: "«Un acord per unanimitat» és un objectiu: *assolir* vol dir arribar a un objectiu o a un acord."

  - id: b2-53-017
    type: fill
    point: assolir-aconseguir
    lesson: 2
    prompt: "Després de dos anys d'espera, l'Arnau va ___ una plaça a l'escola bressol."
    hint: "ACONSEGUIR, passat perifràstic"
    answers: ["aconseguir"]
    wrong_answers:
      - text: "lograr"
        why: "*Lograr* és un castellanisme. Una plaça és una cosa concreta: *aconseguir*."
      - text: "aconseguit"
        why: "El passat perifràstic és *va* + infinitiu: *va aconseguir*."
    grading: tolerant
    explanation: "«Una plaça a l'escola bressol» és una cosa concreta que s'obté amb esforç: *aconseguir*."

  - id: b2-53-018
    type: order
    point: espatllar-acudir
    lesson: 2
    cue: "Digues que els aspirants han d'anar a l'oficina."
    chunks: ["els", "aspirants", "han", "d'acudir", "a", "l'oficina"]
    extra: ["ocórrer"]
    answers:
      - "Els aspirants han d'acudir a l'oficina."
      - "A l'oficina han d'acudir els aspirants."
    explanation: "*Acudir* vol dir anar, presentar-se a un lloc. *Ocórrer* és una altra cosa: passar o venir al cap."

  - id: b2-53-019
    type: order
    point: assolir-aconseguir
    lesson: 2
    cue: "Digues que la Fàtima va obtenir l'ajut de lloguer."
    chunks: ["la", "Fàtima", "va", "aconseguir", "l'ajut", "de", "lloguer"]
    extra: ["lograr"]
    answers:
      - "La Fàtima va aconseguir l'ajut de lloguer."
    explanation: "«L'ajut de lloguer» és una cosa concreta que s'obté amb esforç: *aconseguir*. *Lograr* és un castellanisme."

  - id: b2-53-020
    type: choice
    point: assolir-aconseguir
    lesson: 2
    prompt: "«Assolir els objectius» vol dir ___."
    answer: "arribar als objectius marcats"
    distractors:
      - text: "obtenir un document concret"
        why: "Això és *aconseguir*. *Assolir* és arribar a un objectiu."
      - text: "rebre una notícia"
        why: "Això és *assabentar-se*. *Assolir* és arribar a un objectiu."
    explanation: "*Assolir* vol dir arribar a un objectiu, a un nivell o a un acord."

  - id: b2-53-021
    type: match
    point: assolir-aconseguir
    lesson: 2
    instruction: "Relaciona cada verb amb el seu complement."
    pairs:
      - ["assolir un acord", "arribar a un pacte"]
      - ["aconseguir una plaça", "obtenir un lloc"]
      - ["assolir el nivell B2", "arribar al nivell B2"]
      - ["aconseguir un certificat", "obtenir un document"]
    explanation: "*Assolir* és arribar a un objectiu o a un acord; *aconseguir* és obtenir una cosa concreta."

  - id: b2-53-022
    type: choice
    point: expressions
    lesson: 2
    prompt: "«Fer un tràmit» vol dir ___."
    answer: "fer una gestió davant de l'administració"
    distractors:
      - text: "esperar el torn en una fila"
        why: "Això és *fer cua*. Un tràmit és una gestió."
      - text: "escriure les dades en un imprès"
        why: "Això és *omplir un formulari*. Un tràmit és la gestió sencera."
    explanation: "*Fer un tràmit* és fer una gestió davant de l'administració, com renovar el DNI."

  - id: b2-53-023
    type: inline-choice
    point: assolir-aconseguir
    lesson: 2
    title: "Balanç del trimestre"
    text: "Aquest trimestre hem {assolit|assolir|lograt} els objectius de recollida selectiva. La Montse ha {aconseguit|aconseguir|lograt} una plaça per al seu fill a l'escola bressol. El ple també ha {assolit|assolir|lograt} un acord sobre els horaris. En Pau encara no ha {aconseguit|aconseguir|lograt} el certificat digital."
    explanation: "*Assolir* és arribar a un objectiu o a un acord; *aconseguir* és obtenir una cosa concreta. *Lograr* és un castellanisme."

  - id: b2-53-024
    type: choice
    point: espatllar-acudir
    lesson: 2
    prompt: "Per recollir el certificat, cal ___ a la finestreta dos amb el justificant."
    answer: "acudir"
    distractors:
      - text: "ocórrer"
        why: "*Ocórrer* vol dir passar, i *ocórrer-se*, venir una idea al cap. Per anar a un lloc, el verb és *acudir*."
      - text: "acudit"
        why: "Darrere de *cal* va infinitiu: *cal acudir*, no *cal acudit*."
    explanation: "«A la finestreta dos» és el lloc on cal anar: *acudir* vol dir anar, presentar-se."

  - id: b2-53-025
    type: choice
    point: assolir-aconseguir
    lesson: 2
    prompt: "L'Ibrahim vol ___ el certificat digital abans de l'estiu."
    answer: "aconseguir"
    distractors:
      - text: "lograr"
        why: "*Lograr* és un castellanisme. En català: *aconseguir*."
      - text: "aconseguit"
        why: "Darrere de *voler* va infinitiu: *vol aconseguir*, no *vol aconseguit*."
    explanation: "«El certificat digital» és una cosa concreta que s'obté amb esforç: *aconseguir*."

  - id: b2-53-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "—Hi ha molta gent, oi? —Sí, hauràs de ___ una bona estona."
    answer: "fer cua"
    distractors:
      - text: "fer un tràmit"
        why: "El tràmit és la gestió. Esperar-se a la fila és *fer cua*."
      - text: "demanar hora"
        why: "«Hi ha molta gent» vol dir que ja és allà: no pot reservar, ha de *fer cua*."
    explanation: "«Hi ha molta gent» i «una bona estona» indiquen espera a la fila: *fer cua*."

  # ---------- Lliçó 3 ----------
  - id: b2-53-027
    type: find-error
    point: compte-formal
    lesson: 3
    sentence: "A nivell dels terminis, no hi ha canvis aquest any."
    error: "A nivell de"
    fix: "Quant a"
    fix_distractors:
      - text: "En base a"
        why: "*En base a* és un castellanisme. Aquí cal «quant a»: *quant a*."
      - text: "A partir de"
