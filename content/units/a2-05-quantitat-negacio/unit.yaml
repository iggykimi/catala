# Unitat a2-05: Quantitat i negació
id: a2-05
level: A2
title: "Quantitat i negació"
summary: "Quantificadors (*molt, poc, massa, prou, força, bastant*), *gaire* i *gens*, la negació (*cap, ningú, res, enlloc, mai, tampoc*) i expressions (*ni de broma, tant me fa, no fa res, ni fu ni fa*)."
vocabulary_theme: "Compres, botigues, quantitats i envasos"
points:
  - id: quantificadors
    title: "Quantitat: *molt, poc, massa, prou, força, bastant*"
    refs:
      - label: "GEIEC: Els quantificadors"
        url: "https://geiec.iec.cat"
  - id: gaire-gens
    title: "*Gaire* i *gens* en negatives i preguntes"
    refs:
      - label: "GEIEC: Els quantificadors"
        url: "https://geiec.iec.cat"
  - id: negacio
    title: "La negació: *cap, ningú, res, enlloc, mai, tampoc*"
    refs:
      - label: "GEIEC: La negació"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: *gaire, res* i altres"
  - id: expressions
    title: "Expressions per negar i per dir que és igual"
lessons:
  - title: "Molta gent al mercat"
  - title: "Practicar la quantitat"
  - title: "La negació i els calcs"
  - title: "Produir frases negatives"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la botiga"
    definition: "Lloc on es venen coses."
    example: "A la botiga del barri tenen un pa molt bo."
  - word: "el mercat"
    definition: "Lloc amb parades on es ven menjar."
    example: "Dissabte anem al mercat a comprar verdura."
  - word: "la fleca"
    definition: "Botiga on es ven pa."
    example: "La fleca del carrer Major obre a les set."
  - word: "el forn"
    definition: "Botiga on es fa i es ven pa."
    example: "El forn tanca els diumenges."
  - word: "la peixateria"
    definition: "Botiga on es ven peix."
    example: "A la peixateria hi ha cua cada matí."
  - word: "la fruiteria"
    definition: "Botiga on es ven fruita."
    example: "A la fruiteria hi ha poques ofertes avui."
  - word: "el quiosc"
    definition: "Botiga petita on es venen diaris."
    example: "Compro el diari al quiosc de la plaça."
  - word: "la farmàcia"
    definition: "Botiga on es venen medicines."
    example: "La farmàcia del centre tanca a les nou."
  - word: "el preu"
    definition: "Diners que costa una cosa."
    example: "El preu del peix ha pujat molt."
  - word: "l'oferta"
    definition: "Preu baix durant uns dies."
    example: "Aquesta setmana hi ha ofertes de formatge."
  - word: "la rebaixa"
    definition: "Descompte gran en una època de l'any."
    example: "A les rebaixes, molta gent va de compres."
  - word: "el tiquet"
    definition: "Paper petit que diu què has comprat."
    example: "Guarda el tiquet de la compra."
  - word: "la caixa"
    definition: "Lloc de la botiga on es paga."
    example: "Hi ha molta gent a la caixa."
  - word: "la cua"
    definition: "Fila de gent que espera."
    example: "A la fleca no hi ha ningú a la cua."
  - word: "el cistell"
    definition: "Recipient per portar una compra petita."
    example: "Agafa un cistell a l'entrada."
  - word: "la bossa"
    definition: "Recipient per portar la compra a casa."
    example: "Porta una bossa de casa."
  - word: "el paquet"
    definition: "Embolcall d'un producte."
    example: "He comprat un paquet de macarrons."
  - word: "l'ampolla"
    definition: "Envàs alt i estret per a líquids."
    example: "Una ampolla d'oli d'oliva."
  - word: "la capsa"
    definition: "Envàs quadrat, sovint de cartó."
    example: "Una capsa de galetes de xocolata."
  - word: "la dotzena"
    definition: "Grup de dotze coses."
    example: "Una dotzena d'ous."
  - word: "la barra"
    definition: "Pa llarg i estret."
    example: "Cada dia comprem una barra de pa."
  - word: "la llista"
    definition: "Paper amb les coses que has de comprar."
    example: "Faig la llista abans d'anar al mercat."
  - word: "el diari"
    definition: "Fulls amb les notícies del dia."
    example: "Llegeixo el diari amb el cafè."
  - word: "comprar"
    definition: "Donar diners a canvi d'una cosa."
    example: "Cada dissabte comprem verdura al mercat."
  - word: "costar"
    definition: "Tenir un preu."
    example: "Aquest formatge costa massa."
  - word: "car, cara"
    definition: "Que té un preu alt."
    example: "El pernil és massa car."
  - word: "el client, la clienta"
    definition: "Persona que compra coses."
    example: "Avui hi ha pocs clients."
  - word: "el dependent, la dependenta"
    definition: "Persona que ven coses."
    example: "El dependent és molt amable."
  - word: "la factura"
    definition: "Paper que diu quins diners has de pagar."
    example: "Aquest mes tinc moltes factures."
  - word: "el got"
    definition: "Recipient per beure."
    example: "Posa els gots a taula."
  - word: "el pastís"
    definition: "Dolç de forn, sovint amb crema o fruita."
    example: "Fem un pastís per a l'aniversari."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-05-001
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "Avui hi ha ___ gent a la caixa del forn."
    answer: "molta"
    distractors:
      - text: "molt"
        why: "*Molt* és masculí. «Gent» és femení: *molta*."
      - text: "molts"
        why: "*Molts* és plural. «Gent» és singular: *molta*."
    explanation: "«Gent» és femení singular: *molta gent*."

  - id: a2-05-002
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "Aquest mes tinc ___ factures pendents."
    answer: "moltes"
    distractors:
      - text: "molta"
        why: "*Molta* és singular. «Factures» és plural: *moltes*."
      - text: "molts"
        why: "*Molts* és masculí. «Factures» és femení: *moltes*."
    explanation: "«Factures» és femení plural: *moltes factures*."

  - id: a2-05-003
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "A la nevera queden ___ ous."
    answer: "pocs"
    distractors:
      - text: "poc"
        why: "*Poc* és singular. «Ous» és plural: *pocs*."
      - text: "poques"
        why: "*Poques* és femení. «Ous» és masculí: *pocs*."
    explanation: "«Ous» és masculí plural: *pocs ous*."

  - id: a2-05-004
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "Aquest formatge costa ___: no el compro."
    answer: "massa"
    distractors:
      - text: "masses"
        why: "*Massa* no canvia mai: *costa massa*."
      - text: "masa"
        why: "*Massa* s'escriu amb dues esses."
    explanation: "*Massa* no canvia mai: *costa massa*."

  - id: a2-05-005
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "M'agrada ___ el pa calent."
    answer: "molt"
    distractors:
      - text: "molta"
        why: "Amb un verb, *molt* no canvia: *m'agrada molt*."
      - text: "molts"
        why: "Amb un verb, *molt* no canvia: *m'agrada molt*."
    explanation: "Amb un verb, *molt* no canvia: *m'agrada molt*."

  - id: a2-05-006
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "A casa tinc ___ pa."
    answer: "prou"
    distractors:
      - text: "prous"
        why: "*Prou* no canvia mai: *prou pa*."
      - text: "pròu"
        why: "*Prou* no porta accent."
    explanation: "*Prou* no canvia mai: *prou pa*."

  - id: a2-05-007
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "Hi ha ___ rebaixes a la botiga del barri."
    answer: "força"
    distractors:
      - text: "forsa"
        why: "*Força* s'escriu amb *ç*."
      - text: "forces"
        why: "*Força* no canvia mai: *força rebaixes*."
    explanation: "*Força* no canvia mai: *força rebaixes*."

  - id: a2-05-008
    type: choice
    point: quantificadors
    lesson: 1
    prompt: "Tinc ___ feina per tota la setmana."
    answer: "bastant"
    distractors:
      - text: "bastante"
        why: "«Bastante» és la forma castellana. En català és *bastant*."
      - text: "bastantes"
        why: "En català, *bastant* s'escriu sense *e* final: *bastant feina*."
    explanation: "*Bastant* s'escriu sense *e* final: *bastant feina*."

  - id: a2-05-009
    type: choice
    point: gaire-gens
    lesson: 1
    prompt: "No tinc ___ temps avui."
    answer: "gaire"
    distractors:
      - text: "gens"
        why: "*Gens* va amb *de* davant d'un nom: *gens de temps*."
      - text: "gaires"
        why: "«Temps» és singular: *gaire*."
    explanation: "En una frase negativa, *gaire* va sense *de*: *gaire temps*."

  - id: a2-05-010
    type: choice
    point: gaire-gens
    lesson: 1
    prompt: "No queda ___ de pa a la fleca."
    answer: "gens"
    distractors:
      - text: "gaire"
        why: "*Gaire* va sense *de*: *gaire pa*."
      - text: "cap"
        why: "Davant de *de* + nom, la forma és *gens*: *gens de pa*. *Cap* va directament amb el nom."
    explanation: "*Gens* va amb *de* davant d'un nom: *gens de pa*."

  - id: a2-05-011
    type: choice
    point: gaire-gens
    lesson: 1
    prompt: "—Tens ___ fred? —Una mica."
    answer: "gaire"
    distractors:
      - text: "gaire de"
        why: "*Gaire* va sense *de*: *gaire fred*."
      - text: "gens"
        why: "*Gens* va amb *de* davant d'un nom: *gens de fred*."
    explanation: "Per preguntar per una quantitat petita fem servir *gaire*: *Tens gaire fred?*"

  - id: a2-05-012
    type: match
    point: quantificadors
    lesson: 1
    instruction: "Relaciona cada nom amb el quantificador correcte."
    pairs:
      - ["pa", "molt"]
      - ["ous", "molts"]
      - ["sal", "poca"]
      - ["ofertes", "moltes"]
    explanation: "*Molt* i *poc* concorden amb el nom: *molt pa*, *molts ous*, *poca sal* i *moltes ofertes*."

  - id: a2-05-013
    type: inline-choice
    point: quantificadors
    lesson: 1
    title: "Al mercat del dissabte"
    text: "Aquest matí he anat al mercat. Hi havia {molta|molt|moltes} gent a l'entrada i he fet una cua llarga. He comprat {molts|molt|moltes} ous i {molta|molt|moltes} llet, però {poc|poca|pocs} formatge. A la fruiteria hi havia {poques|poca|pocs} ofertes. El preu del formatge és bo."
    explanation: "*Molt* i *poc* concorden amb el nom: *molta gent*, *molts ous*, *molta llet*, *poc formatge* i *poques ofertes*."

  # ---------- Lliçó 2 ----------
  - id: a2-05-014
    type: fill
    point: quantificadors
    lesson: 2
    prompt: "A la festa hi ha ___ gent de l'oficina."
    hint: "MOLT"
    answers: ["molta"]
    wrong_answers:
      - text: "molt"
        why: "«Gent» és femení: *molta*."
      - text: "molts"
        why: "«Gent» és singular: *molta*."
    grading: tolerant
    explanation: "«Gent» és femení i singular: *molta*."

  - id: a2-05-015
    type: fill
    point: quantificadors
    lesson: 2
    prompt: "Aquest mes he rebut ___ cartes del banc."
    hint: "MOLT"
    answers: ["moltes"]
    wrong_answers:
      - text: "molts"
        why: "«Cartes» és femení: *moltes*."
      - text: "molta"
        why: "«Cartes» és plural: *moltes*."
    grading: tolerant
    explanation: "«Cartes» és femení plural: *moltes cartes*."

  - id: a2-05-016
    type: fill
    point: quantificadors
    lesson: 2
    prompt: "Queda ___ sucre per al pastís de diumenge."
    hint: "POC"
    answers: ["poc"]
    wrong_answers:
      - text: "poca"
        why: "«Sucre» és masculí: *poc*."
      - text: "pocs"
        why: "«Sucre» és singular: *poc*."
    grading: tolerant
    explanation: "«Sucre» és masculí singular: *poc sucre*."

  - id: a2-05-017
    type: fill
    point: quantificadors
    lesson: 2
    prompt: "A la peixateria hi ha ___ cua avui."
    hint: "MASSA"
    answers: ["massa"]
    wrong_answers:
      - text: "masses"
        why: "*Massa* no canvia mai."
      - text: "masa"
        why: "*Massa* s'escriu amb dues esses."
    grading: tolerant
    explanation: "*Massa* no canvia: *massa cua*."

  - id: a2-05-018
    type: fill
    point: gaire-gens
    lesson: 2
    prompt: "No tinc ___ llet a casa."
    hint: "quantificador negatiu"
    answers: ["gaire", "gens de"]
    wrong_answers:
      - text: "gaire de"
        why: "*Gaire* va sense *de*."
      - text: "gens"
        why: "*Gens* va amb *de* davant d'un nom."
    grading: tolerant
    explanation: "En una frase negativa, *gaire* va sense *de*: *gaire llet*. També es pot dir *gens de llet*."

  - id: a2-05-019
    type: fill
    point: gaire-gens
    lesson: 2
    prompt: "No hi ha ___ de sucre a casa."
    hint: "quantificador negatiu"
    answers: ["gens"]
    wrong_answers:
      - text: "gaire"
        why: "*Gaire* va sense *de*: *gaire sucre*."
      - text: "cap"
        why: "Davant de *de* + nom, la forma és *gens*: *gens de sucre*. *Cap* va directament amb el nom."
    grading: tolerant
    explanation: "*Gens* va amb *de* davant d'un nom: *gens de sucre*."

  - id: a2-05-020
    type: fill
    point: gaire-gens
    lesson: 2
    prompt: "—Queda ___ pa a casa? —Sí, una barra sencera."
    hint: "quantificador per a preguntes"
    answers: ["gaire", "gens de"]
    wrong_answers:
      - text: "gens"
        why: "*Gens* va amb *de* davant d'un nom."
      - text: "gaire de"
        why: "*Gaire* va sense *de*."
    grading: tolerant
    explanation: "Per preguntar per una quantitat petita fem servir *gaire*, sense *de*: *gaire pa*. També es pot dir *gens de pa*."

  - id: a2-05-021
    type: order
    point: quantificadors
    lesson: 2
    cue: "Digues que hi ha molta gent a la cua del forn."
    chunks: ["hi ha", "molta gent", "a la cua", "del forn"]
    extra: ["moltes gent"]
    answers:
      - "Hi ha molta gent a la cua del forn."
      - "A la cua del forn hi ha molta gent."
    explanation: "*Molta* concorda amb «gent»: femení singular."

  - id: a2-05-022
    type: order
    point: gaire-gens
    lesson: 2
    cue: "Digues que no tens gaire temps avui."
    chunks: ["no", "tinc", "gaire temps", "avui"]
    extra: ["gaire de temps"]
    answers:
      - "No tinc gaire temps avui."
      - "Avui no tinc gaire temps."
    explanation: "*Gaire* va sense *de*: *No tinc gaire temps*."

  - id: a2-05-023
    type: order
    point: quantificadors
    lesson: 2
    cue: "Digues que avui tens prou llet a la nevera."
    chunks: ["tinc", "prou llet", "a la nevera", "avui"]
    extra: ["prous llet"]
    answers:
      - "Tinc prou llet a la nevera avui."
      - "Avui tinc prou llet a la nevera."
    explanation: "*Prou* no canvia: *prou llet*."

  - id: a2-05-024
    type: choice
    point: quantificadors
    lesson: 2
    prompt: "La Laia parla ___ de pressa."
    answer: "molt"
    distractors:
      - text: "molta"
        why: "Amb un verb, *molt* no canvia: *parla molt*."
      - text: "molts"
        why: "Amb un verb, *molt* no canvia: *parla molt*."
    explanation: "*Parla* és un verb: *molt* no canvia."

  - id: a2-05-025
    type: choice
    point: gaire-gens
    lesson: 2
    prompt: "Aquest te no m'agrada ___."
    answer: "gens"
    distractors:
      - text: "gaire de"
        why: "*Gaire* va sense *de*."
      - text: "gens de"
        why: "*De* necessita un nom darrere: *no m'agrada gens*."
    explanation: "Sense un nom darrere, *gens* va sol: *no m'agrada gens*."

  - id: a2-05-026
    type: inline-choice
    point: gaire-gens
    lesson: 2
    title: "Un missatge a la Núria"
    text: "Núria, aquesta setmana no tinc {gaire|gens|gaires} temps lliure. A la feina no queda {gens|gaire|cap} de calma: tenim {massa|massas|masa} comandes. Demà et truco, d'acord?"
    explanation: "*Gaire* va sense *de*: *gaire temps*. *Gens* va amb *de*: *gens de calma*. *Massa* no canvia: *massa comandes*."

  # ---------- Lliçó 3 ----------
  - id: a2-05-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "A la farmàcia hi ha bastante cua aquest matí."
    error: "bastante"
    fix: "bastant"
    fix_distractors:
      - text: "bastantes"
        why: "*Bastant* s'escriu sense *e* final."
      - text: "vastant"
        why: "*Bastant* s'escriu amb *b*."
    explanation: "«Bastante» és la forma castellana; en català és *bastant*."

  - id: a2-05-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "Aquest pernil és muy bo."
    error: "muy"
    fix: "molt"
    fix_distractors:
      - text: "molta"
        why: "*Molt* no canvia davant d'un adjectiu: *molt bo*."
      - text: "moltes"
        why: "*Molt* no canvia davant d'un adjectiu: *molt bo*."
    explanation: "«Muy» és castellà. En català: *molt bo*."

  - id: a2-05-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Jo no menjo carn. —Jo tampoco."
    error: "tampoco"
    fix: "tampoc"
    fix_distractors:
      - text: "també"
        why: "Responem a una negativa («Jo no menjo carn»): cal *tampoc*, no *també*."
      - text: "tan poc"
        why: "*Tan poc* són dues paraules i parlen d'una quantitat: *tampoc* és una paraula."
    explanation: "«Tampoco» és castellà. En català: *Jo tampoc*."

  - id: a2-05-030
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "No ve nadie a dinar diumenge."
    error: "nadie"
    fix: "ningú"
    fix_distractors:
      - text: "algú"
        why: "En una frase negativa com aquesta diem *ningú*."
      - text: "cap"
        why: "Per a persones, sense nom, diem *ningú*. Aquí *cap* necessitaria un nom darrere, com *cap amic*."
    explanation: "«Nadie» és castellà. En català: *ningú*."

  - id: a2-05-031
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "L'Ibrahim no té molts clients encara."
    no_error: true
    explanation: "La frase és correcta: en negatives *molts* no és incorrecte, però sona més natural *gaires*."

  - id: a2-05-032
    type: choice
    point: negacio
    lesson: 3
    prompt: "No hi ha ___ a la botiga: tanquen aviat."
    answer: "ningú"
    distractors:
      - text: "algú"
        why: "En una frase negativa com aquesta diem *ningú*."
      - text: "cap"
        why: "Per a persones, sense nom, diem *ningú*. Aquí *cap* necessitaria un nom darrere, com *cap client*."
    explanation: "Parlem de persones en una frase negativa: *ningú*."

  - id: a2-05-033
    type: choice
    point: negacio
    lesson: 3
    prompt: "No vull ___, gràcies: ja he dinat."
    answer: "res"
    distractors:
      - text: "cap"
        why: "Per a coses, sense nom, diem *res*. Aquí *cap* necessitaria un nom darrere, com *cap plat*."
      - text: "alguna cosa"
        why: "En una frase negativa, *alguna cosa* passa a *res*."
    explanation: "Parlem de coses en una frase negativa: *res*."

  - id: a2-05-034
    type: choice
    point: negacio
    lesson: 3
    prompt: "No trobo el tiquet ___."
    answer: "enlloc"
    distractors:
      - text: "en lloc"
        why: "*Enlloc* (= en cap lloc) s'escriu en una sola paraula."
      - text: "enllocs"
        why: "*Enlloc* no té plural."
    explanation: "*Enlloc* vol dir «en cap lloc» i no canvia."

  - id: a2-05-035
    type: choice
    point: negacio
    lesson: 3
    prompt: "La Maria no menja ___ carn."
    answer: "mai"
    distractors:
      - text: "nunca"
        why: "«Nunca» és castellà. En català és *mai*."
      - text: "tampoc"
        why: "*Tampoc* respon a una negativa anterior."
    explanation: "*Mai* parla del temps en una frase negativa."

  - id: a2-05-036
    type: fill
    point: negacio
    lesson: 3
    prompt: "No tinc ___ germà: els meus pares tenen un sol fill."
    hint: "ALGUN, en negativa"
    answers: ["cap"]
    wrong_answers:
      - text: "algun"
        why: "En una frase negativa, *algun* passa a *cap*."
      - text: "res"
        why: "*Res* no va amb un nom: *cap germà*."
    grading: tolerant
    explanation: "En una frase negativa, *algun* passa a *cap*: *cap germà*."

  - id: a2-05-037
    type: fill
    point: negacio
    lesson: 3
    prompt: "El Wei té ___ llibre de receptes, si el vols."
    hint: "amb *algun*"
    answers: ["algun"]
    wrong_answers:
      - text: "cap"
        why: "*Cap* no va en frases afirmatives com aquesta: cal *algun*."
      - text: "res"
        why: "*Res* no va amb un nom."
    grading: tolerant
    explanation: "És una frase afirmativa i la pista demana *algun*: *algun llibre*."

  - id: a2-05-038
    type: fill
