  # ---------- Lliçó 5 ----------
  - id: a2-05-053
    type: reading
    point: negacio
    lesson: 5
    title: "La compra de la Laia"
    text: |
      Cada dissabte al matí, la Laia va al mercat. Va d'hora, perquè després hi ha molta gent i no té gaire temps. Compra la verdura i una dotzena d'ous a la parada de la plaça. A la llista també porta una ampolla d'oli, un paquet de macarrons i una capsa de galetes.
      Aquesta setmana no ha trobat cap oferta de peix, i el pernil és massa car. «Avui no compro ni peix ni pernil», diu. A la fleca no hi ha ningú a la cua, i compra una barra de pa calent. De tornada passa per davant del quiosc, però no compra el diari: no té gaire temps de llegir.
      A casa, el seu company l'ajuda amb les bosses. «Vols res més de la botiga?», pregunta ell. «No, amb això en tinc prou», diu la Laia.
    questions:
      - prompt: "Per què va d'hora al mercat?"
        answer: "Perquè més tard hi ha molta gent."
        distractors:
          - text: "Perquè el dependent marxa d'hora."
            why: "El text diu que hi va d'hora perquè després hi ha molta gent."
          - text: "Perquè la fleca tanca d'hora."
            why: "De la fleca només diu que no hi ha ningú a la cua."
      - prompt: "Què compra a la parada de la plaça?"
        answer: "Verdura i ous."
        distractors:
          - text: "Peix i pernil."
            why: "De peix no ha trobat cap oferta, i el pernil és massa car."
          - text: "Pa i el diari."
            why: "El pa el compra a la fleca, i el diari no el compra."
      - prompt: "Què fa la Laia a la fleca?"
        answer: "Compra una barra de pa a la fleca."
        distractors:
          - text: "Compra una ampolla d'oli."
            why: "L'oli és a la llista, però a la fleca compra pa."
          - text: "No compra res."
            why: "A la fleca sí que compra: una barra de pa."
      - prompt: "Què respon la Laia quan el company li pregunta si vol res més?"
        answer: "Que amb això en té prou."
        distractors:
          - text: "Que no ha trobat cap oferta de peix."
            why: "Això passa al mercat, abans de tornar a casa."
          - text: "Que el pernil és massa car."
            why: "Això ho pensa al mercat, no a casa."
    explanation: "La Laia va al mercat d'hora, compra verdura, ous i pa, i no vol res més."

