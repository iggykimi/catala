  # ---------------- Lliçó 5 ----------------
  - id: b1-13-052
    type: reading
    point: comprensio
    lesson: 5
    title: "El barri de la Laia"
    text: |
      La Laia viu al barri de Sant Narcís de Girona des de fa cinc anys. Diu que hi viu més tranquil·la que al centre, on vivia abans: hi ha menys cotxes, les voreres són amples i el veïnat es coneix.

      Cada matí va a la piscina municipal, que és a deu minuts de casa. Hi va a les set, abans de la feina, i hi nada mitja hora. Després esmorza al forn del carrer major, i sempre hi troba la mateixa colla.

      Els dimarts i els dijous va al centre cívic: hi fa un curs de ceràmica i, quan surt, passa per la biblioteca a tornar llibres. «Hi vaig cada setmana —diu la Laia—. Hi ha una sala molt tranquil·la i un jardí petit, i sempre hi trobo el que busco.»

      El cap de setmana queda amb els amics a la plaça del barri, al costat de la parada d'autobús. Dissabte passat hi van anar tots, fins i tot el Wei, que viu a Salt. Van sopar a la terrassa del casal i després van passejar pel passeig fins a la font.

      «El meu barri m'encanta —diu la Laia—. Tot és a prop i hi visc molt bé.»
    questions:
      - prompt: "On viu la Laia?"
        answer: "A Sant Narcís de Girona."
        distractors:
          - text: "Al centre de Girona."
            why: "Al centre hi vivia abans; ara viu a Sant Narcís."
          - text: "A Salt, amb el Wei."
            why: "A Salt hi viu el Wei, no la Laia."
      - prompt: "Què fa la Laia cada matí?"
        answer: "Nada a la piscina abans de treballar."
        distractors:
          - text: "Queda amb els amics a la plaça."
            why: "Amb els amics queda el cap de setmana, no cada matí."
          - text: "Va al curs de ceràmica."
            why: "El curs és dimarts i dijous, no cada matí."
      - prompt: "Què fa la Laia a la biblioteca?"
        answer: "Torna llibres i busca el que necessita."
        distractors:
          - text: "Fa el curs de ceràmica."
            why: "El curs és al centre cívic."
          - text: "Treballa a la sala tranquil·la."
            why: "El text no diu que hi treballi: hi torna llibres i hi busca el que necessita."
      - prompt: "Qui va anar dissabte a la plaça?"
        answer: "La Laia, els seus amics i el Wei."
        distractors:
          - text: "Només la Laia i el Wei."
            why: "Hi van anar tots els amics."
          - text: "Tot el veïnat del barri."
            why: "El text parla dels amics, no de tot el veïnat."
    explanation: "El text explica la vida de la Laia al seu barri: on viu, què hi fa cada dia i amb qui hi queda."

