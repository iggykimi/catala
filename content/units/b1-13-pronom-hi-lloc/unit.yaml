id: b1-13
level: B1
title: "El pronom hi (I): lloc"
summary: "Aprens a fer servir *hi* per al lloc on anem o on som (*hi vaig*, *hi visc*), amb verbs de moviment (*tornar-hi*, *passar-hi*) i en expressions (*ja hi som*)."
vocabulary_theme: "Barri, serveis i equipaments"
points:
  - id: hi-locatiu
    title: "*Hi* de lloc: *hi vaig*, *hi visc*, *no hi era*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: hi-moviment
    title: "*Hi* amb verbs de moviment: *tornar-hi*, *passar-hi*, *quedar-hi*"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: hi-formes
    title: "*Anar-hi*, *ser-hi* i la posició del pronom"
    refs:
      - label: "GEIEC: Els pronoms febles"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: no ometre *hi*"
  - id: expressions
    title: "Expressions amb *hi*"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: on anem i on som"
  - title: "Practicar *hi*: lloc i moviment"
  - title: "Formes, *ser-hi* i interferències"
  - title: "Produir: tot junt"
  - title: "Repàs mesclat i lectura"
vocabulary:
  - word: "el barri"
    definition: "Zona d'una ciutat o d'un poble que té un nom propi."
    example: "El nostre barri té un mercat molt bo."
  - word: "la plaça"
    definition: "Espai obert del barri on la gent es troba i passeja."
    example: "Els diumenges la plaça s'omple de nens."
  - word: "el carrer major"
    definition: "El carrer principal d'un poble o d'un barri."
    example: "La farmàcia és al carrer major."
  - word: "la vorera"
    definition: "Part del carrer on caminen les persones."
    example: "Les voreres noves són més amples."
  - word: "el passeig"
    definition: "Carrer ample, sovint amb arbres, per passejar."
    example: "Al vespre el passeig és ple de gent."
  - word: "el parc"
    definition: "Espai verd amb arbres, bancs i camins."
    example: "Al parc hi ha una zona per a gossos."
  - word: "el jardí"
    definition: "Espai amb plantes i flors, públic o d'una casa."
    example: "El jardí de la biblioteca és molt tranquil."
  - word: "la font"
    definition: "Construcció d'on surt aigua, en una plaça o un parc."
    example: "Els nens juguen al voltant de la font."
  - word: "el banc"
    definition: "Seient llarg de fusta o pedra, en un parc o una plaça."
    example: "S'asseuen al banc a llegir el diari."
  - word: "la biblioteca"
    definition: "Lloc on es llegeixen i es deixen llibres."
    example: "La Laia va a la biblioteca cada dimecres."
  - word: "el casal"
    definition: "Local del barri on es fan activitats i cursos."
    example: "Al casal fan un curs de cuina."
  - word: "el centre cívic"
    definition: "Equipament del barri amb activitats culturals i serveis."
    example: "L'exposició és al centre cívic."
  - word: "el CAP"
    definition: "Centre on els veïns van quan necessiten el metge."
    example: "Demà tinc visita al CAP a les nou."
  - word: "la farmàcia"
    definition: "Botiga on es venen medicaments."
    example: "La farmàcia de guàrdia tanca a les deu."
  - word: "el forn"
    definition: "Botiga on es fa i es ven pa."
    example: "Compro el pa al forn del carrer major."
  - word: "la perruqueria"
    definition: "Local on et tallen els cabells."
    example: "Tinc hora a la perruqueria divendres."
  - word: "la papereria"
    definition: "Botiga de llibretes, bolígrafs i material d'escola."
    example: "Compra els quaderns a la papereria."
  - word: "el quiosc"
    definition: "Parada petita on es venen diaris i revistes."
    example: "El Pau compra el diari al quiosc."
  - word: "la parada d'autobús"
    definition: "Lloc marcat on l'autobús recull els passatgers."
    example: "La parada d'autobús és davant del parc."
  - word: "l'estació"
    definition: "Lloc on arriben i surten els trens o els autobusos."
    example: "L'estació queda a deu minuts de casa."
  - word: "el metro"
    definition: "Tren de la ciutat que passa per sota terra."
    example: "El metro arriba fins a l'aeroport."
  - word: "la piscina municipal"
    definition: "Piscina pública del barri o del poble."
    example: "A l'estiu els nens van a la piscina municipal."
  - word: "el poliesportiu"
    definition: "Edifici amb pistes i sales per fer esport."
    example: "El poliesportiu obre a les set del matí."
  - word: "l'escola bressol"
    definition: "Escola per a nens de menys de tres anys."
    example: "L'escola bressol és al costat del parc."
  - word: "el teatre"
    definition: "Local on es fan obres i espectacles."
    example: "Dissabte anem al teatre amb els avis."
  - word: "l'ajuntament"
    definition: "Edifici del govern de la ciutat o del poble."
    example: "Les oficines de l'ajuntament tanquen a les dues."
  - word: "l'oficina de correus"
    definition: "Lloc on s'envien i es recullen cartes i paquets."
    example: "He de passar per l'oficina de correus."
  - word: "el caixer"
    definition: "Màquina on es treuen diners del banc."
    example: "El caixer del carrer major no funciona."
  - word: "el pàrquing"
    definition: "Lloc on es deixen els cotxes."
    example: "El pàrquing del centre és caríssim."
  - word: "el veïnat"
    definition: "El conjunt de veïns d'un barri o d'una escala."
    example: "Tot el veïnat va anar a la festa."
  - word: "passejar"
    definition: "Caminar a poc a poc per un carrer o un parc."
    example: "Al vespre passegem pel barri."
  - word: "apuntar-se"
    definition: "Escriure el teu nom en una llista per fer una activitat."
    example: "La Núria s'ha apuntat al curs de ioga."
items:
  # ---------------- Lliçó 1 ----------------
  - id: b1-13-001
    type: choice
    point: hi-locatiu
    lesson: 1
    prompt: "—Vas a la piscina? —Sí, ___ vaig cada dimecres."
    answer: "hi"
    distractors:
      - text: "ho"
        why: "*Ho* substitueix una idea o un *això*, no un lloc com «la piscina»."
      - text: "la"
        why: "*La* és complement directe femení. «A la piscina» és un lloc, introduït per *a*."
    explanation: "«A la piscina» és el lloc on vas. Un lloc se substitueix per *hi*: *hi vaig*."

  - id: b1-13-002
    type: choice
    point: hi-locatiu
    lesson: 1
    prompt: "La Carla viu a Girona des de fa un any. ___ viu amb la seva germana."
    answer: "Hi"
    distractors:
      - text: "Ho"
        why: "*Ho* substitueix una idea o un *això*, no un lloc com «Girona»."
      - text: "La"
        why: "*La* és complement directe («la veig»). «A Girona» és un lloc."
    explanation: "«A Girona» és on viu la Carla: *hi viu amb la seva germana*."

  - id: b1-13-003
    type: choice
    point: hi-locatiu
    lesson: 1
    prompt: "Ahir a la tarda vaig anar al quiosc. ___ era la Laia, comprant el diari."
    answer: "Hi"
    distractors:
      - text: "Ho"
        why: "*Ho* no substitueix un lloc."
      - text: "L'"
        why: "*L'* és complement directe («l'ajudo»). «Al quiosc» és un lloc."
    explanation: "«Al quiosc» és on era la Laia: *hi era*. *Hi* també va amb el verb en passat."

  - id: b1-13-004
    type: choice
    point: hi-moviment
    lesson: 1
    prompt: "—Tornes al casal demà? —Sí, ___ torno a les cinc."
    answer: "hi"
    distractors:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
      - text: "el"
        why: "*El* és complement directe. «Al casal» és el lloc on tornes."
    explanation: "«Al casal» és el lloc on tornes: *hi torno a les cinc*."

  - id: b1-13-005
    type: choice
    point: hi-moviment
    lesson: 1
    prompt: "—A quina hora entreu al teatre? —___ entrem a les vuit."
    answer: "Hi"
    distractors:
      - text: "Ho"
        why: "*Ho* no substitueix un lloc."
      - text: "El"
        why: "*El* és complement directe. «Al teatre» és on entreu."
    explanation: "«Al teatre» és on entreu: *hi entrem a les vuit*."

  - id: b1-13-006
    type: choice
    point: hi-formes
    lesson: 1
    prompt: "Vols anar al poliesportiu demà. Quina frase és correcta?"
    answer: "Hi vull anar demà."
    distractors:
      - text: "Vull hi anar demà."
        why: "*Hi* no pot anar entre *vull* i l'infinitiu: va davant del verb, *hi vull anar*, o darrere, *vull anar-hi*."
      - text: "Ho vull anar demà."
        why: "*Ho* no substitueix un lloc."
    explanation: "Amb un verb modal, *hi* va davant del verb (*hi vull anar*) o darrere l'infinitiu (*vull anar-hi*)."

  - id: b1-13-007
    type: inline-choice
    point: hi-locatiu
    lesson: 1
    title: "Missatge a la Laia"
    text: "Laia, demà anem al centre cívic? Jo {hi|ho|la} vaig cada dijous a ioga: m'hi he apuntat aquest mes. La Núria també {hi|ho|li} va, i després dinem juntes. L'any passat no {hi|ho|les} anava mai, però ara m'agrada molt."
    explanation: "El centre cívic és on van: sempre *hi*. *Hi* també va en passat: *no hi anava mai*."

  - id: b1-13-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb la situació."
    pairs:
      - ["no hi ha res a fer", "El metge diu que el genoll ja no es curarà."]
      - ["ja hi som", "Baixes del tren i truques a la teva germana."]
      - ["hi ha d'haver", "Creus que segur que existeix una solució."]
      - ["tant hi fa", "Et donen a triar entre dos horaris i tots dos et van bé."]
    explanation: "Són quatre expressions molt habituals amb *hi*. *Ja hi som* es diu en arribar a un lloc."

  - id: b1-13-009
    type: fill
    point: hi-locatiu
    lesson: 1
    prompt: "—Vas sovint al poliesportiu? —Sí, ___ vaig tres cops per setmana."
    hint: "pronom per a «al poliesportiu»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* substitueix una idea, no un lloc."
    grading: tolerant
    explanation: "«Al poliesportiu» és on vas: *hi vaig tres cops per setmana*."

  - id: b1-13-010
    type: fill
    point: hi-locatiu
    lesson: 1
    prompt: "L'Ibrahim treballa a l'oficina de correus: ___ treballa des de fa deu anys."
    hint: "pronom per a «a l'oficina de correus»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
    grading: tolerant
    explanation: "«A l'oficina de correus» és on treballa: *hi treballa*."

  - id: b1-13-011
    type: fill
    point: hi-moviment
    lesson: 1
    prompt: "—A quina hora arribeu a l'estació? —___ arribem a les nou."
    hint: "pronom per a «a l'estació»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
    grading: tolerant
    explanation: "«A l'estació» és on arribeu: *hi arribem a les nou*."

  - id: b1-13-012
    type: order
    point: hi-locatiu
    lesson: 1
    cue: "Un veí et pregunta si vas a la biblioteca. Respon que hi vas cada dimecres."
    chunks: ["hi", "vaig", "cada", "dimecres"]
    extra: ["ho"]
    answers:
      - "Hi vaig cada dimecres."
      - "Cada dimecres hi vaig."
    explanation: "El pronom va davant del verb: *hi vaig*. «Cada dimecres» diu quan, no on."

  - id: b1-13-013
    type: order
    point: hi-moviment
    lesson: 1
    cue: "Explica que la teva filla torna al casal demà a la tarda."
    chunks: ["la meva filla", "hi", "torna", "demà a la tarda"]
    extra: ["ho"]
    answers:
      - "La meva filla hi torna demà a la tarda."
      - "Demà a la tarda la meva filla hi torna."
    explanation: "«Al casal» es converteix en *hi*, davant del verb: *hi torna*."

  # ---------------- Lliçó 2 ----------------
  - id: b1-13-014
    type: fill
    point: hi-locatiu
    lesson: 2
    prompt: "—Vius al barri vell? —Sí, ___ visc des de petita."
    hint: "pronom per a «al barri vell»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
    grading: tolerant
    explanation: "«Al barri vell» és on vius: *hi visc des de petita*."

  - id: b1-13-015
    type: fill
    point: hi-locatiu
    lesson: 2
    prompt: "—Vau anar a la festa del barri? —Sí, ___ vam anar dissabte."
    hint: "pronom per a «a la festa»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
    grading: tolerant
    explanation: "Vam anar a la festa: *hi vam anar dissabte*. *Hi* també va amb el verb en passat."

  - id: b1-13-016
    type: fill
    point: hi-moviment
    lesson: 2
    prompt: "—Passeu per Olot de camí a Puigcerdà? —Sí, ___ passem al migdia."
    hint: "pronom per a «per Olot»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
    grading: tolerant
    explanation: "*Hi passem*: passar per un lloc també porta *hi*."

  - id: b1-13-017
    type: fill
    point: hi-moviment
    lesson: 2
    prompt: "—On queden la Montse i el Jordi? A la plaça? —Sí, ___ queden cada divendres a les sis."
    hint: "pronom per a «a la plaça»"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
    grading: tolerant
    explanation: "*Hi queden*: el lloc on queden també se substitueix per *hi*."

  - id: b1-13-018
    type: fill
    point: hi-formes
    lesson: 2
    prompt: "Demà volem anar a la piscina municipal: volem anar-___ al matí."
    hint: "pronom de lloc, darrere l'infinitiu"
    answers: ["hi"]
    wrong_answers:
      - text: "ho"
        why: "*Anar-ho* no és correcte: *ho* no substitueix un lloc."
    grading: tolerant
    explanation: "Darrere de l'infinitiu, el pronom va amb guionet: *volem anar-hi*."

  - id: b1-13-019
    type: order
    point: hi-moviment
    lesson: 2
    cue: "Digues que demà entres a la biblioteca a les deu."
    chunks: ["demà", "hi", "entro", "a les deu"]
    extra: ["ho"]
    answers:
      - "Demà hi entro a les deu."
      - "Hi entro demà a les deu."
    explanation: "«A la biblioteca» és on entres: *hi entro*."

  - id: b1-13-020
    type: order
    point: hi-formes
    lesson: 2
    cue: "A l'estació de metro, digues a un amic que vols anar al parc amb ell demà."
    chunks: ["vull", "anar-hi", "amb tu", "demà"]
    extra: ["anar-ho"]
    answers:
      - "Vull anar-hi amb tu demà."
      - "Demà vull anar-hi amb tu."
      - "Vull anar-hi demà amb tu."
    explanation: "Darrere de l'infinitiu, *hi* va amb guionet: *anar-hi*."

  - id: b1-13-021
    type: choice
    point: hi-formes
    lesson: 2
    prompt: "A un amic que va al CAP, li dius: «___ d'hora, que sempre hi ha cua!»"
    answer: "Ves-hi"
    distractors:
      - text: "Ves-ho"
        why: "*Ho* no substitueix un lloc."
      - text: "Hi ves"
        why: "Amb l'imperatiu afirmatiu el pronom va darrere: *ves-hi*."
    explanation: "Amb l'imperatiu, el pronom va darrere amb guionet: *ves-hi*."

  - id: b1-13-022
    type: choice
    point: hi-formes
    lesson: 2
    prompt: "Truques al CAP i preguntes per la doctora. Quina pregunta és correcta?"
    answer: "Hi és, la doctora Soler?"
    distractors:
      - text: "És, la doctora Soler?"
        why: "Sense *hi* la frase queda incompleta: per preguntar si algú és present diem *hi és*."
      - text: "Ho és, la doctora Soler?"
        why: "*Ho és* parla d'una qualitat («és metgessa»), no de la presència."
    explanation: "Per preguntar si algú és present, fem servir *ser-hi*: *hi és*."

  - id: b1-13-023
    type: choice
    point: hi-moviment
    lesson: 2
    prompt: "—Vindràs a la festa del casal? —Sí, ___ vindré amb els nens."
    answer: "hi"
    distractors:
      - text: "ho"
        why: "*Ho* no substitueix un lloc."
      - text: "la"
        why: "*La* és complement directe. «A la festa» és un lloc."
    explanation: "«A la festa» és on vindràs: *hi vindré amb els nens*."

  - id: b1-13-024
    type: choice
    point: expressions
    lesson: 2
    prompt: "Arribes a l'estació i truques a la teva germana: «___!»"
    answer: "Ja hi som"
    distractors:
      - text: "Ja ho som"
        why: "L'expressió feta és amb *hi*: *ja hi som*."
      - text: "Ja som"
        why: "Sense *hi* queda incomplet: l'expressió feta és *ja hi som*."
    explanation: "*Ja hi som* és l'expressió que es diu en arribar a un lloc."

  - id: b1-13-025
    type: choice
    point: hi-formes
    lesson: 2
    prompt: "Quina frase és correcta?"
    answer: "Vull anar-hi demà."
    distractors:
      - text: "Vull hi anar demà."
        why: "*Hi* no pot anar entre el verb conjugat i l'infinitiu."
      - text: "Vull anar-ho demà."
        why: "*Ho* no substitueix un lloc."
    explanation: "Darrere de l'infinitiu el pronom va amb guionet: *anar-hi*. (També pots dir *hi vull anar*.)"

  - id: b1-13-026
    type: inline-choice
    point: hi-moviment
    lesson: 2
    title: "Cap de setmana a Tarragona"
    text: "La setmana que ve anem a Tarragona. Dissabte {hi|ho|la} anem en tren i {hi|ho|el} dinem amb els meus oncles, que {hi|ho|la} viuen des de fa vint anys. A la tarda passegem pel barri vell. M'agrada tant que l'any que ve {hi|ho|la} tornarem."
    explanation: "Tarragona és on van, on dinen, on viuen els oncles i on tornaran: sempre *hi*."

  # ---------------- Lliçó 3 ----------------
  - id: b1-13-027
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Vas a la platja? —Sí, vaig cada diumenge."
    error: "vaig cada diumenge"
    fix: "hi vaig cada diumenge"
    fix_distractors:
      - text: "ho vaig cada diumenge"
        why: "*Ho* no substitueix un lloc."
      - text: "la vaig cada diumenge"
        why: "*La* és complement directe; «a la platja» és un lloc."
    explanation: "Sense *hi* és un calc del castellà «voy cada domingo». Si no repetim el lloc, cal *hi vaig*."

  - id: b1-13-028
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Vius a Vic? —Sí, visc des de fa tres anys."
    error: "visc des de fa tres anys"
    fix: "hi visc des de fa tres anys"
    fix_distractors:
      - text: "ho visc des de fa tres anys"
        why: "*Ho* no substitueix un lloc."
      - text: "la visc des de fa tres anys"
        why: "*La* és complement directe; «a Vic» és un lloc."
    explanation: "Sense *hi* és un calc del castellà «vivo desde hace». En català: *hi visc des de fa tres anys*."

  - id: b1-13-029
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—Vas sovint al teatre? —Sí, hi vaig cada mes."
    no_error: true
    explanation: "La frase és correcta: el lloc no es repeteix i el pronom *hi* hi és: *hi vaig cada mes*."

  - id: b1-13-030
    type: find-error
    point: compte-castella
    lesson: 3
    sentence: "—A quina hora vas a la perruqueria? —Vaig a les vuit."
    error: "Vaig a les vuit"
    fix: "Hi vaig a les vuit"
    fix_distractors:
      - text: "Ho vaig a les vuit"
        why: "*Ho* no substitueix un lloc."
      - text: "La vaig a les vuit"
        why: "*La* és complement directe; «a la perruqueria» és un lloc."
    explanation: "Sense *hi* és un calc del castellà «voy». En català: *hi vaig a les vuit*."

  - id: b1-13-031
    type: find-error
    point: hi-formes
    lesson: 3
    sentence: "El Pau va a la piscina cada dia. Demà vull hi anar amb ell."
    error: "vull hi anar"
    fix: "hi vull anar"
    fix_distractors:
      - text: "vull anar-ho"
        why: "*Ho* no substitueix un lloc."
      - text: "ho vull anar"
        why: "*Ho* és per a una idea, no per a «la piscina»."
    explanation: "*Hi* no pot anar entre el verb i l'infinitiu. Davant del verb conjugat: *hi vull anar*."

  - id: b1-13-032
    type: find-error
    point: hi-moviment
    lesson: 3
    sentence: "Marxem d'Andorra demà, però hi tornem al setembre."
    no_error: true
    explanation: "La frase és correcta: *hi tornem* vol dir que tornaran a Andorra al setembre."

  - id: b1-13-033
    type: fill
    point: hi-formes
    lesson: 3
    prompt: "—___ és el conserge? L'espero al banc de la vorera."
    hint: "verb *ser-hi*, present"
    answers: ["Hi"]
    wrong_answers:
      - text: "Ho"
        why: "*Ho és* parla d'una qualitat, no de la presència."
    grading: tolerant
    explanation: "Per preguntar si algú és present: *hi és*."

  - id: b1-13-034
