  # ---------- Lliçó 5 ----------
  - id: b2-43-053
    type: reading
    point: comprensio
    lesson: 5
    title: "El misteri de la bicicleta blava"
    text: |
      La setmana passada va desaparèixer la bicicleta blava de la Fàtima del garatge de casa seva, al barri de Gràcia. La Fàtima l'havia deixada lligada amb un cadenat a les sis de la tarda, i l'endemà al matí ja no hi era. El cadenat era a terra, forçat. Era el tercer robatori del barri aquell mes, i la desaparició es va produir de nit. La Fàtima va trucar als Mossos i va posar una denúncia a la comissaria del carrer de la Marina.

      La inspectora Sala va interrogar els veïns. El porter no havia sentit res: devia dormir quan el lladre va entrar. Una testimoni, la senyora Rius, del tercer, va declarar que a mitjanit havia sentit un soroll metàl·lic, però no hi havia donat importància. Havia d'haver avisat la policia en aquell moment, va reconèixer. Les pistes s'anaven acumulant: una petjada de fang al costat del cadenat, una empremta al vidre de la porta i un noi amb una motxilla vermella que un altre testimoni havia vist sortir del garatge.

      El cas, però, estava per resoldre: encara faltava una prova per identificar el sospitós. La inspectora va lligar caps i va deduir que el lladre coneixia l'edifici. La sospita va caure sobre el Quim, un antic veí que havia discutit amb la Fàtima per una plaça de pàrquing i que no tenia cap coartada. La seva hipòtesi era que havia actuat sol. El mòbil era clar. Aquestes hores deu haver venut la bicicleta, va pensar la inspectora, però encara no tenia cap indici clar.

      L'endemà, els Mossos van trobar la bicicleta en un amagatall del parc del Guinardó i van detenir el Quim quan hi va tornar. El van enxampar amb les mans a la massa, desmuntant la bicicleta. Al judici, l'advocat del Quim va dir que el seu client havia actuat per venjança. El jutge va dictar la sentència: el Quim haurà de tornar la bicicleta i pagar una multa. És un misteri com no el va sentir ningú, va dir la Fàtima. La inspectora va somriure: aquells dies tothom devia dormir amb les finestres tancades.
    questions:
      - prompt: "Què va trobar la Fàtima l'endemà al matí?"
        answer: "El cadenat forçat a terra i cap bicicleta."
        distractors:
          - text: "La bicicleta amb el cadenat trencat."
            why: "La bicicleta ja no hi era."
          - text: "La porta del garatge oberta."
            why: "La Fàtima només va trobar el cadenat."
      - prompt: "Per què sospitava la inspectora del Quim?"
        answer: "Havia discutit amb la Fàtima i no tenia coartada."
        distractors:
          - text: "L'havien trobat dormint dins del garatge."
            why: "Qui dormia era el porter."
          - text: "Havia posat una denúncia falsa a la comissaria."
            why: "La denúncia la va posar la Fàtima."
      - prompt: "Com van detenir el Quim?"
        answer: "El van trobar a l'amagatall mentre desmuntava la bicicleta."
        distractors:
          - text: "El van interrogar a la comissaria durant hores."
            why: "Van interrogar els veïns, no el Quim."
          - text: "Va confessar tot sol a la comissaria."
            why: "No va confessar: el van enxampar al parc."
      - prompt: "Quina va ser la sentència del judici?"
        answer: "El Quim ha de tornar la bicicleta i pagar una multa."
        distractors:
          - text: "La Fàtima ha de pagar una multa per la denúncia."
            why: "La multa la paga el Quim; la denúncia la va posar la Fàtima."
          - text: "El Quim ha de tornar al parc del Guinardó."
            why: "Ha de tornar la bicicleta, no anar al parc."
    explanation: "El text explica el robatori d'una bicicleta, la investigació de la inspectora Sala i la detenció del lladre."

