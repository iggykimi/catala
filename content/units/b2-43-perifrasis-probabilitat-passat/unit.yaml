id: b2-43
level: B2
title: "Perífrasis i probabilitat en passat"
summary: "Suposicions sobre el passat amb «deu haver» i «devia», retrets amb «havia d'haver», l'acció progressiva amb «anar» + gerundi i «estar per», en el context d'una investigació."
vocabulary_theme: "Misteris, investigació i successos"
points:
  - id: deure-probabilitat-passat
    title: "Deure: suposicions sobre el passat"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: haver-dhaver-passat
    title: "Havia d'haver + participi: allò que no es va fer"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: anar-gerundi
    title: "Anar + gerundi: l'acció que avança"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: estar-per
    title: "Estar per + infinitiu: pendent o imminent"
    refs:
      - label: "GEIEC: Les perífrasis verbals"
        url: "https://geiec.iec.cat"
  - id: compte-deure-de
    title: "Compte amb el castellà: deu haver"
    refs:
      - label: "Optimot: consultes lingüístiques"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions de misteri"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Suposicions sobre el passat"
  - title: "Retrets i accions que avancen"
  - title: "Estar per i compte amb el castellà"
  - title: "Produir: reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la pista"
    definition: "Senyal o dada que ajuda a resoldre un misteri."
    example: "La policia busca pistes al garatge."
  - word: "l'indici"
    definition: "Senyal petit que fa pensar en una explicació."
    example: "No hi ha cap indici que la porta sigui forçada."
  - word: "el testimoni, la testimoni"
    definition: "Persona que ha vist o sentit un fet i ho pot explicar."
    example: "Un testimoni va veure el lladre sortir del garatge."
  - word: "la coartada"
    definition: "Prova que una persona era en un altre lloc quan va passar un fet."
    example: "El sospitós no té cap coartada per a aquella nit."
  - word: "el sospitós, la sospitosa"
    definition: "Persona de qui es pensa que ha fet una cosa mal feta."
    example: "Els Mossos van detenir dos sospitosos."
  - word: "la sospita"
    definition: "Idea que algú ha fet una cosa mal feta, sense proves."
    example: "La sospita va caure sobre un antic veí."
  - word: "sospitar"
    definition: "Pensar que algú ha fet una cosa mal feta, sense proves."
    example: "La inspectora sospita del porter."
  - word: "l'investigador, la investigadora"
    definition: "Persona que busca dades per resoldre un cas."
    example: "L'investigador va interrogar tots els veïns."
  - word: "la denúncia"
    definition: "Escrit que explica un delicte a la policia o al jutge."
    example: "Va posar una denúncia a la comissaria."
  - word: "el judici"
    definition: "Acte en què un jutge escolta les parts i decideix."
    example: "El judici serà el mes vinent."
  - word: "el jutge, la jutgessa"
    definition: "Persona que decideix en un judici."
    example: "La jutgessa va escoltar els testimonis."
  - word: "l'advocat, l'advocada"
    definition: "Persona que defensa algú davant del jutge."
    example: "L'advocat va demanar més temps."
  - word: "la prova"
    definition: "Fet o objecte que demostra una cosa."
    example: "Encara falta una prova per tancar el cas."
  - word: "l'empremta"
    definition: "Marca que deixa un dit o un peu en una superfície."
    example: "Hi havia una empremta al vidre de la porta."
  - word: "la petjada"
    definition: "Marca que deixa el peu a terra."
    example: "La policia va trobar petjades de fang al jardí."
  - word: "el robatori"
    definition: "Fet de prendre una cosa d'algú sense permís."
    example: "El robatori va ser de matinada."
  - word: "robar"
    definition: "Prendre una cosa d'algú sense permís."
    example: "Algú ha robat la bicicleta del garatge."
  - word: "el lladre, la lladra"
    definition: "Persona que roba."
    example: "El lladre va entrar per la finestra."
  - word: "la desaparició"
    definition: "Fet que una persona o una cosa no es trobi enlloc."
    example: "La desaparició es va produir de nit."
  - word: "desaparèixer"
    definition: "Deixar de ser en un lloc, sense saber on."
    example: "La bicicleta va desaparèixer del garatge."
  - word: "amagar"
    definition: "Posar una cosa en un lloc on no es vegi."
    example: "Va amagar les claus sota el test."
  - word: "l'amagatall"
    definition: "Lloc secret on s'amaga una cosa o una persona."
    example: "Van trobar la bicicleta en un amagatall del parc."
  - word: "forçar"
    definition: "Obrir una porta o un cadenat amb força."
    example: "El cadenat era a terra, forçat."
  - word: "esbrinar"
    definition: "Arribar a saber una cosa després d'investigar."
    example: "La policia encara ha d'esbrinar qui va entrar."
  - word: "resoldre"
    definition: "Trobar la solució d'un cas o d'un problema."
    example: "El cas està per resoldre."
  - word: "el misteri"
    definition: "Fet que no té explicació."
    example: "És un misteri on va la bicicleta."
  - word: "misteriós, misteriosa"
    definition: "Que no s'entén o que fa sospitar."
    example: "A mitjanit van sentir un soroll misteriós."
  - word: "declarar"
    definition: "Explicar formalment què s'ha vist, davant la policia o el jutge."
    example: "La testimoni va declarar al judici."
  - word: "interrogar"
    definition: "Fer preguntes a algú per obtenir informació."
    example: "La inspectora va interrogar els veïns."
  - word: "la hipòtesi"
    definition: "Explicació possible d'un fet, que cal comprovar."
    example: "La hipòtesi és que el lladre coneixia l'edifici."
  - word: "deduir"
    definition: "Arribar a una conclusió a partir de les pistes."
    example: "Dels sorolls va deduir que hi havia algú."
  - word: "el mòbil"
    definition: "Motiu que fa actuar algú."
    example: "El mòbil del robatori era la venjança."
  - word: "el cas"
    definition: "Assumpte que investiga la policia o el jutge."
    example: "El cas encara no està tancat."
  - word: "la comissaria"
    definition: "Oficina de la policia on es posen denúncies."
    example: "Va anar a la comissaria a declarar."
  - word: "els Mossos d'Esquadra"
    definition: "La policia de Catalunya."
    example: "Els Mossos van detenir el sospitós."
  - word: "la víctima"
    definition: "Persona que pateix un delicte."
    example: "La víctima no va sentir res."
  - word: "la sentència"
    definition: "Decisió final del jutge en un judici."
    example: "El jutge va dictar la sentència."
  - word: "el cadenat"
    definition: "Peça de metall que tanca amb clau."
    example: "El cadenat del garatge era forçat."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-43-001
    type: choice
    point: deure-probabilitat-passat
    lesson: 1
    prompt: "Són les deu del matí i el judici comença a les deu: l'advocat ___."
    answer: "deu haver sortit de casa"
    distractors:
      - text: "devia sortir de casa"
        why: "*Devia* situa la suposició en el passat. Amb «són les deu», el punt de vista és ara."
      - text: "debe haver sortit de casa"
        why: "*Debe* és la forma castellana. En català, la 3a persona és *deu*."
    explanation: "«Són les deu» situa la suposició ara, sobre un fet acabat: *deu haver* + participi."

  - id: b2-43-002
    type: choice
    point: deure-probabilitat-passat
    lesson: 1
    prompt: "L'Arnau dormia quan van forçar la porta: ___."
    answer: "devia ser molt tard"
    distractors:
      - text: "deu haver estat molt tard"
        why: "*Deu haver estat* situa la suposició ara. Amb «dormia» i «van forçar», el punt de vista és el passat: *devia ser*."
      - text: "debe ser molt tard"
        why: "*Debe* és la forma castellana. En català, en passat: *devia ser*."
    explanation: "«Dormia» i «van forçar» situen la suposició en el passat: *devia* + infinitiu."

  - id: b2-43-003
    type: choice
    point: deure-probabilitat-passat
    lesson: 1
    prompt: "Què vol dir «Aquestes hores deu haver declarat»?"
    answer: "Segurament ja ha declarat."
    distractors:
      - text: "Havia de declarar, però no ho ha fet."
        why: "Això és una obligació no complerta: *havia d'haver declarat*."
      - text: "Declararà d'aquí a una estona."
        why: "Això és futur; *deu haver declarat* parla d'un fet passat."
    explanation: "*Deu haver* + participi és una suposició sobre un fet ja acabat."

  - id: b2-43-004
    type: choice
    point: deure-probabilitat-passat
    lesson: 1
    prompt: "Els testimonis no van veure res: ___ quan va passar."
    answer: "devien dormir"
    distractors:
      - text: "devien dormit"
        why: "Darrere de *devien* va l'infinitiu *dormir*, no el participi."
      - text: "deben dormir"
        why: "*Deben* és la forma castellana. En català, en passat: *devien*."
    explanation: "«No van veure res» situa la suposició en el passat: *devien* + infinitiu."

  - id: b2-43-005
    type: match
    point: deure-probabilitat-passat
    lesson: 1
    instruction: "Relaciona cada infinitiu amb el seu participi."
    pairs:
      - ["dir", "dit"]
      - ["fer", "fet"]
      - ["veure", "vist"]
      - ["escriure", "escrit"]
      - ["prendre", "pres"]
    explanation: "Per formar *deu haver* + participi calen els participis irregulars: *dit, fet, vist, escrit, pres*."

  - id: b2-43-006
    type: inline-choice
    point: deure-probabilitat-passat
    lesson: 1
    title: "Nit de tempesta"
    text: "Ahir va caure una tempesta forta sobre Girona. Aquest matí el jardí és ple de fulles: el cel {deu haver descarregat|devia descarregar|debe haver descarregat} amb força. La finestra del garatge és oberta: algú {deu haver entrat|devia entrar|debe haver entrat}. Aquella nit els veïns no van sentir res: {devien dormir|deuen dormir|deben dormir}. El diari encara no ha arribat: el repartidor {deu haver fet tard|devia fer tard|debe haver fet tard}."
    explanation: "*Deu haver* + participi és una suposició d'ara sobre un fet acabat; *devia* + infinitiu, una suposició del passat."

  - id: b2-43-007
    type: fill
    point: deure-probabilitat-passat
    lesson: 1
    prompt: "El terra és moll: aquesta nit ___."
    hint: "ploure, *deu haver* + participi"
    answers: ["deu haver plogut"]
    wrong_answers:
      - text: "debe haver plogut"
        why: "*Debe* és la forma castellana. En català: *deu*."
    grading: tolerant
    explanation: "«El terra és moll» és una suposició d'ara sobre un fet acabat: *deu haver plogut*."

  - id: b2-43-008
    type: fill
    point: deure-probabilitat-passat
    lesson: 1
    prompt: "L'Ibrahim coneixia tots els detalls del cas: ___ a la comissaria."
    hint: "treballar, *devia* + infinitiu"
    answers: ["devia treballar"]
    wrong_answers:
      - text: "devia treballat"
        why: "Darrere de *devia* va l'infinitiu *treballar*, no el participi."
    grading: tolerant
    explanation: "«Coneixia» situa la suposició en el passat: *devia* + infinitiu."

  - id: b2-43-009
    type: order
    point: deure-probabilitat-passat
    lesson: 1
    cue: "Digues que el lladre segurament va entrar per la finestra."
    chunks: ["Aquestes hores", "el lladre", "deu haver entrat", "per la finestra"]
    extra: ["debe"]
    answers:
      - "Aquestes hores el lladre deu haver entrat per la finestra."
      - "El lladre deu haver entrat per la finestra aquestes hores."
    explanation: "«Aquestes hores» situa la suposició ara: *deu haver* + participi. *Debe* és la forma castellana."

  - id: b2-43-010
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «lligar caps»?"
    answer: "Relacionar pistes per arribar a una conclusió."
    distractors:
      - text: "Donar el cas per tancat sense proves."
        why: "Això és no investigar; *lligar caps* és relacionar les pistes."
      - text: "Explicar un secret a tothom."
        why: "*Lligar caps* no és explicar res: és entendre el cas."
    explanation: "*Lligar caps* és ajuntar les pistes per entendre què ha passat."

  - id: b2-43-011
    type: choice
    point: expressions
    lesson: 1
    prompt: "L'investigador no perd el temps amb detalls: ___."
    answer: "va per feina"
    distractors:
      - text: "és un misteri"
        why: "Això vol dir que no té explicació; aquí parlem d'eficiència."
      - text: "lliga caps"
        why: "Això és relacionar pistes; aquí vol dir que va a l'important."
    explanation: "*Anar per feina* és anar directament a l'important, sense perdre temps."

  - id: b2-43-012
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["lligar caps", "relacionar les pistes per entendre el cas"]
      - ["ser un misteri", "no tenir cap explicació"]
      - ["anar per feina", "anar directament a l'important"]
      - ["agafar amb les mans a la massa", "enxampar algú mentre ho fa"]
    explanation: "Són expressions habituals per parlar de misteris i investigacions."

  - id: b2-43-013
    type: fill
    point: expressions
    lesson: 1
    prompt: "Ningú no sap on va la bicicleta del garatge: ___."
    hint: "expressió: no tenir cap explicació"
    answers: ["és un misteri"]
    wrong_answers:
      - text: "és un misteriós"
        why: "*Misteriós* és un adjectiu; l'expressió és *ser un misteri*."
    grading: tolerant
    explanation: "«Ningú no sap» indica que no té explicació: *és un misteri*."

  # ---------- Lliçó 2 ----------
  - id: b2-43-014
    type: choice
    point: haver-dhaver-passat
    lesson: 2
    prompt: "Què vol dir «Havies d'haver tancat la porta»?"
    answer: "No la vas tancar, i ho havies de fer."
    distractors:
      - text: "Vas tancar la porta a temps."
        why: "Si l'hagués tancada, no faríem servir *havia d'haver*."
      - text: "Potser vas tancar la porta."
        why: "Això és una suposició; aquí hi ha un retret."
    explanation: "*Havia d'haver* + participi és un retret: allò no es va fer."

  - id: b2-43-015
    type: choice
    point: haver-dhaver-passat
    lesson: 2
    prompt: "El testimoni ___ abans del judici, però no ho va fer."
    answer: "havia d'haver declarat"
    distractors:
      - text: "havia d'haver declarar"
        why: "Darrere de *haver* va el participi *declarat*, no l'infinitiu."
      - text: "havia haver declarat"
        why: "Falta la preposició *de*: *havia d'haver declarat*."
    explanation: "«Però no ho va fer» indica una obligació no complerta: *havia d'haver* + participi."

  - id: b2-43-016
    type: fill
    point: haver-dhaver-passat
    lesson: 2
    prompt: "Ahir ___ la denúncia, però la comissaria era tancada."
    hint: "posar, *haver d'haver* + participi"
    answers: ["havia d'haver posat", "hauria d'haver posat"]
    wrong_answers:
      - text: "havia haver posat"
        why: "Falta la preposició *de*: *havia d'haver posat*."
    grading: tolerant
    explanation: "«Però era tancada» indica que no ho va fer: *havia d'haver* (o *hauria d'haver*) + participi."

  - id: b2-43-017
    type: fill
    point: haver-dhaver-passat
    lesson: 2
    prompt: "—No em vas avisar, Wei. —Tens raó, Carla: ___."
    hint: "avisar, *haver d'haver* + participi, primera persona"
    answers: ["havia d'haver avisat", "hauria d'haver avisat"]
    grading: tolerant
    explanation: "És un retret per una cosa no feta: *havia d'haver* (o *hauria d'haver*) + participi."

  - id: b2-43-018
    type: order
    point: haver-dhaver-passat
    lesson: 2
    cue: "Retreu a la Núria que ahir no va amagar les claus."
    chunks: ["Ahir", "havies", "d'haver amagat", "les claus"]
    extra: ["d'haver amagar"]
    answers:
      - "Ahir havies d'haver amagat les claus."
      - "Havies d'haver amagat les claus ahir."
    explanation: "El retret per una cosa no feta es fa amb *haver d'haver* + participi: *amagat*, no *amagar*."

  - id: b2-43-019
    type: choice
    point: haver-dhaver-passat
    lesson: 2
    prompt: "Quina frase és un retret per una cosa que no es va fer?"
    answer: "Hauríeu d'haver interrogat el sospitós."
    distractors:
      - text: "Heu d'interrogar el sospitós demà."
        why: "Això és una ordre per al futur, no un retret."
      - text: "Devíeu interrogar el sospitós cada dia."
        why: "Això és una suposició (*devia* + infinitiu), no un retret."
    explanation: "Només *hauríeu d'haver interrogat* diu que no ho van fer."

  - id: b2-43-020
    type: choice
    point: anar-gerundi
    lesson: 2
    prompt: "Cada dia que passava, les pistes ___."
    answer: "s'anaven acumulant"
    distractors:
      - text: "s'anaven acumular"
        why: "Darrere de *anar* va el gerundi *acumulant*, no l'infinitiu."
      - text: "s'aniran acumulant"
        why: "*Aniran* és futur; «cada dia que passava» és passat."
    explanation: "«Cada dia que passava» indica un canvi progressiu en el passat: *anar* + gerundi en imperfet."

  - id: b2-43-021
    type: choice
    point: anar-gerundi
    lesson: 2
    prompt: "Què vol dir «El cas es va anar complicant»?"
    answer: "El cas es va complicar a poc a poc."
    distractors:
      - text: "El cas es va complicar de cop."
        why: "Això seria *es va complicar*; *anar* + gerundi indica un canvi lent."
      - text: "El cas es complicarà aviat."
        why: "Això és futur; la frase és en passat."
    explanation: "*Anar* + gerundi expressa un canvi lent i progressiu."

  - id: b2-43-022
    type: fill
    point: anar-gerundi
    lesson: 2
    prompt: "El cel ___ mentre queia la nit."
    hint: "enfosquir-se, imperfet d'*anar* + gerundi"
    answers: ["s'anava enfosquint"]
    wrong_answers:
      - text: "s'anava enfosquir"
        why: "Darrere de *anar* va el gerundi *enfosquint*, no l'infinitiu."
    grading: tolerant
    explanation: "«Mentre queia» indica un canvi en marxa: *anar* + gerundi en imperfet."

  - id: b2-43-023
    type: fill
    point: anar-gerundi
    lesson: 2
    prompt: "Amb els anys, el testimoni ___ dels detalls."
    hint: "oblidar-se, passat perifràstic d'*anar* + gerundi"
    answers: ["es va anar oblidant"]
    wrong_answers:
      - text: "es va anar oblidar"
        why: "Darrere de *anar* va el gerundi *oblidant*, no l'infinitiu."
    grading: tolerant
    explanation: "«Amb els anys» indica un canvi lent: *anar* + gerundi."

  - id: b2-43-024
    type: order
    point: anar-gerundi
    lesson: 2
    cue: "Digues que la cua es feia més llarga a poc a poc."
    chunks: ["La cua", "es va anar", "fent", "més llarga"]
    extra: ["fer"]
    answers:
      - "La cua es va anar fent més llarga."
      - "Es va anar fent més llarga la cua."
    explanation: "Per al canvi progressiu, *anar* porta gerundi (*fent*), no infinitiu (*fer*)."

  - id: b2-43-025
    type: inline-choice
    point: anar-gerundi
    lesson: 2
    title: "La boira"
    text: "Aquell matí la boira {s'anava aixecant|s'anava aixecar|s'anirà aixecant} lentament. Els cotxes {anaven avançant|anaven avançar|aniran avançant} a poc a poc per la carretera. Al migdia, a poc a poc, el sol {es va anar imposant|es va anar imposar|es va anar imposat} entre els núvols."
    explanation: "En aquesta perífrasi, darrere de *anar* va el gerundi, no l'infinitiu ni el participi."

  - id: b2-43-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "El van enxampar amb la bicicleta que volia robar: el van agafar ___."
    answer: "amb les mans a la massa"
    distractors:
      - text: "amb les mans buides"
        why: "Això vol dir sense res; aquí el van enxampar robant."
      - text: "amb un pam de nas"
        why: "Això vol dir quedar-se sense el que esperava; no es combina amb *agafar*."
    explanation: "*Agafar amb les mans a la massa* és enxampar algú mentre fa una cosa mal feta."

  # ---------- Lliçó 3 ----------
  - id: b2-43-027
    type: choice
    point: estar-per
    lesson: 3
    prompt: "La denúncia encara no l'han començada: ___."
    answer: "està per escriure"
    distractors:
      - text: "està escrita"
        why: "Això voldria dir que ja l'han escrita; però «encara no»."
      - text: "s'està escrivint"
        why: "Això voldria dir que l'estan escrivint; però «encara no l'han començada»."
    explanation: "«Encara no l'han començada» indica una cosa pendent: *estar per* + infinitiu."

  - id: b2-43-028
    type: choice
    point: estar-per
    lesson: 3
    prompt: "Mira el cel: encara no cau ni una gota, però ___."
    answer: "està per ploure"
    distractors:
      - text: "està plovent"
