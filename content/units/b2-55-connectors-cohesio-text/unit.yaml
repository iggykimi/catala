    title: "Opinió: calen més biblioteques"
    text: "{Pel que fa a|En resum|Tanmateix} les biblioteques, la ciutat en té poques. {A més|Tanmateix|És a dir}, les que hi ha tanquen aviat. {Tanmateix|Per tant|És a dir}, l'ajuntament diu que no hi ha pressupost. {Ara bé|En quant a|En resum}, hi ha diners per a altres coses. {En definitiva|Tanmateix|Quant a}, cal prioritzar la lectura."
    explanation: "El text presenta el tema (*pel que fa a*), afegeix una queixa (*a més*), contrasta amb l'ajuntament (*tanmateix*), hi posa una objecció (*ara bé*) i conclou (*en definitiva*)."
