  # ---------- Lliçó 5 ----------
  - id: b2-55-052
    type: reading
    point: comprensio
    lesson: 5
    title: "Els diaris locals no es poden perdre"
    text: |
      Cada any tanquen diaris locals a Catalunya. Pel que fa a les comarques petites, la situació és greu: en deu anys han desaparegut la meitat de les capçaleres. Quan un diari tanca, ningú no cobreix els judicis, les obres ni les escoles del territori. Les dades són clares; és a dir, cada cop hi ha menys periodistes que expliquin què passa als pobles.

      D'una banda, internet permet llegir notícies de tot el món de franc. D'altra banda, ningú no explica el ple de l'ajuntament ni la festa major si no hi ha un diari local. El periodista local coneix els veïns, assisteix als plens i truca a les fonts. Aquesta feina lenta no la fa cap algoritme. A més, sense periodistes a prop, les xarxes difonen rumors sense contrastar.

      Alguns diuen que el paper és car i que cal tancar. Tanmateix, el problema no és el paper, sinó el model de negoci. El nord d'Europa, per contra, manté la premsa local amb ajuts públics i subscripcions. A Catalunya, algunes diputacions ja donen suport als mitjans comarcals. No obstant això, les ajudes arriben tard i són insuficients. Ara bé, els ajuts no poden dependre del govern de torn: cal un sistema estable.

      Quant al futur, hi ha motius per a l'esperança. Arran de la pandèmia, molts lectors han descobert els diaris digitals de proximitat. En poques paraules: llegir premsa local és votar cada dia pel poble on vivim. Dit d'una altra manera, la subscripció és el preu de la memòria col·lectiva. En definitiva, o la societat paga per la informació local o la perdrà. I, tornant al tema del principi, un poble sense diari és un poble sense memòria.
    questions:
      - prompt: "Què ha passat amb els diaris locals en deu anys?"
        answer: "N'han desaparegut la meitat a les comarques petites."
        distractors:
          - text: "Han apujat el preu de la subscripció."
            why: "El text no parla de preus, sinó de tancaments."
          - text: "S'han convertit tots en digitals."
            why: "El text parla de tancaments; els digitals de proximitat són una esperança, no un fet."
      - prompt: "Segons l'article, quin és el perill si no hi ha diari local?"
        answer: "Que els rumors de les xarxes substitueixin la informació."
        distractors:
          - text: "Que els veïns deixin de llegir notícies."
            why: "El text diu que circularan rumors, no que la gent deixarà de llegir."
          - text: "Que tanquin les xarxes socials."
            why: "El text no proposa tancar res."
      - prompt: "Què proposa l'article sobre els ajuts públics?"
        answer: "Que siguin estables i no depenguin del govern."
        distractors:
          - text: "Que només ajudin els diaris en paper."
            why: "El text diu que el problema no és el paper, sinó el model de negoci."
          - text: "Que els gestionin només les diputacions."
            why: "Les diputacions hi surten com a exemple, però les seves ajudes arriben tard."
      - prompt: "Quina és la conclusió de l'article?"
        answer: "Cal pagar per la informació local o es perdrà."
        distractors:
          - text: "Cal tancar els diaris en paper."
            why: "És el que diuen «alguns»; l'article defensa el contrari."
          - text: "Cal prohibir les notícies gratuïtes a internet."
            why: "El text no proposa prohibir res."
    explanation: "L'article defensa la premsa local: sense periodistes a prop, els pobles perden la informació i la memòria."

