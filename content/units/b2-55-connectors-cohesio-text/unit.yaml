# Unitat b2-55: connectors per estructurar un text (premsa i opinió).
id: b2-55
level: B2
title: "Connectors i cohesió del text"
summary: "Els connectors per estructurar un text: presentar el tema, afegir idees, contrastar, aclarir i concloure, amb la premsa i els articles d'opinió."
vocabulary_theme: "Premsa i articles d'opinió"
points:
  - id: estructurar-text
    title: "Presentar el tema i afegir idees"
    refs:
      - label: "GEIEC: Els connectors"
        url: "https://geiec.iec.cat"
  - id: contrastar
    title: "Matisar i contrastar"
    refs:
      - label: "GEIEC: Els connectors"
        url: "https://geiec.iec.cat"
  - id: aclarir-concloure
    title: "Aclarir, concloure i ordenar el text"
    refs:
      - label: "GEIEC: Els connectors"
        url: "https://geiec.iec.cat"
  - id: compte-en-quant-a
    title: "Compte amb el castellà: *en quant a*"
    refs:
      - label: "Optimot: quant a"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions per organitzar el discurs"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: tema i contrast"
  - title: "Practicar el tema i el contrast"
  - title: "Aclarir, concloure i *quant a*"
  - title: "Produir: reescriure amb connectors"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el diari"
    definition: "Publicació amb notícies que surt cada dia."
    example: "Compro el diari cada matí al quiosc."
  - word: "el setmanari"
    definition: "Publicació que surt un cop per setmana."
    example: "El setmanari porta un reportatge sobre el barri."
  - word: "la revista"
    definition: "Publicació periòdica amb articles i fotografies."
    example: "M'he subscrit a una revista de cinema."
  - word: "el titular"
    definition: "Frase gran que anuncia una notícia."
    example: "El titular de portada parla de la sequera."
  - word: "la portada"
    definition: "Primera pàgina d'un diari o d'una revista."
    example: "La foto de la portada és impressionant."
  - word: "l'editorial"
    definition: "Article on el diari dona la seva opinió."
    example: "L'editorial d'avui defensa l'escola pública."
  - word: "l'article d'opinió"
    definition: "Text on una persona exposa què pensa d'un tema."
    example: "He llegit un article d'opinió sobre els lloguers."
  - word: "la columna"
    definition: "Article d'opinió fix d'un col·laborador."
    example: "La seva columna surt cada dimarts."
  - word: "el reportatge"
    definition: "Treball periodístic extens sobre un tema."
    example: "El reportatge inclou entrevistes i fotografies."
  - word: "la crònica"
    definition: "Relat ordenat d'un fet cultural o esportiu."
    example: "La crònica del concert ocupa dues pàgines."
  - word: "la notícia"
    definition: "Informació d'un fet recent."
    example: "La notícia va sortir ahir al vespre."
  - word: "el suplement"
    definition: "Quadern extra del diari, sovint cultural."
    example: "El suplement de diumenge porta llibres."
  - word: "la redacció"
    definition: "Equip que escriu un diari; també, el local on treballa."
    example: "La redacció tanca l'edició a les deu."
  - word: "el redactor, la redactora"
    definition: "Periodista que escriu notícies."
    example: "La redactora ha contrastat les dades."
  - word: "el director, la directora"
    definition: "Persona que dirigeix un diari."
    example: "El director ha escrit l'editorial d'avui."
  - word: "el corresponsal, la corresponsal"
    definition: "Periodista que informa des d'una altra ciutat."
    example: "La corresponsal a Brussel·les cobreix Europa."
  - word: "la font"
    definition: "Persona o document que dona una informació."
    example: "L'article no cita les fonts."
  - word: "contrastar"
    definition: "Comprovar una informació amb una altra font."
    example: "Cal contrastar les dades abans de publicar."
  - word: "publicar"
    definition: "Fer públic un text o una notícia."
    example: "El diari publica l'entrevista demà."
  - word: "el lector, la lectora"
    definition: "Persona que llegeix una publicació."
    example: "Els lectors poden escriure cartes al director."
  - word: "la carta al director"
    definition: "Text breu que un lector envia al diari."
    example: "He enviat una carta al director sobre el soroll."
  - word: "el debat"
    definition: "Discussió ordenada sobre un tema."
    example: "El debat sobre l'habitatge continua obert."
  - word: "el quiosc"
    definition: "Botiga petita on es venen diaris i revistes."
    example: "Compro la revista al quiosc de la plaça."
  - word: "la subscripció"
    definition: "Pagament periòdic per rebre una publicació."
    example: "La subscripció digital és més barata."
  - word: "subscriure's"
    definition: "Apuntar-se per rebre una publicació regularment."
    example: "M'he subscrit al diari local."
  - word: "la capçalera"
    definition: "Títol d'una publicació periòdica."
    example: "És una capçalera històrica del país."
  - word: "el número"
    definition: "Cada exemplar datat d'una publicació."
    example: "Aquest número porta un suplement especial."
  - word: "la tertúlia"
    definition: "Conversa entre diverses persones sobre l'actualitat."
    example: "Cada nit fan una tertúlia a la ràdio."
  - word: "el columnista, la columnista"
    definition: "Persona que escriu una columna regularment."
    example: "El columnista defensa més carrils bici."
  - word: "citar"
    definition: "Reproduir paraules d'algú o d'un text."
    example: "L'article cita tres experts."
  - word: "la citació"
    definition: "Fragment reproduït d'un altre text."
    example: "La citació surt entre cometes."
  - word: "difondre"
    definition: "Fer arribar una informació a molta gent."
    example: "Les xarxes difonen rumors sense contrastar."
  - word: "el ple"
    definition: "Reunió de tots els regidors d'un ajuntament."
    example: "El ple ha aprovat el pressupost."
  - word: "l'actualitat"
    definition: "Allò que passa ara i de què parlen els mitjans."
    example: "L'actualitat mana a la portada."
  - word: "el mitjà de comunicació"
    definition: "Empresa o canal que informa: premsa, ràdio o televisió."
    example: "Els mitjans locals necessiten ajuts."
  - word: "la roda de premsa"
    definition: "Acte on es dona una notícia als periodistes."
    example: "La roda de premsa és a les dotze."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-55-001
    type: choice
    point: estructurar-text
    lesson: 1
    prompt: "___ la crisi de l'habitatge, l'article denuncia que els lloguers han pujat un vint per cent en dos anys."
    answer: "Pel que fa a"
    distractors:
      - text: "En resum,"
        why: "*En resum* tanca un text amb una conclusió; aquí es presenta el tema de l'article."
      - text: "Tanmateix,"
        why: "*Tanmateix* introdueix un contrast; aquí no hi ha cap contrast: es presenta el tema."
    explanation: "«La crisi de l'habitatge» és el tema de l'article: per presentar-lo fem servir *pel que fa a*."

  - id: b2-55-002
    type: choice
    point: estructurar-text
    lesson: 1
    prompt: "___ la mobilitat, la columnista defensa que calen més autobusos de nit."
    answer: "Quant a"
    distractors:
      - text: "En quant a"
        why: "*En quant a* és un calc de «en cuanto a». En català: *quant a*."
      - text: "En definitiva,"
        why: "*En definitiva* introdueix una conclusió; aquí es presenta un tema nou."
    explanation: "Per presentar el tema («la mobilitat») fem servir *quant a*, sense *en* al davant."

  - id: b2-55-003
    type: choice
    point: estructurar-text
    lesson: 1
    prompt: "L'editorial defensa el nou museu: d'una banda, atraurà turisme; ___, crearà llocs de treball."
    answer: "d'altra banda"
    distractors:
      - text: "en definitiva"
        why: "*En definitiva* tanca amb una conclusió; aquí s'afegeix un segon argument."
      - text: "és a dir"
        why: "*És a dir* repeteix la mateixa idea amb altres paraules; aquí s'afegeix una idea nova."
    explanation: "«D'una banda» demana la parella *d'altra banda*: s'afegeix un segon argument a favor del museu."

  - id: b2-55-004
    type: choice
    point: contrastar
    lesson: 1
    prompt: "El reportatge és llarg; ___, es llegeix de pressa perquè està molt ben escrit."
    answer: "tanmateix"
    distractors:
      - text: "a més"
        why: "*A més* afegeix una idea del mateix sentit; aquí la segona part contrasta amb la primera."
      - text: "és a dir"
        why: "*És a dir* aclareix la mateixa idea; aquí «es llegeix de pressa» contrasta amb «és llarg»."
    explanation: "«Es llegeix de pressa» contrasta amb «és llarg»: el connector de contrast és *tanmateix*."

  - id: b2-55-005
    type: choice
    point: contrastar
    lesson: 1
    prompt: "Al nord del país ha plogut molt aquest hivern; al sud, ___, la sequera continua."
    answer: "per contra"
    distractors:
      - text: "a més"
        why: "*A més* afegeix una idea del mateix sentit; aquí el sud contrasta amb el nord."
      - text: "en resum"
        why: "*En resum* introdueix una conclusió; aquí es contrasta el sud amb el nord."
    explanation: "Es comparen dos territoris amb situacions oposades: *per contra* marca aquest contrast simètric."

  - id: b2-55-006
    type: choice
    point: contrastar
    lesson: 1
    prompt: "L'entrevista aporta dades i citacions interessants. ___, l'Ibrahim no pregunta pels sous."
    answer: "Ara bé"
    distractors:
      - text: "A més"
        why: "*A més* afegeix una idea del mateix sentit; aquí es posa una objecció."
      - text: "És a dir"
        why: "*És a dir* repeteix la idea amb altres paraules; aquí s'hi posa un matís crític."
    explanation: "La segona frase posa una objecció a la primera: *ara bé* introdueix aquest matís a l'inici."

  - id: b2-55-007
    type: choice
    point: estructurar-text
    lesson: 1
    prompt: "El diari ha apujat el preu de la subscripció. ___, ha retallat el suplement cultural."
    answer: "A més"
    distractors:
      - text: "Tanmateix"
        why: "*Tanmateix* introdueix un contrast; les dues frases van en el mateix sentit: tot són males notícies per al lector."
      - text: "En definitiva"
        why: "*En definitiva* tanca amb una conclusió; aquí s'afegeix una segona queixa."
    explanation: "La segona frase afegeix una queixa a la primera: el connector d'addició és *a més*."

  - id: b2-55-008
    type: match
    point: estructurar-text
    lesson: 1
    instruction: "Relaciona cada inici amb la continuació adequada."
    pairs:
      - ["Pel que fa a les dades de l'atur,", "l'article admet que són provisionals."]
      - ["Quant a la sanitat pública,", "la columnista hi troba a faltar metges."]
      - ["D'una banda, el pla és car;", "d'altra banda, el pla crearà molta feina."]
      - ["L'entrada és cara; a més,", "la sala és petita i fosca."]
    explanation: "*Pel que fa a* i *quant a* presenten el tema; *d'altra banda* (amb «d'una banda») i *a més* afegeixen una idea."

  - id: b2-55-009
    type: inline-choice
    point: estructurar-text
    lesson: 1
    title: "Carta al director"
    text: "Benvolgut director: {Pel que fa a|En resum|Tanmateix} l'article sobre el barri, hi estic d'acord. {Quant a|En quant a|En definitiva,} la neteja dels carrers, cal una solució urgent. {D'altra banda|Tanmateix|En resum}, els veïns demanen més zones verdes. {A més|Tanmateix|És a dir}, el preu del lloguer no para de pujar."
    explanation: "*Pel que fa a* i *quant a* presenten cada tema de la carta; *d'altra banda* i *a més* afegeixen noves demandes. *En quant a*, amb *en*, és incorrecte."

  - id: b2-55-010
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «tornant al tema» en una tertúlia?"
    answer: "Que es reprèn el tema principal després d'una digressió."
    distractors:
      - text: "Que es canvia de tema per parlar d'una altra cosa."
        why: "És el contrari: es torna al tema inicial, no es canvia de tema."
      - text: "Que es dona el debat per acabat."
        why: "Per tancar un debat diem *en resum* o *en definitiva*; *tornant al tema* continua parlant del mateix."
    explanation: "*Tornant al tema* serveix per reprendre el fil després d'haver-ne sortit un moment."

  - id: b2-55-011
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Perdona, ens hem desviat parlant del cotxe. I, ___, què et va semblar l'entrevista, Laia? —Molt fluixa."
    answer: "tornant al tema"
    distractors:
      - text: "per contra"
        why: "*Per contra* oposa dos termes; aquí no hi ha cap contrast: es reprèn el tema de conversa."
      - text: "dit d'una altra manera"
        why: "*Dit d'una altra manera* repeteix una idea; aquí es torna al tema principal."
    explanation: "Després d'haver parlat d'una altra cosa, *tornant al tema* reprèn la conversa principal."

  - id: b2-55-012
    type: fill
    point: contrastar
    lesson: 1
    prompt: "La crònica és molt dura; ___, recomana la pel·lícula."
    hint: "connector de contrast (*no* + dues paraules)"
    answers: ["no obstant això"]
    wrong_answers:
      - text: "no obstant d'això"
        why: "La forma fixada és *no obstant això*, sense cap preposició."
    grading: tolerant
    explanation: "Recomanar la pel·lícula contrasta amb una crítica dura: el connector és *no obstant això*."

  # ---------- Lliçó 2 ----------
  - id: b2-55-013
    type: fill
    point: estructurar-text
    lesson: 2
    prompt: "___ la sanitat, l'article demana més metges de família."
    hint: "connector per presentar el tema (*pel que fa a* o *quant a*)"
    answers: ["Pel que fa a", "Quant a"]
    wrong_answers:
      - text: "En quant a"
        why: "*En quant a* és un calc de «en cuanto a». En català: *quant a* o *pel que fa a*."
    grading: tolerant
    explanation: "«La sanitat» és el tema: el presentem amb *pel que fa a* o *quant a*."

  - id: b2-55-014
    type: fill
    point: estructurar-text
    lesson: 2
    prompt: "El pla és car; d'una banda, caldrà apujar impostos; ___, crearà molts llocs de treball."
    hint: "connector que fa parella amb «d'una banda»"
    answers: ["d'altra banda", "per altra banda"]
    grading: tolerant
    explanation: "«D'una banda» fa parella amb *d'altra banda*: el pla té un cost, però també un avantatge."

  - id: b2-55-015
    type: fill
    point: estructurar-text
    lesson: 2
    prompt: "Les dades són provisionals; ___, l'article no cita les fonts."
    hint: "connector per afegir una crítica: *a* + una paraula"
    answers: ["a més"]
    grading: tolerant
    explanation: "La segona crítica s'afegeix a la primera: el connector és *a més*."

  - id: b2-55-016
    type: fill
    point: contrastar
    lesson: 2
    prompt: "La revista té cent pàgines. ___, es llegeix d'una tirada."
    hint: "connector de contrast que comença per *t*"
    answers: ["Tanmateix", "Tot i això", "Tot i així", "Tot amb això", "Tot i amb això"]
    grading: tolerant
    explanation: "«Es llegeix d'una tirada» contrasta amb «té cent pàgines»: el contrast el marca *tanmateix* (o *tot i això*)."

  - id: b2-55-017
    type: fill
    point: contrastar
    lesson: 2
    prompt: "El nord ha rebut pluges abundants; el sud, ___, no ha rebut ni una gota."
    hint: "connector de contrast: *per* + una paraula"
    answers: ["per contra"]
    grading: tolerant
    explanation: "El sud s'oposa al nord com a terme simètric: el connector és *per contra*."

  - id: b2-55-018
    type: fill
    point: contrastar
    lesson: 2
    prompt: "La proposta té punts forts. ___, el cost és excessiu."
    hint: "connector per posar una objecció (*ara* + una paraula)"
    answers: ["Ara bé"]
    grading: tolerant
    explanation: "«El cost és excessiu» posa una objecció als punts forts: *ara bé* la introdueix a l'inici."

  - id: b2-55-019
    type: order
    point: estructurar-text
    lesson: 2
    cue: "Digues que, sobre els horaris, el reportatge no diu res."
    chunks: ["Pel que fa als horaris,", "el reportatge", "no diu", "res"]
    extra: ["en quant als horaris,"]
    answers:
      - "Pel que fa als horaris, el reportatge no diu res."
      - "El reportatge, pel que fa als horaris, no diu res."
      - "El reportatge no diu res pel que fa als horaris."
    explanation: "*Pel que fa a* presenta el tema i sol anar al principi; *en quant a*, amb *en*, és incorrecte."

  - id: b2-55-020
    type: order
    point: contrastar
    lesson: 2
    cue: "Digues que la notícia és interessant, però que les dades són velles."
    chunks: ["La notícia és interessant;", "tanmateix,", "les dades", "són velles"]
    extra: ["per tant,"]
    answers:
      - "La notícia és interessant; tanmateix, les dades són velles."
      - "La notícia és interessant; les dades, tanmateix, són velles."
    explanation: "*Tanmateix* introdueix el contrast: la notícia interessa, però les dades són velles. Pot anar entre frases o al mig de la segona."

  - id: b2-55-021
    type: choice
    point: contrastar
    lesson: 2
    prompt: "«El barri és sorollós. Tanmateix, té molta vida.» Què introdueix *tanmateix*?"
    answer: "Un contrast amb la frase anterior."
    distractors:
      - text: "Una conclusió del text."
        why: "Les conclusions van al final del text i les marquen *en resum* o *en definitiva*."
      - text: "Una explicació de la frase anterior."
        why: "Els aclariments els marca *és a dir*; aquí hi ha un contrast, no un aclariment."
    explanation: "*Tanmateix* és un connector de contrast: «té molta vida» contrasta amb «és sorollós»."

  - id: b2-55-022
    type: choice
    point: estructurar-text
    lesson: 2
    prompt: "Quina frase presenta el tema de l'article?"
    answer: "Quant a la cultura, el pressupost és insuficient."
    distractors:
      - text: "En resum, la cultura necessita més diners."
        why: "Aquesta frase tanca amb una conclusió, no presenta el tema."
      - text: "La cultura, tanmateix, necessita més diners."
        why: "Aquesta frase introdueix un contrast, no presenta cap tema."
    explanation: "*Quant a* presenta el tema («la cultura»); les altres opcions conclouen o contrasten."

  - id: b2-55-023
    type: choice
    point: expressions
    lesson: 2
    prompt: "«___: el govern retalla, els ajuntaments paguen i els veïns pateixen», diu la Fàtima."
    answer: "En poques paraules"
    distractors:
      - text: "Tornant al tema"
        why: "*Tornant al tema* reprèn el fil, no resumeix."
      - text: "Dit d'una altra manera"
        why: "*Dit d'una altra manera* repeteix una idea ja dita; aquí es resumeixen tres fets."
    explanation: "*En poques paraules* resumeix una situació en una frase breu i contundent."

  - id: b2-55-024
    type: match
    point: expressions
    lesson: 2
    instruction: "Relaciona cada expressió amb la situació en què s'escau."
    pairs:
      - ["en poques paraules", "resumir una situació en una frase contundent"]
      - ["dit d'una altra manera", "aclarir un terme tècnic per al lector"]
      - ["tornant al tema", "reprendre el fil després d'un incís"]
      - ["tot plegat", "fer balanç d'una experiència amb pros i contres"]
      - ["dit això", "reconèixer una objecció després d'un elogi"]
    explanation: "Són expressions per organitzar el discurs: resumir, aclarir, reprendre el fil, fer balanç i matisar."

  - id: b2-55-025
    type: inline-choice
    point: contrastar
    lesson: 2
    title: "Ressenya d'una novel·la"
    text: "La novel·la té un inici lent. {Tanmateix|Per tant|És a dir}, a partir del tercer capítol enganxa. L'estil és senzill; {no obstant això|a més|en resum}, l'autor crea imatges molt potents. {Per contra|En definitiva|És a dir}, el final decep: arriba de pressa i sense sorpreses. {Ara bé|Per tant|És a dir}, paga la pena llegir-la."
    explanation: "Tots quatre connectors marquen un contrast: *tanmateix* i *no obstant això* matisen, *per contra* oposa dos aspectes i *ara bé* posa una objecció final."

  # ---------- Lliçó 3 ----------
  - id: b2-55-026
    type: choice
    point: aclarir-concloure
    lesson: 3
    prompt: "El diari ha publicat les dades: ha perdut un deu per cent de lectors; ___, un de cada deu ha deixat de comprar-lo."
    answer: "és a dir"
    distractors:
      - text: "en resum"
        why: "*En resum* tanca un text; aquí s'aclareix una dada amb altres paraules."
      - text: "tanmateix"
        why: "*Tanmateix* introdueix un contrast; aquí no hi ha contrast: és la mateixa idea."
    explanation: "«Un de cada deu ha deixat de comprar-lo» repeteix la dada amb paraules més clares: *és a dir*."

  - id: b2-55-027
    type: choice
    point: aclarir-concloure
    lesson: 3
    prompt: "L'informe parla d'aules velles, de pocs mestres i de cursos massa curts. ___, cal més inversió, més personal i més temps."
    answer: "En resum"
    distractors:
      - text: "És a dir"
        why: "*És a dir* aclareix una idea; aquí es tanca amb una conclusió."
      - text: "Tanmateix"
        why: "*Tanmateix* contrasta; aquí es resumeix què cal fer."
    explanation: "La frase tanca amb una conclusió en forma de llista: *en resum*."

  - id: b2-55-028
    type: choice
    point: aclarir-concloure
    lesson: 3
    prompt: "___ l'èxit de l'edició digital, el diari ha enviat un corresponsal a Brussel·les."
    answer: "Arran de"
    distractors:
      - text: "Pel que fa a"
        why: "*Pel que fa a* presenta un tema; aquí l'èxit és la causa de la decisió."
      - text: "Malgrat"
