  # ---------- Lliçó 5 ----------
  - id: a2-04-053
    type: reading
    point: comparacio
    lesson: 5
    title: "Un pis nou a Sabadell"
    text: |
      L'Ibrahim i la Carla busquen un pis de lloguer a Sabadell. Aquest dissabte visiten dos pisos. El primer és al centre: és més petit que el segon, però té una cuina grandíssima i un balcó que dona al carrer. El segon és a prop de l'estació: és més gran i més barat, però la nevera és vella i el bany és petitíssim.

      «Aquest pis del centre m'agrada més», diu la Carla. «La cuina és tan gran com el menjador de casa meva!»

      «Però aquell pis de l'estació és més barat», respon l'Ibrahim. «I la nostra feina és a prop de l'estació.»

      Al final trien el pis del centre: és més car, però és més tranquil.
    questions:
      - prompt: "Per què la Carla prefereix el pis del centre?"
        answer: "Per la cuina, que és molt gran."
        distractors:
          - text: "Perquè és més barat."
            why: "El pis del centre és més car. El barat és el de l'estació."
          - text: "Perquè és a prop de la feina."
            why: "A prop de la feina és el pis de l'estació."
      - prompt: "Què diu l'Ibrahim del pis de l'estació?"
        answer: "Que és més barat i a prop de la feina."
        distractors:
          - text: "Que té una cuina grandíssima."
            why: "La cuina grandíssima és del pis del centre."
          - text: "Que té el bany molt gran."
            why: "El bany del pis de l'estació és petitíssim."
      - prompt: "Com és el bany del pis de l'estació?"
        answer: "Molt petit."
        distractors:
          - text: "Molt gran."
            why: "El text diu que és petitíssim."
          - text: "Nou i modern."
            why: "El text no diu això: diu que és petitíssim."
      - prompt: "Quin pis trien al final?"
        answer: "El del centre, que és més car."
        distractors:
          - text: "El de l'estació, que és més barat."
            why: "Trien el del centre, que és més car."
          - text: "Cap dels dos: continuen buscant."
            why: "El text diu que trien el pis del centre."
    explanation: "L'Ibrahim i la Carla comparen dos pisos i trien el del centre, més car però més tranquil."

