id: a2-04
level: A2
title: "Possessius, demostratius i comparació"
summary: "Els possessius amb article (*el meu cotxe*), els demostratius (*aquest, aquell, això, allò*), la comparació (*més… que, tan… com*) i el superlatiu (*grandíssim*)."
vocabulary_theme: "Casa i habitatge"
points:
  - id: possessius
    title: "Els possessius amb article"
    refs:
      - label: "GEIEC: Els possessius"
        url: "https://geiec.iec.cat"
  - id: demostratius
    title: "Els demostratius: *aquest, aquell, això, allò*"
    refs:
      - label: "GEIEC: Els demostratius"
        url: "https://geiec.iec.cat"
  - id: comparacio
    title: "La comparació i el superlatiu"
    refs:
      - label: "GEIEC: La comparació"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: l'article i *tan/tant*"
  - id: expressions
    title: "Expressions de casa"
lessons:
  - title: "Conèixer els possessius i els demostratius"
  - title: "Practicar els possessius i els demostratius"
  - title: "La comparació i els calcs"
  - title: "Produir frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "el pis"
    definition: "Apartament en un edifici, amb habitacions, cuina i bany."
    example: "Visc en un pis de lloguer a Sabadell."
  - word: "la casa"
    definition: "Edifici per viure-hi, normalment amb jardí o pati."
    example: "La casa dels avis té tres habitacions."
  - word: "l'escala"
    definition: "L'espai d'un edifici amb els graons i l'ascensor."
    example: "La meva bici és a l'escala."
  - word: "el replà"
    definition: "L'espai pla de l'escala davant de cada porta."
    example: "Deixem el paraigua al replà."
  - word: "l'ascensor"
    definition: "La cabina que puja i baixa entre els pisos."
    example: "Aquest edifici té ascensor."
  - word: "el rebedor"
    definition: "La primera peça del pis, just darrere la porta."
    example: "Deixa les sabates al rebedor."
  - word: "el menjador"
    definition: "La peça on mengem i fem vida."
    example: "Sopem al menjador amb els avis."
  - word: "la cuina"
    definition: "La peça on cuinem i guardem el menjar."
    example: "La cuina nova té un forn molt bo."
  - word: "l'habitació"
    definition: "La peça on dormim."
    example: "La meva habitació és petita, però té molta llum."
  - word: "el bany"
    definition: "La peça amb el lavabo, la dutxa o la banyera."
    example: "El bany té una finestra petita."
  - word: "el lavabo"
    definition: "La pica on ens rentem les mans i la cara."
    example: "Renta't les mans al lavabo."
  - word: "el balcó"
    definition: "La part d'un pis oberta al carrer, amb una barana."
    example: "El balcó que dona al carrer és molt gran."
  - word: "la terrassa"
    definition: "Un espai obert i pla per estar-hi a l'aire lliure."
    example: "A l'estiu sopem a la terrassa."
  - word: "el pati"
    definition: "L'espai obert dins d'una casa o d'una illa de cases."
    example: "Les finestres donen al pati."
  - word: "el jardí"
    definition: "El tros de terra amb plantes i flors."
    example: "Rego el jardí cada tarda."
  - word: "el garatge"
    definition: "El lloc on guardem el cotxe o la moto."
    example: "La moto és al garatge."
  - word: "el traster"
    definition: "La peça petita on guardem les coses que no fem servir."
    example: "La bici vella és al traster."
  - word: "la paret"
    definition: "Allò que separa dues habitacions d'una casa."
    example: "Contra la paret hi ha un armari."
  - word: "el terra"
    definition: "La superfície on caminem dins de casa."
    example: "Frego el terra de la cuina cada setmana."
  - word: "la finestra"
    definition: "L'obertura a la paret per on entra la llum."
    example: "Obre la finestra: fa molta calor."
  - word: "la porta"
    definition: "Allò que obrim i tanquem per entrar i sortir."
    example: "Truquen a la porta!"
  - word: "la persiana"
    definition: "Allò que cobreix la finestra per tapar la llum."
    example: "Abaixa la persiana: entra molt sol."
  - word: "la clau"
    definition: "Allò que fem servir per obrir i tancar la porta."
    example: "He perdut les claus del garatge."
  - word: "el pany"
    definition: "El mecanisme de la porta on posem la clau."
    example: "El pany nou està trencat."
  - word: "el llum"
    definition: "L'aparell que fa llum en una habitació."
    example: "Encén el llum del rebedor."
  - word: "l'endoll"
    definition: "El punt de la paret on connectem els aparells elèctrics."
    example: "L'endoll de la rentadora no funciona."
  - word: "la nevera"
    definition: "L'aparell fred on guardem el menjar."
    example: "La llet és a la nevera."
  - word: "el forn"
    definition: "L'aparell calent on coem el menjar."
    example: "El pa és al forn."
  - word: "la rentadora"
    definition: "La màquina que renta la roba."
    example: "Posa la roba a la rentadora."
  - word: "el sofà"
    definition: "El seient llarg i tou del menjador."
    example: "Al vespre llegim al sofà."
  - word: "l'armari"
    definition: "El moble alt amb portes on guardem la roba."
    example: "La roba neta és a l'armari."
  - word: "el calaix"
    definition: "La capsa que surt d'un moble per guardar-hi coses."
    example: "Les claus són al calaix del rebedor."
  - word: "el mirall"
    definition: "El vidre on ens veiem la cara."
    example: "Al lavabo hi ha un mirall gran."
  - word: "la dutxa"
    definition: "On ens rentem amb l'aigua que cau de dalt."
    example: "La dutxa nova va molt bé."
  - word: "la banyera"
    definition: "El recipient gran on ens banyem."
    example: "Els nens juguen a la banyera."
  - word: "el lloguer"
    definition: "Els diners que paguem cada mes pel pis."
    example: "El lloguer puja cada any."
  - word: "la mudança"
    definition: "El canvi de casa, amb totes les caixes."
    example: "La mudança és aquest cap de setmana."
  - word: "endreçar"
    definition: "Posar cada cosa al seu lloc."
    example: "Endreço l'habitació abans de sopar."
  - word: "escombrar"
    definition: "Netejar el terra amb l'escombra."
    example: "Escombro el menjador cada dos dies."
  - word: "fregar"
    definition: "Netejar amb aigua, amb un drap o amb la fregona."
    example: "Frego el terra de tot el pis."
items:
  # ---------- Lliçó 1 ----------
  - id: a2-04-001
    type: choice
    point: possessius
    lesson: 1
    prompt: "—Jo visc al tercer. I tu? —___ pis és el primer."
    answer: "El meu"
    distractors:
      - text: "El teu"
        why: "Qui parla és «tu»: el pis és *el meu*, no *el teu*."
      - text: "El seu"
        why: "*Seu* és d'una altra persona. Qui parla és «tu»: *el meu*."
    explanation: "Respon «tu», i parla del seu pis: el possessiu de «jo» és *el meu*."

  - id: a2-04-002
    type: choice
    point: possessius
    lesson: 1
    prompt: "La Núria viu al tercer: ___ pis és molt sorollós."
    answer: "el seu"
    distractors:
      - text: "el teu"
        why: "La Núria parla del seu pis, no del teu: *el seu*."
      - text: "el nostre"
        why: "*Nostre* és de «nosaltres». La Núria parla d'ella: *el seu*."
    explanation: "«La Núria» és «ella»: *el seu*. I «pis» és masculí."

  - id: a2-04-003
    type: choice
    point: possessius
    lesson: 1
    prompt: "Vivim al cinquè: ___ terrassa dona al carrer."
    answer: "la nostra"
    distractors:
      - text: "el nostre"
        why: "*Terrassa* és femení: *la nostra*."
      - text: "la vostra"
        why: "*Vivim* és «nosaltres»: *la nostra*, no *la vostra*."
    explanation: "«Vivim» és «nosaltres», i «terrassa» és femení: *la nostra*."

  - id: a2-04-004
    type: choice
    point: demostratius
    lesson: 1
    prompt: "Mira: ___ clau que tinc a la mà és la del traster."
    answer: "aquesta"
    distractors:
      - text: "aquella"
        why: "*Aquella* és per a coses llunyanes. La clau és a la mà: *aquesta*."
      - text: "aquest"
        why: "*Clau* és femení: *aquesta*, no *aquest*."
    explanation: "La clau és a la mà, a prop: *aquesta*. *Clau* és femení."

  - id: a2-04-005
    type: choice
    point: demostratius
    lesson: 1
    prompt: "___ casa del final del carrer té un jardí grandíssim."
    answer: "Aquella"
    distractors:
      - text: "Aquesta"
        why: "La casa és al final del carrer, lluny: *aquella*."
      - text: "Aquell"
        why: "*Casa* és femení: *aquella*."
    explanation: "«Del final del carrer» és lluny: *aquella*. *Casa* és femení."

  - id: a2-04-006
    type: choice
    point: demostratius
    lesson: 1
    prompt: "Tot ___ d'aquí va al traster."
    answer: "això"
    distractors:
      - text: "allò"
        why: "«D'aquí» és a prop: *això*, no *allò*."
      - text: "aquests"
        why: "*Tot* i *va* són singulars. Per a coses diverses sense nom, el neutre és *això*."
    explanation: "«D'aquí» és a prop, i són coses diverses sense nom: el neutre és *això*."

  - id: a2-04-007
    type: match
    point: possessius
    lesson: 1
    instruction: "Relaciona cada persona amb el seu possessiu."
    pairs:
      - ["jo", "meu, meva"]
      - ["tu", "teu, teva"]
      - ["ell o ella", "seu, seva"]
      - ["nosaltres", "nostre, nostra"]
      - ["vosaltres", "vostre, vostra"]
    explanation: "Són les formes del possessiu. Davant del nom sempre porten article: *el meu, la teva*."

  - id: a2-04-008
    type: match
    point: demostratius
    lesson: 1
    instruction: "Relaciona cada demostratiu amb quan es fa servir."
    pairs:
      - ["aquest, aquesta", "una cosa a prop"]
      - ["aquests, aquestes", "coses a prop"]
      - ["aquell, aquella", "una cosa lluny"]
      - ["aquells, aquelles", "coses lluny"]
      - ["això", "una cosa a prop, sense nom"]
      - ["allò", "una cosa lluny, sense nom"]
    explanation: "*Aquest* és a prop i *aquell* és lluny. Sense nom, fem servir *això* i *allò*."

  - id: a2-04-009
    type: inline-choice
    point: demostratius
    lesson: 1
    title: "Un missatge de l'Ibrahim"
    text: "Hola, Laia! {Aquest|Aquestos|Aquestes} dissabte vinc a veure el {teu|tu|teus} pis nou. Et porto {aquestes|aquests|aquesta} cadires de la foto: a la {meva|mi|meu} terrassa no hi caben. Fins dissabte!"
    explanation: "*Dissabte* és masculí i proper: *aquest*. *Cadires* és femení plural: *aquestes*. El possessiu porta article i concorda: *el teu pis, la meva terrassa*."

  - id: a2-04-010
    type: choice
    point: possessius
    lesson: 1
    prompt: "—Aquestes claus són les ___? —Sí, són de casa meva."
    answer: "teves"
    distractors:
      - text: "teus"
        why: "*Claus* és femení plural: *teves*."
      - text: "meves"
        why: "Qui respon diu «casa meva»: les claus són seves. Qui pregunta diu *les teves*."
    explanation: "«Claus» és femení plural, i són de qui respon («casa meva»): qui pregunta diu *les teves*."

  - id: a2-04-011
    type: choice
    point: demostratius
    lesson: 1
    prompt: "No toquis ___ d'allà: no sé què és."
    answer: "allò"
    distractors:
      - text: "això"
        why: "«D'allà» és lluny: *allò*, no *això*."
      - text: "aquell"
        why: "No sabem què és, i no hi ha cap nom: el neutre és *allò*."
    explanation: "«D'allà» és lluny, i no sabem què és: el neutre és *allò*."

  - id: a2-04-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "—On sopem dissabte? —___, que tinc la nevera plena."
    answer: "A casa meva"
    distractors:
      - text: "En casa meva"
        why: "L'expressió és amb *a*: *a casa meva*. *En* és un calc de «en casa»."
      - text: "A casa meves"
        why: "*Casa* és singular: *a casa meva*."
    explanation: "L'expressió és *a casa meva*: a casa de qui parla, sense article."

  - id: a2-04-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Et quedes a dormir? —Sí, aquí ___."
    answer: "estic com a casa"
    distractors:
      - text: "estic com en casa"
        why: "L'expressió porta *a*: *estar com a casa*. *En* és un calc."
      - text: "estic com casa"
        why: "L'expressió porta *a*: *estar com a casa*."
    explanation: "*Estar com a casa* vol dir sentir-se còmode, com a casa seva."

  # ---------- Lliçó 2 ----------
  - id: a2-04-014
    type: fill
    point: possessius
    lesson: 2
    prompt: "El Wei té una habitació nova: ___ finestra dona al pati."
    hint: "*finestra*, possessiu de «ell»"
    answers: ["la seva"]
    wrong_answers:
      - text: "el seu"
        why: "*Finestra* és femení: *la seva*."
      - text: "la seu"
        why: "Et falta una *a*: *la seva*. *La seu* és una altra paraula."
    grading: tolerant
    explanation: "«El Wei» és «ell», i «finestra» és femení: *la seva*."

  - id: a2-04-015
    type: fill
    point: possessius
    lesson: 2
    prompt: "Els avis viuen sols: ___ casa té tres habitacions."
    hint: "*casa*, possessiu de «ells»"
    answers: ["la seva"]
    wrong_answers:
      - text: "el seu"
        why: "*Casa* és femení: *la seva*."
      - text: "seva"
        why: "El possessiu porta article: *la seva*."
    grading: tolerant
    explanation: "«Els avis» és «ells», i «casa» és femení: *la seva*."

  - id: a2-04-016
    type: fill
    point: possessius
    lesson: 2
    prompt: "—On són ___ claus? —Les meves són darrere la porta."
    hint: "*claus*, possessiu de «tu»"
    answers: ["les teves"]
    wrong_answers:
      - text: "les teus"
        why: "*Claus* és femení: *les teves*."
      - text: "les seves"
        why: "La pista diu «tu»: *les teves*. *Les seves* és d'ell, d'ella o de vostè."
    grading: tolerant
    explanation: "«Claus» és femení plural, i parles amb la persona: *les teves*."

  - id: a2-04-017
    type: fill
    point: demostratius
    lesson: 2
    prompt: "___ pisos d'aquí baix són més barats."
    hint: "demostratiu de proximitat, masculí plural"
    answers: ["Aquests"]
    wrong_answers:
      - text: "Aquells"
        why: "«D'aquí» és a prop: *aquests*."
      - text: "Aquest"
        why: "*Pisos* és plural: *aquests*."
    grading: tolerant
    explanation: "«D'aquí» és a prop, i «pisos» és plural: *aquests*."

  - id: a2-04-018
    type: fill
    point: demostratius
    lesson: 2
    prompt: "Mira ___ fotos del mòbil: són de la cuina nova."
    hint: "demostratiu de proximitat, femení plural"
    answers: ["aquestes"]
    wrong_answers:
      - text: "aquelles"
        why: "Les fotos són al mòbil, a prop: *aquestes*."
      - text: "aquests"
        why: "*Fotos* és femení: *aquestes*."
    grading: tolerant
    explanation: "Les fotos són al mòbil, a prop. I «fotos» és femení plural: *aquestes*."

  - id: a2-04-019
    type: fill
    point: demostratius
    lesson: 2
    prompt: "Guarda ___ que tens a les mans al calaix."
    hint: "neutre de proximitat"
    answers: ["això"]
    wrong_answers:
      - text: "allò"
        why: "«A les mans» és a prop: *això*."
      - text: "aquest"
        why: "Aquí no hi ha cap nom: per a una cosa sense nom, el neutre és *això*."
    grading: tolerant
    explanation: "«A les mans» és a prop, i no hi ha cap nom: *això*."

  - id: a2-04-020
    type: inline-choice
    point: possessius
    lesson: 2
    title: "La mudança de la Carla"
    text: "La Carla fa la mudança aquest cap de setmana. Els {seus|seves|seu} amics l'ajuden amb les caixes. El {seu|seva|seus} germà porta el cotxe, i la {seva|seu|seves} germana neteja el pis nou. Diu que {els seus|les seves|els seves} veïns són molt simpàtics!"
    explanation: "*Amics, germà* i *veïns* són masculins; *germana*, femení. La Carla és «ella»: *seu, seva, seus*."

  - id: a2-04-021
    type: order
    point: possessius
    lesson: 2
    cue: "Digues que cada diumenge dinem a casa dels teus pares."
    chunks: ["cada diumenge", "dinem", "a casa", "dels teus pares"]
    extra: ["dels tus pares"]
    answers:
      - "Cada diumenge dinem a casa dels teus pares."
      - "Dinem a casa dels teus pares cada diumenge."
      - "Dinem cada diumenge a casa dels teus pares."
      - "A casa dels teus pares dinem cada diumenge."
      - "Cada diumenge a casa dels teus pares dinem."
      - "A casa dels teus pares cada diumenge dinem."
    explanation: "*A casa* no porta article, i *pares* és masculí plural: *dels teus pares*."

  - id: a2-04-022
    type: order
    point: demostratius
    lesson: 2
    cue: "Explica que aquests mobles del menjador són de l'àvia."
    chunks: ["aquests mobles", "del menjador", "són", "de l'àvia"]
    extra: ["aquestes mobles"]
    answers:
      - "Aquests mobles del menjador són de l'àvia."
      - "De l'àvia són aquests mobles del menjador."
      - "Són de l'àvia aquests mobles del menjador."
    explanation: "«Mobles» és masculí plural i a prop: *aquests mobles*. Són de l'àvia."

  - id: a2-04-023
    type: choice
    point: possessius
    lesson: 2
    prompt: "—On deixes la bici? —___ bici és a l'escala."
    answer: "La meva"
    distractors:
      - text: "La teva"
        why: "Parla de la seva bici: *la meva*."
      - text: "El meu"
        why: "*Bici* és femení: *la meva*."
    explanation: "Respon «jo», i «bici» és femení: *la meva*."

  - id: a2-04-024
    type: choice
    point: demostratius
    lesson: 2
    prompt: "Abaixa ___ persianes d'aquí: entra molt sol."
    answer: "aquestes"
    distractors:
      - text: "aquelles"
        why: "«D'aquí» és a prop: *aquestes*."
      - text: "aquests"
        why: "*Persianes* és femení: *aquestes*."
    explanation: "«D'aquí» és a prop, i «persianes» és femení plural: *aquestes*."

  - id: a2-04-025
    type: fill
    point: possessius
    lesson: 2
    prompt: "La Fàtima i jo compartim pis: ___ despeses són altes."
    hint: "*despeses*, possessiu de «nosaltres»"
    answers: ["les nostres"]
    wrong_answers:
      - text: "els nostres"
        why: "*Despeses* és femení: *les nostres*."
      - text: "les nostras"
        why: "En català és *nostres*, amb *e*: *les nostres*."
    grading: tolerant
    explanation: "«La Fàtima i jo» és «nosaltres», i «despeses» és femení: *les nostres*."

  - id: a2-04-026
    type: fill
    point: demostratius
    lesson: 2
    prompt: "No miris ___ fotos d'allà: són de la mudança."
    hint: "demostratiu de llunyania, femení plural"
    answers: ["aquelles"]
    wrong_answers:
      - text: "aquestes"
        why: "«D'allà» és lluny: *aquelles*."
      - text: "aquells"
        why: "*Fotos* és femení: *aquelles*."
    grading: tolerant
    explanation: "«D'allà» és lluny, i «fotos» és femení plural: *aquelles*."

  # ---------- Lliçó 3 ----------
  - id: a2-04-027
    type: choice
    point: comparacio
    lesson: 3
    prompt: "El pis de dalt té tres nens petits: és ___ sorollós que el nostre."
    answer: "més"
    distractors:
      - text: "menys"
        why: "Tres nens petits fan soroll: és *més* sorollós."
      - text: "tan"
        why: "*Tan* va amb *com*: *tan sorollós com*. Amb *que*, *més*."
    explanation: "Amb tres nens és superior: *més… que*. *Tan* va amb *com*."

  - id: a2-04-028
    type: choice
    point: comparacio
    lesson: 3
    prompt: "Aquesta banyera amb descompte costa ___ que l'antiga."
    answer: "menys"
    distractors:
      - text: "més"
        why: "Amb descompte costa menys: *menys… que*."
      - text: "tant"
        why: "*Tant* va amb *com*. Amb *que*: *menys*."
    explanation: "Amb descompte costa menys: inferioritat, *menys… que*."

  - id: a2-04-029
    type: choice
    point: comparacio
    lesson: 3
    prompt: "La cuina és ___ gran com el menjador: fan la mateixa mida."
    answer: "tan"
    distractors:
      - text: "tant"
        why: "*Gran* és un adjectiu: *tan*. *Tant* va amb noms i verbs."
      - text: "més"
        why: "«La mateixa mida» és igualtat: *tan… com*, no *més*."
    explanation: "«La mateixa mida» és igualtat, i «gran» és un adjectiu: *tan… com*."

  - id: a2-04-030
    type: choice
    point: comparacio
    lesson: 3
    prompt: "Aquest hivern fa ___ fred com l'any passat."
    answer: "tant"
    distractors:
      - text: "tan"
