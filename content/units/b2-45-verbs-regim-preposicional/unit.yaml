id: b2-45
level: B2
title: "Verbs de règim preposicional (II)"
summary: "Els verbs que regeixen a, de, amb, en i per, les interferències del castellà i quatre expressions per anar al gra, en el context de la universitat i la recerca."
vocabulary_theme: "Universitat i recerca"
points:
  - id: regim-a
    title: "Verbs que regeixen *a*"
    refs:
      - label: "GEIEC: El règim preposicional"
        url: "https://geiec.iec.cat"
  - id: regim-de
    title: "Verbs que regeixen *de*"
    refs:
      - label: "GEIEC: El règim preposicional"
        url: "https://geiec.iec.cat"
  - id: regim-altres
    title: "*Comptar amb*, *consistir en*, *interessar-se per* i *insistir*"
    refs:
      - label: "GEIEC: El règim preposicional"
        url: "https://geiec.iec.cat"
  - id: compte-preposicions
    title: "Compte amb el castellà: *pensar en*, *somiar* i *casar-se amb*"
    refs:
      - label: "Optimot: Règim preposicional"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions per anar al gra"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: verbs que regeixen *a* i *de*"
  - title: "Practicar *a* i *de*"
  - title: "Altres règims i interferències"
  - title: "Produir: reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "la facultat"
    definition: "Centre universitari on s'estudia una carrera concreta."
    example: "La Laia estudia medicina a la facultat de Girona."
  - word: "el grau"
    definition: "Estudis universitaris de quatre anys que donen un títol."
    example: "Va acabar el grau d'història al juny."
  - word: "el màster"
    definition: "Estudis universitaris que es fan després del grau."
    example: "L'Ibrahim farà un màster de matemàtiques."
  - word: "el doctorat"
    definition: "Estudis més alts de la universitat, que acaben amb una tesi."
    example: "Va demanar plaça al doctorat de Barcelona."
  - word: "la tesi doctoral"
    definition: "Treball llarg de recerca que cal defensar per obtenir el doctorat."
    example: "Defensarà la tesi doctoral al juny."
  - word: "la recerca"
    definition: "Treball per descobrir coses noves en una ciència."
    example: "Es dedica a la recerca sobre el càncer."
  - word: "l'investigador, la investigadora"
    definition: "Persona que fa recerca en una universitat o un centre."
    example: "L'equip té tres investigadors nous."
  - word: "el doctorand, la doctoranda"
    definition: "Estudiant que està fent el doctorat."
    example: "Els doctorands comparteixen despatx."
  - word: "el laboratori"
    definition: "Sala amb aparells on es fan experiments."
    example: "L'experiment es fa al laboratori de química."
  - word: "la biblioteca"
    definition: "Lloc on es poden llegir i demanar llibres."
    example: "Estudia cada tarda a la biblioteca."
  - word: "el campus"
    definition: "Conjunt d'edificis d'una universitat."
    example: "El campus de Bellaterra és molt gran."
  - word: "l'aula"
    definition: "Sala on es fan les classes."
    example: "L'examen és a l'aula 3."
  - word: "la beca"
    definition: "Diners que rep un estudiant per estudiar o investigar."
    example: "Ha aconseguit una beca de quatre anys."
  - word: "la matrícula"
    definition: "Inscripció (i pagament) per estudiar un curs."
    example: "La matrícula es fa al juliol."
  - word: "l'assignatura"
    definition: "Cada matèria d'un pla d'estudis."
    example: "Li queden dues assignatures per acabar."
  - word: "el crèdit"
    definition: "Unitat que mesura la feina d'una assignatura."
    example: "El grau té dos-cents quaranta crèdits."
  - word: "l'examen"
    definition: "Prova per comprovar què sap un estudiant."
    example: "L'examen final té dues parts."
  - word: "la convocatòria"
    definition: "Crida oficial per a un examen, una beca o una plaça."
    example: "Hi ha convocatòria al juny i al setembre."
  - word: "l'apunt"
    definition: "Nota que pren un estudiant a classe."
    example: "Repasseu els apunts abans de l'examen."
  - word: "el seminari"
    definition: "Classe amb pocs estudiants on es parla d'un tema."
    example: "El seminari dels dijous és optatiu."
  - word: "la conferència"
    definition: "Xerrada d'un expert davant d'un públic."
    example: "Demà hi ha una conferència sobre el clima."
  - word: "el congrés"
    definition: "Reunió gran d'experts d'una ciència."
    example: "Va presentar la tesi en un congrés."
  - word: "l'article científic"
    definition: "Text que publica els resultats d'una recerca."
    example: "Ha publicat dos articles científics."
  - word: "l'enquesta"
    definition: "Conjunt de preguntes per recollir dades."
    example: "L'enquesta es fa a dos-cents estudiants."
  - word: "l'experiment"
    definition: "Prova que es fa per comprovar una hipòtesi."
    example: "L'experiment va durar tres mesos."
  - word: "la hipòtesi"
    definition: "Idea que es vol comprovar amb la recerca."
    example: "La primera hipòtesi no era correcta."
  - word: "el resultat"
    definition: "Allò que s'obté d'un experiment o d'un examen."
    example: "Els resultats van ser molt clars."
  - word: "el tribunal"
    definition: "Grup de professors que jutja una tesi o un examen."
    example: "El tribunal té tres professors."
  - word: "la defensa"
    definition: "Acte en què es presenta la tesi davant del tribunal."
    example: "La defensa serà al juny."
  - word: "el pla d'estudis"
    definition: "Llista oficial de les assignatures d'una carrera."
    example: "El nou pla d'estudis té més pràctiques."
  - word: "el préstec"
    definition: "Deixar un llibre de la biblioteca per un temps."
    example: "El préstec és de tres setmanes."
  - word: "el professor, la professora"
    definition: "Persona que ensenya a la universitat."
    example: "La professora Font fa història medieval."
  - word: "la càtedra"
    definition: "Plaça de professor del nivell més alt de la universitat."
    example: "Aspira a una càtedra de física."
  - word: "el degà, la degana"
    definition: "Persona que dirigeix una facultat."
    example: "El degà presideix la reunió."
  - word: "el tutor, la tutora"
    definition: "Professor que guia un estudiant o una tesi."
    example: "La tutora revisa cada capítol."
  - word: "el becari, la becària"
    definition: "Estudiant que té una beca."
    example: "Els becaris ajuden al laboratori."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-45-001
    type: choice
    point: regim-a
    lesson: 1
    prompt: "La Núria ___ la química orgànica des de fa deu anys."
    answer: "es dedica a"
    distractors:
      - text: "es dedica en"
        why: "*Dedicar-se* regeix la preposició *a*. *En* és la preposició d'altres verbs, com *pensar en*."
      - text: "es dedica de"
        why: "*Dedicar-se* regeix *a*, no *de*."
    explanation: "*Dedicar-se* porta sempre la preposició *a*: la Núria *es dedica a* la química orgànica."

  - id: b2-45-002
    type: choice
    point: regim-a
    lesson: 1
    prompt: "Amb aquesta nota, en Pau podrà ___ un grau de medicina a Girona."
    answer: "accedir a"
    distractors:
      - text: "accedir en"
        why: "*Accedir* regeix *a*, no *en*."
      - text: "accedir de"
        why: "*Accedir* regeix *a*, no *de*."
    explanation: "*Accedir* regeix *a*: en Pau pot *accedir a* un grau de medicina."

  - id: b2-45-003
    type: choice
    point: regim-a
    lesson: 1
    prompt: "L'Arnau ___ una plaça de professor associat a Girona."
    answer: "aspira a"
    distractors:
      - text: "aspira en"
        why: "*Aspirar* regeix *a*, no *en*."
      - text: "aspira de"
        why: "*Aspirar* regeix *a*, no *de*."
    explanation: "*Aspirar* regeix *a* quan vol dir «voler aconseguir»: *aspira a* una plaça."

  - id: b2-45-004
    type: choice
    point: regim-a
    lesson: 1
    prompt: "La Carla va haver de ___ la beca per quedar-se a treballar a Vic."
    answer: "renunciar a"
    distractors:
      - text: "renunciar de"
        why: "*Renunciar* regeix *a*, no *de*."
      - text: "renunciar en"
        why: "*Renunciar* regeix *a*, no *en*."
    explanation: "*Renunciar* regeix *a*: *renunciar a* una beca, a una plaça o a un dret."

  - id: b2-45-005
    type: choice
    point: regim-de
    lesson: 1
    prompt: "El laboratori no pot ___ dues tècniques alhora."
    answer: "prescindir de"
    distractors:
      - text: "prescindir amb"
        why: "*Prescindir* regeix *de*, no *amb*."
      - text: "prescindir en"
        why: "*Prescindir* regeix *de*, no *en*."
    explanation: "*Prescindir* regeix *de*: *prescindir de* dues tècniques vol dir passar sense elles."

  - id: b2-45-006
    type: choice
    point: regim-de
    lesson: 1
    prompt: "No és un error greu: ___ la matrícula del primer curs."
    answer: "es tracta de"
    distractors:
      - text: "tracta de"
        why: "Falta el pronom: el verb és pronominal, *es tracta de*."
      - text: "es tracta amb"
        why: "La preposició és *de*: *es tracta de* la matrícula."
    explanation: "Quan una cosa «és qüestió de» una altra, diem *es tracta de*, sempre amb el pronom *es*."

  - id: b2-45-007
    type: match
    point: regim-a
    lesson: 1
    instruction: "Relaciona cada verb amb el seu significat."
    pairs:
      - ["dedicar-se a", "treballar en un camp o una activitat"]
      - ["accedir a", "poder entrar en uns estudis o en un servei"]
      - ["renunciar a", "deixar una plaça o un dret"]
      - ["aspirar a", "voler aconseguir una plaça o un títol"]
    explanation: "Els quatre verbs regeixen la preposició *a*, però cada un té un significat diferent."

  - id: b2-45-008
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["anar al gra", "parlar directament del tema important"]
      - ["treure'n l'entrellat", "arribar a entendre un assumpte complicat"]
      - ["tenir-ho clar", "saber exactament què es vol fer"]
      - ["llegir entre línies", "endevinar allò que no es diu obertament"]
    explanation: "Són expressions habituals quan es parla de feina i d'estudis."

  - id: b2-45-009
    type: inline-choice
    point: regim-a
    lesson: 1
    title: "Un correu del deganat"
    text: "La professora Font es dedica {a|en|de} la història medieval des de fa vint anys. El curs vinent renunciarà {a|de|en} la plaça de coordinadora per accedir {a|en|de} una càtedra. Es tracta {de|a|amb} la seva decisió personal. El préstec de portàtils es fa a secretaria. Us esperem a l'aula 12."
    explanation: "*Dedicar-se*, *renunciar* i *accedir* regeixen *a*; *tractar-se* regeix *de*."

  - id: b2-45-010
    type: fill
    point: regim-a
    lesson: 1
    prompt: "La Fàtima ___ la recerca sobre el canvi climàtic."
    hint: "dedicar-se, present"
    answers: ["es dedica a"]
    wrong_answers:
      - text: "es dedica en"
        why: "*Dedicar-se* regeix *a*, no *en*."
      - text: "es dedica de"
        why: "*Dedicar-se* regeix *a*, no *de*."
    grading: tolerant
    explanation: "«La Fàtima» és tercera persona: *es dedica*, i el verb regeix *a*."

  - id: b2-45-011
    type: fill
    point: regim-de
    lesson: 1
    prompt: "No és una urgència: ___ paperassa de secretaria."
    hint: "tractar-se, present"
    answers: ["es tracta de"]
    wrong_answers:
      - text: "es trata de"
        why: "*Tractar* s'escriu amb *c*. En castellà és «tratar», però en català és *tractar*."
      - text: "tracta de"
        why: "Falta el pronom *es*: el verb és *tractar-se*."
    grading: tolerant
    explanation: "«És qüestió de» paperassa: el verb és pronominal (*es tracta*) i regeix *de*."

  - id: b2-45-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «anar al gra»?"
    answer: "Parlar directament del tema important."
    distractors:
      - text: "Parlar de molts temes sense ordre."
        why: "Això és *divagar*, just el contrari d'anar al gra."
      - text: "Parlar a poc a poc i amb calma."
        why: "El ritme no hi té res a veure: *anar al gra* és parlar del tema important."
    explanation: "*Anar al gra* és deixar els detalls i parlar del tema important."

  - id: b2-45-013
    type: choice
    point: expressions
    lesson: 1
    prompt: "—Portem una hora de reunió i no hem decidit res. —Tens raó: anem ___."
    answer: "al gra"
    distractors:
      - text: "a la palla"
        why: "No existeix aquesta expressió: la forma fixada és *anar al gra*."
      - text: "amb calma"
        why: "*Amb calma* vol dir «a poc a poc»; aquí cal anar directe al tema."
    explanation: "Quan una reunió s'allarga, *anar al gra* és parlar del tema important."

  # ---------- Lliçó 2 ----------
  - id: b2-45-014
    type: fill
    point: regim-a
    lesson: 2
    prompt: "Amb un vuit de mitjana, l'Ibrahim podrà ___ un màster de matemàtiques."
    hint: "accedir, infinitiu"
    answers: ["accedir a"]
    wrong_answers:
      - text: "accedir en"
        why: "*Accedir* regeix *a*, no *en*."
      - text: "accedir de"
        why: "*Accedir* regeix *a*, no *de*."
    grading: tolerant
    explanation: "Darrere de *podrà* va l'infinitiu, i *accedir* regeix *a*."

  - id: b2-45-015
    type: fill
    point: regim-a
    lesson: 2
    prompt: "L'Arnau ___ una càtedra de física a València."
    hint: "aspirar, present"
    answers: ["aspira a"]
    wrong_answers:
      - text: "aspira en"
        why: "*Aspirar* regeix *a*, no *en*."
    grading: tolerant
    explanation: "«L'Arnau» vol aconseguir una càtedra: *aspirar* regeix *a*."

  - id: b2-45-016
    type: fill
    point: regim-a
    lesson: 2
    prompt: "La Carla va haver de ___ la plaça de lectora per motius familiars."
    hint: "renunciar, infinitiu"
    answers: ["renunciar a"]
    wrong_answers:
      - text: "renunciar de"
        why: "*Renunciar* regeix *a*, no *de*."
    grading: tolerant
    explanation: "Darrere de *va haver de* va l'infinitiu, i *renunciar* regeix *a*."

  - id: b2-45-017
    type: fill
    point: regim-de
    lesson: 2
    prompt: "El projecte no pot ___ l'ajuda del departament."
    hint: "prescindir, infinitiu"
    answers: ["prescindir de"]
    wrong_answers:
      - text: "prescindir amb"
        why: "*Prescindir* regeix *de*, no *amb*."
    grading: tolerant
    explanation: "Darrere de *pot* va l'infinitiu: *prescindir*, que regeix *de*."

  - id: b2-45-018
    type: fill
    point: regim-de
    lesson: 2
    prompt: "Ahir no era cap urgència: ___ la beca d'un company."
    hint: "tractar-se, imperfet"
    answers: ["es tractava de"]
    wrong_answers:
      - text: "es tratava de"
        why: "*Tractar* s'escriu amb *c*. En castellà és «tratar», però en català és *tractar*."
    grading: tolerant
    explanation: "«Ahir» demana un passat: l'imperfet de *tractar-se* és *es tractava*, i regeix *de*."

  - id: b2-45-019
    type: order
    point: regim-a
    lesson: 2
    cue: "Digues que en Pau fa dos anys que treballa en recerca mèdica."
    chunks: ["En Pau", "es dedica a", "la recerca mèdica", "des de fa dos anys"]
    extra: ["en"]
    answers:
      - "En Pau es dedica a la recerca mèdica des de fa dos anys."
      - "Des de fa dos anys, en Pau es dedica a la recerca mèdica."
    explanation: "*Dedicar-se* regeix *a*. El complement de temps pot anar al principi o al final."

  - id: b2-45-020
    type: order
    point: regim-de
    lesson: 2
    cue: "Explica que el departament no pot passar sense cap tècnic aquest curs."
    chunks: ["El departament", "no pot prescindir de", "cap tècnic", "aquest curs"]
    extra: ["amb"]
    answers:
      - "El departament no pot prescindir de cap tècnic aquest curs."
      - "Aquest curs, el departament no pot prescindir de cap tècnic."
    explanation: "*Prescindir* regeix *de*: *prescindir de* cap tècnic vol dir no poder passar sense cap."

  - id: b2-45-021
    type: choice
    point: regim-a
    lesson: 2
    prompt: "Tria la frase correcta."
    answer: "La Montse es dedica a la docència des de fa anys."
    distractors:
      - text: "La Montse es dedica en la docència des de fa anys."
        why: "*Dedicar-se* regeix *a*, no *en*."
      - text: "La Montse es dedica de la docència des de fa anys."
        why: "*Dedicar-se* regeix *a*, no *de*."
    explanation: "De les tres, només és correcta la que porta *a*: *dedicar-se* regeix *a*."

  - id: b2-45-022
    type: choice
    point: regim-de
    lesson: 2
    prompt: "No és cap secret: es tracta ___ la reforma del pla d'estudis."
    answer: "de"
    distractors:
      - text: "amb"
        why: "*Tractar-se* regeix *de*, no *amb*."
      - text: "en"
        why: "*Tractar-se* regeix *de*, no *en*."
    explanation: "*Tractar-se* regeix *de*: *es tracta de* la reforma."

  - id: b2-45-023
    type: choice
    point: regim-de
    lesson: 2
    prompt: "El grup de recerca ha hagut de prescindir ___ dos becaris."
    answer: "de"
    distractors:
      - text: "a"
        why: "*Prescindir* regeix *de*, no *a*."
      - text: "amb"
        why: "*Prescindir* regeix *de*, no *amb*."
    explanation: "*Prescindir* regeix *de*, també en passat: *ha hagut de prescindir de* dos becaris."

  - id: b2-45-024
    type: inline-choice
    point: regim-de
    lesson: 2
    title: "Una nota de secretaria"
    text: "Us informem que es tracta {de|a|amb} la revisió de les actes del tribunal. El degà no pot prescindir {de|amb|en} la vostra col·laboració. Qui vulgui renunciar {a|de|en} la seva plaça al seminari, que ho digui abans de divendres. El seminari val tres crèdits. La convocatòria de setembre ja és oberta. Gràcies per dedicar-vos {a|en|de} la facultat."
    explanation: "*Tractar-se* i *prescindir* regeixen *de*; *renunciar* i *dedicar-se* regeixen *a*."

  - id: b2-45-025
    type: fill
    point: expressions
    lesson: 2
    prompt: "Deixem els detalls i anem ___."
    hint: "expressió: parlar directament del tema"
    answers: ["al gra"]
    wrong_answers:
      - text: "a el gra"
        why: "La preposició *a* i l'article *el* es contreuen: *al*."
    grading: tolerant
    explanation: "L'expressió és *anar al gra*: parlar directament del tema important."

  - id: b2-45-026
    type: choice
    point: expressions
    lesson: 2
    prompt: "Què vol dir «tenir-ho clar»?"
    answer: "Saber exactament què es vol fer."
    distractors:
      - text: "Explicar una cosa amb paraules senzilles."
        why: "Això és *explicar-se bé*; *tenir-ho clar* és saber què es vol."
      - text: "Tenir una lletra clara i entenedora."
        why: "Aquest és el sentit literal de *clar*; l'expressió parla de decisions."
    explanation: "*Tenir-ho clar* és saber exactament què es vol fer en un assumpte."

  # ---------- Lliçó 3 ----------
  - id: b2-45-027
    type: choice
    point: regim-altres
    lesson: 3
    prompt: "El projecte ___ tres investigadors i una tècnica de laboratori."
    answer: "compta amb"
    distractors:
      - text: "compta en"
        why: "*Comptar* regeix *amb*, no *en*."
      - text: "compta de"
        why: "*Comptar* regeix *amb*, no *de*."
    explanation: "Quan vol dir «disposar de», *comptar* regeix *amb*: el projecte *compta amb* tres investigadors."

  - id: b2-45-028
    type: choice
    point: regim-altres
    lesson: 3
    prompt: "La prova final ___ tres preguntes teòriques i un cas pràctic."
    answer: "consisteix en"
    distractors:
      - text: "consisteix de"
        why: "*Consistir* regeix *en*, no *de*."
      - text: "consisteix amb"
        why: "*Consistir* regeix *en*, no *amb*."
    explanation: "*Consistir* regeix *en* davant d'un nom: la prova *consisteix en* tres preguntes."

  - id: b2-45-029
    type: choice
    point: regim-altres
    lesson: 3
    prompt: "El Wei ___ la intel·ligència artificial des de l'institut."
    answer: "s'interessa per"
    distractors:
      - text: "s'interessa en"
        why: "En castellà es pot dir «interesarse en», però en català *interessar-se* regeix *per*."
      - text: "s'interessa de"
        why: "*Interessar-se* regeix *per*, no *de*."
    explanation: "*Interessar-se* regeix sempre *per*: el Wei *s'interessa per* la intel·ligència artificial."

  - id: b2-45-030
    type: fill
    point: regim-altres
    lesson: 3
    prompt: "El tutor ___ revisar la bibliografia una vegada més."
    hint: "insistir, present + preposició (n'hi ha dues de correctes)"
    answers: ["insisteix a", "insisteix en"]
    wrong_answers:
      - text: "insisteix de"
        why: "*Insistir* admet *a* i *en*, però no *de*."
    grading: tolerant
    explanation: "*Insistir* admet dues preposicions: *insisteix a* revisar i *insisteix en* revisar són totes dues correctes."

