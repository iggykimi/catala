  # ---------- Lliçó 5 ----------
  - id: b2-45-053
    type: reading
    point: comprensio
    lesson: 5
    title: "La beca de la Carla"
    text: |
      La Carla va acabar el grau de biologia a Girona fa tres anys i de seguida ho va tenir clar: es dedicaria a la recerca. Va demanar plaça al doctorat de Barcelona i, amb una nota excel·lent, va accedir a una beca de quatre anys. La seva tesi estudia la genètica de les plantes medicinals, i el seu grup compta amb ella per a tots els experiments importants.

      Al principi, però, no tot va ser fàcil. La hipòtesi inicial no es confirmava i la Carla passava les tardes a la biblioteca sense treure'n l'entrellat. El tutor insistia que calia canviar de mètode, però ella s'interessava més per repetir les proves que per començar de zero. «Ves al gra», li deia el tutor: «mira els resultats i llegeix entre línies».

      Finalment, la Carla va renunciar a la primera hipòtesi i va dissenyar un experiment nou amb mostres de tot Catalunya. L'experiment consisteix en tres anàlisis de laboratori. Aquest cop els resultats van ser clars: va publicar dos articles científics i va presentar la feina en un congrés a Tarragona i en una conferència a Vic. Ara aspira a defensar la tesi al juny davant d'un tribunal de tres professors.

      Si tot va bé, després de la defensa farà una estada en un laboratori de França. «Abans somiava que publicaria un llibre —diu rient—; ara somio que trobaré feina». El grup no pot prescindir-ne: de moment, ningú més sap fer anar les màquines noves.
    questions:
      - prompt: "Per què va aconseguir la beca, segons el text?"
        answer: "Perquè tenia una nota excel·lent."
        distractors:
          - text: "Perquè el seu grup comptava amb ella."
            why: "El grup compta amb ella, però la beca la va aconseguir per la nota."
          - text: "Perquè ja havia publicat dos articles."
            why: "Els articles els va publicar després, amb els nous resultats."
      - prompt: "Quin problema tenia la Carla al principi?"
        answer: "Els primers experiments no confirmaven la seva idea inicial."
        distractors:
          - text: "No tenia beca per continuar la tesi."
            why: "Tenia una beca de quatre anys."
          - text: "El tutor no la deixava repetir les proves."
            why: "El text no diu això: ella repetia les proves tot i el consell del tutor."
      - prompt: "Què va fer la Carla amb la primera hipòtesi?"
        answer: "La va abandonar i en va provar una de nova."
        distractors:
          - text: "La va defensar davant del tribunal."
            why: "La defensa és al juny, amb els nous resultats."
          - text: "La va publicar en dos articles."
            why: "Els articles presenten els resultats nous, no la primera hipòtesi."
      - prompt: "Què passarà si tot va bé?"
        answer: "Defensarà la tesi al juny i després anirà a França."
        distractors:
          - text: "Publicarà un llibre sobre les plantes."
            why: "Publicar un llibre era un somni d'abans, no un pla."
          - text: "Deixarà el grup perquè ja no la necessiten."
            why: "Al contrari: el grup no pot prescindir-ne."
    explanation: "El text explica com la Carla va superar els problemes inicials de la tesi i ara es prepara per defensar-la."

