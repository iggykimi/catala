  - id: b1-30-066
    type: reading
    point: comprensio
    lesson: 5
    title: "El primer dia de la Núria"
    text: |
      La Núria comença avui la feina nova en una oficina de Sabadell. El primer que fa és encendre l'ordinador i mirar la pantalla: en Pau, el company del despatx del costat, l'ajuda a entrar a la xarxa i a triar una contrasenya segura. Després l'acompanya a la recepció i li presenta la cap.

      La cap li ensenya el programa de factures. La Núria ha de revisar tres factures pendents, descarregar dos documents de l'arxiu i enviar un correu amb el contracte adjunt. També comprova els venciments de la setmana. Al principi escriu massa de pressa i s'equivoca amb el teclat, però en Pau li diu que no passa res.

      A les onze surten a esmorzar. En Pau li explica que aquesta setmana va de corcoll: té un informe per acabar i cada dia hi ha una reunió a la tarda. La Núria somriu: li agrada començar amb energia.

      Abans de plegar, la Núria desa els documents a la carpeta correcta i apaga la impressora. En Pau li promet que demà li ensenyarà a organitzar els arxius per ordre alfabètic. «A poc a poc», li diu.
    questions:
      - prompt: "On és la feina nova de la Núria?"
        answer: "Treballa en una oficina de Sabadell."
        distractors:
          - text: "A la recepció de l'empresa."
            why: "La Núria només passa per la recepció; treballa en una oficina."
          - text: "Al despatx d'en Pau."
            why: "El despatx és el d'en Pau, al costat del seu."
      - prompt: "Què l'ajuda a fer en Pau al matí?"
        answer: "Accedir a la xarxa i escollir una contrasenya."
        distractors:
          - text: "Revisar tres factures pendents."
            why: "Això ho ha de fer la Núria sola, amb el programa."
          - text: "Escriure un informe."
            why: "L'informe l'ha d'acabar en Pau, no la Núria."
      - prompt: "Què ha de fer la Núria el primer dia?"
        answer: "Revisar factures, descarregar documents i enviar un correu."
        distractors:
          - text: "Enviar un informe amb el contracte adjunt."
            why: "El correu porta el contracte, però l'informe és cosa d'en Pau."
          - text: "Organitzar els arxius per ordre alfabètic."
            why: "Això li ensenyarà en Pau demà."
      - prompt: "Què vol dir que en Pau «va de corcoll»?"
        answer: "Que té molta feina i va amb presses."
        distractors:
          - text: "Que marxa de l'empresa."
            why: "En Pau no marxa: té un informe per acabar."
          - text: "Que comença a treballar de debò."
            why: "Això seria *posar-se a la feina*, una altra expressió."
    explanation: "La Núria comença a treballar en una oficina: en Pau l'ajuda i ella aprèn les primeres tasques."
