id: b2-56
level: B2
title: "Locucions prepositives"
summary: "Les locucions de causa, oposició, substitució i temps en el context del transport i la mobilitat."
vocabulary_theme: "Transport, mobilitat i urbanisme"
points:
  - id: causa
    title: "La causa: a causa de, gràcies a, arran de i amb motiu de"
    refs:
      - label: "GEIEC: Les preposicions i les locucions prepositives"
        url: "https://geiec.iec.cat"
  - id: substitucio-contrast
    title: "La substitució, el suport i l'oposició"
    refs:
      - label: "GEIEC: Les preposicions i les locucions prepositives"
        url: "https://geiec.iec.cat"
  - id: temps-partida
    title: "El temps: a partir de i a/en"
    refs:
      - label: "GEIEC: Les preposicions i les locucions prepositives"
        url: "https://geiec.iec.cat"
  - id: compte-castella
    title: "Compte amb el castellà: malgrat i en lloc de"
    refs:
      - label: "Optimot: malgrat / a pesar de"
        url: "https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html"
  - id: expressions
    title: "Expressions de moviment"
  - id: comprensio
    title: "Llegir i entendre"
lessons:
  - title: "Presentació: la causa i la substitució"
  - title: "Practicar la causa i la substitució"
  - title: "El temps i les interferències"
  - title: "Produir: reescriure frases"
  - title: "Repàs i lectura"
vocabulary:
  - word: "l'estació"
    definition: "Edifici i instal·lacions on s'agafen trens, autobusos o metro."
    example: "L'estació de Sants és la més gran de Barcelona."
  - word: "l'andana"
    definition: "Vora llarga al costat de la via on els passatgers esperen el tren."
    example: "El tren de Vic surt de l'andana 4."
  - word: "el bitllet"
    definition: "Paper o targeta que dona dret a viatjar."
    example: "He comprat el bitllet de tornada per internet."
  - word: "l'abonament"
    definition: "Bitllet que serveix per a molts viatges durant un temps."
    example: "Amb l'abonament mensual, el metro surt més barat."
  - word: "el transbord"
    definition: "Canvi d'un tren o d'una línia a una altra durant el viatge."
    example: "Per anar a l'aeroport has de fer transbord a Torrassa."
  - word: "l'enllaç"
    definition: "Combinació de dos transports que cal agafar seguits per arribar a una destinació."
    example: "Si perds el primer tren, perds l'enllaç."
  - word: "la parada"
    definition: "Lloc marcat on l'autobús o el tramvia s'atura."
    example: "La parada del bus és davant de la farmàcia."
  - word: "el tramvia"
    definition: "Tren curt que circula pels carrers de la ciutat."
    example: "El tramvia nou arriba fins al barri del port."
  - word: "l'aeroport"
    definition: "Lloc amb pistes on surten i arriben els avions."
    example: "El tren de l'aeroport surt cada mitja hora."
  - word: "el carril bici"
    definition: "Part del carrer reservada a les bicicletes."
    example: "El carril bici nou arriba fins a la platja."
  - word: "la vorera"
    definition: "Part del carrer on caminen els vianants."
    example: "Les voreres d'aquest barri són molt estretes."
  - word: "el pas de vianants"
    definition: "Franja de ratlles blanques per on els vianants travessen el carrer."
    example: "Passa sempre pel pas de vianants."
  - word: "el semàfor"
    definition: "Aparell amb llums de colors que regula el pas."
    example: "El semàfor del cantó no funciona des d'ahir."
  - word: "la rotonda"
    definition: "Plaça rodona on els vehicles giren en el mateix sentit."
    example: "A la rotonda, deixa passar els que ja hi són a dins."
  - word: "l'embús"
    definition: "Acumulació de vehicles que no poden avançar."
    example: "Cada matí hi ha un embús a l'entrada de la ciutat."
  - word: "l'hora punta"
    definition: "Moment del dia amb més trànsit o més passatgers."
    example: "A l'hora punta, el metro va ple."
  - word: "el peatge"
    definition: "Diners que es paguen per passar per una autopista o un túnel."
    example: "El peatge del túnel costa quatre euros."
  - word: "l'autopista"
    definition: "Carretera ampla i ràpida amb diversos carrils per sentit."
    example: "L'autopista de Girona té molt de trànsit els divendres."
  - word: "el túnel"
    definition: "Pas subterrani que travessa una muntanya o passa per sota d'una ciutat."
    example: "El túnel nou escurça el trajecte deu minuts."
  - word: "el pàrquing"
    definition: "Lloc on es deixen els cotxes."
    example: "El pàrquing de l'hospital sempre és ple."
  - word: "la zona blava"
    definition: "Carrers on cal pagar per aparcar durant unes hores."
    example: "A la zona blava pots aparcar dues hores com a màxim."
  - word: "la multa"
    definition: "Sanció amb diners per una infracció."
    example: "Li van posar una multa per aparcar al pas de vianants."
  - word: "el vianant, la viananta"
    definition: "Persona que va a peu pel carrer."
    example: "Els vianants tenen prioritat al pas de vianants."
  - word: "el conductor, la conductora"
    definition: "Persona que porta un vehicle."
    example: "La conductora del bus ens va avisar de la parada."
  - word: "el ciclista"
    definition: "Persona que va amb bicicleta."
    example: "Els ciclistes han de respectar els semàfors."
  - word: "el passatger, la passatgera"
    definition: "Persona que va en un vehicle que condueix una altra persona."
    example: "Els passatgers del darrer vagó no van sentir l'avís."
  - word: "la línia"
    definition: "Recorregut fix d'un transport públic."
    example: "La línia 3 arriba fins a Trinitat Nova."
  - word: "el trajecte"
    definition: "Camí que es fa d'un lloc a un altre."
    example: "El trajecte de casa a la feina és de mitja hora."
  - word: "el retard"
    definition: "Arribada més tard de l'hora prevista."
    example: "El tren porta deu minuts de retard."
  - word: "la freqüència"
    definition: "Temps que passa entre un vehicle i el següent."
    example: "La freqüència del tramvia és de vuit minuts."
  - word: "el barri"
    definition: "Part d'una ciutat amb un nom i una vida propis."
    example: "Al barri de Gràcia hi ha moltes places petites."
  - word: "la plaça"
    definition: "Espai obert envoltat de cases, sovint amb bancs i arbres."
    example: "Els veïns es troben a la plaça cada tarda."
  - word: "aparcar"
    definition: "Deixar el cotxe en un lloc fins que es torna a agafar."
    example: "A l'Eixample és difícil aparcar al vespre."
items:
  # ---------- Lliçó 1 ----------
  - id: b2-56-001
    type: choice
    point: causa
    lesson: 1
    prompt: "___ la boira espessa, l'autobús de l'aeroport ha arribat amb mitja hora de retard."
    answer: "A causa de"
    distractors:
      - text: "Malgrat"
        why: "*Malgrat* indica que la boira no ha impedit res. Aquí la boira és la causa del retard: *a causa de*."
      - text: "En lloc de"
        why: "*En lloc de* indica substitució. Aquí no se substitueix res: la boira és la causa del retard."
    explanation: "La boira és la causa d'un fet negatiu, el retard: *a causa de* la boira."

  - id: b2-56-002
    type: choice
    point: causa
    lesson: 1
    prompt: "___ la línia nova de tramvia, la Carla arriba a la feina deu minuts abans."
    answer: "Gràcies a"
    distractors:
      - text: "Malgrat"
        why: "*Malgrat* indica oposició. Aquí la línia nova és la causa d'un fet positiu: *gràcies a*."
      - text: "En comptes de"
        why: "*En comptes de* indica substitució. Aquí no se substitueix res: la línia és la causa de l'avantatge."
    explanation: "La línia nova és la causa d'un fet positiu, arribar abans: *gràcies a*."

  - id: b2-56-003
    type: choice
    point: causa
    lesson: 1
    prompt: "___ l'accident del túnel de Vallvidrera, el trànsit ha quedat tallat durant dues hores."
    answer: "Arran de"
    distractors:
      - text: "Arrel de"
        why: "*Arrel de* no existeix com a locució. La forma correcta és *arran de*."
      - text: "En lloc de"
        why: "*En lloc de* indica substitució. Aquí el tall és la conseqüència de l'accident: *arran de*."
    explanation: "*Arran de* introdueix el fet que provoca una conseqüència: el tall ve després de l'accident."

  - id: b2-56-004
    type: choice
    point: causa
    lesson: 1
    prompt: "___ la festa major, el metro funcionarà tota la nit de dissabte."
    answer: "Amb motiu de"
    distractors:
      - text: "En motiu de"
        why: "La locució és *amb motiu de*, amb la preposició *amb*. *En motiu de* no existeix."
      - text: "Malgrat"
        why: "*Malgrat* indica oposició. Aquí la festa és l'ocasió del servei especial: *amb motiu de*."
    explanation: "*Amb motiu de* presenta l'ocasió d'un fet, sovint en avisos formals: la festa major."

  - id: b2-56-005
    type: choice
    point: substitucio-contrast
    lesson: 1
    prompt: "El Pau va agafar el tren ___ la furgoneta, perquè no volia aparcar al centre."
    answer: "en lloc de"
    distractors:
      - text: "en lloc a"
        why: "La locució acaba amb *de*: *en lloc de*. *En lloc a* no existeix."
      - text: "malgrat"
        why: "*Malgrat* indica oposició. Aquí el tren substitueix el cotxe: *en lloc de*."
    explanation: "El tren substitueix el cotxe: *en lloc de*. El context («no volia aparcar») ho confirma."

  - id: b2-56-006
    type: choice
    point: substitucio-contrast
    lesson: 1
    prompt: "___ cotxe, la Núria hi va anar amb bici pel carril bici nou."
    answer: "En comptes del"
    distractors:
      - text: "En compte del"
        why: "La locució va en plural: *en comptes de* (amb contracció, *del*)."
      - text: "A causa del"
        why: "*A causa de* indica causa. Aquí la bici substitueix el cotxe: *en comptes de*."
    explanation: "La bici substitueix el cotxe: *en comptes de* (amb contracció, *del*)."

  - id: b2-56-007
    type: choice
    point: substitucio-contrast
    lesson: 1
    prompt: "___ la pluja forta, l'autobús ha arribat puntual a l'estació."
    answer: "Malgrat"
    distractors:
      - text: "Malgrat de"
        why: "*Malgrat* no porta preposició davant d'un nom: *malgrat la pluja*. *Malgrat de* no existeix."
      - text: "A causa de"
        why: "*A causa de* indica la causa d'un fet negatiu. Aquí el bus arriba puntual, tot i la pluja: *malgrat*."
    explanation: "La pluja no ha impedit la puntualitat: és una oposició, *malgrat la pluja*."

  - id: b2-56-008
    type: choice
    point: substitucio-contrast
    lesson: 1
    prompt: "Què vol dir «Van acabar les obres a costa de moltes hores extres»?"
    answer: "Van acabar les obres gràcies a un gran esforç."
    distractors:
      - text: "Van acabar les obres sense gaire esforç."
        why: "És el contrari: *a costa de* indica que ha calgut un esforç o un sacrifici."
      - text: "Van pagar les obres amb moltes hores extres."
        why: "No és un pagament literal: *a costa de* indica l'esforç que ha calgut."
    explanation: "*A costa de* indica l'esforç o el sacrifici que ha calgut per aconseguir una cosa."

  - id: b2-56-009
    type: match
    point: causa
    lesson: 1
    instruction: "Relaciona cada locució amb el seu valor."
    pairs:
      - ["a causa de", "causa d'un fet negatiu"]
      - ["gràcies a", "causa d'un fet positiu"]
      - ["arran de", "conseqüència d'un fet anterior"]
      - ["amb motiu de", "ocasió d'un acte o servei"]
    explanation: "Les quatre locucions introdueixen una causa: *a causa de* i *gràcies a* segons si el fet és negatiu o positiu, *arran de* per a la conseqüència i *amb motiu de* per a l'ocasió."

  - id: b2-56-010
    type: match
    point: expressions
    lesson: 1
    instruction: "Relaciona cada expressió amb el seu significat."
    pairs:
      - ["a peu dret", "sense seure, dret durant el viatge"]
      - ["de bat a bat", "completament obert"]
      - ["a tot drap", "a tota velocitat"]
      - ["perdre el tren", "deixar escapar una oportunitat (repàs)"]
    explanation: "Són expressions de moviment: *a peu dret* i *a tot drap* parlen del viatge, *de bat a bat* d'obrir del tot i *perdre el tren* d'una oportunitat."

  - id: b2-56-011
    type: inline-choice
    point: causa
    lesson: 1
    title: "Avís de l'ajuntament"
    text: "{Amb motiu de|En motiu de|A motiu de} les obres del carrer Major, el bus canviarà de recorregut. {A causa dels|A causa de els|Malgrat els} talls, hi pot haver retards. {Gràcies a|Gràcies de|En gràcies a} la col·laboració dels veïns, les molèsties seran mínimes. Us demanem que agafeu el metro {en lloc de|en lloc a|en compte de} l'autobús."
    explanation: "En un avís formal, l'ocasió és *amb motiu de*. Els retards venen *a causa dels* talls (amb contracció: *dels*). La col·laboració és positiva: *gràcies a*. El metro substitueix el bus: *en lloc de*."

  - id: b2-56-012
    type: choice
    point: expressions
    lesson: 1
    prompt: "Què vol dir «El tren anava a tot drap»?"
    answer: "El tren anava a tota velocitat."
    distractors:
      - text: "El tren anava ple de gom a gom."
        why: "Això parla de gent, no de velocitat: *a tot drap* indica que anava molt de pressa."
      - text: "El tren feia molt de soroll."
        why: "El soroll no hi té res a veure: *a tot drap* indica la velocitat."
    explanation: "*A tot drap* vol dir a tota velocitat, aprofitant tota la força: el tren anava molt de pressa."

  - id: b2-56-013
    type: order
    point: causa
    lesson: 1
    cue: "Explica que, per la vaga, els trens van amb retard."
    chunks: ["A causa de la vaga,", "els trens", "van", "amb retard"]
    extra: ["Malgrat"]
    answers:
      - "A causa de la vaga, els trens van amb retard."
      - "Els trens van amb retard a causa de la vaga."
    explanation: "La vaga és la causa del retard: *a causa de*. La locució pot anar al principi (amb coma) o al final."

  # ---------- Lliçó 2 ----------
  - id: b2-56-014
    type: fill
    point: causa
    lesson: 2
    prompt: "___ la vaga de trens, vam haver d'agafar el cotxe."
    hint: "locució de causa: A CAUSA DE"
    answers: ["A causa de"]
    wrong_answers:
      - text: "Malgrat"
        why: "*Malgrat* indica oposició. Aquí la vaga és la causa: *a causa de*."
    grading: tolerant
    explanation: "La vaga és la causa d'un fet negatiu, agafar el cotxe: *a causa de*."

  - id: b2-56-015
    type: fill
    point: causa
    lesson: 2
    prompt: "___ la bici elèctrica nova, l'Ibrahim va a la feina molt més de pressa."
    hint: "locució de causa positiva: GRÀCIES A"
    answers: ["Gràcies a"]
    wrong_answers:
      - text: "Gràcies de"
        why: "La locució és *gràcies a*, amb la preposició *a*."
    grading: tolerant
    explanation: "La bici nova és la causa d'un fet positiu, anar més de pressa: *gràcies a*."

  - id: b2-56-016
    type: fill
    point: causa
    lesson: 2
    prompt: "___ l'avaria del semàfor, es va formar un embús llarguíssim."
    hint: "locució de conseqüència: ARRAN DE"
    answers: ["Arran de"]
    wrong_answers:
      - text: "Arrel de"
        why: "*Arrel de* no existeix. La locució és *arran de*, en un sol mot."
    grading: tolerant
    explanation: "L'embús és la conseqüència de l'avaria: *arran de*."

  - id: b2-56-017
    type: fill
    point: causa
    lesson: 2
    prompt: "___ les festes de Nadal, els busos nocturns seran gratuïts."
    hint: "locució d'ocasió: AMB MOTIU DE"
    answers: ["Amb motiu de"]
    wrong_answers:
      - text: "En motiu de"
        why: "La locució és *amb motiu de*, amb la preposició *amb*."
    grading: tolerant
    explanation: "Les festes són l'ocasió del servei gratuït: *amb motiu de*."

  - id: b2-56-018
    type: fill
    point: substitucio-contrast
    lesson: 2
    prompt: "La Montse va tornar a casa a peu ___ la furgoneta."
    hint: "locució de substitució: EN LLOC DE"
    answers: ["en lloc de"]
    wrong_answers:
      - text: "en lloc a"
        why: "La locució acaba amb *de*: *en lloc de*."
      - text: "en vez de"
        why: "*En vez de* és castellà. La substitució és *en lloc de*."
    grading: tolerant
    explanation: "Tornar a peu substitueix la furgoneta: *en lloc de*."

  - id: b2-56-019
    type: fill
    point: substitucio-contrast
    lesson: 2
    prompt: "___ la moto, ara el Wei va a la universitat amb tramvia."
    hint: "locució de substitució: EN COMPTES DE"
    answers: ["En comptes de"]
    wrong_answers:
      - text: "En compte de"
        why: "La locució va en plural: *en comptes de*."
    grading: tolerant
    explanation: "El tramvia substitueix la moto: *en comptes de*."

  - id: b2-56-020
    type: fill
    point: substitucio-contrast
    lesson: 2
    prompt: "___ el retard del primer tren, vam arribar a l'hora a la reunió."
    hint: "locució d'oposició: MALGRAT"
    answers: ["Malgrat"]
    wrong_answers:
      - text: "Malgrat de"
        why: "*Malgrat* no porta preposició davant d'un nom: *malgrat el retard*."
    grading: tolerant
    explanation: "El retard no va impedir l'arribada: és una oposició, *malgrat*."

  - id: b2-56-021
    type: choice
    point: substitucio-contrast
    lesson: 2
    prompt: "Els ciclistes del barri van recollir signatures ___ la nova zona de vianants."
    answer: "a favor de"
    distractors:
      - text: "a favor a"
        why: "La locució acaba amb *de*: *a favor de*. *A favor a* no existeix."
      - text: "a costa de"
        why: "*A costa de* indica un esforç o un sacrifici. Aquí els ciclistes hi donen suport: *a favor de*."
    explanation: "Recollir signatures és donar suport a una proposta: *a favor de* la nova zona."

  - id: b2-56-022
    type: choice
    point: substitucio-contrast
    lesson: 2
    prompt: "Van acabar el pont nou a temps ___ moltes nits sense dormir."
    answer: "a costa de"
    distractors:
      - text: "a costa que"
        why: "La locució acaba amb *de*: *a costa de*. *A costa que* no existeix."
      - text: "a favor de"
        why: "*A favor de* indica suport. Aquí no hi ha suport, sinó l'esforç que ha calgut: *a costa de*."
    explanation: "Acabar a temps va demanar un gran esforç: *a costa de* moltes nits sense dormir."

  - id: b2-56-023
    type: order
    point: substitucio-contrast
    lesson: 2
    cue: "Digues que la Laia va agafar la bici i no el cotxe."
    chunks: ["La Laia", "va agafar", "la bici", "en lloc del cotxe"]
    extra: ["en vez del cotxe"]
    answers:
      - "La Laia va agafar la bici en lloc del cotxe."
      - "En lloc del cotxe, la Laia va agafar la bici."
    explanation: "La bici substitueix el cotxe: *en lloc de* + nom, amb contracció (*del*)."

  - id: b2-56-024
    type: order
    point: substitucio-contrast
    lesson: 2
    cue: "Digues que, tot i la boira, el pont va quedar obert."
    chunks: ["Malgrat", "la boira,", "el pont", "va quedar", "obert"]
    extra: ["A pesar de"]
    answers:
      - "Malgrat la boira, el pont va quedar obert."
      - "El pont va quedar obert malgrat la boira."
    explanation: "*Malgrat* + nom indica oposició: la boira no va impedir que el pont quedés obert."

  - id: b2-56-025
    type: choice
    point: expressions
    lesson: 2
    prompt: "—Vau poder seure al tren? —No, vam fer tot el trajecte ___."
    answer: "a peu dret"
    distractors:
      - text: "de bat a bat"
        why: "*De bat a bat* vol dir completament obert. Aquí parleu de viatjar sense seure: *a peu dret*."
      - text: "a tot drap"
        why: "*A tot drap* vol dir a tota velocitat. Aquí parleu de viatjar sense seure: *a peu dret*."
    explanation: "Viatjar sense seure, dret tot el trajecte, és fer-lo *a peu dret*."

  - id: b2-56-026
    type: fill
    point: expressions
    lesson: 2
    prompt: "Quan el metro arriba a l'estació, les portes s'obren ___."
    hint: "expressió: completament, de dalt a baix"
    answers: ["de bat a bat"]
    wrong_answers:
      - text: "a tot drap"
        why: "*A tot drap* indica velocitat. Les portes s'obren del tot: *de bat a bat*."
    grading: tolerant
    explanation: "Obrir-se del tot, sense deixar res tancat: *de bat a bat*."

  - id: b2-56-027
    type: inline-choice
    point: substitucio-contrast
    lesson: 2
    title: "Obres a la plaça"
    text: "L'ajuntament vol una plaça sense cotxes. Molts veïns estan {a favor de la plaça|en contra de la plaça|a favor a la plaça}, però els botiguers hi estan en contra. Proposen, {en comptes de|en compte de|en comptes a} tancar la plaça, limitar el trànsit a les nits. {Malgrat|Malgrat de|A pesar de} les protestes, les obres començaran al gener. Els veïns, {en lloc de|en lloc a|en vez de} queixar-se, han proposat un calendari d'obres per fases."
    explanation: "Els veïns hi donen suport: *a favor de*. La substitució és *en comptes de* (en plural) i *en lloc de*. L'oposició és *malgrat* (sense *de*): *a pesar de* és un calc de «a pesar de»."

  # ---------- Lliçó 3 ----------
  - id: b2-56-028
    type: choice
    point: temps-partida
    lesson: 3
    prompt: "___ dilluns, el bus de l'aeroport passarà cada deu minuts."
    answer: "A partir de"
    distractors:
      - text: "A partir a"
