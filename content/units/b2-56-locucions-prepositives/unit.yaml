  # ---------- Lliçó 5 ----------
  - id: b2-56-054
    type: reading
    point: comprensio
    lesson: 5
    title: "Un barri sense cotxes"
    text: |
      Fa dos anys, els veïns del barri de Sant Pere van demanar a l'ajuntament que tanqués el carrer Major als cotxes. Arran d'aquella petició, el consistori va posar en marxa una prova de sis mesos: només els autobusos, les bicicletes i els vianants podien passar pel centre. Amb motiu de la prova, es van instal·lar bancs nous, es va pintar un carril bici, es van eixamplar les voreres i es va obrir una parada de tramvia a la plaça.

      Al principi hi va haver queixes. A causa de les obres, els comerciants van perdre clients durant les primeres setmanes i alguns van amenaçar de tancar. Malgrat aquest mal començament, l'ajuntament no va retirar el projecte. Gràcies a una campanya d'informació i a diversos descomptes en l'abonament mensual, els veïns van començar a deixar el cotxe a casa.

      En lloc del cotxe, ara molts agafen el tramvia o van a peu. La Laia, que viu al carrer Nou, explica que abans trigava vint minuts a aparcar i ara arriba a la feina en un quart d'hora caminant. El seu veí, en Jordi, reconeix que al principi hi estava en contra, però que ara hi està a favor: «En aquell moment no m'ho creia, però el barri ha guanyat molt», diu.

      A partir del gener, la prova es convertirà en definitiva. El consistori calcula que el trànsit ha baixat un 30 % i que la contaminació s'ha reduït a la meitat. Tot i això, encara cal resoldre un problema: a l'hora punta, el tramvia va tan ple que molts passatgers han de fer el trajecte a peu dret.
    questions:
      - prompt: "Què va provocar la prova del carrer Major?"
        answer: "Una petició dels veïns per tancar el carrer als cotxes."
        distractors:
          - text: "Les queixes dels comerciants per les obres."
            why: "Els comerciants es van queixar després, quan van començar les obres."
          - text: "Una campanya per vendre abonaments mensuals."
            why: "La campanya va venir després, per animar els veïns a deixar el cotxe."
      - prompt: "Per què van protestar els comerciants al principi?"
        answer: "Perquè les obres els van fer perdre clients."
        distractors:
          - text: "Perquè volien tancar el carrer per sempre."
            why: "Tancar el carrer ho van demanar els veïns; els comerciants van perdre clients."
          - text: "Perquè el tramvia no arribava a la plaça."
            why: "Amb la prova es va obrir una parada de tramvia a la plaça."
      - prompt: "Què diu en Jordi del projecte?"
        answer: "Que abans hi estava en contra i ara hi està a favor."
        distractors:
          - text: "Que encara hi està en contra."
            why: "Ara hi està a favor: «el barri ha guanyat molt»."
          - text: "Que triga més a arribar a la feina."
            why: "És la Laia qui explica com arriba a la feina: en un quart d'hora caminant."
      - prompt: "Quin problema queda per resoldre?"
        answer: "Que el tramvia va massa ple a l'hora punta."
        distractors:
          - text: "Que el trànsit no ha baixat gens."
            why: "El trànsit ha baixat un 30 %."
          - text: "Que els veïns no fan servir l'abonament."
            why: "Els descomptes en l'abonament van ajudar; el problema és el tramvia ple."
    explanation: "El text explica com una prova de tancar un carrer als cotxes es convertirà en definitiva."

